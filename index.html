<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exprexa Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Installs to the home screen on Android and iPhone. One manifest and
     one link, written here and never changed by script — an earlier build
     swapped this href at runtime to choose between a worker and an admin
     manifest, which cannot work: the browser has already begun fetching
     whatever the HTML said before any script runs, and it does not read it
     again. Every install got the wrong one.
     There is nothing to choose now. The plain address IS the worker
     portal, so the only manifest is the workers', and the admin app at
     #admin is reached in a browser rather than from an icon. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="My Tasks">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<script>
// Kept as a safety net, not as the mechanism: anything that arrives at
// "?worker" — an old installed icon, a link someone pasted — is turned
// into "#worker" before the router looks, with no reload to watch.
(function(){
  // Anything arriving with ?worker or ?admin — an icon installed by an
  // older build, a link someone pasted — is turned into the matching hash
  // before the router looks, with no reload to watch.
  if(!location.hash && /^\?(worker|admin)(?:[=&]|$)/.test(location.search)){
    var asHash = '#' + location.search.slice(1);
    try{ history.replaceState(null, '', location.pathname + asHash); }
    catch(e){ location.hash = asHash.slice(1); }
  }
})();
</script>
<style>
  :root{
    --ink:#14213D; --ink-2:#1D2E52; --paper:#EEF1F6; --card:#FFFFFF;
    --amber:#F2A93B; --amber-dark:#C97F12; --green:#1F9D6B; --red:#D64545;
    --text:#1B2333; --muted:#67708A; --line:#DCE1EA; --radius:14px;
    --gold:#E3B341; --silver:#A9B3C4; --bronze:#C88A4E;
    --olive:#4B5320; --olive-dark:#3A4019; --khaki:#C3B091; --khaki-dark:#9C8B5E; --tan-paper:#F1EDDF;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; min-height:100dvh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  .app{max-width:680px; margin:0 auto; min-height:100vh; min-height:100dvh; background:var(--paper); display:flex; flex-direction:column;}
  .topbar{background:var(--ink); color:#fff; padding:14px 16px 12px; position:relative; flex-shrink:0;}
  .brand{display:flex; align-items:baseline; gap:10px; position:relative; z-index:1;}
  .brand .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px;
    letter-spacing:.01em; text-transform:uppercase;}
  .brand .tag{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--amber);
    letter-spacing:0.08em; text-transform:uppercase; border:1px solid rgba(242,169,59,0.5);
    padding:1px 6px; border-radius:4px;}
  /* Second line: who is signed in, what they are, and which build — the
     same furniture as the forwarding board so the two read as one system
     rather than two apps that happen to share a colour. */
  .subline{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    font-size:11.5px; color:#9FAAC6; margin-top:7px; position:relative; z-index:1;}
  .subline .who{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .lvl-badge{font-size:8.5px; font-weight:700; letter-spacing:.4px; padding:1px 6px;
    border-radius:4px; background:rgba(255,255,255,.14); color:#CDD6E8;}
  #refresh-btn{color:#9FAAC6; font-size:15px; cursor:pointer; line-height:1;
    display:inline-block; transition:color .15s;}
  #refresh-btn:active{color:var(--amber);}
  #refresh-btn.spinning{color:var(--amber); animation:spin .7s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ #refresh-btn.spinning{animation:none; opacity:.5;} }

  .tabs{display:flex; flex-wrap:wrap; background:var(--ink-2); position:relative; z-index:1; flex-shrink:0;}
  .tab{flex:1 1 auto; min-width:70px; padding:11px 6px; text-align:center; font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:12px; color:#A9B3CE; cursor:pointer; border-bottom:3px solid transparent;
    transition:color .15s, border-color .15s; user-select:none; white-space:nowrap; position:relative;}
  .tab.active{color:#fff; border-bottom-color:var(--amber);}
  .tab .dot{
    position:absolute; top:6px; right:10px; width:7px; height:7px; border-radius:50%; background:var(--red);
  }
  @media (max-width:480px){
    .topbar{padding:12px 14px 10px;}
    .brand .name{font-size:13px;}
    .subline{font-size:11px; gap:8px;}
    .tab{font-size:10.5px; padding:9px 4px; min-width:33.333%; flex:1 1 33.333%; white-space:normal; line-height:1.25;}
  }

  .content{flex:1; padding:20px 16px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  .card{background:var(--card); border-radius:var(--radius); padding:18px; border:1px solid var(--line); margin-bottom:14px;}
  .card h3{margin:0 0 14px; font-family:'Space Grotesk',sans-serif; font-size:15px; display:flex; align-items:center; gap:8px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber-dark); margin-bottom:6px;}
  .help{font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:12px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;}
  .field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14.5px; font-family:'Inter',sans-serif; background:#fff; color:var(--text);}
  .field input:focus, .field select:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  /* Points and the photo tick share the last line. Points needs room for
     two digits and nothing more, so it is sized rather than given an
     equal share — the tick takes the rest. They sit on the same baseline,
     which means the tick drops to the bottom of the input beside it. */
  /* Queue and worker sit side by side where there is room and stack on a
     phone. Each is wide enough for a name plus its count. */
  .rt-last{display:flex; gap:14px; align-items:flex-end; margin-bottom:14px; flex-wrap:wrap;}
  .rt-last .field{flex:0 0 110px;}
  .rt-photo{flex:1 1 200px; display:flex; align-items:center; gap:8px;
    font-size:13px; cursor:pointer; padding-bottom:10px;}
  .toggle-group{display:flex; gap:10px; margin-bottom:14px;}
  .toggle-opt{flex:1; text-align:center; padding:12px 8px; border-radius:10px; border:2px solid var(--line);
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; cursor:pointer; color:var(--muted); background:#fff;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:9px;
    border:none; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    transition:transform .08s, opacity .15s;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-primary{background:var(--ink); color:#fff; width:100%;}
  .btn-amber{background:var(--amber); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .btn-red{background:rgba(214,69,69,0.1); color:var(--red);}
  .btn-green{background:rgba(31,157,107,0.12); color:var(--green);}
  .btn-sm{padding:7px 12px; font-size:12.5px;}
  .btn-block{width:100%;}

  .rank-row{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card);
    border-radius:12px; border:1px solid var(--line); margin-bottom:8px;}
  .rank-medal{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:#fff; flex-shrink:0;}
  .medal-1{background:var(--gold);} .medal-2{background:var(--silver);} .medal-3{background:var(--bronze);}
  .medal-n{background:var(--line); color:var(--muted);}
  .rank-info{flex:1; min-width:0;}
  .rank-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px;}
  .rank-role{font-size:11.5px; color:var(--muted);}
  .rank-points{text-align:right; flex-shrink:0;}
  .rank-points .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--amber-dark);}
  .rank-points .l{font-size:10px; color:var(--muted); text-transform:uppercase;}

  .stat-strip{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--card); border-radius:10px; padding:12px 14px; border:1px solid var(--line);}
  .stat .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;}
  .stat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .worker-card{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:14px 16px; margin-bottom:10px;}
  .worker-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .worker-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .worker-role{font-size:12px; color:var(--muted);}
  .worker-balance{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--amber-dark);
    background:#FFF6E8; padding:3px 9px; border-radius:20px;}

  .target-item{padding:12px 0; border-top:1px solid var(--line);}
  .target-item:first-child{border-top:none; padding-top:6px;}
  .target-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .target-title{font-weight:600; font-size:13.5px;}
  .target-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .target-pts{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--amber-dark); white-space:nowrap;}
  .target-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .badge{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; padding:2px 8px;
    border-radius:20px; font-family:'IBM Plex Mono',monospace;}
  .badge-achieved{color:var(--green); background:rgba(31,157,107,0.12);}
  .badge-pending{color:var(--amber-dark); background:#FFF3DD;}
  .badge-rejected{color:var(--red); background:rgba(214,69,69,0.1);}
  /* The remark box when a rejection was attempted without one. Cleared the
     moment they start typing, so the warning never outlives the problem. */
  /* The ring rather than the border alone: the box is focused at the same
     moment it is marked, and the browser's own focus outline sits straight
     on top of a border colour. */
  .needs-reason{border-color:var(--red) !important; background:rgba(214,69,69,0.06);
    box-shadow:0 0 0 3px rgba(214,69,69,0.20);}

  select.select-worker{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:14.5px; margin-bottom:14px; background:#fff;}

  /* Worker checklist (bulk target assignment) */
  .worker-check-list{
    max-height:220px; overflow-y:auto; border:1.5px solid var(--line); border-radius:8px;
    padding:4px; margin-bottom:4px;
  }
  .worker-check-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; cursor:pointer;
  }
  .worker-check-item:hover{background:var(--paper);}
  .worker-check-item input[type=checkbox]{
    width:17px; height:17px; flex-shrink:0; accent-color:var(--ink); cursor:pointer; margin:0;
  }
  .worker-check-item .wc-name{
    flex:1; min-width:0; font-size:13.5px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .worker-check-item .wc-role{
    font-size:10.5px; color:var(--muted); background:var(--paper); border:1px solid var(--line);
    padding:3px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .worker-check-empty{padding:16px; text-align:center; color:var(--muted); font-size:12.5px;}

  .ledger-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13px;}
  .ledger-row:first-child{border-top:none;}
  .ledger-note{color:var(--text);}
  .ledger-date{font-size:11px; color:var(--muted); margin-top:1px;}
  .ledger-pts{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .pts-earn{color:var(--green);} .pts-redeem{color:var(--red);}

  .empty{text-align:center; padding:36px 16px; color:var(--muted); font-size:13px;}
  footer.note{text-align:center; font-size:11px; color:var(--muted); padding:16px 20px 30px;}
  .toprow{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .toprow h2{font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0;}

  /* Submission review card */
  .sub-card{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:14px; margin-bottom:12px;}
  .sub-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .sub-title{font-weight:600; font-size:13.5px;}
  .sub-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .sub-photo{width:100%; max-height:260px; object-fit:cover; border-radius:10px; border:1px solid var(--line); margin-bottom:10px; display:block; cursor:pointer;}
  .sub-note{font-size:13px; color:var(--text); background:var(--paper); padding:8px 10px; border-radius:8px; margin-bottom:10px;}
  .sub-actions{display:flex; gap:8px;}

  /* Worker portal */
  .worker-shell{max-width:440px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
  .worker-hero{background:var(--ink); color:#fff; padding:30px 22px 22px; position:relative; overflow:hidden; flex-shrink:0;}
  .worker-hero::after{content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--ink-2) 10px 20px);}
  .worker-hero .co{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .worker-hero .sub{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--amber); margin-top:4px;}
  /* Sits in the hero rather than under the list, where it was easy to miss
     and easy to tap by accident when scrolling. z-index clears the striped
     ::after band; the padding makes the tap target larger than the word. */
  .worker-hero .admin-in{position:absolute; top:16px; right:14px; z-index:2;
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em;
    color:rgba(255,255,255,.62); text-decoration:none; padding:7px 12px;
    border:1px solid rgba(255,255,255,.22); border-radius:8px;
    -webkit-tap-highlight-color:transparent;}
  .worker-hero .admin-in:active{color:#fff; border-color:rgba(255,255,255,.5);}
  .worker-body{flex:1; padding:22px 18px 40px;}

  /* Name results under the search box, the way forwarding does it: they
     appear as you type and go once you have picked one. */
  .namehit{background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    padding:11px 13px; margin-top:8px; cursor:pointer; text-align:left;}
  .namehit:active{transform:scale(0.99);}
  .namehit .nm{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px;
    color:var(--text);}
  .namehit .rl{font-size:11.5px; color:var(--muted); margin-top:1px;}
  /* ---- the Do list checklist ----
     Only the task list itself differs for a Do list worker; the rest of
     their page is the ordinary dashboard. Taken from the forwarding board
     so somebody moving between the two is not relearning a row they
     already know. */
  .do-row{display:flex; align-items:flex-start; gap:11px; background:var(--card);
    border:1.5px solid var(--line); border-radius:11px; padding:12px 14px;
    margin-bottom:8px; cursor:pointer;}
  .do-row.picked{border-color:var(--green); background:rgba(31,157,107,.05);}
  .do-row:active{transform:scale(.995);}
  .do-tick{flex:0 0 22px; width:22px; height:22px; border-radius:7px;
    border:1.5px solid var(--line); display:flex; align-items:center;
    justify-content:center; font-size:13px; color:#fff; background:var(--card);
    line-height:1;}
  .do-row.picked .do-tick{background:var(--green); border-color:var(--green);}
  .do-body{flex:1 1 auto; min-width:0;}
  .do-what{font-size:13.5px; font-weight:600; color:var(--text); line-height:1.4;}
  /* The only tap target in a row that does not tick it off, so it has to
     look like a control rather than part of the sentence. */
  .do-bm{display:inline-block; margin-left:7px; padding:1px 6px; border-radius:6px;
    border:1px solid var(--line); font-size:9.5px; font-weight:700;
    letter-spacing:.05em; color:var(--muted); vertical-align:middle; user-select:none;}
  .do-ms{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.5;
    padding-left:9px; border-left:2px solid var(--amber);}
  .do-warn{background:#FCE9E9; color:#8A2E2E; border-radius:10px; padding:11px 13px;
    font-size:12.5px; line-height:1.55; margin-bottom:12px;}
  .do-warn b{display:block; margin-bottom:2px;}

  .pick-card{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px;
    margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .pick-card:active{transform:scale(0.99);}
  .pick-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .pick-role{font-size:12px; color:var(--muted);}

  .points-hero{background:var(--card); border-radius:14px; padding:18px; text-align:center; border:1px solid var(--line); margin-bottom:16px;}
  .points-hero .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:32px; color:var(--amber-dark);}
  .points-hero .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .file-drop{border:1.5px dashed var(--line); border-radius:10px; padding:14px; text-align:center; margin-bottom:10px; background:#fafbfd;}
  .file-drop input{margin-top:8px;}
  .thumb-preview{max-width:100%; max-height:180px; border-radius:8px; margin-top:10px; display:none;}

  a.backlink{font-size:12px; color:var(--muted); text-decoration:none;}

  /* Badges — military dog-tag / patch style */
  .badge-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:6px;}
  .badge-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    background:var(--olive); color:var(--khaki);
    padding:4px 10px 4px 7px; border-radius:4px;
    border:1px solid var(--olive-dark);
    border-left:3px solid var(--khaki);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .badge-chip.locked{
    background:var(--paper); color:var(--muted); border-color:var(--line);
    border-left-color:var(--line); opacity:0.75; box-shadow:none;
  }
  .badge-chip .em{font-size:13px; filter:grayscale(0.15);}
  .rank-badges{display:flex; gap:4px; margin-top:4px;}
  .rank-badges .em{
    font-size:14px; background:#FFF6E8; border:1px solid var(--amber);
    border-radius:5px; padding:2px 5px; display:inline-flex;
  }
  .rank-title{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--olive);
    background:var(--tan-paper); border:1px solid var(--khaki-dark);
    padding:3px 10px; border-radius:3px; margin-top:6px;
  }

  .week-card{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 100%);
    color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .week-card::after{
    content:""; position:absolute; top:-20px; right:-20px; width:100px; height:100px; border-radius:50%;
    background:radial-gradient(circle, rgba(242,169,59,0.25) 0%, transparent 70%);
  }
  .week-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber); margin-bottom:10px; position:relative; z-index:1;}
  .week-stats{display:flex; gap:18px; position:relative; z-index:1;}
  .week-stat .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;}
  .week-stat .l{font-size:10.5px; color:#B9C2DA; text-transform:uppercase; letter-spacing:0.04em; margin-top:1px;}
  .week-leader{margin-top:12px; font-size:12.5px; color:#DCE2F0; position:relative; z-index:1;}
  .week-leader strong{color:#fff;}

  /* Log tab + lightbox */
  .log-item{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:12px; margin-bottom:10px; display:flex; gap:12px;}

<script>
// Registered on its own, ahead of everything else. The app script needs the
// Firebase SDK from Google's CDN; on a dead connection that script throws
// before it runs a line, and a worker registered inside it would never be
// installed — on exactly the devices that need it most.
(function(){
  var S = window.__sw = { reg: null, waiting: false, reloaded: false };
  if(!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      S.reg = reg;
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', function(){
          // A newer build finished downloading while the app was open.
          if(sw.state === 'installed' && navigator.serviceWorker.controller) S.waiting = true;
        });
      });
    }).catch(function(){});
    // When a new worker takes over, reload so nobody is left running half
    // of one build and half of the next — but only if the page has just
    // opened. Pulling the page out from under someone who is halfway
    // through typing a PIN or a remark loses their work and reads as the
    // app freezing, which is the last thing an update should do.
    //
    // Later than that, the new build simply waits: the version in the
    // corner grows an arrow, and tapping it takes them across when they
    // are ready.
    var openedAt = Date.now();
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(S.reloaded) return;
      S.reloaded = true;
      if(Date.now() - openedAt < 10000) window.location.reload();
      else S.waiting = true;
    });
  });
  // Tapping the build number asks for a fresh copy there and then.
  S.check = function(){
    if(!S.reg){ window.location.reload(); return; }
    S.reg.update().catch(function(){}).then(function(){
      if(S.reg.waiting){ S.reg.waiting.postMessage('skip-waiting'); }
      else window.location.reload();
    });
  };
})();
</script>

<script>
(function(){

  function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // Shown in the corner and tappable. Installed to a home screen, the app
  // keeps running whatever build it last fetched, so there has to be a way
  // to see which one that is and to ask for a newer one without clearing
  // anything by hand. Bumped on every upload.
  const APP_BUILD = '2026-10-31a';
  // The address to hand a worker. Built from wherever the app is actually
  // being served from, so it stays right if the repo or folder is renamed,
  // and strips any #worker the admin happens to be sitting on.
  function workerPortalUrl(){
    var base = window.location.href.split('#')[0].split('?')[0];
    // The folder, not whatever file is being served from it — "…/KPI/"
    // reads as an address worth sending, "…/KPI/index.html" reads as
    // something copied out of an address bar by mistake.
    return base.replace(/index\.html$/, '');
  }
  // Copying beats reading a long URL off a screen and retyping it into
  // WhatsApp, which is how the wrong link gets sent in the first place.
  // Delegated from the document because the button is inside a view that
  // redraws, so a handler bound to the element does not survive.
  document.addEventListener('click', async function(e){
    const btn = e.target && e.target.closest && e.target.closest('#copy-worker-link');
    if(!btn) return;
    try{
      await navigator.clipboard.writeText(workerPortalUrl());
      btn.textContent = 'Copied';
    }catch(err){
      // Clipboard access is refused outside a secure context and in some
      // in-app browsers. Say what to do instead of failing silently.
      btn.textContent = 'Select it and copy';
    }
    setTimeout(function(){ btn.textContent = 'Copy'; }, 2000);
  });
  const swState = () => window.__sw || {};
  function checkForUpdate(){
    const S = swState();
    if(S.check) S.check(); else window.location.reload();
  }
  // The arrow appears once a newer build has downloaded and is waiting.
  function buildTagHtml(){
    return `<span id="app-build" title="Tap to check for a new version"
      style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
      cursor:pointer;">${APP_BUILD}${swState().waiting ? ' \u2191' : ''}</span>`;
  }
  function wireBuildTag(){
    const el = document.getElementById('app-build');
    if(el) el.onclick = checkForUpdate;
  }
  function pad(n){return n<10?'0'+n:''+n;}
  // Daily targets reset at midnight Malaysia time (Asia/Kuala_Lumpur), no
  // matter what timezone the admin's or worker's own device is set to.
  function fmtDateInTZ(date, tz){
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(date);
    const y = parts.find(p=>p.type==='year').value;
    const m = parts.find(p=>p.type==='month').value;
    const d = parts.find(p=>p.type==='day').value;
    return `${y}-${m}-${d}`;
  }
  function todayStr(){ return fmtDateInTZ(new Date(), 'Asia/Kuala_Lumpur'); }
  function todayStrFromDate(d){ return fmtDateInTZ(d, 'Asia/Kuala_Lumpur'); }
  // Daily tasks run on their own window, not a plain midnight boundary.
  // See the three constants below: the list opens at 7:00am Malaysia time
  // and closes at 5:00am the following morning, so the window crosses
  // midnight and the only gap is 05:00-07:00. None of this depends on
  // what timezone anyone's device happens to be set to.
  // ---- Performance scoring ----
  // Everything is a RATE, never a raw count — someone assigned more tasks
  // shouldn't score higher for that alone. Each part is 0-100 and they're
  // combined by weight.
  // Reliability and "no misses" used to be separate, but once a season ends
  // every task is either done or missed — so they measured the same thing and
  // a miss was punished twice. They're now one component.
  // Promptness — "In good time" — used to carry 15 of these and was dropped.
  // It scored how early in the day a submission went in, which measured
  // shift pattern more than performance: someone on nights submitted late
  // every day by definition. Its weight went to the two parts that say
  // whether the work was done and whether it was right.
  const SCORE_WEIGHTS = {
    reliability: 60,   // approved daily/weekly tasks vs assigned (misses included)
    quality:     30,   // share accepted first time — rushing a sloppy
                       // submission now costs more than it ever did
    challenger:  10    // challenger tasks completed vs accepted
  };
  // How a component is written on a card.
  //
  // One decimal, and never rounded upward. One quality issue against 225
  // submissions is 99.548%, which rounded to "100" and sat directly above
  // a red line reading "1 quality issue" — the card contradicting itself,
  // and the only real event on it rounded out of sight. Truncating means
  // 100 appears only when nothing whatsoever went wrong.
  //
  // The trailing ".0" is dropped: "97" reads better than "97.0", and a
  // whole number is exactly the case where the decimal says nothing.
  function partPct(v){
    if(v === null || v === undefined) return '';
    if(v >= 100) return '100';
    const t = Math.floor(v * 10) / 10;
    return Number.isInteger(t) ? String(t) : t.toFixed(1);
  }
  // The headline score, which keeps its decimal place even when it is a
  // zero. 97.08 and 97.00 are not the same thing, and in a column of
  // fourteen people a figure that quietly drops its decimal reads as the
  // exact one while its neighbours read as approximations. Same rule
  // otherwise: truncated, so 100 means 100.
  function scorePct(v){
    if(v === null || v === undefined) return '';
    if(v >= 100) return '100';
    return (Math.floor(v * 10) / 10).toFixed(1);
  }
  // ---- Malay for the task list ----
  //
  // Task text is a fixed list, not free prose: it comes from the role
  // templates and changes only when an admin edits one. So it is
  // translated once and kept, rather than sent to a translation service
  // every time somebody opens their phone. That makes it instant, free,
  // available with no signal — and, most of the point, correctable.
  //
  // These titles are full of things a machine translator ruins: AWB,
  // CN/DO, OGA, DagangNet, SLA, cut-off, the principal names. Those stay
  // in English here because that is what the team actually says out loud.
  // Only the instruction around them is in Malay.
  //
  // A template may carry its own `titleMs`, written by an admin. That
  // always wins. This table is the fallback, so the translations work the
  // day the build goes up with nothing to migrate, and anything edited
  // afterwards overrides them permanently.
  const MS_TASKS = {
    // — e-commerce / admin —
    'Reconcile daily e-commerce report (SPX,NJV,JNT, EPAM, EHU GROUP)':
      'Semak dan padankan laporan e-dagang harian (SPX,NJV,JNT, EPAM, EHU GROUP)',
    'Respond to customer inquiries within SLA (SR,DO,Email,Whatapps)':
      'Jawab pertanyaan pelanggan dalam tempoh SLA (SR,DO,Email,Whatsapp)',
    'Respond to customer/agent queries within SLA (Email,Whatapps)':
      'Jawab pertanyaan pelanggan/ejen dalam tempoh SLA (Email,Whatsapp)',

    // — import / export —
    'Coordinate & support export team to perform as per SOP':
      'Selaras dan bantu pasukan eksport bekerja mengikut SOP',
    'Process import & export docs/permits before cut-off (DagangNet/OGA)':
      'Proses dokumen/permit import & eksport sebelum cut-off (DagangNet/OGA)',
    'Respond import & export queries before cut-off (DagangNet/OGA)':
      'Jawab pertanyaan import & eksport sebelum cut-off (DagangNet/OGA)',
    'Reconcile daily export report (Entry/K-form/Clearance list)':
      'Semak dan padankan laporan eksport harian (Entry/borang K/senarai clearance)',

    // — forwarding —

  // Many titles end with the people they belong to — "…: ZILA",
  // "…: JESSICA, ZILA". The instruction is the same either way, so the
  // names are lifted off before looking up and put back afterwards
  // untranslated. Without this, one task per person would need its own
  // entry and the table would never keep up.
  //
  // Only an all-caps run counts as names, so "Balances: follow up…" and
  // "Handover: update…" — which are instructions, not people — are left
  // whole and matched as they are.
  // Parentheses and a second colon are allowed in the tail because one
  // real title ends "…(CN/DO/AREA): JESSICA, ZILA / (COD): GARY" — two
  // sets of names for two parts of the same job.
  // A target carries its own copy of the Malay, the same way it already
  // carries its own copy of the title. That keeps the worker's screen to
  // the reads it already does, and a task generated before this shipped
  // still resolves through the table below.
  const msFor = t => malayFor(t && t.title, t && t.titleMs);
  const MS_NAMES_TAIL = /\s*:\s*[A-Z][A-Z0-9\s,.:/&'()-]*$/;

  // The table, plus the rule that a run of capitals after a colon is a
  // list of people and not part of the instruction.
  function plainLookup(t){
    if(MS_TASKS[t]) return MS_TASKS[t];
    const m = t.match(MS_NAMES_TAIL);
    if(m){
      const base = t.slice(0, t.length - m[0].length);
      if(MS_TASKS[base]) return MS_TASKS[base] + m[0];
    }
    return '';
  }

  // Weekly compliance targets carry the week's date in the title, so the
  // text is different every Monday and no table entry can ever match it.
  // The shape around the date is fixed, though, so the shape is what gets
  // matched: the name, the date and the bracket are carried across
  // untouched and only the instruction inside is looked up.
  //
  // The opening bracket is deliberately not required to close. The stored
  // titles do not close it, and a translation that appears only on the
  // weeks somebody remembered the bracket is worse than none.
  const MS_WEEKLY = /^(.+?) compliance with head's (\S+) weekly target \((.*)$/;

  function malayFor(title, stored){
    const own = String(stored == null ? '' : stored).trim();
    if(own) return own;                       // an admin wrote this: it wins
    const t = String(title == null ? '' : title).trim();
    if(!t) return '';

    const direct = plainLookup(t);
    if(direct) return direct;

    const w = t.match(MS_WEEKLY);
    if(w){
      const who = w[1], when = w[2];
      const shut  = w[3].endsWith(')');
      const inner = shut ? w[3].slice(0, -1) : w[3];
      const ms = plainLookup(inner.trim());
      if(ms){
        return 'Pematuhan ' + who + ' terhadap sasaran mingguan ketua pada ' +
               when + ' (' + ms + (shut ? ')' : '');
      }
    }
    return '';                                 // nothing to show, so show nothing
  }

  // Season only. A season runs about three months, and shorter windows
  // fluctuate too much to say anything useful about someone's performance.
  const SCORE_PERIODS = [
    { key:'season', label:'Season', days:null }
  ];
  // Three times, not two, because handing the list out and closing it are
  // no longer the same event.
  //
  //   07:00  the day's list appears
  //   21:00  no new work is added to it after this — a task raised later
  //          goes onto tomorrow's list instead
  //   05:00  THE NEXT MORNING, the list closes and whatever is left fails
  //
  // The window therefore crosses midnight: between midnight and 05:00 the
  // live list is still yesterday's, which is the whole point — a night
  // shift finishes its own list rather than losing it at 9pm while still
  // halfway through. Between 05:00 and 07:00 nothing is live at all.
  const DAILY_OPEN_MINUTES   = 7 * 60;   // 07:00 — the list appears
  const DAILY_HANDOUT_END    = 21 * 60;  // 21:00 — last point new work is added
  const DAILY_END_MINUTES    = 5 * 60;   // 05:00 next morning — the list closes

  // Which day's list is open for submission right now, or null in the gap.
  // Everything about daily expiry is expressed through this, because a bare
  // "is it past nine" comparison cannot describe a window that ends on a
  // different date than it started.
  function liveDailyDate(today, minutesOfDay){
    if(minutesOfDay >= DAILY_OPEN_MINUTES) return today;
    if(minutesOfDay <  DAILY_END_MINUTES)  return addDaysMY(today, -1);
    return null;                            // 05:00–07:00, between lists
  }
  // Which day's list a submission belongs to, worked out from when it was
  // sent. A daily submitted at 2am belongs to the previous day's list, not
  // that morning's — the same rule liveDailyDate applies to the clock now.
  function dailyDayOfSubmission(submittedAt){
    const d = new Date(submittedAt);
    if(isNaN(d.getTime())) return null;
    const dateStr = fmtDateInTZ(d, 'Asia/Kuala_Lumpur');
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Kuala_Lumpur',
      hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(d);
    const hour = parseInt(parts.find(p=>p.type==='hour').value, 10);
    const minute = parseInt(parts.find(p=>p.type==='minute').value, 10);
    // In the 05:00–07:00 gap nothing is live; the date it was sent on is the
    // best answer available and is only ever used to match an exact day.
    return liveDailyDate(dateStr, hour * 60 + minute) || dateStr;
  }
  // Has the list for this date closed? In the gap nothing is live and
  // everything up to and including yesterday has just closed.
  function dailyClosed(createdAt, today, minutesOfDay){
    const live = liveDailyDate(today, minutesOfDay);
    return live === null ? createdAt < today : createdAt < live;
  }
  function nowMYParts(){
    const now = new Date();
    const dateStr = fmtDateInTZ(now, 'Asia/Kuala_Lumpur');
    const timeParts = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Kuala_Lumpur', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(now);
    const hour = parseInt(timeParts.find(p=>p.type==='hour').value, 10);
    const minute = parseInt(timeParts.find(p=>p.type==='minute').value, 10);
    return { dateStr, minutesOfDay: hour*60 + minute };
  }
  // Weekly tasks mirror the daily flow but on a 7-day cycle: the batch opens
  // Monday 7:00am Malaysia time and expires Sunday 9:00pm the same week.
  // Each week's batch is stamped with its Monday date, which acts as the
  // week's identity — the same role a task's createdAt date plays for dailies.
  const WEEK_OPEN_MINUTES = 7 * 60;    // Monday 7:00am
  const WEEK_EXPIRE_MINUTES = 21 * 60; // Sunday 9:00pm
  // 0 = Sunday ... 6 = Saturday, evaluated in Malaysia time rather than the
  // device's own timezone.
  function mondayOfWeekMY(dateStr){
    // dateStr is 'YYYY-MM-DD' in MY time; treat as UTC noon to dodge any
    // DST/offset edge cases, then walk back to that week's Monday.
    const d = new Date(dateStr + 'T12:00:00Z');
    const dow = d.getUTCDay();             // 0=Sun, 1=Mon ... 6=Sat
    const backToMonday = dow === 0 ? 6 : dow - 1; // Sunday belongs to the week that started 6 days ago
    d.setUTCDate(d.getUTCDate() - backToMonday);
    return d.toISOString().slice(0,10);
  }
  function dayOfWeekMY(dateStr){
    return new Date(dateStr + 'T12:00:00Z').getUTCDay(); // 0=Sun ... 6=Sat
  }

  // ---- After-hours recognition ----
  // Someone who answers the group at 10pm, or takes care of a problem on a
  // Sunday, is doing real work that no daily task covers. They log it, their
  // head approves it, and the points go to rewards only: this never touches
  // Reliability, Quality or Challenger, because voluntary work should not
  // quietly become part of how people are measured.
  const AH_OFFICE_START = 9 * 60;    // 09:00
  const AH_OFFICE_END   = 17 * 60;   // 17:00
  const AH_POINTS_DEFAULT = 10;
  const AH_CAP_DEFAULT = 3;          // approved entries per week
  const ahPoints = s => {
    const n = Number(s && s.afterHoursPoints);
    return Number.isFinite(n) && n > 0 ? Math.round(n) : AH_POINTS_DEFAULT;
  };
  const ahCap = s => {
    const n = Number(s && s.afterHoursWeeklyCap);
    return Number.isFinite(n) && n > 0 ? Math.round(n) : AH_CAP_DEFAULT;
  };
  // "HH:MM" -> minutes, or null if it isn't a time.
  function hhmmToMinutes(hhmm){
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
    if(!m) return null;
    const h = +m[1], mi = +m[2];
    if(h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }
  // Weekends count whatever the clock says, and so does any date the admin
  // has marked as a closure for that worker — a public holiday is not an
  // office hour for the person who worked through it.
  function isAfterHoursMY(dateStr, hhmm, closureDates){
    const mins = hhmmToMinutes(hhmm);
    if(mins === null) return { ok: false, why: 'That time does not look right — use 24-hour, like 21:40.' };
    const dow = dayOfWeekMY(dateStr);
    if(dow === 0 || dow === 6) return { ok: true, reason: 'weekend' };
    if(closureDates && closureDates.has(dateStr)) return { ok: true, reason: 'holiday' };
    if(mins < AH_OFFICE_START || mins >= AH_OFFICE_END) return { ok: true, reason: 'outside hours' };
    return { ok: false,
      why: 'That is inside office hours (9:00am–5:00pm), so it belongs to a normal task rather than here.' };
  }
  // The submission id carries the kind, the way day_ and dolist_ ids already
  // do elsewhere. It is minted in one place, so every screen that reviews one
  // of these gets the right behaviour without having to know about it.
  const AH_SUB_PREFIX = 'ah_';
  const afterHoursSubId = () => AH_SUB_PREFIX + uid();
  const isAfterHoursSubId = id => String(id || '').startsWith(AH_SUB_PREFIX);
  // Challenger tasks and after-hours help are an admin's call, not a head's.
  // Both are discretionary — one is extra work somebody chose to take on, the
  // other is recognition — and both should be judged consistently across the
  // whole company rather than differently by each head.
  //
  // Checked against the submission as well as the target, because a target
  // can be gone by the time somebody reviews and the submission is then the
  // only record of what kind of thing it was.
  function isAfterHoursEntry(sub, target){
    if(sub && isAfterHoursSubId(sub.id)) return true;
    if(sub && sub.taskKind === 'afterhours') return true;
    return !!(target && target.isAfterHours);

    return isAfterHoursEntry(sub, target) || isChallengerEntry(sub, target);

  function ahWeekCount(targets, workerId, weekOf){

      t.isAfterHours && t.workerId === workerId && t.ahWeekOf === weekOf

  // on 4G, and the only way out of it is refreshing the page.
  //
  // The forwarding app has had this on every call since it was written.
  // This one never did.
  function withTimeout(promise, ms, label){
    return Promise.race([

  // no real backend server here, so the hash is compared client-side against

  // determined attacker.
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // ---- Admin accounts ----
  // One owner plus any number of sub-accounts, all of them full admins. The

  // locked out. Sub-accounts live in settings beside it.

  // Login stays password-only: no username to remember. The password itself
  // says who you are, which is the reason two accounts may not share one.
  //

  // these hashes sit in Firestore, which this page reads without
  // credentials. Separate passwords are for telling colleagues apart and
  // routing approvals to the right person — not for keeping anyone out.
  // Only Firebase Auth will do that.
  const OWNER_ID = 'owner';

  function canUseBoard(admin, settings){
    if(!admin) return false;

  // be the reason an approval or a deletion did not happen, so nothing

  const ADMINLOG_COLLECTION = 'perf_adminlog';

  function adminLog(action, detail, kind){
    const who = CURRENT_ADMIN
      || (REVIEWING_HEAD ? { id:'head:'+REVIEWING_HEAD.id, name:REVIEWING_HEAD.name } : null);
    try{
      db.collection(ADMINLOG_COLLECTION).add({
        at: new Date().toISOString(),
        by: (who && who.name) || '',
        byId: (who && who.id) || '',
        kind: kind === 'review' ? 'review' : 'change',
        action: String(action || ''),
        // Capped because a pasted remark or a long task title would
        // otherwise be copied into the log at full length, hundreds of
        // times a day.
        detail: String(detail == null ? '' : detail).slice(0, 300)

    }catch(e){ console.error('Could not write the activity log:', e); }
  }
  // A page at a time rather than the lot. Reading 150 every time the Access
  // tab opened cost 150 reads against a 50,000-a-day ceiling for a list
  // nobody scrolled; a page of 50 costs 50, and Next pays for itself only
  // when somebody actually looks further back.
  //
  // The two filters — admin-or-owner, and which kind — are applied here
  // rather than after, so a page is 50 rows the person asked for and not
  // 50 rows that might thin out to three. That can take more than one
  // query when heads have been busy, hence the loop; six is the ceiling so
  // a sparse log cannot quietly turn one page into hundreds of reads.
  const ALOG_PAGE = 50;
  const ALOG_MAX_FETCHES = 6;
  async function getAdminLogPage(afterDoc, kind){
    const keep = r => !String(r.byId || '').startsWith('head:')
      && (kind === 'all' || (r.kind || 'change') === kind);
    try{
      const picked = [];
      let cursor = afterDoc, exhausted = false, fetches = 0;
      // Strictly less than: stopping at exactly a full page costs one query
      // instead of two. The price is that when the log happens to end on a
      // page boundary, Next is offered once more and the page after says
      // there is nothing further back — far cheaper than reading another
      // fifty documents every single time somebody opens the tab.
      while(picked.length < ALOG_PAGE && !exhausted && fetches < ALOG_MAX_FETCHES){
        let q = db.collection(ADMINLOG_COLLECTION).orderBy('at', 'desc').limit(ALOG_PAGE);
        if(cursor) q = q.startAfter(cursor);
        const snap = await q.get();
        fetches++;
        if(snap.docs.length < ALOG_PAGE) exhausted = true;
        if(!snap.docs.length) break;
        cursor = snap.docs[snap.docs.length - 1];
        snap.docs.forEach(d => { const r = d.data(); if(keep(r)) picked.push({ d, r }); });
      }
      const page = picked.slice(0, ALOG_PAGE);
      return {
        rows: page.map(x => x.r),
        // The cursor is the last row SHOWN, not the last one read — anything
        // fetched beyond the page has to come back on the next one.
        cursor: page.length ? page[page.length - 1].d : cursor,
        more: picked.length > ALOG_PAGE || !exhausted

    }

  function parseHash(){
    const h = window.location.hash.replace(/^#/, '');
    const parts = h.split('&');
    const out = {mode: parts[0] || ''};
    parts.slice(1).forEach(p=>{
      const [k,v] = p.split('=');
      out[k] = decodeURIComponent(v||'');

  }

  // ---- image compression: File -> compressed base64 JPEG (stored directly in Firestore) ----
  // WebP stores the same picture in a fraction of the bytes — at the same
  // quality setting, typically half or better. Every photo here is base64
  // inside a Firestore document, and base64 adds another third on top.
  //
  // It has to be checked rather than assumed: a canvas asked for a format it
  // cannot encode returns PNG without complaining, and PNG of a photograph
  // is far larger than the JPEG it replaced. Old photos stay JPEG and still
  // display; nothing needs converting.
  let _webpOk = null;
  function photoType(){
    if(_webpOk === null){
      try{
        const c = document.createElement('canvas');
        c.width = c.height = 1;
        _webpOk = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
      }catch(e){ _webpOk = false; }
    }
    return _webpOk ? 'image/webp' : 'image/jpeg';
  }
  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL(photoType(), quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---- storage (Firestore: one doc per key, holding a JSON array field) ----
  function showFbError(msg){
    const el = document.getElementById('fb-status');
    if(el){ el.style.display = 'block'; el.textContent = msg; }
  }
  // ---- a short-lived read cache ----
  //
  // Nearly every screen asks for the same handful of documents — workers,
  // targets, totals — and without this each one is a fresh trip to the
  // database. The reads were already batched into a single round trip, but a
  // round trip to Singapore on mobile data still costs a few hundred
  // milliseconds, and paying it again every time somebody changes tab is
  // what made moving around the app feel sluggish.
  //
  // Deliberately narrow, because a stale read is worse than a slow one:
  //
  //   getList       cached — the lenient read, used for drawing screens
  //   getListStrict never cached — used where a value is about to be
  //                 changed, and a stale copy would overwrite someone's work
  //   transactions  unaffected; Firestore reads those itself
  //
  // Every write drops its key, so the next read is fresh. The time limit is
  // only a backstop for a change made on somebody else's phone.
  const CACHE_MS = 60000;
  const _cache = new Map();
  // Handed out as a copy. A caller that sorts or pushes onto what it was
  // given must not quietly corrupt what everyone else reads next.
  function _copy(v){
    try{ return structuredClone(v); }
    catch(e){ return JSON.parse(JSON.stringify(v)); }
  }
  function cacheGet(key){
    const hit = _cache.get(key);
    if(!hit || Date.now() - hit.at > CACHE_MS){ _cache.delete(key); return undefined; }
    return _copy(hit.value);
  }
  function cachePut(key, value){ _cache.set(key, { at: Date.now(), value: _copy(value) }); }
  function cacheDrop(key){ if(key === undefined) _cache.clear(); else _cache.delete(key); }

  // whatever was on screen when it was last looked at.
  let _hidAt = 0;
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ _hidAt = Date.now(); return; }
    if(_hidAt && Date.now() - _hidAt > CACHE_MS) cacheDrop();
  });

  async function getList(key){
    const hit = cacheGet(key);
    if(hit !== undefined) return hit;
    try{
      const doc = await db.collection('appdata').doc(key).get();
      const val = doc.exists ? (doc.data().value || []) : [];
      cachePut(key, val);
      return _copy(val);
    }catch(e){
      showFbError('Could not load data from Firebase: ' + e.message);
      return [];
    }

  // a failed read could otherwise be mistaken for "genuinely empty" and lead to

  async function getListStrict(key){
    const doc = await db.collection('appdata').doc(key).get();
    const val = doc.exists ? (doc.data().value || []) : [];
    // Never served from the cache, but it is the freshest thing anyone has
    // just read, so everyone else may as well have it.
    cachePut(key, val);
    return val;

  // write that slips past this leaves every screen showing the old value
  // until the minute is up, which is the sort of bug nobody reproduces.
  async function saveDoc(key, value){
    cacheDrop(key);
    await db.collection('appdata').doc(key).set({ value });
    cachePut(key, value);
  }
  async function setList(key, val){

    }catch(e){

      return false;
    }
  }
  const K_SETTINGS = 'perf-settings';

  }

  const K_WORKERS = 'perf-workers';
  const K_TARGETS = 'perf-targets';
  const K_LEDGER = 'perf-ledger';

  const MODE_TASKS = 'tasks';
  const MODE_DOLIST = 'dolist';
  const modeOf = w => (w && w.taskMode) === MODE_DOLIST ? MODE_DOLIST : MODE_TASKS;
  const modesOf = list => (list || []).reduce((m, w) => { m[w.id] = modeOf(w); return m; }, {});
  const isDoList = w => modeOf(w) === MODE_DOLIST;

  // ---- Reminders on the wall display ----
  // An admin posts a reminder, tags whoever it is for, and the office

  // more: no points, no submission, no approval. It drops off the board on

  const ANN_COLLECTION = 'perf_announcements';
  const ANN_LIFE_HOURS = 12;

  // reminder everybody cleared overnight is still there to look at in the
  // morning rather than having quietly disappeared.
  const ANN_ADMIN_HOURS = 48;
  const annIsLive = a => {
    if(!a || a.clearedAt) return false;
    const t = new Date(a.at).getTime();
    if(isNaN(t)) return false;
    return (Date.now() - t) < ANN_LIFE_HOURS * 3600 * 1000;
  };
  async function postAnnouncement({ text, workerIds, workerNames }){
    const rec = {
      id: 'ann_' + uid(), text: String(text || '').trim(),
      workerIds: workerIds || [], workerNames: workerNames || [],
      byId: (CURRENT_ADMIN && CURRENT_ADMIN.id) || '',
      byName: currentAdminName() || '',
      at: new Date().toISOString(), clearedAt: null,
      clearedBy: {}, dismissedAt: null
    };
    try{
      await db.collection(ANN_COLLECTION).doc(rec.id).set(rec);
      adminLog('Posted a reminder to the wall display',
        rec.text.slice(0, 80) + (rec.workerNames.length ? ' — ' + rec.workerNames.join(', ') : ''),
        'change');

      showFbError('Could not post that reminder: ' + e.message);
      return null;
    }

  // when the first of them taps Clear, so each tap is recorded against that
  // worker and the reminder only leaves the board once everyone tagged has
  // cleared it — or an admin clears the whole thing outright.
  const annClearedBy = a => (a && a.clearedBy) || {};
  const annIsForMe = (a, workerId) => (a.workerIds || []).indexOf(workerId) > -1;
  const annOutstandingFor = (a, workerId) =>
    annIsLive(a) && annIsForMe(a, workerId) && !annClearedBy(a)[workerId];
  const annAllCleared = a => {
    const ids = a.workerIds || [];
    if(!ids.length) return false;
    const by = annClearedBy(a);
    return ids.every(id => !!by[id]);
  };
  // Everyone tagged, paired with when they cleared — the name list and the
  // id list are parallel, so position is what ties a person to their tick.
  function annPeople(a){
    const ids = (a && a.workerIds) || [];
    const names = (a && a.workerNames) || [];
    const by = annClearedBy(a);
    return ids.map((id, i) => ({ id, name: names[i] || id, clearedAt: by[id] || null }));

  const annOutstandingNames = a => annPeople(a).filter(p => !p.clearedAt).map(p => p.name);

  //   live      — still on the board, waiting on somebody
  //   completed — everyone tagged has cleared it themselves
  //   closed    — an admin took it off the board before everyone had
  function annStatus(a){
    if(!a) return 'live';
    if(a.clearedAt && annAllCleared(a)) return 'completed';
    if(a.clearedAt) return 'closed';
    return 'live';
  }

  // An admin taking a reminder off the board before everyone has cleared.
  async function clearAnnouncement(id){

      await db.collection(ANN_COLLECTION).doc(id).update({
        clearedAt: new Date().toISOString(),
        clearedByAdmin: currentAdminName() || ''
      });

  // Taking a finished reminder off the ADMIN list. The board stopped showing

    try{
      await db.collection(ANN_COLLECTION).doc(id).update({ dismissedAt: new Date().toISOString() });
