      if(hasDoList()){ await loadDoDay(); await loadDoTasks(); }
      if(isApprover()) await loadDoPending();
      await renderShell();
      // Not awaited: the board is already on screen, and the Outstanding and
      // Charges badges correct themselves a moment later.

  // ============================================================
  // Login — same worker records, same password, as attendance
  // ============================================================
  function renderLogin(){
    root.innerHTML = authShell('Sign in', `
        <div class="field"><label>Your name</label>
          <input type="text" id="w-name" placeholder="Search your name…" autocomplete="off">

        </label>

      ).join('');

      btn.disabled = true; btn.textContent = 'Checking…';

        btn.disabled = false; btn.textContent = 'Log In';

  function renderNoAccess(){
    root.innerHTML = authShell('Not set up yet', `
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.6;">
          Signed in as <b style="color:var(--ink);">${escapeHtml(ME.name)}</b>, but you don't
          have access to the forwarding board yet.</p>
        <div class="banner banner-err" style="margin:0 0 14px;">
          Ask an admin to give you View or Edit access from the <b>Access</b> tab.</div>
        <button class="advance" id="na-out" style="margin:0;background:transparent;
          color:var(--ink);border:1.5px solid var(--line);">Sign out</button>`);
    document.getElementById('na-out').onclick = logout;

  // ============================================================
  // Shell + tabs
  // ============================================================
  async function renderShell(){
    try{
      STATE.shipments = await getOpenShipments();
      // Login is a full read by definition — record it so the first
      // background refresh can already be a delta rather than another
      // full pass over every open shipment.
      noteSync(STATE.shipments);
      _lastFullSync = Date.now();
      await refreshCompletedToday();
      await refreshOpenSurveys();
      // Survey charges are counted on the Charges badge, so the index is
      // loaded at sign-in rather than waiting for the tab to be opened.
      await refreshSurveyCharges();
      await refreshOpenCharges();
    }catch(e){
      renderLoadError(e, renderShell);
      return;
    }
    STATE.detailId = null;
    STATE.tab = 'board';
    paintShell();
  }

  // A shipment is "awaiting closing" when a Closing action is actually
  // available on it right now — not merely at the delivery stage.
  function awaitingClosing(s){
    if(s.closed) return false;
    if(s.type === 'export'){
      const tracks = exportTracks(s);
      if(tracks.length) return tracks.some(t => !t.closed && t.stage === EXPORT_STEPS.length-2);
      return s.stage === EXPORT_STEPS.length-2;
    }
    const lots = s.lots || [];
    // Everything arrived has been delivered and closed, but part of the MAWB
    // never turned up — the write-off close is the only move left.
    if(lots.length && lots.every(l=>l.closed) && arrivalBalance(s) > 0) return true;
    return lots.some(l => {
      if(l.closed || !l.hasArrived) return false;
      const steps = importSteps(l);
      // Closing is the last step, so it's available from the one before it —
      // which is Delivery on the K1 path and Releasing on the other.
      if(l.stage !== terminalIdx(steps) - 1) return false;
      // If that step is Delivery, everything has to be out first.
      if(l.stage === deliveryIdx(steps)) return lotShortfall(l) <= 0;
      return true;
    });
  }

  // How many shipments were completed today. Read once per load rather than
  // on every re-render, since the board redraws constantly.
  // Held as the actual ids rather than a bare number, so the incremental
  // refresh can add one that just closed without re-counting the whole day.
  let _completedToday = { date:null, count:0 };
  let _closedTodayIds = new Set();
  async function refreshCompletedToday(){
    const day = todayStr();
    try{
      const snap = await withTimeout(db.collection(SHIP).where('closedDate','==', day).get(), 15000, 'Counting completed');
      _closedTodayIds = new Set(snap.docs.filter(d => d.data().closed).map(d => d.data().id));
      _completedToday = { date: day, count: _closedTodayIds.size };
    }catch(e){ console.error('Could not count today\'s completed shipments:', e); }
  }
  // Same tally, worked out from the shipments a delta sync just returned —
  // no query at all. A shipment that closed today joins the set; one that
  // was reopened or had its closing undone leaves it.
  function noteCompletedFrom(changed){
    const day = todayStr();
    if(_completedToday.date !== day){ _closedTodayIds = new Set(); }
    changed.forEach(s=>{
      if(s.closed && s.closedDate === day) _closedTodayIds.add(s.id);
      else _closedTodayIds.delete(s.id);
    });
    _completedToday = { date: day, count: _closedTodayIds.size };
  }

  function alertList(){
    const groups = { stuck:[], balance:[], deliver:[], missing:[] };
    const today = todayStr();
    STATE.shipments.forEach(s=>{
      if(s.closed) return;
      if(s.type === 'export' && exportTracks(s).length){
        exportTracks(s).forEach((t, ti) => {
          if(t.closed || t.chasedDate === today) return;
          const h = ageHours(t.stageAt), thr = THRESH.exp[t.stage] || 24;
          if(h >= thr && t.stage < EXPORT_STEPS.length-1){
            groups.stuck.push({ s, lot:null, what:`HAWB ${t.no}: ${EXPORT_STEPS[t.stage]}, no movement`,
              age: ageStr(t.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
              chaseKey: s.id + '|x' + ti });
          }
        });
      } else if(s.type === 'export'){
        const chased = s.chasedDate === today;
        const h = ageHours(s.stageAt);
        const thr = THRESH.exp[s.stage] || 24;
        if(!chased && h >= thr && s.stage < EXPORT_STEPS.length-1){
          groups.stuck.push({ s, lot:null, what:`${EXPORT_STEPS[s.stage]}, no movement`,
            age: ageStr(s.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
            chaseKey: s.id });
        }
        if(!s.pcs && !s.kg && ageHours(s.createdAt) >= 48){
          groups.missing.push({ s, lot:null, what:'No piece count or weight',
            age: ageStr(s.createdAt), level:'gry', chaseKey: null });
        }
      } else {
        (s.lots||[]).forEach((lot,li)=>{
          if(lot.closed) return;
          const chased = lot.chasedDate === today;
          const h = ageHours(lot.stageAt);
          if(!lot.hasArrived){
            // not yet arrived — flag only once its expected date has passed
            if(lot.expectedDate && lot.expectedDate < today && !chased){
              groups.balance.push({ s, lot, li, what:`${lot.pcsExpected||'?'} pcs not yet arrived`,
                age:'overdue', level:'amb', chaseKey: s.id+'|'+li });
            }
            return;
          }
          const steps = importSteps(lot);
          const thr = importThresh(lot)[lot.stage] || 24;
          if(lot.stage === deliveryIdx(steps)){
            // released, nothing delivered yet, or partially delivered with a balance
            const delivered = (lot.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
            const remaining = (lot.pcsArrived||0) - delivered;
            if(remaining > 0 && !chased){
              groups.deliver.push({ s, lot, li,
                what: delivered>0 ? `${remaining} pcs balance, not yet sent`
                                   : `${remaining} pcs, nobody assigned`,
                age: ageStr(lot.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
                chaseKey: s.id+'|'+li });
            }
          } else if(lot.stage < terminalIdx(steps) && !chased && h >= thr){
            groups.stuck.push({ s, lot, li, what:`${steps[lot.stage]}, no movement`,
              age: ageStr(lot.stageAt), level: ageLevel(h,thr)==='bad'?'red':'amb',
              chaseKey: s.id+'|'+li });
          }
        });
        if(!s.pcs && !s.kg && (s.lots||[]).every(l=>!l.pcsArrived) && ageHours(s.createdAt) >= 48){
          groups.missing.push({ s, lot:null, what:'No piece count or weight',
            age: ageStr(s.createdAt), level:'gry', chaseKey:null });
        }
      }
    });
    return groups;
  }

  // Shipments where the first (or only) round of arrivals came up short of
  // what was booked — these are the ones waiting on "+ Add lot".
  // Arrived but not yet delivered, per shipment. Balances is about cargo
  // that never turned up; this is about cargo sitting here waiting to go out.
  function lotDelivered(l){ return (l.deliveries||[]).reduce((a,d)=>a+(d.pcs||0),0); }
  function lotShortfall(l){ return Math.max(0, (l.pcsArrived||0) - lotDelivered(l)); }
  // Arrived but not yet delivered, on lots still running.
  function deliveryOutstanding(s){
    if(s.type !== 'import') return 0;
    return (s.lots||[]).reduce((t,l) => (l.closed || !l.hasArrived) ? t : t + lotShortfall(l), 0);
  }
  // Arrived, never delivered, and the lot was closed anyway. Closing a lot
  // early doesn't make the shortfall disappear — those pieces are still
  // unaccounted for, so they belong on the Outstanding list too.
  function deliveryShortClosed(s){
    if(s.type !== 'import') return 0;
    return (s.lots||[]).reduce((t,l) => (l.closed && l.hasArrived) ? t + lotShortfall(l) : t, 0);
  }
  function outstandingTotal(s){ return deliveryOutstanding(s) + deliveryShortClosed(s); }
  // When a lot was closed with pieces still short. Stamped at closing from
  // now on; a lot closed before that falls back to the last time its stage
  // moved, which is the closing itself for all but a hand-corrected one, and
  // finally to the shipment's own closing date.
  function lotClosedShortAt(l, s){
    if(!l || !l.closed || !l.hasArrived || lotShortfall(l) <= 0) return null;
    return l.closedAt || (l.notReceived && l.notReceived.at) || l.stageAt
      || (s && (s.closedDate || s.createdAt)) || null;
  }
  // A shipment is aged by its longest-standing shortfall: where two lots were
  // closed short on different days, the older one is the one being chased.
  function shipClosedShortAt(s){
    const times = (s.lots||[]).map(l => lotClosedShortAt(l, s)).filter(Boolean).sort();
    return times.length ? times[0] : null;
  }
  // Whole calendar days between then and today, read locally. Counted by
  // date rather than by elapsed hours so a band never depends on the time of
  // day something was closed, and always agrees with the date on the row:
  // closed on the 1st and read on the 9th is 8 days, all day.
  function daysSince(iso){
    if(!iso) return null;
    const from = dayOf(iso);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(from)) return null;
    const ms = Date.parse(todayStr() + 'T00:00:00Z') - Date.parse(from + 'T00:00:00Z');
    return isNaN(ms) ? null : Math.max(0, Math.round(ms / 864e5));
  }
  // Aging bands for closed-short cargo, as separate buckets rather than
  // nested ones — a shipment appears under exactly one, so the four counts
  // add up to the total instead of each containing the one before it.
  const SHORT_AGE_BANDS = [
    { key:'d7',   label:'Within 7d',  test: d => d <= 7 },
    { key:'d14',  label:'8–14d',  test: d => d > 7  && d <= 14 },
    { key:'d21',  label:'15–21d', test: d => d > 14 && d <= 21 },
    { key:'d21p', label:'Beyond 21d', test: d => d > 21 }
  ];
  function shortAgeBand(s){
    const d = daysSince(shipClosedShortAt(s));
    if(d === null) return null;
    const b = SHORT_AGE_BANDS.find(x => x.test(d));
    return b ? b.key : null;
  }
  function shipmentsWithOutstanding(){
    // A closed shipment can still carry a shortfall, so don't filter those out.
    return STATE.shipments.filter(s => outstandingTotal(s) > 0);
  }

  // "Balance" means part of the AWB arrived and part didn't. A shipment
  // where nothing has landed yet isn't a balance — it's simply Not arrived,
  // and counting it in both places made the board disagree with the tab.
  function hasArrivalShortfall(s){
    if(s.closed || s.type !== 'import') return false;
    if(!(s.lots||[]).some(l => l.hasArrived)) return false;
    return arrivalBalance(s) > 0;
  }
  function shipmentsWithBalance(){
    return STATE.shipments.filter(hasArrivalShortfall);
  }

  // Refreshes the shipment list without blocking the screen. Throttled, so
  // flicking between tabs doesn't fire a read every time, and it only
  // redraws if something actually changed and the person is still looking
  // at the same tab.
  let _lastRefresh = 0, _refreshing = false;
  // The high-water mark the delta query asks from, and when every open
  // shipment was last read in full.
  let _lastSync = null, _lastFullSync = 0;
  const FULL_SYNC_MS = 10 * 60 * 1000;
  function noteSync(list){
    list.forEach(s => { if(s.updatedAt && (!_lastSync || s.updatedAt > _lastSync)) _lastSync = s.updatedAt; });
    if(!_lastSync) _lastSync = new Date().toISOString();
  }
  // Most tabs load their own list once per session and keep it — charges,
  // surveys, closed shortfalls, the Do list — and the refresh button used to
  // ask only for shipments, so on those tabs it did nothing at all.
  //
  // It now refreshes what the screen in front of you actually shows, and
  // only that. Dropping every cache on every press re-read lists nobody was
  // looking at, several times a day per person, which is real money against
  // a read quota. A press on the Board does not freshen Charges; pressing it
  // again once you are on Charges does, which is what anyone would do.
  let _hardRefreshing = false;
  async function hardRefresh(){
    if(_hardRefreshing) return;
    _hardRefreshing = true;
    const started = Date.now();
    // Spun by hand rather than by repainting: the screen is about to be
    // rebuilt anyway, and redrawing it twice would flash the list.
    const btn = document.getElementById('refresh-btn');
    if(btn) btn.classList.add('spinning');
    const tab = STATE.tab;
    try{
      if(tab === 'dolist'){
        // Nothing here comes off the board, so no shipment read at all.
        STATE.doLog = null;
        if(hasDoList()){ await loadDoDay(); await loadDoTasks(); }
        if(isApprover()){ STATE.doPending = null; await loadDoPending(); }
      } else if(['settings','workers','access'].includes(tab)){
        // The settings screens: the config documents and the worker list,
        // never the shipments.
        invalidateWorkerCache();
        const [access, termCfg, dispMap, doCfg] = await Promise.all([
          getAccessMap(), getTerminalsConfig(), getDisplayMap(), getDoConfig()]);
        STATE.access = access;
        STATE.display = dispMap;
        STATE.doCfg = doCfg;
        STATE.terminals = termCfg.terminals || [];
        STATE.principals = termCfg.principals || [];
        MY_LEVEL = access[ME.id] || 'off';
        applyLevel(MY_LEVEL);
        CAN_DISPLAY = IS_MOD || !!dispMap[ME.id];
      } else {
        if(tab === 'charges'){
          invalidateOpenCharges();
          invalidateEditedCharges();
          _svCharges = null;
        }
        if(tab === 'surveys') _openSurveys = null;
        if(tab === 'outstanding') _shortfallLoaded = false;
        await backgroundRefresh(true);
      }
    }catch(e){
      console.error('Refresh failed:', e);
    }
    // Hold the spinner long enough to be seen. Without this the repaint
    // lands in the same instant as the click on a good connection, and the
    // button looks dead even though everything was re-read.
    const wait = Math.max(0, 500 - (Date.now() - started));
    await new Promise(r => setTimeout(r, wait));
    _hardRefreshing = false;
    paintShell();
  }

  async function backgroundRefresh(force){
    if(_refreshing) return;
    if(!force && Date.now() - _lastRefresh < 20000) return;
    _refreshing = true;
    const tabAtStart = STATE.tab;
    try{
      // A full read every ten minutes catches anything a delta cannot see —
      // a shipment deleted by an admin, or one saved by a device whose clock
      // is far enough out to fall outside the rewind. Everything in between
      // asks only for what changed, which is usually nothing at all.
      const wantFull = force || !_lastSync || (Date.now() - _lastFullSync > FULL_SYNC_MS);
      const before = signatureOf(STATE.shipments);
      if(wantFull){
        const fresh = await getOpenShipments();
        const freshIds = new Set(fresh.map(x=>x.id));
        // Anything closed and already merged in from the Completed tab isn't
        // part of this query — keep it rather than losing it.
        const preserved = STATE.shipments.filter(x => !freshIds.has(x.id) && x.closed);
        STATE.shipments = fresh.concat(preserved);
        noteSync(fresh);
        _lastFullSync = Date.now();
        await refreshCompletedToday();
      }else{
        const changed = await getChangedShipments(rewindIso(_lastSync, SYNC_REWIND_MS));
        if(changed.length){
          const byId = new Map(STATE.shipments.map(x => [x.id, x]));
          changed.forEach(s => {
            // An open shipment always belongs on the board. A closed one is
            // only kept if it was already being shown — merged in from
            // Completed, or carrying a shortfall.
            if(!s.closed || byId.has(s.id)) byId.set(s.id, s);
          });
          STATE.shipments = Array.from(byId.values());
          noteSync(changed);
          noteCompletedFrom(changed);
        }
      }
      _lastRefresh = Date.now();
      // Don't yank the screen out from under someone who has since opened a
      // shipment or moved to another tab.
      if(STATE.tab === tabAtStart && !STATE.detailId && signatureOf(STATE.shipments) !== before){
        paintShell();
      }
    }catch(e){
      console.error('Background refresh failed:', e);
    }finally{ _refreshing = false; }
  }
  // A tab badge is a prompt to open the tab, so a badge that only becomes
  // right once you have opened it is worse than none: it under-reports, and
  // the number you were shown is the reason you might not look.
  //
  // Outstanding and Charges both read lists that load lazily — closed
  // shipments carrying a shortfall, and the open-charge, duty and survey
  // sets — so until something opened those tabs the badges counted only
  // what happened to be on the board. The Do list already loads before the
  // first paint for exactly this reason; these now do too, just after it
  // rather than before, so signing in is not held up by four queries.
  let _warmed = false;
  async function warmBadges(){
    if(_warmed) return;
    _warmed = true;
    const tabAtStart = STATE.tab;
    try{
      await Promise.all([
        _svCharges  === null ? refreshSurveyCharges() : null,
        _openCharges === null ? refreshOpenCharges()  : null,
        _dutyOpen   === null ? refreshDutyOpen()      : null,
        ensureShortfallsLoaded()
      ]);
    }catch(e){
      console.error('Could not load the tab badge counts:', e);
    }
    // Same courtesy as the background refresh: never redraw over someone who
    // has since opened a shipment or moved on.
    if(STATE.tab === tabAtStart && !STATE.detailId) paintShell();
  }

  // Cheap fingerprint of what the board actually shows, so an unchanged
  // refresh causes no redraw at all.
  function signatureOf(list){
    return list.map(s => [s.id, s.closed?1:0, s.stage, s.stageAt,
      (s.lots||[]).map(l=>l.stage+':'+l.stageAt+':'+(l.deliveries||[]).length).join(','),
      (s.xtracks||[]).map(t=>t.stage+':'+t.stageAt).join(',')].join('|')).sort().join(';');
  }

  function paintShell(){
    // We're back on a list screen, not inside a shipment — clear the marker
    // the background refresh uses to avoid interrupting a detail view.
    STATE.detailId = null;
    const groups = alertList();
    const alertCount = groups.stuck.length + groups.balance.length + groups.deliver.length + groups.missing.length;
    const open = STATE.shipments.filter(s => !s.closed);
    const counts = {
      completed: _completedToday.date === todayStr() ? _completedToday.count : 0,
      exports: open.filter(s => s.type === 'export').length,
      imports: open.filter(s => s.type === 'import').length,
      closing: open.filter(awaitingClosing).length
    };
    const balanceShipments = shipmentsWithBalance();
    const outstandingShipments = shipmentsWithOutstanding();
    // The badge counts only what is still to go out, not the whole tab. The
    // closed-short pile is a chase list — aged in bands, worked through over
    // weeks — and it dwarfs the delivery work, so a badge counting both sat
    // near the same large number whatever anyone did. Counting the cargo
    // actually waiting gives a number that falls as it goes out, which is
    // what a badge is for. The tab itself still lists all of them, and its
    // first counter is the total, so the two never look like a contradiction.
    const toGoCount = outstandingShipments.filter(s => deliveryOutstanding(s) > 0).length;

    root.innerHTML = `
      <div class="topbar">
        <div class="topbar-top">
          <div class="brand">EXPREXA FORWARDING<span class="tag">${IS_MOD?'MOD':IS_ADMIN?'ADMIN':CAN_EDIT?'EDIT':'VIEW'}</span></div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span id="refresh-btn" class="${_hardRefreshing?'spinning':''}"
              title="Refresh everything on this screen">&#8635;</span>
            <div class="who" id="who-btn">${escapeHtml(ME.name)} <span class="lvl-badge">${escapeHtml((LEVEL_LABEL[MY_LEVEL]||MY_LEVEL).toUpperCase())}</span></div>
            <span id="build-tag" title="Tap to check for a new version"
              style="color:#6E7B99;font-size:9.5px;font-family:'IBM Plex Mono',monospace;
              cursor:pointer;line-height:1;">${escapeHtml(APP_BUILD)}${swState().waiting?' &uarr;':''}</span>
          </div>
        </div>
        <div class="tabs-wrap"><div class="tabs">
          ${CAN_DISPLAY?`<span class="tab" id="disp-tab">Display</span>`:''}
          ${seesDoTab()?`<span class="tab ${STATE.tab==='dolist'?'on':''}" data-tab="dolist">Do list
            ${doBadgeCount()?`<span class="bdg${doCutoffPassed()&&doOpenCount()?' late':''}">${doBadgeCount()}</span>`:''}</span>`:''}
          <span class="tab ${STATE.tab==='board'?'on':''}" data-tab="board">Board</span>
          <span class="tab ${STATE.tab==='alerts'?'on':''}" data-tab="alerts">Alerts
            ${alertCount?`<span class="bdg">${alertCount}</span>`:''}</span>
          <span class="tab ${STATE.tab==='balances'?'on':''}" data-tab="balances">Balances
            ${balanceShipments.length?`<span class="bdg">${balanceShipments.length}</span>`:''}</span>
          <span class="tab ${STATE.tab==='outstanding'?'on':''}" data-tab="outstanding">Outstanding
            ${toGoCount?`<span class="bdg">${toGoCount}</span>`:''}</span>
          <span class="tab ${STATE.tab==='completed'?'on':''}" data-tab="completed">Completed</span>
          <span class="tab ${STATE.tab==='remarks'?'on':''}" data-tab="remarks">Remarks</span>
          <span class="tab ${STATE.tab==='surveys'?'on':''}" data-tab="surveys">Surveys
            ${openSurveyCount()?`<span class="bdg">${openSurveyCount()}</span>`:''}</span>
          <span class="tab ${STATE.tab==='charges'?'on':''}" data-tab="charges">Charges
            ${unpaidChargeCount()?`<span class="bdg">${unpaidChargeCount()}</span>`:''}</span>
          ${IS_MOD?`<span class="tab ${STATE.tab==='report'?'on':''}" data-tab="report">Report</span>`:''}
          ${IS_MOD?`<span class="tab ${STATE.tab==='settings'?'on':''}" data-tab="settings">Settings</span>`:''}
          ${IS_MOD?`<span class="tab ${STATE.tab==='workers'?'on':''}" data-tab="workers">Worker IDs</span>`:''}
          ${IS_MOD?`<span class="tab ${STATE.tab==='access'?'on':''}" data-tab="access">Access</span>`:''}
        </div></div>
      </div>
      ${hasDoList() && STATE.tab !== 'dolist' && doCutoffPassed() && doOpenCount()
        ? `<div class="do-strip" id="do-strip">&#9888; ${doOpenCount()} job${doOpenCount()===1?'':'s'}
             still open on your Do list &mdash; tap to clear before you go</div>` : ''}
      <div class="content" id="content"></div>
      ${IS_ADMIN && !['dolist','report','settings','workers','access'].includes(STATE.tab)
        ? `<button class="fab" id="fab-new">+</button>` : ''}
    `;
    document.getElementById('who-btn').onclick = () => {
      if(confirm('Sign out of the Forwarding board?')) logout();
    };
    const buildTag = document.getElementById('build-tag');
    if(buildTag) buildTag.onclick = () => {
      buildTag.textContent = 'checking…';
      checkForUpdate();
    };
    const refreshBtn = document.getElementById('refresh-btn');
    // The one place a wait is wanted: the person asked for fresh data, so
    // ignore the throttle and repaint even if nothing changed.
    if(refreshBtn) refreshBtn.onclick = hardRefresh;
    document.querySelectorAll('.tab').forEach(t=> t.onclick = () => {
      STATE.tab = t.dataset.tab;
      // Draw straight from what's already loaded so the tab switches
      // instantly, then bring the data up to date behind it. Waiting for the
      // fetch first made every tab click pause on the network.
      paintShell();
      if(['board','alerts','balances','outstanding'].includes(STATE.tab)) backgroundRefresh();
    });
    // The wheel-to-scroll and drag-to-pan handlers that used to live here are
    // gone with the sideways scroll — the bar wraps now, so there is nothing
    // left off screen to reach.
    const doStrip = document.getElementById('do-strip');
    if(doStrip) doStrip.onclick = () => { STATE.tab = 'dolist'; paintShell(); };
    const dispTab = document.getElementById('disp-tab');
    if(dispTab) dispTab.onclick = (e) => { e.stopPropagation(); renderDisplayBoard(); };
    const fab = document.getElementById('fab-new');
    if(fab) fab.onclick = renderNewShipment;

    const c = document.getElementById('content');
    if(STATE.tab === 'dolist'){
      if(!seesDoTab()){ STATE.tab = 'board'; paintShell(); return; }
      paintDoList(c);
    }
    else if(STATE.tab === 'board') paintBoard(c, counts);
    else if(STATE.tab === 'alerts') paintAlerts(c, groups);
    else if(STATE.tab === 'balances') paintBalances(c, balanceShipments);
    else if(STATE.tab === 'outstanding'){
      ensureShortfallsLoaded().then(() => {
        if(STATE.tab === 'outstanding' && !STATE.detailId) paintOutstanding(c, shipmentsWithOutstanding());
      });
      paintOutstanding(c, outstandingShipments);
    }
    else if(STATE.tab === 'completed') paintCompleted(c);
    else if(STATE.tab === 'remarks') paintRemarks(c);
    else if(STATE.tab === 'surveys') paintSurveys(c);
    else if(STATE.tab === 'charges') paintCharges(c);
    else if(['report','settings','workers','access'].includes(STATE.tab)){
      // Moderator only. A level can change under someone mid-session, so the
      // tab is checked when it paints, not only when it is drawn.
      if(!IS_MOD){ STATE.tab = 'board'; paintShell(); return; }
      if(STATE.tab === 'report') paintReport(c);
      else if(STATE.tab === 'settings') paintSettings(c);
      else if(STATE.tab === 'workers') paintWorkers(c);
      else paintAccess(c);
    }
  }

  // ============================================================
  // Board
  // ============================================================
  // One representative status per shipment, for grouping on the "All" list.
  // For a split import, this follows the same lot the age badge already
  // follows — whichever has been sitting longest — so the two stay consistent.
  function shipmentStatus(s){
    if(s.type === 'export'){
      const tracks = exportTracks(s).filter(t => !t.closed);
      if(!tracks.length) return EXPORT_STEPS[s.stage];
      const worst = tracks.reduce((a,b) => ageHours(b.stageAt) > ageHours(a.stageAt) ? b : a);
      return EXPORT_STEPS[worst.stage];
    }
    const lots = s.lots || [];
    const openLots = lots.filter(l=>!l.closed);
    if(openLots.length === 0) return arrivalBalance(s) > 0 ? 'Awaiting balance' : 'Delivered';
    let worstH = -1, worstLabel = null;
    openLots.forEach(l=>{
      if(!l.hasArrived){ if(worstLabel===null) worstLabel = 'Not arrived'; return; }
      const h = ageHours(l.stageAt);
      // A flight that came empty is not an arrival to report as one, until
      // the lot is deliberately moved past that step.
      const st = importSteps(l);
      const label = (lotEmpty(l) && l.stage <= arrivedIdx(st)) ? 'Nothing arrived' : st[l.stage];
      if(h > worstH){ worstH = h; worstLabel = label; }
    });
    return worstLabel || 'Not arrived';
  }

  // A compact grouped listing — AWB, customer, clustered under the status
  // they share — as an overview alternative to the detailed roadmap cards.
  // A shipment counts as K1 if any of its lots needs a K1 declaration.
  // Export never does.
  function isK1Shipment(s){
    return s.type === 'import' && (s.lots||[]).some(l => l.hasK1);
  }
  function shortDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
  }
  // The tags that ride beside an AWB on the listing. BAL means part of the
  // MAWB is still in the air; L1, L2 … are the lots of a split shipment that
  // are still being worked, so a glance says how many consignments are live
  // and which ones they are.
  // Pass the house bill a row stands for, and the tags describe that bill
  // alone — its own K1, its own balance. Pass nothing and they describe the
  // whole AWB.
  function listTagsHtml(s, h){
    const forHawb = !!h;
    const lot = forHawb ? activeLotForHawb(s, h.no) : null;
    const tags = [`<span class="kind ${s.type==='export'?'exp':'imp'}">${s.type==='export'?'EXP':'IMP'}</span>`];
    const needsK1 = forHawb
      ? (s.type === 'import' && (lot ? !!lot.hasK1 : !!h.k1))
      : isK1Shipment(s);
    if(needsK1) tags.push(`<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">K1</span>`);
    // What the cargo is decides how it is handled on the ground, so it is
    // read off the row's own consignment: a house bill carries its own
    // declaration, and the master takes what its bills agree on. Dangerous
    // goods keeps the red emblem; perishable and fresh are a quieter note,
    // since they change the hurry rather than the handling rules.
    const kind = forHawb ? cargoOf(h) : cargoOf(s);
    if(kind === 'dg'){
      tags.push(`<span class="kind" style="background:var(--red);color:#fff;">DG</span>`);
    } else if(kind !== 'general'){
      tags.push(`<span class="kind" style="background:rgba(31,157,107,.14);color:var(--green);"
        >${kind === 'fresh' ? 'FRESH' : 'PERISH'}</span>`);
    }
    if(s.hasOpenSurvey) tags.push(`<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">SURVEY</span>`);
    else if(s.hasSurvey) tags.push(`<span class="kind" style="background:rgba(31,157,107,.12);color:var(--green);">SURVEY</span>`);
    // A shortfall belongs to the consignment that was short. On a house
    // bill's row that is the bill's own balance — the bill beside it arrived
    // complete and must not wear someone else's.
    const short = forHawb
      ? (!s.closed && s.type === 'import' && hawbArrived(s, h.no) && (hawbBalance(s, h) || 0) > 0)
      : hasArrivalShortfall(s);
    if(short) tags.push(`<span class="kind" style="background:rgba(242,169,59,.22);color:var(--amber-dk);">BAL</span>`);
    // Lot tags count what is still being worked. On the whole AWB that is
    // every open lot; on a house bill's row it is that bill's own lots, and
    // only once it has more than one — a bill on a single lot would just be
    // numbering itself.
    const lots = s.lots || [];
    if(forHawb){
      const mine = s.type === 'import' ? lotsForHawb(s, h.no) : [];
      if(mine.length > 1) mine.forEach((l, i) => {
        if(l.closed) return;
        tags.push(`<span class="kind" style="background:rgba(59,113,242,.12);color:#2C56BE;">L${i+1}</span>`);
      });
    } else if(lots.length > 1){
      lots.forEach((l, i) => {
        if(l.closed) return;
        tags.push(`<span class="kind" style="background:rgba(59,113,242,.12);color:#2C56BE;">L${i+1}</span>`);
      });
    }
    // Joined with a real space: without one the run has no break opportunity
    // and a long row of tags shoves the customer off the edge instead of
    // wrapping onto a second line.
    return ' ' + tags.join(' ');
  }

  // Where one house bill stands. Each is its own consignment riding its own
  // lot, so a bill that has landed and cleared is not held back by one still
  // in the air — and the two are not forced under a single heading.
  function hawbStatus(s, h){
    if(s.type === 'export') return shipmentStatus(s);
    const ls = lotsForHawb(s, h.no);
    // No lot claims it. An old unmapped lot carries it, so the shipment
    // speaks for it; otherwise it is a bill whose own lot has yet to be
    // recorded, and nothing of it is here.
    if(!ls.length) return hasUnmappedLot(s) ? shipmentStatus(s) : 'Not arrived';
    const open = ls.filter(l => !l.closed);
    // Every lot of this bill finished: done, unless part of it never came.
    if(open.length === 0) return (hawbBalance(s, h) || 0) > 0 ? 'Awaiting balance' : 'Delivered';
    // Read the same way the shipment is: the lot that has sat longest speaks,
    // and one still in the air only speaks if none of them is in hand.
    let worstH = -1, worstLabel = null;
    open.forEach(l => {
      if(!l.hasArrived){ if(worstLabel === null) worstLabel = 'Not arrived'; return; }
      const hrs = ageHours(l.stageAt);
      // A lot whose flight came empty sits on the Arrived step without
      // anything behind it, so say so rather than claiming it arrived. Once
      // it is moved past that step, the step itself speaks again.
      const st = importSteps(l);
      const label = (lotEmpty(l) && l.stage <= arrivedIdx(st)) ? 'Nothing arrived' : st[l.stage];
      if(hrs > worstH){ worstH = hrs; worstLabel = label; }
    });
    return worstLabel || 'Not arrived';
  }

  // A consignment with nothing in hand — still in the air, or waiting on a
  // balance that never came — sits on no stage, so there is no stage
  // threshold to judge it by. It still has to turn red eventually: two days
  // of nothing happening is two days of nothing happening.
  const WAIT_NO_STAGE_THRESH = 48;
  // How long a row has sat where it is, and what counts as too long there.
  // A house bill is timed from its own lot; a direct shipment from whichever
  // of its open lots or tracks has been waiting longest — the same one its
  // status comes from, so the heading and the clock always agree.
  function rowWaitInfo(s, h){
    const older = (a, b) => new Date(b.stageAt) < new Date(a.stageAt) ? b : a;
    const newer = (a, b) => new Date(b.stageAt) > new Date(a.stageAt) ? b : a;
    if(s.type === 'export'){
      const open = exportTracks(s).filter(t => !t.closed);
      const mine = h ? open.filter(t => t.no === h.no) : open;
      if(!mine.length) return { from: s.stageAt || s.createdAt, thr: WAIT_NO_STAGE_THRESH };
      const t = mine.reduce(older);
      return { from: t.stageAt || s.createdAt, thr: THRESH.exp[t.stage] || 24 };
    }
    const lots = s.lots || [];
    const working = lots.filter(l => !l.closed && l.hasArrived);
    // A bill with no lot of its own rides an older unmapped lot, if there is
    // one; otherwise nothing of it is here yet.
    let mine = h ? working.filter(l => lotHawbs(l).includes(h.no)) : working;
    if(h && !mine.length && hasUnmappedLot(s)) mine = working;
    if(!mine.length){
      // Nothing in hand. If part of it did arrive and has since been closed,
      // the wait runs from when that last happened — a balance has been
      // outstanding since the lot before it finished, not since booking.
      const settled = (h ? lots.filter(l => l.hasArrived && lotHawbs(l).includes(h.no))
                         : lots.filter(l => l.hasArrived));
      const from = settled.length ? (settled.reduce(newer).stageAt || s.createdAt) : s.createdAt;
      return { from, thr: WAIT_NO_STAGE_THRESH };
    }
    const l = mine.reduce(older);
    return { from: l.stageAt || s.createdAt, thr: importThresh(l)[l.stage] || 24 };
  }

  // A house bill whose lots are all closed with nothing outstanding is
  // finished, whatever the rest of its master is still doing. Both the board
  // and the wall display sort those lines to the bottom, and they ask the
  // same question here so the two screens can never disagree about what is
  // done. Nothing is hidden: a finished bill stays visible under the work
  // that is left, which is also where it belongs on a screen read top-down.
  const FINISHED_STATUS = l => l === 'Delivered' || l === 'All lots delivered';

  function boardListingHtml(list){
    // One row per consignment: a direct shipment is one row, a consolidation
    // one row per house bill. Grouping is done on the rows, not the
    // shipments, because two house bills on the same master move at their own
    // pace — one cleared, one not yet arrived — and a single heading for both
    // told you neither.
    const rows = [];
    list.forEach(s => {
      const hs = hawbList(s);
      if(hs.length === 0) rows.push({ s, h: null, status: shipmentStatus(s), k1: isK1Shipment(s) });
      // The master's own row would only repeat their sum, so it gives way to
      // them and its number moves onto each line instead.
      else hs.forEach(h => {
        const lot = activeLotForHawb(s, h.no);
        rows.push({ s, h, status: hawbStatus(s, h),
          // A house bill follows its own clearance path, so its position is
          // read against its own sequence rather than the master's.
          k1: s.type === 'import' && (lot ? !!lot.hasK1 : !!h.k1) });
      });
    });
    const groups = {};
    const order = [];
    rows.forEach(r => {
      if(!groups[r.status]){ groups[r.status] = []; order.push(r.status); }
      groups[r.status].push(r);
    });
    // Furthest along at the top, down to what has not landed yet at the
    // bottom — the board then reads as the day does, with the consignments
    // about to go out first and the ones nothing can be done about last.
    // Statuses that sit at the same point are ordered busiest first.
    // Finished consignments sink to the bottom first of all. They score
    // highest on progress, being as far along as a thing can get, which put
    // the one group needing nothing at the very top of a list of work.
    order.sort((a,b)=>{
      const ra = groups[a][0], rb = groups[b][0];
      return (FINISHED_STATUS(a) ? 1 : 0) - (FINISHED_STATUS(b) ? 1 : 0)
        || statusProgress(b, rb.s.type, rb.k1) - statusProgress(a, ra.s.type, ra.k1)
        || groups[b].length - groups[a].length
        || String(a).localeCompare(String(b));
    });
    const qty = (p, k) => `${p!=null?`${escapeHtml(p)} pcs`:'— pcs'} &middot; ${
      // An export carries two weights; the one that bills is shown.
      k!=null ? `${escapeHtml(kgText(Number(k)))} kg` : '— kg'}`;
    // Time since this row's own last movement, coloured against the
    // threshold for the step it is sitting on.
    const ageHtml = (s, h) => {
      const w = rowWaitInfo(s, h);
      if(!w.from) return '';
      // Amber while it is still inside the allowance for where it is sitting,
      // red once it is past — the same two readings the rest of the board uses.
      const over = ageHours(w.from) >= (w.thr || WAIT_NO_STAGE_THRESH);
      return ` &middot; <span class="lage ${over ? 'bad' : ''}">${ageStr(w.from)}</span>`;
    };
    return order.map(st => `
      <div class="grp"><span>${escapeHtml(st.toUpperCase())}</span><span class="c">${groups[st].length}</span></div>
      ${groups[st].map(({ s, h })=>{
        const tags = listTagsHtml(s, h);
        const when = escapeHtml(shortDate(s.createdAt));
        if(!h) return `
        <div class="listrow" data-open="${s.id}">
          <div style="min-width:0;">
            <span class="awb"><span class="nb">${escapeHtml(s.awb)}</span>${tags}</span>
            <div class="lsub">created ${when}${ageHtml(s, null)}</div>
          </div>
          <div class="lright">
            <div class="lc">${escapeHtml(s.customer||'—')}</div>
            <div class="lsub">${qty(s.pcs, s.kg)}</div>
          </div>
        </div>`;
        return `
        <div class="listrow" data-open="${s.id}">
          <div style="min-width:0;">
            <span class="awb"><span class="nb">${escapeHtml(h.no)}</span>${tags}</span>
            <div class="lsub">on ${escapeHtml(s.awb)} &middot; created ${when}${ageHtml(s, h)}</div>
          </div>
          <div class="lright">
            <div class="lc">${escapeHtml(h.customer || s.customer || '—')}</div>
            <div class="lsub">${qty(h.pcs, h.kg)}</div>
          </div>
        </div>`;
      }).join('')}
    `).join('');
  }

  function paintBoard(c, counts){
    // A shipment closes during a live session, not just between page loads —
    // the initial query filtered these out, but nothing since then had, so a
    // shipment closed just now kept sitting on the board until a full reload.
    let list = STATE.shipments.filter(s=>!s.closed);
    if(STATE.filter === 'export') list = list.filter(s=>s.type==='export');
    else if(STATE.filter === 'import') list = list.filter(s=>s.type==='import');
    // Same rule as the "closing" counter above the filters, so the chip and
    // the number can never disagree.
    else if(STATE.filter === 'closing') list = list.filter(awaitingClosing);
    else if(STATE.filter === 'split') list = list.filter(s=> (s.lots||[]).length > 1);

    // Terminal narrows further, only meaningful once we're looking at imports.
    // Which terminal a shipment belongs to is worked out from its AWB prefix —
    // nothing stored on the shipment itself.
    const showTerminalRow = STATE.filter === 'import' && STATE.terminals.length > 0;
    if(showTerminalRow && STATE.terminalFilter !== 'all'){
      if(STATE.terminalFilter === '__none') list = list.filter(s=>!terminalForAwb(s.awb, STATE.terminals));
      else list = list.filter(s=> terminalForAwb(s.awb, STATE.terminals) === STATE.terminalFilter);
    }

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n">${counts.completed}</div><div class="l">completed today</div></div>
        <div class="count"><div class="n">${counts.exports}</div><div class="l">export</div></div>
        <div class="count"><div class="n">${counts.imports}</div><div class="l">import</div></div>
        <div class="count"><div class="n warn">${counts.closing}</div><div class="l">closing</div></div>
      </div>
      <div class="filters">
        <span class="${STATE.filter==='all'?'on':''}" data-f="all">All</span>
        <span class="${STATE.filter==='export'?'on':''}" data-f="export">Export</span>
        <span class="${STATE.filter==='import'?'on':''}" data-f="import">Import</span>
        <span class="${STATE.filter==='closing'?'on':''}" data-f="closing">Closing</span>
        <span class="${STATE.filter==='split'?'on':''}" data-f="split">Split lots</span>
      </div>
      ${showTerminalRow ? `
      <div class="filters" style="background:var(--paper);">
        <span style="color:${STATE.terminalFilter==='all'?'var(--ink)':'var(--muted)'};
          border-bottom-color:${STATE.terminalFilter==='all'?'var(--ink)':'transparent'};" data-tf="all">All terminals</span>
        ${STATE.terminals.map(t=>`
          <span style="color:${STATE.terminalFilter===t.name?'var(--ink)':'var(--muted)'};
            border-bottom-color:${STATE.terminalFilter===t.name?'var(--ink)':'transparent'};"
            data-tf="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span>`).join('')}
        <span style="color:${STATE.terminalFilter==='__none'?'var(--ink)':'var(--muted)'};
          border-bottom-color:${STATE.terminalFilter==='__none'?'var(--ink)':'transparent'};" data-tf="__none">Not set</span>
      </div>` : ''}
      <div style="padding:10px 12px 4px;">
        <input id="bd-search" placeholder="Search AWB, HAWB or customer…" value="${escapeHtml(STATE.search)}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="rows"></div>`;
    c.querySelectorAll('.filters span[data-f]').forEach(el=> el.onclick = ()=>{
      STATE.filter = el.dataset.f; STATE.terminalFilter = 'all'; paintShell(); });
    c.querySelectorAll('.filters span[data-tf]').forEach(el=> el.onclick = ()=>{
      STATE.terminalFilter = el.dataset.tf; paintShell(); });

    // Only the rows redraw as you type, so the search box keeps focus and
    // the caret doesn't jump.
    function renderRows(){
      const q = STATE.search.trim().toLowerCase();
      const shown = !q ? list : list.filter(s =>
        String(s.awb||'').toLowerCase().includes(q) ||
        String(s.customer||'').toLowerCase().includes(q) ||
        hawbList(s).some(h => h.no.toLowerCase().includes(q)));
      const host = document.getElementById('rows');
      // Every filter reads the same way — the grouped listing, one row per
      // consignment under the status it is at. Narrowing to Import or
      // Closing changes which shipments are in front of you, not how a
      // shipment looks, so the eye doesn't have to relearn the page.
      host.innerHTML = shown.length
        ? boardListingHtml(shown)
        : `<div class="empty">${q ? 'Nothing matches that search.' : `Nothing here.${CAN_EDIT?' Tap + to add a shipment.':''}`}</div>`;
      host.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=> renderDetail(el.dataset.open));
    }
    renderRows();
    const searchBox = document.getElementById('bd-search');
    searchBox.oninput = () => { STATE.search = searchBox.value; renderRows(); };
  }

  // Shared dot-and-line roadmap — export always used this; import now does
  // too, so a shipment reads the same way on the board regardless of type.
  function pipsHtml(steps, stage){
    let pips = '<div class="pips">';
    for(let i=0;i<steps.length;i++){
      pips += `<div class="pip ${i<stage?'done':i===stage?'now':'todo'}"></div>`;
      if(i<steps.length-1) pips += `<div class="link3 ${i<stage?'done':''}"></div>`;
    }
    return pips + '</div>';
  }

  function summarise(s){
    if(s.type === 'export' && exportTracks(s).length){
      const tracks = exportTracks(s);
      const body = tracks.map((t,i) => `
        <div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:${i>0?'8':'0'}px 0 2px;">HAWB ${escapeHtml(t.no)}</div>
        ${pipsHtml(EXPORT_STEPS, t.stage)}`).join('');
      const open = tracks.filter(t => !t.closed);
      const lead = open.length === 0 ? 'All HAWBs closed'
        : open.map(t => `${t.no} at ${EXPORT_STEPS[t.stage]}`).join(', ');
      let worstH = -1, worstLvl = 'ok', worstAge = ageStr(s.createdAt);
      open.forEach(t => {
        const h = ageHours(t.stageAt), thr = THRESH.exp[t.stage] || 24;
        if(h > worstH){ worstH = h; worstAge = ageStr(t.stageAt); worstLvl = h>=thr?'bad':h>=thr*0.6?'warn':'ok'; }
      });
      return { body, lead, age: worstAge, ageClass: worstLvl };
    }
    if(s.type === 'export'){
      const total = EXPORT_STEPS.length - 1;
      const pips = pipsHtml(EXPORT_STEPS, s.stage);
      const h = ageHours(s.stageAt);
      const thr = THRESH.exp[s.stage] || 24;
      const lvl = s.stage >= total ? 'ok' : ageLevel(h, thr);
      return { body: pips, lead: EXPORT_STEPS[s.stage], age: ageStr(s.stageAt),
        ageClass: s.stage>=total?'ok':(lvl==='bad'?'bad':lvl==='warn'?'warn':'ok') };
    }
    const lots = s.lots || [];
    // One roadmap per lot — almost always just one, so this reads exactly
    // like export's single line. A split shipment stacks its lots' roadmaps,
    // each labelled, rather than trying to force them into one line.
    const openLotsForRoadmap = lots.filter(l=>!l.closed);
    let roadmap;
    if(openLotsForRoadmap.length === 0){
      roadmap = '';
    } else if(openLotsForRoadmap.length === 1 && lots.length === 1){
      const l = openLotsForRoadmap[0];
      roadmap = pipsHtml(importSteps(l), l.hasArrived ? l.stage : -1);
    } else {
      roadmap = lots.map((l,li)=>{
        if(l.closed) return '';
        // Named by its house bill where it has one, so the roadmaps can be
        // told apart without opening the shipment. A bill running more than
        // one lot — its balance came separately — numbers them within itself.
        const lh = lotHawbs(l);
        let name;
        if(lh.length){
          const mine = lotsForHawb(s, lh[0]);
          const n = mine.indexOf(l);
          name = lh.map(escapeHtml).join(', ') + (mine.length > 1 && n >= 0 ? ` &middot; LOT ${n+1}` : '');
        } else {
          name = `LOT ${li+1}`;
        }
        const label = `<div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:${li>0?'8':'0'}px 0 2px;">${name}</div>`;
        return label + pipsHtml(importSteps(l), l.hasArrived ? l.stage : -1);
      }).join('');
    }
    // headline
    const openLots = lots.filter(l=>!l.closed);
    let lead;
    if(openLots.length === 0) lead = arrivalBalance(s) > 0
      ? `${arrivalBalance(s)} pcs balance not arrived`
      : 'All lots delivered';
    else {
      const parts = openLots.map(l=>{
        // Each lot is a house bill's own consignment, so the headline says
        // whose it is instead of running them together as one shipment.
        const lh = lotHawbs(l);
        const tag = lh.length && lots.length > 1 ? `${lh.join(', ')}: ` : '';
        if(!l.hasArrived) return `${tag}${l.pcsExpected||'?'} not arrived`;
        const steps = importSteps(l);
        // The flight came and nothing was on it. Saying it outright beats a
        // bare "0", which reads like a figure nobody filled in — and the
        // stage still shows, since the lot can be moved along from here.
        if(lotEmpty(l)){
          const moved = l.stage > arrivedIdx(steps);
          return `${tag}nothing arrived${l.pcsExpected?` of ${l.pcsExpected}`:''}`
            + (moved ? ` &middot; ${steps[l.stage]}` : '');
        }
        if(l.stage===deliveryIdx(steps)){
          const del = (l.deliveries||[]).reduce((a,d)=>a+d.pcs,0);
          const rem = (l.pcsArrived||0)-del;
          return tag + (del>0 ? `${del} delivered, ${rem} to go` : `${l.pcsArrived} released`);
        }
        return `${tag}${l.pcsArrived||l.pcsExpected||'?'} at ${steps[l.stage]}`;
      });
      lead = parts.join(', ');
    }
    // worst age
    let worstH = -1, worstLvl = 'ok', worstAge = '';
    openLots.forEach(l=>{
      if(!l.hasArrived) return;
      const h = ageHours(l.stageAt), thr = importThresh(l)[l.stage]||24;
      if(h > worstH){ worstH = h; worstAge = ageStr(l.stageAt);
        worstLvl = h>=thr?'bad':h>=thr*0.6?'warn':'ok'; }
    });
    if(worstH < 0){ worstAge = ageStr(s.createdAt); worstLvl='ok'; }
    return { body: roadmap, lead, age: worstAge, ageClass: worstLvl };
  }

  // ============================================================
  // Detail — export
  // ============================================================
  let _detailFrom = 'board';
  const TAB_LABEL = { board:'Board', alerts:'Alerts', balances:'Balances', outstanding:'Outstanding',
    completed:'Completed', remarks:'Remarks', surveys:'Surveys', report:'Report' };
  async function renderDetail(id){
    // Deliberately NOT guarded on the shipment already being loaded. The
    // board only holds open shipments, so a survey, remark or report row
    // pointing at a completed one used to fail this check and do nothing at
    // all — a tap that looked broken. The document is fetched either way.
    let s = STATE.shipments.find(x=>x.id===id);
    // The board list only refreshes on tab switches — but the moment someone
    // is about to act on a shipment is exactly when a stale copy matters
    // most, so this always pulls that one document fresh. A single doc read
    // is cheap regardless of how large the board has grown.
    const contentEl = document.getElementById('content');
    const backTo = STATE.tab;
    // A narrowed feed belongs to the shipment it was narrowed on, so opening
    // another one starts from everything rather than from a filter that may
    // match nothing here.
    resetActivityFilter();
    if(contentEl) contentEl.innerHTML = `<div class="empty">Loading…</div>`;
    function bail(msg){
      if(!contentEl) return;
      contentEl.innerHTML = `<div class="back" id="dt-bk">&larr; Back</div>
        <div class="empty">${escapeHtml(msg)}</div>`;
      const bk = document.getElementById('dt-bk');
      if(bk) bk.onclick = () => { STATE.tab = backTo; paintShell(); };
    }
    try{
      const fresh = await withTimeout(db.collection(SHIP).doc(id).get(), 15000, 'Loading shipment');
      if(fresh.exists){
        s = fresh.data();
        migrateShipmentSteps(s);
        const idx = STATE.shipments.findIndex(x=>x.id===id);
        if(idx>-1) STATE.shipments[idx] = s; else STATE.shipments.push(s);
      }else if(!s){
        bail('That shipment no longer exists — it may have been deleted.');
        return;
      }
    }catch(e){
      console.error('Could not refresh shipment before opening — showing the last known copy:', e);
      // Nothing cached to fall back on, so say so rather than showing a
      // blank screen.
      if(!s){ bail('Could not load that shipment — check the connection and try again.'); return; }
    }
    reconcileShortfallFlag(s);
    // paintShell clears detailId, so the origin tab is kept separately —
    // going back should return to the list you came from, not always Board.
    _detailFrom = STATE.tab;
    STATE.detailId = id;
    if(s.type === 'export') renderExportDetail(s); else renderImportDetail(s);
  }

  // Every status change and remark is logged here, with who and when — one
  // combined feed per shipment rather than notes and history living apart.
  // `ref` names the consignment an entry concerns — the house bill, or the
  // lot where there is no bill — so the feed can be narrowed to one of them
  // without reading the wording of every line.
  function logActivity(s, text, kind, photoId, ref){
    s.activity = s.activity || [];
    s.activity.push({ text, by: ME.name, at: new Date().toISOString(), kind: kind||'status',
      photoId: photoId||null, ...(ref ? { ref: String(ref) } : {}) });
  }
  // Adding to the feed without rewriting the shipment around it.
  //
  // saveShipment() writes the whole document from whatever this device has
  // in memory. That is fine when the thing being saved IS the whole
  // shipment, and quietly destructive when it is not: two people with the
  // same shipment open, one writes a remark, the other advances a step from
  // a copy loaded before that remark existed — and the remark is gone. It
  // survived in fwd_remarks, which is its own document, so it kept showing
  // under Remarks while having vanished from the shipment. Steps and edits
  // lost the same way leave no trace at all.
  //
  // arrayUnion appends server-side, so nothing else in the document is
  // touched and nobody's entry can overwrite anybody else's.
  async function appendActivity(s, text, kind, photoId, ref){
    const entry = { text, by: ME.name, at: new Date().toISOString(), kind: kind || 'note',
      photoId: photoId || null, ...(ref ? { ref: String(ref) } : {}) };
    s.activity = (s.activity || []).concat([entry]);
    await db.collection(SHIP).doc(s.id).update({
      activity: firebase.firestore.FieldValue.arrayUnion(entry),
      updatedAt: new Date().toISOString()
    });
    return entry;
  }
  // How a lot is named in the feed: by its own house bill where it has one,
  // numbered within that bill when the bill runs more than one lot.
  // Whether a lot is one consignment of several, and so wants a number. It
  // is, once there are other lots — but also the moment a first lot lands
  // short of what the AWB was booked for, because the balance has to follow
  // on a lot of its own. Numbering it there and then keeps the feed honest:
  // without it the first entry reads "Arrived — 20 pcs" and only becomes
  // Lot 1 in hindsight, once Lot 2 shows up underneath it.
  function lotIsNumbered(s, lot){
    const lots = s.lots || [];
    if(lots.length > 1) return true;
    // Before it lands, a single lot is still the whole AWB — the pieces that
    // have not arrived are simply the pieces that have not arrived.
    return s.type === 'import' && !!lot && !!lot.hasArrived && arrivalBalance(s) > 0;
  }
  function lotRef(s, lot){
    const hs = lotHawbs(lot);
    if(hs.length) return hs.join(', ');
    const i = (s.lots||[]).indexOf(lot);
    return lotIsNumbered(s, lot) ? `Lot ${i+1}` : '';
  }
  function lotLabel(s, lot){
    const hs = lotHawbs(lot);
    if(hs.length){
      const mine = lotsForHawb(s, hs[0]);
      const n = mine.indexOf(lot);
      return `${hs.join(', ')}${mine.length > 1 && n >= 0 ? ` lot ${n+1}` : ''}: `;
    }
    const i = (s.lots||[]).indexOf(lot);
    return lotIsNumbered(s, lot) ? `Lot ${i+1}: ` : '';
  }
  // Entries written before refs existed still say who they are about in the
  // prefix their text carries, so those are read back rather than lost.
  function activityRef(a){
    const text = String((a && a.text) || '');
    if(a && a.ref) return String(a.ref);
    const lot = /^Lot\s+(\d+):\s/.exec(text);
    if(lot) return 'Lot ' + lot[1];
    const m = /^(?:HAWB\s+)?([A-Za-z0-9][A-Za-z0-9\-\/]*)(?:\s+lot\s+\d+)?:\s/i.exec(text);
    return m ? m[1] : '';
  }
  // What kind of thing happened, grouped the way someone scanning the feed
  // thinks about it: did it move, did someone write something, was money
  // handed over. Corrections and the booking itself sit together as edits.
  const ACT_GROUPS = [
    { id:'status',  label:'Steps',   kinds:['status'] },
    { id:'note',    label:'Remarks', kinds:['note'] },
    { id:'payment', label:'Charges', kinds:['payment'] },
    { id:'survey',  label:'Survey',  kinds:['survey'] },
    { id:'edit',    label:'Edits',   kinds:['edit','created'] }
  ];
  function actGroupOf(a){
    const g = ACT_GROUPS.find(x => x.kinds.includes(a.kind));
    return g ? g.id : 'edit';
  }
  // Which filters are showing. Reset whenever a shipment is opened, so the
  // last one's narrowing never hides the next one's feed.
  let _actFilter = { group:'all', ref:'all', showAll:false };
  function resetActivityFilter(){ _actFilter = { group:'all', ref:'all', showAll:false }; }
  const ACT_PAGE = 25;

  // Every entry on the shipment, newest first, with the step numbers worked
  // out across the whole feed — numbering has to ignore the filter, or
  // step 7 would become step 3 the moment someone narrowed the list.
  function activityEntries(s){
    // Older shipments only have the separate notes list from before this was
    // unified — folded in here so nothing already written is lost.
    const legacyNotes = (s.notes||[]).map(n=>({ text:n.text, by:n.by, at:n.at, kind:'note' }));
    const entries = (s.activity||[]).concat(legacyNotes);
    // Shipments created before creation was logged still know who made them
    // and when, so show that as the first entry rather than leaving a gap.
    if(!entries.some(a => a.kind === 'created') && s.createdAt){
      entries.push({ text:'Shipment created', by: s.createdBy || 'unknown', at: s.createdAt, kind:'created' });
    }
    const all = entries.sort((a,b)=> String(b.at).localeCompare(String(a.at)));
    // Numbered oldest-first so a step keeps its number for good — step 7 is
    // still step 7 tomorrow. Held in a Map rather than written onto the
    // entries themselves, which would save the numbers into the shipment.
    // Only the roadmap movements are numbered. Creation, corrections,
    // remarks, surveys and payments all sit in the feed unnumbered — they
    // are things that happened to the shipment, not steps it moved through,
    // and counting them would make "step 7" mean nothing.
    const stepNo = new Map();
    let steps = 0;
    all.slice().reverse().forEach(a => { if(a.kind === 'status') stepNo.set(a, ++steps); });
    return { all, stepNo, steps };
  }
  function actEntryHtml(a, stepNo, steps){
    return a.kind==='note' ? `
        <div class="noteline">${escapeHtml(a.text)}
          <div class="who">${escapeHtml(a.by)}, ${new Date(a.at).toLocaleString()}</div></div>` : `
        <div class="actrow">${stepNo.has(a)
            ? `<div class="num ${stepNo.get(a) === steps ? 'now' : ''}">${stepNo.get(a)}</div>`
            : `<div class="dot"></div>`}<div>
          <div class="txt">${escapeHtml(a.text)}</div>
          <div class="who">${escapeHtml(a.by)}, ${new Date(a.at).toLocaleString()}
            ${a.photoId?` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(a.photoId)}">View photo</span>`:''}</div></div></div>`;
  }
  function activityBodyHtml(s){
    const { all, stepNo, steps } = activityEntries(s);
    if(all.length === 0) return `<div style="font-size:12.5px;color:var(--muted);">No activity yet.</div>`;
    // The consignments that actually appear, in the order the house bills are
    // listed on the shipment so the chips read the same way the lots do.
    const order = hawbList(s).map(h => h.no);
    const refCount = {};
    all.forEach(a => { const r = activityRef(a); if(r) refCount[r] = (refCount[r]||0) + 1; });
    const refs = Object.keys(refCount).sort((a,b)=>{
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if(ia !== ib) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      return a.localeCompare(b);
    });
    // A filter that no longer matches anything — the entry it was on was
    // corrected away, or another shipment was opened — falls back to all.
    if(_actFilter.ref !== 'all' && !refCount[_actFilter.ref]) _actFilter.ref = 'all';
    const byRef = _actFilter.ref === 'all' ? all : all.filter(a => activityRef(a) === _actFilter.ref);
    const groupCount = {};
    byRef.forEach(a => { const g = actGroupOf(a); groupCount[g] = (groupCount[g]||0) + 1; });
    const shown = _actFilter.group === 'all' ? byRef : byRef.filter(a => actGroupOf(a) === _actFilter.group);
    const chip = (on, key, attr, label, n) =>
      `<span class="${on?'on':''}" data-${attr}="${escapeHtml(key)}">${label}${
        n != null ? `<i>${n}</i>` : ''}</span>`;
    const kindRow = `<div class="actfil">
      ${chip(_actFilter.group === 'all', 'all', 'actg', 'All', byRef.length)}
      ${ACT_GROUPS.filter(g => groupCount[g.id]).map(g =>
        chip(_actFilter.group === g.id, g.id, 'actg', g.label, groupCount[g.id])).join('')}
    </div>`;
    // Only worth offering when the shipment really is split — on a single
    // consignment every entry would carry the same chip.
    const refRow = refs.length > 1 ? `<div class="actfil refs">
      ${chip(_actFilter.ref === 'all', 'all', 'actr', 'Everything')}
      ${refs.map(r => chip(_actFilter.ref === r, r, 'actr', escapeHtml(r), refCount[r])).join('')}
    </div>` : '';
    if(shown.length === 0) return kindRow + refRow +
      `<div style="font-size:12.5px;color:var(--muted);padding:4px 0;">Nothing here under this filter.</div>`;
    // Newest first and capped, because the thing you came to read is almost
    // always at the top and a season's worth below it just gets in the way.
    const cut = _actFilter.showAll ? shown : shown.slice(0, ACT_PAGE);
    return kindRow + refRow + cut.map(a => actEntryHtml(a, stepNo, steps)).join('')
      + (cut.length < shown.length
        ? `<button class="actmore" id="act-more">Show all ${shown.length}</button>` : '');
  }
  function activityHtml(s){
    return `<div id="act-body">${activityBodyHtml(s)}</div>`;
  }
  // Chips and "show all" repaint the feed in place — re-rendering the whole
  // shipment would scroll the page back to the top, away from what is being
  // read.
  function wireActivity(s){
    const body = document.getElementById('act-body');

    const repaint = () => { body.innerHTML = activityBodyHtml(s); wireActivity(s); };
    body.querySelectorAll('[data-actg]').forEach(el => el.onclick = () => {

  // Wire up any "View photo" links just rendered — fetched on demand rather

  // ---- photo capture, kept in its own small collection ----
  const PHOTOS = 'fwd_photos';
  const REMARKS = 'fwd_remarks';
  async function saveRemark(s, text){
    const now = new Date();
    const rec = { id: uid(), shipId: s.id, awb: s.awb, type: s.type,
      customer: s.customer || '', date: todayStr(), at: now.toISOString(),
      by: ME.name, text };
    try{
      await db.collection(REMARKS).doc(rec.id).set(rec);
      // Today's list is cached, so drop it or a remark just written
      // wouldn't appear until the next session.
      delete _remarksCache[rec.date];

  async function getRemarksOn(dateStr){
    const snap = await withTimeout(
      db.collection(REMARKS).where('date','==', dateStr).get(), 15000, 'Loading remarks');

  // Two sizes, by what the photo is for. A document has to stay readable —
  // an AWB, a K1, a delivery order, or damage being surveyed for a claim.
  // A proof-of-handover shot of a lorry and its cargo does not, and delivery
  // runs are by far the most frequent photo taken, so they are stored
  // smaller. That roughly halves the storage a busy year uses.
  const PHOTO_DOC = { max: 800, q: 0.85 };
  const PHOTO_PROOF = { max: 640, q: 0.70 };
  // Every photo id a shipment refers to, wherever it hangs — the activity
  // feed, delivery runs on lots or on an export, and both ends of a survey.
  function photoIdsOf(s){
    const ids = [];
    (s.activity||[]).forEach(a => { if(a.photoId) ids.push(a.photoId); });
    (s.lots||[]).forEach(l => (l.deliveries||[]).forEach(d => { if(d.photoId) ids.push(d.photoId); }));
    (s.deliveries||[]).forEach(d => { if(d.photoId) ids.push(d.photoId); });
    (s.surveys||[]).forEach(r => {
      if(r.photoId) ids.push(r.photoId);
      if(r.closingPhotoId) ids.push(r.closingPhotoId);
      (r.photoIds||[]).forEach(p => ids.push(p));
    });
    return Array.from(new Set(ids.filter(Boolean)));
  }
  // WebP stores the same picture in a fraction of the bytes — most of all
  // for the document photographs this app takes most of, where it runs
  // around 70% smaller than JPEG at the same quality setting. Every photo is
  // base64 inside a Firestore document, and base64 adds another third on
  // top, so the format is the difference between filling the free gigabyte
  // within months and not.
  //
  // It has to be checked rather than assumed: a canvas asked for a format it
  // cannot encode returns PNG without complaining, and PNG of a photograph
  // is far larger than the JPEG it replaced. Old photos stay JPEG and still
  // display; nothing needs converting.
  let _webpOk = null;
  function photoType(){
    if(_webpOk === null){
      try{
        const c = document.createElement('canvas');
        c.width = c.height = 1;
        _webpOk = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
      }catch(e){ _webpOk = false; }
    }
    return _webpOk ? 'image/webp' : 'image/jpeg';
  }
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read the photo.'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not read the photo.'));
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL(photoType(), quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  // ---- survey reports ----
  // Raised against a shipment when cargo turns up wet, torn, damaged or short
  // landed. The report lives on the shipment itself (like the activity feed)
  // so opening a shipment costs no extra reads, and is mirrored into its own
  // collection so the Surveys tab can pull a whole day's reports for a claim
  // without loading every shipment. Photos go to fwd_photos like every other
  // photo in the app; only their ids are stored here.
  const SURVEYS = 'fwd_surveys';
  const SURVEY_CONDITIONS = [
    { key:'wet',     label:'Wet' },
    { key:'torn',    label:'Torn' },
    { key:'damaged', label:'Damaged' },
    { key:'short',   label:'Short landed' }
  ];
  let _surveysDate = null;
  const _surveysCache = {};
  function conditionLabels(keys){
    return (keys||[]).map(k => (SURVEY_CONDITIONS.find(c=>c.key===k)||{}).label || k);
  }
  function surveyStatusChip(r){
    return surveyOpen(r)
      ? `<span class="lot-tag" style="background:rgba(242,169,59,.18);color:var(--amber-dark,#C97F12);">CREATED</span>`
      : `<span class="lot-tag" style="background:rgba(31,157,107,.14);color:var(--green);">CLOSED</span>`;
  }
  function surveyChipsHtml(keys){
    return conditionLabels(keys).map(l =>
      `<span class="lot-tag" style="background:rgba(214,69,69,.14);color:var(--red);">${escapeHtml(l)}</span>`).join(' ');

  // A survey runs in two steps, each with exactly one photo: raised when the
  // damage is found (Created), then closed once it has been dealt with
  // (Closing). Both photos matter for a claim — one showing the state it
  // arrived in, one showing how it was left.
  function surveyOpen(r){ return (r.status || 'created') !== 'closed'; }
  function refreshSurveyFlags(s){
    const list = s.surveys || [];

  async function mirrorSurvey(s, rec){
    // Mirror for the Surveys tab. A failure here costs the day view, not the

    try{

        ...rec, shipId: s.id, awb: s.awb, type: s.type, customer: s.customer || ''
      });

      if(rec.closedDate) delete _surveysCache[rec.closedDate];
    }catch(e){ console.error('Could not index survey report:', e); }

  async function saveSurvey(s, rec){
    s.surveys = s.surveys || [];

      `Survey raised — ${conditionLabels(rec.conditions).join(', ')}` +
      (rec.pcs ? ` (${rec.pcs} pcs)` : '') + (rec.hawb ? ` on ${rec.hawb}` : ''),
      'survey', rec.photoId || null, rec.hawb || '');

    await mirrorSurvey(s, rec);

  async function closeSurvey(s, surveyId, photoId){

  // Every survey still open, whatever day it was raised. A survey left open

      const snap = await withTimeout(
        db.collection(SURVEYS).where('status','==','created').get(), 15000, 'Loading open surveys');
      _openSurveys = snap.docs.map(d => d.data())
        .sort((a,b)=> String(a.at).localeCompare(String(b.at)));

  // Survey charges cannot be read off the board. A report is often raised on
  // a lot that has already been closed — the damage turns up at delivery —
  // and a closed shipment is not loaded, so the charge would never be seen.
  // These come from the survey index itself instead, which knows nothing
  // about whether the shipment is still open.
  let _svCharges = null;
  async function refreshSurveyCharges(){
    try{
      const snap = await withTimeout(
        db.collection(SURVEYS).where('date','>=', CHARGES_FROM).get(), 15000, 'Loading survey charges');
      _svCharges = snap.docs.map(d => d.data());

      console.error('Could not load survey charges:', e);

  }

  async function getSurveysOn(dateStr){
    const snap = await withTimeout(
      db.collection(SURVEYS).where('date','==', dateStr).get(), 15000, 'Loading survey reports');
    return snap.docs.map(d => d.data()).sort((a,b)=> String(b.at).localeCompare(String(a.at)));
  }
  // ---- where photographs live ----
  //
  // In R2, behind a small Worker, rather than as base64 inside Firestore
  // documents. Base64 costs a third extra on top of the image, and a busy
  // year of invoice photographs would fill the free gigabyte that the
  // shipment records themselves barely touch.
  //
  // Set PHOTO_WORKER to the Worker's address to turn this on. Left empty,
  // everything below falls back to Firestore and the app behaves exactly as
  // it did before — which is also what happens if R2 cannot be reached, so
  // a photograph is never lost to a network problem.
  const PHOTO_WORKER = '';
  const PHOTO_KEY = '';
  const photoWorkerOn = () => !!(PHOTO_WORKER && PHOTO_KEY);
  // An id from R2 is 32 hex characters; one from Firestore is whatever uid()
  // made. That tells the reader where to look without recording it anywhere,
  // so a shipment saved before the move still opens afterwards.
  const isR2Id = id => /^[0-9a-f]{32}$/.test(String(id || ''));

  async function savePhoto(dataUrl){
    if(photoWorkerOn()){
      try{
        // Sent as bytes rather than as the base64 text, which is the whole
        // point: a third of the transfer disappears with the encoding.
        const blob = await (await fetch(dataUrl)).blob();
        const res = await withTimeout(fetch(PHOTO_WORKER + '/p', {
          method: 'POST',
          headers: { 'Content-Type': blob.type || 'image/webp',
            'X-Key': PHOTO_KEY, 'X-By': (ME && ME.name) || '' },
          body: blob
        }), 20000, 'Uploading photo');
        if(res.ok){
          const j = await res.json();
          if(j && j.id) return j.id;
        }
        console.error('Photo upload refused:', res.status, await res.text().catch(()=>''));
      }catch(e){
        console.error('Could not reach the photo store, keeping this one in Firestore:', e);
      }
    }
    // Either the Worker is not configured, or it could not be reached. A
    // photograph that cannot be stored would otherwise stop someone
    // recording a delivery, so it goes where it always went.
    const id = uid();
    await db.collection(PHOTOS).doc(id).set({ photo: dataUrl, by: ME.name, at: new Date().toISOString() });
    return id;
  }
  // The bytes for one photo, wherever it happens to live. Returns something
  // an <img> can show, or null.
  async function loadPhoto(id){
    if(photoWorkerOn() && isR2Id(id)){
      const res = await withTimeout(fetch(PHOTO_WORKER + '/p/' + encodeURIComponent(id),
        { headers: { 'X-Key': PHOTO_KEY } }), 20000, 'Loading photo');
      if(res.status === 404) return null;
      if(!res.ok) throw new Error('photo store said ' + res.status);
      return URL.createObjectURL(await res.blob());
    }
    const doc = await withTimeout(db.collection(PHOTOS).doc(id).get(), 15000, 'Loading photo');
    return doc.exists ? doc.data().photo : null;
  }
  // Forgetting one, wherever it lives. Never throws: a photo that will not
  // delete must not stop a shipment being deleted.
  async function dropPhoto(id){

          { method: 'DELETE', headers: { 'X-Key': PHOTO_KEY } });
        return;
      }
      await db.collection(PHOTOS).doc(id).delete();

  // The survey report section shown on every shipment, above the activity

        </div>` : ''}

          No survey raised. Raise one if the cargo is wet, torn, damaged or short landed.</div>`}
        ${CAN_EDIT ? `<button class="lot-act needs-input" id="survey-add" style="margin-top:12px;">
          ${list.length ? 'Add another survey report' : 'Raise a survey report'}</button>` : ''}
      </div>`;
  }
  // Wires the button rendered above. backTo repaints whichever detail view

  function wireSurveySection(s){

  // Full-screen form: what is wrong, how many pieces, which HAWB, notes, and

              style="cursor:pointer;padding:9px 14px;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--muted);">
