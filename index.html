      const host = document.getElementById('rm-rows');
      if(shown.length === 0){
        host.innerHTML = `<div class="empty">${q ? 'Nothing matches that search.'
          : `No remarks were written ${isToday ? 'today' : 'on this day'}.`}</div>`;
        return;
      }
      host.innerHTML = shown.map(r => `
        <div class="row" data-open="${escapeHtml(r.shipId)}">
          <div class="row-top">
            <span class="awb">${escapeHtml(r.awb)}<span class="kind ${r.type==='export'?'exp':'imp'}">${r.type==='export'?'EXP':'IMP'}</span></span>
            <span class="route">${escapeHtml(new Date(r.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}))}</span>
          </div>
          <div class="noteline" style="margin-top:8px;">${escapeHtml(r.text)}
            <div class="who">${escapeHtml(r.by||'')}${r.customer?` &middot; ${escapeHtml(r.customer)}`:''}</div></div>
        </div>`).join('');
      host.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
        if(el.dataset.open) renderDetail(el.dataset.open); });
    }
    renderRemarkRows();

    function shiftDay(delta){
      const d = new Date(day + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      const next = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(next > todayStr()) return;
      _remarksDate = next; paintShell();
    }
    document.getElementById('rm-prev').onclick = () => shiftDay(-1);
    if(!isToday) document.getElementById('rm-next').onclick = () => shiftDay(1);
    document.getElementById('rm-date').onchange = (e) => {
      const v = e.target.value;
      if(!v || v > todayStr()) return;
      _remarksDate = v; paintShell();
    };
    const back = document.getElementById('rm-today');
    if(back) back.onclick = () => { _remarksDate = todayStr(); paintShell(); };
    const rmSearch = document.getElementById('rm-search');
    rmSearch.oninput = () => { STATE.searchRemarks = rmSearch.value; renderRemarkRows(); };
  }

  // ============================================================
  // Surveys — every damage report raised on a chosen day, in one
  // place. This is the view to open when a claim needs putting
  // together: the conditions, the pieces, the notes and the photos,
  // without hunting through shipments one at a time.
  // ============================================================
  async function paintSurveys(c){
    if(!_surveysDate) _surveysDate = todayStr();
    const day = _surveysDate;

    if(!_surveysCache[day]){
      c.innerHTML = `<div class="empty">Loading survey reports…</div>`;
      try{ _surveysCache[day] = await getSurveysOn(day); }
      catch(e){ renderLoadError(e, () => paintShell()); return; }
    }
    const all = _surveysCache[day];
    const isToday = day === todayStr();
    const niceDay = new Date(day + 'T00:00:00').toLocaleDateString(undefined,
      { weekday:'short', day:'numeric', month:'short', year:'numeric' });
    const pcsTotal = all.reduce((n,r)=> n + (Number(r.pcs) || 0), 0);
    if(_openSurveys === null) await refreshOpenSurveys();
    const stillOpen = _openSurveys || [];
    // Oldest first out of the query, so the head of the list is the one
    // that has been waiting longest.
    const oldest = stillOpen[0];
    const daysOld = oldest
      ? Math.floor((Date.now() - Date.parse(oldest.at)) / 86400000) : 0;

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n">${all.length}</div>
          <div class="l">report${all.length===1?'':'s'} ${isToday ? 'today' : 'on ' + escapeHtml(niceDay)}</div></div>
        <div class="count"><div class="n" style="${stillOpen.length?'color:var(--amber);':''}">${stillOpen.length || '—'}</div>
          <div class="l">open, all dates</div></div>
        <div class="count"><div class="n">${pcsTotal || '—'}</div><div class="l">pcs affected</div></div>
      </div>
      ${stillOpen.length ? `
        <div class="viewer-strip" id="sv-alert" style="background:rgba(214,69,69,.10);border-color:var(--red);
          color:var(--text);cursor:pointer;">
          <b>${stillOpen.length} survey report${stillOpen.length===1?'':'s'} still open</b> —
          raised but not closed${oldest ? `, the oldest ${daysOld === 0 ? 'today' : daysOld + ' day' + (daysOld===1?'':'s') + ' ago'}
            on ${escapeHtml(oldest.awb||'')}` : ''}.
          ${STATE.surveysOpenOnly ? 'Showing them now — tap to go back to the day.' : 'Tap to list them.'}
        </div>` : ''}
      <div style="display:flex;gap:8px;align-items:center;margin:12px 12px 4px;">
        <button class="lot-act ghost" id="sv-prev" style="width:auto;padding:9px 12px;border-radius:9px;">&larr;</button>
        <input type="date" id="sv-date" value="${day}" max="${todayStr()}"
          style="flex:1;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        <button class="lot-act ghost" id="sv-next" ${isToday ? 'disabled' : ''}
          style="width:auto;padding:9px 12px;border-radius:9px;${isToday ? 'opacity:.4;cursor:default;' : ''}">&rarr;</button>
      </div>
      ${!isToday ? `<div style="margin:0 12px 6px;text-align:right;">
        <span id="sv-today" style="font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;">Back to today</span></div>` : ''}
      <div style="padding:6px 12px 4px;">
        <input id="sv-search" placeholder="Search AWB, customer, author or notes…" value="${escapeHtml(STATE.searchSurveys||'')}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="sv-rows"></div>
      <div style="height:20px;"></div>`;

    function renderSurveyRows(){
      const q = (STATE.searchSurveys||'').trim().toLowerCase();
      // Either the chosen day, or every report still open regardless of when
      // it was raised — which is what the alert above switches to.
      const source = STATE.surveysOpenOnly ? stillOpen : all;
      const shown = !q ? source : source.filter(r =>
        String(r.awb||'').toLowerCase().includes(q) ||
        String(r.customer||'').toLowerCase().includes(q) ||
        String(r.by||'').toLowerCase().includes(q) ||
        String(r.notes||'').toLowerCase().includes(q) ||
        conditionLabels(r.conditions).join(' ').toLowerCase().includes(q));
      const host = document.getElementById('sv-rows');
      if(shown.length === 0){
        host.innerHTML = `<div class="empty">${q ? 'Nothing matches that search.'
          : STATE.surveysOpenOnly ? 'Every survey report has been closed.'
          : `No survey reports were raised ${isToday ? 'today' : 'on this day'}.`}</div>`;
        return;
      }
      host.innerHTML = shown.map(r => `
        <div class="row" data-open="${escapeHtml(r.shipId)}" style="cursor:pointer;">
          <div class="row-top">
            <span class="awb">${escapeHtml(r.awb)}<span class="kind ${r.type==='export'?'exp':'imp'}">${r.type==='export'?'EXP':'IMP'}</span></span>
            <span class="route">${escapeHtml(STATE.surveysOpenOnly
              ? dayOf(r.date)
              : new Date(r.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}))}</span>
          </div>
          <div style="margin-top:8px;">${surveyStatusChip(r)} ${surveyChipsHtml(r.conditions)}
            ${r.pcs ? `<span style="font-size:12px;color:var(--red);font-weight:700;margin-left:4px;">${escapeHtml(String(r.pcs))} pcs</span>` : ''}
            ${r.hawb ? `<span style="font-size:12px;color:var(--muted);margin-left:4px;">on ${escapeHtml(r.hawb)}</span>` : ''}
          </div>
          ${r.notes ? `<div class="noteline" style="margin-top:8px;border-left-color:${surveyOpen(r)?'var(--red)':'var(--green)'};">${escapeHtml(r.notes)}</div>` : ''}
          <div class="who" style="margin-top:6px;">Raised by ${escapeHtml(r.by||'')}${r.customer?` &middot; ${escapeHtml(r.customer)}`:''}
            ${(r.photoId ? [r.photoId] : (r.photoIds||[])).map((pid,i,arr)=>
              ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(pid)}">Photo${arr.length>1?' '+(i+1):''}</span>`).join('')}
          </div>
          ${!surveyOpen(r) ? `<div class="who" style="color:var(--green);">Closed by ${escapeHtml(r.closedBy||'')}${r.closedAt?`, ${new Date(r.closedAt).toLocaleString()}`:''}
            ${r.closingPhotoId ? ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(r.closingPhotoId)}">Closing photo</span>` : ''}
          </div>` : ''}
        </div>`).join('');
      // The whole card opens the shipment, except the photo links inside it,
      // which have their own job.
      host.querySelectorAll('[data-open]').forEach(el => el.onclick = (e) => {
        if(e.target.closest('[data-viewphoto]')) return;
        renderDetail(el.dataset.open);
      });
      wireActivityPhotoLinks(host);
    }
    renderSurveyRows();

    function shiftDay(delta){
      const d = new Date(day + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      const next = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(next > todayStr()) return;
      _surveysDate = next; STATE.surveysOpenOnly = false; paintShell();
    }
    document.getElementById('sv-prev').onclick = () => shiftDay(-1);
    if(!isToday) document.getElementById('sv-next').onclick = () => shiftDay(1);
    document.getElementById('sv-date').onchange = (e) => {
      const v = e.target.value;
      if(!v || v > todayStr()) return;
      _surveysDate = v; STATE.surveysOpenOnly = false; paintShell();
    };
    const back = document.getElementById('sv-today');
    if(back) back.onclick = () => { _surveysDate = todayStr(); paintShell(); };
    const svSearch = document.getElementById('sv-search');
    svSearch.oninput = () => { STATE.searchSurveys = svSearch.value; renderSurveyRows(); };
    const svAlert = document.getElementById('sv-alert');
    if(svAlert) svAlert.onclick = () => { STATE.surveysOpenOnly = !STATE.surveysOpenOnly; paintShell(); };
  }

  // ============================================================
  // Charges — what the terminals are owed on cargo that has landed,
  // and a way to settle several AWBs in one go.
  // ============================================================
  // Shipments with a terminal charge still to pay, from two sources: the
  // board, which holds the live copy, and a flag stamped on every save so a
  // charge left unpaid when the shipment closed can still be found. Merged by
  // id, board copy first.
  let _openCharges = null;
  async function refreshOpenCharges(){
    try{
      const snap = await withTimeout(
        db.collection(SHIP).where('chargeOpen','==', true).get(), 15000, 'Loading open charges');
      _openCharges = migrateLoaded(snap.docs.map(d => d.data()));
    }catch(e){
      console.error('Could not load open charges:', e);
      if(_openCharges === null) _openCharges = [];
    }
  }
  // Duty is the other half of the same idea, and it needs its own query.
  // A shipment can have its terminal charge settled and still owe Customs —
  // which is the normal shape of a K1 import that has closed — and such a
  // record is not on the board and does not match chargeOpen, so nothing
  // fetched it. The dutyOpen flag was being written to every record and
  // never read back, which left duty on closed shipments invisible until
  // something else happened to load them, such as browsing to the day under
  // Completed. One more single-field query closes that.
  let _dutyOpen = null;
  async function refreshDutyOpen(){
    try{
      const snap = await withTimeout(
        db.collection(SHIP).where('dutyOpen','==', true).get(), 15000, 'Loading duty');
      _dutyOpen = migrateLoaded(snap.docs.map(d => d.data()));
    }catch(e){
      console.error('Could not load duty:', e);
      if(_dutyOpen === null) _dutyOpen = [];
    }
  }
  function invalidateOpenCharges(){ _openCharges = null; _dutyOpen = null; }
  // Shipments carrying a typed-in amount, fetched once and only when the
  // Edited tab is actually opened — a tab nobody visits should cost nothing.
  // One single-field query, the same shape as the open-charges one.
  let _editedShips = null;
  async function ensureEditedLoaded(){
    if(_editedShips !== null) return;
    try{
      const snap = await withTimeout(
        db.collection(SHIP).where('chargeEdited','==', true).get(), 15000, 'Loading edited charges');
      _editedShips = migrateLoaded(snap.docs.map(d => d.data()));
    }catch(e){
      console.error('Could not load edited charges:', e);
      _editedShips = [];
    }
  }
  function invalidateEditedCharges(){ _editedShips = null; }
  function chargeableShipments(){
    const seen = new Set();
    const out = [];
    STATE.shipments.filter(s => chargesDue(s) && !chargeSettled(s))
      .forEach(s => { seen.add(s.id); out.push(s); });
    (_openCharges || []).forEach(s => {
      if(seen.has(s.id)) return;
      if(!chargesDue(s) || chargeSettled(s)) return;   // the flag can lag a save
      seen.add(s.id);
      out.push(s);
    });
    return out.sort((a,b)=> String(a.awb).localeCompare(String(b.awb)));
  }
  // Survey reports waiting to be paid. Each one is its own bill against the
  // terminal, so it is listed and settled on its own — a report raised a
  // month after the handling was paid is no different from one raised the
  // same day, and nothing about the handling charge can bury it.
  //
  // Two sources, merged by report id: the shipments on the board, which hold
  // the live copy, and the survey index, which covers reports on shipments
  // that have already closed. The board copy wins where both have one.
  function pendingSurveyCharges(){
    const seen = new Set();
    const out = [];
    const add = (o) => { if(seen.has(o.rec.id)) return; seen.add(o.rec.id); out.push(o); };

    STATE.shipments.forEach(s => {
      if(!surveyChargeable(s)) return;
      const term = terminalObjForAwb(s.awb, STATE.terminals);
      unpaidSurveys(s).forEach(rec => {
        const when = rec.date || dayOf(rec.at);
        if(when && when < CHARGES_FROM) return;
        // A survey belongs to the house bill it was raised against, so the
        // charge line names that bill and keeps the master beside it — the
        // same shape as a handling line, so one bill reads the same way
        // wherever it appears.
        add({ s, shipId: s.id, awb: rec.hawb || s.awb, mawb: rec.hawb ? s.awb : null,
          type: s.type, customer: s.customer || '',
          rec, term, rate: surveyChargeRate(term),
          terminalName: term ? term.name : null, amount: surveyChargeRate(term) });
      });
    });

    (_svCharges || []).forEach(d => {
      if(!d || !d.id || surveyChargePaid(d)) return;
      if((d.type || 'import') === 'export') return;
      const when = d.date || dayOf(d.at);
      if(when && when < CHARGES_FROM) return;
      const term = terminalObjForAwb(d.awb, STATE.terminals);
      add({ s: STATE.shipments.find(x => x.id === d.shipId) || null,
        shipId: d.shipId, awb: d.hawb || d.awb || '', mawb: d.hawb ? (d.awb || null) : null,
        type: d.type || 'import', customer: d.customer || '',
        rec: d, term, rate: surveyChargeRate(term),
        terminalName: term ? term.name : null, amount: surveyChargeRate(term) });
    });

    return out.sort((a,b)=> String(a.awb).localeCompare(String(b.awb))
      || String(a.rec.at).localeCompare(String(b.rec.at)));
  }
  function surveyKey(rec){ return 'sv:' + rec.id; }
  function dutyShipments(){
    const seen = new Set();
    const out = [];
    STATE.shipments.filter(dutyDue).forEach(s => { seen.add(s.id); out.push(s); });
    // Three sources, board copy first: the board, the open-charge set, and
    // the duty flag — which is the only one that finds a closed shipment
    // whose terminal charge is already paid.
    const merge = (list) => (list || []).forEach(s => {
      if(seen.has(s.id) || !dutyDue(s)) return;   // the flag can lag a save
      seen.add(s.id); out.push(s);
    });
    merge(_openCharges);
    merge(_dutyOpen);
    return out.sort((a,b)=> String(a.awb).localeCompare(String(b.awb)));
  }
  const DUTY_TAB = '__duty';
  const EDITED_TAB = '__edited';
  // Every charge whose amount was typed in from the terminal's invoice rather
  // than worked out from the rates — still waiting to be paid, or already
  // settled that way. A record to review rather than a list to pay from: it
  // spans every payee at once, and a payment run is one payee, so nothing
  // here is tickable.
  //
  // Drawn from the shipments this session has in hand — the board, plus the
  // open-charge and shortfall sets it has loaded. A shipment settled and
  // closed long before today is not fetched again just to list it.
  function editedChargeItems(){
    const seen = new Set();
    const out = [];
    const consider = (s) => {
      if(!s || !s.id || seen.has(s.id)) return;
      seen.add(s.id);
      const o = s.chargeOverride;
      const paid = s.chargePaid && s.chargePaid.override ? s.chargePaid : null;
      if(!o && !paid) return;
      const term = chargeTermOf(s);
      const type = s.type === 'export' ? 'export' : 'import';
      const tObj = terminalObjForAwb(s.awb, STATE.terminals);
      // What the rates would have said, so the row can show the difference
      // the typed figure actually made.
      const auto = (tObj && ratesSet(tObj, type)) ? rateCharge(s, tObj, type).total : null;
      out.push({
        id: 'ed:' + s.id, s, shipId: s.id, awb: s.awb, type: s.type,
        customer: s.customer || '', terminalName: term,
        created: dayOf(s.createdAt),
        typed: Number(o ? o.amount : paid.total) || 0,
        calculated: auto,
        by: (o || paid).by || '', at: (o || paid).at || '',
        note: o ? (o.note || '') : '',
        photoId: o ? (o.photoId || null) : null,
        paid: !!paid, paidOn: paid ? (s.chargePaidOn || dayOf(paid.at)) : ''
      });
    };
    STATE.shipments.forEach(consider);
    (_openCharges || []).forEach(consider);
    (_editedShips || []).forEach(consider);
    // Newest first: a figure typed today is the one being questioned.
    return out.sort((a,b)=> String(b.at||b.created).localeCompare(String(a.at||a.created)));
  }
  // Handling charges, survey reports and duty are all lines waiting to be
  // paid, so the badge counts all three.
  //
  // It counts the same lines the sub-tabs do, which means counting bills
  // rather than shipments. A consolidation is one shipment but one bill per
  // house bill, and each is ticked and settled on its own — so counting
  // shipments made the badge read lower than the tabs it summarises, and
  // understated the work. chargeItems() already folds in the survey reports.
  function unpaidChargeCount(){
    return chargeItems().length + dutyShipments().length;
  }
  // Which terminal a shipment's charges belong to.
  function chargeTermOf(s){ return terminalForAwb(s.awb, STATE.terminals) || null; }

  // The rates give an estimate; the terminal's invoice is the bill. When the
  // two differ, the real figure is typed in here with a photo of the
  // invoice, so the number that gets paid can always be traced back to
  // paper.
  function renderChargeAdjust(s, onDone, onCancel){
    const c = document.getElementById('content') || document.getElementById('app');
    // What the rates say — which is not chargeFor()'s total once an amount
    // has already been typed in, because that returns the typed figure. On
    // "Change the amount" this read "Worked out from the rates as RM 333"
    // — quoting back the very number being corrected.
    const ch = chargeFor(s);
    const fromRates = ch.override && ch.calculated != null ? ch.calculated
      : (ch.ok ? ch.total : null);
    const already = paidHawbTotal(s);
    let file = null;
    c.innerHTML = `
      <div class="back" id="ca-bk">&larr; Cancel</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">Amount differs</div>
        <div class="meta">${escapeHtml(s.awb)}${s.customer?` &middot; ${escapeHtml(s.customer)}`:''}</div>
      </div>
      <div class="card">
        <div style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:12px;">
          Worked out from the rates as <b style="color:var(--text);">${fromRates != null ? money(fromRates) : '—'}</b>.
          Enter what the terminal actually charged${hawbList(s).length > 1
            ? ' for the whole AWB — it replaces the house bill charges, not added to them'
            : ''} and attach the invoice.
        </div>
        ${already > 0 ? `<div style="font-size:12px;color:var(--amber-dk);line-height:1.6;
          margin:-4px 0 12px;"><b>${money(already)}</b> has already been paid against
          individual house bills. That stays as it is and comes off the amount you
          enter, so only the remainder is left to pay.</div>` : ''}
        <div class="field" style="padding:0;"><label>Actual amount</label>
          <input type="number" min="0" step="0.01" id="ca-amt"
            value="${s.chargeOverride ? escapeHtml(String(s.chargeOverride.amount)) : ''}" placeholder="0.00"></div>
        <div class="field" style="padding:0;"><label>Note <span style="font-weight:400;color:var(--muted);text-transform:none;">— optional</span></label>
          <input type="text" id="ca-note" maxlength="60" placeholder="e.g. storage added"
            value="${s.chargeOverride && s.chargeOverride.note ? escapeHtml(s.chargeOverride.note) : ''}"></div>
        <div class="sect" style="margin:6px 0;">PHOTO OF THE INVOICE</div>
        <div id="ca-preview" style="margin-bottom:10px;">
          <div style="font-size:12.5px;color:var(--muted);">No photo taken yet — one is required.</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="ca-file" style="display:none;">
        <input type="file" accept="image/*" id="ca-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button class="lot-act ghost" id="ca-take" style="flex:1;">Take photo</button>
          <button class="lot-act ghost" id="ca-pick" style="flex:1;">Upload photo</button>
        </div>
        <button class="advance needs-input" id="ca-save" style="margin-top:14px;">
          <small>Replaces the calculated figure</small>Save the actual amount</button>
        <div id="ca-msg" style="margin-top:9px;font-size:12.5px;text-align:center;"></div>
      </div>
      <div style="height:20px;"></div>`;
    const msg = document.getElementById('ca-msg');
    function picked(input){
      file = input.files[0] || null;
      if(file) document.getElementById('ca-preview').innerHTML =
        `<img src="${URL.createObjectURL(file)}" style="max-width:100%;max-height:220px;border-radius:10px;">`;
    }
    document.getElementById('ca-take').onclick = () => document.getElementById('ca-file').click();
    document.getElementById('ca-pick').onclick = () => document.getElementById('ca-upload').click();
    document.getElementById('ca-file').onchange = function(){ picked(this); };
    document.getElementById('ca-upload').onchange = function(){ picked(this); };
    document.getElementById('ca-bk').onclick = () => onCancel();
    document.getElementById('ca-save').onclick = async function(){
      const raw = document.getElementById('ca-amt').value.trim();
      const amt = raw === '' ? NaN : Number(raw);
      if(isNaN(amt) || amt < 0){ msg.style.color='var(--red)'; msg.textContent='Enter the amount the terminal charged.'; return; }
      if(!file && !s.chargeOverride){ msg.style.color='var(--red)'; msg.textContent='Attach a photo of the invoice.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      try{
        let photoId = s.chargeOverride ? s.chargeOverride.photoId : null;
        if(file) photoId = await savePhoto(await resizeImageFile(file, PHOTO_DOC.max, PHOTO_DOC.q));
        const note = document.getElementById('ca-note').value.trim();
        s.chargeOverride = { amount: amt, note, photoId, by: ME.name, at: new Date().toISOString() };
        logActivity(s, `Terminal charge set to ${money(amt)} from the invoice` + (note ? ` — ${note}` : ''), 'edit', photoId);
        await saveShipment(s);
        onDone();
      }catch(e){
        this.disabled = false; this.textContent = 'Save the actual amount';
        msg.style.color='var(--red)'; msg.textContent = 'Could not save: ' + e.message;
      }
    };
  }

  // A payable line on this tab. Three kinds share the list: the terminal's
  // handling charge on a shipment, a survey report (its own bill, raised
  // whenever the damage is found), and duty owed to Customs. Each is ticked
  // and settled on its own, so a survey raised long after the handling was
  // paid simply appears as the next line to pay.
  // How long a charge has been sitting unpaid, and from when.
  //
  // Not the same clock the board runs. The board asks how long cargo has
  // been stuck at a step; this asks how long a bill has been payable, which
  // starts when the terminal first had the goods — the day the lot landed,
  // not the day the shipment was booked, since nothing is owed on cargo that
  // is still in the air.
  function chargeSince(i){
    if(!i) return null;
    if(i.kind === 'survey') return (i.rec && (i.rec.at || i.rec.date)) || null;
    // An edited charge is dated by the edit itself; that is the event the
    // Edited list is a record of.
    if(i.kind === 'edited' || i.typed !== undefined) return i.at || i.created || null;
    const s = i.s;
    if(!s) return null;
    if(s.type === 'import'){
      // A house bill is billed from its own cargo landing. With no lot mapped
      // to the bill, the shipment's own lots are the best available answer.
      const mine = (i.kind === 'hawb' && i.hawb) ? lotsForHawb(s, i.hawb.no) : (s.lots || []);
      const pool = mine.length ? mine : (s.lots || []);
      const times = pool.filter(l => lotHasCargo(l))
        .map(l => l.arrivedAt || l.stageAt).filter(Boolean).sort();
      if(times.length) return times[0];
    }
    // An export is billed once it has been taken in, and there is no separate
    // stamp for that, so the last thing that moved stands in for it.
    return s.stageAt || s.createdAt || null;
  }
  // Three days to settle a bill before it wants looking at. Amber from 60%
  // of that, the same proportion the board's stage thresholds use.
  const CHARGE_THRESH_H = 72;
  function chargeAgeHtml(i){
    const from = chargeSince(i);
    if(!from) return '';
    const lvl = ageLevel(ageHours(from), CHARGE_THRESH_H);
    return ` &middot; <span class="chage ${lvl}">${escapeHtml(ageStr(from))}</span>`;
  }
  // Oldest first: the whole point of the ordering is that whatever has been
  // owed longest is the first thing in front of you. Anything with no date to
  // go on sorts last rather than pretending to be ancient.
  function byAgeOldestFirst(a, b){
    const x = chargeSince(a), y = chargeSince(b);
    if(!x && !y) return 0;
    if(!x) return 1;
    if(!y) return -1;
    return String(x).localeCompare(String(y));
  }

  function chargeItems(){
    const out = [];
    chargeableShipments().forEach(s => {
      const hs = hawbList(s);
      const term = chargeTermOf(s);
      if(hs.length === 0){
        const ch = chargeFor(s);
        out.push({ kind:'handling', id:'h:'+s.id, s, ch, shipId: s.id, awb: s.awb,
          type: s.type, customer: s.customer || '',
          terminalName: term, amount: ch.ok ? ch.total : 0, ok: ch.ok });
        return;
      }
      // A typed-in invoice is one figure for the whole AWB, so it is billed
      // as one line and the house bills are not listed separately — there is
      // no way to split an invoice total across them without inventing an
      // allocation. House bills already paid on their own keep their records
      // and come off the figure inside chargeFor().
      if(s.chargeOverride && !s.chargePaid){
        const ch = chargeFor(s);
        if(ch.ok) out.push({ kind:'handling', id:'h:'+s.id, s, ch, shipId: s.id, awb: s.awb,
          type: s.type, customer: s.customer || '',
          terminalName: term, amount: ch.total, ok: true });
        return;
      }
      // One line per house bill, each settled on its own.
      hs.forEach(h => {
        if(hawbChargePaid(s, h.no)) return;
        // A house bill is billed when its own cargo is with the terminal.
        // One landing never drags the rest onto the tab: they are separate
        // consignments and separate bills, and the one still in the air
        // appears here the day it arrives.
        if(!hawbHasCargo(s, h.no)) return;
        const ch = chargeForHawb(s, h);
        out.push({ kind:'hawb', id:'hb:'+s.id+'::'+h.no, s, ch, hawb: h,
          shipId: s.id, awb: h.no, mawb: s.awb, type: s.type,
          customer: h.customer || s.customer || '',
          terminalName: term, amount: ch.ok ? ch.total : 0, ok: ch.ok && ch.total >= 0 && !ch.warn });
      });
      // Then whatever the terminal charges once on the master.
      if(!s.chargePaid){
        const cm = chargeForMaster(s);
        if(!cm.none) out.push({ kind:'handling', id:'h:'+s.id, s, ch: cm, shipId: s.id, awb: s.awb,
          type: s.type, customer: s.customer || '', masterOnly: true,
          terminalName: term, amount: cm.ok ? cm.total : 0, ok: cm.ok });
      }
    });
    pendingSurveyCharges().forEach(p => {
      out.push({ kind:'survey', id: surveyKey(p.rec), s: p.s, rec: p.rec,
        shipId: p.shipId, awb: p.awb, type: p.type, customer: p.customer,
        terminalName: p.terminalName, rate: p.rate,
        amount: p.amount, ok: !!p.terminalName });
    });
    return out;
  }

  async function paintCharges(c){
    // Read once per session: survey charges live in the survey index, not on
    // the board, because the shipment behind one is often already closed.
    if(_svCharges === null || _openCharges === null || _dutyOpen === null){
      c.innerHTML = `<div class="empty">Loading charges…</div>`;
      if(_svCharges === null) await refreshSurveyCharges();
      if(_openCharges === null) await refreshOpenCharges();
      if(_dutyOpen === null) await refreshDutyOpen();
    }
    // Only once the Edited tab is actually being shown — the query is not
    // worth a read for a tab nobody opened.
    if(STATE.chargeTerminal === EDITED_TAB && _editedShips === null){
      c.innerHTML = `<div class="empty">Loading edited charges…</div>`;
      await ensureEditedLoaded();
    }
    const items = chargeItems();
    const duty = dutyShipments();
    // One payee is always in view — a terminal, or Customs for duty. You
    // settle with them one at a time, and a list mixing payees could only
    // produce a figure paid to nobody.
    const names = STATE.terminals.map(t => t.name);
    const hasUnassigned = items.some(i => !i.terminalName);
    const edited = editedChargeItems();
    // The Edited tab is offered before its list is known. It used to appear
    // only once something edited had been found, but the query that finds
    // them does not run until the tab is picked — so an edited charge that
    // was already paid and closed could never surface it. Offering the tab
    // unloaded costs nothing and breaks the circle; the count arrives once
    // it has been opened.
    const edLoaded = _editedShips !== null;
    const showEdited = edited.length > 0 || !edLoaded;
    const choices = names.concat(hasUnassigned ? ['__none'] : []).concat(duty.length ? [DUTY_TAB] : [])
      .concat(showEdited ? [EDITED_TAB] : []);
    if(!choices.includes(STATE.chargeTerminal)) STATE.chargeTerminal = choices[0] || null;
    const pick = STATE.chargeTerminal;
    const isDuty = pick === DUTY_TAB;
    const isEdited = pick === EDITED_TAB;
    // The edited list is the only one filtered by date: narrowing a list you
    // pay from would hide bills that still have to be settled.
    const edFrom = STATE.chargeEditFrom || '', edTo = STATE.chargeEditTo || '';
    const editedShown = edited.filter(e => {
      if(edFrom && (!e.created || e.created < edFrom)) return false;
      if(edTo && (!e.created || e.created > edTo)) return false;
      return true;
    });
    const list = pick === null ? []
      : isEdited ? editedShown
      : isDuty ? duty.map(s => ({ kind:'duty', id:'d:'+s.id, s, shipId: s.id, awb: s.awb,
          type: s.type, customer: s.customer || '', terminalName:null,
          amount: dutyAmount(s), ok: dutyAmount(s) > 0 }))
      : items.filter(i => pick === '__none' ? !i.terminalName : i.terminalName === pick);
    const payeeLabel = pick === DUTY_TAB ? 'Customs (duty)'
      : pick === EDITED_TAB ? 'edited charges'
      : pick === '__none' ? 'lines with no terminal' : pick;
    const totalOf = arr => arr.reduce((n,i)=> n + (i.ok ? i.amount : 0), 0);

    if(choices.length === 0){
      c.innerHTML = `<div class="empty">Nothing is waiting to be paid.</div>`;
      return;
    }

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n">${isEdited ? (editedShown.length || '—') : (list.length || '—')}</div>
          <div class="l">${isEdited ? 'edited' : 'to pay'}</div></div>
        <div class="count"><div class="n">${(() => {
            const sum = isEdited ? editedShown.reduce((n,e)=> n + (e.typed||0), 0) : totalOf(list);
            return sum ? money(sum).replace('RM ','') : '—';
          })()}</div>
          <div class="l">RM ${isEdited ? 'as typed' : 'outstanding'}</div></div>
        ${(() => {
          // The worst case, before anyone scrolls. On the Edited tab there is
          // nothing to chase, so it is left off.
          if(isEdited) return '';
          const dated = list.map(chargeSince).filter(Boolean).sort();
          if(!dated.length) return '';
          const lvl = ageLevel(ageHours(dated[0]), CHARGE_THRESH_H);
          const over = list.filter(i => {
            const f = chargeSince(i);
            return f && ageHours(f) >= CHARGE_THRESH_H;
          }).length;
          return `<div class="count">
            <div class="n" style="color:${lvl==='bad'?'var(--red)':lvl==='warn'?'var(--amber-dk)':'var(--ink)'};">
              ${escapeHtml(ageStr(dated[0]))}</div>
            <div class="l">oldest${over ? ` &middot; ${over} over 3d` : ''}</div></div>`;
        })()}
      </div>
      <div class="filters" style="background:var(--paper);">
        ${STATE.terminals.map(t=>{
          const n = items.filter(i => i.terminalName === t.name).length;
          return `<span style="color:${pick===t.name?'var(--ink)':'var(--muted)'};
            border-bottom-color:${pick===t.name?'var(--ink)':'transparent'};"
            data-cf="${escapeHtml(t.name)}">${escapeHtml(t.name)}${n?` (${n})`:''}</span>`;
        }).join('')}
        ${hasUnassigned ? (() => {
          // An AWB whose prefix matches no terminal cannot be priced, so it
          // lands here — easy to miss when the tab opens on a terminal, which
          // is why the count is red rather than grey.
          const n = items.filter(i => !i.terminalName).length;
          return `<span style="color:${pick==='__none'?'var(--ink)':'var(--red)'};font-weight:700;
            border-bottom-color:${pick==='__none'?'var(--ink)':'transparent'};"
            data-cf="__none">Not set (${n})</span>`;
        })() : ''}
        ${duty.length ? `<span style="color:${isDuty?'var(--ink)':'var(--muted)'};
          border-bottom-color:${isDuty?'var(--ink)':'transparent'};" data-cf="${DUTY_TAB}">Duty (${duty.length})</span>` : ''}
        ${showEdited ? `<span style="color:${isEdited?'var(--ink)':'var(--amber-dk)'};font-weight:700;
          border-bottom-color:${isEdited?'var(--ink)':'transparent'};"
          data-cf="${EDITED_TAB}">Edited${edLoaded ? ` (${edited.length})` : ''}</span>` : ''}
      </div>
      ${isEdited ? `
      <div style="margin:4px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
        Charges where the amount was typed in from the terminal's invoice instead of
        worked out from the rates. A record to check, not a list to pay from &mdash;
        open a row to settle or change it.
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end;margin:10px 12px 0;">
        <div style="flex:1 1 0;min-width:0;">
          <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;">CREATED FROM</label>
          <input type="date" id="ch-ed-from" value="${escapeHtml(edFrom)}"
            style="width:100%;min-width:0;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 8px;font-size:14px;">
        </div>
        <div style="flex:1 1 0;min-width:0;">
          <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;">TO</label>
          <input type="date" id="ch-ed-to" value="${escapeHtml(edTo)}"
            style="width:100%;min-width:0;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 8px;font-size:14px;">
        </div>
        ${(edFrom || edTo) ? `<button class="lot-act ghost" id="ch-ed-clear"
          style="flex:0 0 auto;width:auto;padding:9px 11px;border-radius:9px;">Clear</button>` : ''}
      </div>` : ''}
      <div style="padding:10px 12px 4px;">
        <input id="ch-search" placeholder="Search AWB or customer…" value="${escapeHtml(STATE.searchCharges||'')}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="ch-rows"></div>
      ${(isEdited && IS_ADMIN) ? `<div style="margin:14px 12px 0;text-align:center;">
        <button class="lot-act ghost" id="ch-ed-scan" style="width:auto;padding:8px 14px;border-radius:9px;font-size:12px;">
          Scan older shipments for edited charges</button>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6;">
          Only needed once &mdash; finds shipments whose amount was typed in and that were
          paid and closed before this list existed.</div>
      </div>` : ''}
      <div id="ch-bar"></div>
      <div style="height:80px;"></div>`;

    // Changing terminal clears the ticks — a payment run is one payee.
    c.querySelectorAll('[data-cf]').forEach(el=>{
      el.onclick = () => {
        STATE.chargeTerminal = el.dataset.cf; STATE.chargesPicked = {};
        STATE.chargeEditPage = 0; paintShell();
      };
    });
    const chSearch = document.getElementById('ch-search');
    chSearch.oninput = () => {
      STATE.searchCharges = chSearch.value; STATE.chargeEditPage = 0; draw(); };
    const edFromEl = document.getElementById('ch-ed-from');
    const edToEl = document.getElementById('ch-ed-to');
    if(edFromEl) edFromEl.onchange = () => {
      STATE.chargeEditFrom = edFromEl.value; STATE.chargeEditPage = 0; paintShell(); };
    if(edToEl) edToEl.onchange = () => {
      STATE.chargeEditTo = edToEl.value; STATE.chargeEditPage = 0; paintShell(); };
    const edClear = document.getElementById('ch-ed-clear');
    if(edClear) edClear.onclick = () => {
      STATE.chargeEditFrom = ''; STATE.chargeEditTo = ''; STATE.chargeEditPage = 0; paintShell();
    };
    // The flag is stamped on every save from now on, so only shipments that
    // were already paid and closed before it existed are unfindable. This
    // reads the closed ones once and marks them, so the list is complete
    // from then on. Closed only: an open one is on the board already.
    const edScan = document.getElementById('ch-ed-scan');
    if(edScan) edScan.onclick = async () => {
      if(!confirm('Check every closed shipment for amounts that were typed in?\n\n'
        + 'This reads them all once and marks any it finds, so they show here from now on.')) return;
      edScan.disabled = true; edScan.textContent = 'Scanning…';
      try{
        const snap = await withTimeout(db.collection(SHIP).where('closed','==', true).get(),
          30000, 'Scanning shipments');
        let found = 0;
        const toMark = [];
        snap.docs.forEach(d2 => {
          const sh = d2.data();
          const edited = !!(sh.chargeOverride || (sh.chargePaid && sh.chargePaid.override));
          if(edited) found++;
          if(edited !== !!sh.chargeEdited) toMark.push({ id: sh.id, edited });
        });
        // Written in batches rather than one at a time: a few years of closed
        // shipments is a lot of round trips to make someone wait through.
        const fixed = toMark.length;
        for(let i = 0; i < toMark.length; i += 400){
          const batch = db.batch();
          toMark.slice(i, i + 400).forEach(x =>
            batch.set(db.collection(SHIP).doc(x.id), { chargeEdited: x.edited }, { merge: true }));
          await batch.commit();
        }
        invalidateEditedCharges();
        alert(found
          ? `Found ${found} closed shipment${found===1?'':'s'} with a typed-in amount`
            + `${fixed ? `, ${fixed} newly marked.` : ', all already marked.'}`
          : 'No closed shipments have a typed-in amount.');
        paintShell();
      }catch(e){
        edScan.disabled = false; edScan.textContent = 'Scan older shipments for edited charges';
        alert('Scan failed: ' + (e.message || e));
      }
    };

    function rowHtml(i){
      const s = i.s;
      const picked = !!STATE.chargesPicked[i.id];
      const tick = CAN_EDIT && i.ok
        ? `<input type="checkbox" data-pick="${escapeHtml(i.id)}" ${picked?'checked':''}
            style="width:19px;height:19px;margin-top:3px;flex:0 0 auto;cursor:pointer;">`
        : '';
      const head = `
        <div class="row-top">
          <span class="awb">${escapeHtml(i.awb||'')}<span class="kind ${i.type==='export'?'exp':'imp'}">${i.type==='export'?'EXP':'IMP'}</span>${
            i.kind === 'duty' && s && isK1Shipment(s) ? `<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">K1</span>` : ''}${
            i.kind === 'survey' ? `<span class="kind" style="background:rgba(214,69,69,.14);color:var(--red);">SR</span>` : ''}</span>
          <span class="awb" style="font-size:14px;color:${i.ok?'var(--ink)':'var(--red)'};">
            ${i.ok ? money(i.amount) : '—'}</span>
        </div>`;

      // An edited charge is a record, not a bill: it names what was typed,
      // what the rates would have said, who typed it and why.
      if(i.kind === 'edited' || i.typed !== undefined){
        const diff = (i.calculated != null) ? (i.typed - i.calculated) : null;
        return `
        <div class="row" data-open="${escapeHtml(i.shipId||'')}">
          <div class="row-top">
            <span class="awb">${escapeHtml(i.awb||'')}<span class="kind ${i.type==='export'?'exp':'imp'}">${i.type==='export'?'EXP':'IMP'}</span>${
              i.paid ? `<span class="kind" style="background:rgba(31,157,107,.14);color:var(--green);">PAID</span>`
                     : `<span class="kind" style="background:rgba(242,169,59,.18);color:var(--amber-dk);">TO PAY</span>`}</span>
            <span class="awb" style="font-size:14px;color:var(--ink);">
              ${(i.calculated != null && i.calculated !== i.typed)
                ? `<span style="color:var(--muted);font-weight:500;text-decoration:line-through;margin-right:6px;">${money(i.calculated)}</span>` : ''}
              ${money(i.typed)}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">
            ${escapeHtml(i.customer||'—')}${i.terminalName?` &middot; ${escapeHtml(i.terminalName)}`:''}
            &middot; created ${escapeHtml(i.created||'—')}${chargeAgeHtml(i)}
          </div>
          <div style="font-size:12px;color:var(--amber-dk);font-weight:600;margin-top:4px;">
            ${diff != null
              ? `${diff === 0 ? 'Same as the rates'
                   : (diff > 0 ? '+' : '&minus;') + money(Math.abs(diff)) + ' against the rates'}`
              : 'No rates to compare against'}${
              i.by ? ` &middot; ${escapeHtml(i.by)}` : ''}${
              i.at ? ` &middot; ${escapeHtml(dayOf(i.at))}` : ''}${
              i.paid && i.paidOn ? ` &middot; paid ${escapeHtml(i.paidOn)}` : ''}
          </div>
          ${i.note ? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px;">
            ${escapeHtml(i.note)}</div>` : ''}
          ${i.photoId ? `<div style="margin-top:7px;">
            <span class="link-act" data-viewphoto="${escapeHtml(i.photoId)}">Invoice photo</span></div>` : ''}
        </div>`;
      }

      if(i.kind === 'survey'){
        const r = i.rec;
        const when = r.date || dayOf(r.at);
        return `
        <div class="row" style="display:flex;gap:11px;align-items:flex-start;">
          ${tick}
          <div style="flex:1;min-width:0;" data-open="${escapeHtml(i.shipId||'')}">
            ${head}
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">
              Survey report &middot; raised ${escapeHtml(when)}${r.by?` by ${escapeHtml(r.by)}`:''}
              ${i.terminalName?` &middot; ${escapeHtml(i.terminalName)}`:''}${chargeAgeHtml(i)}
            </div>
            <div style="margin-top:5px;">${surveyChipsHtml(r.conditions)}
              ${r.pcs?`<span style="font-size:12px;color:var(--red);font-weight:700;margin-left:4px;">${escapeHtml(String(r.pcs))} pcs</span>`:''}
              ${r.hawb?`<span style="font-size:12px;color:var(--muted);margin-left:4px;">on ${escapeHtml(r.hawb)}</span>`:''}
            </div>
            ${!i.terminalName ? `<div style="font-size:11.5px;color:var(--red);margin-top:4px;">
              No terminal matches this AWB prefix</div>`
              : i.rate <= 0 ? `<div style="font-size:11.5px;color:var(--red);margin-top:4px;">
              No survey rate set for ${escapeHtml(i.terminalName)}${IS_MOD?' — Settings.':''}</div>` : ''}
            ${r.photoId ? `<div style="margin-top:8px;">
              <span class="link-act" data-viewphoto="${escapeHtml(r.photoId)}">Survey photo</span></div>` : ''}
          </div>
        </div>`;
      }

      const ch = i.kind === 'duty' ? { ok: i.ok, lines: [] } : i.ch;
      return `
      <div class="row" style="display:flex;gap:11px;align-items:flex-start;">
        ${tick}
        <div style="flex:1;min-width:0;" data-open="${escapeHtml(i.shipId||'')}">
          <div class="row-top">
            <span class="awb">${escapeHtml(i.awb||'')}<span class="kind ${i.type==='export'?'exp':'imp'}">${i.type==='export'?'EXP':'IMP'}</span>${
              i.kind === 'duty' && s && isK1Shipment(s) ? `<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">K1</span>` : ''}${
              i.masterOnly ? `<span class="kind" style="background:rgba(107,122,147,.14);color:var(--muted);">MAWB</span>` : ''}</span>
            <span class="awb" style="font-size:14px;color:${i.ok?'var(--ink)':'var(--red)'};">
              ${(ch.override || ch.massend) && ch.calculated != null && ch.calculated !== i.amount
                ? `<span style="color:var(--muted);font-weight:500;text-decoration:line-through;margin-right:6px;">${money(ch.calculated)}</span>` : ''}
              ${i.ok ? money(i.amount) : '—'}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px;">
            ${i.mawb ? `on ${escapeHtml(i.mawb)} &middot; ` : ''}${escapeHtml(i.customer||'—')} &middot; ${
              i.kind === 'hawb'
                ? (i.hawb.kg != null ? escapeHtml(kgText(Number(i.hawb.kg))) : '?')
                : (s && s.kg!=null ? escapeHtml(String(s.kg)) : '?')} kg${
              i.kind === 'duty' ? '' : ` &middot; ${escapeHtml(i.terminalName||'no terminal')}`}${chargeAgeHtml(i)}
          </div>
          ${ch.note ? `<div style="font-size:11px;color:var(--muted);margin-top:5px;font-weight:600;">
            ${escapeHtml(ch.note)}</div>` : ''}
          ${(ch.lines||[]).length ? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.7;">
            ${ch.lines.map(l=>`${escapeHtml(l.label)} &middot; <b style="color:var(--text);">${money(l.amount)}</b>`).join('<br>')}
          </div>` : ''}
          ${ch.override ? `<div style="font-size:11px;color:var(--amber-dk);margin-top:4px;font-weight:600;">
            AMOUNT FROM THE INVOICE${ch.by?` &middot; ${escapeHtml(ch.by)}`:''} &middot; ready to pay</div>` : ''}
          ${ch.massend ? `<div style="font-size:11px;color:var(--green);margin-top:4px;font-weight:600;">
            MASSEND${ch.type === 'export' ? ' &middot; ready to pay' : ' &middot; nothing to pay'}</div>` : ''}
          ${!ch.ok && ch.why ? `<div style="font-size:11.5px;color:var(--red);margin-top:4px;">
            ${escapeHtml(ch.why)}${IS_MOD?' — set them under Settings.':''}</div>` : ''}
          ${ch.warn ? `<div style="font-size:11.5px;color:var(--red);margin-top:5px;line-height:1.6;">
            ${escapeHtml(ch.warn)}</div>` : ''}
          ${i.kind !== 'duty' && i.kind !== 'hawb' && CAN_EDIT && s ? `<div style="margin-top:8px;display:flex;gap:14px;flex-wrap:wrap;">
            <span class="link-act" data-adjust="${escapeHtml(s.id)}">${s.chargeOverride?'Change the amount':'Amount differs'}</span>
            ${ch.needsHawbKg ? `<span class="link-act" data-hawbkg="${escapeHtml(s.id)}"
              style="color:var(--red);">Add HAWB weights</span>` : ''}
            ${ch.override && ch.photoId ? `<span class="link-act" data-viewphoto="${escapeHtml(ch.photoId)}">Invoice photo</span>` : ''}
            ${massendEligible(s) ? `<span class="link-act" data-massend="${escapeHtml(s.id)}"
              style="color:${s.massend?'var(--green)':'var(--ink)'};">${s.massend?'Massend ✓ — undo':'Massend'}</span>` : ''}
          </div>` : ''}
        </div>
      </div>`;
    }

    function draw(){
      const host = document.getElementById('ch-rows');
      const q = (STATE.searchCharges||'').trim().toLowerCase();
      const rows = (!q ? list : list.filter(i =>
        String((i.s && i.s.awb) || i.awb || '').toLowerCase().includes(q) ||
        String((i.s && i.s.customer) || i.customer || '').toLowerCase().includes(q)))
        // Longest owed at the top, so the list reads as what to chase first.
        // The Edited tab is the exception: it is a record of amounts that
        // were typed in, and the useful end of that is the recent one.
        .slice().sort(isEdited ? (a,b)=> -byAgeOldestFirst(a,b) : byAgeOldestFirst);
      if(rows.length === 0){
        host.innerHTML = `<div class="empty">${q ? 'Nothing matches that search.'
          : 'Nothing is waiting to be paid for ' + escapeHtml(payeeLabel) + '.'}</div>`;
        paintBar();
        return;
      }
      // Handling and surveys are separate bills, so they are listed under
      // their own headings rather than run together.
      if(isEdited){
        // This list only ever grows — every amount ever typed in stays on it —
        // so it is read a page at a time rather than scrolled through. The
        // page is clamped rather than trusted: a date filter or a search can
        // shrink the list under a page number that was fine a moment ago.
        const pages = Math.max(1, Math.ceil(rows.length / ROWS_PER_PAGE));
        if(STATE.chargeEditPage >= pages) STATE.chargeEditPage = pages - 1;
        if(!(STATE.chargeEditPage >= 0)) STATE.chargeEditPage = 0;
        const from = STATE.chargeEditPage * ROWS_PER_PAGE;
        const page = rows.slice(from, from + ROWS_PER_PAGE);
        host.innerHTML = page.map(rowHtml).join('')
          + (pages > 1 ? `
          <div style="display:flex;align-items:center;gap:8px;padding:12px;">
            <button class="lot-act ghost" id="ch-ed-prev" ${STATE.chargeEditPage === 0 ? 'disabled' : ''}
              style="flex:0 0 auto;width:auto;padding:9px 14px;border-radius:9px;${
                STATE.chargeEditPage === 0 ? 'opacity:.35;' : ''}">&larr; Prev</button>
            <div style="flex:1;text-align:center;font-size:12px;color:var(--muted);">
              ${from + 1}&ndash;${from + page.length} of ${rows.length}
              <div style="font-size:11px;margin-top:2px;">Page ${STATE.chargeEditPage + 1} of ${pages}</div>
            </div>
            <button class="lot-act ghost" id="ch-ed-next" ${STATE.chargeEditPage >= pages - 1 ? 'disabled' : ''}
              style="flex:0 0 auto;width:auto;padding:9px 14px;border-radius:9px;${
                STATE.chargeEditPage >= pages - 1 ? 'opacity:.35;' : ''}">Next &rarr;</button>
          </div>` : '');
        host.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
          if(el.dataset.open) renderDetail(el.dataset.open); });
        wireActivityPhotoLinks(host);
        // Back to the first row on a page turn, rather than landing wherever
        // the last page was left.
        const turn = (d) => { STATE.chargeEditPage += d; draw(); host.scrollIntoView({ block:'start' }); };
        const pv = document.getElementById('ch-ed-prev');
        const nx = document.getElementById('ch-ed-next');
        if(pv && STATE.chargeEditPage > 0) pv.onclick = () => turn(-1);
        if(nx && STATE.chargeEditPage < pages - 1) nx.onclick = () => turn(1);
        paintBar();
        return;
      }
      const handling = rows.filter(i => i.kind !== 'survey');
      const surveys  = rows.filter(i => i.kind === 'survey');
      const section = (label, arr) => !arr.length ? '' : `
        <div style="padding:12px 13px 5px;font-size:11px;letter-spacing:.07em;font-weight:700;
          color:var(--muted);text-transform:uppercase;">${label} &middot; ${money(totalOf(arr))}</div>
        ${arr.map(rowHtml).join('')}`;
      host.innerHTML = (handling.length && surveys.length)
        ? section(isDuty ? 'Duty' : 'Terminal charges', handling) + section('Survey reports', surveys)
        : rows.map(rowHtml).join('');

      host.querySelectorAll('[data-pick]').forEach(cb=>{
        cb.onchange = () => {
          if(cb.checked) STATE.chargesPicked[cb.dataset.pick] = true;
          else delete STATE.chargesPicked[cb.dataset.pick];
          paintBar();
        };
      });
      host.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
        if(el.dataset.open) renderDetail(el.dataset.open); });
      host.querySelectorAll('[data-adjust]').forEach(el=>{
        el.onclick = (e) => {
          e.stopPropagation();
          const sh = STATE.shipments.find(x => x.id === el.dataset.adjust);
          if(sh) renderChargeAdjust(sh, () => paintShell(), () => paintShell());
        };
      });
      // Straight to the screen where the weights are entered, rather than
      // making someone find the shipment and remember what was missing.
      host.querySelectorAll('[data-hawbkg]').forEach(el=>{
        el.onclick = (e) => {
          e.stopPropagation();
          const sh = STATE.shipments.find(x => x.id === el.dataset.hawbkg);
          if(sh) renderEditShipment(sh);
        };
      });
      // Massend replaces the calculated charge with MASkargo's own terms —
      // nothing on an import, a flat fee on an export. Either way it is
      // settled through the normal payment run, so there is always a record
      // of who cleared it and when. It covers the handling only; a survey
      // report is the terminal's own inspection and is billed on its own.
      host.querySelectorAll('[data-massend]').forEach(el=>{
        el.onclick = async (e) => {
          e.stopPropagation();
          const sh = STATE.shipments.find(x => x.id === el.dataset.massend);
          if(!sh) return;
          const isExp = sh.type === 'export';
          const amt = isExp ? MASSEND_EXPORT_FEE : 0;

          if(sh.massend){
            if(!confirm(`Remove the Massend marking from ${sh.awb}? The calculated charge comes back.`)) return;
            el.textContent = 'Saving…';
            delete sh.massend;
            logActivity(sh, 'Massend marking removed', 'edit');
            await saveShipment(sh);
            paintShell();
            return;
          }

          const asks = `Mark ${sh.awb} as Massend?\n\n` +
            (isExp ? `The handling charge becomes ${money(amt)} on this export.`
                   : 'Nothing to pay for handling on this import.') +
            `\n\nAny survey report stays billed separately.` +
            `\n\nIt stays on the list to be selected and marked paid.`;
          if(!confirm(asks)) return;
          el.textContent = 'Saving…';
          try{
            sh.massend = true;
            logActivity(sh, isExp
              ? `Marked Massend — ${money(amt)} to pay on export`
              : 'Marked Massend — no payment due on import', 'edit');
            await saveShipment(sh);
            paintShell();
          }catch(err){
            el.textContent = 'Massend';
            alert('Could not save: ' + err.message);
          }
        };
      });
      wireActivityPhotoLinks(host);
      paintBar();
    }

    // The running total sits pinned at the bottom while they tick, so the
    // figure to hand over is never off screen.
    function paintBar(){
      const bar = document.getElementById('ch-bar');
      // The edited list is a record of what was typed, spanning every payee,
      // so there is nothing to pay from it and no bar to show.
      if(isEdited){ bar.innerHTML = ''; return; }
      const ids = Object.keys(STATE.chargesPicked);
      if(!CAN_EDIT || ids.length === 0){ bar.innerHTML = ''; return; }
      const picked = ids.map(id => list.find(i => i.id === id)).filter(Boolean);
      if(picked.length === 0){ bar.innerHTML = ''; return; }
      const total = totalOf(picked);
      const nSv = picked.filter(i => i.kind === 'survey').length;
      const nOther = picked.length - nSv;
      const what = [nOther ? `${nOther} ${isDuty?'AWB':'CHARGE'}${nOther===1?'':'S'}` : '',
                    nSv ? `${nSv} SURVEY${nSv===1?'':'S'}` : ''].filter(Boolean).join(' + ');
      bar.innerHTML = `
        <div style="position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;
          padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:60;
          box-shadow:0 -6px 20px rgba(10,14,26,.25);">
          <div style="display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:11px;color:#9FAAC6;letter-spacing:.06em;font-weight:700;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                ${what} &middot; ${escapeHtml(
                  isDuty ? 'DUTY — CUSTOMS' : pick === '__none' ? 'NO TERMINAL' : pick.toUpperCase())}</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;">${money(total)}</div>
            </div>
            <button class="lot-act ghost" id="ch-clear" style="width:auto;padding:9px 12px;background:transparent;
              border-color:rgba(255,255,255,.28);color:#9FAAC6;">Clear</button>
            <button class="lot-act" id="ch-pay" style="width:auto;padding:11px 16px;background:var(--amber);
              color:#3A2A08;border:none;font-weight:700;">Mark paid</button>
          </div>
        </div>`;
      document.getElementById('ch-clear').onclick = () => { STATE.chargesPicked = {}; draw(); };
      document.getElementById('ch-pay').onclick = () => payPicked(picked, total);
    }

    async function payPicked(picked, total){
      const what = isDuty ? 'duty' : 'charges';
      const ref = prompt(`Marking ${what} paid on ${picked.length} line(s), ${money(total)} in total.\n\nReceipt or reference number (optional):`, '');
      if(ref === null) return;
      const btn = document.getElementById('ch-pay');
      if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
      let done = 0;
      const now = new Date().toISOString();
      // Mirrored only once the shipment itself has saved, so the index never
      // shows a charge as paid that the shipment does not.
      const svToMirror = [];
      try{
        // Several lines can sit on one shipment — a handling charge and a
        // survey, say — so they are grouped and the shipment saved once.
        const byShip = new Map();
        picked.forEach(i => {
          if(!byShip.has(i.shipId)) byShip.set(i.shipId, { s: i.s, lines: [] });
          const g = byShip.get(i.shipId);
          if(!g.s && i.s) g.s = i.s;
          g.lines.push(i);
        });
        for(const [shipId, group] of byShip){
          // A survey can sit on a shipment that is no longer on the board,
          // so the document is fetched before it is written to. Working from
          // the survey index copy alone would drop everything else on it.
          let s = group.s;
          if(!s){
            const snap = await withTimeout(db.collection(SHIP).doc(shipId).get(), 15000, 'Loading shipment');
            if(!snap.exists) continue;
            s = snap.data();
            migrateShipmentSteps(s);
          }
          const lines = group.lines;
          let touched = false;
          for(const i of lines){
            if(i.kind === 'duty'){
              const amt = dutyAmount(s);
              if(amt <= 0) continue;
              s.dutyPaid = { total: amt, by: ME.name, at: now, ref: ref.trim() };
              s.dutyPaidOn = todayStr();
              logActivity(s, `Duty paid — ${money(amt)}` + (ref.trim() ? ` · ref ${ref.trim()}` : ''), 'payment');
              touched = true;
              continue;
            }
            if(i.kind === 'survey'){
              // The report on the shipment is the one that gets written —
              // the index copy is only a mirror of it, and may be the object
              // this row was built from.
              const rec = (s.surveys || []).find(r => r.id === i.rec.id);
              if(!rec) continue;
              // Frozen on the report itself, so the survey's bill is
              // traceable whatever happens to the handling charge later.
              const amt = i.amount;
              rec.chargePaid = { total: amt, by: ME.name, at: now, ref: ref.trim(),
                terminalName: i.terminalName || '' };
              rec.chargePaidOn = todayStr();
              logActivity(s, `Survey charge paid — ${money(amt)}`
                + (i.terminalName ? ` to ${i.terminalName}` : '')
                + (ref.trim() ? ` · ref ${ref.trim()}` : ''), 'payment', null, rec.hawb || '');
              svToMirror.push([s, rec]);
              touched = true;
              continue;
            }
            if(i.kind === 'hawb'){
              // Frozen against the house bill itself, so each one's payment
              // is traceable whatever happens to the rest of the AWB.
              const ch = chargeForHawb(s, i.hawb);
              if(!ch.ok) continue;
              s.hawbCharges = { ...(s.hawbCharges || {}) };
              s.hawbCharges[i.hawb.no] = { total: ch.total, lines: ch.lines,
                terminalName: ch.terminalName, kg: ch.kg, by: ME.name, at: now,
                ref: ref.trim(), paidOn: todayStr() };
              logActivity(s, `${i.hawb.no} — terminal charges paid ${money(ch.total)}`
                + (ch.terminalName ? ` to ${ch.terminalName}` : '')
                + (ref.trim() ? ` · ref ${ref.trim()}` : ''), 'payment', null, i.hawb.no);
              touched = true;
              continue;
            }
            // A consolidation's master line is only the fees charged once on
            // the AWB; anything else is already on its house bills.
            const ch = i.masterOnly ? chargeForMaster(s) : chargeFor(s);
            if(!ch.ok) continue;
            // Frozen as it stood when it was handed over — a later rate change
            // must never rewrite what was actually paid.
            const rec = { total: ch.total, lines: ch.lines, terminalName: ch.terminalName,
              kg: ch.kg, by: ME.name, at: now, ref: ref.trim(),
              override: ch.override || false, massend: ch.massend || false,
              masterOnly: !!i.masterOnly };
            s.chargePayments = (s.chargePayments || []).concat([rec]);
            s.chargePaid = rec;
            s.chargePaidOn = todayStr();
            // The invoice figure has been used, so it does not carry over.
            if(s.chargeOverride) delete s.chargeOverride;
            logActivity(s, `${i.masterOnly ? 'MAWB charges' : 'Terminal charges'} paid — ${money(ch.total)} to ${ch.terminalName}` +
              (ref.trim() ? ` · ref ${ref.trim()}` : ''), 'payment');
            touched = true;
          }
          if(touched){ await saveShipment(s); done += lines.length; }
        }
        for(const [sh, rec] of svToMirror) await mirrorSurvey(sh, rec);
        invalidateSurveyCharges();
        invalidateOpenCharges();
        invalidateEditedCharges();
        STATE.chargesPicked = {};
        paintShell();
      }catch(e){
        if(btn){ btn.disabled = false; btn.textContent = 'Mark paid'; }
        alert(`Saved ${done} of ${picked.length}, then failed: ${e.message}`);
      }
    }

    draw();
  }

  // ============================================================
  // Report — every shipment in a date range, filtered by principal,
  // with a CSV for whoever needs it outside the app.
  //
  // This reads the whole shipment collection rather than the board,
  // because a report that quietly left out everything already completed
  // would be worse than no report. It is held for the session so
  // changing a filter costs nothing; Refresh pulls it again.
  // ============================================================
  let _reportAll = null;
  // Every shipment is reported under the date its record was created, import
  // and export alike. Arrival and departure dates still live on the shipment
  // and on the board; the report simply does not count them, so one column
  // means the same thing on every row and the date filter does too.
  function reportDateOf(s){ return dayOf(s.createdAt); }
  // Every principal involved — the master's and any a house bill carries of
  // its own — so filtering by principal never hides a shipment that is
  // partly theirs.
  function principalsOf(s){
    const all = [s.principal].concat(hawbList(s).map(h => h.principal));
    return Array.from(new Set(all.filter(Boolean)));
  }
  function csvCell(v){
    const t = v == null ? '' : String(v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
  }
  function downloadCsv(filename, rows){
    // The BOM is what makes Excel read it as UTF-8 rather than mangling any
    // accented name in it.
    const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }
  // One date column serves both directions. Named for the export case at the
  // user's instruction; an import row still reports its arrival date here.
  const REPORT_HEADERS = ['Shipment type','Principal','Created date','Arrival recorded',
    'Origin','Destination','Customer','AWB',
    'Quantity','Weight'].concat(ENDORSEMENTS)
    .concat(['Survey Report','Terminal charges','Duty']);
  // The day a lot of this shipment was first recorded as arriving — when the
  // arrival was keyed in, which is what the column is for, not the flight's
  // own landing time. Blank until one is recorded, and blank on an export,
  // which has no arrival to record.
  //
  // Pass a house bill and it answers for that bill alone, from its own lots;
  // a bill with no lot of its own rides an older unmapped lot where there is
  // one, the same fallback the rest of the app uses.
  function lotRecordedOn(s, h){
    if(!s || s.type === 'export') return '';
    const landed = (s.lots || []).filter(l => l.hasArrived);
    if(!landed.length) return '';
    let mine = h ? landed.filter(l => lotHawbs(l).includes(h.no)) : landed;
    if(h && !mine.length && hasUnmappedLot(s)) mine = landed;
    const days = mine.map(l => dayOf(l.arrivedAt || l.stageAt)).filter(Boolean).sort();
    return days.length ? days[0] : '';
  }
  // The three money columns. Paid is what was actually handed over; unpaid
  // falls back to what the rates make it, so a row always carries a figure
  // rather than going blank until someone pays. null means the charge does
  // not arise at all — no survey raised, no duty on the shipment — and is
  // left as an empty cell so it cannot be mistaken for a real zero.
  function reportAmounts(s){
    // Survey reports: each one paid at its own figure, the rest at the rate.
    let survey = null;
    const reps = s.surveys || [];
    if(reps.length && surveyChargeable(s)){
      const term = terminalObjForAwb(s.awb, STATE.terminals);
      const rate = surveyChargeRate(term);
      let sum = 0, any = false;
      reps.forEach(r => {
        if(r.chargePaid){ sum += Number(r.chargePaid.total) || 0; any = true; }
        // With no terminal behind the AWB there is no rate to fall back on,
        // so the cell stays blank rather than claiming the survey was free.
        else if(term){ sum += rate; any = true; }
      });
      if(any) survey = sum;
    }
    // Terminal handling: the frozen payment if there is one, otherwise the
    // live calculation, and blank when neither can be worked out. The report
    // prices what the shipment owes, which the terminal bills from its own
    // manifest — so it does not wait for an arrival to be recorded here.
    let terminal = null;
    if(s.chargePaid) terminal = Number(s.chargePaid.total) || 0;
    else { const ch = chargeFor(s); if(ch.ok) terminal = Number(ch.total) || 0; }
    // Duty: only where it arises at all — an export, or an import on K1.
    let duty = null;
    if(s.dutyPaid) duty = Number(s.dutyPaid.total) || 0;
    else if(dutyApplies(s) && dutyAmount(s) > 0) duty = dutyAmount(s);
    return { survey, terminal, duty };
  }
  const reportCell = n => n == null ? '' : (Math.round(n * 100) / 100).toFixed(2);
  // What one house bill contributes: its own charge, and any survey raised
  // against it by name.
  function hawbReportAmounts(s, h){
    const paid = hawbChargePaid(s, h.no);
    let terminal = null;
    if(paid) terminal = Number(paid.total) || 0;
    // An invoice figure covers every house bill not already settled on its
    // own, whether it has been paid yet or not, so those rows carry nothing
    // — it is reported once, on the first row, by reportRowsFor().
    else if(invoicedWhole(s)) terminal = null;
    else { const ch = chargeForHawb(s, h); if(ch.ok) terminal = Number(ch.total) || 0; }
    let survey = null;
    if(surveyChargeable(s)){
      const term = terminalObjForAwb(s.awb, STATE.terminals);
      const rate = surveyChargeRate(term);
      let sum = 0, any = false;
      (s.surveys || []).forEach(r => {
        if(r.hawb !== h.no) return;
        if(r.chargePaid){ sum += Number(r.chargePaid.total) || 0; any = true; }
        else if(term){ sum += rate; any = true; }
      });
      if(any) survey = sum;
    }
    return { survey, terminal, duty: (h.dutyFee == null ? null : Number(h.dutyFee)) };
  }
  // Charges that sit on the master whatever the cargo is split into, so they
  // are reported once rather than spread across the house bills.
  function masterReportAmounts(s){
    let terminal = null;
    if(s.chargePaid) terminal = Number(s.chargePaid.total) || 0;
    // A typed-in invoice is the whole AWB's charge, less whatever was already
    // settled per house bill. It is reported here, on the master, because the
    // house-bill rows carry nothing while it stands.
    else if(s.chargeOverride) terminal = overrideRemainder(s);
    else { const cm = chargeForMaster(s); if(cm.ok) terminal = Number(cm.total) || 0; }
    // Duty declared on the house bills is reported on their own rows, so the
    // master row only carries duty that was never split.
    let duty = null;
    const hs = hawbList(s);
    const perHawbDuty = hs.reduce((n,x)=> n + (Number(x.dutyFee)||0), 0);
    if(perHawbDuty <= 0){
      if(s.dutyPaid) duty = Number(s.dutyPaid.total) || 0;
      else if(dutyApplies(s) && dutyAmount(s) > 0) duty = dutyAmount(s);
    }
    // A survey raised against the AWB rather than a named house bill.
    let survey = null;
    if(surveyChargeable(s)){
      const term = terminalObjForAwb(s.awb, STATE.terminals);
      const rate = surveyChargeRate(term);
      let sum = 0, any = false;
      (s.surveys || []).forEach(r => {
        if(r.hawb) return;
        if(r.chargePaid){ sum += Number(r.chargePaid.total) || 0; any = true; }
        else if(term){ sum += rate; any = true; }
      });
      if(any) survey = sum;
    }
    return { survey, terminal, duty };
  }
  function reportRowBase(s, awb, principal, pcs, kg, amt, h){
    // A house bill carries its own customer and its own agency sign-offs;
    // only where it has none does it fall back to the master's.
    const end = (h && h.endorsements && h.endorsements.length) ? h.endorsements : (s.endorsements || []);
    const cust = (h && h.customer) ? h.customer : (s.customer || '');
    // A house bill flies its own route, so its row reports that rather than
    // whatever the master settled on.
    const from = (h && h.from) ? h.from : (s.from || '');
    const to   = (h && h.to)   ? h.to   : (s.to || '');
    // A house bill's own date is an expected arrival or a departure, neither
    // of which the report counts, so every line of a consolidation carries
    // the shipment's created date.
    //
    // A house bill line names both numbers — the master the airline and
    // terminal know it by, and the house bill it was booked under — so one
    // column matches either without needing a second. A shipment with no
    // house bills has only its own number to give.
    const awbCell = (h && s.awb && awb) ? `${s.awb} / ${awb}` : (awb || '');
    return [
      s.type === 'export' ? 'Export' : 'Import',
      principal || '', reportDateOf(s), lotRecordedOn(s, h), from, to,
      cust, awbCell,
      pcs == null ? '' : pcs, kg == null ? '' : kg
    ].concat(ENDORSEMENTS.map(e => end.includes(e) ? 'YES' : ''))
     .concat([reportCell(amt.survey), reportCell(amt.terminal), reportCell(amt.duty)]);
  }
  // A consolidation reports one row per house bill, each with its own number
  // in the AWB column, plus a row for the master carrying what is charged on
  // the AWB itself — duty, and any fee the terminal bills once. Pieces and
  // weight stay on the house bills, so a column still sums to the shipment.
  function reportRowsFor(s){
    const hs = hawbList(s);
    if(hs.length === 0) return [reportRowBase(s, s.awb, s.principal, s.pcs, s.kg, reportAmounts(s))];
    const rows = hs.map(h =>
      reportRowBase(s, h.no, h.principal || s.principal, h.pcs, h.kg, hawbReportAmounts(s, h), h));
    // A consolidation reports its house bills and nothing else: every line
    // already names the master beside the house bill, so a line for the
    // master on its own says nothing the others do not. Anything charged
    // once on the master — a flat terminal fee, a survey raised against the
    // AWB rather than a named bill, duty that was never split — rides on the
    // first house bill instead of being dropped, so a column still totals to
    // what the shipment actually costs.
    const m = masterReportAmounts(s);
    if(m.terminal == null && m.duty == null && m.survey == null) return rows;
    const add = (a, b) => (a == null && b == null) ? null : (Number(a)||0) + (Number(b)||0);
    const first = hs[0];
    const own = hawbReportAmounts(s, first);
    rows[0] = reportRowBase(s, first.no, first.principal || s.principal,
      first.pcs, first.kg, {
        survey:   add(own.survey,   m.survey),
        terminal: add(own.terminal, m.terminal),
        duty:     add(own.duty,     m.duty)
      }, first);
    return rows;
  }

  async function paintReport(c){
    // Nothing is chosen when the tab opens, and nothing is fetched either —
    // the shipments are only read once a filter says what is wanted, so
    // simply visiting the tab costs no reads at all.
    const anyFilter = () => !!(STATE.reportFrom || STATE.reportTo || STATE.reportPrincipal !== 'all');

    async function ensureLoaded(){
      if(_reportAll) return true;
      const host = document.getElementById('rp-state');
      if(host) host.textContent = 'Loading shipments…';
      try{
        const snap = await withTimeout(db.collection(SHIP).get(), 30000, 'Loading shipments');
        _reportAll = snap.docs.map(d => d.data());
        _reportAll.forEach(migrateShipmentSteps);
        // The dropdown was built before anything was loaded, so it only had
        // the configured principals. Add any that turn up on the shipments
        // themselves now that they are here.
        const sel = document.getElementById('rp-principal');
        if(sel){
          const want = Array.from(new Set(STATE.principals.concat(_reportAll.flatMap(principalsOf)))).sort();
          const have = [...sel.options].map(o => o.value);
          want.forEach(p=>{
            if(have.includes(p)) return;
            const o = document.createElement('option');
            o.value = p; o.textContent = p;
            sel.appendChild(o);
          });
          sel.value = STATE.reportPrincipal;
        }
        return true;
      }catch(e){
        if(host){ host.style.color = 'var(--red)'; host.textContent = 'Could not load: ' + e.message; }
        return false;
      }
    }

    const principalOptions = Array.from(new Set(
      STATE.principals.concat(_reportAll ? _reportAll.flatMap(principalsOf) : []))).sort();

    // An empty From or To simply means no bound on that side, so a principal
    // can be reported on its own without picking dates.
    function rowsNow(){
      if(!_reportAll) return [];
      const from = STATE.reportFrom, to = STATE.reportTo, who = STATE.reportPrincipal;
      return _reportAll.filter(s=>{
        const d = reportDateOf(s);
        if(from && (!d || d < from)) return false;
        if(to && (!d || d > to)) return false;
        if(who !== 'all' && !principalsOf(s).includes(who)) return false;
        return true;
      }).sort((a,b)=> String(reportDateOf(a)).localeCompare(String(reportDateOf(b)))
        || String(a.awb).localeCompare(String(b.awb)));
    }

    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n" id="rp-count">—</div><div class="l">shipments</div></div>
        <div class="count"><div class="n" id="rp-pcs">—</div><div class="l">pieces</div></div>
        <div class="count"><div class="n" id="rp-kg">—</div><div class="l">kg</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end;margin:12px 12px 0;">
        <div style="flex:1;">
          <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;">FROM</label>
          <input type="date" id="rp-from" value="${STATE.reportFrom}"
            style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        </div>
        <div style="flex:1;">
          <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;">TO</label>
          <input type="date" id="rp-to" value="${STATE.reportTo}"
