    const [totals, targets, catalog, allWorkers, badges, sideQuests, hellIssues, allFails, archive] = await Promise.all([getTotalsEnsured(), getTargets(), getCatalog(), getWorkers(), getBadges(), getSideQuests(), getHellIssues(), getFailCountsEnsured(), getTargetArchive()]);
    // Everything reads the totals cache; the raw ledger is only a fallback.
    const ledger = totals ? null : await getLedger();
    const tEarned = id => totals ? ((totals.byWorker[id]||{}).earned || 0) : earnedFor(ledger, id);
    const tReached = id => totals ? ((totals.byWorker[id]||{}).reachedAt || '') : reachedAtFor(ledger, id);
    const tBalance = id => totals ? ((totals.byWorker[id]||{}).balance || 0) : balanceFor(ledger, id);
    // Only pull submissions for the targets actually on this worker's screen —
    // their full history isn't needed and every row carries a photo.
    const _todayStr = todayStr();
    const myTargetIds = targets.filter(t=>
      t.workerId===worker.id &&
      (t.status!=='achieved' || t.achievedAt === _todayStr)
    ).map(t=>t.id);
    const subs = await getSubsForTargets(myTargetIds);
    // Only the count is needed up front; the rows are fetched if the worker
    // opens the list, so a growing fail history doesn't slow every load.
    const myFailCount = allFails ? ((allFails.byWorker||{})[worker.id] || 0) : 0;
    const bal = tBalance(worker.id);
    const earned = tEarned(worker.id);
    const myActiveDaily = targets.filter(t=>t.workerId===worker.id && t.status!=='achieved' && t.isDaily).sort((a,b)=> a.points - b.points);
    const myActiveOther = targets.filter(t=>t.workerId===worker.id && t.status!=='achieved' && !t.isDaily).sort((a,b)=> b.points - a.points);
    const myActiveTargets = myActiveDaily.concat(myActiveOther);
    // Approved tasks stay on the list until 5am the next morning, so the
    // worker can still read the remark left when it was reviewed — including
    // anything approved late in the evening, which the old 9pm cutoff hid
    // almost immediately. The visible day therefore runs 5am to 5am.
    const APPROVED_VISIBLE_UNTIL = 5 * 60; // 5:00am
    const { minutesOfDay: _nowMins } = nowMYParts();
    // A weekly's deadline is Sunday 9pm of the week it belongs to, so both
    // which week it is and which day of the week matter.
    const _thisWeekMonday = mondayOfWeekMY(_todayStr);
    const _todayDow = dayOfWeekMY(_todayStr);
    const _yesterdayStr = (()=>{
      const d = new Date(_todayStr + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() - 1);
      return d.toISOString().slice(0,10);
    })();
    // Before 5am we're still in yesterday's working day, so its approvals
    // remain visible alongside anything approved just after midnight.
    const visibleApprovalDays = _nowMins < APPROVED_VISIBLE_UNTIL
      ? [_todayStr, _yesterdayStr]
      : [_todayStr];
    // Approved tasks only linger when there's a remark to read. Without one
    // there's nothing to come back for, so they clear straight away and the
    // list stays focused on what's still outstanding.
    const remarkedTargetIds = new Set(
      subs.filter(s => s.workerId === worker.id && s.status === 'approved' && s.reviewRemark)
          .map(s => s.targetId)
    );
    const myApprovedToday = targets
      .filter(t=>t.workerId===worker.id && t.status==='achieved'
        && visibleApprovalDays.includes(t.achievedAt)
        && remarkedTargetIds.has(t.id))
      .sort((a,b)=> b.points - a.points);
    const myTargets = myActiveTargets.concat(myApprovedToday);
    const mySubs = subs.filter(s=>s.workerId===worker.id);
    const targetsAchieved = achievedCountFor(targets, worker.id) + archiveCountFor(archive, worker.id, 'achieved');

    // Roadmap lock: today's daily tasks must be submitted lowest-points-first.
    // A task unlocks once every daily task with a strictly lower point value
    // (today's batch only) has been submitted at least once — pending or
    // already reviewed both count, so a slow review never blocks progress.
    const todayStr_ = todayStr();
    const myDailyToday = targets.filter(t=> t.workerId===worker.id && t.isDaily && t.createdAt===todayStr_);
    const pointTiers = [...new Set(myDailyToday.map(t=>t.points))].sort((a,b)=>a-b);
    const hasBeenSubmitted = (t) => t.status==='achieved' || mySubs.some(s=>s.targetId===t.id);
    function lockInfoFor(t){
      if(!t.isDaily || t.createdAt!==todayStr_) return { locked:false };
      const myTier = pointTiers.indexOf(t.points);
      const earlierTierTasks = myDailyToday.filter(x => pointTiers.indexOf(x.points) < myTier);
      const unmet = earlierTierTasks.filter(x => !hasBeenSubmitted(x));
      if(unmet.length===0) return { locked:false };
      return { locked:true, waitingOn: unmet.map(x=>x.title) };
    }
    const sideQuestsAchieved = sideQuestsAchievedCountFor(targets, worker.id) + archiveCountFor(archive, worker.id, 'sideQuests');
    const myAcceptedQuestIds = new Set(targets.filter(t=>t.workerId===worker.id && t.sideQuestId).map(t=>t.sideQuestId));
    const acceptedCountByQuest = {};
    targets.forEach(t=>{ if(t.sideQuestId) acceptedCountByQuest[t.sideQuestId] = (acceptedCountByQuest[t.sideQuestId]||0) + 1; });
    const nowMs = Date.now();
    const eligibleQuests = sideQuests.filter(sq =>
      sq.active !== false && !myAcceptedQuestIds.has(sq.id) &&
      (!sq.roles || sq.roles.length===0 || sq.roles.includes(worker.role)) &&
      (acceptedCountByQuest[sq.id]||0) < (sq.capacity || 1)
    // Newest first. Stored order put the one raised this morning underneath
    // everything from last month, which is the last place anyone looks.
    ).sort((a,b)=> String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
    const standbyQuests = eligibleQuests.filter(sq => sq.opensAt && new Date(sq.opensAt).getTime() > nowMs);
    const openQuests = eligibleQuests.filter(sq =>
      (!sq.opensAt || new Date(sq.opensAt).getTime() <= nowMs) &&
      !(sq.expiresAtFixed && new Date(sq.expiresAtFixed).getTime() < nowMs));

    const rankedAll = allWorkers.map(w=>({ id:w.id, earned: tEarned(w.id), reachedAt: tReached(w.id) })).sort((a,b)=> b.earned - a.earned || a.reachedAt.localeCompare(b.reachedAt));
    const myRank = rankedAll.findIndex(w=>w.id===worker.id) + 1;
    const badgeCtx = { earned, targetsAchieved, sideQuestsAchieved, rank: myRank };
    const myBadges = earnedBadges(badgeCtx, badges);
    const nextUp = nextBadgesInfo(badgeCtx, badges);
    const myRankTitle = currentRankTitle(badgeCtx, badges);

    function badgeProgressRow(b){
      let progressText = '';
      let pct = 0;
      const m = badgeMetric(b, badgeCtx);
      if(m){
        progressText = `${Math.min(m.current,b.need)} / ${b.need} ${m.unit}`;
        pct = Math.max(0, Math.min(100, Math.round(m.current/b.need*100)));
      } else if(b.group==='rank'){
        progressText = myRank ? `Currently rank #${myRank} — reach ${b.need===1?'#1':'top '+b.need}` : 'Not yet ranked';
        pct = myRank ? Math.max(0, Math.min(100, Math.round((allWorkers.length - myRank + 1) / allWorkers.length * 100))) : 0;
      }
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);">
          <span style="font-size:22px;opacity:0.6;">${b.emoji}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:13px;color:var(--muted);">${escapeHtml(b.label)} <span style="font-weight:400;">— ${escapeHtml(b.desc)}</span></div>
            <div style="height:6px;background:var(--paper);border-radius:4px;margin-top:6px;overflow:hidden;">
              <div style="height:100%;width:${pct}%;background:var(--amber);"></div>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:3px;">${progressText}</div>
          </div>
        </div>`;
    }

    const avatar = avatarInfoFor(earned);

    // Their own score for the season so far.
    let myScore = null, myRankInfo = null;
    try{
      const ranks = await getScoreRanks();
      const mine = ranks && ranks.byWorker ? ranks.byWorker[worker.id] : null;
      if(mine){
        myScore = { score: mine.score, exact: mine.exact,
          parts: mine.parts || {}, counts: mine.counts || {} };
        myRankInfo = { rank: mine.rank, total: ranks.total, updatedAt: ranks.updatedAt };
      }
    }catch(e){
      console.error('Could not calculate score:', e);
      showFbError('Your score could not be calculated: ' + e.message);
    }

    // Heads get an extra entry point to review their own team's submissions.
    const myTeam = worker.isHead ? allWorkers.filter(w=>w.reportsTo===worker.id) : [];
    let myTeamPendingCount = 0;
    if(myTeam.length > 0){
      // Query just this head's team rather than reading every pending
      // submission in the system to display a count. Firestore caps an `in`
      // clause at 30 values, hence the chunking.
      try{
        const ids = myTeam.map(w=>w.id);
        const chunks = [];
        for(let i=0;i<ids.length;i+=30) chunks.push(ids.slice(i,i+30));
        const snaps = await Promise.all(chunks.map(c =>
          db.collection(SUBS_COLLECTION)
            .where('status','==','pending').where('workerId','in',c).get()
        ));
        // Challenger tasks and after-hours help are an admin's to approve, so
        // they must not be counted here either — a badge saying three when
        // the panel below lists one is how a head concludes the app is broken.
        const byId = {}; targets.forEach(t => { byId[t.id] = t; });
        myTeamPendingCount = snaps.reduce((n, snap) =>
          n + snap.docs.filter(d => !adminOnlySub(d.data(), byId[d.data().targetId])).length, 0);
      }catch(e){ console.error('Team pending count failed:', e); }
    }

    body.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <a class="backlink" href="#worker" id="wp-switch">&lsaquo; Switch worker</a>
        <div style="display:flex;align-items:center;gap:10px;">
          ${buildTagHtml()}
          <button class="btn btn-ghost btn-sm" id="wp-view-lb">🏆 Leaderboard</button>
        </div>
      </div>
      <div style="margin-top:10px;">
        <div class="worker-name" style="font-size:19px;">${escapeHtml(worker.name)}</div>
        <div class="worker-role">${escapeHtml(worker.role||'')}</div>
        ${myRankTitle ? `<div class="rank-title">${myRankTitle.emoji} Rank: ${escapeHtml(myRankTitle.label)}</div>` : ''}
        <div class="help" style="margin-top:6px;margin-bottom:0;">Currently ranked #${myRank} of ${allWorkers.length}</div>
      </div>

      ${myTeam.length > 0 ? `
      <div class="card" style="margin-top:14px;margin-bottom:0;border:1.5px solid var(--amber);background:#FFFAF0;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;">👤 My team (${myTeam.length})</div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${myTeamPendingCount>0 ? `${myTeamPendingCount} submission${myTeamPendingCount===1?'':'s'} waiting for your review` : 'Nothing waiting for review'}</div>
          </div>
          <button class="btn btn-amber btn-sm" id="wp-view-team" style="white-space:nowrap;">Review${myTeamPendingCount>0 ? ` (${myTeamPendingCount})` : ''}</button>
        </div>
      </div>` : ''}
      <div class="card" style="margin-top:14px;margin-bottom:16px;text-align:center;padding:20px;">
        <div style="font-size:52px;line-height:1;">${avatar.emoji}</div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--ink);margin-top:8px;">Level ${avatar.level} &middot; ${escapeHtml(avatar.title)}</div>
        <div style="height:8px;background:var(--paper);border-radius:5px;margin-top:10px;overflow:hidden;">
          <div style="height:100%;width:${avatar.pct}%;background:var(--amber);"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">${avatar.pointsIntoLevel} / ${avatar.pointsForNextLevel} pts to Level ${avatar.level+1}</div>
      </div>
      <div class="points-hero">
        <div class="n">${bal}</div>
        <div class="l">Points balance &middot; ${earned} earned lifetime</div>
      </div>
      ${myScore ? (()=>{
        const b = scoreBand(myScore.score);
        const bar = (label, val) => val === null ? '' : `
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
            <span style="font-size:10.5px;color:var(--muted);width:78px;">${label}</span>
            <div style="flex:1;height:6px;background:var(--paper);border-radius:3px;overflow:hidden;">
              <div style="height:100%;width:${Math.max(0,Math.min(100,val))}%;background:${val>=70?'var(--green)':val>=50?'var(--amber)':'var(--red)'};"></div>
            </div>
            <span style="font-size:10.5px;color:var(--muted);width:34px;text-align:right;">${partPct(val)}</span>
          </div>`;
        return `
        <div class="eyebrow">My score &middot; this season</div>
        <div class="card" style="margin-bottom:16px;">
          <div style="text-align:center;">
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;color:${b.color};line-height:1;">${scorePct(myScore.exact != null ? myScore.exact : myScore.score)}</div>
            <div style="font-size:11.5px;color:${b.color};font-weight:600;margin-top:2px;">${b.label}</div>
            ${myRankInfo ? `<div style="font-size:12px;color:var(--ink);font-weight:600;margin-top:6px;">Ranked #${myRankInfo.rank} of ${myRankInfo.total}</div>
              <div style="font-size:10px;color:var(--muted);">updated ${new Date(myRankInfo.updatedAt).toLocaleDateString()}</div>` : ''}
          </div>
          <div style="margin-top:10px;">
            ${bar('Reliability', myScore.parts.reliability)}
            ${bar('Quality', myScore.parts.quality)}
            ${bar('Challenger', myScore.parts.challenger)}
          </div>
          <div class="help" style="margin-top:10px;margin-bottom:0;">Based on how much of your own work you complete, not how much you're given — so it's fair whoever you're compared with.</div>
        </div>`;
      })() : ''}
      ${(()=>{
        // The way in. Dark on a page of white cards, because these are not
        // the same kind of work — a Hell Mode issue is a standing problem
        // somebody has to own, not a task that comes round again tomorrow.
        const openIssues = hellIssues.filter(i => i.state === 'open');
        const liveIssues = hellIssues.filter(i => i.state === 'live');
        const mine = liveIssues.find(i => hellIsMember(i, worker.id));
        if(openIssues.length === 0 && liveIssues.length === 0) return '';
        // The big number has to answer the line beside it. Carrying one of
        // these, the number that matters is how long you have been carrying
        // it; otherwise it is how many are sitting there with nobody on them.
        const hero = mine
          ? { n: hellDayCount(mine), label: hellDayCount(mine) === 1 ? 'day in' : 'days in',
              lead: `You own <b>${escapeHtml(mine.title)}</b> &mdash; ${
                mine.pending ? `${escapeHtml(HELL_STAGES[mine.stage])} is with the admin.`
                             : `${escapeHtml(HELL_STAGES[mine.stage])} is next.`}` }
          : openIssues.length
            ? { n: openIssues.length, label: 'unclaimed',
                lead: `${openIssues.length === 1 ? 'A problem is' : 'Problems are'} on the board with nobody on ${openIssues.length === 1 ? 'it' : 'them'}.` }
            : { n: liveIssues.length, label: liveIssues.length === 1 ? 'in progress' : 'in progress',
                lead: 'Being worked on now. Join one and take a share of it.' };
        return `
        <div class="hell" style="margin-bottom:16px;">
          <div class="hell-slab">
            <div class="hell-rule" style="width:46px;"></div>
            <h3 class="hell-kicker" style="margin-top:10px;">Hell Mode</h3>
            <div class="hell-sub">The problems nobody wants. Hardest points on the board.</div>
            <div style="display:flex;align-items:center;gap:13px;margin-top:14px;">
              <div style="text-align:center;flex:0 0 auto;">
                <div class="hell-count">${hero.n}</div>
                <div style="font-size:10px;color:var(--h-smoke);margin-top:3px;">${hero.label}</div>
              </div>
              <div class="hell-sub" style="margin:0;flex:1;min-width:0;">${hero.lead}</div>
            </div>
            <button class="hell-btn" id="wp-hell-open">${mine ? 'Open my issue' : 'See what’s burning'}</button>
          </div>
        </div>`;
      })()}
      <div class="eyebrow">My badges</div>
      <div class="card" style="margin-bottom:16px;">
        ${myBadges.length ? `<div class="badge-row">${myBadges.map(b=>`<span class="badge-chip" title="${b.desc}"><span class="em">${b.emoji}</span> ${escapeHtml(b.label)}</span>`).join('')}</div>` : `<div class="help" style="margin-bottom:0;">Complete your first target to start earning badges.</div>`}
        ${nextUp.length ? `
          <div class="eyebrow" style="margin-top:14px;margin-bottom:0;">Next up</div>
          ${nextUp.map(badgeProgressRow).join('')}
        ` : ''}
        <button class="btn btn-ghost btn-sm" id="wp-view-all-badges" style="margin-top:12px;">View all badges &amp; requirements</button>
      </div>
      ${catalog.length>0 ? `
      <div class="eyebrow">Rewards you can aim for</div>
      <div class="card" style="margin-bottom:16px;">
        ${catalog.slice().sort((a,b)=>a.pointsCost-b.pointsCost).map(c=>{
          const affordable = bal >= c.pointsCost;
          return `<div class="ledger-row">
            <div class="ledger-note" style="${affordable?'':'color:var(--muted);'}">${escapeHtml(c.name)}</div>
            <div class="ledger-pts" style="${affordable?'color:var(--green);':'color:var(--muted);'}">${c.pointsCost} pts ${affordable?'&#10003;':''}</div>
          </div>`;
        }).join('')}
      </div>` : ''}
      ${standbyQuests.length>0 ? `
      <div class="eyebrow">Opening soon — stand by</div>
      <div class="card" style="margin-bottom:16px;">
        <div id="wp-standby-quests"></div>
      </div>` : ''}
      ${openQuests.length>0 ? `
      <div class="eyebrow">Challenger tasks for your role</div>
      <div class="card" style="margin-bottom:16px;">
        <div id="wp-sidequests"></div>
      </div>` : ''}
      <div class="eyebrow">My targets</div>
      <div id="wp-reminders"></div>
      <div id="wp-dolist"></div>
      <div id="wp-targets"></div>
      <div class="eyebrow" style="margin-top:18px;">After-hours help</div>
      <div class="card" style="margin-bottom:16px;">
        <div id="wp-afterhours"></div>
      </div>
      ${myFailCount>0 ? `
      <div class="card" style="margin-top:18px;">
        <div id="wp-fails-toggle" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
          <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;">Missed tasks (${myFailCount})</span>
          <span id="wp-fails-caret" style="font-size:12px;color:var(--muted);">Show &rsaquo;</span>
        </div>
        <div id="wp-fails-body" style="display:none;">
          <div class="help" style="margin-top:10px;">Tasks that closed before you completed them. These don't cost you points — they're here so you can see what was missed.</div>
          <div id="wp-fails"></div>
        </div>
      </div>` : ''}
    `;

    if(standbyQuests.length>0){
      const standbyEl = document.getElementById('wp-standby-quests');
      standbyEl.innerHTML = standbyQuests.map(sq=>{
        const needsPhoto = sq.requiresPhoto !== false;
        const capLabel = (sq.capacity||1) > 1 ? ` &middot; open to ${sq.capacity} workers` : '';
        return `
        <div style="padding:10px 0;border-top:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <div style="font-weight:600;font-size:13.5px;">${escapeHtml(sq.title)}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;">${needsPhoto?'📷 Photo required':'✏️ Note only'}${capLabel}</div>
            </div>
            <div class="target-pts">+${sq.points} pts</div>
          </div>
          <div style="margin-top:8px;font-size:13px;font-weight:700;color:var(--amber-dark);font-family:'IBM Plex Mono',monospace;" id="countdown-${sq.id}">--:--</div>
        </div>`;
      }).join('');
      // Live countdown, ticking every second. When one hits zero, refresh the
      // whole dashboard so it moves into the "available now" section.
      standbyQuests.forEach(sq=>{
        const opensAtMs = new Date(sq.opensAt).getTime();
        const tick = ()=>{
          const el = document.getElementById('countdown-'+sq.id);
          if(!el){ clearInterval(timerId); return; } // navigated away
          const remaining = opensAtMs - Date.now();
          if(remaining <= 0){
            clearInterval(timerId);
            renderWorkerDashboard(body, worker);
            return;
          }
          const totalSeconds = Math.floor(remaining/1000);
          const h = Math.floor(totalSeconds/3600);
          const m = Math.floor((totalSeconds%3600)/60);
          const s = totalSeconds%60;
          el.textContent = 'Opens in ' + (h>0 ? `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s` : `${m}m ${String(s).padStart(2,'0')}s`);
        };
        tick();
        const timerId = setInterval(tick, 1000);
      });
    }

    if(openQuests.length>0){
      const sqEl = document.getElementById('wp-sidequests');
      sqEl.innerHTML = openQuests.map(sq=>{
        const needsPhoto = sq.requiresPhoto !== false;
        const spotsLeft = (sq.capacity||1) - (acceptedCountByQuest[sq.id]||0);
        const capLabel = (sq.capacity||1) > 1 ? ` &middot; ${spotsLeft} of ${sq.capacity} spot${sq.capacity===1?'':'s'} left` : '';
        return `
        <div style="padding:10px 0;border-top:1px solid var(--line);" class="sq-row">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <div style="font-weight:600;font-size:13.5px;">${escapeHtml(sq.title)}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;">${needsPhoto?'📷 Photo required':'✏️ Note only'}${(sq.expiresAtFixed || sq.expiryHours) ? ` &middot; ⏱ ${questDeadlineLabel(sq)}` : ''}${capLabel}</div>
            </div>
            <div class="target-pts">+${sq.points} pts</div>
          </div>
          <button class="btn btn-amber btn-sm" data-accept-sq="${sq.id}" style="margin-top:8px;">Accept Task</button>
          <div id="sq-accept-msg-${sq.id}" style="margin-top:6px;font-size:11.5px;"></div>
        </div>`;
      }).join('');
      sqEl.querySelectorAll('[data-accept-sq]').forEach(btn=>{
        btn.onclick = async function(){
          const questId = this.dataset.acceptSq;
          const sq = openQuests.find(x=>x.id===questId);
          this.disabled = true; this.textContent = 'Accepting…';

          // Re-check freshness — capacity may have filled up since this loaded.
          const freshQuests = await getSideQuests();
          const freshSq = freshQuests.find(x=>x.id===questId);
          const freshTargets = await getTargets();
          const freshAcceptedCount = freshTargets.filter(t=>t.sideQuestId===questId).length;
          if(!freshSq || freshSq.active===false || freshAcceptedCount >= (freshSq.capacity||1)){
            document.getElementById('sq-accept-msg-'+questId).style.color = 'var(--red)';
            document.getElementById('sq-accept-msg-'+questId).textContent = 'This task is already full.';
            setTimeout(()=> renderWorkerDashboard(body, worker), 900);
            return;
          }
          if(freshSq.expiresAtFixed && new Date(freshSq.expiresAtFixed).getTime() < Date.now()){
            document.getElementById('sq-accept-msg-'+questId).style.color = 'var(--red)';
            document.getElementById('sq-accept-msg-'+questId).textContent = "This task's deadline has already passed.";
            setTimeout(()=> renderWorkerDashboard(body, worker), 900);
            return;
          }

          const acceptedAt = new Date();
          // Fixed deadline, so it's the same for whoever accepts and whenever.
          // Older quests still carry expiryHours — honour those as a fallback.
          const expiresAt = sq.expiresAtFixed
            ? sq.expiresAtFixed
            : (sq.expiryHours ? new Date(acceptedAt.getTime() + sq.expiryHours*3600*1000).toISOString() : null);

          // Done in a transaction: the capacity and already-accepted checks
          // have to happen against the same copy that gets written, otherwise
          // a double-tap or two workers accepting together can both pass the
          // check and land twice.
          let acceptOutcome = 'ok';
          try{
            const ref = db.collection('appdata').doc(K_TARGETS);
            cacheDrop(K_TARGETS);
            await db.runTransaction(async tx => {
              const doc = await tx.get(ref);
              const current = doc.exists ? (doc.data().value || []) : [];
              if(current.some(t => t.sideQuestId === questId && t.workerId === worker.id)){
                acceptOutcome = 'already'; return;
              }
              if(current.filter(t => t.sideQuestId === questId).length >= (freshSq.capacity || 1)){
                acceptOutcome = 'full'; return;
              }
              current.push({
                id: uid(), workerId: worker.id, title: sq.title, points: sq.points,
                period: 'Challenger Task', status: 'active', createdAt: todayStr(),
                requiresPhoto: sq.requiresPhoto, sideQuestId: sq.id,
                acceptedAt: acceptedAt.toISOString(), expiresAt
              });
              tx.set(ref, { value: current });
            });
            cacheDrop(K_TARGETS);
          }catch(e){
            acceptOutcome = 'error';
            console.error('Accept failed:', e);
          }

          if(acceptOutcome !== 'ok'){
            const m = document.getElementById('sq-accept-msg-'+questId);
            m.style.color = 'var(--red)';
            m.textContent = acceptOutcome === 'already'
              ? "You've already accepted this one."
              : acceptOutcome === 'full'
                ? 'This task is already full.'
                : 'Could not accept — try again.';
            setTimeout(()=> renderWorkerDashboard(body, worker), 1200);
            return;
          }

          const ok = true;
          if(ok){
            // Close it once capacity is reached (this acceptance included).
            if(freshAcceptedCount + 1 >= (freshSq.capacity||1)){
              await mutateSideQuests(list => {
                const i = list.findIndex(x=>x.id===questId);
                if(i < 0) return false;
                list[i].active = false;
                return list;
              });
            }
            document.getElementById('sq-accept-msg-'+questId).style.color = 'var(--green)';
            document.getElementById('sq-accept-msg-'+questId).textContent = 'Accepted — check My targets below.';
            setTimeout(()=> renderWorkerDashboard(body, worker), 700);
          } else {
            this.disabled = false; this.textContent = 'Accept Task';
            document.getElementById('sq-accept-msg-'+questId).style.color = 'var(--red)';
            document.getElementById('sq-accept-msg-'+questId).textContent = 'Could not accept — try again.';
          }
        };
      });
    }

    const tEl = document.getElementById('wp-targets');
    // Only the standing daily list is settled as a day. A one-off, a
    // weekly and a challenger task are each submitted and approved on
    // their own, the same as for anybody else — a one-off is minted as a
    // daily with no template, which is what used to pull it into the
    // checklist and leave the worker no way to submit it.
    const doJobs = isDoList(worker) ? doListJobsFor(myTargets) : [];
    const doIds = new Set(doJobs.map(t => t.id));
    // After-hours entries have their own card below, with the form that
    // creates them. Showing them in the targets list as well would read as
    // two different things to do.
    const listTargets = myTargets.filter(t => !doIds.has(t.id) && !t.isAfterHours);
    // Counted from the full target list, not myTargets: that one holds only
    // active tasks plus today's approvals, so an entry approved on Monday
    // would vanish from the cap by Tuesday and the week's limit would never
    // actually bind.
    renderAfterHours(document.getElementById('wp-afterhours'), body, worker,
      targets.filter(t => t.isAfterHours && t.workerId === worker.id), mySubs);
    renderMyReminders(document.getElementById('wp-reminders'), body, worker);
    if(isDoList(worker)){
      const { dateStr: _dToday, minutesOfDay: _dMins } = nowMYParts();
      const _liveDay = liveDailyDate(_dToday, _dMins);
      const [dayPts, daySub] = await Promise.all([
        getDoListPoints(), getDaySubFor(worker.id, _liveDay)]);
      renderDoListDay(document.getElementById('wp-dolist'), body, worker,
        doJobs, mySubs, { dayPts, daySub });
    }
    if(listTargets.length===0){
      tEl.innerHTML = isDoList(worker) ? '' :
        `<div class="card"><div class="empty">No targets assigned yet.</div></div>`;
    } else {
    tEl.innerHTML = `<div class="card">` + listTargets.map(t=>{
      const pendingSub = mySubs.find(s=>s.targetId===t.id && s.status==='pending');
      const lastSub = mySubs.filter(s=>s.targetId===t.id).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt))[0];
      // Challenger tasks carry their own deadline. A daily runs until 5am
      // the morning after the list was handed out; a weekly runs to 9pm on
      // the SUNDAY of its week. Both were once measured against the daily
      // 9pm, which read every weekly as expired from 9pm on any evening of
      // the week and then quietly back to normal the next morning.
      //
      // The daily test must compare against the task's own date, not the
      // clock alone: at 2am a task from yesterday is still open and one
      // from the day before is not, and the time of day cannot tell them
      // apart on its own.
      const pastCutoff = t.isDaily
        ? dailyClosed(t.createdAt, _todayStr, _nowMins)
        : t.isWeekly
          ? (t.weekOf < _thisWeekMonday
             || (_todayDow === 0 && _nowMins >= WEEK_EXPIRE_MINUTES))
          : false;
      const isExpired = t.status==='active' &&
        ((t.expiresAt && Date.now() > new Date(t.expiresAt).getTime()) || pastCutoff);
      let statusBadge = '';
      if(t.status==='achieved') statusBadge = '<span class="badge badge-achieved">Achieved</span>';
      else if(t.status==='failed') statusBadge = `<span class="badge badge-rejected">${failKindLabel(t.failKind)}</span>`;
      // Work waiting for review is checked BEFORE the deadline. The task is
      // already protected from failing while a submission is pending, so
      // showing "Expired" here told the worker they'd missed something they
      // had in fact done on time.
      else if(pendingSub) statusBadge = '<span class="badge badge-pending">Awaiting review</span>';
      else if(isExpired) statusBadge = '<span class="badge badge-rejected">Expired</span>';
      else if(lastSub && lastSub.status==='rejected') statusBadge = '<span class="badge badge-rejected">Resubmit needed</span>';

      const lockInfo = lockInfoFor(t);
      const canSubmit = t.status==='active' && !pendingSub && !isExpired && !lockInfo.locked;
      const needsPhoto = t.requiresPhoto !== false;
      // Once it's submitted the deadline is no longer the worker's problem —
      // reassure them it's in hand rather than showing a countdown they can't
      // act on.
      const expiryNote = (t.status==='active' && t.expiresAt && pendingSub)
        ? `<div style="font-size:10.5px;color:var(--green);margin-top:2px;">✓ Submitted in time — waiting for review</div>`
        : (t.status==='active' && t.expiresAt && !isExpired
          ? `<div style="font-size:10.5px;color:var(--muted);margin-top:2px;">⏱ Submit before ${new Date(t.expiresAt).toLocaleString()}</div>` : '');
      const lockNote = lockInfo.locked
        ? `<div style="font-size:10.5px;color:var(--amber-dark);margin-top:2px;">🔒 Submit "${escapeHtml(lockInfo.waitingOn[0])}"${lockInfo.waitingOn.length>1 ? ` (and ${lockInfo.waitingOn.length-1} other lower-point task${lockInfo.waitingOn.length>2?'s':''})` : ''} first</div>` : '';

      return `
        <div class="target-item">
          <div class="target-top">
            <div>
              <div class="target-title${msFor(t) ? ' has-ms' : ''}"${
                msFor(t) ? ` data-ms="${t.id}" title="Tap for Bahasa Malaysia"` : ''}>${escapeHtml(t.title)}</div>
              ${msFor(t) ? `<div class="target-ms" id="ms-${t.id}" hidden>${escapeHtml(msFor(t))}</div>` : ''}
              <div class="target-meta">${t.period}${t.isRevived ? ' &middot; <span style="color:var(--amber-dark);font-weight:600;">Make-up task</span>' : ''} ${statusBadge ? '&middot; '+statusBadge : ''}</div>
              ${expiryNote}
              ${lockNote}
              ${lastSub && lastSub.reviewRemark ? `<div style="font-size:10.5px;margin-top:3px;color:${lastSub.status==='rejected'?'var(--red)':'var(--green)'};">💬 ${escapeHtml(lastSub.reviewRemark)}</div>` : ''}
              ${lastSub && lastSub.reviewedBy && (lastSub.status==='approved' || lastSub.status==='rejected')
                ? `<div style="font-size:10.5px;margin-top:2px;color:var(--muted);">${
                    lastSub.status==='rejected' ? 'Rejected' : 'Approved'} by ${escapeHtml(lastSub.reviewedBy)}</div>` : ''}
            </div>
            <div class="target-pts">+${t.points} pts</div>
          </div>
          ${canSubmit ? `<div class="target-actions"><button class="btn btn-amber btn-sm" data-submit="${t.id}">${needsPhoto ? 'Submit Proof Photo' : 'Mark Complete'}</button></div>` : ''}
          <div id="submit-form-${t.id}"></div>
        </div>`;
    }).join('') + `</div>`;

    const myTargetMap = {}; listTargets.forEach(t=> myTargetMap[t.id]=t);
    // Tap the title to show the Malay, tap again to put it away. Bound
    // after every redraw, so it survives a submission clearing the list.
    tEl.querySelectorAll('[data-ms]').forEach(el=>{
      el.onclick = ()=>{
        const line = document.getElementById('ms-' + el.dataset.ms);
        if(line) line.hidden = !line.hidden;
      };
    });
    tEl.querySelectorAll('[data-submit]').forEach(btn=>{
      btn.onclick = ()=>{
        const targetId = btn.dataset.submit;
        const t = myTargetMap[targetId];
        const needsPhoto = t.requiresPhoto !== false;
        const formHost = document.getElementById('submit-form-'+targetId);
        if(formHost.innerHTML){ formHost.innerHTML = ''; return; }

        if(needsPhoto){
          formHost.innerHTML = `
            <div class="file-drop">
              <div style="font-size:12.5px;color:var(--muted);">Take or upload a photo as proof</div>
              <input type="file" accept="image/*" capture="environment" id="file-${targetId}">
              <img class="thumb-preview" id="thumb-${targetId}">
            </div>
            <textarea id="note-${targetId}" placeholder="Optional note" rows="2" style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;margin-bottom:8px;"></textarea>
            <button class="btn btn-primary btn-sm" id="send-${targetId}" disabled>Submit for Review</button>
            <div id="submsg-${targetId}" style="margin-top:6px;font-size:12px;"></div>
          `;
          let compressed = null;
          // Minted once per open form, not per tap — see runSubmit.
          const subId = uid();
          let attempt = 0;
          const fileInput = document.getElementById('file-'+targetId);
          const thumb = document.getElementById('thumb-'+targetId);
          const sendBtn = document.getElementById('send-'+targetId);
          fileInput.onchange = async ()=>{
            if(!fileInput.files[0]) return;
            sendBtn.disabled = true;
            try{
              compressed = await compressImage(fileInput.files[0], 720, 0.5);
              thumb.src = compressed;
              thumb.style.display = 'block';
              sendBtn.disabled = false;
            }catch(e){
              document.getElementById('submsg-'+targetId).textContent = 'Could not read that image — try another.';
            }
          };
          sendBtn.onclick = async ()=>{
            if(!compressed) return;
            attempt++;
            await runSubmit({
              subId, attempt, targetId, worker,
              photo: compressed,
              note: document.getElementById('note-'+targetId).value.trim(),
              sendBtn,
              msg: document.getElementById('submsg-'+targetId),
              onDone: ()=> renderWorkerDashboard(body, worker)
            });
          };
        } else {
          formHost.innerHTML = `
            <textarea id="note-${targetId}" placeholder="Optional note" rows="2" style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;margin-bottom:8px;"></textarea>
            <button class="btn btn-primary btn-sm" id="send-${targetId}">Submit for Review</button>
            <div id="submsg-${targetId}" style="margin-top:6px;font-size:12px;"></div>
          `;
          const sendBtn = document.getElementById('send-'+targetId);
          const subId = uid();
          let attempt = 0;
          sendBtn.onclick = async ()=>{
            attempt++;
            await runSubmit({
              subId, attempt, targetId, worker,
              photo: null,
              note: document.getElementById('note-'+targetId).value.trim(),
              sendBtn,
              msg: document.getElementById('submsg-'+targetId),
              onDone: ()=> renderWorkerDashboard(body, worker)
            });
          };
        }
      };
    });
    }

    // Rows are built on first expand rather than up front — most loads never
    // open this, so there's no reason to build up to 30 rows of HTML for it.
    let failsDrawn = false;
    async function drawMyFails(){
      const failsEl = document.getElementById('wp-fails');
      if(!failsEl || failsDrawn) return;
      failsDrawn = true;
      failsEl.innerHTML = `<div class="help" style="margin-bottom:0;">Loading…</div>`;
      const fetched = await getFails();
      const myFails = fetched.filter(f=>f.workerId===worker.id)
        .sort((a,b)=> String(b.failedAt||'').localeCompare(String(a.failedAt||'')));
      const typeLabel = { daily:'Daily', weekly:'Weekly', sidequest:'Challenger task' };
      failsEl.innerHTML = myFails.slice(0, 30).map(f=>{
        const when = f.taskDate || String(f.failedAt||'').slice(0,10);
        return `
          <div style="padding:8px 0;border-top:1px solid var(--line);">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <span style="font-size:13px;">${escapeHtml(f.title || 'a task')}</span>
              <span class="mono" style="font-size:11px;color:var(--muted);white-space:nowrap;">${when}</span>
            </div>
            <div style="font-size:10.5px;color:var(--muted);margin-top:2px;">${typeLabel[f.type] || 'Task'}${f.failKind ? ' &middot; ' + (f.failKind === 'rejected' ? 'rejected, not resubmitted' : 'not submitted') : ''}${f.points ? ' &middot; ' + f.points + ' pts missed' : ''}</div>
          </div>`;
      }).join('') + (myFails.length>30 ? `<div class="help" style="margin-top:8px;margin-bottom:0;">Showing your 30 most recent — ${myFails.length} in total.</div>` : '');
    }
    const failsToggle = document.getElementById('wp-fails-toggle');
    if(failsToggle){
      failsToggle.onclick = ()=>{
        const bodyEl = document.getElementById('wp-fails-body');
        const caret = document.getElementById('wp-fails-caret');
        const open = bodyEl.style.display !== 'none';
        if(!open) drawMyFails();
        bodyEl.style.display = open ? 'none' : 'block';
        caret.innerHTML = open ? 'Show &rsaquo;' : 'Hide &lsaquo;';
      };
    }

    wireBuildTag();
    // Leaving the dashboard signs this person out of the tab. Without
    // this they stayed unlocked, so on a shared phone the next person could
    // reach their tasks through a #worker&wid= link with no PIN.
    const switchLink = document.getElementById('wp-switch');
    if(switchLink) switchLink.onclick = () => {
      authedWorkers.delete(worker.id);
      clearWorkerSession();      // including a kept one: this is signing out
    };
    document.getElementById('wp-view-lb').onclick = ()=> renderWorkerLeaderboard(body, worker);
    const teamBtn = document.getElementById('wp-view-team');
    if(teamBtn) teamBtn.onclick = ()=> renderHeadReview(body, worker);
    document.getElementById('wp-view-all-badges').onclick = ()=> renderAllBadges(body, worker);
    const hellBtn = document.getElementById('wp-hell-open');
    if(hellBtn) hellBtn.onclick = ()=> renderHellWorker(body, worker);
  }

  // Head-facing review: same approve/reject actions as the admin Review tab,
  // but scoped strictly to the people who report to this head. A head can
  // never see or act on anyone outside their own team.
  async function renderHeadReview(body, worker){
    REVIEWING_HEAD = worker || null;
    body.innerHTML = `<div class="empty">Loading…</div>`;
    const [allWorkers, targets, pendingSubs] = await Promise.all([getWorkers(), getTargets(), getPendingSubs()]);
    const myTeam = allWorkers.filter(w=>w.reportsTo===worker.id);
    const teamIds = new Set(myTeam.map(w=>w.id));
    const nameById = {}; allWorkers.forEach(w=>{ nameById[w.id]=w.name; });
    const targetById = {}; targets.forEach(t=>{ targetById[t.id]=t; });
    // Challenger tasks and after-hours entries from this head's team are not
    // theirs to approve — those go to an admin. See adminOnlySub.
    const mine = pendingSubs
      .filter(s => teamIds.has(s.workerId) && !adminOnlySub(s, targetById[s.targetId]))
      .sort((a,b)=> (a.submittedAt||'').localeCompare(b.submittedAt||''));

    body.innerHTML = `
      <a class="backlink" href="#" id="hr-back">&lsaquo; Back to my dashboard</a>
      <div class="eyebrow" style="margin-top:14px;margin-bottom:6px;">My team &middot; ${myTeam.length} member${myTeam.length===1?'':'s'}</div>
      <div class="help">${myTeam.map(w=>escapeHtml(w.name)).join(', ') || 'Nobody assigned to you yet.'}</div>
      <div class="eyebrow" style="margin-top:16px;margin-bottom:10px;">Awaiting your review (${mine.length})</div>
      <div id="hr-list"></div>
    `;
    document.getElementById('hr-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };

    const listEl = document.getElementById('hr-list');
    if(mine.length===0){
      listEl.innerHTML = `<div class="card"><div class="empty">Nothing waiting for review right now.</div></div>`;
      return;
    }
    listEl.innerHTML = mine.map(s=>{
      const t = targetById[s.targetId];
      const dt = new Date(s.submittedAt);
      // A Do list day carries no single target, so the task card's Approve —
      // which looks its target up by id — found nothing and silently did
      // nothing at all. A head could press it all afternoon and the day
      // stayed pending with the jobs still open.
      if(s.isDay){
        const jobs = (s.targetIds || []).map(id => targetById[id]).filter(Boolean);
        return `
        <div class="card" style="margin-bottom:12px;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;"
            >Do list &middot; ${escapeHtml(s.dayDate || '')}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${
            escapeHtml(nameById[s.workerId]||'Unknown')} &middot; ${jobs.length || (s.targetIds||[]).length} job${
            (jobs.length || 1) === 1 ? '' : 's'} &middot; ${dt.toLocaleString()}</div>
          <div class="sub-note" style="margin-top:8px;color:var(--muted);">${jobs.length
            ? jobs.map(j => '&#10003; ' + escapeHtml(j.title)).join('<br>')
            : 'The jobs are no longer on file.'}</div>
          <input type="text" id="hr-remark-${s.id}" placeholder="Remark for the worker — required if you send it back" style="width:100%;margin-top:10px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;box-sizing:border-box;">
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-primary btn-sm" data-hr-approveday="${s.id}">Approve the day</button>
            <button class="btn btn-ghost btn-sm" data-hr-rejectday="${s.id}">Send back</button>
          </div>
        </div>`;
      }
      return `
        <div class="card" style="margin-bottom:12px;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;">${t?escapeHtml(t.title):'(task no longer exists)'}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${escapeHtml(nameById[s.workerId]||'Unknown')} &middot; ${dt.toLocaleString()}${t?` &middot; +${t.points} pts`:''}</div>
          ${lazyPhotoSlot(s, 'sub-photo') || `<div class="help" style="margin-top:8px;margin-bottom:0;">No photo required for this task.</div>`}
          ${s.note ? `<div class="sub-note" style="margin-top:8px;">${escapeHtml(s.note)}</div>` : ''}
          <input type="text" id="hr-remark-${s.id}" placeholder="Remark for the worker — required if you reject" style="width:100%;margin-top:10px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;box-sizing:border-box;">
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-primary btn-sm" data-hr-approve="${s.id}" data-target="${s.targetId}">Approve</button>
            <button class="btn btn-ghost btn-sm" data-hr-reject="${s.id}">Reject</button>
          </div>
        </div>`;
    }).join('');

    fillLazyPhotos(listEl);
    listEl.querySelectorAll('[data-hr-approveday]').forEach(btn=>{
      btn.onclick = async function(){
        this.disabled = true; this.textContent = 'Approving…';
        const sub = mine.find(x => x.id === this.dataset.hrApproveday);
        const rEl = document.getElementById('hr-remark-'+this.dataset.hrApproveday);
        const ok = sub ? await approveDoListDay(sub,
          rEl && rEl.value.trim() ? rEl.value.trim() : null) : false;
        if(!ok){ this.disabled = false; this.textContent = 'Approve the day'; return; }
        renderHeadReview(body, worker);
      };
    });
    listEl.querySelectorAll('[data-hr-rejectday]').forEach(btn=>{
      btn.onclick = async function(){
        const reason = rejectReason(document.getElementById('hr-remark-'+this.dataset.hrRejectday));
        if(reason === null) return;
        if(!confirm('Send this day back? They will need to fix it and send it again.')) return;
        this.disabled = true; this.textContent = 'Sending back…';
        const sub = mine.find(x => x.id === this.dataset.hrRejectday);
        if(sub) await rejectDoListDay(sub, reason);
        renderHeadReview(body, worker);
      };
    });
    listEl.querySelectorAll('[data-hr-approve]').forEach(btn=>{
      btn.onclick = async function(){
        this.disabled = true; this.textContent = 'Approving…';
        const rEl = document.getElementById('hr-remark-'+this.dataset.hrApprove);
        await approveTarget(this.dataset.target, this.dataset.hrApprove, rEl && rEl.value.trim() ? rEl.value.trim() : null);
        renderHeadReview(body, worker);
      };
    });
    listEl.querySelectorAll('[data-hr-reject]').forEach(btn=>{
      btn.onclick = async function(){
        // Before the confirm, not after: being asked to confirm and then
        // told the reason is missing is two refusals for one click.
        const reason = rejectReason(document.getElementById('hr-remark-'+this.dataset.hrReject));
        if(reason === null) return;
        if(!confirm('Reject this submission? The worker will need to resubmit.')) return;
        this.disabled = true; this.textContent = 'Rejecting…';
        await updateSub(this.dataset.hrReject, { status:'rejected', reviewedAt: new Date().toISOString(), reviewRemark: reason });
        renderHeadReview(body, worker);
      };
    });
  }

  // ---- Hell Mode (worker) ----
  // Its own screen rather than another band on the dashboard: an issue here
  // runs for weeks, and reading one means reading its history.
  let _hellTab = 'board';
  async function renderHellWorker(body, worker){
    body.innerHTML = `<div class="empty">Loading…</div>`;
    const [issues, workers] = await Promise.all([getHellIssues(), getWorkers()]);
    const nameById = {}; workers.forEach(w=>{ nameById[w.id] = w.name; });
    const board = issues.filter(i => i.state === 'open');
    const live = issues.filter(i => i.state === 'live');
    const done = issues.filter(i => i.state === 'done')
      .sort((a,b)=> String(b.completedAt||'').localeCompare(String(a.completedAt||'')));
    // Your own issue first — it is the one you came here for.
    live.sort((a,b)=> (hellIsMember(b, worker.id)?1:0) - (hellIsMember(a, worker.id)?1:0));
    if(_hellTab === 'board' && board.length === 0 && live.length > 0) _hellTab = 'live';

    const boardCard = (issue) => `
      <div class="hell-card">
        <div class="hell-dept">${escapeHtml(issue.department || 'Whole team')}</div>
        <div class="hell-name" style="margin-top:7px;">${escapeHtml(issue.title)}</div>
        ${issue.detail ? `<div class="hell-detail">${escapeHtml(issue.detail)}</div>` : ''}
        <div class="hell-figs">${hellRewardFigsHtml(issue)}${
          (issue.attempts||[]).length ? `<span class="hell-fig">${issue.attempts.length} gave up before</span>` : ''}</div>
        ${hellLastLineHtml(issue)}
        <button class="hell-btn" data-haccept="${issue.id}">Take this on</button>
      </div>`;

    const liveCard = (issue) => {
      const mine = hellIsMember(issue, worker.id);
      const owner = hellIsOwner(issue, worker.id);
      return `
      <div class="hell-card ${mine ? 'mine' : ''}">
        <div class="hell-dept">${escapeHtml(issue.department || 'Whole team')}</div>
        <div class="hell-name" style="margin-top:7px;">${escapeHtml(issue.title)}</div>
        ${issue.detail ? `<div class="hell-detail">${escapeHtml(issue.detail)}</div>` : ''}
        ${hellRosterHtml(issue, nameById)}
        ${hellTrackHtml(issue)}
        <div class="hell-figs">${hellDayFigHtml(issue)}${hellRewardFigsHtml(issue)}${hellSplitFigHtml(issue)}</div>
        ${hellLastLineHtml(issue)}
        ${owner && hellApplicants(issue).length ? (()=>{
          // Only the person carrying the issue sees this. Taking somebody
          // on cuts their own share, so it is their call to make.
          const after = hellSplit(issue.points, hellJoiners(issue).length + 1);
          return hellApplicants(issue).map(id => `
            <div class="hell-note"><b>${escapeHtml(nameById[id] || 'Someone')}</b>
              wants to join.${after.joiner > 0
                ? ` Your share would become ${after.owner} pts, theirs ${after.joiner}.` : ''}</div>
            <div style="display:flex;gap:8px;">
              <button class="hell-btn" style="flex:1;"
                data-haccept="${issue.id}|${escapeHtml(id)}">Let them in</button>
              <button class="hell-btn ghost" style="flex:1;"
                data-hdecline="${issue.id}|${escapeHtml(id)}">No thanks</button>
            </div>`).join('');
        })() : ''}
        ${mine ? (issue.pending
          ? `<div class="hell-note"><b>${escapeHtml(HELL_STAGES[issue.stage])} is with the admin.</b> Nothing to do until they come back on it.</div>`
          : `<input class="hell-in" id="hell-note-${issue.id}" type="text" placeholder="Anything the admin should know (optional)">
             <button class="hell-btn" data-hsubmit="${issue.id}">${escapeHtml(HELL_STAGES[issue.stage])} is done</button>`)
          : hellApplicants(issue).includes(worker.id)
            ? `<div class="hell-note">You have asked to join. ${
                escapeHtml(nameById[issue.ownerId] || 'The owner')} decides.</div>`
          : (()=>{
            // What joining would be worth to them, counting themselves in —
            // the figure they are actually deciding on.
            const after = hellSplit(issue.points, hellJoiners(issue).length + 1);
            return `<button class="hell-btn ghost" data-hjoin="${issue.id}">Ask to join${
              after.joiner > 0 ? ` &mdash; your share would be ${after.joiner} pts` : ''}</button>`;
          })()}
        ${owner && Number(issue.penalty) > 0
          ? `<div class="hell-note">Give this up and it costs you ${issue.penalty} points.</div>` : ''}
      </div>`;
    };

    body.innerHTML = `
      <a class="backlink" href="#" id="hell-back">&lsaquo; Back</a>
      <div class="hell">
        <div class="hell-slab" style="margin-top:10px;">
          <div class="hell-rule" style="width:46px;"></div>
          <h3 class="hell-kicker" style="margin-top:10px;">Hell Mode</h3>
          <div class="hell-sub">Standing problems a department lives with. Take one on and it is yours
            through all four stages &mdash; propose it, present it, put it in, get it reviewed.
            The points are a fixed pot: anyone can join you, and it splits between everyone on
            it, with the owner on a double share.</div>
        </div>
        <div class="hell-tabs">
          <span class="${_hellTab==='board'?'on':''}" data-htab="board">On the board${board.length?` (${board.length})`:''}</span>
          <span class="${_hellTab==='live'?'on':''}" data-htab="live">Being worked${live.length?` (${live.length})`:''}</span>
          <span class="${_hellTab==='done'?'on':''}" data-htab="done">Solved${done.length?` (${done.length})`:''}</span>
        </div>
        <div id="hell-list">
          ${_hellTab === 'board' ? (board.length ? board.map(boardCard).join('')
              : `<div class="hell-slab compact"><div class="hell-empty" style="padding:2px 0;">Nothing on the board right now. Check back &mdash; these come up.</div></div>`)
            : _hellTab === 'live' ? (live.length ? live.map(liveCard).join('')
              : `<div class="hell-slab compact"><div class="hell-empty" style="padding:2px 0;">Nobody has taken one on yet.</div></div>`)
            : (done.length ? `<div class="hell-slab compact">
                ${done.map(i=>`<div style="padding:9px 0;border-bottom:1px solid var(--h-line);">
                  <div class="hell-name" style="font-size:13px;">${escapeHtml(i.title)}</div>
                  <div class="hell-roster" style="margin-top:3px;">${escapeHtml(nameById[i.ownerId]||'Unknown')}${
                    hellJoiners(i).length ? ` with ${hellJoiners(i).map(id=>escapeHtml(nameById[id]||'?')).join(', ')}` : ''
                  } &middot; ${i.completedInDays} day${i.completedInDays===1?'':'s'}${i.paidOnTime?' &middot; beat the clock':''}</div>
                </div>`).join('')}
              </div>`
              : `<div class="hell-slab compact"><div class="hell-empty" style="padding:2px 0;">Nothing solved yet. Be the first.</div></div>`)}
        </div>
      </div>`;

    document.getElementById('hell-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };
    body.querySelectorAll('[data-htab]').forEach(t => t.onclick = ()=>{
      _hellTab = t.dataset.htab; renderHellWorker(body, worker);
    });

    // Re-read before writing: two workers can be looking at the same open
    // issue at the same moment, and only one of them can own it.
    async function actOn(id, fn){
      const fresh = await getHellIssues();
      const issue = fresh.find(x => x.id === id);
      if(!issue) return renderHellWorker(body, worker);
      if(fn(issue) === false) return renderHellWorker(body, worker);
      await setHellIssues(fresh);
      renderHellWorker(body, worker);
    }

    body.querySelectorAll('[data-haccept]').forEach(btn => btn.onclick = async function(){
      const issue = board.find(i => i.id === this.dataset.haccept);
      if(!confirm(`Take on "${issue.title}"? It is yours until it is solved${
        Number(issue.penalty) > 0 ? `, and giving up costs ${issue.penalty} points` : ''}.`)) return;
      this.disabled = true; this.textContent = 'Taking it on…';
      await actOn(this.dataset.haccept, (i)=> hellAccept(i, worker));
    });
    body.querySelectorAll('[data-hjoin]').forEach(btn => btn.onclick = async function(){
      this.disabled = true; this.textContent = 'Asking…';
      await actOn(this.dataset.hjoin, (i)=> hellApply(i, worker));
    });
    body.querySelectorAll('[data-haccept]').forEach(btn => btn.onclick = async function(){
      const [id, wid] = this.dataset.haccept.split('|');
      this.disabled = true; this.textContent = 'Adding…';
      await actOn(id, (i)=> hellAcceptApplicant(i, wid, worker.id));
    });
    body.querySelectorAll('[data-hdecline]').forEach(btn => btn.onclick = async function(){
      const [id, wid] = this.dataset.hdecline.split('|');
      this.disabled = true; this.textContent = 'Turning down…';
      await actOn(id, (i)=> hellDeclineApplicant(i, wid, worker.id));
    });
    body.querySelectorAll('[data-hsubmit]').forEach(btn => btn.onclick = async function(){
      const id = this.dataset.hsubmit;
      const noteEl = document.getElementById('hell-note-' + id);
      const note = noteEl ? noteEl.value.trim() : '';
      this.disabled = true; this.textContent = 'Sending…';
      await actOn(id, (i)=> hellSubmitStage(i, worker.id, note));
    });
  }

  async function renderAllBadges(body, worker){
    const [totals, targets, allWorkers, badges, archive] = await Promise.all([getTotalsEnsured(), getTargets(), getWorkers(), getBadges(), getTargetArchive()]);
    const ledger = totals ? null : await getLedger();
    const tEarned = id => totals ? ((totals.byWorker[id]||{}).earned || 0) : earnedFor(ledger, id);
    const tReached = id => totals ? ((totals.byWorker[id]||{}).reachedAt || '') : reachedAtFor(ledger, id);
    const earned = tEarned(worker.id);
    const targetsAchieved = achievedCountFor(targets, worker.id) + archiveCountFor(archive, worker.id, 'achieved');
    const sideQuestsAchieved = sideQuestsAchievedCountFor(targets, worker.id) + archiveCountFor(archive, worker.id, 'sideQuests');
    const rankedAll = allWorkers.map(w=>({ id:w.id, earned: tEarned(w.id), reachedAt: tReached(w.id) })).sort((a,b)=> b.earned - a.earned || a.reachedAt.localeCompare(b.reachedAt));
    const myRank = rankedAll.findIndex(w=>w.id===worker.id) + 1;
    const badgeCtx = { earned, targetsAchieved, sideQuestsAchieved, rank: myRank };
    const myEarned = earnedBadges(badgeCtx, badges);
    const myEarnedIds = new Set(myEarned.map(b=>b.id));

    const byGroup = {};
    badges.forEach(b=>{ (byGroup[b.group]=byGroup[b.group]||[]).push(b); });

    body.innerHTML = `
      <a class="backlink" href="#" id="ab-back">&lsaquo; Back to my dashboard</a>
      <div class="eyebrow" style="margin-top:14px;margin-bottom:10px;">All Badges</div>
      <div id="ab-list"></div>
    `;
    document.getElementById('ab-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };

    document.getElementById('ab-list').innerHTML = Object.keys(byGroup).sort((a,b)=>GROUP_PRIORITY[a]-GROUP_PRIORITY[b]).map(group=>`
      <div class="card" style="margin-bottom:14px;">
        <h3 style="margin-bottom:10px;">${escapeHtml(GROUP_LABELS[group]||group)}</h3>
        ${byGroup[group].sort((a,b)=>a.need-b.need).map(b=>{
          const isEarned = myEarnedIds.has(b.id);
          return `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);${isEarned?'':'opacity:0.55;'}">
              <span style="font-size:24px;">${isEarned ? b.emoji : '🔒'}</span>
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;font-size:13.5px;">${escapeHtml(b.label)}</div>
                <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${escapeHtml(b.desc)}</div>
              </div>
              ${isEarned ? `<span class="badge badge-achieved">Earned</span>` : ''}
            </div>`;
        }).join('')}
      </div>`).join('');
  }

  async function renderWorkerLeaderboard(body, worker, period, group){
    period = period || 'lifetime';
    body.innerHTML = `<div class="empty">Loading leaderboard…</div>`;
    const [workers, totals, targets, badges, archive] = await Promise.all([getWorkers(), getTotalsEnsured(), getTargets(), getBadges(), getTargetArchive()]);
    // Fall back to the raw ledger only if the totals cache is unavailable.
    const ledger = totals ? null : await getLedger();
    // Default to whichever group the viewer belongs to, so a head lands on
    // the heads board and a junior lands on the workers board.
    if(!group) group = worker.isHead ? 'heads' : 'workers';
    const anyHeads = workers.some(w=>w.isHead);

    // Lifetime rank (used for rank-based badges) is scoped to the same group —
    // being "#1" should mean #1 among your peers, not across mixed groups.
    const groupWorkers = anyHeads
      ? workers.filter(w => group==='heads' ? !!w.isHead : !w.isHead)
      : workers;

    const lIdx = totals ? null : buildLedgerIndex(ledger);
    const wEarned = id => totals ? ((totals.byWorker[id]||{}).earned || 0) : idxEarned(lIdx, id, null);
    const wReached = id => totals ? ((totals.byWorker[id]||{}).reachedAt || '') : idxReachedAt(lIdx, id, null);
    const wBalance = id => totals ? ((totals.byWorker[id]||{}).balance || 0) : balanceFor(ledger, id);
    const tIdx = buildTargetIndex(targets);
    const cutoff = null; // neither Lifetime nor Challenger Task is date-filtered

    const lifetimeRanked = groupWorkers.map(w=>({ id:w.id, earned: wEarned(w.id), reachedAt: wReached(w.id) })).sort((a,b)=> b.earned - a.earned || a.reachedAt.localeCompare(b.reachedAt));
    const lifetimeRankMap = {}; lifetimeRanked.forEach((w,i)=> lifetimeRankMap[w.id]=i+1);

    const ranked = groupWorkers.map(w=>({
      ...w,
      earnedPeriod: wEarned(w.id),
      earnedLifetime: wEarned(w.id),
      targetsAchieved: (tIdx[w.id] ? tIdx[w.id].achieved : 0) + archiveCountFor(archive, w.id, 'achieved'),
      sideQuestsAchieved: (tIdx[w.id] ? tIdx[w.id].sideQuests : 0) + archiveCountFor(archive, w.id, 'sideQuests'),
      lifetimeRank: lifetimeRankMap[w.id],
      reachedAtPeriod: period==='sidequest' ? idxSideQuestReachedAt(tIdx, w.id) : wReached(w.id)
    })).sort((a,b)=> period==='sidequest'
      ? (b.sideQuestsAchieved - a.sideQuestsAchieved || a.reachedAtPeriod.localeCompare(b.reachedAtPeriod))
      : (b.earnedPeriod - a.earnedPeriod || a.reachedAtPeriod.localeCompare(b.reachedAtPeriod)));
    ranked.forEach((w,i)=> w.periodRank = i+1);
    const top20 = ranked.slice(0, 20);
    const periodLabel = { lifetime:'All Time', sidequest:'Challenger Tasks' }[period];

    body.innerHTML = `
      <a class="backlink" href="#" id="wp-back">&lsaquo; Back to my dashboard</a>
      <div class="eyebrow" style="margin-top:14px;margin-bottom:10px;">Team Leaderboard</div>
      ${anyHeads ? `
      <div class="toggle-group" id="wp-lb-group-toggle">
        <div class="toggle-opt${group==='workers'?' selected':''}" data-group="workers" style="${group==='workers'?'border-color:var(--ink);color:var(--ink);background:var(--paper);':''}">Workers</div>
        <div class="toggle-opt${group==='heads'?' selected':''}" data-group="heads" style="${group==='heads'?'border-color:var(--ink);color:var(--ink);background:var(--paper);':''}">Heads</div>
      </div>` : ''}
      <div class="toggle-group" id="wp-lb-period-toggle">
        ${PERIODS.map(p=>`<div class="toggle-opt${p.key===period?' selected':''}" data-period="${p.key}" style="${p.key===period?'border-color:var(--amber);color:var(--amber-dark);background:#FFF6E8;':''}">${p.label}</div>`).join('')}
      </div>
      <div class="help" style="margin-top:0;">Top ${top20.length} &middot; ranked by ${period==='sidequest' ? 'challenger tasks completed' : periodLabel.toLowerCase()+' points'}</div>
      <div id="wp-lb-list"></div>
    `;
    document.getElementById('wp-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };
    document.querySelectorAll('#wp-lb-period-toggle [data-period]').forEach(opt=>{
      opt.onclick = ()=> renderWorkerLeaderboard(body, worker, opt.dataset.period, group);
    });
    document.querySelectorAll('#wp-lb-group-toggle [data-group]').forEach(opt=>{
      opt.onclick = ()=> renderWorkerLeaderboard(body, worker, period, opt.dataset.group);
    });

    const listEl = document.getElementById('wp-lb-list');
    if(top20.length===0){
      listEl.innerHTML = `<div class="card"><div class="empty">Nobody in this group yet.</div></div>`;
      return;
    }
    listEl.innerHTML = top20.map(w=>{
      const medalClass = w.periodRank===1?'medal-1':w.periodRank===2?'medal-2':w.periodRank===3?'medal-3':'medal-n';
      const medalContent = w.periodRank<=3 ? '&#9733;' : w.periodRank;
      const topBadge = highestBadge({ earned: w.earnedLifetime, targetsAchieved: w.targetsAchieved, sideQuestsAchieved: w.sideQuestsAchieved, rank: w.lifetimeRank }, badges);
      const rowAvatar = avatarInfoFor(w.earnedLifetime);
      const isMe = w.id === worker.id;
      return `
        <div class="rank-row" style="${isMe ? 'border-color:var(--amber);background:#FFFAF0;' : ''}">
          <div class="rank-medal ${medalClass}">${medalContent}</div>
          <div class="rank-info">
            <div class="rank-name">${rowAvatar.emoji} ${escapeHtml(w.name)}${isMe ? ' <span style="color:var(--amber-dark);font-size:11px;">(you)</span>' : ''} <span style="color:var(--muted);font-size:10.5px;font-weight:400;">Lv.${rowAvatar.level}</span></div>
            <div class="rank-role">${escapeHtml(w.role||'')}</div>
            ${topBadge ? `<div class="rank-badges"><span class="em" title="${escapeHtml(topBadge.label)}">${topBadge.emoji}</span></div>` : ''}
          </div>
          ${period==='sidequest'
            ? `<div class="rank-points"><div class="n">${w.sideQuestsAchieved}</div><div class="l">completed</div></div>`
            : `<div class="rank-points"><div class="n">${w.earnedPeriod}</div><div class="l">pts</div></div>`}
        </div>`;
    }).join('');
  }

  // "31 Oct, 10:42am" — a reminder cleared yesterday evening and one cleared
  // this morning have to be tellable apart at a glance.
  function annStamp(iso){
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const day = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Kuala_Lumpur',
      day:'numeric', month:'short' }).format(d);
    const time = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Kuala_Lumpur',
      hour:'numeric', minute:'2-digit', hour12:true }).format(d).replace(' ', '');
    return day + ', ' + time;
  }

  function annWhen(iso){
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const mins = Math.round((Date.now() - d.getTime()) / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + ' min ago';
    const h = Math.floor(mins / 60);
    return h + (h === 1 ? ' hour ago' : ' hours ago');
  }

  // A ship's horn, built in the browser rather than loaded as a file:
  // nothing to host, nothing to download, and it works offline.
  // Browsers keep a page silent until someone has interacted with it, so
  // the display asks for one tap before it can make any noise at all.
  let _annAudio = null;
  function audioReady(){
    return !!(_annAudio && _annAudio.state === 'running');
  }
  async function enableAudio(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return false;
      if(!_annAudio) _annAudio = new Ctx();
      if(_annAudio.state === 'suspended') await _annAudio.resume();
      return _annAudio.state === 'running';
    }catch(e){ return false; }
  }
  const SOUND_SECONDS = 5;

  // A note that HOLDS before it falls away. An exponential decay over the
  // whole length collapses most of the way in its first third, so a chord
  // written to last two seconds is inaudible after one — which is how the
  // first attempt at both of these ended up half a second short.
  function _hold(ctx, dest, freq, at, dur, level){
    ['triangle', 'sine'].forEach((type, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq * (i ? 2 : 1);
      const peak = Math.max(0.0002, level * (i ? 0.3 : 1));
      const rel = Math.min(0.45, dur * 0.3);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(peak, at + 0.03);
      g.gain.setValueAtTime(peak, at + dur - rel);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      osc.connect(g); g.connect(dest);
      osc.start(at); osc.stop(at + dur + 0.02);
    });
  }

  // One voice of a tuned note: a triangle for body, a sine an octave up for
  // sparkle. Shared by both sounds so they sit in the same world.
  function _note(ctx, dest, freq, at, dur, level){
    ['triangle', 'sine'].forEach((type, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq * (i ? 2 : 1);
      const peak = level * (i ? 0.3 : 1);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      osc.connect(g); g.connect(dest);
      osc.start(at); osc.stop(at + dur + 0.02);
    });
  }

  // A NEW REMINDER: a bright rising fanfare that keeps climbing for the
  // full five seconds rather than a quick flourish that is over before
  // anyone has looked up.
  function playFanfare(){
    if(!audioReady()) return false;
    const ctx = _annAudio;
    const t0 = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.value = 0.8;
    master.connect(ctx.destination);

    // C major, climbing two octaves in triplets, then the top note held.
    const scale = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
    let at = t0;
    for(let round = 0; round < 3; round++){
      scale.forEach((f, i) => {
        _note(ctx, master, f, at, 0.30, 0.22 + round * 0.04);
        at += 0.185;
      });
    }
    // The last climb lands on a held chord that rings right out to five
    // seconds — held, not decaying, or it fades out early.
    const END = t0 + SOUND_SECONDS;
    [1046.50, 1318.51, 1567.98, 2093.00].forEach((f, i) => {
      _hold(ctx, master, f, END - 1.7, 1.7, 0.26 - i * 0.03);
    });
    return true;
  }

  // A REMINDER CLEARED: a celebration rather than a call to attention —
  // a quick major arpeggio, then scattered sparkles over the top, five
  // seconds end to end.
  function playParty(){
    if(!audioReady()) return false;
    const ctx = _annAudio;
    const t0 = ctx.currentTime;
    const END = t0 + SOUND_SECONDS;
    const master = ctx.createGain();
    master.gain.value = 0.75;
    master.connect(ctx.destination);

    // Three cheerful rising runs.
    const run = [523.25, 659.25, 783.99, 1046.50];
    [0, 0.95, 1.9].forEach((off, r) => {
      run.forEach((f, i) => {
        _note(ctx, master, f * (r === 2 ? 1.5 : 1), t0 + off + i * 0.11, 0.34, 0.24);
      });
    });

    // Sparkles: short high blips at pitches from a pentatonic set, so they
    // never clash however they fall.
    const penta = [1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];
    for(let i = 0; i < 30; i++){
      const at = t0 + 1.1 + (i / 30) * (SOUND_SECONDS - 1.3);
      const f = penta[(i * 7 + (i % 5)) % penta.length];
      _note(ctx, master, f, at, 0.20, 0.10);
    }
    // A warm chord underneath holds it together right to the end.
    [261.63, 329.63, 392.00, 523.25].forEach((f) => {
      _hold(ctx, master, f, t0 + 0.05, SOUND_SECONDS - 0.08, 0.14);
    });
    // One last bright hit to finish on, rather than trailing off.
    [1046.50, 1567.98, 2093.00].forEach((f, i) => {
      _hold(ctx, master, f, t0 + SOUND_SECONDS - 0.95, 0.9, 0.2 - i * 0.03);
    });
    return true;
  }

      </style>
      <div class="wd-top">
        <div class="wd-title">EXPREXA &middot; REMINDERS</div>
        <div class="wd-clock" id="wd-clock">--:--</div>
      </div>
      <div class="wd-body" id="wd-body"></div>
      <div class="wd-foot">
        <span>Esc to close</span>
        <span id="wd-dots"></span>
        <button class="wd-sound" id="wd-sound">Tap once to turn sound on</button>
      </div>`;
    document.body.appendChild(el);

    const bodyEl  = el.querySelector('#wd-body');
    const dotsEl  = el.querySelector('#wd-dots');
    const soundEl = el.querySelector('#wd-sound');

    const refreshSoundBtn = () => {
      if(audioReady()){
        soundEl.textContent = 'Sound on';
        soundEl.style.background = 'transparent';
        soundEl.style.color = '#5d6879';
        soundEl.style.fontWeight = '500';
      }
    };
    refreshSoundBtn();
    soundEl.onclick = async () => {
      if(await enableAudio()){ refreshSoundBtn(); playFanfare(); }
      else soundEl.textContent = 'This screen cannot play sound';

    // Shrink until it fits. A long reminder, or four at once, would
    // otherwise run off the bottom of the screen where nobody can read it —
    // and on a wall display there is no scrollbar and nobody standing there
    // to scroll. Short ones stay large.
    function fitToScreen(el, hostEl, minScale){
      el.style.fontSize = '';
      let size = 100;
      const room = () => hostEl.clientHeight - 4;
      let guard = 0;
      while(el.scrollHeight > room() && size > (minScale || 45) && guard++ < 40){
        size -= 5;
