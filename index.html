        <div style="display:flex;gap:10px;margin-top:14px;">
          <div style="flex:1;">
            <div class="sect" style="margin:0 0 6px;">PIECES AFFECTED</div>
            <input id="sv-pcs" type="number" min="1" placeholder="optional"
              style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;">
          </div>
          ${hawbs.length ? `<div style="flex:1;">
            <div class="sect" style="margin:0 0 6px;">WHICH HAWB</div>
            <select id="sv-hawb" style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;">
              <option value="">Choose&hellip;</option>
              ${hawbs.map(h=>`<option value="${escapeHtml(h.no)}">${escapeHtml(h.no)}</option>`).join('')}
            </select></div>` : ''}
        </div>
        <div class="sect" style="margin:14px 0 6px;">NOTES</div>
        <textarea id="sv-notes" rows="3" placeholder="What you saw — cartons soaked on one side, seal broken, 2 pcs missing…"
          style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;"></textarea>
        <div class="sect" style="margin:14px 0 6px;">PHOTO</div>
        <div id="sv-thumbs" style="margin-bottom:10px;"></div>
        <input type="file" accept="image/*" capture="environment" id="sv-file" style="display:none;">
        <input type="file" accept="image/*" id="sv-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button class="lot-act ghost" id="sv-take" style="flex:1;">Take photo</button>
          <button class="lot-act ghost" id="sv-pick" style="flex:1;">Upload photo</button>
        </div>
        <button class="advance needs-input" id="sv-save" style="margin-top:14px;">
          <small>Raised as Created — close it later with a second photo</small>Raise survey report</button>
        <div id="sv-msg" style="margin-top:9px;font-size:12.5px;text-align:center;"></div>
      </div>
      <div style="height:20px;"></div>`;

    const msg = document.getElementById('sv-msg');
    function paintConds(){
      c.querySelectorAll('.sv-cond').forEach(el=>{
        const on = picked.has(el.dataset.cond);
        el.style.background = on ? 'rgba(214,69,69,.14)' : '#fff';
        el.style.color = on ? 'var(--red)' : 'var(--muted)';
        el.style.borderColor = on ? 'var(--red)' : 'var(--line)';
        el.style.fontWeight = on ? '700' : '600';
      });
    }
    c.querySelectorAll('.sv-cond').forEach(el=>{
      el.onclick = () => {
        if(picked.has(el.dataset.cond)) picked.delete(el.dataset.cond);
        else picked.add(el.dataset.cond);
        paintConds();
      };
    });
    paintConds();

    function paintThumbs(){
      const host = document.getElementById('sv-thumbs');
      host.innerHTML = photo
        ? `<div style="position:relative;display:inline-block;">
            <img src="${photo.dataUrl}" style="max-width:100%;max-height:200px;border-radius:9px;border:1.5px solid var(--line);display:block;">
            <span id="sv-drop" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;
              width:22px;height:22px;border-radius:11px;font-size:14px;line-height:22px;text-align:center;cursor:pointer;">&times;</span>
          </div>`
        : `<div style="font-size:12.5px;color:var(--muted);">No photo taken yet — one photo goes with this report.</div>`;
      const drop = document.getElementById('sv-drop');
      if(drop) drop.onclick = () => { photo = null; paintThumbs(); };
    }
    paintThumbs();

    // The photo uploads as soon as it is taken, so saving the report at the
    // end is a small write even on a weak warehouse signal.
    async function takeFile(input){
      const f = input.files && input.files[0];
      if(!f) return;
      msg.style.color = 'var(--muted)';
      msg.textContent = photo ? 'Replacing photo…' : 'Adding photo…';
      try{
        const dataUrl = await resizeImageFile(f, PHOTO_DOC.max, PHOTO_DOC.q);
        const id = await savePhoto(dataUrl);
        photo = { id, dataUrl };
        paintThumbs();
        msg.textContent = '';
      }catch(e){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Could not add that photo — try another.';
      }
      input.value = '';
    }
    document.getElementById('sv-take').onclick = () => document.getElementById('sv-file').click();
    document.getElementById('sv-pick').onclick = () => document.getElementById('sv-upload').click();
    document.getElementById('sv-file').onchange = function(){ takeFile(this); };
    document.getElementById('sv-upload').onchange = function(){ takeFile(this); };
    document.getElementById('sv-bk').onclick = () => reopenDetail(s);

    document.getElementById('sv-save').onclick = async function(){
      if(picked.size === 0){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Tick at least one — wet, torn, damaged or short landed.';
        return;
      }
      const notes = document.getElementById('sv-notes').value.trim();
      const pcsRaw = document.getElementById('sv-pcs').value;
      const hawbEl = document.getElementById('sv-hawb');
      const pcs = pcsRaw === '' ? null : Math.max(1, parseInt(pcsRaw, 10) || 0) || null;
      // Damage is to a particular consignment, and the fee for surveying it
      // is billed against that house bill. Leaving it on the master would
      // put the charge on a bill nobody can match it to.
      if(hawbEl && !hawbEl.value){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Choose which HAWB this survey is for.';
        return;
      }
      if(!photo && !notes){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Add the photo or a note so the report says what was seen.';
        return;
      }
      this.disabled = true; this.textContent = 'Saving…';
      try{
        await saveSurvey(s, {
          id: uid(), status: 'created',
          date: todayStr(), at: new Date().toISOString(), by: ME.name,
          conditions: SURVEY_CONDITIONS.map(c2=>c2.key).filter(k => picked.has(k)),
          pcs, hawb: hawbEl ? hawbEl.value : '', notes,
          photoId: photo ? photo.id : null
        });
        reopenDetail(s);
      }catch(e){
        this.disabled = false; this.textContent = 'Raise survey report';
        msg.style.color = 'var(--red)';
        msg.textContent = 'Could not save: ' + e.message;
      }
    };
  }

  // A small screen requiring a photo before the caller's action proceeds.
  // Used at the points in the workflow that need proof: Docs in, moving into
  // Delivery, and Closing.
  function requirePhoto(title, subtitle, onConfirm, onCancel){
    const c = document.getElementById('content') || document.getElementById('app');
    let file = null;
    c.innerHTML = `
      <div class="back" id="ph-bk">&larr; Cancel</div>
      <div class="head" style="padding-bottom:16px;">
        <div class="awb-lg" style="font-family:'Space Grotesk',sans-serif;font-size:18px;">${escapeHtml(title)}</div>
        <div class="meta">${escapeHtml(subtitle)} &middot; a photo is required for this step</div>
      </div>
      <div class="card" style="text-align:center;padding:22px 16px;">
        <div id="ph-preview" style="margin-bottom:14px;">
          <div style="font-size:12.5px;color:var(--muted);">No photo taken yet</div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="ph-file" style="display:none;">
        <input type="file" accept="image/*" id="ph-upload" style="display:none;">
        <div style="display:flex;gap:8px;">
          <button type="button" class="lot-act ghost" id="ph-pick" style="border-radius:9px;flex:1;">Take photo</button>
          <button type="button" class="lot-act ghost" id="ph-browse" style="border-radius:9px;flex:1;">Upload photo</button>
        </div>
      </div>
      <div class="msg" id="ph-msg"></div>
      <button class="advance" id="ph-go">Confirm</button>`;
    document.getElementById('ph-bk').onclick = () => onCancel && onCancel();
    // Two ways in: straight to the camera, or pick an existing photo.
    const fileInput = document.getElementById('ph-file');
    const uploadInput = document.getElementById('ph-upload');
    document.getElementById('ph-pick').onclick = () => fileInput.click();
    document.getElementById('ph-browse').onclick = () => uploadInput.click();
    function onPhPicked(input){
      file = input.files[0] || null;
      const prev = document.getElementById('ph-preview');
      if(file){
        const url = URL.createObjectURL(file);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:220px;border-radius:10px;">`;
      }
    }
    fileInput.onchange = () => onPhPicked(fileInput);
    uploadInput.onchange = () => onPhPicked(uploadInput);
    document.getElementById('ph-go').onclick = async function(){
      const msg = document.getElementById('ph-msg');
      if(!file){ msg.style.color='var(--red)'; msg.textContent='Take a photo first.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      try{
        const dataUrl = await resizeImageFile(file, PHOTO_DOC.max, PHOTO_DOC.q);
        const photoId = await savePhoto(dataUrl);
        onConfirm(photoId);
      }catch(e){
        this.disabled = false; this.textContent = 'Confirm';
        msg.style.color='var(--red)'; msg.textContent = e.message || 'Could not save the photo — try again.';
      }
    };
  }

  // House AWBs consolidated under this master AWB. Optional — a direct
  // shipment has none, a consolidation can have several. The consol lands
  // and clears as one under the MAWB, then each HAWB is delivered to its own
  // consignee separately, so each carries its own piece count and its own
  // delivery status. Older records stored HAWBs as plain strings; those are
  // read as a HAWB with no known piece count.
  function hawbList(s){
    if(!Array.isArray(s.hawbs)) return [];
    return s.hawbs.filter(Boolean).map(h => typeof h === 'string'
        ? { no: h, pcs: null, kg: null, principal: '', customer: '',
            cargo: 'general', dg: false, endorsements: [] }
        : { no: h.no, pcs: h.pcs == null ? null : h.pcs,
            kg: h.kg == null ? null : Number(h.kg), principal: h.principal || '',
            customer: h.customer || '', from: h.from || '', to: h.to || '',
            flight: h.flight || '', date: h.date || '', time: h.time || '',
            k1: !!h.k1, cargo: cargoOf(h), dg: cargoOf(h) === 'dg',
            dutyFee: h.dutyFee == null ? null : Number(h.dutyFee),
            endorsements: Array.isArray(h.endorsements) ? h.endorsements : [] })
      .filter(h => h.no);
  }
  // Which house bills a lot brought in. Older lots carry none, in which case
  // the lot is treated as covering whatever is left.
  function lotHawbs(l){ return Array.isArray(l && l.hawbs) ? l.hawbs : []; }
  // A lot can be recorded as arriving with nothing on it: the flight came and
  // the cargo did not. That is a real event worth recording — it starts the
  // clock, it is what the balance is measured from, and it lets the lot be
  // moved along and closed — but there is no cargo behind it. So nothing is
  // billed for it, nothing can be delivered against it, and everything the
  // lot was expecting stays outstanding.
  //
  // Only an explicit zero counts. A lot saved before this existed has no
  // pcsArrived at all, and must keep being read as carrying its cargo.
  function lotEmpty(l){
    return !!(l && l.hasArrived) && l.pcsArrived === 0;
  }
  function lotHasCargo(l){ return !!(l && l.hasArrived) && !lotEmpty(l); }
  // House bills not yet claimed by a lot that has landed.
  function hawbsNotArrived(s, exceptLot){
    const taken = new Set();
    (s.lots||[]).forEach(l => {
      if(l === exceptLot || !l.hasArrived) return;
      lotHawbs(l).forEach(no => taken.add(no));
    });
    return hawbList(s).filter(h => !taken.has(h.no));
  }
  // The lot a house bill came in on, if any has claimed it.
  function lotForHawb(s, no){
    return (s.lots||[]).find(l => l.hasArrived && lotHawbs(l).includes(no)) || null;
  }
  // The lot a house bill is booked on, landed or not — the one that carries
  // its arrival, its progress and its own shortfall.
  function lotOfHawb(s, no){
    return (s.lots||[]).find(l => lotHawbs(l).includes(no)) || null;
  }
  // Every lot booked against a house bill, in shipment order. A bill that
  // lands short gets a lot of its own for the balance, so one house bill can
  // run several — and each of them clears on its own.
  function lotsForHawb(s, no){
    return (s.lots||[]).filter(l => lotHawbs(l).includes(no));
  }
  // The lot of a house bill that is in hand right now — the one its status
  // and its waiting time come from. Where several are open, the one that has
  // been sitting longest, so the slowest part of the bill is what shows.
  function activeLotForHawb(s, no){
    const ls = lotsForHawb(s, no);
    if(!ls.length) return null;
    const open = ls.filter(l => !l.closed);
    const pool = open.length ? open : ls;
    const here = pool.filter(l => l.hasArrived);
    if(!here.length) return pool[0];
    return here.reduce((a,b) => ageHours(b.stageAt) > ageHours(a.stageAt) ? b : a);
  }
  // A lot naming no house bill covers whatever is on the master — an older
  // consolidation, booked before bills were split onto their own lots. Where
  // one exists, a bill with no lot of its own rides on it; where none does, a
  // bill without a lot simply has not been recorded as arriving.
  function hasUnmappedLot(s){
    return (s.lots||[]).some(l => lotHawbs(l).length === 0);
  }
  // Has this particular house bill reached the terminal? Each one is its own
  // consignment, so one landing says nothing about the next: a bill still in
  // the air is not billable and does not take the status of the one beside it.
  function hawbArrived(s, no){
    if(s.type === 'export') return (s.stage||0) >= 1 || (s.xtracks||[]).some(t => (t.stage||0) >= 1);
    const ls = lotsForHawb(s, no);
    // Only an old unmapped lot lets the shipment answer for a bill — so
    // nothing already on the board stops billing, while a bill added after
    // booking is correctly still in the air until its own lot is recorded.
    if(!ls.length) return hasUnmappedLot(s) && (s.lots||[]).some(x => x.hasArrived);
    return ls.some(l => l.hasArrived);
  }
  // Has any of it actually turned up? Recording a lot as arriving with nothing
  // on it says the flight came, which is what the balance and the clock are
  // measured from — but it is not cargo with the terminal, so it raises no
  // charge. Billing asks this; the status and the balance ask hawbArrived.
  function hawbHasCargo(s, no){
    if(s.type === 'export') return hawbArrived(s, no);
    const ls = lotsForHawb(s, no);
    if(!ls.length) return hasUnmappedLot(s) && (s.lots||[]).some(l => lotHasCargo(l));
    return ls.some(l => lotHasCargo(l));
  }
  // Pieces of a house bill that have actually landed, added up across its own
  // lots. A lot carrying one house bill contributes everything that arrived on
  // it; a lot ticked against several cannot be split any further, so each of
  // those bills counts as fully here.
  function hawbArrivedPcs(s, h){
    let n = 0;
    lotsForHawb(s, h.no).forEach(l => {
      // An empty lot brought in none of it, however many bills it names.
      if(!lotHasCargo(l)) return;
      n += lotHawbs(l).length === 1 ? (Number(l.pcsArrived)||0) : (Number(h.pcs)||0);
    });
    return n;
  }
  // What a house bill is still waiting on. The balance belongs to the bill
  // that was short — never to the master, and never to the bill beside it.
  // null where the bill was booked without a piece count, since there is then
  // nothing to measure against.
  function hawbBalance(s, h){
    if(h.pcs == null) return null;
    // Covered by an old unmapped lot: what landed was recorded against the
    // master, so this bill's share of it cannot be worked out. Unknown, not
    // outstanding — claiming a balance here would invent one.
    if(!lotsForHawb(s, h.no).length && hasUnmappedLot(s)) return null;
    return Math.max(0, (Number(h.pcs)||0) - hawbArrivedPcs(s, h));
  }
  // With house bills carrying their own route and flight, the shipment's own
  // are whatever they agree on — and "mixed" where they do not, so nothing
  // claims a single flight that was really several.
  function commonOf(list, key){
    const vals = [...new Set(list.map(h => h[key]).filter(Boolean))];
    return vals.length === 1 ? vals[0] : (vals.length === 0 ? '' : 'MIXED');
  }
  // Every agency sign-off across the house bills, so the master still says
  // which ones the shipment as a whole needs.
  function unionOf(list, key){
    const out = [];
    list.forEach(h => (h[key] || []).forEach(v => { if(!out.includes(v)) out.push(v); }));
    return out;
  }
  function allDeliveries(s){
    // Import runs sit on each lot; export runs (the shipper bringing cargo
    // in) sit on the shipment itself, since export never splits into lots.
    return (s.lots||[]).flatMap(l => (l.deliveries||[])).concat(s.deliveries||[]);
  }
  // Delivered pieces and status for each HAWB, worked out from the delivery
  // runs recorded against it across every lot.
  function hawbProgress(s){
    const runs = allDeliveries(s);
    return hawbList(s).map(h => {
      const mine = runs.filter(d => d.hawb === h.no);
      const delivered = mine.reduce((a,d)=>a+(d.pcs||0),0);
      let status;
      if(h.pcs != null) status = delivered >= h.pcs ? 'done' : delivered > 0 ? 'part' : 'none';
      else status = delivered > 0 ? 'part' : 'none';
      return { ...h, delivered, remaining: h.pcs != null ? Math.max(0, h.pcs - delivered) : null, status, runs: mine };
    });
  }
  // Principal and any endorsements, on the shipment header. Older shipments
  // carry neither, so each part only appears when it is actually set.
  function principalHeaderHtml(s){
    const bits = [];
    if(s.principal) bits.push(`Principal: <span style="color:#fff;">${escapeHtml(s.principal)}</span>`);
    if((s.endorsements||[]).length) bits.push(
      `Endorsement: <span style="color:var(--amber);">${s.endorsements.map(escapeHtml).join(', ')}</span>`);
    if(!bits.length) return '';
    return `<div class="meta" style="margin-top:6px;">${bits.join(' &middot; ')}</div>`;
  }
  function hawbHeaderHtml(s){
    const list = hawbList(s);
    if(list.length === 0) return '';
    // Each house bill is its own consignment, so the header gives each one
    // its own line with the customer it belongs to rather than running the
    // numbers together.
    return `<div style="margin-top:9px;">
      ${list.map(h => `<div style="display:flex;gap:8px;align-items:baseline;margin-top:3px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#fff;
          font-weight:600;">${escapeHtml(h.no)}</span>
        <span style="font-size:11.5px;color:#9FAAC6;flex:1;min-width:0;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(h.customer||'')}${
          h.pcs!=null?` &middot; ${escapeHtml(h.pcs)} pcs`:''}${
          h.kg!=null?` &middot; ${escapeHtml(kgText(Number(h.kg)))} kg`:''}${
          h.from&&h.to?` &middot; ${escapeHtml(h.from)}&rarr;${escapeHtml(h.to)}`:''}${
          h.flight?` &middot; ${escapeHtml(h.flight)}`:''}${
          h.date?` &middot; ${escapeHtml(h.date)}${h.time?' '+escapeHtml(h.time):''}`:''}</span>
        ${cargoOf(h) !== 'general' ? `<span style="font-size:9.5px;font-weight:700;
          color:#fff;background:${cargoOf(h) === 'dg' ? 'var(--red)' : 'var(--green)'};
          padding:2px 6px;border-radius:5px;white-space:nowrap;"
          >${cargoOf(h) === 'dg' ? 'DG' : cargoOf(h) === 'fresh' ? 'FRESH' : 'PERISH'}</span>` : ''}
        ${(h.endorsements||[]).length ? `<span style="font-size:10.5px;color:var(--amber);
          white-space:nowrap;">${escapeHtml(h.endorsements.join(', '))}</span>` : ''}
      </div>`).join('')}
    </div>`;
  }
  // Per-HAWB delivery status panel on an import — each house bill's own
  // progress and its own delivery runs, each with its photo.
  function hawbPanelHtml(s){
    const prog = hawbProgress(s);
    if(prog.length === 0) return '';
    const chip = st => st === 'done'
      ? '<span class="lot-tag done">DELIVERED</span>'
      : st === 'part' ? '<span class="lot-tag here" style="background:rgba(242,169,59,.2);color:var(--amber-dk);">PART DELIVERED</span>'
      : '<span class="lot-tag w">NOT DELIVERED</span>';
    return `
      <div class="sect">HAWB DELIVERY</div>
      <div class="card" style="padding:4px 15px;">
        ${prog.map(h => `
          <div style="padding:11px 0;border-bottom:1px solid var(--line);">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--ink);">${escapeHtml(h.no)}</span>
              ${chip(h.status)}
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px;">
              ${h.pcs != null ? `${h.delivered} of ${h.pcs} pcs delivered` : `${h.delivered} pcs delivered`}${(()=>{
                // Nothing can go out against pieces that never landed, so the
                // bill's own balance is named here too.
                const bal = hawbBalance(s, h);
                return bal ? ` &middot; <span style="color:var(--amber-dk);font-weight:600;">${bal} not arrived</span>` : '';
              })()}${(()=>{
                // Only worth showing when this house bill runs under someone
                // other than the master's principal.
                const own = (hawbList(s).find(x => x.no === h.no) || {}).principal;
                return own && own !== s.principal
                  ? ` &middot; <span style="color:var(--amber-dk);font-weight:600;">${escapeHtml(own)}</span>` : '';
              })()}</div>
            ${h.runs.map(d => `
              <div style="font-size:11.5px;color:var(--text);margin-top:5px;">
                ${d.pcs} pcs &middot; ${escapeHtml(d.driver||'')} &middot;
                <span style="font-family:'IBM Plex Mono',monospace;">${escapeHtml(d.lorry||'')}</span>
                <span style="color:var(--muted);"> &middot; ${new Date(d.at).toLocaleString()}</span>
                ${d.photoId ? ` &middot; <span style="color:var(--ink);font-weight:700;cursor:pointer;" data-viewphoto="${escapeHtml(d.photoId)}">View photo</span>` : ''}
              </div>`).join('')}
          </div>`).join('')}
      </div>`;
  }
  // Repeatable HAWB rows — number and pieces — with "+ Add another HAWB".
  // Set by whichever form is open, so a new card labels its date the same
  // way the rest of that form does.
  let _hawbIsExport = false;
  function setHawbEditorType(isExport){ _hawbIsExport = !!isExport; }
  // A new card opens with the usual route and today's date already in it, the
  // same way the master's own form does — most house bills follow the same
  // lane, and the ones that do not are a quick correction.
  function hawbDefaults(){
    return { from: _hawbIsExport ? 'KCH' : 'KUL', to: _hawbIsExport ? 'KUL' : 'KCH',
      date: todayStr() };
  }
  function hawbEditorHtml(prefix, existing, isExport){
    _hawbIsExport = !!isExport;
    const vals = (existing && existing.length) ? existing : [];
    return `
      <div class="field" style="margin-bottom:8px;">
        <label>House bills <span style="font-weight:400;color:var(--muted);text-transform:none;">— optional. Each one is its own consignment, with its own customer.</span></label>
      </div>
      <div id="${prefix}-hawb-list">
        ${vals.map(v => hawbRowHtml(v)).join('')}
      </div>
      <div class="field" style="margin-top:0;">
        <button type="button" class="lot-act ghost" id="${prefix}-hawb-add"
          style="border-radius:9px;width:100%;padding:11px;">+ Add a house bill</button>
      </div>`;
  }
  // One house bill, as a card of its own. A HAWB is a consignment in its own
  // right — its own customer, its own principal, its own agency sign-offs —
  // and only the flight, route and dates are shared with the master.

        </div>
      </div>
      <div class="field" style="margin:11px 13px;">
        <div class="frow">
          <div><label>From *</label>
            <input class="hawb-from" value="${escapeHtml(v.from||'')}" placeholder="KUL"></div>
          <div><label>To *</label>
            <input class="hawb-to" value="${escapeHtml(v.to||'')}" placeholder="KCH"></div>

          ${ENDORSEMENTS.map(e=>`<span class="mono ${ends.includes(e)?'on':''}" data-hend="${escapeHtml(e)}">${escapeHtml(e)}</span>`).join('')}
        </div>

  // Switching Import/Export changes which questions a house bill asks, so
  // the cards are rebuilt in the new shape with whatever was already typed
  // carried across. Fields the new direction does not ask for are dropped.
  function rebuildHawbCards(prefix){
    const list = document.getElementById(prefix + '-hawb-list');
    if(!list) return;
    const kept = readHawbsRaw(prefix);
    list.innerHTML = kept.map(v => hawbRowHtml(v)).join('');
    if(_hawbWire[prefix]) _hawbWire[prefix]();
  }
  // Everything currently on the cards, with no validation — used when the
  // form has to redraw them and nothing should be lost or complained about.
  function readHawbsRaw(prefix){
    return [...document.querySelectorAll('#' + prefix + '-hawb-list .hawb-row')].map(r => {
      const val = sel => { const el = r.querySelector(sel); return el ? el.value : ''; };
      const num = sel => { const v = val(sel).trim(); return v === '' ? null : Number(v); };
      return { no: val('.hawb-input'), customer: val('.hawb-cust'),
        principal: val('.hawb-principal'), pcs: num('.hawb-pcs'), kg: num('.hawb-kg'),
        from: val('.hawb-from'), to: val('.hawb-to'), flight: val('.hawb-flight'),
        date: val('.hawb-date'), time: val('.hawb-time'),
        k1: !!r.querySelector('.hawb-k1 [data-hk1="yes"].on'),
        cargo: val('.hawb-cargo') || 'general',
        dg: val('.hawb-cargo') === 'dg',
        dutyFee: num('.hawb-dutyfee'),
        endorsements: [...r.querySelectorAll('.hawb-endorse [data-hend].on')].map(el => el.dataset.hend) };
    });
  }
  const _hawbWire = {};
  function wireHawbEditor(prefix){
    const list = document.getElementById(prefix + '-hawb-list');
    function renumber(){
      list.querySelectorAll('.hawb-row').forEach((row, i) => {
        const n = row.querySelector('.hawb-n');
        if(n) n.textContent = `HOUSE BILL ${i+1}`;
      });
    }
    function wireRows(){
      list.querySelectorAll('.hawb-del').forEach(btn => {
        // Nothing to keep once it is gone — the card goes rather than being
        // left behind empty for someone to wonder about.
        btn.onclick = () => { btn.closest('.hawb-row').remove(); renumber(); };
      });
      // Several agencies can sign off the same house bill, so these toggle
      // independently, within their own card.
      list.querySelectorAll('.hawb-endorse [data-hend]').forEach(el => {
        el.onclick = () => el.classList.toggle('on');
      });
      // Duty only arises on a house bill declared on K1.
      list.querySelectorAll('.hawb-k1 [data-hk1]').forEach(el => {
        el.onclick = () => {
          const seg = el.closest('.hawb-k1');
          seg.querySelectorAll('[data-hk1]').forEach(x => x.classList.remove('on'));
          el.classList.add('on');
          const duty = el.closest('.hawb-row').querySelector('.hawb-duty');
          if(duty) duty.style.display = el.dataset.hk1 === 'yes' ? '' : 'none';
        };
      });
    }
    // Everything a house bill carries for itself — customer, principal,
    // endorsements, route, flight, date — stops being the master's business
    // the moment there is one, so those fields give way to a line saying
    // where they moved to.
    function sync(){
      renumber();
      const on = list.querySelectorAll('.hawb-row').length > 0;
      document.querySelectorAll('.mawb-only').forEach(el => { el.style.display = on ? 'none' : ''; });
      document.querySelectorAll('.hawb-note').forEach(el => { el.style.display = on ? '' : 'none'; });
    }
    function wireAll(){
      wireRows();
      list.querySelectorAll('.hawb-del').forEach(btn => {
        btn.onclick = () => { btn.closest('.hawb-row').remove(); sync(); };
      });
      sync();
    }
    document.getElementById(prefix + '-hawb-add').onclick = () => {
      list.insertAdjacentHTML('beforeend', hawbRowHtml(null));
      wireAll();
      const inputs = list.querySelectorAll('.hawb-input');
      inputs[inputs.length-1].focus();
    };
    _hawbWire[prefix] = wireAll;
    wireAll();
  }
  // Reads and validates the house-bill cards against the MAWB's own totals.
  // Returns { hawbs } or { error }.
  function readHawbs(prefix, mawbPcs, mawbKg){
    const rows = [...document.querySelectorAll('#' + prefix + '-hawb-list .hawb-row')];
    const out = [], seen = new Set();
    for(let i = 0; i < rows.length; i++){
      const r = rows[i];
      const nth = `House bill ${i+1}`;
      const no = r.querySelector('.hawb-input').value.trim().toUpperCase();
      const custEl = r.querySelector('.hawb-cust');
      const customer = custEl ? custEl.value.trim() : '';
      const prinEl = r.querySelector('.hawb-principal');
      const principal = prinEl ? prinEl.value : '';
      const pcsRaw = r.querySelector('.hawb-pcs').value.trim();
      const kgEl = r.querySelector('.hawb-kg');
      const kgRaw = kgEl ? kgEl.value.trim() : '';
      const fromEl = r.querySelector('.hawb-from'), toEl = r.querySelector('.hawb-to');
      const flEl = r.querySelector('.hawb-flight');
      const from = fromEl ? fromEl.value.trim().toUpperCase() : '';
      const to = toEl ? toEl.value.trim().toUpperCase() : '';
      const flight = flEl ? flEl.value.trim() : '';
      const dEl = r.querySelector('.hawb-date'), tEl = r.querySelector('.hawb-time');
      const date = dEl ? dEl.value : '';
      const time = tEl ? tEl.value : '';
      const endorsements = [...r.querySelectorAll('.hawb-endorse [data-hend].on')]
        .map(el => el.dataset.hend);
      const k1 = !!r.querySelector('.hawb-k1 [data-hk1="yes"].on');
      const cgEl = r.querySelector('.hawb-cargo');
      const cargo = (cgEl && CARGO_KEYS.includes(cgEl.value)) ? cgEl.value : 'general';
      const dg = cargo === 'dg';
      const dfEl = r.querySelector('.hawb-dutyfee');
      const dutyRaw = dfEl ? dfEl.value.trim() : '';
      // A card left completely blank is simply dropped.
      if(!no && !customer && !pcsRaw && !kgRaw && !principal && !from && !to && !flight
        && !date && !time && endorsements.length === 0) continue;
      if(!no) return { error: `${nth} has no HAWB number.` };
      if(seen.has(awbKey(no))) return { error: `HAWB ${no} is listed twice.` };
      if(!customer) return { error: `Enter the customer for HAWB ${no}.` };
      if(!principal) return { error: `Choose the principal for HAWB ${no}.` };
      const pcs = parseInt(pcsRaw, 10);
      if(!pcsRaw || isNaN(pcs) || pcs <= 0) return { error: `Enter the pieces for HAWB ${no}.` };
      if(kgRaw === '') return { error: `Enter the weight for HAWB ${no}.` };
      const kg = parseFloat(kgRaw);
      if(isNaN(kg) || kg <= 0) return { error: `Weight for HAWB ${no} must be more than zero.` };
      if(!from) return { error: `Enter the 'from' airport for HAWB ${no}.` };
      if(!to) return { error: `Enter the 'to' airport for HAWB ${no}.` };
      if(!flight) return { error: `Enter the flight number for HAWB ${no}.` };
      if(!date) return { error: `Enter the date for HAWB ${no}.` };
      if(!time) return { error: `Enter the time for HAWB ${no}.` };
      if(dutyRaw !== '' && (isNaN(Number(dutyRaw)) || Number(dutyRaw) < 0)){
        return { error: `Duty fee for HAWB ${no} must be a positive amount.` };
      }
      seen.add(awbKey(no));
      out.push({ no, customer, principal, pcs, kg, from, to, flight, date, time,
        ...(k1 ? { k1: true } : {}),
        cargo,
        ...(dg ? { dg: true } : {}),
        ...(dutyRaw !== '' ? { dutyFee: Number(dutyRaw) } : {}),
        ...(endorsements.length ? { endorsements } : {}) });
    }
    if(out.length > 0 && mawbPcs != null){
      const sum = out.reduce((a,h)=>a+h.pcs,0);
      if(sum !== mawbPcs) return { error: `House bill pieces add up to ${sum}, but the MAWB has ${mawbPcs} pcs — they need to match.` };
    }
    if(out.length > 0 && mawbKg != null){
      const sum = out.reduce((a,h)=>a+h.kg,0);
      // Weights are rounded per house bill, so a half-kilo either way is the
      // same figure rather than a mistake.
      if(Math.abs(sum - mawbKg) > 0.5){
        return { error: `House bill weights add up to ${kgText(sum)} kg, but the MAWB has ${kgText(mawbKg)} kg — they need to match.` };
      }
    }
    return { hawbs: out };
  }

  function trackLinksHtml(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    if(!cl && !fl) return '';
    let html = '<div class="linkrow">';
    if(cl) html += `<div class="linkbtn" id="lk-cargo">${escapeHtml(cl.label)}</div>`;
    if(fl) html += `<div class="linkbtn" id="lk-flight">Track flight ${escapeHtml(s.flight)}</div>`;
    html += '</div>';
    return html;
  }
  function wireTrackLinks(s){
    const cl = cargoLink(s.awb);
    const fl = s.flight ? flightLink(s.flight) : null;
    const lc = document.getElementById('lk-cargo');
    if(lc && cl){
      lc.onclick = () => {
        if(cl.direct){ window.open(cl.url, '_blank'); }
        else {
          navigator.clipboard?.writeText(cl.copy).catch(()=>{});
          window.open(cl.url, '_blank');
        }
      };
    }
    const lf = document.getElementById('lk-flight');
    if(lf && fl) lf.onclick = () => window.open(fl, '_blank');
