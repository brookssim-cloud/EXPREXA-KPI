<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exprexa Forwarding</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Installs to the home screen on Android and iPhone. iOS reads the two
     apple- tags and its own touch icon; everything else reads the manifest. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Forwarding">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  :root{
    --ink:#14213D; --ink-2:#1B2747; --paper:#EEF1F6; --card:#FFFFFF;
    --amber:#F2A93B; --amber-dk:#C97F12; --green:#1F9D6B; --red:#D64545;
    --line:#DCE1EA; --text:#1B2333; --muted:#6B748C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--text);
    font-family:Inter,-apple-system,Segoe UI,sans-serif;font-size:15px;}
  .app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);
    display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---- shell ---- */
  .topbar{background:var(--ink);color:#fff;padding:14px 16px 0;}
  .topbar-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.01em;}
  .brand .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--amber);
    letter-spacing:.08em;border:1px solid rgba(242,169,59,.5);padding:1px 6px;
    border-radius:4px;margin-left:7px;vertical-align:2px;}
  .who{font-size:11.5px;color:#9FAAC6;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .lvl-badge{font-size:8.5px;font-weight:700;letter-spacing:.4px;padding:1px 6px;
    border-radius:4px;background:rgba(255,255,255,.14);color:#CDD6E8;}
  .link-act{font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:underline;}
  .tabs-wrap{position:relative;}
  /* Every tab is on screen at once, wrapping onto a second row rather than
     hiding half of them behind a sideways scroll nobody notices. Rows stay
     tight so two of them cost barely more height than one did. */
  /* An even grid rather than a wrapping row: grid columns keep the same
     width on every row, so a second storey lines up under the first instead
     of trailing off raggedly with one tab stranded on its own. */
  .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));
    background:var(--ink-2);padding:0 6px 1px;margin-top:12px;}
  .tab{padding:9px 5px;font-size:12.5px;font-weight:600;color:#9FAAC6;cursor:pointer;
    border-bottom:2.5px solid transparent;white-space:nowrap;position:relative;
    display:flex;align-items:center;justify-content:center;gap:5px;}
  .tab.on{color:#fff;border-bottom-color:var(--amber);}
  /* On a phone the same grid would run to four rows and eat the screen —
     tighter type fits one more column per row and saves a whole storey. */
  @media (max-width:430px){
    .tabs{grid-template-columns:repeat(auto-fit,minmax(80px,1fr));}
    .tab{font-size:11.5px;padding:8px 3px;gap:4px;}
  }
  /* Inline beside the label, not floating over the corner — in a grid the
     corner is a long way from the word, and it landed on the next tab. */
  .tab .bdg{background:var(--red);color:#fff;
    font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;min-width:15px;
    height:15px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
    padding:0 3px;flex:0 0 auto;}
  .content{flex:1;padding-bottom:40px;}

  /* ---- board ---- */
  .counts{display:flex;gap:18px;padding:14px 16px 15px;background:var(--ink);color:#fff;flex-wrap:wrap;}
  .count .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:25px;line-height:1;}
  .count .n.warn{color:var(--amber);}
  .count .l{font-size:10px;color:#9FAAC6;margin-top:4px;}
  .filters{display:flex;background:var(--ink-2);padding:0 6px;overflow-x:auto;}
  .filters::-webkit-scrollbar{display:none;}
  .filters span{padding:10px 12px;font-size:12px;font-weight:600;color:#9FAAC6;
    white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;}
  .filters span.on{color:#fff;border-bottom-color:var(--amber);}

  .row{background:var(--card);padding:13px 16px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
  .row:active{background:#F7F9FC;}
  .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:9px;}
  .awb{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--ink);}
  .kind{font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:4px;
    vertical-align:2px;margin-left:6px;}
  .kind.exp{background:rgba(20,33,61,.09);color:var(--ink);}
  .kind.imp{background:rgba(242,169,59,.20);color:var(--amber-dk);}
  .lots-tag{font-size:9px;font-weight:700;color:var(--amber-dk);
    background:rgba(242,169,59,.18);padding:2px 6px;border-radius:4px;margin-left:6px;}
  .route{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
  .pips{display:flex;align-items:center;margin:10px 0 8px;}
  .pip{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .pip.done{background:var(--ink);} .pip.now{background:var(--amber);
    box-shadow:0 0 0 3.5px rgba(242,169,59,.22);} .pip.todo{background:#CDD5E2;}
  .link3{height:2px;flex:1;background:#CDD5E2;} .link3.done{background:var(--ink);}
  .row-bot{display:flex;justify-content:space-between;align-items:center;gap:9px;}
  .lead{font-size:13px;font-weight:600;color:var(--ink);}
  .party{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .age{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;
    padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .age.ok{background:rgba(31,157,107,.12);color:var(--green);}
  .age.warn{background:rgba(242,169,59,.20);color:var(--amber-dk);}
  .age.bad{background:rgba(214,69,69,.13);color:var(--red);}
  .age.mut{background:#EEF1F6;color:var(--muted);}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;}

  /* ---- detail ---- */
  .back{padding:13px 16px;background:var(--ink);color:#9FAAC6;font-size:13px;cursor:pointer;}
  .head{background:var(--ink);color:#fff;padding:0 16px 18px;}
  .head .awb-lg{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;padding-top:2px;}
  .head .meta{font-size:12px;color:#9FAAC6;margin-top:6px;line-height:1.6;}
  .head .tally{display:flex;gap:20px;margin-top:13px;flex-wrap:wrap;}
  .head .tally div{font-size:10.5px;color:#9FAAC6;}
  .head .tally b{display:block;font-family:'IBM Plex Mono',monospace;font-size:18px;
    color:#fff;font-weight:600;line-height:1.25;}
  .head .tally b.amb{color:var(--amber);}
  .linkrow{display:flex;gap:8px;margin-top:14px;}
  .linkbtn{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    color:#fff;border-radius:8px;padding:9px;font-size:11.5px;font-weight:600;text-align:center;}

  .sect{font-size:11px;font-weight:700;color:var(--muted);margin:18px 16px 8px;
    letter-spacing:.03em;display:flex;justify-content:space-between;}
  .card{background:var(--card);margin:0 12px 12px;border-radius:12px;padding:14px 15px;}

  .lot{background:var(--card);margin:0 12px 12px;border-radius:12px;overflow:hidden;
    border-top:3px solid var(--ink);}
  .lot.wait{border-top-color:#B9C2D6;}
  .lot-hd{padding:12px 14px 0;display:flex;justify-content:space-between;align-items:baseline;}
  .lot-qty{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;color:var(--ink);}
  .lot-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;}
  .lot-tag.here{background:rgba(20,33,61,.09);color:var(--ink);}
  .lot-tag.w{background:#E7EBF3;color:var(--muted);}
  .lot-tag.done{background:rgba(31,157,107,.12);color:var(--green);}
  .lot-when{padding:3px 14px 0;font-size:11px;color:var(--muted);}
  .steps{display:flex;align-items:center;padding:12px 13px 4px;overflow-x:auto;}
  .st{flex:0 0 auto;text-align:center;}
  .st .d{width:9px;height:9px;border-radius:50%;margin:0 auto;}
  .st .d.done{background:var(--ink);} .st .d.now{background:var(--amber);
    box-shadow:0 0 0 3.5px rgba(242,169,59,.22);} .st .d.todo{background:#CDD5E2;}
  .st .lbl{font-size:7.5px;color:var(--muted);margin-top:4px;white-space:nowrap;}
  .st .lbl.on{color:var(--ink);font-weight:700;}
  .jn{height:2px;width:14px;background:#CDD5E2;margin-bottom:13px;flex:0 0 auto;} .jn.done{background:var(--ink);}
  .lot-now{padding:8px 14px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .lot-now .s{font-size:13.5px;font-weight:600;color:var(--ink);}
  .lot-now .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:1px;}
  .lot-act{display:block;width:100%;padding:14px;border:none;background:var(--amber);
    color:var(--ink);font:700 14px 'Space Grotesk',sans-serif;cursor:pointer;
    border-top:1px solid rgba(20,33,61,.08);}
  .lot-act small{display:block;font:500 10.5px Inter,sans-serif;color:rgba(20,33,61,.62);margin-bottom:3px;}
  .lot-act.ghost{background:#F2F5F9;color:var(--ink);}
  .lot-act.mut{background:#F2F5F9;color:var(--muted);}

  .run{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
  .run:last-child{border-bottom:none;}
  .run .qty{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;
    color:var(--ink);width:52px;flex:0 0 auto;}
  .run .who{font-size:13px;font-weight:600;color:var(--ink);}
  .run .when{font-size:11px;color:var(--muted);margin-top:1px;}
  .run .lorry{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
    background:var(--paper);padding:2px 7px;border-radius:4px;display:inline-block;margin-top:3px;}

  .addlot{display:block;width:calc(100% - 24px);margin:0 12px 14px;padding:12px;
    background:transparent;border:1.5px dashed #B9C2D6;border-radius:12px;
    color:var(--muted);font:600 12.5px Inter,sans-serif;cursor:pointer;text-align:center;}

  .advance{display:block;width:calc(100% - 24px);margin:0 12px 12px;padding:15px;
    background:var(--ink);color:#fff;border:none;border-radius:12px;
    font:700 15px 'Space Grotesk',sans-serif;cursor:pointer;text-align:center;}
  .advance small{display:block;font:500 10.5px Inter,sans-serif;color:#9FAAC6;margin-bottom:3px;}
  .advance.finish{background:var(--green);}
  /* Amber means this isn't a plain one-tap move — a form, a photo, or both
     stand between tapping this and actually advancing. Navy means it just
     moves straight on. */
  .advance.needs-input{background:var(--amber);color:var(--ink);}
  .advance.needs-input small{color:rgba(20,33,61,.62);}

  .viewer-strip{margin:0 12px 14px;padding:12px 14px;border-radius:10px;background:#E7EBF3;
    border:1px dashed #B9C2D6;font-size:12px;color:var(--muted);line-height:1.6;}
  .viewer-strip b{color:var(--ink);}

  .noteline{background:#FFF8EC;border-left:3px solid var(--amber);padding:10px 12px;
    border-radius:0 8px 8px 0;font-size:13px;margin-bottom:8px;}
  .noteline:last-child{margin-bottom:0;}
  .noteline .who{font-size:11px;color:var(--muted);margin-top:4px;}
  .addnote{display:flex;gap:8px;margin-top:10px;}
  .addnote input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;}
  .addnote button{background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:0 14px;font-weight:600;font-size:12.5px;}
  .actrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .actrow:last-child{border-bottom:none;}
  .actrow .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);margin-top:6px;flex:0 0 auto;
    margin-left:7px;margin-right:7px;}
  /* Movements are numbered so a long feed can be scanned, and referred to
     out loud — "step 7". Notes and surveys sit between them with a plain
     dot, since they are not movements. The newest one is amber, so where a
     shipment has got to is the first thing the eye lands on. */
  .actrow .num{width:21px;height:21px;border-radius:50%;background:#E9EDF4;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin-top:1px;flex:0 0 auto;}
  .actrow .num.now{background:var(--amber);color:#3A2A08;}
  .actrow .txt{font-size:13px;color:var(--text);}
  .actrow .who{font-size:11px;color:var(--muted);margin-top:2px;}
  /* A feed runs to hundreds of lines on a shipment that took weeks, so it
     filters: by what happened, and by which consignment it happened to.
     Deliberately smaller than the page's other chips — these sit inside a
     card and must not out-shout the entries themselves. */
  .actfil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
  .actfil span{font-size:11px;font-weight:700;padding:5px 9px;border-radius:7px;
    background:#EEF1F6;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .actfil span.on{background:var(--ink);color:#fff;}
  .actfil span i{font-style:normal;opacity:.6;margin-left:4px;}
  .actfil.refs{margin-top:-3px;}
  .actfil.refs span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:-.2px;}
  .actmore{display:block;width:100%;margin-top:10px;padding:9px;border:1.5px solid var(--line);
    background:#fff;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;}

  /* ---- forms / picker ---- */
  .field{margin:0 16px 14px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
  .field input,.field select{width:100%;background:#fff;border:1.5px solid var(--line);
    border-radius:9px;padding:11px 12px;font-size:14.5px;color:var(--text);}
  .field input.mono{font-family:'IBM Plex Mono',monospace;}
  .seg{display:flex;gap:6px;margin:0 16px 16px;}
  .seg div{flex:1;text-align:center;padding:11px 0;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .seg div.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .picker{background:var(--card);margin:12px;border-radius:12px;padding:16px;}
  .picker .plbl{font-size:11px;color:var(--muted);margin-bottom:8px;}
  .qctl{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 4px;}
  .qctl button{width:44px;height:44px;border-radius:11px;border:1.5px solid var(--line);
    background:#fff;font-size:20px;color:var(--ink);cursor:pointer;line-height:1;}
  .qctl .val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;
    color:var(--ink);min-width:64px;text-align:center;}
  .qof{text-align:center;font-size:12px;color:var(--muted);}
  .chips{display:flex;gap:7px;flex-wrap:wrap;}
  .chips span{padding:8px 13px;border-radius:9px;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;cursor:pointer;}
  .chips span.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chips span.mono{font-family:'IBM Plex Mono',monospace;}
  /* the × inside a chip is not a chip of its own */
  .chips span span{border:none;background:none;padding:0;border-radius:0;}
  .msg{margin:8px 16px 0;font-size:12.5px;}

  /* ---- Settings: a terminal and its rate card ---- */
  .tm{background:var(--card);margin:12px 12px 0;border-radius:13px;overflow:hidden;
    border:1.5px solid var(--line);}
  .tm-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:13px 15px;background:var(--ink);}
  .tm-head .nm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;color:#fff;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tm-head .rm{flex:0 0 auto;font-size:11px;font-weight:700;color:#9FAAC6;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.22);border-radius:8px;padding:5px 10px;}
  .tm-body{padding:13px 15px;}
  /* the small grey caption above a group of controls */
  .tm-lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.07em;margin-bottom:6px;}
  /* import / export band, colour-coded so the two never get confused */
  .tm-sec{margin-top:15px;padding-top:13px;border-top:1.5px solid var(--line);}
  .tm-sec-h{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
  .tm-tag{font-size:10px;font-weight:700;letter-spacing:.07em;padding:3px 8px;border-radius:6px;}
  .tm-tag.imp{background:rgba(59,113,242,.12);color:#2C56BE;}
  .tm-tag.exp{background:rgba(242,169,59,.18);color:var(--amber-dk);}
  .tm-sec-h .t{font-size:11.5px;font-weight:700;color:var(--text);}
  /* rate boxes: two per row on a phone, four across once there is room */
  .tm-rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;}
  .tm-rates .b{min-width:0;}
  .tm-rates .b div{font-size:9.5px;font-weight:700;color:var(--muted);margin-bottom:4px;
    letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tm-in{width:100%;box-sizing:border-box;padding:8px 9px;border:1.5px solid var(--line);
    border-radius:8px;font-size:13px;background:#fff;font-family:inherit;}
  .tm-in.r{text-align:right;}
  /* one fee, as its own tile */
  .tm-fee{background:var(--paper);border-radius:10px;padding:9px 10px;margin-top:7px;}
  .tm-fee-top{display:flex;gap:6px;align-items:center;}
  .tm-fee-row{display:flex;gap:6px;align-items:center;margin-top:6px;}
  .tm-fee-x{flex:0 0 auto;width:24px;text-align:center;color:var(--red);font-size:18px;
    line-height:1;cursor:pointer;}
  .tm-fee-sub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px;}
  .tm-fee-opt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .tm-dg{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:7px;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;}
  .tm-dg.on{background:var(--red);border-color:var(--red);color:#fff;}
  .tm-none{font-size:11.5px;color:var(--muted);padding:8px 0 2px;}
  .tm-add{font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;}

  /* ---- a long form, broken into groups ---- */
  .fgrp{background:var(--card);margin:0 12px 12px;border-radius:12px;padding:4px 0 2px;
    border:1.5px solid var(--line);}
  .fgrp .field{margin:12px 14px 12px;}
  .fgrp-h{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;
    margin:14px 16px 2px;display:flex;align-items:center;gap:7px;}
  .fgrp-h::after{content:'';flex:1;height:1.5px;background:var(--line);}
  /* A house bill is a consignment in its own right, so it gets a card of
     its own rather than a row squeezed into the master's form. */
  .hawb-row{border:1.5px solid var(--line);border-radius:11px;margin:0 13px 10px;
    background:var(--paper);overflow:hidden;}
  .hawb-hd{display:flex;justify-content:space-between;align-items:center;
    padding:9px 13px;background:rgba(16,23,40,.05);}
  .hawb-n{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);}
  .hawb-del{border:1.5px solid var(--line);background:#fff;border-radius:7px;
    color:var(--red);font-size:11px;font-weight:700;padding:4px 9px;font-family:inherit;cursor:pointer;}
  .hawb-row .field input,.hawb-row .field select{background:#fff;}
  .frow{display:flex;gap:10px;}
  .frow > div{flex:1;min-width:0;}

  /* ---- alerts ---- */
  /* ---- Do list ---- */
  .bdg.late{background:var(--red);color:#fff;}
  .do-strip{background:#FFF1DC;color:#8A5A00;border-bottom:1px solid #F0D7A8;
    padding:9px 16px;font-size:12px;line-height:1.5;cursor:pointer;}
  .do-strip:active{background:#FBE7C8;}
  .do-warn{margin:14px 12px 4px;padding:11px 13px;border-radius:11px;

    let mins = Math.floor((Date.now() - new Date(fromIso).getTime()) / 60000);
    if(!isFinite(mins) || mins < 0) mins = 0;
    const d = Math.floor(mins / 1440);
    if(d >= 1) return d + 'd ' + Math.floor((mins % 1440) / 60) + 'h';
    return Math.floor(mins / 60) + 'h ' + String(mins % 60).padStart(2,'0') + 'm';
  }
  // When the thing that's currently waiting last moved: the longest-sitting
  // open track or lot, matching whatever the status column is showing.
  function lastStageIso(s){
    if(s.type === 'export'){
      const tracks = exportTracks(s).filter(t => !t.closed);
      if(!tracks.length) return s.stageAt || s.createdAt;
      return tracks.reduce((a,b) => new Date(b.stageAt) < new Date(a.stageAt) ? b : a).stageAt;
    }
    const lots = (s.lots||[]).filter(l => !l.closed && l.hasArrived);
    if(!lots.length) return s.createdAt;
    return lots.reduce((a,b) => new Date(b.stageAt) < new Date(a.stageAt) ? b : a).stageAt;
  }

  function ageHours(fromIso){ return (Date.now() - new Date(fromIso).getTime())/3600000; }

  // ---- worker records — this app's own, not shared with the other two ----
  const WORKERS = 'fwd_workers';
  let _workerCache = null;
  function invalidateWorkerCache(){ _workerCache = null; }
  async function getWorkers(){
    if(_workerCache) return _workerCache;
    const snap = await withTimeout(db.collection(WORKERS).get(), 15000, 'Loading workers');
    _workerCache = snap.docs.map(d => d.data());
    return _workerCache;
  }
  async function saveWorker(w){
    await db.collection(WORKERS).doc(w.id).set(w);
    invalidateWorkerCache();
  }
  async function deleteWorker(id){
    await db.collection(WORKERS).doc(id).delete();
    invalidateWorkerCache();
    const ref = db.collection(CONFIG).doc('access');
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      delete v[id];
      tx.set(ref, { value: v });
    });
  }

  // ---- access map: who can view/edit in THIS app ----
  async function getAccessMap(){
    const doc = await withTimeout(db.collection(CONFIG).doc('access').get(), 15000, 'Loading access settings');
    return doc.exists ? (doc.data().value || {}) : {};
  }
  // Who may open the wall display. Off for everyone by default so it isn't
  // left running in a background tab by people who don't need it; admins
  // always have it.
  async function getDisplayMap(){
    const doc = await withTimeout(db.collection(CONFIG).doc('display').get(), 15000, 'Loading display access');
    return doc.exists ? (doc.data().value || {}) : {};
  }
  async function setDisplayFor(workerId, on){
    const ref = db.collection(CONFIG).doc('display');
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      if(on) v[workerId] = true; else delete v[workerId];
      tx.set(ref, { value: v });
    });
  }
  async function setAccessFor(workerId, level){
    const ref = db.collection(CONFIG).doc('access');
    await db.runTransaction(async tx=>{
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      if(level === 'off') delete v[workerId]; else v[workerId] = level;
      tx.set(ref, { value: v });
    });
  }

  // ---- Do list: roles, who is on it, what each role is asked to clear ----
  // Every item on the list is raised by the shipments themselves, out of the
  // same lists the tabs already show. Nobody can hand themselves an easy one,
  // and nothing has to be typed up: a role only decides which of those lists
  // land on whose screen.
  const DOTASKS = 'fwd_dotasks';   // one-off jobs an admin adds by hand
  const DOLOG   = 'fwd_dolog';     // what each person ticked, one record a day

  // The airport runs through the night, so a shift that starts in the evening
  // is still working at 2am and its list has to go with it. The day the list
  // belongs to therefore ends at 5am, not at midnight, and the next one is
  // not put out until 7am. Between those two there is no list: the night is
  // over and the morning has not started.
  const DO_DAY_ENDS  = 5;   // 05:00 — anything not ticked by now is missed
  const DO_DAY_OPENS = 7;   // 07:00 — the fresh list appears
  const DO_DAY_POINTS = 50; // a finished day, before the admin changes it
  const DOPOINTS = 'dopoints'; // the running totals, one document in CONFIG

  // A day earns if the whole list was cleared. 'expected' is stamped on the
  // record as the day is worked, so a role rewritten next week cannot change
  // what an old day was asked for.
  function doDayEarned(log, perDay){
    if(!log) return 0;
    const done = (log.done || []).length;
    const want = Math.max(Number(log.expected) || 0, done);
    return done > 0 && done >= want ? (Number(perDay) >= 0 ? Number(perDay) : DO_DAY_POINTS) : 0;
  }
  function ymdLocal(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  // Which day's list is live right now, or null in the gap between them.
  function doDayStr(now){
    const d = now || new Date();
    const h = d.getHours();
    if(h >= DO_DAY_OPENS) return ymdLocal(d);
    if(h < DO_DAY_ENDS){
      const y = new Date(d.getTime());
      y.setDate(y.getDate() - 1);
      return ymdLocal(y);          // still last night's list
    }
    return null;                   // 5am to 7am — between lists
  }
  function doDayLabel(){
    const h = String(DO_DAY_OPENS).padStart(2,'0') + ':00';
    return h;
  }

  // roles: [{ id, name, tasks:[{ id, text }] }]
  // assign: { workerId: roleId }  — no entry means no Do list at all
  // cutoff: 'HH:MM', when the end-of-day check starts warning
  async function getDoConfig(){
    const doc = await withTimeout(db.collection(CONFIG).doc('dolist').get(), 15000, 'Loading do list');
    const v = doc.exists ? (doc.data().value || {}) : {};
    return { roles: v.roles || [], assign: v.assign || {},
      // heads: who may approve. under: which head each worker answers to.
      heads: v.heads || v.approvers || {}, under: v.under || {},
      // What a finished day is worth. One number, because the day is the
      // unit: clearing the whole list earns it and clearing most of it earns
      // nothing, so a long list is not worth more than a short one and
      // nobody is better off being given more to do.
      dayPoints: Number(v.dayPoints) >= 0 ? Number(v.dayPoints) : DO_DAY_POINTS,
      cutoff: v.cutoff || '17:30' };
  }
  async function saveDoConfig(cfg){
    await db.collection(CONFIG).doc('dolist').set({ value: cfg });
    STATE.doCfg = cfg;
  }
  function myDoRole(){
    const cfg = STATE.doCfg || { roles:[], assign:{} };
    const id = ME ? cfg.assign[ME.id] : null;
    return id ? (cfg.roles.find(r => r.id === id) || null) : null;
  }
  function hasDoList(){ return !!myDoRole(); }
  // Approving is its own job, not a rung on the permission ladder: a senior
  // clerk can sign off the team's day without being handed the board's
  // settings, and an admin who does not supervise anyone is not asked to.
  function isApprover(){
    return !!(ME && (STATE.doCfg && STATE.doCfg.heads || {})[ME.id]);
  }
  // A worker can answer to more than one head — a shift supervisor and a
  // department head, say. Stored as a list; a single id from the earlier
  // shape still reads correctly.
  function headsOf(workerId){
    const v = (STATE.doCfg && STATE.doCfg.under || {})[workerId];
    if(!v) return [];
    return Array.isArray(v) ? v.filter(Boolean) : [v];
  }
  // Which heads a day was sent to, as stamped on the day itself.
  function headsOnLog(log){
    if(!log) return [];
    if(Array.isArray(log.headIds)) return log.headIds.filter(Boolean);
    if(log.headId) return [log.headId];
    if(log.headIds === undefined && log.headId === undefined) return headsOf(log.workerId);
    return [];
  }
  function headNames(ids){
    const by = {}; (STATE.workers || []).forEach(w => { by[w.id] = w.name; });
    return ids.map(id => by[id] || id);
  }
  // Whose day a given head is responsible for. A day carries the head it was
  // sent to, so moving somebody to a new head later does not quietly pull
  // their old days out of the first head's queue. A worker nobody has been
  // put under shows up for every head rather than for none — an unassigned
  // day that no one can see is a day that never gets looked at.
  // Either head can settle a day — whoever gets to it first. The other's
  // queue simply stops showing it, because only days still pending are
  // listed at all.
  function isMineToApprove(log){
    if(!ME) return false;
    const owners = headsOnLog(log);
    return !owners.length || owners.includes(ME.id);
  }
  function myPendingDays(){
    return (STATE.doPending || []).filter(isMineToApprove);
  }
  function seesDoTab(){ return hasDoList() || isApprover(); }
  // What a day record is waiting for. Older records have no status at all.
  function doStatus(log){
    if(!log) return 'open';
    if(log.status) return log.status;
    return log.signedOff ? 'pending' : 'open';
  }
  // Cheap enough to run on every paint at this size, and it has to be, or
  // the badge in the tab bar would be a read of its own.
  function doOpenCount(){
    const role = myDoRole();
    if(!role || !STATE.doLog || !doDayStr()) return 0;
    try{ return openDoItems(role).length; }catch(e){ return 0; }
  }
  function doApprovalCount(){
    return isApprover() ? myPendingDays().length : 0;
  }
  // The badge carries both: your own jobs and anything waiting on you.
  function doBadgeCount(){ return doOpenCount() + doApprovalCount(); }

  // ---- terminals: defined once by AWB prefix, not tagged per shipment ----
  // A terminal is {id, name, prefixes:[...]}. Which terminal a shipment
  // belongs to is worked out from its own AWB — nothing to tag by hand as
  // shipments come and go.
  // This one document now carries everything the Settings tab manages —
  // terminals and the list of principals — so the app still reads it once at
  // login rather than once per kind of setting. It keeps the id 'terminals'
  // because that is where the existing data already lives.
  async function getTerminalsConfig(){
    const doc = await withTimeout(db.collection(CONFIG).doc('terminals').get(), 15000, 'Loading settings');
    const v = doc.exists ? (doc.data().value || {}) : {};
    return { terminals: v.terminals || [], principals: v.principals || [] };
  }
  async function saveTerminalsConfig(cfg){
    await db.collection(CONFIG).doc('terminals').set({ value: cfg });
  }
  // Government endorsements a shipment may need. A fixed list — these are
  // the agencies, not something an office adds to.
  const ENDORSEMENTS = ['Kesihatan','Farmasi','Pertanian','Pendidikan','Veterinar'];
  // The same AWB typed with or without its dash, or in a different case, is
  // the same AWB. Everything that compares one uses this form.
  function awbKey(awb){ return String(awb||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase(); }
  // Is this AWB already in the system, open or closed? The loaded board only
  // holds open shipments, so a closed one has to be asked for directly.
  // Two queries: the exact number as typed (which catches every shipment
  // created before awbKey existed) and the normalised key (which catches the
  // same number typed with a dash added or dropped).
  async function findExistingAwb(awb){
    const key = awbKey(awb);
    const local = STATE.shipments.find(s => awbKey(s.awb) === key);
    if(local) return local;
    try{
      const [exact, keyed] = await Promise.all([
        withTimeout(db.collection(SHIP).where('awb','==',awb).limit(1).get(), 15000, 'Checking the AWB'),
        withTimeout(db.collection(SHIP).where('awbKey','==',key).limit(1).get(), 15000, 'Checking the AWB')
      ]);
      if(!exact.empty) return exact.docs[0].data();
      if(!keyed.empty) return keyed.docs[0].data();
    }catch(e){
      // A flaky connection shouldn't stop real work — the local check above
      // has already run, so carry on rather than blocking the shipment.
      console.error('Could not check the AWB against closed shipments:', e);
    }
    return null;
  }
  // The same house bill should never appear on two master AWBs. Shipments
  // carry a flat hawbKeys array purely so this can be asked as one query
  // rather than by reading every shipment — array-contains-any takes up to
  // ten values at a time, so a normal consolidation costs a single read.
  async function findExistingHawbs(hawbs, excludeId){
    const keys = hawbs.map(h => awbKey(h.no)).filter(Boolean);
    if(keys.length === 0) return null;
    const keySet = new Set(keys);
    for(const s of STATE.shipments){
      if(s.id === excludeId) continue;
      const hit = hawbList(s).find(h => keySet.has(awbKey(h.no)));
      if(hit) return { hawb: hit.no, ship: s };
    }
    try{
      for(let i = 0; i < keys.length; i += 10){
        const batch = keys.slice(i, i + 10);
        const snap = await withTimeout(
          db.collection(SHIP).where('hawbKeys','array-contains-any', batch).limit(5).get(),
          15000, 'Checking the HAWB numbers');
        for(const d of snap.docs){
          const other = d.data();
          if(other.id === excludeId) continue;
          const hit = hawbList(other).find(h => keySet.has(awbKey(h.no)));
          if(hit) return { hawb: hit.no, ship: other };
        }
      }
    }catch(e){
      // Same reasoning as the AWB check: a flaky connection must not stop
      // real work, and the local pass above has already run.
      console.error('Could not check HAWBs against closed shipments:', e);
    }
    return null;
  }
  function awbPrefix(awb){
    const m = String(awb||'').match(/^(\d{3})/);
    return m ? m[1] : null;
  }
  function terminalObjForAwb(awb, terminals){
    const p = awbPrefix(awb);
    if(!p) return null;
    return (terminals||[]).find(t => (t.prefixes||[]).includes(p)) || null;
  }
  function terminalForAwb(awb, terminals){
    const t = terminalObjForAwb(awb, terminals);
    return t ? t.name : null;
  }

  // ---- terminal charges ----
  // Each terminal sets its own handling rates: a minimum charge that covers
  // everything up to a minimum weight, then a per-kg rate on whatever is
  // over. Import adds a fee for each survey report raised; export has no
  // survey fee.
  function ratesFor(terminal, type){
    const r = (terminal && terminal.rates && terminal.rates[type]) || {};
    return {
      minKg: Number(r.minKg) || 0,
      minCharge: Number(r.minCharge) || 0,
      perKg: Number(r.perKg) || 0,
      surveyCharge: Number(r.surveyCharge) || 0,
      weightBasis: WEIGHT_BASES.some(b => b.key === r.weightBasis) ? r.weightBasis : 'higher'
    };
  }
  // An export is weighed twice — the scale says one thing, the volume says
  // another — and a terminal picks whichever its own tariff names. Most bill
  // on whichever is higher, so that is the default, and any charge can be set
  // to follow one of them instead.
  const WEIGHT_BASES = [
    { key:'higher', label:'Higher of the two', short:'higher' },
    { key:'gross',  label:'Gross weight',      short:'gross' },
    { key:'charge', label:'Chargeable weight', short:'chargeable' }
  ];
  function weightFor(s, basis){
    // An import carries one weight, so there is nothing to choose between.
    if(s.type !== 'export') return Number(s.kg) || 0;
    const g = Number(s.grossKg) || 0;
    const c = Number(s.chargeKg) || 0;
    // Shipments created before the split still have only the one figure.
    if(!g && !c) return Number(s.kg) || 0;
    if(basis === 'gross')  return g || c;
    if(basis === 'charge') return c || g;
    return Math.max(g, c);
  }
  // Which weight a charge actually used, for the line it prints. Silent on an
  // import, and silent on an export whose two weights agree.
  function basisNote(s, basis){
    if(s.type !== 'export') return '';
    const g = Number(s.grossKg) || 0, c = Number(s.chargeKg) || 0;
    if(!g || !c || g === c) return '';
    const b = WEIGHT_BASES.find(x => x.key === basis) || WEIGHT_BASES[0];
    if(basis === 'higher') return ' (higher: ' + (g >= c ? 'gross' : 'chargeable') + ')';
    return ' (' + b.short + ')';
  }
  function ratesSet(terminal, type){
    const r = (terminal && terminal.rates && terminal.rates[type]) || {};
    return [r.minKg, r.minCharge, r.perKg].some(v => Number(v) > 0) || feesFor(terminal, type).length > 0;
  }
  // Extra fees a terminal adds on top of handling — documentation, security,
  // a bonded charge, whatever they call it. Four ways one can be worked out:
  //   mawb  — once per shipment, the master bill
  //   hawb  — once for every house bill on it
  //   flat  — a fixed amount, however the shipment is made up
  //   float — the same shape as handling: a minimum up to a weight, then a
  //           rate per kg beyond it
  const FEE_BASES = [
    { key:'mawb',  label:'Per MAWB',  hint:'Charged once for the master bill' },
    { key:'hawb',  label:'Per HAWB',  hint:'Charged for every house bill on the shipment' },
    { key:'flat',  label:'Flat rate', hint:'A fixed amount on every shipment' },
    { key:'float', label:'Floating',  hint:'A minimum up to a weight, then per kg beyond' }
  ];
  function feesFor(terminal, type){
    const r = (terminal && terminal.rates && terminal.rates[type]) || {};
    return Array.isArray(r.fees) ? r.fees.filter(f => f && f.id) : [];
  }
  // What the cargo is. Dangerous goods used to be the only distinction and
  // was stored as a flag; it is now one choice among several, and the flag
  // is kept alongside so the red emblem, the board and anything saved before
  // this still read the same.
  const CARGO_TYPES = [
    { key:'general',    label:'General cargo' },
    { key:'perishable', label:'Perishable' },
    { key:'fresh',      label:'Fresh' },
    { key:'dg',         label:'Dangerous goods' }
  ];
  const CARGO_KEYS = CARGO_TYPES.map(c => c.key);
  // A shipment or a house bill saved before cargo types has only the DG flag
  // to go on, and anything that was not DG was general cargo.
  function cargoOf(o){
    if(!o) return 'general';
    if(o.cargo && CARGO_KEYS.includes(o.cargo)) return o.cargo;
    return o.dg ? 'dg' : 'general';
  }
  function cargoLabel(key){
    const c = CARGO_TYPES.find(x => x.key === key);
    return c ? c.label : 'General cargo';
  }
  // Written in both places at once, so nothing has to remember to keep the
  // flag in step with the choice.
  function setCargo(o, key){
    o.cargo = CARGO_KEYS.includes(key) ? key : 'general';
    if(o.cargo === 'dg') o.dg = true; else delete o.dg;
  }
  // A consolidation takes the type its house bills agree on. DG wins outright
  // — one dangerous bill makes the whole shipment one to handle as such — and
  // a genuine mix falls back to general rather than claiming one bill's type
  // for all of them.
  function cargoFromHawbs(list){
    const kinds = Array.from(new Set((list || []).map(cargoOf)));
    if(!kinds.length) return 'general';
    if(kinds.includes('dg')) return 'dg';
    return kinds.length === 1 ? kinds[0] : 'general';
  }
  // Which cargo a fee is restricted to, '' meaning any. An older fee carries
  // dgOnly instead, which says the same thing about dangerous goods.
  function feeCargoOnly(f){
    if(!f) return '';
    if(f.cargoOnly && CARGO_KEYS.includes(f.cargoOnly)) return f.cargoOnly;
    return f.dgOnly ? 'dg' : '';
  }
  // Does this fee arise on this cargo at all?
  function feeAppliesTo(f, kind){
    const only = feeCargoOnly(f);
    return !only || only === kind;
  }
  // What one fee comes to on this shipment, with the wording for its line.
  function feeLine(fee, s, fallbackBasis){
    const basis = fee.basis || 'flat';
    const label = String(fee.label || 'Fee').trim() || 'Fee';
    const amt = Number(fee.amount) || 0;
    // A fee tied to one kind of cargo only arises on that kind.
    if(!feeAppliesTo(fee, cargoOf(s))) return null;
    if(basis === 'hawb'){
      const n = hawbList(s).length;
      if(n === 0) return null;   // nothing to charge it against
      // The count stays: it is what the figure turns on, and it changes from
      // shipment to shipment. The rate behind it is in Settings.
      return { label: `${label} — ${n} HAWB${n>1?'s':''}`, amount: n * amt };
    }
    if(basis === 'float'){
      // Its own weight if it has been given one, otherwise the terminal's.
      const wb = WEIGHT_BASES.some(b => b.key === fee.weightBasis)
        ? fee.weightBasis : (fallbackBasis || 'higher');
      const kg = weightFor(s, wb);
      const minKg = Number(fee.minKg) || 0;
      const minCharge = Number(fee.minCharge) || 0;
      const perKg = Number(fee.perKg) || 0;
      const over = Math.max(0, kg - minKg);
      return { label, amount: minCharge + over * perKg };
    }
    // mawb and flat both land once on the shipment.
    return { label, amount: amt };
  }
  function money(n){ return 'RM ' + (Math.round(n * 100) / 100).toFixed(2); }
  // The day charges started being tracked in the app. Everything finished
  // before then was settled on paper, so it must never resurface here as an
  // unpaid bill.
  //
  // This matters more than it looks. The Charges list is built from the
  // shipments currently in memory, and that set GROWS as someone works:
  // opening Outstanding merges in closed shipments with a shortfall, opening
  // Completed merges in that day's completed ones. Without this rule, the
  // charges list quietly filled up with old jobs as you clicked around.
  const CHARGES_FROM = '2026-09-30';
  // ---- duty ----
  // Duty is a customs payment, not a terminal one — different money to a
  // different party — so it is tracked separately and settled on its own
  // sub-tab rather than folded into a terminal's total. It applies to
  // exports and to imports cleared under K1.
  // Duty is a K1 matter. An export used to be asked for one, so an amount
  // already recorded on one still settles — but no new export declares duty.
  function dutyApplies(s){
    return isK1Shipment(s) || (s.type === 'export' && Number(s.dutyFee) > 0);
  }
  function dutyAmount(s){ return Number(s.dutyFee) || 0; }
  // Same timing as terminal charges: an import once it has landed, an
  // export once the cargo is in.
  function dutyDue(s){
    if(s.dutyPaid || !dutyApplies(s) || dutyAmount(s) <= 0) return false;
    const born = dayOf(s.createdAt);
    if(s.closed && born < CHARGES_FROM) return false;
    // A lot that landed with nothing on it brought in nothing to declare.
    if(s.type === 'import') return (s.lots||[]).some(l => lotHasCargo(l));
    return (s.stage||0) >= 1 || (s.xtracks||[]).some(t => (t.stage||0) >= 1);
  }
  // Charges become due once the cargo is actually with the terminal — an
  // import when a lot has landed, an export once it has been taken in.
  function chargesDue(s){
    // On the board now, or booked since charges started. A shipment that was
    // already finished before that date is history and stays out.
    const born = dayOf(s.createdAt);
    if(s.closed && born < CHARGES_FROM) return false;
    // Cargo has to actually be here to be charged for. A lot recorded as
    // arriving with nothing on it leaves nothing with the terminal.
    if(s.type === 'import') return (s.lots||[]).some(l => lotHasCargo(l));
    return (s.stage||0) >= 1 || (s.xtracks||[]).some(t => (t.stage||0) >= 1);
  }
  // A survey report is its own bill, not part of the handling charge. It is
  // raised whenever the damage is found — often long after the handling was
  // settled — and the terminal invoices it separately. So each report
  // carries its own payment, and the handling charge never waits for one.
  function surveyChargePaid(rec){ return !!(rec && rec.chargePaid); }
  function surveyChargeRate(term){
    return term ? Number((((term.rates||{}).import)||{}).surveyCharge) || 0 : 0;
  }
  // Survey fees are an import matter — an export never attracts one.
  function surveyChargeable(s){ return (s.type === 'export' ? false : true); }
  function unpaidSurveys(s){
    if(!surveyChargeable(s)) return [];
    return (s.surveys || []).filter(r => !surveyChargePaid(r));
  }
  // A consolidation is invoiced house bill by house bill, so each one is its
  // own payable line with its own payment. What is left over — a fee charged
  // once on the master, however the cargo is split — stays on the shipment.
  function hawbChargePaid(s, no){ return (s.hawbCharges || {})[no] || null; }
  // What has already been handed over against individual house bills.
  function paidHawbTotal(s){
    return Object.values(s.hawbCharges || {})
      .reduce((n, p) => n + (Number(p && p.total) || 0), 0);
  }
  // A typed-in amount is the terminal's invoice for the whole AWB, not an
  // extra fee on top of it — so it replaces the rate calculation outright,
  // house bills included. Where a house bill was already settled on its own,
  // that payment is a fact and is never rewritten; it comes off the invoice
  // instead, and what is left is what remains to pay.
  function overrideRemainder(s){
    if(!s.chargeOverride) return 0;
    return Math.max(0, (Number(s.chargeOverride.amount) || 0) - paidHawbTotal(s));
  }
  // True when this AWB's terminal charge is a typed-in invoice figure —
  // still to pay, or already paid as one. Either way the house bills are
  // covered by it and are not billed or reported on their own.
  //
  // A payment made before this was fixed carries masterOnly, because the
  // old code filed the invoice as a master fee. It still came from "Amount
  // differs", whose prompt has always been "enter what the terminal
  // actually charged" against a figure covering the whole shipment — so it
  // always meant the whole invoice, and is read that way here. Without
  // this, every consolidation settled that way keeps billing its house
  // bills on top of an invoice that already covered them.
  function invoicedWhole(s){
    return !!(s.chargeOverride && !s.chargePaid)
        || !!(s.chargePaid && s.chargePaid.override);
  }
  // Which fees ride with a house bill, and which stay on the master.
  function feesSplit(term, type){
    const all = feesFor(term, type);
    return { perHawb: all.filter(f => (f.basis||'flat') === 'hawb'),
             master:  all.filter(f => (f.basis||'flat') !== 'hawb') };
  }
  // What one house bill owes: the terminal's scale on its own weight, plus
  // one unit of every per-HAWB fee.
  function chargeForHawb(s, h){
    const term = terminalObjForAwb(s.awb, STATE.terminals);
    const type = s.type === 'export' ? 'export' : 'import';
    const termName = term ? term.name : '';
    if(!term) return { ok:false, why:'No terminal matches this AWB prefix', lines:[], total:0 };
    const r = ratesFor(term, type);
    const hasScale = r.minCharge > 0 || r.perKg > 0 || r.minKg > 0;
    const { perHawb } = feesSplit(term, type);
    if(!hasScale && perHawb.length === 0) return { ok:false, terminalName: termName,
      why:`No ${type} rates set for ${termName}`, lines:[], total:0 };
    const lines = [];
    let warn = '';
    const kg = Number(h.kg) || 0;
    if(hasScale){
      if(kg > 0) lines.push({ label:'Terminal charges', amount: scaleOn(r, kg) });
      else warn = `${h.no} has no weight yet — add it under Edit details to price this line.`;
    }
    // A house bill carries its own cargo type, so a fee tied to one kind is
    // judged against that bill rather than against whatever else flew with it.
    const hKind = (h && h.cargo) ? cargoOf(h) : (h && h.dg ? 'dg' : cargoOf(s));
    perHawb.forEach(f => {
      if(!feeAppliesTo(f, hKind)) return;
      lines.push({ label: String(f.label||'Fee').trim() || 'Fee', amount: Number(f.amount)||0 });
    });
    return { ok:true, paid:false, terminalName: termName, type, kg, lines, warn,
      note: `${kgText(kg)} kg`, total: lines.reduce((n,l)=> n + l.amount, 0) };
  }
  // What is left on the master once the house bills have taken their share:
  // the fees charged once per shipment, whatever it is made up of.
  function chargeForMaster(s){
    const term = terminalObjForAwb(s.awb, STATE.terminals);
    const type = s.type === 'export' ? 'export' : 'import';
    if(!term) return { ok:false, why:'No terminal matches this AWB prefix', lines:[], total:0 };
    const r = ratesFor(term, type);
    const lines = [];
    feesSplit(term, type).master.forEach(f => {
      const line = feeLine(f, s, r.weightBasis);
      if(line) lines.push(line);
    });
    const auto = lines.length ? lines.reduce((n,l)=> n + l.amount, 0) : null;
    // A typed-in invoice amount is deliberately NOT handled here. It is the
    // terminal's bill for the whole AWB, so it replaces the house bills too
    // — which this function knows nothing about. Treating it as a master fee
    // added it on top of them, and a consolidation invoiced at RM 333 was
    // recorded as owing the house bills plus 333. An overridden shipment is
    // billed as one line by chargeItems(), from chargeFor().
    if(s.massend && !s.chargePaid){
      const amt = type === 'export' ? MASSEND_EXPORT_FEE : 0;
      return { ok:true, paid:false, massend:true, terminalName: term.name, type,
        kg: Number(s.kg)||0, calculated: auto, warn: '',
        lines: [{ label: type === 'export' ? 'Massend — export' : 'Massend — nothing to pay',
                  amount: amt }],
        total: amt };
    }
    // Nothing charged once on the master, and nothing typed in either — the
    // house bills carry the whole bill, so there is no master line to show.
    if(lines.length === 0) return { ok:false, none:true, lines:[], total:0 };
    return { ok:true, paid:false, terminalName: term.name, type, kg: Number(s.kg)||0,
      lines, warn:'', total: auto };
  }
  // Nothing left to pay on the shipment: the master part settled, and every
  // house bill that has actually landed with it. A bill still in the air is
  // not an unpaid bill — it becomes one when it arrives, and recording that
  // arrival puts the shipment back on this tab.
  function chargeSettled(s){
    // A typed-in invoice is billed as one line for the whole AWB, so it is
    // that line being paid that settles the shipment — not the house bills,
    // which are no longer billed separately while an override stands.
    if(s.chargeOverride && !s.chargePaid) return false;
    // Paying that one line settles the whole AWB, so the house bills it
    // covered must not come back as unpaid — the override is deleted once
    // used, and without this the shipment would be billed a second time,
    // house bill by house bill.
    if(s.chargePaid && s.chargePaid.override) return true;
    const hs = hawbList(s).filter(h => hawbHasCargo(s, h.no));
    if(hs.length === 0) return !!s.chargePaid;
    if(hs.some(h => !hawbChargePaid(s, h.no))) return false;
    return !!s.chargePaid || chargeForMaster(s).none === true;
  }

  // MASkargo's own consignments run on the 232 prefix and are handled
  // differently: nothing to pay on an import, a flat fee on an export.
  const MASSEND_PREFIX = '232';
  const MASSEND_EXPORT_FEE = 0.50;
  function massendEligible(s){ return awbPrefix(s.awb) === MASSEND_PREFIX; }

  // What this shipment owes, worked out live from the rates in Settings.
  // Once paid it is frozen on the shipment instead, so a later rate change
  // never rewrites what was actually handed over.
  function chargeFor(s){
    const term = terminalObjForAwb(s.awb, STATE.terminals);
    const type = s.type === 'export' ? 'export' : 'import';
    const termName = term ? term.name : '';
    // A figure typed in from the terminal's own invoice beats anything
    // calculated — the rates are an estimate, the invoice is the bill.
    if(s.chargeOverride && !s.chargePaid){
      const o = s.chargeOverride;
      // The figure the rates would have produced is carried along so the row
      // can show what it was before someone typed in the invoice.
      const auto = (term && ratesSet(term, type)) ? rateCharge(s, term, type).total : null;
      // The invoice covers the whole AWB. Anything already settled against a
      // house bill is deducted rather than charged twice, and shown as its
      // own line so the figure can be followed.
      const already = paidHawbTotal(s);
      const lines = [{ label: `Amount from the terminal${o.note ? ' — ' + o.note : ''}`,
        amount: Number(o.amount) || 0 }];
      if(already > 0) lines.push({ label: 'Less house bills already paid', amount: -already });
      return { ok:true, paid:false, override:true, terminalName: termName, type, kg: Number(s.kg)||0,
        photoId: o.photoId || null, by: o.by || '', calculated: auto, warn: '', lines,
        total: overrideRemainder(s) };
    }
    if(s.massend && !s.chargePaid){
      const amt = type === 'export' ? MASSEND_EXPORT_FEE : 0;
      // Same as an invoice amount: the figure the rates would have produced
      // is carried along so the row can show what it replaced.
      const auto = (term && ratesSet(term, type)) ? rateCharge(s, term, type).total : null;
      return { ok:true, paid:false, massend:true, terminalName: termName, type, kg: Number(s.kg)||0,
        calculated: auto, warn: '',
        lines: [{ label: type === 'export' ? 'Massend — export' : 'Massend — nothing to pay', amount: amt }],
        total: amt };
    }
    if(chargeSettled(s)) return { ...s.chargePaid, paid: true };
    if(!term) return { ok:false, why:'No terminal matches this AWB prefix', lines:[], total:0 };
    if(!ratesSet(term, type)) return { ok:false, terminalName: term.name,
      why:`No ${type} rates set for ${term.name}`, lines:[], total:0 };
    const rc = rateCharge(s, term, type);
    return { ok:true, paid:false, terminalName: term.name, type, kg: Number(s.kg)||0,
      lines: rc.lines, warn: rc.warn, note: rc.note, needsHawbKg: rc.needsHawbKg,
      total: rc.total };
  }
  // The charge as the rates work it out, with its workings.
  // The terminal's scale applied to one weight: the minimum up to its weight
  // break, then the per-kg rate beyond it.
  function scaleOn(r, kg){
    const over = Math.max(0, kg - r.minKg);
    return r.minCharge + over * r.perKg;
  }
  function kgText(n){ return n.toFixed(n % 1 ? 1 : 0); }
  function rateCharge(s, term, type){
    const r = ratesFor(term, type);
    const hasScale = r.minCharge > 0 || r.perKg > 0 || r.minKg > 0;
    const hawbs = hawbList(s);
    // A consolidation is billed house bill by house bill — every HAWB meets
    // the minimum in its own right, which is how the terminal invoices it.
    // That needs a weight against each one; without them all there is nothing
    // to split, so the master weight is used and the row says why.
    const weighed = hawbs.filter(h => Number(h.kg) > 0);
    const perHawb = hasScale && hawbs.length > 0 && weighed.length === hawbs.length;
    const lines = [];
    let warn = '', note = '';
    if(hasScale && perHawb){
      note = 'Charged per HAWB';
      const shown = hawbs.slice(0, 8);
      shown.forEach(h => {
        const k = Number(h.kg) || 0;
        lines.push({ label: `${h.no} · ${kgText(k)} kg`, amount: scaleOn(r, k) });
      });
      if(hawbs.length > shown.length){
        const rest = hawbs.slice(shown.length);
        lines.push({ label: `${rest.length} more HAWB${rest.length>1?'s':''}`,
          amount: rest.reduce((n,h)=> n + scaleOn(r, Number(h.kg)||0), 0) });
      }
    } else if(hasScale){
      // One line with its whole working, the same shape every fee uses, so
      // the breakdown reads as a list rather than one charge split in two.
      const kg = weightFor(s, r.weightBasis);
      const over = Math.max(0, kg - r.minKg);
      lines.push({ label: 'Terminal charges', amount: r.minCharge + over * r.perKg });
      if(hawbs.length > 0 && weighed.length < hawbs.length){
        const missing = hawbs.length - weighed.length;
        warn = `Charged on the master weight — ${missing} of ${hawbs.length} `
          + `HAWB${hawbs.length>1?'s':''} still ${missing>1?'need':'needs'} a weight. `
          + `Add ${missing>1?'them':'it'} under Edit details to bill each house bill on its own.`;
      }
    }
    // Then the terminal's extras, in the order they were set up. A fee that
    // does not apply simply does not appear: a per-HAWB fee on a shipment
    // with no house bills is a direct consignment, not a mistake, and so is
    // a fee tied to a kind of cargo this shipment is not carrying.
    feesFor(term, type).forEach(f => {
      const line = feeLine(f, s, r.weightBasis);
      if(line) lines.push(line);
    });
    // Which of an export's two weights the row was worked out on — said once
    // at the top rather than repeated on every line.
    if(!note && s.type === 'export'){
      const g = Number(s.grossKg) || 0, cw = Number(s.chargeKg) || 0;
      // Only worth saying when the two weights actually differ.
      if(g && cw && g !== cw){
        const kgUsed = weightFor(s, r.weightBasis);
        const which = r.weightBasis === 'gross' ? 'gross'
          : r.weightBasis === 'charge' ? 'chargeable'
          : (g >= cw ? 'gross' : 'chargeable');
        note = `Charged on the ${which} weight · ${kgText(kgUsed)} kg`;
      }
    }
    // Survey reports are billed on their own rows, never folded in here.
    return { lines, warn, note, needsHawbKg: hasScale && hawbs.length > 0 && !perHawb,
      total: lines.reduce((n,l)=> n + l.amount, 0) };
  }

  // ---- shipments ----
  async function getOpenShipments(){
    const snap = await withTimeout(db.collection(SHIP).where('closed','==', false).get(), 15000, 'Loading shipments');
    return migrateLoaded(snap.docs.map(d => d.data()));
  }
  // Read only when the Completed tab is actually opened, not on every load —
  // this can grow all season, so there's no reason to pay for it up front.
  // One day at a time: every closure stamps closedDate as YYYY-MM-DD, so
  // this reads only that day's shipments rather than the whole season.
  async function getClosedShipmentsOn(dateStr){
    const snap = await withTimeout(
      db.collection(SHIP).where('closedDate','==', dateStr).get(), 15000, 'Loading completed shipments');
    return migrateLoaded(snap.docs.map(d => d.data()).filter(s => s.closed));
  }
  // Firestore refuses the WHOLE document if any field anywhere in it is
  // undefined, so one stray value turns into "could not save" on a delivery
  // someone is standing in the warehouse trying to record. Undefined means
  // "not set" here in every case, so it is dropped on the way out rather
  // than allowed to block the write.
  function stripUndefined(v){
    if(Array.isArray(v)) return v.map(stripUndefined);
    if(v && typeof v === 'object' && !(v instanceof Date)){
      const out = {};
      Object.keys(v).forEach(k => { if(v[k] !== undefined) out[k] = stripUndefined(v[k]); });
      return out;
    }
    return v;
  }
  async function saveShipment(s){
    // Stamped on every save so a shortfall can still be found after the
    // shipment closes — the board only ever queries open shipments, so an
    // unflagged closed one would simply vanish from Outstanding.
    s.hasShortfall = outstandingTotal(s) > 0;
    // What the background refresh asks for. Without it, keeping the board
    // current meant re-reading every open shipment every time; with it, the
    // refresh only pulls what actually moved.
    s.updatedAt = new Date().toISOString();
    // Backfill on the way out, so shipments created before the duplicate
    // check existed become findable by it the first time they are touched.
    if(!s.awbKey) s.awbKey = awbKey(s.awb);
    // Flat list of this shipment's house bills, kept in step on every save so
    // the duplicate-HAWB check can be a single query.
    s.hawbKeys = hawbList(s).map(h => awbKey(h.no)).filter(Boolean);
    // Same reasoning as hasShortfall: a terminal charge that is still unpaid
    // when the shipment closes would drop off the Charges tab with it, since
    // the board only holds open shipments. Flagged here so it can be found by
    // one query whatever state the shipment is in.
    s.chargeOpen = chargesDue(s) && !chargeSettled(s);
    s.dutyOpen = dutyDue(s);
    // A typed-in amount has to stay findable after it is paid and the
    // shipment closes, which is exactly when it falls off both the board and
    // the open-charges query — so it carries its own flag.
    s.chargeEdited = !!(s.chargeOverride || (s.chargePaid && s.chargePaid.override));

    // The activity feed is merged rather than overwritten.
    //
    // This save writes the whole document from what this device has in
    // memory, which is right for everything the person in front of it just
    // changed — and wrong for the feed, which several people add to at
    // once. Two admins with the same shipment open, one writes a remark,
    // the other advances a step from a copy loaded a minute earlier, and
    // the remark is gone. It kept appearing under Remarks because that
    // index is its own document; steps and edits lost the same way left no
    // trace at all.
    //
    // Safe to merge because the feed is append-only — nothing anywhere
    // removes or rewrites an entry — so anything on the server that this
    // device has not seen should always be kept.
    const ref = db.collection(SHIP).doc(s.id);
    const key = a => [a && a.at, a && a.kind, a && a.by, a && a.text].join('|');
    try{
      await db.runTransaction(async tx => {
        const doc = await tx.get(ref);
        const theirs = (doc.exists && Array.isArray(doc.data().activity))
          ? doc.data().activity : [];
        const mine = Array.isArray(s.activity) ? s.activity : [];
        const seen = new Set(mine.map(key));
        const missed = theirs.filter(a => !seen.has(key(a)));
        const merged = missed.length
          ? mine.concat(missed).sort((a, b) => String(a.at).localeCompare(String(b.at)))
          : mine;
        s.activity = merged;
        tx.set(ref, stripUndefined(s));
      });
    }catch(e){
      // A transaction can fail where a plain write would have gone through
      // — contention, or being offline with the write queued. Losing the
      // save entirely would be worse than losing the merge, so fall back.
      console.error('Could not merge the activity feed, saving directly:', e);
      await ref.set(stripUndefined(s));
    }
  }
  // Everything that has changed since the last sync — open or closed, in one
  // single-field query. Deliberately NOT combined with closed == false: that
  // would need a composite index set up by hand in the Firestore console,
  // and a shipment that just closed is exactly what the board needs to hear
  // about so it can drop it.
  async function getChangedShipments(since){
    const snap = await withTimeout(
      db.collection(SHIP).where('updatedAt','>', since).get(), 15000, 'Checking for changes');
    return migrateLoaded(snap.docs.map(d => d.data()));
  }
  // updatedAt is written from whichever device saved, so two clocks a little
  // out of step could hide a change. Asking from a few minutes earlier than
  // the last one seen costs a handful of re-reads and removes that risk.
  const SYNC_REWIND_MS = 5 * 60 * 1000;
  function rewindIso(iso, ms){
    const t = Date.parse(iso);
    return isNaN(t) ? iso : new Date(t - ms).toISOString();
  }
  // Closed shipments that still have pieces unaccounted for. Single-field
  // query, so it stays cheap however many closed shipments pile up.
  async function getShortfallShipments(){
    const snap = await withTimeout(
      db.collection(SHIP).where('hasShortfall','==', true).get(), 15000, 'Loading shortfalls');
    return migrateLoaded(snap.docs.map(d => d.data()));
  }

  // ============================================================
  // Stage definitions
  // ============================================================
  // Export never needs a K1 (that's an import declaration), so it has one
  // sequence. Import branches depending on whether the lot needs a formal
  // K1 declaration — a simpler release without one, or Examine + Pay duty
  // with one. Each lot decides this for itself, since it's its own
  // clearance event and different lots on the same AWB can go either way.
  // "Cargo in" rather than "Delivery": on an export this is the shipper
  // bringing goods TO us, the opposite direction to an import's Delivery.
  // Sharing the word made the wall board ambiguous.
  const EXPORT_STEPS = ['Cargo in','Docs in','Screening','Releasing','Closing'];
  const IMPORT_STEPS_NOK1 = ['Arrived','Docs in','Screening','Delivery','Releasing','Closing'];
  // A K1 consignment is declared, examined and paid for before the cargo is
  // even here — so its first three steps happen while the lot is still in
  // the air, and "Arrived" sits in the middle rather than at the start.
  const IMPORT_STEPS_K1   = ['Arrived','K1 in','Examine','Pay duty','Docs in','Releasing','Delivery','Closing'];
  function importSteps(lot){ return lot.hasK1 ? IMPORT_STEPS_K1 : IMPORT_STEPS_NOK1; }
  // Delivery is no longer always second-to-last — on the no-K1 path it comes
  // before Releasing — so these are looked up by name rather than assumed
  // from the length.
  function deliveryIdx(steps){ return steps.indexOf('Delivery'); }
  function arrivedIdx(steps){ return steps.indexOf('Arrived'); }
  function terminalIdx(steps){ return steps.length - 1; }
  // How far through its own sequence a status sits, as a fraction of that
  // sequence. Expressed as a fraction rather than a step number so a 5-step
  // export and an 8-step K1 import can be ranked against each other — a raw
  // number would always put the shorter sequence ahead. Used wherever work
  // is listed furthest-along first, so what is still in the air falls to the
  // bottom where it needs nothing today.
  function statusProgress(label, type, k1){
    const s = String(label || '');
    if(s === 'Not arrived') return -1;
    // The flight came and brought nothing: further along than still in the
    // air, but behind anything that has cargo to work on.
    if(s === 'Nothing arrived') return -0.5;
    if(s === 'Delivered' || s === 'All lots delivered') return 0.99;
    if(s === 'Awaiting balance') return 0.9;
    if(s.startsWith('Delivery ')) return 0.85;
    const arr = type === 'export' ? EXPORT_STEPS : (k1 ? IMPORT_STEPS_K1 : IMPORT_STEPS_NOK1);
    const i = arr.indexOf(s);
    return i < 0 ? 0 : i / (arr.length - 1);
  }
  // Stages are stored as positions, so reordering the sequences changed what
  // the stored numbers mean. Existing lots are translated by NAME from the
  // old order to the new one, once, and stamped so it never runs twice.
  // A lot's stage is stored as a position in the list, so every time the
  // list is reordered the stored numbers have to be translated by NAME or
  // shipments silently jump to the wrong step. Each past shape is kept here
  // for exactly that reason.
  const STEPS_VERSION = 3;
  const V1_IMPORT_NOK1 = ['Arrived','Docs in','Screening','Releasing','Delivery','Closing'];
  const V1_IMPORT_K1   = ['Arrived','Docs in','Examine','Pay duty','Releasing','Delivery','Closing'];
  const V2_IMPORT_NOK1 = ['Arrived','Docs in','Screening','Delivery','Releasing','Closing'];
  const V2_IMPORT_K1   = ['K1 in','Examine','Pay duty','Arrived','Docs in','Releasing','Delivery','Closing'];
  function stepsAtVersion(lot, v){
    if(v >= 2) return lot.hasK1 ? V2_IMPORT_K1 : V2_IMPORT_NOK1;
    return lot.hasK1 ? V1_IMPORT_K1 : V1_IMPORT_NOK1;
  }
  function migrateShipmentSteps(s){
    if(!s || s.type !== 'import') return false;
    const v = s.stepsVersion || 1;
    if(v >= STEPS_VERSION) return false;
    (s.lots||[]).forEach(lot => {
      // K1 used to be cleared before the cargo landed; now nothing comes
      // before Arrived. A K1 lot still in the air therefore goes back to
      // waiting for it — which is where recording its arrival would put it
      // anyway, so nothing is lost that the new order would have kept.
      if(lot.hasK1 && !lot.hasArrived){ lot.stage = 0; return; }
      const oldSteps = stepsAtVersion(lot, v);
      const label = oldSteps[lot.stage];
      if(label === undefined) return;
      const idx = importSteps(lot).indexOf(label);
      if(idx > -1) lot.stage = idx;
    });
    s.stepsVersion = STEPS_VERSION;
    return true;
  }
  // Applied wherever shipments enter the app, and persisted so the
  // translation happens once rather than on every load.
  function migrateLoaded(list){
    list.forEach(s => {
      if(migrateShipmentSteps(s)){
        db.collection(SHIP).doc(s.id).set(s).catch(e => console.error('Could not save step migration:', e));
      }
    });
    noteChargeFlags(list);
    return list;
  }
  // The Charges tab finds a closed shipment's unpaid charge through a flag on
  // the record, and a flag written by an older version can disagree with what
  // the rules now say — which hides a real charge until someone happens to
  // browse to it. So every shipment that passes through here has its flag
  // checked against the record and quietly corrected. No extra reads: these
  // are shipments already loaded, and only the two flag fields are written.
  let _flagQueue = [];
  let _flagTimer = null;
  function noteChargeFlags(list){
    if(!CAN_EDIT) return;   // a view-only signin has no business writing
    (list || []).forEach(s => {
      if(!s || !s.id) return;
      const open = chargesDue(s) && !chargeSettled(s);
      const duty = dutyDue(s);
      const edited = !!(s.chargeOverride || (s.chargePaid && s.chargePaid.override));
      if(s.chargeOpen === open && s.dutyOpen === duty && s.chargeEdited === edited) return;
      s.chargeOpen = open;
      s.dutyOpen = duty;
      s.chargeEdited = edited;
      _flagQueue.push({ id: s.id, chargeOpen: open, dutyOpen: duty, chargeEdited: edited });
    });
    if(_flagQueue.length && !_flagTimer) _flagTimer = setTimeout(flushChargeFlags, 1200);
  }
  async function flushChargeFlags(){
    _flagTimer = null;
    const due = _flagQueue.splice(0, 400);
    if(due.length === 0) return;
    try{
      const batch = db.batch();
      due.forEach(x => batch.set(db.collection(SHIP).doc(x.id),
        { chargeOpen: x.chargeOpen, dutyOpen: x.dutyOpen, chargeEdited: x.chargeEdited },
        { merge: true }));
      await batch.commit();
      // What is payable may have just changed, so the tab reloads its source.
      invalidateOpenCharges();
      invalidateEditedCharges();
    }catch(e){ console.error('Could not correct charge flags:', e); }
    if(_flagQueue.length) _flagTimer = setTimeout(flushChargeFlags, 1200);
  }

  // True while a K1 lot is still working through its pre-arrival steps.
  function preArrival(lot){
    const steps = importSteps(lot);
    return !lot.hasArrived && lot.stage < arrivedIdx(steps);
  }

  // Threshold in hours before a stage counts as "stuck". Admin-tunable later;
  // fixed here for v1.
  const THRESH = {
    exp:     [48, 12, 24, 6, 24],            // Cargo in, Docs in, Screening, Releasing, Closing
    impNoK1: [48, 12, 24, 12, 6, 24],        // Arrived, Docs in, Screening, Delivery, Releasing, Closing
    impK1:   [24, 24, 12, 48, 12, 6, 12, 24] // K1 in, Examine, Pay duty, Arrived, Docs in, Releasing, Delivery, Closing
  };
  function importThresh(lot){ return lot.hasK1 ? THRESH.impK1 : THRESH.impNoK1; }
  const CHASE_QUIET_DAYS = 1; // an alert chased today stays quiet until this many days pass

  function ageLevel(hours, threshold){
    if(hours >= threshold) return 'bad';
    if(hours >= threshold * 0.6) return 'warn';
    return 'ok';
  }

  // ============================================================
  // External tracking links
  // ============================================================
  function cargoLink(awb){
    const m = String(awb||'').match(/^(\d{3})-?(\d+)$/);
    if(!m) return null;
    const prefix = m[1], num = m[2];
    if(prefix === '232'){
      return { label:'Track on MASkargo', direct:true,
        url:`https://www.maskargo.com/en/shipment-tracking.html?prefixNumber=232&awbNumber=${num}` };
    }
    if(prefix === '807'){
      return { label:'Copy AWB & open AirAsia', direct:false, copy:`${prefix}${num}`,
        url:'https://airasia.smartkargo.com/FrmAWBTracking.aspx' };
    }
    return null;
  }
  function flightLink(flightNo){
    if(!flightNo) return null;
    // Flightradar24 resolves a flight number directly in this path — lowercase,
    // no spaces. Confirmed against FR24's own linking convention; not
    // independently re-tested against every route, so worth a quick check
    // the first time a link is used.
    const clean = flightNo.trim().toLowerCase().replace(/\s+/g,'');
    return `https://www.flightradar24.com/data/flights/${encodeURIComponent(clean)}`;
  }

  // ============================================================
  // Session
  // ============================================================
  let ME = null;        // { id, name }
  let MY_LEVEL = 'off';
  let CAN_EDIT = false;
  // Two tiers above Edit. A moderator runs the board: everything an admin can
  // do, plus the parts that change how the board itself works — the wall
  // display, the report, Settings, Worker IDs and Access. An admin runs the
  // day: shipments, lots, charges, surveys, and nothing structural.
  let IS_ADMIN = false;   // admin OR moderator — the day-to-day powers
  let IS_MOD = false;     // moderator only — the structural tabs
  let CAN_DISPLAY = false;

  // One place that turns a stored level into the session's powers, so the
  // Access tab and sign-in can never disagree about what a level means.
  const LEVELS = ['off','view','edit','admin','mod'];
  const LEVEL_LABEL = { off:'Off', view:'View', edit:'Edit', admin:'Admin', mod:'Moderator' };
  function applyLevel(lvl){
    MY_LEVEL = lvl;
    IS_MOD   = lvl === 'mod';
    IS_ADMIN = lvl === 'admin' || IS_MOD;
    CAN_EDIT = lvl === 'edit' || IS_ADMIN;
  }
  // The session lives in sessionStorage by default, so closing the tab signs
  // you out — right for a shared office machine. A screen left running the
  // Display board all day is the opposite case: the browser eventually
  // discards an idle tab to reclaim memory, and on reload the session is
  // gone and the wall shows a login box. Ticking "keep me signed in" moves
  // it to localStorage, which survives that.
  const SESSION_KEY = 'fwd_session';
  function restoreSession(){
    try{
      const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
      if(raw) ME = JSON.parse(raw);
    }catch(e){}
  }
  function saveSession(keepSignedIn){
    const raw = JSON.stringify(ME);
    try{
      if(keepSignedIn){ localStorage.setItem(SESSION_KEY, raw); sessionStorage.removeItem(SESSION_KEY); }
      else { sessionStorage.setItem(SESSION_KEY, raw); localStorage.removeItem(SESSION_KEY); }
    }catch(e){ try{ sessionStorage.setItem(SESSION_KEY, raw); }catch(e2){} }
  }
  function logout(){
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    sessionStorage.removeItem('fwd_session');
    ME = null; MY_LEVEL='off'; CAN_EDIT=false; IS_ADMIN=false; IS_MOD=false; CAN_DISPLAY=false;
    renderLogin();
  }

  // ============================================================
  // Root render
  // ============================================================
  const root = document.getElementById('app');
  let STATE = { tab:'board', filter:'all', terminalFilter:'all', search:'', searchCompleted:'', searchOutstanding:'', searchRemarks:'', searchSurveys:'', outFilter:'all', outAge:'all', outPage:0, display:{}, shipments:[], access:{}, workers:[], terminals:[], principals:[], detailId:null,
    reportFrom:'', reportTo:'', reportPrincipal:'all', surveysOpenOnly:false,
    chargesPicked:{}, searchCharges:'', chargeTerminal:null,
    chargeEditFrom:'', chargeEditTo:'', chargeEditPage:0,
    doCfg:{ roles:[], assign:{}, heads:{}, under:{}, cutoff:'17:30',
      dayPoints:DO_DAY_POINTS }, accOpen:null,
    doLog:null, doTasks:[], doPicked:{}, doPending:null, doPoints:null };

  // Shown beside your name in the header. The team ships several builds a
  // day, so there has to be a way to tell what a given phone is actually
  // running without guessing — tap it and it checks for a newer one.
  const APP_BUILD = '2026-10-17a';
  // Registration itself lives in its own script in the head, so it survives
  // the app script failing to start.
  const swState = () => window.__sw || {};
  function checkForUpdate(){
    const S = swState();
    if(S.check) S.check(); else window.location.reload();
  }

  async function boot(){
    if(!FIREBASE_READY){ renderSetupNeeded(); return; }
    restoreSession();
    if(!ME){
      root.innerHTML = authShell('Loading…', '');
      let workers;
      try{ workers = await getWorkers(); }
      catch(e){ renderLoadError(e, boot); return; }
      if(workers.length === 0){ renderBootstrapAdmin(); return; }
      renderLogin();
      return;
    }
    await loadAccessAndGo();
  }

  function renderSetupNeeded(){

        <p style="line-height:1.7;">This app needs its own Firebase project.

        <p>Once that's done, reload this page — the first person to open it will be

  }

  // Every pre-login screen shares this shell: the dark topbar with the app
  // name, then a single centered card below on the page background — same

  function authShell(title, bodyHtml){

      <div class="topbar" style="padding-bottom:14px;">

  // Shown whenever a Firestore read fails — slow or dropped connections are
  // exactly when this matters most. Previously a failed read here left the
  // screen stuck on "Loading…" forever with no way back short of guessing to
  // reload, which looked identical to the data having vanished even though
  // it was safe the whole time.
  function renderLoadError(err, retryFn){

  function renderBootstrapAdmin(){
    root.innerHTML = authShell('Set up the first admin', `
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.6;">
          No worker IDs exist yet in this project. Create yours — you'll get admin
          access automatically, and can add everyone else from the Worker IDs tab.</p>
        <div class="field"><label>Your name</label>
          <input id="bs-name" placeholder="Full name"></div>
        <div class="field"><label>Choose a password</label>
          <input id="bs-pass" type="password" placeholder="At least 4 characters"></div>
        <button class="advance" id="bs-go" style="margin:0;">Create admin &amp; sign in</button>
        <div class="msg" id="bs-msg" style="margin-top:10px;"></div>`);

      const pass = document.getElementById('bs-pass').value;
      const msg = document.getElementById('bs-msg');

      if(!pass || pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Password needs at least 4 characters.'; return; }
      this.disabled = true; this.textContent = 'Creating…';
      const id = uid();
      const passwordHash = await sha256Hex(pass);
      await saveWorker({ id, name, passwordHash, createdAt: new Date().toISOString() });
      await setAccessFor(id, 'mod');

  async function loadAccessAndGo(){
    root.innerHTML = authShell('Loading…', '');
    try{
      const [access, termCfg, dispMap, doCfg] = await Promise.all([
        getAccessMap(), getTerminalsConfig(), getDisplayMap(), getDoConfig()]);
      MY_LEVEL = access[ME.id] || 'off';
