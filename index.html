    document.getElementById('sq-filter-status').onchange = () => drawSideQuestsList();
    document.getElementById('sq-filter-role').onchange = () => drawSideQuestsList();
    document.getElementById('sq-filter-name').oninput = () => drawSideQuestsList();
    document.getElementById('sq-add').onclick = async function(){
      const title = document.getElementById('sq-title').value.trim();
      const points = parseInt(document.getElementById('sq-points').value, 10);
      const capacityRaw = document.getElementById('sq-capacity').value;
      const capacity = capacityRaw ? parseInt(capacityRaw, 10) : 1;
      const opensHours = parseInt(document.getElementById('sq-opens-hours').value, 10) || 0;
      const opensMinutes = parseInt(document.getElementById('sq-opens-minutes').value, 10) || 0;
      const expiryRaw = document.getElementById('sq-expiry').value;
      // Stored as a fixed instant rather than a per-worker countdown.
      const expiresAtFixed = expiryRaw ? new Date(expiryRaw).toISOString() : null;
      const assignToId = document.getElementById('sq-assign-to').value;
      const selectedRoles = [...document.querySelectorAll('.sq-role-cb:checked')].map(cb=>cb.value);
      const requiresPhoto = document.getElementById('sq-requires-photo').checked;
      const msg = document.getElementById('sq-msg');
      if(!title || !points || points<=0){ msg.style.color='var(--red)'; msg.textContent='Please fill in a description and valid points.'; return; }
      if(!capacity || capacity<=0){ msg.style.color='var(--red)'; msg.textContent='Capacity must be a valid number, at least 1.'; return; }
      if(expiryRaw && isNaN(new Date(expiryRaw).getTime())){ msg.style.color='var(--red)'; msg.textContent='That deadline isn\'t a valid date and time.'; return; }
      if(expiresAtFixed && new Date(expiresAtFixed).getTime() < Date.now()){ msg.style.color='var(--red)'; msg.textContent='That deadline is already in the past.'; return; }
      if(!assignToId && selectedRoles.length===0){ msg.style.color='var(--red)'; msg.textContent='Pick at least one role, or assign it directly to a specific worker.'; return; }
      this.disabled = true; this.textContent = 'Creating…';
      const questId = uid();
      const now = new Date();
      const opensAtMs = now.getTime() + (opensHours*60 + opensMinutes)*60*1000;
      const res = await mutateSideQuests(quests => quests.concat([{
        id: questId, title, points, requiresPhoto, expiresAtFixed: expiresAtFixed || null,
        roles: assignToId ? [] : selectedRoles,
        capacity: assignToId ? 1 : capacity,
        opensAt: (opensHours>0 || opensMinutes>0) ? new Date(opensAtMs).toISOString() : null,
        active: !assignToId, // directly-assigned quests are already claimed, so never open to others
        createdAt: now.toISOString(),
        createdBy: currentAdminName()
      }]));
      if(res.ok) adminLog('Created a challenger task', title + ' · ' + points + ' pts');
      let ok = res.ok;
      if(ok && assignToId){
        const assigned = {
          id: uid(), workerId: assignToId, title, points,
          period: 'Challenger Task', status: 'active', createdAt: todayStr(),
          requiresPhoto, sideQuestId: questId, acceptedAt: new Date().toISOString(),
          // Same deadline the normal accept flow computes — without this the
          // expiry sweep has nothing to check against, and a directly
          // assigned task can sit "in progress" forever no matter how far
          // past its due date it gets.
          expiresAt: expiresAtFixed || null
        };
        ok = await applyTargetDeltas({ add: [assigned] });
      }
      this.disabled = false; this.textContent = 'Create Challenger Task';
      if(ok){
        document.getElementById('sq-title').value=''; document.getElementById('sq-points').value=''; document.getElementById('sq-expiry').value='';
        document.getElementById('sq-capacity').value='1'; document.getElementById('sq-opens-hours').value=''; document.getElementById('sq-opens-minutes').value='';
        document.getElementById('sq-assign-to').value='';
        document.querySelectorAll('.sq-role-cb').forEach(cb=>cb.checked=false);
        document.getElementById('sq-requires-photo').checked = true;
        const assignedWorker = assignToId ? workers.find(w=>w.id===assignToId) : null;
        msg.style.color='var(--green)';
        msg.textContent = assignedWorker ? `Challenger task created and assigned directly to ${assignedWorker.name}.` : `Challenger task created — visible to ${selectedRoles.join(', ')}.`;
        drawSideQuestsList();
      } else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };
    await drawSideQuestsList();
  }

  async function drawSideQuestsList(page){
    page = page || 0;
    const el = document.getElementById('sq-list');
    if(!el) return;
    const [quests, targets, workers, pendingSubs] = await Promise.all([getSideQuests(), getTargets(), getWorkers(), getPendingSubs()]);
    if(quests.length===0){ el.innerHTML = `<div class="card"><div class="empty">No challenger tasks yet.</div></div>`; return; }
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    const pendingTargetIds = pendingTargetIdSet(pendingSubs);
    const statusLabel = { progress:'In progress', pending:'Pending review', completed:'Completed', failed:'Failed (expired)' };
    const statusColor = { progress:'var(--amber-dark)', pending:'var(--amber-dark)', completed:'var(--green)', failed:'var(--red)' };
    const statusWeight = { progress:0, pending:0, failed:1, completed:2 };

    const statusFilter = document.getElementById('sq-filter-status') ? document.getElementById('sq-filter-status').value : 'all';
    const roleFilter = document.getElementById('sq-filter-role') ? document.getElementById('sq-filter-role').value : 'all';
    const nameFilter = document.getElementById('sq-filter-name') ? (document.getElementById('sq-filter-name').value || '').trim().toLowerCase() : '';
    const filtersActive = statusFilter!=='all' || roleFilter!=='all' || !!nameFilter;

    function acceptedStatusFor(t){
      if(t.status==='achieved') return 'completed';
      if(t.status==='failed') return 'failed';
      if(pendingTargetIds.has(t.id)) return 'pending';
      return 'progress';
    }
    const questsWithMeta = quests.map(sq=>({
      sq, accepted: targets.filter(t=>t.sideQuestId===sq.id)
    }));
    // Newest first, so the list reads as a history of what has been raised and
    // the one you just created is the one you are looking at. The status
    // filter above is there for finding the ones that still need attention.
    // A quest raised before creation dates were recorded sorts to the bottom
    // rather than throwing the comparator off.
    questsWithMeta.sort((a,b)=>
      String(b.sq.createdAt||'').localeCompare(String(a.sq.createdAt||'')));

    const allCards = questsWithMeta.map(({sq, accepted})=>{
      const achieved = accepted.filter(t=>t.status==='achieved').length;
      const needsPhoto = sq.requiresPhoto !== false;
      const createdLabel = sq.createdAt ? new Date(sq.createdAt).toLocaleString() : '—';

      // apply worker-level filters to the accepted list
      let visibleAccepted = accepted.filter(t=>{
        const w = workerMap[t.workerId];
        const st = acceptedStatusFor(t);
        if(statusFilter!=='all' && st!==statusFilter) return false;
        if(roleFilter!=='all' && (!w || w.role!==roleFilter)) return false;
        if(nameFilter && (!w || !w.name.toLowerCase().includes(nameFilter))) return false;
        return true;
      });
      // sort completed to the bottom, most recently accepted first within each group
      visibleAccepted = visibleAccepted.slice().sort((a,b)=>{
        const wA = statusWeight[acceptedStatusFor(a)], wB = statusWeight[acceptedStatusFor(b)];
        if(wA!==wB) return wA-wB;
        return (b.acceptedAt||'').localeCompare(a.acceptedAt||'');
      });

      if(filtersActive && visibleAccepted.length===0) return ''; // hide quests with no matching acceptances

      return `
        <div class="card" style="margin-bottom:10px;">
          <div class="ledger-row" style="border-top:none;padding:0;">
            <div class="ledger-note">${escapeHtml(sq.title)} <span style="font-size:10.5px;color:${needsPhoto?'var(--muted)':'var(--amber-dark)'};">${needsPhoto?'📷 Photo required':'✏️ Note only'}</span>${sq.active===false ? ' <span style="font-size:10px;color:var(--red);">CLOSED</span>' : ''}</div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="target-pts">${sq.points} pts</span>
              <button class="btn btn-ghost btn-sm" data-sq-toggle="${sq.id}" style="padding:4px 9px;">${sq.active===false ? 'Reopen' : 'Close'}</button>
              <button class="btn btn-ghost btn-sm" data-sq-edit="${sq.id}" style="padding:4px 9px;">Edit</button>
              <button class="btn btn-ghost btn-sm" data-sq-remove="${sq.id}" style="padding:4px 9px;">Remove</button>
            </div>
          </div>
          <div class="help" style="margin:8px 0 0;">Created ${createdLabel}${
            sq.createdBy ? ' by ' + escapeHtml(sq.createdBy) : ''} &middot; ${questDeadlineLabel(sq)}</div>
          <div class="help" style="margin:2px 0 0;">${sq.roles && sq.roles.length>0 ? `Roles: ${sq.roles.map(escapeHtml).join(', ')}` : (accepted.length>0 && accepted[0] ? 'Directly assigned' : 'No roles set')} &middot; capacity ${sq.capacity||1}</div>
          ${sq.opensAt && new Date(sq.opensAt).getTime() > Date.now() ? `<div class="help" style="margin:2px 0 0;color:var(--amber-dark);">Opens ${new Date(sq.opensAt).toLocaleString()}</div>` : ''}
          <div class="help" style="margin:2px 0 0;">${accepted.length} accepted &middot; ${achieved} completed${filtersActive ? ` &middot; showing ${visibleAccepted.length} matching` : ''}</div>
          ${visibleAccepted.length>0 ? `
            <div style="margin-top:6px;">
              ${visibleAccepted.map(t=>{
                const w = workerMap[t.workerId];
                const st = acceptedStatusFor(t);
                const acceptedLabel = t.acceptedAt ? new Date(t.acceptedAt).toLocaleString() : '—';
                return `<div style="padding:5px 0;border-top:1px solid var(--line);font-size:12px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span>${escapeHtml(w ? w.name : 'Unknown worker')}</span>
                    <span style="color:${statusColor[st]};font-weight:600;">${statusLabel[st]}</span>
                  </div>
                  <div style="color:var(--muted);font-size:10.5px;margin-top:1px;">Accepted ${acceptedLabel}</div>
                </div>`;
              }).join('')}
            </div>
          ` : ''}
          <div id="sq-edit-form-${sq.id}"></div>
        </div>`;
    }).filter(html => html !== '');

    const cardsHtml = allCards.slice(page*PAGE_SIZE, (page+1)*PAGE_SIZE).join('');
    el.innerHTML = (cardsHtml || `<div class="card"><div class="empty">No accepted challenger tasks match these filters.</div></div>`)
      + pagerHtml(page, allCards.length);
    wirePager(el, page, allCards.length, p => drawSideQuestsList(p));

    el.querySelectorAll('[data-sq-toggle]').forEach(btn=>{
      btn.onclick = async ()=>{
        await mutateSideQuests(list => {
          const i = list.findIndex(x=>x.id===btn.dataset.sqToggle);
          if(i < 0) return false;
          list[i].active = list[i].active===false ? true : false;
          adminLog((list[i].active ? 'Reopened' : 'Closed') + ' a challenger task',
            list[i].title || '');
          return list;
        });
        drawSideQuestsList(page);
      };
    });
    el.querySelectorAll('[data-sq-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const questId = btn.dataset.sqRemove;
        // Removing the task used to leave every copy sitting in workers'
        // lists, pointing at a task that no longer existed. Create the same
        // task again and they ended up holding two. So the copies nobody has
        // touched go with it — but anything submitted, awaiting review or
        // already approved stays, because that is work owed real points.
        let liveTargets = [], pendingIds = new Set();
        try{
          const [ts, ps] = await Promise.all([getTargets(), getPendingSubs()]);
          liveTargets = ts; pendingIds = pendingTargetIdSet(ps);
        }catch(e){
          alert('Could not check who is holding this task — nothing was removed. Try again.');
          return;
        }
        const held = liveTargets.filter(t => t.sideQuestId === questId);
        const worked = t => pendingIds.has(t.id) || !!t.everSubmitted || t.status === 'achieved';
        const untouched = held.filter(t => t.status === 'active' && !worked(t));
        const keeping = held.length - untouched.length;
        const n = untouched.length;
        if(!confirm('Remove this challenger task?\n\n'
          + (n ? `It will also disappear from ${n} worker${n===1?"'s":"s'"} list${n===1?'':'s'}, `
               + `where nothing has been submitted for it yet.\n` : 'Nobody is holding an untouched copy.\n')
          + (keeping ? `${keeping} cop${keeping===1?'y':'ies'} with work already submitted or approved will be kept.\n` : '')
          + '\nThis cannot be undone.')) return;
        if(n){
          const ok = await applyTargetDeltas({ removeIds: untouched.map(t=>t.id) });
          if(!ok){
            alert('Could not clear the copies from workers\' lists — the task was left in place. Try again.');
            return;
          }
        }
        await mutateSideQuests(list => {
          const gone = list.find(x=>x.id===questId);
          adminLog('Removed a challenger task', (gone && gone.title) || questId);
          return list.filter(x=>x.id!==questId);
        });
        drawSideQuestsList(page);
      };
    });
    el.querySelectorAll('[data-sq-edit]').forEach(btn=>{
      btn.onclick = async ()=>{
        const questId = btn.dataset.sqEdit;
        const all = await getSideQuests();
        const sq = all.find(x=>x.id===questId);
        const host = document.getElementById('sq-edit-form-'+questId);
        if(host.innerHTML){ host.innerHTML = ''; return; }
        const needsPhoto = sq.requiresPhoto !== false;
        const myRoles = sq.roles || [];
        const allRoles = await getRoles();
        host.innerHTML = `
          <div style="margin-top:8px;padding:10px;background:var(--paper);border-radius:8px;">
            <div class="field" style="margin-bottom:8px;"><input type="text" id="sq-edit-title-${questId}" value="${escapeHtml(sq.title)}"></div>
            <div class="field" style="margin-bottom:8px;"><input type="number" id="sq-edit-points-${questId}" value="${sq.points}" min="1"></div>
            <div class="field" style="margin-bottom:8px;"><label style="font-size:11px;">Deadline — date and time (blank = none)</label><input type="datetime-local" id="sq-edit-expiry-${questId}" value="${toLocalInputValue(sq.expiresAtFixed)}"></div>
            <div class="field" style="margin-bottom:8px;"><label style="font-size:11px;">Open to how many workers</label><input type="number" id="sq-edit-capacity-${questId}" value="${sq.capacity||1}" min="1"></div>
            <div class="field" style="margin-bottom:8px;">
              <label style="font-size:11px;">Applies to role(s)</label>
              <div id="sq-edit-roles-${questId}" style="display:flex;flex-wrap:wrap;gap:6px;">
                ${allRoles.map(r=>`
                  <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 8px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;">
                    <input type="checkbox" class="sq-edit-role-cb-${questId}" value="${escapeHtml(r)}" ${myRoles.includes(r)?'checked':''} style="width:13px;height:13px;accent-color:var(--ink);margin:0;">
                    ${escapeHtml(r)}
                  </label>`).join('')}
              </div>
            </div>
            <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:10px;cursor:pointer;">
              <input type="checkbox" id="sq-edit-photo-${questId}" ${needsPhoto?'checked':''} style="width:16px;height:16px;accent-color:var(--ink);margin:0;">
              Requires a proof photo on submission
            </label>
            <div class="help" style="font-size:11px;margin-bottom:10px;">Saving also updates anyone who's already accepted this but isn't approved yet — including submissions awaiting review. Already-approved copies keep their original points.</div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary btn-sm" data-sq-save="${questId}">Save Changes</button>
              <button class="btn btn-ghost btn-sm" data-sq-cancel="${questId}">Cancel</button>
            </div>
          </div>`;
        host.querySelector('[data-sq-save]').onclick = async function(){
          const newTitle = document.getElementById('sq-edit-title-'+questId).value.trim();
          const newPoints = parseInt(document.getElementById('sq-edit-points-'+questId).value, 10);
          const expiryRaw = document.getElementById('sq-edit-expiry-'+questId).value;
          const capacityRaw = document.getElementById('sq-edit-capacity-'+questId).value;
          const newCapacity = capacityRaw ? parseInt(capacityRaw, 10) : 1;
          const newRequiresPhoto = document.getElementById('sq-edit-photo-'+questId).checked;
          const newRoles = [...document.querySelectorAll('.sq-edit-role-cb-'+questId+':checked')].map(cb=>cb.value);
          if(!newTitle || !newPoints || newPoints<=0) return;
          if(!newCapacity || newCapacity<=0) return;
          const newExpiresAt = expiryRaw ? new Date(expiryRaw).toISOString() : null;
          if(expiryRaw && isNaN(new Date(expiryRaw).getTime())) return;
          this.disabled = true; this.textContent = 'Saving…';
          await mutateSideQuests(list => {
            const i = list.findIndex(x=>x.id===questId);
            if(i < 0) return false;
            Object.assign(list[i], { title:newTitle, points:newPoints,
              requiresPhoto:newRequiresPhoto, expiresAtFixed:newExpiresAt, expiryHours:null,
              roles:newRoles, capacity:newCapacity });
            adminLog('Edited a challenger task', newTitle + ' · ' + newPoints + ' pts');
            return list;
          });

          // Push the edit through to workers who've already accepted this
          // task but haven't been approved yet — including ones with a
          // submission still pending review. Already-approved copies are
          // deliberately left alone: those points are banked and rewriting
          // them after the fact would change history.
          const allTargets = await getTargets();
          const questFields = {};
          let propagated = 0;
          allTargets.forEach(t=>{
            if(t.sideQuestId===questId && t.status!=='achieved' && t.status!=='failed'){
              questFields[t.id] = {
                title: newTitle, points: newPoints, requiresPhoto: newRequiresPhoto,
                // Fixed deadline now, so everyone gets the same one — no need
                // to recompute per acceptance time.
                expiresAt: newExpiresAt
              };
              propagated++;
            }
          });

          // Pushing the deadline into the future revives anyone who was failed
          // by the old one — the usual reason for editing it is that the
          // deadline was wrong, and those workers shouldn't be left with a
          // fail for a mistake in the setup.
          let revived = 0;
          if(newExpiresAt && new Date(newExpiresAt).getTime() > Date.now()){
            allTargets.forEach(t=>{
              if(t.sideQuestId===questId && t.status==='failed'){
                questFields[t.id] = {
                  status: 'active', failedAt: null, failKind: null,
                  title: newTitle, points: newPoints,
                  requiresPhoto: newRequiresPhoto, expiresAt: newExpiresAt
                };
                revived++;
              }
            });
          }
          if(propagated>0 || revived>0) await applyTargetDeltas({ fieldChanges: questFields });

          // Clear the matching fail records so the revived task doesn't leave
          // a black mark on their profile.
          if(revived>0){
            try{
              const revivedWorkers = new Set(
                allTargets.filter(t=>t.sideQuestId===questId).map(t=>t.workerId)
              );
              const fails = await getFails();
              const kept = fails.filter(f=>
                !(f.type==='sidequest' && f.sideQuestId===questId && revivedWorkers.has(f.workerId))
              );
              if(kept.length !== fails.length) await setFailsAndCounts(kept);
            }catch(e){ console.error('Could not clear revived fails:', e); }
          }

          if(revived>0){
            alert(`Deadline updated.\n\n${revived} worker${revived===1?'' : 's'} who had been failed by the old deadline can now submit again, and the fail has been removed from their record.`);
          }

          drawSideQuestsList(page);
        };
        host.querySelector('[data-sq-cancel]').onclick = ()=>{ host.innerHTML = ''; };
      };
    });
  }

  // ---- Performance scores ----
  const K_SCORE_RANKS = 'perf-score-ranks';
  // Recompute every score and republish the ranking document. Called after
  // anything that changes the inputs — clearing fails, logging a quality
  // issue — so a worker's score corrects itself instead of waiting until the
  // Scores tab happens to be opened. Cheap: six small document reads.
  // Renders printable season reports. Uses the data the Scores tab already
  // has, plus the points ledger for the completed-work table — one extra
  // document read, only when a report is actually asked for.
  // The ledger is read once and kept for the session — generating a second
  // report, or the same one again, then costs nothing.
  // Did this person change position during the period the report covers?
  //
  // Two sources, because one of them only starts from today. A change made
  // from now on is recorded on the worker with its date. For anything
  // earlier there is no record at all — the role was overwritten — but the
  // tasks they were given still carry the template that produced them, and
  // a template belongs to a role. So a worker whose season holds tasks from
  // two different roles' libraries moved between them, even if nobody
  // wrote it down.
  //
  // The second kind has no date and is reported as such. Saying "the
  // figures below span two positions" without inventing a day for it is
  // more useful than saying nothing.
  function positionChanges(w, targets, templates){
    const recorded = (w.roleHistory || []).filter(h => h && h.from && h.to);
    const roleOf = {};
    (templates || []).forEach(t => { if(t && t.id) roleOf[t.id] = t.role; });
    const seen = new Set();
    (targets || []).forEach(t => {
      if(t.workerId !== w.id || !t.templateId) return;
      const r = roleOf[t.templateId];
      if(r) seen.add(r);
    });
    if(w.role) seen.add(w.role);
    return {
      recorded,
      // Only interesting when it disagrees with what the record already says.
      worked: Array.from(seen).sort(),
      changed: recorded.length > 0 || seen.size > 1
    };
  }

  // The four figures under Key figures come from four different places, and
  // three of them are records you can list. Rejections are the exception:
  // the score keeps a running count rather than trawling submissions, so the
  // rows have to be fetched. One query, only when a report is opened, and
  // kept for the session.
  //
  // undefined = not tried yet, null = tried and failed. The difference
  // matters: a failed read must say so rather than print an empty list and
  // let someone read it as "never rejected".
  let _reportRejections;
  async function getReportRejections(){
    if(_reportRejections !== undefined) return _reportRejections;
    try{
      const snap = await db.collection(SUBS_COLLECTION).where('status','==','rejected').get();
      _reportRejections = snap.docs.map(d=>d.data());
    }catch(e){
      console.error('Could not load rejected submissions for the report:', e);
      _reportRejections = null;
    }
    return _reportRejections;
  }

  // One of the four detail lists. Returns '' when there is nothing to show,
  // so a clean record simply has no section rather than an empty table.
  function repList(title, colour, rows, head3, note){
    if(rows === null){
      return `<div class="rep-sub-h" style="color:${colour};">${title}</div>
        <div class="rep-note">The detail could not be loaded. The figure in the tile still stands.</div>`;
    }
    if(!rows.length) return '';
    return `
      <div class="rep-sub-h" style="color:${colour};">${title} &middot; ${rows.length}</div>
      ${note ? `<div class="rep-note">${note}</div>` : ''}
      <table class="rep-tbl" style="margin-bottom:4px;">
        <thead><tr>
          <th>What</th>
          <th style="width:82px;">Date</th>
          <th class="n" style="width:84px;">${head3}</th>
        </tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${escapeHtml(r.what || '(no title recorded)')}${
            r.why ? `<div class="why">${escapeHtml(r.why)}</div>` : ''}</td>
          <td style="white-space:nowrap;">${escapeHtml(r.when || '—')}</td>
          <td class="n" style="white-space:nowrap;">${escapeHtml(r.extra || '—')}</td>
        </tr>`).join('')}</tbody>
      </table>`;
  }
  const taskKindLabel = t => t === 'weekly' ? 'Weekly task'
    : t === 'sidequest' ? 'Challenger task' : 'Daily task';
  const dayOf = iso => String(iso || '').slice(0, 10);

  let _reportLedger = null;
  async function openSeasonReport(rows, onlyWorkerId, ctx = {}){
    if(!_reportLedger) _reportLedger = await getLedger();
    const ledger = _reportLedger;
    const rejections = await getReportRejections();
    // Exactly the test scoreWorker uses, so a list can never disagree with
    // the tile above it about what falls inside the period.
    const inP = d => !ctx.cutoffDate || (d && d >= ctx.cutoffDate);
    const list = onlyWorkerId ? rows.filter(x=>x.w.id === onlyWorkerId) : rows;
    const rankOf = {}; rows.forEach((x,i)=>{ rankOf[x.w.id] = i+1; });
    const LBL = { reliability:'Reliability', quality:'Quality', challenger:'Challenger' };
    const barCol = v => v>=70 ? 'var(--green)' : v>=50 ? 'var(--amber)' : 'var(--red)';

    const pages = list.map(({w,r})=>{
      const b = scoreBand(r.score);
      const c = r.counts;
      const mine = ledger.filter(l=>l.workerId===w.id && l.type==='earned');
      const totalPts = mine.reduce((s,l)=>s+(l.points||0),0);
      const pos = positionChanges(w, ctx.targets, ctx.templates);

      // --- The four figures, itemised ---------------------------------
      // Challenger tasks are left out of both fail lists for the same
      // reason the tiles leave them out: they are judged by the Challenger
      // figure, not by reliability.
      const myFails = (ctx.fails || [])
        .filter(f => f.workerId === w.id && f.type !== 'sidequest'
          && inP(f.taskDate || dayOf(f.failedAt)))
        .sort((a,b)=> String(a.failedAt||'').localeCompare(String(b.failedAt||'')));
      const failRow = f => ({
        what: f.title,
        why: taskKindLabel(f.type) + (f.reason ? ' — ' + f.reason : ''),
        when: f.taskDate || dayOf(f.failedAt),
        extra: f.points ? f.points + ' pts' : '—'
      });
      const notSubmitted = myFails.filter(f => f.failKind !== 'rejected').map(failRow);
      const notFixed = myFails.filter(f => f.failKind === 'rejected').map(failRow);

      const myRejects = rejections === null ? null : rejections
        .filter(s => s.workerId === w.id)
        .sort((a,b)=> String(a.submittedAt||'').localeCompare(String(b.submittedAt||'')))
        .map(s => ({
          what: s.taskTitle,
          why: taskKindLabel(s.taskKind)
            + (s.reviewRemark ? ' — reviewer: ' + s.reviewRemark : ' — no reason was recorded')
            + (s.reviewedBy ? ' (' + s.reviewedBy + ')' : ''),
          when: dayOf(s.submittedAt),
          extra: s.reviewedAt ? dayOf(s.reviewedAt) : '—'
        }));
      // The tile is a running count, incremented as each review happens; the
      // list is the submissions still on file. They normally agree, and when
      // they do not it is worth saying which is which rather than leaving
      // someone to spot the difference themselves.
      const rejNote = (myRejects && myRejects.length !== c.rejected)
        ? `The tile reads ${c.rejected}. That is a running count kept as reviews happen, while this
           list is built from the submissions still on file — a submission removed since,
           or one rejected before this was recorded, shows in one and not the other.`
        : '';

      const myIssues = (ctx.issues || [])
        .filter(q => q.workerId === w.id && inP(q.taskDate || dayOf(q.loggedAt)))
        .sort((a,b)=> String(a.taskDate||'').localeCompare(String(b.taskDate||'')))
        .map(q => ({
          what: q.title,
          why: q.note || 'Approved at the time, found wrong afterwards',
          when: q.taskDate || dayOf(q.loggedAt),
          extra: q.foundOn || '—'
        }));

      const detail =
        repList('Not submitted', 'var(--red)', notSubmitted, 'Points missed',
          'Assigned and the deadline passed with nothing sent. Each one counts against reliability.')
        + repList('Rejected, unfixed', 'var(--amber-dark)', notFixed, 'Points missed',
          'Sent in, rejected at review, and the deadline passed before a corrected version arrived. '
          + 'Counted under quality, not reliability — the work was done, it was wrong. These usually '
          + 'appear in the next list as well: the rejection was counted when it happened, and this '
          + 'is the deadline passing with no fix. One event, two things worth knowing.')
        + repList('Rejected at review', 'var(--amber-dark)', myRejects, 'Reviewed',
          rejNote || 'Every submission turned back at review, including ones that were then fixed '
            + 'and approved. A rejection counts against quality even when the second attempt passed.')
        + repList('Quality issues found later', 'var(--red)', myIssues, 'Found on',
          'Work approved at the time that turned out to be wrong. Logged by hand, so this is only '
          + 'what someone recorded.');
      const nothingAgainst = detail === '' && rejections !== null;

      return `
      <div class="rep-page">
        <div class="rep-hero">
          <div>
            <div class="rep-who">${escapeHtml(w.name)}</div>
            <div class="rep-sub">${escapeHtml(w.role||'')}</div>
            <div class="rep-sub">Season performance report</div>
          </div>
          <div style="text-align:right;">

  async function recomputeAndPublishScores(){
    try{
      const [workers, targets, fails, archive, issues, stats] = await Promise.all([
        getWorkers(), getTargets(), getFails(), getTargetArchive(), getQualityIssues(), getSubStats()
      ]);
      const rows = workers
        .map(w=>({ w, r: scoreWorker(w.id, { targets, fails, stats, cutoffDate: null, archive, issues, modes: modesOf(workers) }) }))
        .filter(x=>x.r)
        .sort((a,b)=> (b.r.exact != null ? b.r.exact : b.r.score)
                    - (a.r.exact != null ? a.r.exact : a.r.score));
      if(rows.length) await publishScoreRanks(rows, 'season');
    }catch(e){ console.error('Could not refresh scores:', e); }
  }

  async function publishScoreRanks(rows, periodKey){
    try{
      const byWorker = {};
      rows.forEach((x,i)=>{
        byWorker[x.w.id] = { score: x.r.score, exact: x.r.exact, rank: i+1,
          parts: x.r.parts, counts: x.r.counts };
      });
      await saveDoc(K_SCORE_RANKS,
        { byWorker, total: rows.length, period: periodKey, updatedAt: new Date().toISOString() });
    }catch(e){ console.error('Could not publish score ranks:', e); }
  }
  async function getScoreRanks(){
    try{
      const doc = await db.collection('appdata').doc(K_SCORE_RANKS).get();
      return doc.exists ? doc.data().value : null;
    }catch(e){ return null; }
  }

  let scorePeriod = 'season';
  async function renderScores(){
    const el = document.getElementById('view-scores');
    el.innerHTML = `<div class="empty">Calculating…</div>`;
    const period = SCORE_PERIODS.find(p=>p.key===scorePeriod) || SCORE_PERIODS[0];
    const cutoffDate = period.days ? dateStrDaysAgoMY(period.days) : null;
    const cutoffISO = cutoffDate ? cutoffDate + 'T00:00:00.000Z' : '1970-01-01T00:00:00.000Z';

    // Five small document reads — the submission tallies are maintained as
    // work comes in, so nothing has to trawl the submission history.
    // Role templates come too, so the report can tell which role's library
    // a task came from and spot someone who changed position partway
    // through the season.
    const [workers, targets, fails, archive, issues, stats, roleTemplates] = await Promise.all([
      getWorkers(), getTargets(), getFails(), getTargetArchive(), getQualityIssues(), getSubStats(),
      getList(K_ROLE_TEMPLATES)
    ]);

    const rows = workers.map(w=>({ w, r: scoreWorker(w.id, { targets, fails, stats, cutoffDate, archive, issues, modes: modesOf(workers) }) }))
                        .filter(x=>x.r)
                        .sort((a,b)=> (b.r.exact != null ? b.r.exact : b.r.score)
                                    - (a.r.exact != null ? a.r.exact : a.r.score));

    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="eyebrow" style="margin:0;">Season to date</span>
        <span style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" id="sc-report-all" style="padding:3px 10px;">Report — all</button>
          <button class="btn btn-ghost btn-sm" id="sc-refresh" style="padding:3px 10px;">Refresh workers' scores</button>
        </span>
      </div>
      <div id="sc-refresh-msg" style="font-size:12px;margin-bottom:6px;"></div>
      <div class="help">Scored on rates, not totals, so having more tasks assigned doesn't inflate a score. Anyone with no activity in the period is left out rather than shown as zero.</div>
      ${rows.length === 0
        ? `<div class="card"><div class="empty">No activity in this period yet.</div></div>`
        : rows.map((x,i)=>{
            const b = scoreBand(x.r.score);
            const c = x.r.counts;
            const bar = (label, val) => val === null ? '' : `
              <div style="display:flex;align-items:center;gap:8px;margin-top:3px;">
                <span style="font-size:10px;color:var(--muted);width:74px;">${label}</span>
                <div style="flex:1;height:5px;background:var(--paper);border-radius:3px;overflow:hidden;">
                  <div style="height:100%;width:${Math.max(0,Math.min(100,val))}%;background:${val>=70?'var(--green)':val>=50?'var(--amber)':'var(--red)'};"></div>
                </div>
                <span style="font-size:10px;color:var(--muted);width:34px;text-align:right;">${partPct(val)}</span>
              </div>`;
            return `
            <div class="card" style="margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
                <div>
                  <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;">${i+1}. ${escapeHtml(x.w.name)}</div>
                  <div style="font-size:10.5px;color:var(--muted);">${escapeHtml(x.w.role||'')}</div>
                </div>
                <div style="text-align:right;">
                  <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:${b.color};">${scorePct(x.r.exact != null ? x.r.exact : x.r.score)}</div>
                  <div style="font-size:10px;color:${b.color};font-weight:600;">${b.label}</div>
                  <button class="btn btn-ghost btn-sm" data-report="${x.w.id}" style="padding:2px 8px;font-size:10px;margin-top:4px;">Report</button>
                </div>
              </div>
              <div style="margin-top:8px;">
                ${bar('Reliability', x.r.parts.reliability)}
                ${bar('Quality', x.r.parts.quality)}
                ${bar('Challenger', x.r.parts.challenger)}
              </div>
              <div style="font-size:10.5px;color:var(--muted);margin-top:8px;">
                ${c.dailyDone}/${c.dailyAssigned} daily &middot;
                ${c.challengerDone}/${c.challengerAccepted} challenger &middot;
                ${c.rejected} rejected${c.issues ? ` &middot; <span style="color:var(--red);">${c.issues} quality issue${c.issues===1?'':'s'}</span>` : ''} &middot; ${c.fails} not submitted${c.rejectedFails ? ` &middot; ${c.rejectedFails} rejected &amp; unfixed` : ''}
              </div>
            </div>`;
          }).join('')}
    `;
    // Publish so workers can see where they stand without each of them
    // recalculating the whole team.
    if(rows.length) publishScoreRanks(rows, scorePeriod);

    // fails, issues and the cutoff go through so the report can itemise the
    // four figures using exactly the records the score was calculated from,
    // rather than re-reading them and risking a list that disagrees with the
    // number above it.
    const reportCtx = { targets, templates: roleTemplates, fails, issues, cutoffDate };
    document.getElementById('sc-report-all').onclick = ()=> openSeasonReport(rows, null, reportCtx);
    el.querySelectorAll('[data-report]').forEach(btn=>{
      btn.onclick = ()=> openSeasonReport(rows, btn.dataset.report, reportCtx);
    });

    document.getElementById('sc-refresh').onclick = async function(){
      this.disabled = true; this.textContent = 'Refreshing…';
      const m = document.getElementById('sc-refresh-msg');
      await recomputeAndPublishScores();
      m.style.color = 'var(--green)';
      m.textContent = 'Workers will see the updated scores on their next load.';
      this.disabled = false; this.textContent = "Refresh workers' scores";
    };
  }

  // ---- Hell Mode: shared pieces ----
  // The stage track, drawn the same way for the admin and for the team, so
  // both are reading one picture of where the work has got to.
  function hellTrackHtml(issue){
    return `<div class="hell-track">${HELL_STAGES.map((label, i)=>{
      const cls = (issue.state === 'done' || i < (issue.stage||0)) ? 'done'
        : (issue.state === 'live' && i === issue.stage ? (issue.pending ? 'now waiting' : 'now') : '');
      return `<div class="hell-seg ${cls}"><div class="bar"></div>
        <div class="lbl">${escapeHtml(label)}</div></div>`;
    }).join('')}</div>`;
  }
  // How long it has been running. Past the window the speed bonus was set
  // for, the pill turns — the issue is still live, but it is costing.
  function hellDayFigHtml(issue){
    if(issue.state !== 'live') return '';
    const d = hellDayCount(issue);
    const win = Number(issue.bonusDays) || 0;
    return `<span class="hell-fig ${win && d > win ? 'hot' : ''}">Day <b>${d}</b>${win ? ` of ${win}` : ''}</span>`;
  }
  // Once people have joined, the pot on its own is misleading — show how it
  // actually lands on the day.
  function hellSplitFigHtml(issue){
    const n = hellJoiners(issue).length;
    if(!issue || issue.state !== 'live' || n === 0) return '';
    const base = hellSplit(issue.points, n);
    if(base.owner <= 0 && base.joiner <= 0) return '';
    return `<span class="hell-fig">owner <b>${base.owner}</b> &middot; each <b>${base.joiner}</b></span>`;
  }
  function hellRewardFigsHtml(issue){
    const pot = Number(issue.points) || 0;
    const out = [`<span class="hell-fig"><b>${pot}</b> pts${
      hellJoiners(issue).length ? ' pot' : ''}</span>`];
    if(Number(issue.bonusPoints) > 0 && Number(issue.bonusDays) > 0){
      out.push(`<span class="hell-fig">+<b>${issue.bonusPoints}</b> inside ${issue.bonusDays} days</span>`);
    }
    if(Number(issue.penalty) > 0){
      out.push(`<span class="hell-fig">&minus;<b>${issue.penalty}</b> if given up</span>`);
    }
    return out.join('');
  }
  function hellRosterHtml(issue, nameById){
    if(issue.state === 'open') return '';
    const owner = nameById[issue.ownerId] || 'Unknown';
    const helpers = hellJoiners(issue).map(id => nameById[id]).filter(Boolean);
    return `<div class="hell-roster">Owned by <b>${escapeHtml(owner)}</b>${
      helpers.length ? ` &middot; with ${helpers.map(n=>`<b>${escapeHtml(n)}</b>`).join(', ')}` : ''}</div>`;
  }
  // What happened last, in one line — the thing anyone opening the board
  // wants to know before they read anything else.
  function hellLastLineHtml(issue){
    const log = Array.isArray(issue.log) ? issue.log : [];
    const last = [...log].reverse().find(l => l.action === 'rejected' || l.action === 'failed');
    if(!last) return '';
    const when = new Date(last.at).toLocaleDateString();
    return `<div class="hell-note"><b>${last.action === 'failed' ? 'Given up' : 'Sent back'}</b> at ${
      escapeHtml(HELL_STAGES[last.stage] || '')} on ${when}${
      last.note ? ` — ${escapeHtml(last.note)}` : ''}</div>`;
  }

      fresh.push({ id: uid(), title, detail, department, points, penalty,
        bonusPoints: bonusDays ? bonusPoints : 0, bonusDays: bonusPoints ? bonusDays : 0,
        state:'open', stage:0, pending:false, ownerId:null, joiners:[],
        attempts:[], log:[], createdAt: new Date().toISOString(),
        createdBy: currentAdminName() });
      const ok = await setHellIssues(fresh);
      if(ok) adminLog('Put a Hell Mode issue on the board', title + ' · ' + points + ' pts');
      this.disabled = false; this.textContent = 'Put it on the board';
      if(ok) renderHellAdmin();
      else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };

    // Every action re-reads the list before writing, so two admins acting at
    // once cannot overwrite each other's decision.
    async function actOn(id, fn){
      const fresh = await getHellIssues();
      const issue = fresh.find(x => x.id === id);
      if(!issue) return renderHellAdmin();
      const result = await fn(issue, fresh);
      if(result === false) return;
      await setHellIssues(fresh);
      renderHellAdmin();
    }

    el.querySelectorAll('[data-happrove]').forEach(btn => btn.onclick = async function(){
      this.disabled = true; this.textContent = 'Approving…';
      await actOn(this.dataset.happrove, async (issue) => {
        const wasLast = issue.stage >= HELL_STAGES.length - 1;
        if(!hellApproveStage(issue)) return;
        if(wasLast){
          // Points go out the moment the last stage is approved. If the
          // ledger write fails the approval is rolled back, so nobody is
          // left marked solved and unpaid.
          const entries = hellAwardEntries(issue);
          const paid = entries.length === 0 || await appendLedger(entries);
          if(!paid){
            issue.state = 'live'; issue.pending = true; issue.completedAt = null;
            showFbError('Points could not be saved, so this approval was undone. Try again.');
            return false;
          }
        }
      });
    });

    el.querySelectorAll('[data-hreject]').forEach(btn => btn.onclick = async function(){
      const why = prompt('What needs to change before this stage passes?');
      if(why === null || !why.trim()) return;
      this.disabled = true;
      await actOn(this.dataset.hreject, async (issue) => { hellRejectStage(issue, why.trim()); });
    });

    el.querySelectorAll('[data-hdrop]').forEach(btn => btn.onclick = async function(){
      const [issueId, wid] = this.dataset.hdrop.split('|');
      const cur = issues.find(x => x.id === issueId);
      const left = hellJoiners(cur).length - 1;
      const after = hellSplit(cur && cur.points, left);
      if(!confirm(`Take ${nameById[wid] || 'them'} off this issue?\n\n`
        + `They keep nothing from it. The share becomes ${after.owner} pts for `
        + `${nameById[cur && cur.ownerId] || 'the owner'}`
        + (left ? ` and ${after.joiner} each for the ${left} left.` : ', who is then on it alone.')
      )) return;
      this.disabled = true; this.textContent = 'Removing…';
      await actOn(issueId, (i)=> hellRemoveJoiner(i, wid));
      adminLog('Took someone off a Hell Mode issue',
        (nameById[wid] || wid) + ' · ' + ((cur && cur.title) || ''));
    });
    el.querySelectorAll('[data-hdeclineadm]').forEach(btn => btn.onclick = async function(){
      const [issueId, wid] = this.dataset.hdeclineadm.split('|');
      this.disabled = true; this.textContent = 'Withdrawing…';
      // No `byId`, so the owner check is skipped: an admin can clear a
      // request the owner has left sitting.
      await actOn(issueId, (i)=> hellDeclineApplicant(i, wid));
    });
    el.querySelectorAll('[data-hfail]').forEach(btn => btn.onclick = async function(){
      const issueId = this.dataset.hfail;
      const cur = issues.find(x => x.id === issueId);
      const pen = Number(cur && cur.penalty) || 0;
      if(!confirm(`Fail this issue? ${nameById[cur.ownerId] || 'The owner'} loses it${
        pen ? ` and ${pen} points` : ''}, and it goes back on the board for someone else.`)) return;
      const why = prompt('Why is it being failed? The team will see this.');
      if(why === null || !why.trim()) return;
      this.disabled = true;
      await actOn(issueId, async (issue) => {
        const ownerId = issue.ownerId;
        const penalties = hellPenaltyEntries(issue, ownerId);
        if(!hellFailIssue(issue, why.trim())) return false;
        if(penalties.length) await appendLedger(penalties);
      });
    });

    el.querySelectorAll('[data-hremove]').forEach(btn => btn.onclick = async function(){
      if(!confirm('Take this issue off the board? Its history goes with it.')) return;
      this.disabled = true;
      const fresh = await getHellIssues();
      await setHellIssues(fresh.filter(x => x.id !== this.dataset.hremove));
      renderHellAdmin();
    });
  }

      }catch(e){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Could not finish: ' + e.message;
      }
      this.disabled = false; this.textContent = 'Move proof photos out of submissions';
    };

    document.getElementById('r-rebuild-stats').onclick = async function(){
      this.disabled = true; this.textContent = 'Recounting…';
      const msg = document.getElementById('r-rebuild-stats-msg');
      try{
        const st = await rebuildSubStats();
        msg.style.color = 'var(--green)';
        msg.textContent = `Recounted for ${Object.keys(st.byWorker).length} worker(s).`;
      }catch(e){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Recount failed: ' + e.message;
      }
      this.disabled = false; this.textContent = 'Recount submission statistics';
    };

    document.getElementById('r-rebuild').onclick = async function(){
      this.disabled = true; this.textContent = 'Rebuilding…';
      const msg = document.getElementById('r-rebuild-msg');
      try{
        const t = await rebuildTotals();
        msg.style.color = 'var(--green)';
        msg.textContent = `Rebuilt from ${t.entryCount} ledger entries across ${Object.keys(t.byWorker).length} worker(s).`;
      }catch(e){
        msg.style.color = 'var(--red)';
        msg.textContent = 'Rebuild failed: ' + e.message;
      }
      this.disabled = false; this.textContent = 'Rebuild totals from ledger';
    };

    document.getElementById('ah-save').onclick = async function(){
      const msg = document.getElementById('ah-set-msg');
      const pts = parseInt(document.getElementById('ah-pts').value, 10);
      const cap = parseInt(document.getElementById('ah-cap').value, 10);
      msg.style.color = 'var(--red)';
      if(!Number.isFinite(pts) || pts < 1){ msg.textContent = 'Points must be at least 1.'; return; }
      if(!Number.isFinite(cap) || cap < 1){ msg.textContent = 'The weekly cap must be at least 1.'; return; }
      this.disabled = true; this.textContent = 'Saving…';
      // Re-read first: these two live in the same document as the admin
      // password and the owner name, and writing a stale copy back would
      // undo whatever else changed since this tab loaded.
      const fresh = await getSettings();
      const ok = await setSettings({ ...fresh, afterHoursPoints: pts, afterHoursWeeklyCap: cap });
      this.disabled = false; this.textContent = 'Save';
      if(ok){
        msg.style.color = 'var(--green)';
        msg.textContent = `Saved — ${pts} pts each, up to ${cap} a week.`;
        adminLog('Changed after-hours recognition', pts + ' pts, cap ' + cap, 'change');
      }else{
        msg.textContent = 'Could not save — try again.';
      }
    };
    document.getElementById('c-add').onclick = async function(){
      const name = document.getElementById('c-name').value.trim();
      const cost = parseInt(document.getElementById('c-cost').value, 10);
      const msg = document.getElementById('c-msg');
      if(!name || !cost || cost<=0){ msg.style.color='var(--red)'; msg.textContent='Please fill in a reward name and valid points cost.'; return; }
      this.disabled = true; this.textContent = 'Adding…';
      const cat = await getCatalog();
      cat.push({id: uid(), name, pointsCost: cost, createdAt: todayStr()});
      const ok = await setList(K_CATALOG, cat);
      this.disabled = false; this.textContent = 'Add to Catalog';
      if(ok){
        document.getElementById('c-name').value=''; document.getElementById('c-cost').value='';
        msg.style.color='var(--green)'; msg.textContent='Added to catalog.';
        renderRewards();
      } else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };
    drawCatalogList(catalog);

    const quickpick = document.getElementById('r-quickpick');
    if(quickpick){
      quickpick.onchange = ()=>{
        const opt = quickpick.selectedOptions[0];
        if(opt && opt.value){
          document.getElementById('r-prize').value = opt.dataset.name;
          document.getElementById('r-cost').value = opt.dataset.cost;
        }
      };
    }

    document.getElementById('r-redeem').onclick = async function(){
      const workerId = document.getElementById('r-worker').value;
      const prize = document.getElementById('r-prize').value.trim();
      const cost = parseInt(document.getElementById('r-cost').value, 10);
      const msg = document.getElementById('r-msg');
      if(!prize || !cost || cost<=0){ msg.style.color='var(--red)'; msg.textContent='Please fill in a prize name and valid points cost.'; return; }
      const tot = await getTotalsEnsured();
      const bal = tot ? ((tot.byWorker[workerId]||{}).balance || 0) : balanceFor(await getLedger(), workerId);
      if(cost > bal){ msg.style.color='var(--red)'; msg.textContent=`Not enough balance (has ${bal} pts).`; return; }
      this.disabled = true; this.textContent = 'Saving…';
      const ok = await appendLedger([{id: uid(), workerId, type:'redeemed', points: cost, note: prize, date: todayStr()}]);
      this.disabled = false; this.textContent = 'Record Redemption';
      if(ok){
        document.getElementById('r-prize').value=''; document.getElementById('r-cost').value='';
        msg.style.color='var(--green)'; msg.textContent='Redemption recorded.';
        drawLedgerList(document.getElementById('r-filter').value, workers);
      } else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };
    document.getElementById('r-filter').onchange = (e)=> drawLedgerList(e.target.value, workers);
    await drawLedgerList('all', workers);
  }
  function drawCatalogList(catalog){
    const el = document.getElementById('c-list');
    if(!el) return;
    if(catalog.length===0){ el.innerHTML = `<div class="help" style="margin-bottom:0;">No rewards added yet.</div>`; return; }
    el.innerHTML = catalog.map(c=>`
      <div class="ledger-row">
        <div class="ledger-note">${escapeHtml(c.name)}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="target-pts">${c.pointsCost} pts</span>
          <button class="btn btn-ghost btn-sm" data-cat-remove="${c.id}" style="padding:4px 9px;">Remove</button>
        </div>
      </div>`).join('');
    el.querySelectorAll('[data-cat-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const cat = await getCatalog();
        await setList(K_CATALOG, cat.filter(x=>x.id!==btn.dataset.catRemove));
        renderRewards();
      };
    });
  }

  // ---- Shared list pagination ----
  // Long admin lists (ledger, activity log, challenger tasks) render 50 rows at
  // a time. Everything stays in memory — this only limits what's drawn, so
  // paging is instant and doesn't re-hit Firestore.
  const PAGE_SIZE = 50;
  function pagerHtml(page, total){
    if(total <= PAGE_SIZE) return '';
    const pages = Math.ceil(total / PAGE_SIZE);
    const from = page * PAGE_SIZE + 1;
    const to = Math.min(total, (page + 1) * PAGE_SIZE);
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;">
        <button class="btn btn-ghost btn-sm" data-pager="prev" ${page === 0 ? 'disabled' : ''}>&lsaquo; Prev</button>
        <span style="font-size:11.5px;color:var(--muted);">${from}–${to} of ${total} &middot; page ${page + 1} of ${pages}</span>
        <button class="btn btn-ghost btn-sm" data-pager="next" ${page >= pages - 1 ? 'disabled' : ''}>Next &rsaquo;</button>
      </div>`;
  }
  function wirePager(scopeEl, page, total, go){
    if(!scopeEl) return;
    const pages = Math.ceil(total / PAGE_SIZE);
    const prev = scopeEl.querySelector('[data-pager="prev"]');
    const next = scopeEl.querySelector('[data-pager="next"]');
    if(prev) prev.onclick = ()=>{ if(page > 0) go(page - 1); };
    if(next) next.onclick = ()=>{ if(page < pages - 1) go(page + 1); };
  }

  async function drawLedgerList(filterId, workers, page){
    page = page || 0;
    const listEl = document.getElementById('r-list');
    const ledger = await getLedger();
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    const filtered = filterId==='all' ? ledger : ledger.filter(l=>l.workerId===filterId);
    const sorted = filtered.slice().sort((a,b)=> b.date.localeCompare(a.date));
    if(sorted.length===0){ listEl.innerHTML = `<div class="card"><div class="empty">No ledger entries yet.</div></div>`; return; }
    const pageRows = sorted.slice(page*PAGE_SIZE, (page+1)*PAGE_SIZE);
    listEl.innerHTML = `<div class="card">` + pageRows.map(l=>{
      const w = workerMap[l.workerId];
      return `<div class="ledger-row"><div><div class="ledger-note">${escapeHtml(l.note)} ${filterId==='all'&&w?'&middot; <strong>'+escapeHtml(w.name)+'</strong>':''}</div>
        <div class="ledger-date">${l.date}</div></div>
        <div class="ledger-pts ${l.type==='earned'?'pts-earn':'pts-redeem'}">${l.type==='earned'?'+':'-'}${l.points}</div></div>`;
    }).join('') + `</div>` + pagerHtml(page, sorted.length);
    wirePager(listEl, page, sorted.length, p => drawLedgerList(filterId, workers, p));
  }

})();
</script>
</body>
</html>
