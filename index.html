  // A worker clearing their own. Re-read first so two people clearing at
  // the same moment cannot wipe each other's tick off the record.
  async function clearAnnouncementFor(id, workerId, workerName){
    try{
      const ref = db.collection(ANN_COLLECTION).doc(id);
      const doc = await ref.get();
      if(!doc.exists) return false;
      const cur = doc.data();
      const by = Object.assign({}, annClearedBy(cur));
      if(by[workerId]) return true;                       // already done
      by[workerId] = new Date().toISOString();
      const next = Object.assign({}, cur, { clearedBy: by });
      const patch = {
        clearedBy: by,
        // Stamped so the office screen can say who just cleared what, even
        // though the record itself is about to drop off the live list.
        lastClearedBy: workerName || workerId,
        lastClearedAt: by[workerId]
      };
      if(annAllCleared(next)) patch.clearedAt = by[workerId];
      await ref.update(patch);
      return true;
    }catch(e){
      showFbError('Could not clear that: ' + e.message);
      return false;
    }
  }
  // What the admin screen lists: everything recent that they have not
  // removed, finished ones included. Filtering on clearedAt here, the way
  // the board does, would make a reminder vanish from the admin's screen at
  // the exact moment it was completed — which is the moment they most want
  // to see it.
  async function getAdminAnnouncements(){
    const cutoff = new Date(Date.now() - ANN_ADMIN_HOURS * 3600 * 1000).toISOString();
    try{
      const snap = await db.collection(ANN_COLLECTION).where('at','>=', cutoff).get();
      return snap.docs.map(d=>d.data())
        .filter(a => !a.dismissedAt)
        .sort((a,b)=> String(b.at).localeCompare(String(a.at)));
    }catch(e){ console.error('Could not read reminders:', e); return []; }
  }
  // The board stays open all day, so it listens rather than polls: one read
  // per change instead of a read every few seconds against the daily quota.
  //
  // It deliberately does NOT filter on clearedAt. The board has to announce
  // the moment someone clears their reminder, and a query for uncleared ones
  // would drop the record at exactly that moment — the event would vanish
  // instead of being shown. It is bounded by age instead, and what counts as
  // live is worked out here.
  function watchAnnouncements(cb){
    const cutoff = new Date(Date.now() - ANN_LIFE_HOURS * 3600 * 1000).toISOString();
    try{
      return db.collection(ANN_COLLECTION).where('at','>=', cutoff)
        .onSnapshot(snap => {
          cb(snap.docs.map(d=>d.data())
            .sort((a,b)=> String(b.at).localeCompare(String(a.at))));
        }, err => console.error('Reminder listener error:', err));
    }catch(e){ console.error('Could not watch reminders:', e); return () => {}; }
  }
  // Reminders still waiting on this particular worker.
  async function getMyReminders(workerId){
    try{
      const snap = await db.collection(ANN_COLLECTION).where('clearedAt','==',null).get();
      return snap.docs.map(d=>d.data())
        .filter(a => annOutstandingFor(a, workerId))
        .sort((a,b)=> String(b.at).localeCompare(String(a.at)));
    }catch(e){ console.error('Could not read reminders:', e); return []; }
  }

  const SUBS_COLLECTION = 'perf_submissions_docs';
  let subsMigrated = false;
  async function migrateOldSubs(){
    try{
      const oldDoc = await db.collection('appdata').doc('perf-submissions').get();
      if(!oldDoc.exists) return;
      const oldList = oldDoc.data().value || [];
      if(oldList.length === 0) return;
      for(const sub of oldList){
        await db.collection(SUBS_COLLECTION).doc(sub.id).set(sub);
      }
      // Clear the old array so this migration only ever copies each submission once.
      cacheDrop('perf-submissions');
      await db.collection('appdata').doc('perf-submissions')
        .set({ value: [], migrated: true });
    }catch(e){
      console.error('Submission migration failed (will retry next load):', e);
    }
  }
  // Most places that use submissions only need pending ones (to check what's
  // awaiting review) or one worker's own (to show their status). Reading the
  // WHOLE collection for those wastes reads that scale with every submission
  // ever created — these scoped queries fetch only what's actually needed.
  // Cursor-paged read for the admin Log. Fetches one page at a time instead
  // of pulling 500 submissions (each carrying an embedded photo) on every
  // visit. Ordered by submittedAt only — deliberately no where() clause, so
  // Every target a pending submission is standing behind.
  //
  // A Do list day is ONE submission covering several jobs: it leaves targetId
  // empty and puts the real ids in targetIds. Code that read targetId alone
  // could not see those jobs at all, so a day still waiting for its head
  // looked to the 5am sweep exactly like work nobody had sent up — it failed
  // all of them and the cleanup deleted them, leaving the head a day whose
  // jobs were "no longer on file". That was written out by hand in four
  // places and only had to be missed in one. It is written once now.
  function pendingTargetIdSet(subs){
    const ids = new Set();
    (subs || []).forEach(s => {
      if(!s || (s.status && s.status !== 'pending')) return;
      if(s.targetId) ids.add(s.targetId);
      (s.targetIds || []).forEach(id => { if(id) ids.add(id); });
    });
    return ids;
  }
  // it never needs a composite index doing setup in the Firestore console.
  const LOG_PAGE_SIZE = 50;
  async function getSubsPage(afterDoc){
    if(!subsMigrated){ await migrateOldSubs(); subsMigrated = true; }
    try{
      let q = db.collection(SUBS_COLLECTION).orderBy('submittedAt', 'desc');
      if(afterDoc) q = q.startAfter(afterDoc);
      const snap = await q.limit(LOG_PAGE_SIZE).get();
      return {
        rows: snap.docs.map(d=>d.data()),
        lastDoc: snap.docs.length ? snap.docs[snap.docs.length-1] : null,
        done: snap.docs.length < LOG_PAGE_SIZE
      };
    }catch(e){
      showFbError('Could not load submissions: ' + e.message);
      return { rows: [], lastDoc: null, done: true };
    }
  }

  async function getPendingSubs(){
    if(!subsMigrated){ await migrateOldSubs(); subsMigrated = true; }
    try{
      const snap = await db.collection(SUBS_COLLECTION).where('status','==','pending').get();
      return snap.docs.map(d=>d.data());
    }catch(e){
      showFbError('Could not load data from Firebase: ' + e.message);
      return [];
    }
  }
  // Strict counterpart of getPendingSubs — throws instead of swallowing the
  // error, for callers (generateDailyTargets) where a failed read must not
  // be mistaken for "no pending submissions".
  async function getPendingSubsStrict(){
    if(!subsMigrated){ await migrateOldSubs(); subsMigrated = true; }
    const snap = await db.collection(SUBS_COLLECTION).where('status','==','pending').get();
    return snap.docs.map(d=>d.data());
  }
  // Fetches only the submissions attached to a specific set of targets. The
  // worker dashboard only ever looks up submissions for targets currently in
  // their list, so pulling their entire submission history — every one
  // carrying an embedded photo — was downloading a lot of data to never show
  // it. Firestore caps an `in` query at 30 values, hence the chunking.
  async function getSubsForTargets(targetIds){
    if(!subsMigrated){ await migrateOldSubs(); subsMigrated = true; }
    if(!targetIds.length) return [];
    const chunks = [];
    for(let i=0; i<targetIds.length; i+=30) chunks.push(targetIds.slice(i, i+30));
    try{
      const snaps = await Promise.all(chunks.map(ids =>
        db.collection(SUBS_COLLECTION).where('targetId','in',ids).get()
      ));
      return snaps.flatMap(snap => snap.docs.map(d=>d.data()));
    }catch(e){
      showFbError('Could not load your submissions: ' + e.message);
      return [];
    }
  }

  // Proof photos are large base64 blobs. Kept on the submission document they
  // were downloaded by every screen that reads submissions — including
  // scoring, which never shows them. They now live in their own collection
  // and are fetched only when a photo is actually displayed.
  const SUB_PHOTOS = 'perf_submission_photos';
  // A photo lives in its own document, keyed by the id of the submission it
  // belongs to. Deleting the submission therefore leaves the photo behind,
  // referenced by nothing and findable by nothing — and a season reset
  // deletes every submission at once. Every reset was quietly abandoning a
  // season's worth of photographs inside the free gigabyte.
  //
  // Deleting by id costs no reads: the ids come from the submissions that
  // are being removed anyway, so nothing has to download a photo to find
  // out it should go.
  //
  // Chunked because a season is thousands of documents and firing thousands
  // of parallel deletes at Firestore from a phone does not end well. Never
  // throws: a photo that outlives its submission is waste, but a reset that
  // half-finished because a photo delete failed is damage.
  async function dropSubPhotos(ids){
    const list = (ids || []).filter(Boolean);
    for(let i = 0; i < list.length; i += 100){
      await Promise.all(list.slice(i, i + 100).map(id =>
        db.collection(SUB_PHOTOS).doc(id).delete().catch(()=>{})));
    }
    return list.length;
  }
  // Renders a slot that loads its photo after the list is on screen, so a
  // review queue appears instantly instead of waiting on every image.
  // datetime-local needs 'YYYY-MM-DDTHH:MM' in local time, not an ISO string.
  function toLocalInputValue(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  // A quest's deadline, whichever way it was set up.
  function questDeadlineLabel(sq){
    if(sq.expiresAtFixed) return `due ${new Date(sq.expiresAtFixed).toLocaleString()}`;
    if(sq.expiryHours) return `expires ${sq.expiryHours}h after accepted`;
    return 'no deadline';
  }

  // 'expired' = never submitted. 'rejected' = submitted in time but knocked
  // back and not fixed before the deadline. Older records have neither.
  function failKindLabel(kind){
    if(kind === 'rejected') return 'Failed — rejected';
    if(kind === 'expired')  return 'Failed — not submitted';
    return 'Failed';
  }

  function lazyPhotoSlot(sub, cls){
    if(!sub.hasPhoto && !sub.photo) return null;
    // Legacy submission with the image still on the document — show it now,
    // there's nothing to fetch.
    if(sub.photo){
      return `<img class="${cls}" src="${sub.photo}" data-lightbox="${sub.photo}" style="margin-top:10px;">`;
    }
    return `<div class="sub-photo-slot" data-photo-for="${sub.id}" data-cls="${cls}"
      style="margin-top:10px;font-size:11.5px;color:var(--muted);">Loading photo…</div>`;
  }
  async function fillLazyPhotos(scopeEl){
    if(!scopeEl) return;
    const wireLightbox = ()=> scopeEl.querySelectorAll('[data-lightbox]').forEach(img=>{
      img.onclick = ()=> openLightbox(img.dataset.lightbox);
    });
    const slots = [...scopeEl.querySelectorAll('[data-photo-for]')];
    // Legacy photos render inline with no slot to fill — they still need
    // their click handler.
    if(slots.length === 0){ wireLightbox(); return; }
    // Fetched in parallel batches. Doing these one at a time meant each photo
    // waited for the one before it — with a queue of submissions that added up
    // to a long, visibly slow load. Batched rather than all-at-once so a big
    // backlog doesn't fire hundreds of simultaneous requests.
    const BATCH = 6;
    for(let i = 0; i < slots.length; i += BATCH){
      const group = slots.slice(i, i + BATCH);
      await Promise.all(group.map(async slot=>{
        const id = slot.dataset.photoFor;
        const photo = await getSubPhoto(id);
        if(!slot.parentNode) return;                 // list re-rendered meanwhile
        if(photo){
          slot.outerHTML = `<img class="${slot.dataset.cls}" src="${photo}" data-lightbox="${photo}" style="margin-top:10px;">`;
        }else{
          slot.textContent = 'Photo not found — run "Move proof photos out of submissions" in Rewards';
        }
      }));
    }
    scopeEl.querySelectorAll('[data-lightbox]').forEach(img=>{
      img.onclick = ()=> openLightbox(img.dataset.lightbox);
    });
  }
  async function getSubPhoto(subId){
    try{
      const doc = await db.collection(SUB_PHOTOS).doc(subId).get();
      return doc.exists ? (doc.data().photo || null) : null;
    }catch(e){ console.error('getSubPhoto failed:', e); return null; }
  }
  // opts.skipStats — set when this is a retry of a submission that already
  // counted. The submission document is keyed by a stable id so a retry
  // replaces it rather than duplicating it, but the running tallies are
  // increments and would otherwise count the same submission twice.
  async function addSub(sub, opts = {}){
    try{
      const { photo, ...meta } = sub;
      meta.hasPhoto = !!photo;
      // The task title is copied onto the submission. Looking it up from the
      // target later fails once that target is gone, which is why older log
      // entries show no name.
      if((!meta.taskTitle || !meta.taskKind || meta.templateId === undefined) && meta.targetId){
        try{
          const tg = (await getTargets()).find(x=>x.id === meta.targetId);
          if(tg){
            if(!meta.taskTitle){ meta.taskTitle = tg.title; meta.taskPoints = tg.points; }
            // Recorded so promptness can tell a daily task, which really is
            // closing at 5am tomorrow, from a weekly or challenger one that is not.
            meta.taskKind = tg.sideQuestId ? 'sidequest' : (tg.isWeekly ? 'weekly' : 'daily');
            // Copied so this submission can still say which task it was for
            // after that target is gone. Without it the only clue left is the
            // title, and a worker whose target was deleted mid-submission was
            // failed for work they had actually sent up.
            if(meta.templateId === undefined) meta.templateId = tg.templateId || null;
          }
        }catch(e){ /* not worth failing the submission over */ }
      }
      if(meta.templateId === undefined) meta.templateId = null;   // Firestore rejects undefined
      if(photo) await db.collection(SUB_PHOTOS).doc(sub.id).set({ photo });
      await db.collection(SUBS_COLLECTION).doc(sub.id).set(meta);
      // Same rule as the review side: an after-hours entry is recognition and
      // leaves no mark on the submission tallies the score is built from.
      if(!opts.skipStats && !isAfterHoursSubId(sub.id)){
        const ps = promptScoreFor(sub.submittedAt, meta.taskKind);
        bumpSubStats(sub.workerId, ps === null
          ? { subs: 1 }
          : { subs: 1, promptSum: ps, promptCount: 1 });
      }
      return { ok: true };
    }catch(e){
      showFbError('Could not save to Firebase: ' + e.message);
      return { ok: false, error: (e.code ? e.code + ' — ' : '') + e.message };
    }
  }
  // knownWorkerId lets callers that already have it skip a lookup.
  async function updateSub(id, changes, knownWorkerId){
    try{
      // Stamped here rather than at each call site. There are four routes to
      // a review — the Review tab, the head panel, and two inside
      // approveTarget — and stamping each one is how one of them gets
      // missed. In the worker portal a head is doing the reviewing and
      // there is no admin signed in, so their own name is the right answer.
      if((changes.status === 'approved' || changes.status === 'rejected')
         && changes.reviewedBy === undefined){
        changes = Object.assign({}, changes, {
          reviewedBy: currentAdminName() || (REVIEWING_HEAD && REVIEWING_HEAD.name) || '' });
        adminLog(changes.status === 'approved' ? 'Approved a submission' : 'Rejected a submission',
          changes.reviewRemark || '', 'review');
      }
      await db.collection(SUBS_COLLECTION).doc(id).update(changes);
      // Keep the running tallies in step when a submission is reviewed.
      if(changes.status === 'approved' || changes.status === 'rejected'){
        try{
          let wid = knownWorkerId || null;
          if(!wid){
            const doc = await db.collection(SUBS_COLLECTION).doc(id).get();
            wid = doc.exists ? doc.data().workerId : null;
          }
          // After-hours entries are recognition, not measured work: they must
          // not move Quality, in either direction. Decided from the id rather
          // than from a flag each caller remembers to pass, because there are
          // six routes to a review and passing it at five of them is the bug.
          if(wid && !isAfterHoursSubId(id)){
            bumpSubStats(wid, changes.status === 'rejected'
              ? { reviewed: 1, rejected: 1 }
              : { reviewed: 1 });
          }
        }catch(e){ console.error('Could not update review stats:', e); }
      }
      return true;
    }catch(e){
      showFbError('Could not save to Firebase: ' + e.message);
      return false;
    }
  }

  async function getWorkers(){ return getList(K_WORKERS); }
  async function getTargets(){ return getList(K_TARGETS); }

  // All targets live in one document, so a plain read-modify-write can clobber
  // a change someone else made in between — an approval being overwritten by a
  // page that started generating before it happened, for example. This applies
  // a set of deltas inside a transaction against whatever is current, instead
  // of overwriting the array wholesale.
  //   removeIds     – target ids to drop
  //   statusChanges – { id: { status, failedAt?, achievedAt? } }
  //   fieldChanges  – { id: { ...fields to merge } }
  //   add           – new target objects to append
  // `skipped` is an optional array the caller can pass in to be told which
  // of its `add` entries were dropped as duplicates. The transaction itself
  // still succeeds, so without this a caller cannot tell "added" from
  // "silently discarded" — which is how five revived tasks became one.
  async function applyTargetDeltas({ removeIds = [], statusChanges = {}, fieldChanges = {}, add = [], skipped = null }){
    const ref = db.collection('appdata').doc(K_TARGETS);
    cacheDrop(K_TARGETS);   // written below by transaction, not saveDoc
    const rm = new Set(removeIds);
    try{
      await db.runTransaction(async tx => {
        const doc = await tx.get(ref);
        const current = doc.exists ? (doc.data().value || []) : [];
        const kept = current.filter(t => !rm.has(t.id)).map(t => {
          let out = t;
          if(statusChanges[t.id]) out = { ...out, ...statusChanges[t.id] };
          if(fieldChanges[t.id]) out = { ...out, ...fieldChanges[t.id] };
          return out;
        });
        const existingIds = new Set(kept.map(t => t.id));
        // Guard on what the task IS, not just its id. Two devices generating
        // at the same moment each mint a fresh id, so an id-only check let
        // both through and the worker saw the same task twice.
        //
        // Only tasks that came from a template get this treatment. A revived
        // or one-off task is deliberately detached (templateId: null), and
        // keying those the same way put every one of them under the same
        // 'd|worker|null|today' — so reviving five tasks for one person on
        // one day kept the first and silently discarded the other four,
        // while the fail records were cleared as though it had worked.
        // Nothing generates these in parallel: each is minted once, by hand,
        // with its own id, so the id check above is the right guard for them.
        const identity = t =>
          t.isDaily   ? (t.templateId ? 'd|' + t.workerId + '|' + t.templateId + '|' + t.createdAt : null) :
          t.isWeekly  ? (t.templateId ? 'w|' + t.workerId + '|' + t.templateId + '|' + t.weekOf : null) :
          t.sideQuestId ? 'q|' + t.workerId + '|' + t.sideQuestId : null;
        const existingKeys = new Set(kept.map(identity).filter(Boolean));
        // Rebuilt per attempt: a transaction can be retried, and a list left
        // over from a previous attempt would report the same skip twice.
        const skippedNow = [];
        add.forEach(t => {
          if(existingIds.has(t.id)){ skippedNow.push(t.id); return; }
          const k = identity(t);
          if(k && existingKeys.has(k)){ skippedNow.push(t.id); return; }   // already has this one
          if(k) existingKeys.add(k);
          kept.push(t);
        });
        if(skipped){ skipped.length = 0; skippedNow.forEach(id => skipped.push(id)); }
        tx.set(ref, { value: kept });
      });
      cacheDrop(K_TARGETS);
      return true;
    }catch(e){
      showFbError('Could not save target changes: ' + e.message);
      return false;
    }
  }
  function dateStrDaysAgoMY(n){
    const d = new Date();
    d.setDate(d.getDate() - n);
    return fmtDateInTZ(d, 'Asia/Kuala_Lumpur');
  }

  // ---- Completed-target archive ----
  // Unlike points and fails, targets can't be summarised away: the daily
  // generator reads the whole list on every load, so a cache alongside it
  // saves nothing. The array itself has to stay small.
  //
  // Achieved targets are never read again except to count them, so once
  // they're old enough they're rolled into per-worker counts and dropped from
  // the live array. Everything that counts achievements adds the archive back
  // in, so totals and badges are unaffected.
  const K_TARGET_ARCHIVE = 'perf-target-archive';
  const ARCHIVE_AFTER_DAYS = 30;
  async function getTargetArchive(){
    try{
      const doc = await db.collection('appdata').doc(K_TARGET_ARCHIVE).get();
      const v = doc.exists ? doc.data().value : null;
      return (v && v.byWorker) ? v : { byWorker:{}, archivedCount:0 };
    }catch(e){
      console.error('Target archive unavailable:', e);
      return { byWorker:{}, archivedCount:0 };
    }
  }
  function archiveCountFor(archive, workerId, key){
    const e = archive && archive.byWorker ? archive.byWorker[workerId] : null;
    return e ? (e[key] || 0) : 0;
  }
  // Marks a target as having had at least one submission — protects it from
  // ever auto-failing later, even if that submission gets rejected. Without
  // this, a worker who submitted before the deadline but got rejected close
  // to (or after) the cutoff, with no time to fix and resubmit, would still
  // get an automatic fail despite having genuinely attempted the task in time.
  // Re-reads a target's CURRENT state straight from Firestore right before a
  // submission is saved. The worker's dashboard is a snapshot from whenever it
  // last rendered — if they leave the page open while an admin approves their
  // work (or they submit from two devices), the stale page would happily send
  // a second submission for an already-finished task. Returns null if the
  // submission is fine, or a reason string if it should be blocked.
  async function blockSubmissionReason(targetId){
    try{
      const targets = await getTargets();
      const t = targets.find(x=>x.id===targetId);
      if(!t) return 'That task no longer exists — refreshing your list.';
      if(t.status === 'achieved') return 'This task was already approved — nothing more to submit.';
      if(t.status === 'failed') return 'This task has already closed and can no longer be submitted.';
      // Only this target matters — reading every pending submission to check
      // one of them ran on every submit and grew with the review backlog.
      const snap = await db.collection(SUBS_COLLECTION)
        .where('targetId','==',targetId).where('status','==','pending').get();
      if(!snap.empty) return 'You already have a submission awaiting review for this task.';
      return null;
    }catch(e){
      // If the check itself fails we let the submission through rather than
      // blocking real work over a flaky connection — a duplicate is a much
      // smaller problem than a worker unable to submit at all.
      console.error('Freshness check failed, allowing submission:', e);
      return null;
    }
  }

  // Runs on every submission, so it has to go through applyTargetDeltas like
  // every other write to this document. It used to read the whole target list
  // and write it back wholesale, which meant a submission could silently undo
  // an approval, a generation or a fail that landed while it was in flight —
  // exactly the clobbering applyTargetDeltas exists to prevent.
  async function markTargetEverSubmitted(targetId){
    try{
      await applyTargetDeltas({ fieldChanges: { [targetId]: { everSubmitted: true } } });
    }catch(e){
      // The submission itself is already saved; this flag only widens the
      // grace window, so it is never worth failing a submission over.
      console.error('Could not flag target as submitted:', e);
    }
  }
  // One submit path for both worker forms (with photo and without).
  //
  // What kept going wrong before, and what this fixes:
  //  - a fresh submission id was minted on every tap, so a worker who
  //    resubmitted after a timeout created a SECOND submission. Two
  //    submissions, two approvals, two point awards. The id is now minted
  //    once when the form opens, so a retry replaces the same document.
  //  - a write that hadn't confirmed yet was reported as a failure. Firestore
  //    keeps an unconfirmed write queued and lands it when the signal comes
  //    back, so "failed" was often a lie — and the lie is what made people
  //    submit again. A slow write now says it is still sending.
  //  - the everSubmitted flag was awaited before the worker saw any result,
  //    which is what left the button stuck on "Submitting…" for a long time
  //    on a weak signal. The submission is saved by then, so it no longer
  //    holds up the message.
  const SLOW_SUBMIT_MS = 12000;
  async function runSubmit({ subId, attempt, targetId, worker, photo, note, sendBtn, msg, onDone }){
    sendBtn.disabled = true; sendBtn.textContent = 'Submitting…';
    msg.style.color = 'var(--muted)';
    msg.textContent = '';

    const blocked = await blockSubmissionReason(targetId);
    if(blocked){
      msg.style.color = 'var(--red)';
      msg.textContent = blocked;
      setTimeout(onDone, 1600);
      return;
    }

    let settled = false;
    const slow = setTimeout(()=>{
      if(settled) return;
      msg.style.color = 'var(--amber-dark)';
      msg.textContent = 'Still sending on a weak signal — keep this open and do NOT submit again. It will finish by itself once you have signal.';
    }, SLOW_SUBMIT_MS);

    const res = await addSub({
      id: subId, targetId, workerId: worker.id, photo, note,
      status: 'pending', submittedAt: new Date().toISOString()
    }, { skipStats: attempt > 1 });

    settled = true;
    clearTimeout(slow);

    if(res.ok){
      msg.style.color = 'var(--green)';
      msg.textContent = 'Submitted — awaiting admin review.';
      markTargetEverSubmitted(targetId); // deliberately not awaited
      setTimeout(onDone, 900);
    }else{
      sendBtn.disabled = false; sendBtn.textContent = 'Submit for Review';
      msg.style.color = 'var(--red)';
      msg.textContent = 'Could not submit (' + res.error + '). Tap Submit again when you have signal — this will not create a duplicate.';
    }
  }

  // ---- the ledger, one document per month ----
  //
  // Every award and redemption used to live in a single document that was
  // never trimmed. appendLedger reads it, appends, and writes the whole
  // thing back inside a transaction, so each award carried the entire
  // history — and Firestore refuses a document over 1 MiB. At the rate this
  // season has been running, that ceiling is a few months away, and the
  // failure is not a slow award but no award at all.
  //
  // So the live document holds the current month and nothing else. Each
  // past month is rolled into perf-ledger-YYYY-MM, which never grows again.
  // Nothing is summarised and nothing is lost: the ledger is still the
  // complete record of every point, it is simply in several documents.
  const K_LEDGER_INDEX = 'perf-ledger-index';
  const ledgerDocFor = m => 'perf-ledger-' + m;
  const monthOf = e => String((e && (e.date || e.at)) || '').slice(0, 7);
  function monthNow(){ return todayStr().slice(0, 7); }

  // Just this month's — what appendLedger appends to.
  async function getLedgerCurrent(){ return getList(K_LEDGER); }

  // Every entry ever. Deliberately still called getLedger, so that each of
  // the dozen places that works out a balance keeps seeing the whole history
  // without being touched. Balances are cumulative; a caller handed only
  // this month would quietly be wrong.
  async function getLedger(){
    const months = await getList(K_LEDGER_INDEX);
    const [past, live] = await Promise.all([
      Promise.all(months.map(m => getList(ledgerDocFor(m)))),
      getList(K_LEDGER)
    ]);
    return past.flat().concat(live);
  }

  // Move anything from a previous month out of the live document. Safe to
  // run at any time and safe to run twice.
  //
  // Order matters: each month's document is written FIRST, merged by entry
  // id so a repeat cannot duplicate, and only then is the live ledger
  // shortened. Interrupted half way, an entry sits in both places — which
  // the merge and the id check both tolerate. Losing one is the thing that
  // must never happen, and that order makes it impossible.
  let _rolling = null;
  // Which month this tab has already rolled for, so appendLedger can skip
  // the check on every award. Set only after a roll actually completes.
  let _rolledFor = '';
  async function rollLedger(){
    if(_rolling) return _rolling;
    _rolling = (async () => {
      const live = await getListStrict(K_LEDGER);
      const now = monthNow();
      const old = live.filter(e => { const m = monthOf(e); return m && m < now; });
      if(!old.length) return false;

      const byMonth = new Map();
      old.forEach(e => {
        const m = monthOf(e);
        if(!byMonth.has(m)) byMonth.set(m, []);
        byMonth.get(m).push(e);
      });
      for(const [m, list] of byMonth){
        const key = ledgerDocFor(m);
        const have = await getListStrict(key);
        const seen = new Set(have.map(x => x.id));
        await saveDoc(key, have.concat(list.filter(x => !seen.has(x.id))));
      }
      const known = await getListStrict(K_LEDGER_INDEX);
      await saveDoc(K_LEDGER_INDEX,
        Array.from(new Set(known.concat(Array.from(byMonth.keys())))).sort());

      // Shortened in a transaction, so an award landing at this exact
      // moment is kept rather than overwritten.
      const ref = db.collection('appdata').doc(K_LEDGER);
      const moved = new Set(old.map(e => e.id));
      cacheDrop(K_LEDGER);
      await db.runTransaction(async tx => {
        const doc = await tx.get(ref);
        const current = doc.exists ? (doc.data().value || []) : [];
        tx.set(ref, { value: current.filter(e => !moved.has(e.id)) });
      });
      cacheDrop(K_LEDGER);
      return true;
    })().catch(e => {
      // Never fatal: an un-rolled ledger is the situation we are already in.
      // null rather than false, so the caller can tell "nothing to do" from
      // "could not tell" and does not stop checking for the rest of the day.
      console.error('Could not roll the ledger into monthly documents:', e);
      return null;
    }).finally(() => { _rolling = null; });
    return _rolling;
  }

  // ---- Points totals cache ----
  // The ledger grows all season, and almost every screen only needs each
  // worker's totals — not the raw entries. Downloading the whole history to
  // add up numbers is what made dashboards and leaderboards slow. This keeps a
  // small summary document (a few numbers per worker) that reads instead.
  //
  // It is a CACHE, never the source of truth: the ledger stays authoritative,
  // and "Rebuild totals" in the Rewards tab recomputes this from scratch if it
  // ever drifts.
  const K_TOTALS = 'perf-totals';
  function computeTotals(ledger){
    const t = {};
    for(let i=0; i<ledger.length; i++){
      const l = ledger[i];
      const e = t[l.workerId] = t[l.workerId] || { earned:0, balance:0, reachedAt:'' };
      if(l.type === 'earned'){
        e.earned += l.points || 0;
        e.balance += l.points || 0;
        // Same tie-break key the leaderboard uses: timestamp, then ledger
        // position so same-instant entries still order deterministically.
        const key = (l.at || (l.date ? l.date+'T00:00:00.000Z' : '')) + '#' + String(i).padStart(8,'0');
        if(key > e.reachedAt) e.reachedAt = key;
      } else {
        e.balance -= l.points || 0;
      }
    }
    return { byWorker: t, entryCount: ledger.length };
  }
  async function getTotals(){
    const doc = await db.collection('appdata').doc(K_TOTALS).get();
    return doc.exists ? doc.data().value : null;
  }
  // Reads the cache, rebuilding it from the ledger if it's missing. Returns
  // null only if even the rebuild fails, so callers can fall back safely.
  async function getTotalsEnsured(){
    try{
      const cached = await getTotals();
      if(cached && cached.byWorker) return cached;
      const ledger = await getLedger();
      const fresh = computeTotals(ledger);
      await saveDoc(K_TOTALS, fresh);
      return fresh;
    }catch(e){
      console.error('Totals unavailable, falling back to full ledger:', e);
      return null;
    }
  }
  async function rebuildTotals(){
    const ledger = await getLedger();
    const fresh = computeTotals(ledger);
    await saveDoc(K_TOTALS, fresh);
    return fresh;
  }
  // Single place that appends to the ledger, so the cache can never be
  // updated in one code path and forgotten in another.
  // Appends inside a transaction. A plain read-modify-write on this single
  // document loses entries when two approvals land close together — the
  // second read happens before the first write, and one award vanishes even
  // though its task shows as approved.
  async function appendLedger(entries){
    if(!entries || entries.length === 0) return true;
    const ref = db.collection('appdata').doc(K_LEDGER);
    cacheDrop(K_LEDGER);
    let ledger = null, startIdx = 0;
    try{
      // Roll last month out before appending, so the live document only
      // ever holds the current month and this transaction stays small.
      //
      // Once per session, not once per approval. rollLedger has to read the
      // ledger to see whether anything is old, and that read is uncached by
      // design — paying it on every approval added a round trip to the one
      // action an admin repeats dozens of times in a sitting. The month
      // cannot change twice while a tab is open, and the first award after
      // it does still rolls.
      if(_rolledFor !== monthNow()){
        if(await rollLedger() !== null) _rolledFor = monthNow();
      }
      await db.runTransaction(async tx => {
        const doc = await tx.get(ref);
        const current = doc.exists ? (doc.data().value || []) : [];
        // Guard against a retry adding the same entry twice.
        const existing = new Set(current.map(l => l.id));
        const toAdd = entries.filter(e => !existing.has(e.id));
        startIdx = current.length;
        ledger = current.concat(toAdd);
        tx.set(ref, { value: ledger });
      });
      cacheDrop(K_LEDGER);
    }catch(e){
      showFbError('Could not award points: ' + e.message);
      return false;
    }
    try{
      const cached = await getTotals();
      // Without a cache the totals have to come from every month, not from
      // the slice of this one that happens to be in hand.
      const t = (cached && cached.byWorker) ? cached
        : computeTotals((await getLedger()).filter(l => !entries.some(e => e.id === l.id)));
      entries.forEach((l, n)=>{
        const e = t.byWorker[l.workerId] = t.byWorker[l.workerId] || { earned:0, balance:0, reachedAt:'' };
        if(l.type === 'earned'){
          e.earned += l.points || 0; e.balance += l.points || 0;
          const key = (l.at || (l.date ? l.date+'T00:00:00.000Z' : '')) + '#' + String(startIdx + n).padStart(8,'0');
          if(key > e.reachedAt) e.reachedAt = key;
        } else { e.balance -= l.points || 0; }
      });
      t.entryCount = (Number(t.entryCount) || 0) + entries.length;
      await saveDoc(K_TOTALS, t);
    }catch(e){
      console.error('Could not update totals cache — rebuild from the Rewards tab:', e);
    }
    return true;
  }
  async function getCatalog(){ return getList(K_CATALOG); }
  async function getRoleTemplates(){ return getList(K_ROLE_TEMPLATES); }
  async function getWeeklyTemplates(){ return getList(K_WEEKLY_TEMPLATES); }
  async function getSideQuests(){ return getList(K_SIDEQUESTS); }
  // The challenger task list is stored as one array in one document, so every
  // change is a read, a change, and a write of the whole thing. getList()
  // answers a failed read with an empty array — which turned "add one task"
  // into "replace them all with this one" and lost a day's work. Every
  // mutation goes through here instead: the strict read throws, and nothing
  // is written at all.
  //
  // apply(list) returns the list to save, or false to call the whole thing
  // off without writing.
  async function mutateSideQuests(apply){
    let quests;
    try{
      quests = await getListStrict(K_SIDEQUESTS);
    }catch(e){
      showFbError('Could not read the challenger tasks, so nothing was changed: ' + e.message);
      return { ok:false, error:e.message };
    }
    let next;
    try{ next = apply(quests); }
    catch(e){ console.error('Challenger change failed:', e); return { ok:false, error:e.message }; }
    if(next === false) return { ok:false, cancelled:true };
    const ok = await setList(K_SIDEQUESTS, next || quests);
    return { ok };
  }
  // A lost definition has no backup of its own, but it leaves fingerprints:
  // every worker who accepted the task holds a copy carrying its ID, title,
  // points and deadline, and every missed one leaves the same details in the
  // fails record. This gathers those for any task ID that no longer has a
  // definition, so an admin can put it back rather than retype it.
  function _sqTally(bag, id){
    return bag[id] || (bag[id] = { id, titles:{}, points:{}, photoYes:0, photoNo:0,
      holders:{}, firstAccepted:null, lastAccepted:null, deadlines:{},
      achieved:0, active:0, pending:0, failed:0, fromFails:0 });
  }
  function _sqBump(map, v){ if(v === undefined || v === null || v === '') return; map[v] = (map[v]||0) + 1; }
  function _sqTop(map){
    const keys = Object.keys(map);
    if(!keys.length) return null;
    return keys.sort((a,b)=> map[b] - map[a])[0];
  }
  async function scanLostSideQuests(){
    const [quests, targets, fails] = await Promise.all([
      getListStrict(K_SIDEQUESTS), getListStrict(K_TARGETS), getListStrict(K_FAILS)]);
    const known = new Set(quests.map(q => q.id));
    const bag = {};
    targets.forEach(t => {
      if(!t.sideQuestId || known.has(t.sideQuestId)) return;
      const e = _sqTally(bag, t.sideQuestId);
      _sqBump(e.titles, t.title); _sqBump(e.points, t.points);
      if(t.requiresPhoto === false) e.photoNo++; else e.photoYes++;
      if(t.workerId) e.holders[t.workerId] = true;
      if(t.acceptedAt){
        if(!e.firstAccepted || t.acceptedAt < e.firstAccepted) e.firstAccepted = t.acceptedAt;
        if(!e.lastAccepted || t.acceptedAt > e.lastAccepted) e.lastAccepted = t.acceptedAt;
      }
      _sqBump(e.deadlines, t.expiresAt);
      if(t.status === 'achieved') e.achieved++;
      else if(t.status === 'pending') e.pending++;
      else if(t.status === 'failed') e.failed++;
      else e.active++;
    });
    fails.forEach(f => {
      if(!f.sideQuestId || known.has(f.sideQuestId)) return;
      const e = _sqTally(bag, f.sideQuestId);
      _sqBump(e.titles, f.title); _sqBump(e.points, f.points);
      if(f.requiresPhoto === false) e.photoNo++; else e.photoYes++;
      if(f.workerId) e.holders[f.workerId] = true;
      e.fromFails++;
    });
    return Object.values(bag).map(e => {
      const deadline = _sqTop(e.deadlines) || null;
      // A deadline that sits before someone's acceptance would make the app
      // treat that acceptance as one that should never have happened — and
      // clear it away. Only carry a deadline back if it still stands after
      // every acceptance on file.
      const keep = deadline && (!e.lastAccepted
        || new Date(deadline).getTime() > new Date(e.lastAccepted).getTime());
      return {
        id: e.id,
        title: _sqTop(e.titles) || '(description not recorded)',
        points: parseInt(_sqTop(e.points), 10) || 0,
        requiresPhoto: e.photoNo <= e.photoYes,
        holders: Object.keys(e.holders).length,
        achieved: e.achieved, active: e.active, pending: e.pending, failed: e.failed,
        fromFails: e.fromFails, firstAccepted: e.firstAccepted,
        deadline: keep ? deadline : null, deadlineDropped: !!(deadline && !keep)
      };
    }).sort((a,b)=> String(b.firstAccepted||'').localeCompare(String(a.firstAccepted||'')));
  }
  // Put them back closed and with no roles set: a restored task should never
  // quietly reopen itself to the rest of the team. Capacity is set to the
  // number of people already holding it so their copies stay valid.
  async function restoreSideQuests(picks){
    return mutateSideQuests(list => {
      const have = new Set(list.map(q => q.id));
      const add = picks.filter(p => !have.has(p.id)).map(p => ({
        id: p.id, title: p.title, points: p.points,
        requiresPhoto: p.requiresPhoto !== false,
        expiresAtFixed: p.deadline || null,
        roles: [],
        capacity: Math.max(1, p.holders || 1),
        opensAt: null,
        active: false,
        createdAt: p.firstAccepted || new Date().toISOString(),
        restoredAt: new Date().toISOString()
      }));
      if(!add.length) return false;
      return list.concat(add);
    });
  }
  async function getDismissed(){ return getList(K_DISMISSED); }
  async function getFails(){ return getList(K_FAILS); }

  // ---- Quality issues ----
  // Work that was approved at the time but turned out to be wrong days or
  // weeks later. Logged forward rather than by reversing the old approval —
  // the points may already be spent, and rewriting old ledger entries would
  // distort leaderboard history and tie-breaks.
  // ---- Submission statistics ----
  // Scoring needs counts and timings, not the submissions themselves. Reading
  // every submission to work them out cost up to 10,000 reads per visit to the
  // Scores tab — enough to exhaust a day's free quota in a handful of opens.
  // These totals are kept up to date as submissions are made and reviewed, so
  // scoring reads one small document instead.
  const K_SUB_STATS = 'perf-sub-stats';
  async function getSubStats(){
    try{
      const doc = await db.collection('appdata').doc(K_SUB_STATS).get();
      const v = doc.exists ? doc.data().value : null;
      return (v && v.byWorker) ? v : { byWorker:{} };
    }catch(e){ return { byWorker:{} }; }
  }
  // Promptness for one submission, on the same taper the score uses.
  // Minutes past midnight in Malaysia, for a timestamp from anywhere.
  //
  // Everything else in this app is careful to ask what time it is in Kuala
  // Lumpur. promptScoreFor used to use the device's own clock instead, so
  // the same submission scored 25 on a phone here and 100 on one set to
  // London — and "Refresh workers' scores" recomputes every worker's
  // promptness on whatever device the admin happens to be holding.
  function minutesOfDayMY(iso){
    const t = new Date(iso);
    if(isNaN(t.getTime())) return null;
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kuala_Lumpur',
      hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(t);
    const h = parseInt(p.find(x => x.type === 'hour').value, 10);
    const m = parseInt(p.find(x => x.type === 'minute').value, 10);
    if(isNaN(h) || isNaN(m)) return null;
    return (h % 24) * 60 + m;   // some engines render midnight as 24:00
  }
  // How close to the deadline this went in, 0-100.
  //
  // Only daily tasks are scored. The deadline here is 9pm TODAY, which is
  // true for a daily task and meaningless for anything else: a weekly task
  // is due Sunday and a challenger task has its own date, so submitting one
  // at 10pm on a Monday was being scored 0 for lateness when it was not
  // remotely late. Anything that is not a daily task returns null and is
  // left out of the average entirely, rather than counted as a failure.
  //
  // kind is absent on submissions made before this was recorded. Those keep
  // the old behaviour so that existing scores do not move retroactively.
  function promptScoreFor(submittedAtISO, kind){
    if(!submittedAtISO) return null;
    if(kind && kind !== 'daily') return null;
    const mins = minutesOfDayMY(submittedAtISO);
    if(mins === null) return null;
    // No longer part of the score — the component was removed. Still
    // computed and stored so the figure exists if it is ever wanted back,
    // and still measured against 9pm, which is what it always meant.
    if(mins > DAILY_HANDOUT_END) return 0;
    const graceBefore = 120;
    const before = DAILY_HANDOUT_END - mins;
    return before >= graceBefore ? 100 : Math.round((before / graceBefore) * 100);
  }
  // Applied in a transaction so simultaneous submissions can't overwrite each
  // other's tallies.
  async function bumpSubStats(workerId, delta){
    try{
      const ref = db.collection('appdata').doc(K_SUB_STATS);
      cacheDrop(K_SUB_STATS);
      await db.runTransaction(async tx => {
        const doc = await tx.get(ref);
        const v = (doc.exists && doc.data().value && doc.data().value.byWorker)
          ? doc.data().value : { byWorker:{} };
        const e = v.byWorker[workerId] = v.byWorker[workerId] ||
          { subs:0, promptSum:0, promptCount:0, reviewed:0, rejected:0 };
        Object.keys(delta).forEach(k=>{ e[k] = (e[k] || 0) + delta[k]; });
        tx.set(ref, { value: v });
      });
      cacheDrop(K_SUB_STATS);
    }catch(e){ console.error('Could not update submission stats:', e); }
  }

  async function rebuildSubStats(){
    const snap = await db.collection(SUBS_COLLECTION).get();
    const byWorker = {};
    snap.docs.forEach(d=>{
      const x = d.data();
      const e = byWorker[x.workerId] = byWorker[x.workerId] ||
        { subs:0, promptSum:0, promptCount:0, reviewed:0, rejected:0 };
      e.subs++;
      const ps = promptScoreFor(x.submittedAt, x.taskKind);
      if(ps !== null){ e.promptSum += ps; e.promptCount++; }
      if(x.status === 'approved' || x.status === 'rejected'){
        e.reviewed++;
        if(x.status === 'rejected') e.rejected++;
      }
    });
    await saveDoc(K_SUB_STATS, { byWorker, rebuiltAt: new Date().toISOString() });
    return { byWorker };
  }

  const K_QUALITY_ISSUES = 'perf-quality-issues';
  async function getQualityIssues(){ return getList(K_QUALITY_ISSUES); }

  // ---- Fail counts cache ----
  // Same idea as the points totals: dashboards and the worker list only need
  // "how many", not the rows. The rows are fetched on demand when someone
  // actually opens the list. K_FAILS remains the source of truth.
  const K_FAIL_COUNTS = 'perf-fail-counts';
  function computeFailCounts(fails){
    const byWorker = {};
    for(const f of fails) byWorker[f.workerId] = (byWorker[f.workerId] || 0) + 1;
    return { byWorker, total: fails.length };
  }
  async function rebuildFailCounts(){
    const fails = await getFails();
    const fresh = computeFailCounts(fails);
    await saveDoc(K_FAIL_COUNTS, fresh);
    return fresh;
  }
  async function getFailCountsEnsured(){
    try{
      const doc = await db.collection('appdata').doc(K_FAIL_COUNTS).get();
      const cached = doc.exists ? doc.data().value : null;
      if(cached && cached.byWorker) return cached;
      return await rebuildFailCounts();
    }catch(e){
      console.error('Fail counts unavailable, falling back:', e);
      return null;
    }
  }
  // Single write path, so the cache can't be updated in one place and missed
  // in another. Pass the already-merged full list.
  async function setFailsAndCounts(fails){
    const ok = await setList(K_FAILS, fails);
    if(!ok) return false;
    try{
      await saveDoc(K_FAIL_COUNTS, computeFailCounts(fails));
    }catch(e){ console.error('Could not update fail counts cache:', e); }
    return true;
  }
  // ---- Reviving a task that was failed by mistake ----
  // For when a worker's submission never went through and the deadline passed
  // before anyone noticed.
  //
  // The trap here is that each kind of task decides it has expired from a
  // DIFFERENT field: a daily goes by createdAt, a weekly by weekOf, a
  // challenger task by expiresAt. Setting the task back to 'active' without
  // moving the right one means the next sweep fails it again within seconds.
  //
  // Daily targets are also cleared at 5am, so by the time a miss is noticed
  // the target itself is usually gone and only the fail record survives. The
  // fail record carries title, points, template and photo requirement, so the
  // task can be rebuilt from it.
  function addDaysMY(dateStr, n){
    const d = new Date(dateStr + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0,10);
  }
  async function reviveFail(fail, questHours){
    const { dateStr: today, minutesOfDay } = nowMYParts();
    const type = fail.type || (fail.sideQuestId ? 'sidequest' : (fail.weekOf ? 'weekly' : 'daily'));
    const targets = await getTargets();
    const existing = fail.targetId ? targets.find(t => t.id === fail.targetId) : null;

    let placement, note;
    if(type === 'daily'){
      // Late in the evening there is no point adding to a list that is
      // nearly done, so it lands on tomorrow's instead. Note this is the
      // handout cutoff, not the closing time — today's list stays open for
      // submissions until 5am whatever is added to it now.
      const dayFor = minutesOfDay >= DAILY_HANDOUT_END ? addDaysMY(today, 1) : today;
      placement = { createdAt: dayFor };
      note = dayFor === today
        ? 'on today\'s list, open until 5am tomorrow'
        : 'moved to ' + dayFor + ' — too late in the day to add to today\'s list';
    }else if(type === 'weekly'){
      const pastWeekEnd = dayOfWeekMY(today) === 0 && minutesOfDay >= WEEK_EXPIRE_MINUTES;
      const weekFor = mondayOfWeekMY(pastWeekEnd ? addDaysMY(today, 1) : today);
      placement = { weekOf: weekFor, createdAt: today };
      note = 'due Sunday 9pm, week of ' + weekFor;
    }else{
      const hrs = Number(questHours) > 0 ? Number(questHours) : 24;
      placement = { expiresAt: new Date(Date.now() + hrs * 3600 * 1000).toISOString() };
      note = 'open for another ' + hrs + ' hours';
    }

    // A revived daily or weekly is detached from its template on purpose,
    // and still has to be even now that the duplicate key includes the day.
    // A revived task is placed on TODAY's list, so if it kept its original
    // templateId it would carry the same worker+template+day key as today's
    // freshly generated copy of that very task — they would collide and one
    // would be silently deleted, which is what used to make a revived task
    // vanish from the worker's list. Detaching makes it a standalone make-up
    // task standing beside today's work rather than competing with it. The
    // original template is kept for reference only.
    const detach = (type === 'daily' || type === 'weekly')
      ? { templateId: null, isRevived: true }
      : { isRevived: true };

    // applyTargetDeltas reports failure by returning false rather than
    // throwing, so it has to be checked — otherwise a revive that never wrote
    // anything would still clear the fail record and look like it worked.
    if(existing){
      const ok = await applyTargetDeltas({ fieldChanges: { [existing.id]: {
        ...placement, ...detach, status: 'active', everSubmitted: false,
        revivedFromTemplateId: existing.templateId || null,
        failedAt: null, failKind: null, revivedAt: new Date().toISOString()
      } } });
      if(!ok) throw new Error('could not reopen the task — nothing was changed');
    }else{
      // Guard against reviving the same fail twice, which would leave the
      // worker with two identical make-up tasks.
      const already = targets.find(t => t.status === 'active' && t.revivedFromFail === fail.id);
      if(already){
        note = 'that make-up task is already on their list';
      }else{
        const nt = {
          id: uid(), workerId: fail.workerId, title: fail.title, points: fail.points,
          status: 'active', requiresPhoto: fail.requiresPhoto !== false,
          revivedAt: new Date().toISOString(), revivedFromFail: fail.id,
          revivedFromTemplateId: fail.templateId || null,
          ...detach, ...placement
        };
        if(type === 'daily'){ nt.period = 'Daily'; nt.isDaily = true; }
        else if(type === 'weekly'){ nt.period = 'Weekly'; nt.isWeekly = true; }
        else { nt.period = 'Challenger'; nt.sideQuestId = fail.sideQuestId || null; nt.createdAt = today; }
        const skipped = [];
        const ok = await applyTargetDeltas({ add: [nt], skipped });
        if(!ok) throw new Error('could not rebuild the task — nothing was changed');
        // The write succeeding is not the same as the task arriving. If it
        // was dropped as a duplicate, the fail has to stay on the list.
        if(skipped.length) throw new Error('the task was not added — the fail record has been left alone');
      }
    }

    const fails = await getFails();
    const ok = await setFailsAndCounts(fails.filter(f => f.id !== fail.id));
    if(!ok) throw new Error('Task was restored but the fail record could not be cleared — try again.');
    return note;
  }

  // A single task for one worker, outside the template system — a make-up for
  // something that went wrong, or a one-off piece of work. Detached from any
  // template for the same reason a revived task is (see reviveFail), so it
  // never collides with a generated daily and get collapsed away.
  async function addOneOffTask({ workerId, title, points, requiresPhoto }){
    const { dateStr: today, minutesOfDay } = nowMYParts();
    const dayFor = minutesOfDay >= DAILY_HANDOUT_END ? addDaysMY(today, 1) : today;
    const nt = {
      id: uid(), workerId, title, points,
      period: 'Daily', isDaily: true, templateId: null, isRevived: true,
      status: 'active', createdAt: dayFor, requiresPhoto: requiresPhoto !== false,
      revivedAt: new Date().toISOString()
    };
    const adhocSkipped = [];
    const ok = await applyTargetDeltas({ add: [nt], skipped: adhocSkipped });
    if(!ok) throw new Error('could not add the task — nothing was changed');
    if(adhocSkipped.length) throw new Error('that task is already on their list for ' + dayFor);
    return dayFor === today
      ? 'on today\'s list, open until 5am tomorrow'
      : 'on the list for ' + dayFor + ' — too late in the day to add to today\'s';
  }

  async function getHolidayClosures(){ return getList(K_HOLIDAY_CLOSURES); }

  // ---- Hell Mode ----
  // The problems nobody volunteers for. An admin raises a standing headache a
  // department lives with; it sits on an open board until someone is willing
  // to own it. A challenger task is done and submitted in one go — a Hell
  // Mode issue is a piece of work with a shape: propose it, present it, put it
  // in, then have it reviewed. The board shows which stage it has reached and
  // how many days it has been running, because an issue that drags is the
  // thing worth looking at.
  const K_HELL = 'perf-hell-issues';
  const HELL_STAGES = ['Submit proposal', 'Present', 'Implement', 'Review'];
  // The award is a fixed pot, not a per-head payment: more hands on an issue
  // means a smaller share each, never a bigger bill. The owner takes a double
  // share — they carry the issue, and they are the only one who pays if it
  // fails.
  const HELL_OWNER_SHARES = 2;
  // Worked out so the pot is spent exactly. The owner takes what is left
  // after the joiners, so rounding can never quietly inflate the total.
  function hellSplit(total, joinerCount){
    const t = Math.max(0, Math.round(Number(total) || 0));
    const n = Math.max(0, Number(joinerCount) || 0);
    if(t === 0) return { owner: 0, joiner: 0 };
    const joiner = n === 0 ? 0 : Math.round(t / (HELL_OWNER_SHARES + n));
    return { owner: Math.max(0, t - joiner * n), joiner };
  }
  async function getHellIssues(){ return getList(K_HELL); }
  async function setHellIssues(list){ return setList(K_HELL, list); }

  // Whole days between two Malaysia dates, counting the day it was accepted
  // as day 1 — "Day 1" on the day you take it, not day 0.
  function daysBetweenDates(fromStr, toStr){
    if(!fromStr || !toStr) return 0;
    const a = Date.parse(fromStr + 'T00:00:00Z'), b = Date.parse(toStr + 'T00:00:00Z');
    if(isNaN(a) || isNaN(b)) return 0;
    return Math.max(0, Math.round((b - a) / 86400000));
  }
  function hellDayCount(issue, today){
    if(!issue || !issue.acceptedDate) return 0;
    return daysBetweenDates(issue.acceptedDate, today || todayStr()) + 1;
  }
  // Still inside the window the speed bonus is paid for. No window set means
  // no bonus to be inside of.
  function hellOnTime(issue, today){
    const days = Number(issue && issue.bonusDays) || 0;
    if(days <= 0) return false;
    return hellDayCount(issue, today) <= days;
  }
  function hellIsOwner(issue, workerId){ return !!issue && issue.ownerId === workerId; }
  function hellJoiners(issue){ return Array.isArray(issue && issue.joiners) ? issue.joiners : []; }
  function hellIsMember(issue, workerId){
    return hellIsOwner(issue, workerId) || hellJoiners(issue).includes(workerId);
  }
  function hellLog(issue, action, stage, actorId, note){
    issue.log = Array.isArray(issue.log) ? issue.log : [];
    issue.log.push({ at: new Date().toISOString(), action, stage,
      ...(actorId ? { actorId } : {}), ...(note ? { note } : {}) });
  }

  // One worker takes the issue on. The clock starts here, and everything
  // after is measured from it.
  function hellAccept(issue, worker){
    if(!issue || issue.state !== 'open') return false;
    issue.state = 'live';
    issue.ownerId = worker.id;
    issue.joiners = [];
    issue.applicants = [];
    issue.acceptedAt = new Date().toISOString();
    issue.acceptedDate = todayStr();
    issue.stage = 0;
    issue.pending = false;
    hellLog(issue, 'accepted', 0, worker.id);
    return true;
  }
  function hellApplicants(issue){
    return Array.isArray(issue && issue.applicants) ? issue.applicants : [];
  }
  // Asking to join, rather than joining. One tap used to put somebody
  // straight onto an issue and cut everybody's share — including by
  // accident, with no way back. Now it is a request, and the person
  // carrying the issue decides.
  function hellApply(issue, worker){
    if(!issue || issue.state !== 'live') return false;
    if(hellIsMember(issue, worker.id)) return false;
    if(hellApplicants(issue).includes(worker.id)) return false;
    issue.applicants = hellApplicants(issue).concat([worker.id]);
    hellLog(issue, 'asked to join', issue.stage, worker.id);
    return true;
  }
  // Only the owner decides. `byId` is left out when an admin is doing it
  // from the board, where they can already do anything.
  function hellAcceptApplicant(issue, workerId, byId){
    if(!issue || issue.state !== 'live') return false;
    if(!hellApplicants(issue).includes(workerId)) return false;
    if(byId && !hellIsOwner(issue, byId)) return false;
    issue.applicants = hellApplicants(issue).filter(id => id !== workerId);
    issue.joiners = hellJoiners(issue).concat([workerId]);
    hellLog(issue, 'joined', issue.stage, workerId);
    return true;
  }
  function hellDeclineApplicant(issue, workerId, byId){
    if(!issue) return false;
    if(!hellApplicants(issue).includes(workerId)) return false;
    if(byId && !hellIsOwner(issue, byId)) return false;
    issue.applicants = hellApplicants(issue).filter(id => id !== workerId);
    hellLog(issue, 'turned down', issue.stage, workerId);
    return true;
  }
  // Taking somebody back off an issue. The owner cannot go this way —
  // giving the issue up is a different thing, and it carries a penalty.
  function hellRemoveJoiner(issue, workerId){
    if(!issue || !hellJoiners(issue).includes(workerId)) return false;
    issue.joiners = hellJoiners(issue).filter(id => id !== workerId);
    hellLog(issue, 'taken off', issue.stage, workerId);
    return true;
  }
  // The owner or a joiner says a stage is done. Nothing moves until an admin
  // agrees — the stage sits pending, visible to everyone, until they do.
  function hellSubmitStage(issue, workerId, note){
    if(!issue || issue.state !== 'live' || issue.pending) return false;
    if(!hellIsMember(issue, workerId)) return false;
    issue.pending = true;
    issue.pendingAt = new Date().toISOString();
    hellLog(issue, 'submitted', issue.stage, workerId, note);
    return true;
  }
  // Admin accepts the stage. The last one finishes the issue.
  function hellApproveStage(issue, note){
    if(!issue || issue.state !== 'live' || !issue.pending) return false;
    const done = issue.stage >= HELL_STAGES.length - 1;
    hellLog(issue, 'approved', issue.stage, null, note);
    issue.pending = false;
    issue.pendingAt = null;
    if(done){
      issue.state = 'done';
      issue.completedAt = new Date().toISOString();
      issue.completedDate = todayStr();
      issue.completedInDays = hellDayCount(issue);
      issue.paidOnTime = hellOnTime(issue);
    } else {
      issue.stage += 1;
    }
    return true;
  }
  // Sent back: the stage is not good enough, but the issue is still theirs.
  function hellRejectStage(issue, note){
    if(!issue || issue.state !== 'live' || !issue.pending) return false;
    issue.pending = false;
    issue.pendingAt = null;
    issue.rejections = (Number(issue.rejections) || 0) + 1;
    hellLog(issue, 'rejected', issue.stage, null, note);
    return true;
  }
  // Failed: the issue is taken off whoever had it and put back on the board
  // for someone else. The problem is still real — it is the attempt that
  // ended, not the need.
  function hellFailIssue(issue, note){
    if(!issue || issue.state !== 'live') return false;
    hellLog(issue, 'failed', issue.stage, null, note);
    issue.attempts = (Array.isArray(issue.attempts) ? issue.attempts : []).concat([{
      ownerId: issue.ownerId, joiners: hellJoiners(issue),
      acceptedDate: issue.acceptedDate, failedDate: todayStr(),
      stage: issue.stage, days: hellDayCount(issue), note: note || ''
    }]);
    issue.state = 'open';
    issue.ownerId = null;
    issue.joiners = [];
    issue.applicants = [];
    issue.acceptedAt = null;
    issue.acceptedDate = null;
    issue.stage = 0;
    issue.pending = false;
    issue.pendingAt = null;
    issue.rejections = 0;
    return true;
  }
  // What a finished issue pays. The owner takes the full award; anyone who
  // joined takes a share of it. The speed bonus rides on the same split, so
  // finishing fast is worth the same proportion to everyone who worked on it.
  function hellAwardEntries(issue){
    if(!issue || issue.state !== 'done') return [];
    const joiners = hellJoiners(issue);
    const base = hellSplit(issue.points, joiners.length);
    const bonus = issue.paidOnTime ? hellSplit(issue.bonusPoints, joiners.length)
                                   : { owner: 0, joiner: 0 };
    const at = issue.completedAt || new Date().toISOString();
    const date = issue.completedDate || todayStr();
    const out = [];
    const add = (workerId, points, what) => {
      if(!workerId || points <= 0) return;
      out.push({ id: uid(), workerId, type:'earned', points,
        note: `Hell Mode — ${what}: ${issue.title}`, date, at });
    };
    const inDays = `${issue.completedInDays} day${issue.completedInDays === 1 ? '' : 's'}`;
    add(issue.ownerId, base.owner, 'solved');
    if(bonus.owner) add(issue.ownerId, bonus.owner, `solved in ${inDays}`);
    joiners.forEach(wid => {
      add(wid, base.joiner, 'helped solve');
      if(bonus.joiner) add(wid, bonus.joiner, `helped solve in ${inDays}`);
    });
    return out;
  }
  // What a failed attempt costs its owner. Taken off the balance, not off
  // lifetime earnings — the points were genuinely earned once, and rewriting
  // that would distort the leaderboard's history.
  function hellPenaltyEntries(issue, ownerId){
    const penalty = Math.max(0, Number(issue && issue.penalty) || 0);
    if(!ownerId || penalty <= 0) return [];
    return [{ id: uid(), workerId: ownerId, type:'redeemed', points: penalty,
      note: `Hell Mode — gave up: ${issue.title}`, date: todayStr() }];
  }

  function genPin(){ return String(Math.floor(1000 + Math.random()*9000)); }

  // Wipes points and task history for a fresh season, while leaving every
  // piece of configuration (workers, roles, daily task templates, challenger task
  // definitions, badges, rewards catalog) exactly as it was.
  async function resetSeason(){
    try{
      // Every month, not just the live one — a season reset that left last
      // month's awards behind would put the points straight back the next
      // time totals were rebuilt.
      for(const m of await getListStrict(K_LEDGER_INDEX)) await setList(ledgerDocFor(m), []);
      await setList(K_LEDGER_INDEX, []);
      await setList(K_LEDGER, []);
      await saveDoc(K_TOTALS, { byWorker:{}, entryCount:0 });
      await saveDoc(K_TARGET_ARCHIVE, { byWorker:{}, archivedCount:0 });
      await saveDoc(K_SUB_STATS, { byWorker:{} });
      await setList(K_TARGETS, []);
      await setFailsAndCounts([]);
      // Challenger tasks are wiped entirely, not just reopened — a new season
      // starts with a clean slate rather than inheriting last season's list.
      await setList(K_SIDEQUESTS, []);

      const snap = await db.collection(SUBS_COLLECTION).get();
      // Ids first: once the submissions are gone there is nothing left to
      // say which photos belonged to them.
      const photoIds = snap.docs.map(d => d.id);
      await Promise.all(snap.docs.map(d => d.ref.delete()));
      await dropSubPhotos(photoIds);

      return true;
    }catch(e){
      showFbError('Could not reset the season: ' + e.message);
      return false;
    }
  }

  // Same idea as resetSeason(), but scoped to a single worker — everyone
  // else's points, submissions, targets, and fails are left untouched.
  async function resetWorker(workerId){
    try{
      // Removed from each month's document as well as the live one.
      const without = l => l.workerId !== workerId;
      for(const m of await getListStrict(K_LEDGER_INDEX)){
        const key = ledgerDocFor(m);
        const part = await getListStrict(key);
        if(part.some(l => !without(l))) await setList(key, part.filter(without));
      }
      await setList(K_LEDGER, (await getListStrict(K_LEDGER)).filter(without));
      await rebuildTotals(); // entry positions shift after a removal, so recompute rather than patch
      try{
        const arch = await getTargetArchive();
        if(arch.byWorker[workerId]){
          delete arch.byWorker[workerId];
          await saveDoc(K_TARGET_ARCHIVE, arch);
        }
      }catch(e){ console.error('Could not clear archived targets for worker:', e); }

      const targets = await getTargets();
      const myQuestIds = new Set(targets.filter(t=>t.workerId===workerId && t.sideQuestId).map(t=>t.sideQuestId));
      // Only this worker's rows are removed, as a merge — writing the filtered
      // array back wholesale would take everyone else's list with it, undoing
      // any approval that landed while this was running.
      await applyTargetDeltas({ removeIds: targets.filter(t=>t.workerId===workerId).map(t=>t.id) });

      const fails = await getFails();
      await setFailsAndCounts(fails.filter(f=>f.workerId!==workerId));

      if(myQuestIds.size > 0){
        await mutateSideQuests(list => {
          let changed = false;
          list.forEach(q=>{ if(myQuestIds.has(q.id) && q.active===false){ q.active = true; changed = true; } });
          return changed ? list : false;
        });
      }

      const snap = await db.collection(SUBS_COLLECTION).where('workerId','==', workerId).get();
      const photoIds = snap.docs.map(d => d.id);
      await Promise.all(snap.docs.map(d => d.ref.delete()));
      await dropSubPhotos(photoIds);

      return true;
    }catch(e){
      showFbError('Could not reset this worker: ' + e.message);
      return false;
    }
  }
  // Everything resetWorker() does, plus the worker record itself — name, PIN,
  // role, join date, all of it. Completely irreversible.
  async function deleteWorkerCompletely(workerId){
    // Read the name before anything is removed — afterwards there is
    // nothing left to name them by.
    let goneName = workerId;
    try{
      const w = (await getWorkers()).find(x => x.id === workerId);
      if(w && w.name) goneName = w.name;
    }catch(e){}
    const ok = await resetWorker(workerId);
    if(!ok) return false;
    adminLog('Deleted a worker', goneName);
    try{
      // A Hell Mode issue they owned would otherwise be stranded with an
      // owner who no longer exists, and nobody able to take it on. It goes
      // back on the board — without a penalty, since they did not give up.
      const issues = await getHellIssues();
      let changed = false;
      issues.forEach(i => {
        if(i.state === 'live' && i.ownerId === workerId){
          hellFailIssue(i, 'Owner was removed from the team');
          changed = true;
        } else if(hellJoiners(i).includes(workerId)){
          i.joiners = hellJoiners(i).filter(id => id !== workerId);
          changed = true;
        }
      });
      if(changed) await setHellIssues(issues);
      const workers = await getWorkers();
      await setList(K_WORKERS, workers.filter(w=>w.id!==workerId));
      return true;
    }catch(e){
      showFbError('Could not delete this worker: ' + e.message);
      return false;
    }
  }

  const DEFAULT_ROLES = [
    'Driver', 'Attendant', 'Warehouse Keeper', 'Warehouse Admin', 'Warehouse Foreman',
    'Seafreight Team', 'Airfreight Team', 'Forwarding Team', 'Airport Foreman',
    'E-com Admin', 'Seafreight Admin', 'Airfreight Admin', 'Forwarding Admin', 'Other'
  ];
  const K_ROLES = 'perf-custom-roles'; // roles the admin has added, beyond the defaults
  const K_REMOVED_ROLES = 'perf-removed-default-roles'; // built-in role NAMES the admin renamed away from or removed
  // 'Other' is the one protected role — it's the generic fallback bucket, so
  // it always exists and can't be renamed or removed. Every other role,
  // default or custom, can be.
  async function getRoles(){
    const [custom, removedDefaultRoles] = await Promise.all([getList(K_ROLES), getList(K_REMOVED_ROLES)]);
    const removedSet = new Set(removedDefaultRoles);
    const merged = DEFAULT_ROLES.filter(r => r!=='Other' && !removedSet.has(r));
    custom.forEach(r=>{ if(!merged.includes(r)) merged.push(r); });
    merged.push('Other'); // keep 'Other' last, always
    return merged;
  }
  async function addRole(name){
    if(name==='Other') return false;
    const current = await getRoles();
    if(current.includes(name)) return false;
    const custom = await getList(K_ROLES);
    custom.push(name);
    return setList(K_ROLES, custom);
  }
  // Renaming propagates to every worker and role template using it. Renaming
  // a built-in role also starts tracking the new name as a regular
  // (editable) role.
  async function renameRole(oldName, newName){
    if(oldName==='Other') return { ok:false, reason:'protected' };
    if(newName==='Other') return { ok:false, reason:'reserved' };
    const currentRoles = await getRoles();
    if(!currentRoles.includes(oldName)) return { ok:false, reason:'not-found' };
    if(currentRoles.includes(newName)) return { ok:false, reason:'duplicate' };

    const isDefault = DEFAULT_ROLES.includes(oldName);
    if(isDefault){
      const removedDefaultRoles = await getList(K_REMOVED_ROLES);
      if(!removedDefaultRoles.includes(oldName)){ removedDefaultRoles.push(oldName); await setList(K_REMOVED_ROLES, removedDefaultRoles); }
      const custom = await getList(K_ROLES);
      custom.push(newName);
      await setList(K_ROLES, custom);
    } else {
      const custom = await getList(K_ROLES);
      const idx = custom.indexOf(oldName);
      custom[idx] = newName;
      await setList(K_ROLES, custom);
    }

    const workers = await getWorkers();
    let workersChanged = false;
    workers.forEach(w=>{ if(w.role===oldName){ w.role=newName; workersChanged=true; } });
    if(workersChanged) await setList(K_WORKERS, workers);

    const templates = await getRoleTemplates();
    let templatesChanged = false;
    templates.forEach(t=>{ if(t.role===oldName){ t.role=newName; templatesChanged=true; } });
    if(templatesChanged) await setList(K_ROLE_TEMPLATES, templates);

    return { ok:true };
  }
  async function removeRole(name){
    if(name==='Other') return { ok:false, reason:'protected' };
    const workers = await getWorkers();
    const inUseCount = workers.filter(w=>w.role===name).length;
    if(inUseCount > 0) return { ok:false, reason:'in-use', count: inUseCount };

    const isDefault = DEFAULT_ROLES.includes(name);
    if(isDefault){
      const removedDefaultRoles = await getList(K_REMOVED_ROLES);
      if(!removedDefaultRoles.includes(name)){ removedDefaultRoles.push(name); await setList(K_REMOVED_ROLES, removedDefaultRoles); }
    } else {
      const custom = await getList(K_ROLES);
      await setList(K_ROLES, custom.filter(r=>r!==name));
    }
    // clean up any daily-task templates left for this role
    const templates = await getRoleTemplates();
    const remaining = templates.filter(t=>t.role!==name);
    if(remaining.length !== templates.length) await setList(K_ROLE_TEMPLATES, remaining);
    return { ok:true };
  }
