<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exprexa Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --ink-2:#1D2E52; --paper:#EEF1F6; --card:#FFFFFF;
    --amber:#F2A93B; --amber-dark:#C97F12; --green:#1F9D6B; --red:#D64545;
    --text:#1B2333; --muted:#67708A; --line:#DCE1EA; --radius:14px;
    --gold:#E3B341; --silver:#A9B3C4; --bronze:#C88A4E;
    --olive:#4B5320; --olive-dark:#3A4019; --khaki:#C3B091; --khaki-dark:#9C8B5E; --tan-paper:#F1EDDF;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; min-height:100dvh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  .app{max-width:680px; margin:0 auto; min-height:100vh; min-height:100dvh; background:var(--paper); display:flex; flex-direction:column;}
  .topbar{background:var(--ink); color:#fff; padding:18px 20px 16px; position:relative; flex-shrink:0;}
  .brand{display:flex; align-items:baseline; gap:10px; position:relative; z-index:1;}
  .brand .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;}
  .brand .tag{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber);
    letter-spacing:0.08em; text-transform:uppercase; border:1px solid rgba(242,169,59,0.5); padding:2px 6px; border-radius:4px;}
  .subline{font-size:12.5px; color:#B9C2DA; margin-top:6px; position:relative; z-index:1;}

  .tabs{display:flex; flex-wrap:wrap; background:var(--ink-2); position:relative; z-index:1; flex-shrink:0;}
  .tab{flex:1 1 auto; min-width:70px; padding:11px 6px; text-align:center; font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:12px; color:#A9B3CE; cursor:pointer; border-bottom:3px solid transparent;
    transition:color .15s, border-color .15s; user-select:none; white-space:nowrap; position:relative;}
  .tab.active{color:#fff; border-bottom-color:var(--amber);}
  .tab .dot{
    position:absolute; top:6px; right:10px; width:7px; height:7px; border-radius:50%; background:var(--red);
  }
  @media (max-width:480px){
    .topbar{padding:14px 16px 12px;}
    .brand .name{font-size:17px;}
    .subline{font-size:11.5px;}
    .tab{font-size:10.5px; padding:9px 4px; min-width:33.333%; flex:1 1 33.333%; white-space:normal; line-height:1.25;}
  }

  .content{flex:1; padding:20px 16px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  .card{background:var(--card); border-radius:var(--radius); padding:18px; border:1px solid var(--line); margin-bottom:14px;}
  .card h3{margin:0 0 14px; font-family:'Space Grotesk',sans-serif; font-size:15px; display:flex; align-items:center; gap:8px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber-dark); margin-bottom:6px;}
  .help{font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:12px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;}
  .field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14.5px; font-family:'Inter',sans-serif; background:#fff; color:var(--text);}
  .field input:focus, .field select:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .toggle-group{display:flex; gap:10px; margin-bottom:14px;}
  .toggle-opt{flex:1; text-align:center; padding:12px 8px; border-radius:10px; border:2px solid var(--line);
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; cursor:pointer; color:var(--muted); background:#fff;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:9px;
    border:none; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    transition:transform .08s, opacity .15s;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-primary{background:var(--ink); color:#fff; width:100%;}
  .btn-amber{background:var(--amber); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .btn-red{background:rgba(214,69,69,0.1); color:var(--red);}
  .btn-green{background:rgba(31,157,107,0.12); color:var(--green);}
  .btn-sm{padding:7px 12px; font-size:12.5px;}
  .btn-block{width:100%;}

  .rank-row{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card);
    border-radius:12px; border:1px solid var(--line); margin-bottom:8px;}
  .rank-medal{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:#fff; flex-shrink:0;}
  .medal-1{background:var(--gold);} .medal-2{background:var(--silver);} .medal-3{background:var(--bronze);}
  .medal-n{background:var(--line); color:var(--muted);}
  .rank-info{flex:1; min-width:0;}
  .rank-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px;}
  .rank-role{font-size:11.5px; color:var(--muted);}
  .rank-points{text-align:right; flex-shrink:0;}
  .rank-points .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--amber-dark);}
  .rank-points .l{font-size:10px; color:var(--muted); text-transform:uppercase;}

  .stat-strip{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--card); border-radius:10px; padding:12px 14px; border:1px solid var(--line);}
  .stat .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;}
  .stat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .worker-card{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:14px 16px; margin-bottom:10px;}
  .worker-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .worker-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .worker-role{font-size:12px; color:var(--muted);}
  .worker-balance{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--amber-dark);
    background:#FFF6E8; padding:3px 9px; border-radius:20px;}

  .target-item{padding:12px 0; border-top:1px solid var(--line);}
  .target-item:first-child{border-top:none; padding-top:6px;}
  .target-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .target-title{font-weight:600; font-size:13.5px;}
  .target-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .target-pts{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--amber-dark); white-space:nowrap;}
  .target-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .badge{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; padding:2px 8px;
    border-radius:20px; font-family:'IBM Plex Mono',monospace;}
  .badge-achieved{color:var(--green); background:rgba(31,157,107,0.12);}
  .badge-pending{color:var(--amber-dark); background:#FFF3DD;}
  .badge-rejected{color:var(--red); background:rgba(214,69,69,0.1);}

  select.select-worker{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:14.5px; margin-bottom:14px; background:#fff;}

  /* Worker checklist (bulk target assignment) */
  .worker-check-list{
    max-height:220px; overflow-y:auto; border:1.5px solid var(--line); border-radius:8px;
    padding:4px; margin-bottom:4px;
  }
  .worker-check-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; cursor:pointer;
  }
  .worker-check-item:hover{background:var(--paper);}
  .worker-check-item input[type=checkbox]{
    width:17px; height:17px; flex-shrink:0; accent-color:var(--ink); cursor:pointer; margin:0;
  }
  .worker-check-item .wc-name{
    flex:1; min-width:0; font-size:13.5px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .worker-check-item .wc-role{
    font-size:10.5px; color:var(--muted); background:var(--paper); border:1px solid var(--line);
    padding:3px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .worker-check-empty{padding:16px; text-align:center; color:var(--muted); font-size:12.5px;}

  .ledger-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13px;}
  .ledger-row:first-child{border-top:none;}
  .ledger-note{color:var(--text);}
  .ledger-date{font-size:11px; color:var(--muted); margin-top:1px;}
  .ledger-pts{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .pts-earn{color:var(--green);} .pts-redeem{color:var(--red);}

  .empty{text-align:center; padding:36px 16px; color:var(--muted); font-size:13px;}
  footer.note{text-align:center; font-size:11px; color:var(--muted); padding:16px 20px 30px;}
  .toprow{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .toprow h2{font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0;}

  /* Submission review card */
  .sub-card{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:14px; margin-bottom:12px;}
  .sub-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .sub-title{font-weight:600; font-size:13.5px;}
  .sub-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .sub-photo{width:100%; max-height:260px; object-fit:cover; border-radius:10px; border:1px solid var(--line); margin-bottom:10px; display:block; cursor:pointer;}
  .sub-note{font-size:13px; color:var(--text); background:var(--paper); padding:8px 10px; border-radius:8px; margin-bottom:10px;}
  .sub-actions{display:flex; gap:8px;}

  /* Worker portal */
  .worker-shell{max-width:440px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}
  .worker-hero{background:var(--ink); color:#fff; padding:30px 22px 22px; position:relative; overflow:hidden; flex-shrink:0;}
  .worker-hero::after{content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--ink-2) 10px 20px);}
  .worker-hero .co{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .worker-hero .sub{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--amber); margin-top:4px;}
  .worker-body{flex:1; padding:22px 18px 40px;}

  .pick-card{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px;
    margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .pick-card:active{transform:scale(0.99);}
  .pick-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .pick-role{font-size:12px; color:var(--muted);}

  .points-hero{background:var(--card); border-radius:14px; padding:18px; text-align:center; border:1px solid var(--line); margin-bottom:16px;}
  .points-hero .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:32px; color:var(--amber-dark);}
  .points-hero .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .file-drop{border:1.5px dashed var(--line); border-radius:10px; padding:14px; text-align:center; margin-bottom:10px; background:#fafbfd;}
  .file-drop input{margin-top:8px;}
  .thumb-preview{max-width:100%; max-height:180px; border-radius:8px; margin-top:10px; display:none;}

  a.backlink{font-size:12px; color:var(--muted); text-decoration:none;}

  /* Badges — military dog-tag / patch style */
  .badge-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:6px;}
  .badge-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    background:var(--olive); color:var(--khaki);
    padding:4px 10px 4px 7px; border-radius:4px;
    border:1px solid var(--olive-dark);
    border-left:3px solid var(--khaki);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .badge-chip.locked{
    background:var(--paper); color:var(--muted); border-color:var(--line);
    border-left-color:var(--line); opacity:0.75; box-shadow:none;
  }
  .badge-chip .em{font-size:13px; filter:grayscale(0.15);}
  .rank-badges{display:flex; gap:4px; margin-top:4px;}
  .rank-badges .em{
    font-size:14px; background:#FFF6E8; border:1px solid var(--amber);
    border-radius:5px; padding:2px 5px; display:inline-flex;
  }
  .rank-title{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--olive);
    background:var(--tan-paper); border:1px solid var(--khaki-dark);
    padding:3px 10px; border-radius:3px; margin-top:6px;
  }

  .week-card{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 100%);
    color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .week-card::after{
    content:""; position:absolute; top:-20px; right:-20px; width:100px; height:100px; border-radius:50%;
    background:radial-gradient(circle, rgba(242,169,59,0.25) 0%, transparent 70%);
  }
  .week-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber); margin-bottom:10px; position:relative; z-index:1;}
  .week-stats{display:flex; gap:18px; position:relative; z-index:1;}
  .week-stat .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;}
  .week-stat .l{font-size:10.5px; color:#B9C2DA; text-transform:uppercase; letter-spacing:0.04em; margin-top:1px;}
  .week-leader{margin-top:12px; font-size:12.5px; color:#DCE2F0; position:relative; z-index:1;}
  .week-leader strong{color:#fff;}

  /* Log tab + lightbox */
  .log-item{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:12px; margin-bottom:10px; display:flex; gap:12px;}
  .logtable{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .logtable th{background:var(--paper); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); text-align:left; padding:9px 10px;}
  .logtable td{padding:9px 10px; border-top:1px solid var(--line); font-size:12.5px; vertical-align:middle;}
  .logtable tr:first-child td{border-top:none;}
  .log-table-thumb{width:38px; height:38px; border-radius:8px; object-fit:cover; cursor:pointer; border:1px solid var(--line); display:block;}
  .log-thumb{width:64px; height:64px; border-radius:8px; object-fit:cover; flex-shrink:0; cursor:pointer; border:1px solid var(--line); background:#eee;}
  .log-body{flex:1; min-width:0;}
  .log-title{font-weight:600; font-size:13.5px;}
  .log-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .log-note{font-size:12.5px; color:var(--text); margin-top:4px;}

  .lightbox{position:fixed; inset:0; background:rgba(10,14,26,0.88); display:none; align-items:center; justify-content:center; z-index:1000; padding:24px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:88vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .lightbox-close{position:absolute; top:18px; right:20px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<div id="fb-status" style="position:fixed;bottom:0;left:0;right:0;background:#D64545;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:center;padding:6px;display:none;z-index:999;"></div>
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <img id="lightbox-img" src="">
</div>

<script>
(function(){

  function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function pad(n){return n<10?'0'+n:''+n;}
  // Daily targets reset at midnight Malaysia time (Asia/Kuala_Lumpur), no
  // matter what timezone the admin's or worker's own device is set to.
  function fmtDateInTZ(date, tz){
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(date);
    const y = parts.find(p=>p.type==='year').value;
    const m = parts.find(p=>p.type==='month').value;
    const d = parts.find(p=>p.type==='day').value;
    return `${y}-${m}-${d}`;
  }
  function todayStr(){ return fmtDateInTZ(new Date(), 'Asia/Kuala_Lumpur'); }
  function todayStrFromDate(d){ return fmtDateInTZ(d, 'Asia/Kuala_Lumpur'); }
  // Daily tasks run on their own window, not a plain midnight boundary:
  // today's batch opens at 7:00am Malaysia time and expires at 9:00pm the
  // same day — leaving a deliberate gap overnight (9pm–7am) with no active
  // daily tasks at all, regardless of what timezone anyone's device is set to.
  // ---- Performance scoring ----
  // Everything is a RATE, never a raw count — someone assigned more tasks
  // shouldn't score higher for that alone. Each part is 0-100 and they're
  // combined by weight.
  const SCORE_WEIGHTS = {
    reliability: 35,   // approved daily tasks vs assigned
    failures:    20,   // penalty for missed deadlines
    quality:     20,   // share accepted first time — weighted above speed so
                       // rushing a sloppy submission costs more than it gains
    promptness:  15,   // submitted before the deadline gets close
    challenger:  10    // challenger tasks completed vs accepted
  };
  const SCORE_PERIODS = [
    { key:'week',   label:'This Week',  days:7   },
    { key:'month',  label:'This Month', days:30  },
    { key:'season', label:'Season',     days:null }
  ];
  const DAILY_OPEN_MINUTES = 7 * 60;   // 7:00am
  const DAILY_EXPIRE_MINUTES = 21 * 60; // 9:00pm
  function nowMYParts(){
    const now = new Date();
    const dateStr = fmtDateInTZ(now, 'Asia/Kuala_Lumpur');
    const timeParts = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Kuala_Lumpur', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(now);
    const hour = parseInt(timeParts.find(p=>p.type==='hour').value, 10);
    const minute = parseInt(timeParts.find(p=>p.type==='minute').value, 10);
    return { dateStr, minutesOfDay: hour*60 + minute };
  }
  // Weekly tasks mirror the daily flow but on a 7-day cycle: the batch opens
  // Monday 7:00am Malaysia time and expires Sunday 9:00pm the same week.
  // Each week's batch is stamped with its Monday date, which acts as the
  // week's identity — the same role a task's createdAt date plays for dailies.
  const WEEK_OPEN_MINUTES = 7 * 60;    // Monday 7:00am
  const WEEK_EXPIRE_MINUTES = 21 * 60; // Sunday 9:00pm
  // 0 = Sunday ... 6 = Saturday, evaluated in Malaysia time rather than the
  // device's own timezone.
  function mondayOfWeekMY(dateStr){
    // dateStr is 'YYYY-MM-DD' in MY time; treat as UTC noon to dodge any
    // DST/offset edge cases, then walk back to that week's Monday.
    const d = new Date(dateStr + 'T12:00:00Z');
    const dow = d.getUTCDay();             // 0=Sun, 1=Mon ... 6=Sat
    const backToMonday = dow === 0 ? 6 : dow - 1; // Sunday belongs to the week that started 6 days ago
    d.setUTCDate(d.getUTCDate() - backToMonday);
    return d.toISOString().slice(0,10);
  }
  function dayOfWeekMY(dateStr){
    return new Date(dateStr + 'T12:00:00Z').getUTCDay(); // 0=Sun ... 6=Sat
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // NOTE: this is a lightweight access gate, not bank-grade security — there's
  // no real backend server here, so the hash is compared client-side against
  // data stored in Firestore. Good enough to stop casual misuse; not a
  // substitute for real authentication if this ever needs to resist a
  // determined attacker.
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function parseHash(){
    const h = window.location.hash.replace(/^#/, '');
    const parts = h.split('&');
    const out = {mode: parts[0] || ''};
    parts.slice(1).forEach(p=>{

      out[k] = decodeURIComponent(v||'');
    });

  // ---- image compression: File -> compressed base64 JPEG (stored directly in Firestore) ----
  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Submissions carry embedded proof photos, so — unlike every other list
  // above, which lives as one JSON array inside a single Firestore document —
  // each submission gets its OWN document in a real collection. Firestore
  // caps every document at 1 MiB; cramming every photo ever submitted into
  // one shared array would hit that ceiling after only a handful of photos.
  // One document per submission means that limit applies per-photo instead,
  // which it will never come close to.
  const SUBS_COLLECTION = 'perf_submissions_docs';
  let subsMigrated = false;
  async function migrateOldSubs(){
    try{
      const oldDoc = await db.collection('appdata').doc('perf-submissions').get();
      if(!oldDoc.exists) return;
      const oldList = oldDoc.data().value || [];
      if(oldList.length === 0) return;
      for(const sub of oldList){
        await db.collection(SUBS_COLLECTION).doc(sub.id).set(sub);
      }
      // Clear the old array so this migration only ever copies each submission once.
      await db.collection('appdata').doc('perf-submissions').set({ value: [], migrated: true });
    }catch(e){
      console.error('Submission migration failed (will retry next load):', e);
    }
  }
  // Most places that use submissions only need pending ones (to check what's
  // awaiting review) or one worker's own (to show their status). Reading the
  // WHOLE collection for those wastes reads that scale with every submission
  // ever created — these scoped queries fetch only what's actually needed.
  // Cursor-paged read for the admin Log. Fetches one page at a time instead
  // of pulling 500 submissions (each carrying an embedded photo) on every
  // visit. Ordered by submittedAt only — deliberately no where() clause, so
  // it never needs a composite index doing setup in the Firestore console.
  const LOG_PAGE_SIZE = 50;
  async function getSubsPage(afterDoc){
    if(!subsMigrated){ await migrateOldSubs(); subsMigrated = true; }
    try{
      let q = db.collection(SUBS_COLLECTION).orderBy('submittedAt', 'desc');
      if(afterDoc) q = q.startAfter(afterDoc);
      const snap = await q.limit(LOG_PAGE_SIZE).get();
      return {
        rows: snap.docs.map(d=>d.data()),
        lastDoc: snap.docs.length ? snap.docs[snap.docs.length-1] : null,
        done: snap.docs.length < LOG_PAGE_SIZE
      };
    }catch(e){
      showFbError('Could not load submissions: ' + e.message);
      return { rows: [], lastDoc: null, done: true };
    }
  }

  // All targets live in one document, so a plain read-modify-write can clobber
  // a change someone else made in between — an approval being overwritten by a
  // page that started generating before it happened, for example. This applies
  // a set of deltas inside a transaction against whatever is current, instead
  // of overwriting the array wholesale.
  //   removeIds     – target ids to drop
  //   statusChanges – { id: { status, failedAt?, achievedAt? } }
  //   fieldChanges  – { id: { ...fields to merge } }
  //   add           – new target objects to append
  async function applyTargetDeltas({ removeIds = [], statusChanges = {}, fieldChanges = {}, add = [] }){
    const ref = db.collection('appdata').doc(K_TARGETS);
    const rm = new Set(removeIds);
    try{
      await db.runTransaction(async tx => {
        const doc = await tx.get(ref);
        const current = doc.exists ? (doc.data().value || []) : [];
        const kept = current.filter(t => !rm.has(t.id)).map(t => {
          let out = t;
          if(statusChanges[t.id]) out = { ...out, ...statusChanges[t.id] };
          if(fieldChanges[t.id]) out = { ...out, ...fieldChanges[t.id] };
          return out;
        });
        const existingIds = new Set(kept.map(t => t.id));
        add.forEach(t => { if(!existingIds.has(t.id)) kept.push(t); });
        tx.set(ref, { value: kept });
      });
      return true;
    }catch(e){
      showFbError('Could not save target changes: ' + e.message);
      return false;
    }
  }

  // ---- Completed-target archive ----
  // Unlike points and fails, targets can't be summarised away: the daily

  // they're old enough they're rolled into per-worker counts and dropped from
  // the live array. Everything that counts achievements adds the archive back
  // in, so totals and badges are unaffected.
  const K_TARGET_ARCHIVE = 'perf-target-archive';
  const ARCHIVE_AFTER_DAYS = 30;
  async function getTargetArchive(){
    try{
      const doc = await db.collection('appdata').doc(K_TARGET_ARCHIVE).get();

  // Marks a target as having had at least one submission — protects it from
  // ever auto-failing later, even if that submission gets rejected. Without
  // this, a worker who submitted before the deadline but got rejected close
  // to (or after) the cutoff, with no time to fix and resubmit, would still
  // get an automatic fail despite having genuinely attempted the task in time.
  // Re-reads a target's CURRENT state straight from Firestore right before a
  // submission is saved. The worker's dashboard is a snapshot from whenever it
  // last rendered — if they leave the page open while an admin approves their
  // work (or they submit from two devices), the stale page would happily send
  // a second submission for an already-finished task. Returns null if the
  // submission is fine, or a reason string if it should be blocked.
  async function blockSubmissionReason(targetId){
    try{
      const targets = await getTargets();
      const t = targets.find(x=>x.id===targetId);
      if(!t) return 'That task no longer exists — refreshing your list.';
      if(t.status === 'achieved') return 'This task was already approved — nothing more to submit.';
      if(t.status === 'failed') return 'This task has already closed and can no longer be submitted.';
      const pending = await getPendingSubs();
      if(pending.some(s=>s.targetId===targetId)) return 'You already have a submission awaiting review for this task.';
      return null;
    }catch(e){
      // If the check itself fails we let the submission through rather than
      // blocking real work over a flaky connection — a duplicate is a much
      // smaller problem than a worker unable to submit at all.
      console.error('Freshness check failed, allowing submission:', e);
      return null;
    }
  }

  // ---- Points totals cache ----
  // The ledger grows all season, and almost every screen only needs each
  // worker's totals — not the raw entries. Downloading the whole history to
  // add up numbers is what made dashboards and leaderboards slow. This keeps a
  // small summary document (a few numbers per worker) that reads instead.
  //
  // It is a CACHE, never the source of truth: the ledger stays authoritative,
  // and "Rebuild totals" in the Rewards tab recomputes this from scratch if it
  // ever drifts.
  const K_TOTALS = 'perf-totals';
  function computeTotals(ledger){
    const t = {};
    for(let i=0; i<ledger.length; i++){
      const l = ledger[i];
      const e = t[l.workerId] = t[l.workerId] || { earned:0, balance:0, reachedAt:'' };
      if(l.type === 'earned'){
        e.earned += l.points || 0;
        e.balance += l.points || 0;
        // Same tie-break key the leaderboard uses: timestamp, then ledger
        // position so same-instant entries still order deterministically.
        const key = (l.at || (l.date ? l.date+'T00:00:00.000Z' : '')) + '#' + String(i).padStart(8,'0');
        if(key > e.reachedAt) e.reachedAt = key;
      } else {
        e.balance -= l.points || 0;
      }
    }
    return { byWorker: t, entryCount: ledger.length };
  }
  async function getTotals(){
    const doc = await db.collection('appdata').doc(K_TOTALS).get();
    return doc.exists ? doc.data().value : null;
  }
  // Reads the cache, rebuilding it from the ledger if it's missing. Returns
  // null only if even the rebuild fails, so callers can fall back safely.
  async function getTotalsEnsured(){
    try{
      const cached = await getTotals();
      if(cached && cached.byWorker) return cached;
      const ledger = await getLedger();
      const fresh = computeTotals(ledger);
      await db.collection('appdata').doc(K_TOTALS).set({ value: fresh });
      return fresh;
    }catch(e){
      console.error('Totals unavailable, falling back to full ledger:', e);
      return null;
    }
  }
  async function rebuildTotals(){
    const ledger = await getLedger();
    const fresh = computeTotals(ledger);
    await db.collection('appdata').doc(K_TOTALS).set({ value: fresh });
    return fresh;
  }
  // Single place that appends to the ledger, so the cache can never be
  // updated in one code path and forgotten in another.
  // Appends inside a transaction. A plain read-modify-write on this single
  // document loses entries when two approvals land close together — the
  // second read happens before the first write, and one award vanishes even
  // though its task shows as approved.
  async function appendLedger(entries){
    if(!entries || entries.length === 0) return true;
    const ref = db.collection('appdata').doc(K_LEDGER);
    let ledger = null, startIdx = 0;
    try{
      await db.runTransaction(async tx => {
        const doc = await tx.get(ref);
        const current = doc.exists ? (doc.data().value || []) : [];
        // Guard against a retry adding the same entry twice.
        const existing = new Set(current.map(l => l.id));
        const toAdd = entries.filter(e => !existing.has(e.id));
        startIdx = current.length;
        ledger = current.concat(toAdd);
        tx.set(ref, { value: ledger });
      });
    }catch(e){
      showFbError('Could not award points: ' + e.message);
      return false;
    }
    try{
      const cached = await getTotals();
      const t = (cached && cached.byWorker) ? cached : computeTotals(ledger.slice(0, startIdx));
      entries.forEach((l, n)=>{
        const e = t.byWorker[l.workerId] = t.byWorker[l.workerId] || { earned:0, balance:0, reachedAt:'' };
        if(l.type === 'earned'){
          e.earned += l.points || 0; e.balance += l.points || 0;
          const key = (l.at || (l.date ? l.date+'T00:00:00.000Z' : '')) + '#' + String(startIdx + n).padStart(8,'0');
          if(key > e.reachedAt) e.reachedAt = key;
        } else { e.balance -= l.points || 0; }
      });
      t.entryCount = ledger.length;
      await db.collection('appdata').doc(K_TOTALS).set({ value: t });
    }catch(e){
      console.error('Could not update totals cache — rebuild from the Rewards tab:', e);
    }
    return true;
  }

  // Wipes points and task history for a fresh season, while leaving every
  // piece of configuration (workers, roles, daily task templates, challenger task
  // definitions, badges, rewards catalog) exactly as it was.
  async function resetSeason(){
    try{
      await setList(K_LEDGER, []);
      await db.collection('appdata').doc(K_TOTALS).set({ value: { byWorker:{}, entryCount:0 } });
      await db.collection('appdata').doc(K_TARGET_ARCHIVE).set({ value: { byWorker:{}, archivedCount:0 } });
      await setList(K_TARGETS, []);
      await setFailsAndCounts([]);
      // Challenger tasks are wiped entirely, not just reopened — a new season
      // starts with a clean slate rather than inheriting last season's list.
      await setList(K_SIDEQUESTS, []);

      const snap = await db.collection(SUBS_COLLECTION).get();
      await Promise.all(snap.docs.map(d => d.ref.delete()));

      return true;
    }catch(e){
      showFbError('Could not reset the season: ' + e.message);
      return false;
    }
  }

  // Same idea as resetSeason(), but scoped to a single worker — everyone
  // else's points, submissions, targets, and fails are left untouched.
  async function resetWorker(workerId){
    try{
      const ledger = await getLedger();
      await setList(K_LEDGER, ledger.filter(l=>l.workerId!==workerId));
      await rebuildTotals(); // entry positions shift after a removal, so recompute rather than patch
      try{
        const arch = await getTargetArchive();
        if(arch.byWorker[workerId]){
          delete arch.byWorker[workerId];
          await db.collection('appdata').doc(K_TARGET_ARCHIVE).set({ value: arch });
        }
      }catch(e){ console.error('Could not clear archived targets for worker:', e); }

      const targets = await getTargets();
      const myQuestIds = new Set(targets.filter(t=>t.workerId===workerId && t.sideQuestId).map(t=>t.sideQuestId));
      await setList(K_TARGETS, targets.filter(t=>t.workerId!==workerId));

      const fails = await getFails();
      await setFailsAndCounts(fails.filter(f=>f.workerId!==workerId));

      if(myQuestIds.size > 0){
        const quests = await getSideQuests();
        let questsChanged = false;
        quests.forEach(q=>{ if(myQuestIds.has(q.id) && q.active===false){ q.active = true; questsChanged = true; } });
        if(questsChanged) await setList(K_SIDEQUESTS, quests);
      }

      const snap = await db.collection(SUBS_COLLECTION).where('workerId','==', workerId).get();
      await Promise.all(snap.docs.map(d => d.ref.delete()));

      return true;
    }catch(e){
      showFbError('Could not reset this worker: ' + e.message);
      return false;
    }
  }
  // Everything resetWorker() does, plus the worker record itself — name, PIN,
  // role, join date, all of it. Completely irreversible.
  async function deleteWorkerCompletely(workerId){
    const ok = await resetWorker(workerId);
    if(!ok) return false;
    try{
      const workers = await getWorkers();
      await setList(K_WORKERS, workers.filter(w=>w.id!==workerId));
      return true;
    }catch(e){
      showFbError('Could not delete this worker: ' + e.message);
      return false;
    }
  }

  const DEFAULT_ROLES = [
    'Driver', 'Attendant', 'Warehouse Keeper', 'Warehouse Admin', 'Warehouse Foreman',
    'Seafreight Team', 'Airfreight Team', 'Forwarding Team', 'Airport Foreman',
    'E-com Admin', 'Seafreight Admin', 'Airfreight Admin', 'Forwarding Admin', 'Other'
  ];
  const K_ROLES = 'perf-custom-roles'; // roles the admin has added, beyond the defaults
  const K_REMOVED_ROLES = 'perf-removed-default-roles'; // built-in role NAMES the admin renamed away from or removed
  // 'Other' is the one protected role — it's the generic fallback bucket, so
  // it always exists and can't be renamed or removed. Every other role,
  // default or custom, can be.
  async function getRoles(){
    const [custom, removedDefaultRoles] = await Promise.all([getList(K_ROLES), getList(K_REMOVED_ROLES)]);
    const removedSet = new Set(removedDefaultRoles);
    const merged = DEFAULT_ROLES.filter(r => r!=='Other' && !removedSet.has(r));
    custom.forEach(r=>{ if(!merged.includes(r)) merged.push(r); });
    merged.push('Other'); // keep 'Other' last, always
    return merged;
  }
  async function addRole(name){
    if(name==='Other') return false;
    const current = await getRoles();
    if(current.includes(name)) return false;
    const custom = await getList(K_ROLES);
    custom.push(name);
    return setList(K_ROLES, custom);

  // Renaming propagates to every worker and role template using it. Renaming
  // a built-in role also starts tracking the new name as a regular
  // (editable) role.
  async function renameRole(oldName, newName){
    if(oldName==='Other') return { ok:false, reason:'protected' };
    if(newName==='Other') return { ok:false, reason:'reserved' };
    const currentRoles = await getRoles();
    if(!currentRoles.includes(oldName)) return { ok:false, reason:'not-found' };
    if(currentRoles.includes(newName)) return { ok:false, reason:'duplicate' };

    const isDefault = DEFAULT_ROLES.includes(oldName);
    if(isDefault){
      const removedDefaultRoles = await getList(K_REMOVED_ROLES);
      if(!removedDefaultRoles.includes(oldName)){ removedDefaultRoles.push(oldName); await setList(K_REMOVED_ROLES, removedDefaultRoles); }
      const custom = await getList(K_ROLES);
      custom.push(newName);
      await setList(K_ROLES, custom);
    } else {
      const custom = await getList(K_ROLES);
      const idx = custom.indexOf(oldName);
      custom[idx] = newName;
      await setList(K_ROLES, custom);
    }

    const workers = await getWorkers();
    let workersChanged = false;
    workers.forEach(w=>{ if(w.role===oldName){ w.role=newName; workersChanged=true; } });
    if(workersChanged) await setList(K_WORKERS, workers);

    const templates = await getRoleTemplates();
    let templatesChanged = false;
    templates.forEach(t=>{ if(t.role===oldName){ t.role=newName; templatesChanged=true; } });
    if(templatesChanged) await setList(K_ROLE_TEMPLATES, templates);

    return { ok:true };
  }
  async function removeRole(name){
    if(name==='Other') return { ok:false, reason:'protected' };
    const workers = await getWorkers();
    const inUseCount = workers.filter(w=>w.role===name).length;
    if(inUseCount > 0) return { ok:false, reason:'in-use', count: inUseCount };

    const isDefault = DEFAULT_ROLES.includes(name);
    if(isDefault){
      const removedDefaultRoles = await getList(K_REMOVED_ROLES);
      if(!removedDefaultRoles.includes(name)){ removedDefaultRoles.push(name); await setList(K_REMOVED_ROLES, removedDefaultRoles); }
    } else {
      const custom = await getList(K_ROLES);
      await setList(K_ROLES, custom.filter(r=>r!==name));
    }
    // clean up any daily-task templates left for this role
    const templates = await getRoleTemplates();
    const remaining = templates.filter(t=>t.role!==name);
    if(remaining.length !== templates.length) await setList(K_ROLE_TEMPLATES, remaining);
    return { ok:true };
  }

  // ---- daily auto-renewal: create today's role-based targets for any worker missing them ----
  async function generateDailyTargets(){
    // Every read here feeds logic that can overwrite the saved targets list.
    // If Firestore fails to load any of these (network blip, page loading
    // before auth is ready, etc.), we must NOT proceed — treating a failed
    // read as "genuinely empty" risks wiping real data. So: fail loudly and
    // do nothing this run, rather than guess.
    let workers, templates, weeklyTemplates, targets, subs, dismissed, existingFails, closures;
    try{
      [workers, templates, weeklyTemplates, targets, subs, dismissed, existingFails, closures] =
        await Promise.all([getListStrict(K_WORKERS), getListStrict(K_ROLE_TEMPLATES), getListStrict(K_WEEKLY_TEMPLATES), getListStrict(K_TARGETS), getPendingSubsStrict(), getListStrict(K_DISMISSED), getListStrict(K_FAILS), getListStrict(K_HOLIDAY_CLOSURES)]);
    }catch(e){
      showFbError('Could not load data from Firebase — daily tasks were not updated this load: ' + e.message);
      return;
    }
    const dismissedKeys = new Set(dismissed.map(d=> d.workerId + '::' + d.templateId));
    const newFails = [];
    const library = templates; // role-template list is now plain admin-managed data — no auto re-seeding

    const { dateStr: today, minutesOfDay } = nowMYParts();
    let targetsChanged = false;

    // A daily task is stale (and should fail) once it's either from an
    // earlier date entirely, or from today but the clock has passed the
    // 9pm expiry — but keep any that still have a submission awaiting
    // admin review. Each one dropped here is logged as a fail for that worker.
    //
    // The everSubmitted protection is scoped to the task's OWN day: if a
    // worker submitted and got rejected, they get the rest of that day to
    // fix and resubmit without risk of failing. Once the day rolls over,
    // normal expiry applies — otherwise a rejected-and-abandoned task would
    // linger forever, never failing and never going away.
    const pendingTargetIds = new Set(subs.filter(s=>s.status==='pending').map(s=>s.targetId));
    const thisWeekMonday = mondayOfWeekMY(today);
    const todayDow = dayOfWeekMY(today); // 0=Sun ... 6=Sat
    let workingTargets = targets.filter(t=>{
      const isOlderDate = t.isDaily && t.status==='active' && t.createdAt < today;
      const isTodayPastExpiry = t.isDaily && t.status==='active' && t.createdAt===today && minutesOfDay >= DAILY_EXPIRE_MINUTES;
      const stillProtected = t.everSubmitted && t.createdAt === today; // same-day grace only
      if((isOlderDate || isTodayPastExpiry) && !hasPendingWork(t) && !stillProtected){
        targetsChanged = true;
        newFails.push({ id: uid(), workerId: t.workerId, title: t.title, points: t.points, type: 'daily', taskDate: t.createdAt, targetId: t.id, templateId: t.templateId || null, requiresPhoto: t.requiresPhoto !== false, failedAt: new Date().toISOString(), reason: 'not completed before the 9pm daily deadline' });
        dRemove.push(t.id);
        return false; // drop it — window's closed, target wasn't completed
      }

      // Weekly tasks mirror the same rules on a 7-day cycle: they fail once
      // their week has rolled over, or on Sunday after the 9pm cutoff. Same
      // same-week grace applies to anything that was submitted and rejected.
      const isOlderWeek = t.isWeekly && t.status==='active' && t.weekOf < thisWeekMonday;
      const isThisWeekPastExpiry = t.isWeekly && t.status==='active' && t.weekOf === thisWeekMonday
        && todayDow === 0 && minutesOfDay >= WEEK_EXPIRE_MINUTES; // Sunday after 9pm
      const weeklyProtected = t.everSubmitted && t.weekOf === thisWeekMonday;
      if((isOlderWeek || isThisWeekPastExpiry) && !hasPendingWork(t) && !weeklyProtected){
        targetsChanged = true;
        newFails.push({ id: uid(), workerId: t.workerId, title: t.title, points: t.points, type: 'weekly', taskDate: t.weekOf, targetId: t.id, templateId: t.templateId || null, weekOf: t.weekOf, requiresPhoto: t.requiresPhoto !== false, failedAt: new Date().toISOString(), reason: 'not completed before the Sunday 9pm weekly deadline' });
        dRemove.push(t.id);
        return false;
      }
      return true;
    });

    // expire any accepted challenger tasks past their deadline (admin-set expiry
    // hours, counted from when the worker accepted) — stops further
    // submission and logs a fail, but keeps the record visible as 'failed'
    // rather than silently deleting it. Same scoping applies: a rejected
    // challenger task is protected only while its own deadline hasn't passed.
    const nowMs = Date.now();
    workingTargets.forEach(t=>{
      if(t.sideQuestId && t.status==='active' && t.expiresAt && !pendingTargetIds.has(t.id) && new Date(t.expiresAt).getTime() < nowMs){
        t.status = 'failed';
        t.failedAt = new Date().toISOString();
        targetsChanged = true;
        dStatus[t.id] = { status:'failed', failedAt: t.failedAt };
        newFails.push({ id: uid(), workerId: t.workerId, title: t.title, points: t.points, type: 'sidequest', targetId: t.id, sideQuestId: t.sideQuestId, requiresPhoto: t.requiresPhoto !== false, failedAt: t.failedAt, reason: 'expired before completion' });
      }
    });

    // generate today's targets for each worker, but only once the 7am
    // opening time has arrived — between midnight and 7am, the date has
    // already rolled over but the new batch deliberately isn't available yet.
    // Roles marked closed for today (e.g. a public holiday) are skipped
    // entirely — no daily tasks generated for anyone in that role today.
    const closedRolesToday = new Set();
    closures.filter(c=>c.date===today).forEach(c=> (c.roles||[]).forEach(r=>closedRolesToday.add(r)));

    const dailyWindowOpen = minutesOfDay >= DAILY_OPEN_MINUTES && minutesOfDay < DAILY_EXPIRE_MINUTES;
    if(dailyWindowOpen){
      workers.forEach(w=>{
        if(closedRolesToday.has(w.role)) return; // office/role closed today — nothing to generate
        const roleTemplates = library.filter(t=>t.role === w.role);
        roleTemplates.forEach(t=>{
          if(dismissedKeys.has(w.id + '::' + t.id)) return; // admin permanently removed this task for this worker
          const exists = workingTargets.some(tg=> tg.workerId===w.id && tg.templateId===t.id && tg.createdAt===today);
          if(!exists){
            const nt = {
              id: uid(), workerId: w.id, title: t.title, points: t.points, period: 'Daily',
              status: 'active', createdAt: today, templateId: t.id, isDaily: true,
              requiresPhoto: t.requiresPhoto !== false
            };
            workingTargets.push(nt); dAdd.push(nt);
            targetsChanged = true;
          }
        });
      });
    }

    // Weekly targets are assigned to specific heads by name, not by role —
    // they generate once per week, from Monday 7:00am onwards. Generating on
    // any day of the week (not just Monday) means a quiet Monday where nobody
    // opened the app still gets everyone their tasks.
    const weeklyWindowOpen = !(todayDow === 1 && minutesOfDay < WEEK_OPEN_MINUTES) // not before Mon 7am
      && !(todayDow === 0 && minutesOfDay >= WEEK_EXPIRE_MINUTES);                 // not after Sun 9pm
    if(weeklyWindowOpen){
      weeklyTemplates.forEach(t=>{
        const w = workers.find(x=>x.id === t.workerId);
        if(!w || !w.isHead) return;              // head was removed or demoted
        if(closedRolesToday.has(w.role)) return; // their role is closed today
        if(dismissedKeys.has(w.id + '::' + t.id)) return;
        const exists = workingTargets.some(tg=> tg.workerId===w.id && tg.templateId===t.id && tg.weekOf===thisWeekMonday);
        if(!exists){
          const nt = {
            id: uid(), workerId: w.id, title: t.title, points: t.points, period: 'Weekly',
            status: 'active', createdAt: today, weekOf: thisWeekMonday, templateId: t.id, isWeekly: true,
            requiresPhoto: t.requiresPhoto !== false
          };
          workingTargets.push(nt); dAdd.push(nt);
          targetsChanged = true;
        }
      });
    }

    // Safety net: collapse any duplicate ACTIVE daily targets for the same
    // worker+template down to just the most recent one. This can happen if
    // this function runs twice in quick succession (two tabs open, or a
    // date-boundary edge case) before the first write has landed.
    const seenKeys = new Set();
    const deduped = [];
    // Which copy survives matters: if the one carrying a worker's submission
    // is dropped, that submission is orphaned and the surviving copy has
    // nothing protecting it from failing at the deadline. Copies with real
    // work attached are kept ahead of untouched ones — createdAt alone can't
    // separate same-day duplicates, since their dates are identical.
    const hasWork = t => pendingTargetIds.has(t.id) || !!t.everSubmitted;
    workingTargets
      .slice()
      .sort((a,b)=>{
        const wa = hasWork(a) ? 0 : 1, wb = hasWork(b) ? 0 : 1;
        if(wa !== wb) return wa - wb;
        return b.createdAt.localeCompare(a.createdAt);
      })
      .forEach(t=>{
        if(t.isDaily && t.status==='active' && t.templateId){
          const dupKey = 'd::' + t.workerId + '::' + t.templateId;
          // Never discard a copy someone has actually submitted against.
          if(seenKeys.has(dupKey) && !hasWork(t)){ targetsChanged = true; dRemove.push(t.id); return; }
          seenKeys.add(dupKey);
        }
        // Same protection for weeklies, scoped per week rather than per day.
        if(t.isWeekly && t.status==='active' && t.templateId){
          const dupKey = 'w::' + t.workerId + '::' + t.templateId + '::' + t.weekOf;
          if(seenKeys.has(dupKey) && !hasWork(t)){ targetsChanged = true; dRemove.push(t.id); return; }
          seenKeys.add(dupKey);
        }
        deduped.push(t);
      });
    workingTargets = deduped;

    // Roll long-finished targets into the archive so the live array stops
    // growing all season. Only 'achieved' ones past the cutoff are moved —
    // active, pending and failed targets are all still in use.
    const archiveCutoff = dateStrDaysAgoMY(ARCHIVE_AFTER_DAYS);
    const toArchive = workingTargets.filter(t =>
      t.status === 'achieved' && t.achievedAt && t.achievedAt < archiveCutoff
    );
    if(toArchive.length > 0){
      try{
        const archive = await getTargetArchive();
        toArchive.forEach(t=>{
          const e = archive.byWorker[t.workerId] = archive.byWorker[t.workerId] || { achieved:0, sideQuests:0 };
          e.achieved++;
          if(t.sideQuestId) e.sideQuests++;
        });
        archive.archivedCount = (archive.archivedCount || 0) + toArchive.length;
        await db.collection('appdata').doc(K_TARGET_ARCHIVE).set({ value: archive });
        const archivedIds = new Set(toArchive.map(t=>t.id));
        workingTargets = workingTargets.filter(t => !archivedIds.has(t.id));
        toArchive.forEach(t=> dRemove.push(t.id));
        targetsChanged = true;
      }catch(e){
        console.error('Could not archive completed targets:', e);
      }
    }

    // Merge rather than overwrite, so anything approved while this was running
    // survives.
    if(targetsChanged) await applyTargetDeltas({ removeIds: dRemove, statusChanges: dStatus, add: dAdd });
    if(newFails.length>0) await setFailsAndCounts(existingFails.concat(newFails));
  }

  // Score one worker over a period. Returns null when there's nothing to
  // judge — a new starter shouldn't be given a misleading 0 or 100.
  function scoreWorker(workerId, { targets, fails, subs, cutoffDate }){
    const inPeriod = d => !cutoffDate || (d && d >= cutoffDate);
    const mine = targets.filter(t => t.workerId === workerId);
    const mySubs = subs.filter(s => s.workerId === workerId);

    // --- Reliability: approved daily/weekly tasks vs those assigned ---
    const dailyish = mine.filter(t => (t.isDaily || t.isWeekly) && inPeriod(t.createdAt));
    const dailyDone = dailyish.filter(t => t.status === 'achieved').length;
    const reliability = dailyish.length ? (dailyDone / dailyish.length) * 100 : null;

    // --- Challenger: follow-through, with a floor that grows as they take on
    // more. Pure completed÷accepted would rank 1-of-1 above 4-of-5, making it
    // safer to volunteer for less — the opposite of what this should reward.
    // The floor rises with each completed task, so doing more can lift the
    // score but never drag it below someone who barely participated.
    const cq = mine.filter(t => t.sideQuestId && inPeriod(t.createdAt));
    const cqDone = cq.filter(t => t.status === 'achieved').length;
    let challenger = null;
    if(cq.length){
      const rate = (cqDone / cq.length) * 100;
      const volumeFloor = Math.min(100, cqDone * 25); // 4 completed = full floor
      challenger = Math.max(rate, volumeFloor);
    }

    // --- Promptness: submitted comfortably before the 9pm deadline, rather
    // than fastest. Racing to submit first often just reflects an easier task
    // or an earlier shift — what matters is not leaving it to the last minute.
    // Full marks up to 7pm, then tapering across the last two hours to the
    // 9pm deadline.
    const graceBefore = 120; // minutes before the deadline still counted as fine
    const promptScores = [];
    mySubs.forEach(sub=>{
      if(!sub.submittedAt) return;
      const d = new Date(sub.submittedAt);
      const mins = d.getHours()*60 + d.getMinutes();
      if(mins > DAILY_EXPIRE_MINUTES){ promptScores.push(0); return; }   // after deadline
      const before = DAILY_EXPIRE_MINUTES - mins;
      if(before >= graceBefore){ promptScores.push(100); return; }        // comfortably in time
      promptScores.push(Math.round((before / graceBefore) * 100));        // last hour taper
    });
    const promptness = promptScores.length
      ? promptScores.reduce((a,b)=>a+b,0) / promptScores.length
      : null;

    // --- Quality: share of reviewed submissions accepted. Counters rushing,
    // since submitting fast but wrong costs more than it gains.
    const reviewed = mySubs.filter(s => s.status === 'approved' || s.status === 'rejected');
    const rejected = reviewed.filter(s => s.status === 'rejected').length;
    const quality = reviewed.length ? ((reviewed.length - rejected) / reviewed.length) * 100 : null;

    // --- Failures: penalty against what they were assigned, capped so one
    // bad stretch can't erase everything else.
    const myFails = fails.filter(f => f.workerId === workerId &&
      inPeriod(f.taskDate || String(f.failedAt||'').slice(0,10)));
    const failRate = dailyish.length ? Math.min(1, myFails.length / dailyish.length) : 0;
    const failures = dailyish.length ? (1 - failRate) * 100 : null;

    const parts = { reliability, challenger, promptness, quality, failures };
    // Skip components with no data and renormalise, so an unscored area
    // neither helps nor hurts.
    let total = 0, weightUsed = 0;
    Object.keys(SCORE_WEIGHTS).forEach(k=>{
      if(parts[k] === null || parts[k] === undefined) return;
      total += parts[k] * SCORE_WEIGHTS[k];
      weightUsed += SCORE_WEIGHTS[k];
    });
    if(weightUsed === 0) return null;
    return {
      score: Math.round(total / weightUsed),
      parts,
      counts: {
        dailyAssigned: dailyish.length, dailyDone,
        challengerAccepted: cq.length, challengerDone: cqDone,
        submissions: mySubs.length, rejected, fails: myFails.length
      }
    };
  }
  function scoreBand(n){
    if(n >= 85) return { label:'Excellent', color:'var(--green)' };
    if(n >= 70) return { label:'Good',      color:'var(--green)' };
    if(n >= 55) return { label:'Fair',      color:'var(--amber-dark)' };
    return          { label:'Needs work',   color:'var(--red)' };
  }

  function balanceFor(ledger, workerId){
    return ledger.filter(l=>l.workerId===workerId).reduce((s,l)=> s + (l.type==='earned'? l.points : -l.points), 0);
  }
  function earnedFor(ledger, workerId){
    return ledger.filter(l=>l.workerId===workerId && l.type==='earned').reduce((s,l)=>s+l.points,0);
  }
  // Avatar levels up every 500 lifetime points, with the character's look
  // evolving at set milestones — a lightweight nod to Habitica-style avatar
  // progression, built from emoji so there's nothing to host or load.
  // Below 500 points everyone's a plain "Newcomer" — the first real star
  // (Rising Star) is earned, not just handed out at zero.
  const AVATAR_POINTS_PER_LEVEL = 500;
  const AVATAR_TIERS = [
    { minLevel:1,  emoji:'🌑', title:'Newcomer' },
    { minLevel:2,  emoji:'⭐', title:'Rising Star' },
    { minLevel:4,  emoji:'🌟', title:'Bright Star' },
    { minLevel:6,  emoji:'💫', title:'Dynamo Star' },
    { minLevel:9,  emoji:'✨', title:'Sparkling Star' },
    { minLevel:13, emoji:'🌠', title:'Shooting Star' },
    { minLevel:17, emoji:'☄️', title:'Star Comet' },
    { minLevel:21, emoji:'🔯', title:'Superstar' },
  ];
  function avatarInfoFor(earnedPoints){
    const level = Math.floor(earnedPoints / AVATAR_POINTS_PER_LEVEL) + 1;
    const tier = AVATAR_TIERS.filter(t=>t.minLevel<=level).sort((a,b)=>b.minLevel-a.minLevel)[0] || AVATAR_TIERS[0];
    const pointsIntoLevel = earnedPoints % AVATAR_POINTS_PER_LEVEL;
    const pointsForNextLevel = AVATAR_POINTS_PER_LEVEL;
    return { level, emoji:tier.emoji, title:tier.title, pointsIntoLevel, pointsForNextLevel, pct: Math.round(pointsIntoLevel/pointsForNextLevel*100) };
  }
  // The timestamp of a worker's most recent earned point — i.e. the exact
  // moment their current total was reached. Used to break leaderboard ties:
  // whoever's latest earning happened EARLIER got to that shared total
  // first, and ranks higher. For older entries recorded before precise
  // timestamps existed, falls back to the day-level `date` field PLUS the
  // entry's actual position in the ledger array — that position still
  // reflects the real order things happened in, even without a clock time,
  // so same-day historical ties still get told apart correctly instead of
  // collapsing into a tie themselves.
  // ---- Leaderboard fast path ----
  // The per-worker helpers below each scan the whole ledger, which is fine for
  // one lookup but quadratic when ranking a whole team — that's what made the
  // leaderboard freeze. These build a per-worker index in a single pass, so
  // ranking N workers costs one ledger walk instead of N.
  function buildLedgerIndex(ledger){
    const byWorker = {};
    for(let i=0; i<ledger.length; i++){
      const l = ledger[i];
      if(l.type !== 'earned') continue;
      const base = l.at || (l.date ? l.date+'T00:00:00.000Z' : '');
      (byWorker[l.workerId] = byWorker[l.workerId] || []).push({
        key: base + '#' + String(i).padStart(8,'0'),
        date: l.date || '',
        points: l.points || 0
      });
    }
    return byWorker;
  }
  function idxEarned(index, workerId, cutoff){
    const rows = index[workerId]; if(!rows) return 0;
    let sum = 0;
    for(const r of rows){ if(cutoff===null || cutoff===undefined || r.date >= cutoff) sum += r.points; }
    return sum;
  }
  // Latest key wins the tie-break; a single max pass beats sorting the list.
  function idxReachedAt(index, workerId, cutoff){
    const rows = index[workerId]; if(!rows) return '';
    let best = '';
    for(const r of rows){
      if(cutoff!==null && cutoff!==undefined && r.date < cutoff) continue;
      if(r.key > best) best = r.key;
    }
    return best;
  }
  // Same idea for targets: one pass instead of two scans per worker.
  function buildTargetIndex(targets){
    const byWorker = {};
    for(const t of targets){
      const e = byWorker[t.workerId] = byWorker[t.workerId] || { achieved:0, sideQuests:0, sqKeys:[] };
      if(t.status === 'achieved'){
        e.achieved++;
        if(t.sideQuestId){ e.sideQuests++; e.sqKeys.push(String(t.achievedAt || '')); }
      }
    }
    return byWorker;
  }
  function idxSideQuestReachedAt(index, workerId){
    const e = index[workerId]; if(!e || !e.sqKeys.length) return '';
    let best = '';
    for(const k of e.sqKeys){ if(k > best) best = k; }
    return best;
  }

  function reachedAtFor(ledger, workerId){
    const mine = ledger
      .map((l, idx) => ({ l, idx }))
      .filter(x => x.l.workerId===workerId && x.l.type==='earned');
    if(mine.length===0) return '';
    const keys = mine.map(x => {
      const base = x.l.at || (x.l.date ? x.l.date+'T00:00:00.000Z' : '');
      return base + '#' + String(x.idx).padStart(8,'0');
    });
    return keys.sort().reverse()[0]; // latest one
  }
  function achievedCountFor(targets, workerId){
    return targets.filter(t=>t.workerId===workerId && t.status==='achieved').length;
  }
  function sideQuestsAchievedCountFor(targets, workerId){
    return targets.filter(t=>t.workerId===workerId && t.status==='achieved' && t.sideQuestId).length;
  }
  function daysAgo(n){
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d;
  }
  const PERIODS = [
    { key:'lifetime', label:'Lifetime' },
    { key:'sidequest', label:'Challenger Task' },
  ];
  // Every approved task (daily or challenger) since the battle started counts
  // as damage dealt to the boss — the whole team's combined effort, not any
  // one person's. Ties damage tracking directly to the existing points
  // ledger rather than inventing a separate counter to keep in sync.
  function bossDamageEntries(ledger, battleStartedAt){
    return ledger.filter(l=> l.type==='earned' && l.at && l.at >= battleStartedAt);
  }
  function bossTotalDamage(ledger, battleStartedAt){
    return bossDamageEntries(ledger, battleStartedAt).reduce((s,l)=>s+l.points,0);
  }
  function bossContributors(ledger, battleStartedAt){
    const byWorker = {};
    bossDamageEntries(ledger, battleStartedAt).forEach(l=>{ byWorker[l.workerId] = (byWorker[l.workerId]||0) + l.points; });
    return byWorker; // { workerId: totalDamageDealt }
  }
  // Tie-break for the "Challenger Task" leaderboard mode — ranked by count
  // of completed challenger tasks, so ties there are broken by whoever's
  // most recent completion happened earliest.
  function reachedSideQuestCountAtFor(targets, workerId){
    const mine = targets
      .map((t, idx) => ({ t, idx }))
      .filter(x => x.t.workerId===workerId && x.t.status==='achieved' && x.t.sideQuestId);
    if(mine.length===0) return '';
    const keys = mine.map(x => {
      const base = x.t.achievedAt || '';
      return base + '#' + String(x.idx).padStart(8,'0');
    });
    return keys.sort().reverse()[0];
  }

  // ---- badges: stored in Firestore so admins can add/edit/remove them ----
  const K_BADGES = 'perf-badges';
  const DEFAULT_BADGES = [
    { group:'targets', emoji:'🎖️', label:'Recruit',    desc:'Complete your first target',  need:1 },
    { group:'targets', emoji:'🪖', label:'Private',     desc:'Complete 5 targets',           need:5 },
    { group:'targets', emoji:'⚔️', label:'Corporal',    desc:'Complete 10 targets',          need:10 },
    { group:'points',  emoji:'🥉', label:'Sergeant',    desc:'Earn 100 lifetime points',     need:100 },
    { group:'points',  emoji:'🥈', label:'Lieutenant',  desc:'Earn 500 lifetime points',     need:500 },
    { group:'points',  emoji:'🥇', label:'Captain',     desc:'Earn 1000 lifetime points',    need:1000 },
    { group:'sidequests', emoji:'🧭', label:'Adventurer', desc:'Complete your first challenger task', need:1 },
    { group:'sidequests', emoji:'🗺️', label:'Explorer',   desc:'Complete 5 challenger tasks',        need:5 },
    { group:'sidequests', emoji:'🏔️', label:'Pathfinder', desc:'Complete 10 challenger tasks',       need:10 },
    { group:'rank',    emoji:'🎗️', label:'Major',       desc:'Rank in the top 3 lifetime',   need:3 },
    { group:'rank',    emoji:'🏆', label:'General',     desc:'Rank #1 on the leaderboard',   need:1 },
  ];
  const GROUP_LABELS = { targets:'Targets Completed', points:'Lifetime Points', sidequests:'Challenger Tasks Completed', rank:'Leaderboard Rank' };
  // Cross-group priority for picking a SINGLE "highest achievement" badge
  // (used on the leaderboard) — reaching a top rank is the most prestigious,
  // followed by lifetime points, then challenger tasks completed, then raw target count.
  const GROUP_PRIORITY = { targets:1, sidequests:2, points:3, rank:4 };

  async function getBadges(){
    // Deliberately uses the STRICT reader: getList() swallows errors and
    // returns [] on failure, which here would look like "all badges are
    // missing" and trigger a full rebuild from defaults — silently wiping
    // every edit and custom badge. On a read failure we return the defaults
    // in memory for this render only, and write nothing.
    let badges;
    try{
      badges = await getListStrict(K_BADGES);
    }catch(e){
      showFbError('Could not load badges — showing defaults for now, nothing was changed: ' + e.message);
      return DEFAULT_BADGES.map(b=>({ id: 'temp-'+b.group+'-'+b.label, ...b }));
    }

    // Ignore any legacy/malformed entries (e.g. saved by an older version of
    // this app before the group/need fields existed) instead of letting them
    // silently break every badge test.
    let valid = badges.filter(b => b && b.group && typeof b.need === 'number');
    let changed = valid.length !== badges.length;

    // Restore any default badge that's gone missing (accidentally removed,
    // or never made it in) — matched by group+label, so an admin's own edits
    // to an existing default badge are never overwritten.
    const existingKeys = new Set(valid.map(b=> b.group + '::' + b.label));
    DEFAULT_BADGES.forEach(def=>{
      const key = def.group + '::' + def.label;
      if(!existingKeys.has(key)){
        valid.push({ id: uid(), ...def });
        existingKeys.add(key);
        changed = true;
      }
    });

    if(changed) await setList(K_BADGES, valid);
    return valid;
  }
  function testBadge(b, ctx){
    if(b.group==='targets') return ctx.targetsAchieved >= b.need;
    if(b.group==='points') return ctx.earned >= b.need;
    if(b.group==='sidequests') return ctx.sideQuestsAchieved >= b.need;
    if(b.group==='rank') return !!ctx.rank && ctx.rank <= b.need;
    return false;
  }
  function badgeMetric(b, ctx){
    if(b.group==='targets') return { current: ctx.targetsAchieved, unit: b.need===1 ? 'target completed' : 'targets completed' };
    if(b.group==='points') return { current: ctx.earned, unit: 'points earned' };
    if(b.group==='sidequests') return { current: ctx.sideQuestsAchieved, unit: b.need===1 ? 'challenger task completed' : 'challenger tasks completed' };
    return null;
  }
  // Only the HIGHEST badge earned within each group (targets / points / rank)
  // is returned — e.g. hitting 1000 points gives "Captain" only, not
  // Sergeant + Lieutenant + Captain stacked up.
  // Normalizes "how hard is this badge" across groups so comparisons work the
  // same way everywhere. For targets/points, a bigger need is harder (need to
  // hit 1000 points is harder than 100). For rank, it's the opposite — need:1
  // (must be #1) is harder than need:3 (top 3) — so we flip the sign.
  function badgeDifficulty(b){
    return b.group === 'rank' ? -b.need : b.need;
  }
  function earnedBadges(ctx, badges){
    const earned = badges.filter(b=>testBadge(b,ctx));
    const byGroup = {};
    earned.forEach(b=>{ if(!byGroup[b.group] || badgeDifficulty(b) > badgeDifficulty(byGroup[b.group])) byGroup[b.group] = b; });
    return Object.values(byGroup).sort((a,b)=> GROUP_PRIORITY[a.group]-GROUP_PRIORITY[b.group]);
  }
  // The single best badge across ALL groups — used anywhere only one badge
  // should show (the leaderboard rows).
  function highestBadge(ctx, badges){
    const earned = earnedBadges(ctx, badges);
    if(earned.length===0) return null;
    return earned.reduce((best,b)=> GROUP_PRIORITY[b.group] > GROUP_PRIORITY[best.group] ? b : best, earned[0]);
  }
  function currentRankTitle(ctx, badges){
    return highestBadge(ctx, badges);
  }
  // The single next badge to chase within each group — used to show workers
  // exactly how close they are, to keep them motivated.
  function nextBadgesInfo(ctx, badges){
    const earned = earnedBadges(ctx, badges);
    const earnedByGroup = {};
    earned.forEach(b=> earnedByGroup[b.group] = b);
    const groups = ['targets','points','sidequests','rank'];
    const next = [];
    groups.forEach(g=>{
      const earnedDiff = earnedByGroup[g] ? badgeDifficulty(earnedByGroup[g]) : -Infinity;
      const candidates = badges.filter(b=>b.group===g && badgeDifficulty(b) > earnedDiff).sort((a,b)=> badgeDifficulty(a)-badgeDifficulty(b));
      if(candidates.length) next.push(candidates[0]);
    });
    return next;
  }

  const root = document.getElementById('root');
  const hashParams = parseHash();

  async function renderWorkerDashboard(body, worker){
    const [totals, targets, catalog, allWorkers, badges, sideQuests, bossBattle, allFails, archive] = await Promise.all([getTotalsEnsured(), getTargets(), getCatalog(), getWorkers(), getBadges(), getSideQuests(), getBossBattle(), getFailCountsEnsured(), getTargetArchive()]);
    // Boss damage still needs raw entries; everything else reads the cache.
    const ledger = (bossBattle && bossBattle.active) || !totals ? await getLedger() : null;
    const tEarned = id => totals ? ((totals.byWorker[id]||{}).earned || 0) : earnedFor(ledger, id);
    const tReached = id => totals ? ((totals.byWorker[id]||{}).reachedAt || '') : reachedAtFor(ledger, id);
    const tBalance = id => totals ? ((totals.byWorker[id]||{}).balance || 0) : balanceFor(ledger, id);
    // Only pull submissions for the targets actually on this worker's screen —
    // their full history isn't needed and every row carries a photo.
    const _todayStr = todayStr();
    const myTargetIds = targets.filter(t=>
      t.workerId===worker.id &&
      (t.status!=='achieved' || t.achievedAt === _todayStr)
    ).map(t=>t.id);
    const subs = await getSubsForTargets(myTargetIds);
    // Only the count is needed up front; the rows are fetched if the worker
    // opens the list, so a growing fail history doesn't slow every load.
    const myFailCount = allFails ? ((allFails.byWorker||{})[worker.id] || 0) : 0;
    const bal = tBalance(worker.id);
    const earned = tEarned(worker.id);
    const myActiveDaily = targets.filter(t=>t.workerId===worker.id && t.status!=='achieved' && t.isDaily).sort((a,b)=> a.points - b.points);
    const myActiveOther = targets.filter(t=>t.workerId===worker.id && t.status!=='achieved' && !t.isDaily).sort((a,b)=> b.points - a.points);
    const myActiveTargets = myActiveDaily.concat(myActiveOther);
    // Tasks approved today stay on the list until the 9pm cutoff, so the
    // worker can read the remark left when it was reviewed. After that they
    // drop off along with the rest of the day's work.
    const beforeCutoff = nowMYParts().minutesOfDay < DAILY_EXPIRE_MINUTES;
    const myApprovedToday = beforeCutoff
      ? targets.filter(t=>t.workerId===worker.id && t.status==='achieved' && t.achievedAt === _todayStr)
               .sort((a,b)=> b.points - a.points)
      : [];
    const myTargets = myActiveTargets.concat(myApprovedToday);
    const mySubs = subs.filter(s=>s.workerId===worker.id);
    const targetsAchieved = achievedCountFor(targets, worker.id) + archiveCountFor(archive, worker.id, 'achieved');

    // Roadmap lock: today's daily tasks must be submitted lowest-points-first.
    // A task unlocks once every daily task with a strictly lower point value
    // (today's batch only) has been submitted at least once — pending or
    // already reviewed both count, so a slow review never blocks progress.
    const todayStr_ = todayStr();
    const myDailyToday = targets.filter(t=> t.workerId===worker.id && t.isDaily && t.createdAt===todayStr_);
    const pointTiers = [...new Set(myDailyToday.map(t=>t.points))].sort((a,b)=>a-b);
    const hasBeenSubmitted = (t) => t.status==='achieved' || mySubs.some(s=>s.targetId===t.id);
    function lockInfoFor(t){
      if(!t.isDaily || t.createdAt!==todayStr_) return { locked:false };
      const myTier = pointTiers.indexOf(t.points);
      const earlierTierTasks = myDailyToday.filter(x => pointTiers.indexOf(x.points) < myTier);
      const unmet = earlierTierTasks.filter(x => !hasBeenSubmitted(x));
      if(unmet.length===0) return { locked:false };
      return { locked:true, waitingOn: unmet.map(x=>x.title) };
    }
    const sideQuestsAchieved = sideQuestsAchievedCountFor(targets, worker.id) + archiveCountFor(archive, worker.id, 'sideQuests');
    const myAcceptedQuestIds = new Set(targets.filter(t=>t.workerId===worker.id && t.sideQuestId).map(t=>t.sideQuestId));
    const acceptedCountByQuest = {};
    targets.forEach(t=>{ if(t.sideQuestId) acceptedCountByQuest[t.sideQuestId] = (acceptedCountByQuest[t.sideQuestId]||0) + 1; });
    const nowMs = Date.now();
    const eligibleQuests = sideQuests.filter(sq =>
      sq.active !== false && !myAcceptedQuestIds.has(sq.id) &&
      (!sq.roles || sq.roles.length===0 || sq.roles.includes(worker.role)) &&
      (acceptedCountByQuest[sq.id]||0) < (sq.capacity || 1)
    );
    const standbyQuests = eligibleQuests.filter(sq => sq.opensAt && new Date(sq.opensAt).getTime() > nowMs);
    const openQuests = eligibleQuests.filter(sq => !sq.opensAt || new Date(sq.opensAt).getTime() <= nowMs);

    const rankedAll = allWorkers.map(w=>({ id:w.id, earned: tEarned(w.id), reachedAt: tReached(w.id) })).sort((a,b)=> b.earned - a.earned || a.reachedAt.localeCompare(b.reachedAt));
    const myRank = rankedAll.findIndex(w=>w.id===worker.id) + 1;
    const badgeCtx = { earned, targetsAchieved, sideQuestsAchieved, rank: myRank };
    const myBadges = earnedBadges(badgeCtx, badges);
    const nextUp = nextBadgesInfo(badgeCtx, badges);
    const myRankTitle = currentRankTitle(badgeCtx, badges);

    function badgeProgressRow(b){
      let progressText = '';
      let pct = 0;
      const m = badgeMetric(b, badgeCtx);
      if(m){
        progressText = `${Math.min(m.current,b.need)} / ${b.need} ${m.unit}`;
        pct = Math.max(0, Math.min(100, Math.round(m.current/b.need*100)));
      } else if(b.group==='rank'){
        progressText = myRank ? `Currently rank #${myRank} — reach ${b.need===1?'#1':'top '+b.need}` : 'Not yet ranked';

      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);">

          </div>
