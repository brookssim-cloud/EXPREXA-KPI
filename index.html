            style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        </div>
      </div>
      <div style="margin:10px 12px 0;">
        <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;">PRINCIPAL</label>
        <select id="rp-principal" style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;">
          <option value="all">All principals</option>
          ${principalOptions.map(p=>`<option value="${escapeHtml(p)}" ${p===STATE.reportPrincipal?'selected':''}>${escapeHtml(p)}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:8px;margin:12px 12px 0;">
        <button class="lot-act ghost" id="rp-refresh" style="flex:0 0 auto;width:auto;padding:11px 14px;">Refresh</button>
        <button class="advance" id="rp-export" style="margin:0;flex:1;">Export CSV</button>
      </div>
      <div id="rp-state" style="margin:12px 16px 0;font-size:12.5px;color:var(--muted);line-height:1.6;text-align:center;"></div>
      <div style="height:20px;"></div>`;

    // Only the totals are shown. The point of this tab is the CSV, and a
    // long list on screen is just something to scroll past on the way to it.
    function draw(){
      const state = document.getElementById('rp-state');
      const setCounts = (a,b,c2) => {
        document.getElementById('rp-count').textContent = a;
        document.getElementById('rp-pcs').textContent = b;
        document.getElementById('rp-kg').textContent = c2;
      };
      if(!anyFilter()){
        setCounts('—','—','—');
        state.style.color = 'var(--muted)';
        state.textContent = 'Pick a date range or a principal, then export.';
        return;
      }
      const rows = rowsNow();
      setCounts(rows.length,
        rows.reduce((n,s)=> n + (Number(s.pcs)||0), 0) || '—',
        Math.round(rows.reduce((n,s)=> n + (Number(s.kg)||0), 0)) || '—');
      state.style.color = 'var(--muted)';
      state.textContent = rows.length
        ? (() => {
            // A consolidation exports as several lines, so say both figures
            // rather than letting the count disagree with the file.
            const lines = rows.reduce((n, sh) => n + reportRowsFor(sh).length, 0);
            return `${rows.length} shipment${rows.length===1?'':'s'} ready to export`
              + (lines !== rows.length ? ` — ${lines} rows, split by house bill.` : '.');
          })()
        : 'Nothing matches that filter.';
    }
    draw();

    async function onFilterChange(){
      if(anyFilter() && !(await ensureLoaded())) return;
      draw();
    }
    document.getElementById('rp-from').onchange = (e)=>{ STATE.reportFrom = e.target.value; onFilterChange(); };
    document.getElementById('rp-to').onchange = (e)=>{ STATE.reportTo = e.target.value; onFilterChange(); };
    document.getElementById('rp-principal').onchange = (e)=>{ STATE.reportPrincipal = e.target.value; onFilterChange(); };
    document.getElementById('rp-refresh').onclick = () => { _reportAll = null; paintShell(); };
    document.getElementById('rp-export').onclick = async function(){
      const state = document.getElementById('rp-state');
      if(!anyFilter()){
        state.style.color = 'var(--red)';
        state.textContent = 'Pick a date range or a principal first.';
        return;
      }
      if(!(await ensureLoaded())) return;
      draw();
      const rows = rowsNow();
      if(rows.length === 0){
        state.style.color = 'var(--red)';
        state.textContent = 'Nothing matches that filter — nothing to export.';
        return;
      }
      const who = STATE.reportPrincipal === 'all' ? 'all-principals'
        : STATE.reportPrincipal.replace(/[^0-9A-Za-z]+/g,'-').toLowerCase();
      // Either date may be left open, so the name only mentions the ones set.
      const span = STATE.reportFrom && STATE.reportTo ? `${STATE.reportFrom}-to-${STATE.reportTo}`
        : STATE.reportFrom ? `from-${STATE.reportFrom}`
        : STATE.reportTo ? `up-to-${STATE.reportTo}`
        : 'all-dates';
      downloadCsv(`forwarding-${who}-${span}.csv`,
        [REPORT_HEADERS].concat(rows.flatMap(reportRowsFor)));
    };
  }

  // ============================================================
  // Terminals (admin only) — defined once by AWB prefix. Which
  // terminal a shipment belongs to is then worked out automatically
  // from its own AWB; nothing to tag per shipment.
  // ============================================================
  // The rate card under each terminal. Import carries a survey fee, export
  // does not — so the two blocks differ by one field.
  function rateBlockHtml(t, type){
    const r = ratesFor(t, type);
    const isExp = type === 'export';
    const fees = feesFor(t, type);
    const box = (key, label, val, step) => `
      <div class="b">
        <div>${label}</div>
        <input type="number" min="0" step="${step}" value="${val || ''}" placeholder="0"
          data-rate="${t.id}|${type}|${key}" class="tm-in">
      </div>`;
    const num = (fid, key, val, step, ph) => `
      <input type="number" min="0" step="${step}" value="${val || ''}" placeholder="${ph}"
        data-fee="${t.id}|${type}|${fid}|${key}" class="tm-in r" style="flex:1 1 0;">`;
    // One fee reads as a tile: what it is called and how it is worked out on
    // the first line, the numbers it needs under that, and its switches last.
    const feeHtml = f => {
      const basis = f.basis || 'flat';
      const wb = WEIGHT_BASES.some(b => b.key === f.weightBasis) ? f.weightBasis : '';
      return `
      <div class="tm-fee">
        <div class="tm-fee-top">
          <input type="text" maxlength="24" placeholder="Fee name" class="tm-in"
            value="${escapeHtml(f.label || '')}" data-fee="${t.id}|${type}|${f.id}|label"
            style="flex:1 1 auto;min-width:0;font-weight:600;">
          <span class="tm-fee-x" data-delfee="${t.id}|${type}|${f.id}" title="Remove">&times;</span>
        </div>
        <div class="tm-fee-row">
          <select data-fee="${t.id}|${type}|${f.id}|basis" class="tm-in"
            style="flex:1 1 0;min-width:0;padding:8px 5px;font-size:12px;">
            ${FEE_BASES.map(b=>`<option value="${b.key}" ${basis===b.key?'selected':''}>${b.label}</option>`).join('')}
          </select>
          ${basis === 'float' ? '' : num(f.id,'amount', f.amount, '0.01',
            basis === 'hawb' ? 'per HAWB' : 'amount')}
        </div>
        ${basis === 'float' ? `<div class="tm-fee-sub">
          ${num(f.id,'minKg', f.minKg, '0.1', 'min kg')}
          ${num(f.id,'minCharge', f.minCharge, '0.01', 'charge')}
          ${num(f.id,'perKg', f.perKg, '0.01', 'per kg')}
        </div>` : ''}
        <div class="tm-fee-opt">
          ${(isExp && basis === 'float') ? `<select data-fee="${t.id}|${type}|${f.id}|weightBasis" class="tm-in"
            style="flex:1 1 150px;padding:6px 5px;font-size:11.5px;">
            <option value="" ${wb===''?'selected':''}>Weight: as the terminal</option>
            ${WEIGHT_BASES.map(b=>`<option value="${b.key}" ${wb===b.key?'selected':''}>Weight: ${b.label}</option>`).join('')}
          </select>` : ''}
          ${(() => {
            // Which cargo the fee is for. Was a DG on/off chip; perishables
            // and fresh are charged differently too, and on imports as much
            // as exports, so it is a choice rather than a switch.
            const only = feeCargoOnly(f);
            return `<select data-feecargo="${t.id}|${type}|${f.id}" class="tm-in"
              style="flex:1 1 150px;padding:6px 5px;font-size:11.5px;">
              <option value="" ${only===''?'selected':''}>Any cargo</option>
              ${CARGO_TYPES.map(cg=>`<option value="${cg.key}" ${only===cg.key?'selected':''}
                >Only ${cg.label.toLowerCase()}</option>`).join('')}
            </select>`;
          })()}
        </div>
      </div>`;
    };
    return `
      <div class="tm-sec">
        <div class="tm-sec-h">
          <span class="tm-tag ${isExp?'exp':'imp'}">${isExp?'EXPORT':'IMPORT'}</span>
          <span class="t">Terminal charges</span>
        </div>
        <div class="tm-rates">
          ${box('minKg','MIN KG', r.minKg, '0.1')}
          ${box('minCharge','MIN CHARGE', r.minCharge, '0.01')}
          ${box('perKg','PER KG', r.perKg, '0.01')}
        </div>
        ${isExp ? '' : `<div style="margin-top:10px;display:flex;gap:9px;align-items:center;">
          <div style="flex:1;min-width:0;">
            <div class="tm-lbl" style="margin:0 0 2px;">SURVEY REPORT</div>
            <div style="font-size:11px;color:var(--muted);line-height:1.5;">Billed on its own row, per report raised.</div>
          </div>
          <input type="number" min="0" step="0.01" value="${r.surveyCharge || ''}" placeholder="0"
            data-rate="${t.id}|${type}|surveyCharge" class="tm-in r" style="flex:0 0 84px;">
        </div>`}
        ${isExp ? `<div style="margin-top:10px;">
          <div class="tm-lbl">WEIGHT THESE CHARGES FOLLOW</div>
          <select data-rate="${t.id}|${type}|weightBasis" class="tm-in">
            ${WEIGHT_BASES.map(b=>`<option value="${b.key}" ${r.weightBasis===b.key?'selected':''}>${b.label}</option>`).join('')}
          </select>
        </div>` : ''}
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:13px;">
          <span class="tm-lbl" style="margin:0;">ADDITIONAL FEES${fees.length?` · ${fees.length}`:''}</span>
          <span class="tm-add" data-addfee="${t.id}|${type}">+ Add a fee</span>
        </div>
        ${fees.length ? fees.map(feeHtml).join('')
          : `<div class="tm-none">None — the charge is the scale above.</div>`}
      </div>`;
  }

  function paintSettings(c){
    let newPrefix = {}; // { [terminalId]: current text in that terminal's "add prefix" box }

    function draw(){
      c.innerHTML = `
        <div style="margin:14px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
          Create a terminal, then list the AWB prefixes it handles. Any shipment
          starting with one of those digits is sorted there automatically — on the
          board's Import filter and here.
        </div>

        ${STATE.terminals.map(t=>`
          <div class="tm">
            <div class="tm-head">
              <div class="nm">${escapeHtml(t.name)}</div>
              <div class="rm" data-delterm="${t.id}">Remove</div>
            </div>
            <div class="tm-body">
              <div class="tm-lbl">AWB PREFIXES</div>
              <div class="chips">
                ${(t.prefixes||[]).length ? t.prefixes.map(p=>`
                  <span class="mono" style="padding:6px 10px;font-size:12px;">${escapeHtml(p)}
                    <span data-delpfx="${t.id}|${escapeHtml(p)}" style="margin-left:6px;color:var(--red);font-weight:700;cursor:pointer;">&times;</span>
                  </span>`).join('')
                  : `<span style="color:var(--muted);font-size:12px;border:none;padding:0;background:none;">None yet — this terminal matches no shipment.</span>`}
              </div>
              <div style="display:flex;gap:7px;margin-top:8px;">
                <input class="mono tm-in" placeholder="e.g. 807" maxlength="3" style="flex:1;"
                  data-pfxinput="${t.id}" value="${escapeHtml(newPrefix[t.id]||'')}">
                <button class="lot-act ghost" style="width:auto;flex:0 0 auto;padding:8px 13px;font-size:12px;border-radius:8px;"
                  data-addpfx="${t.id}">Add</button>
              </div>
              ${rateBlockHtml(t, 'import')}
              ${rateBlockHtml(t, 'export')}
            </div>
          </div>`).join('') || `
          <div class="card" style="margin:14px 12px 0;">
            <div style="font-size:12.5px;color:var(--muted);">No terminals yet — add the first one below.</div>
          </div>`}

        <div class="sect">NEW TERMINAL</div>
        <div class="field"><label>Terminal name</label>
          <input id="tm-name" placeholder="e.g. POS Aviation"></div>
        <div class="field"><label>Prefixes <span style="font-weight:400;color:var(--muted);">— comma separated</span></label>
          <input class="mono" id="tm-prefixes" placeholder="e.g. 807, 975"></div>
        <div class="msg" id="tm-msg"></div>
        <button class="advance" id="tm-create">Create terminal</button>

        <div class="sect">PRINCIPALS</div>
        <div style="margin:0 16px 10px;font-size:12px;color:var(--muted);line-height:1.6;">
          Every shipment is created under a principal. Add them here and they
          appear as a choice on the new shipment form.
        </div>
        <div class="card" style="margin:0 12px;padding:14px 15px;">
          <div class="chips">
            ${STATE.principals.length ? STATE.principals.map(p=>`
              <span class="mono">${escapeHtml(p)}
                <span data-delprin="${escapeHtml(p)}" style="margin-left:5px;color:var(--red);font-weight:700;cursor:pointer;">&times;</span>
              </span>`).join('') : `<span style="color:var(--muted);font-size:12px;border:none;padding:0;">
                No principals yet — nobody can create a shipment until one is added.</span>`}
          </div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <input id="pr-name" placeholder="e.g. EXPREXA LOGISTICS SDN BHD" style="flex:1;padding:8px 10px;
              border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;">
            <button class="lot-act ghost" style="width:auto;padding:8px 12px;font-size:12px;" id="pr-add">Add</button>
          </div>
          <div class="msg" id="pr-msg" style="margin:8px 0 0;"></div>
        </div>

        <div style="height:20px;"></div>`;

      async function persist(){
        await saveTerminalsConfig({ terminals: STATE.terminals, principals: STATE.principals });
      }

      // Principals. Removing one leaves the shipments already created under
      // it untouched — it only stops new ones being made under that name.
      c.querySelectorAll('[data-delprin]').forEach(el=>{
        el.onclick = async () => {
          const name = el.dataset.delprin;
          const used = STATE.shipments.filter(s => s.principal === name).length;
          if(!confirm(used
            ? `Remove "${name}"? ${used} open shipment${used===1?'':'s'} already created under it keep the name — it just stops being offered on new ones.`
            : `Remove "${name}" from the principal list?`)) return;
          STATE.principals = STATE.principals.filter(p => p !== name);
          await persist();
          draw();
        };
      });
      document.getElementById('pr-add').onclick = async function(){
        const inp = document.getElementById('pr-name');
        const msg = document.getElementById('pr-msg');
        const name = inp.value.trim();
        if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter the principal name.'; return; }
        if(STATE.principals.some(p => p.toLowerCase() === name.toLowerCase())){
          msg.style.color='var(--red)'; msg.textContent='That principal is already listed.'; return;
        }
        this.disabled = true;
        try{
          STATE.principals = STATE.principals.concat(name);
          await persist();
          draw();
        }catch(e){
          this.disabled = false;
          msg.style.color='var(--red)'; msg.textContent = 'Could not save: ' + e.message;
        }
      };

      // Rates save as they are typed out of, rather than behind a button —
      // there are seven of them per terminal and a save button per field
      // would be worse than the typing.
      c.querySelectorAll('[data-rate]').forEach(inp=>{
        inp.onchange = async () => {
          const [tid, type, key] = inp.dataset.rate.split('|');
          const t = STATE.terminals.find(x => x.id === tid);
          if(!t) return;
          // One of these is a choice, not a figure.
          if(key === 'weightBasis'){
            t.rates = t.rates || {};
            t.rates[type] = { ...(t.rates[type] || {}),
              weightBasis: WEIGHT_BASES.some(b => b.key === inp.value) ? inp.value : 'higher' };
            inp.style.borderColor = 'var(--green)';
            await persist();
            draw();   // every line below it is worked out from this
            return;
          }
          const v = inp.value.trim() === '' ? 0 : Number(inp.value);
          if(isNaN(v) || v < 0){ inp.value = ''; return; }
          t.rates = t.rates || {};
          t.rates[type] = { ...(t.rates[type] || {}), [key]: v };
          inp.style.borderColor = 'var(--green)';
          await persist();
          setTimeout(()=>{ inp.style.borderColor = ''; }, 900);
        };
      });

      // Extra fees. Each one is a row in the terminal's rate card, so the
      // same persist() covers them — no separate save.
      function feeIn(t, type, fid){
        t.rates = t.rates || {};
        t.rates[type] = { ...(t.rates[type] || {}) };
        t.rates[type].fees = (t.rates[type].fees || []).map(f => ({ ...f }));
        return t.rates[type].fees.find(f => f.id === fid) || null;
      }
      c.querySelectorAll('[data-addfee]').forEach(el=>{
        el.onclick = async () => {
          const [tid, type] = el.dataset.addfee.split('|');
          const t = STATE.terminals.find(x => x.id === tid);
          if(!t) return;
          t.rates = t.rates || {};
          t.rates[type] = { ...(t.rates[type] || {}) };
          t.rates[type].fees = (t.rates[type].fees || []).concat([
            { id: uid(), label: '', basis: 'flat', amount: 0, minKg: 0, minCharge: 0, perKg: 0 }
          ]);
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-feecargo]').forEach(el=>{
        el.onchange = async () => {
          const [tid, type, fid] = el.dataset.feecargo.split('|');
          const t = STATE.terminals.find(x => x.id === tid);
          if(!t) return;
          const f = feeIn(t, type, fid);
          if(!f) return;
          const v = el.value;
          if(v && CARGO_KEYS.includes(v)) f.cargoOnly = v; else delete f.cargoOnly;
          // The old flag is retired on the fee as soon as it is touched, so
          // the two can never disagree about what the fee is for.
          delete f.dgOnly;
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-delfee]').forEach(el=>{
        el.onclick = async () => {
          const [tid, type, fid] = el.dataset.delfee.split('|');
          const t = STATE.terminals.find(x => x.id === tid);
          if(!t) return;
          const f = feesFor(t, type).find(x => x.id === fid);
          if(!confirm(`Remove "${(f && f.label) || 'this fee'}"? Shipments already paid keep the amount they were charged.`)) return;
          t.rates[type] = { ...(t.rates[type] || {}) };
          t.rates[type].fees = feesFor(t, type).filter(x => x.id !== fid);
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-fee]').forEach(inp=>{
        inp.onchange = async () => {
          const [tid, type, fid, key] = inp.dataset.fee.split('|');
          const t = STATE.terminals.find(x => x.id === tid);
          if(!t) return;
          const f = feeIn(t, type, fid);
          if(!f) return;
          if(key === 'basis'){
            f.basis = FEE_BASES.some(b => b.key === inp.value) ? inp.value : 'flat';
            await persist();
            draw();   // the boxes beside it change with the basis
            return;
          }
          if(key === 'weightBasis'){
            // Blank means follow whatever the terminal's export block says.
            if(WEIGHT_BASES.some(b => b.key === inp.value)) f.weightBasis = inp.value;
            else delete f.weightBasis;
            inp.style.borderColor = 'var(--green)';
            await persist();
            setTimeout(()=>{ inp.style.borderColor = ''; }, 900);
            return;
          }
          if(key === 'label') f[key] = inp.value.trim().slice(0, 24);
          else {
            const v = inp.value.trim() === '' ? 0 : Number(inp.value);
            if(isNaN(v) || v < 0){ inp.value = ''; return; }
            f[key] = v;
          }
          inp.style.borderColor = 'var(--green)';
          await persist();
          setTimeout(()=>{ inp.style.borderColor = ''; }, 900);
        };
      });

      c.querySelectorAll('[data-delterm]').forEach(btn=>{
        btn.onclick = async () => {
          if(!confirm('Remove this terminal? Its shipments will show as "Not set" until reassigned.')) return;
          STATE.terminals = STATE.terminals.filter(t=>t.id !== btn.dataset.delterm);
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-delpfx]').forEach(el=>{
        el.onclick = async () => {
          const [tid, pfx] = el.dataset.delpfx.split('|');
          const t = STATE.terminals.find(x=>x.id===tid);
          if(!t) return;
          t.prefixes = (t.prefixes||[]).filter(p=>p!==pfx);
          await persist();
          draw();
        };
      });
      c.querySelectorAll('[data-pfxinput]').forEach(inp=>{
        inp.oninput = () => { newPrefix[inp.dataset.pfxinput] = inp.value; };
      });
      c.querySelectorAll('[data-addpfx]').forEach(btn=>{
        btn.onclick = async () => {
          const tid = btn.dataset.addpfx;
          const inp = c.querySelector(`[data-pfxinput="${tid}"]`);
          const val = inp.value.trim();
          if(!/^\d{3}$/.test(val)){ alert('Prefix must be exactly 3 digits, e.g. 807.'); return; }
          const t = STATE.terminals.find(x=>x.id===tid);
          if(!t) return;
          t.prefixes = t.prefixes || [];
          if(t.prefixes.includes(val)){ alert('That prefix is already listed here.'); return; }
          const clash = STATE.terminals.find(x=>x.id!==tid && (x.prefixes||[]).includes(val));
          if(clash){ alert(`Prefix ${val} is already assigned to ${clash.name}.`); return; }
          t.prefixes.push(val);
          delete newPrefix[tid];
          await persist();
          draw();
        };
      });

      document.getElementById('tm-create').onclick = async function(){
        const name = document.getElementById('tm-name').value.trim();
        const prefixesRaw = document.getElementById('tm-prefixes').value.trim();
        const msg = document.getElementById('tm-msg');
        if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter a terminal name.'; return; }
        if(STATE.terminals.some(t=>t.name.toLowerCase()===name.toLowerCase())){
          msg.style.color='var(--red)'; msg.textContent='A terminal with this name already exists.'; return;
        }
        const prefixes = prefixesRaw ? prefixesRaw.split(',').map(p=>p.trim()).filter(Boolean) : [];
        for(const p of prefixes){
          if(!/^\d{3}$/.test(p)){ msg.style.color='var(--red)'; msg.textContent=`"${p}" isn't a valid 3-digit prefix.`; return; }
        }
        for(const p of prefixes){
          const clash = STATE.terminals.find(t=>(t.prefixes||[]).includes(p));
          if(clash){ msg.style.color='var(--red)'; msg.textContent=`Prefix ${p} is already assigned to ${clash.name}.`; return; }
        }
        this.disabled = true; this.textContent = 'Creating…';
        STATE.terminals.push({ id: uid(), name, prefixes });
        await persist();
        draw();
      };
    }
    draw();
  }

  // ============================================================
  // Worker IDs (admin only) — add/remove people, reset passwords
  // ============================================================
  async function paintWorkers(c){
    c.innerHTML = `<div class="empty">Loading…</div>`;
    const workers = (await getWorkers()).slice().sort((a,b)=>a.name.localeCompare(b.name));
    c.innerHTML = `
      <div style="margin:14px 16px 0;font-size:12px;color:var(--muted);line-height:1.6;">
        These are this app's own IDs — separate from attendance and performance. A new
        person is <b>Off</b> in the Access tab until you set their level.
      </div>
      <div class="card" style="padding:2px 15px;">
        ${workers.map(w=>`
          <div class="person">
            <div class="nm"><div class="n">${escapeHtml(w.name)}</div>
              <div class="r">${STATE.access[w.id] ? STATE.access[w.id].toUpperCase() : 'OFF'}</div></div>
            <div style="display:flex;gap:6px;">
              <button class="lot-act ghost" style="width:auto;padding:7px 10px;font-size:11px;"
                data-reset="${w.id}">Reset password</button>
              <button class="lot-act ghost" style="width:auto;padding:7px 10px;font-size:11px;color:var(--red);"
                data-remove="${w.id}" data-name="${escapeHtml(w.name)}">Remove</button>
            </div>
          </div>`).join('') || '<div style="font-size:12.5px;color:var(--muted);padding:10px 0;">No workers yet.</div>'}
      </div>

      <div class="sect">ADD A WORKER</div>
      <div class="field"><label>Name</label><input id="wk-name" placeholder="Full name"></div>
      <div class="field"><label>Password</label><input id="wk-pass" type="password" placeholder="At least 4 characters"></div>
      <div class="msg" id="wk-msg"></div>
      <button class="advance" id="wk-add">Add worker</button>
      <div style="height:20px;"></div>`;

    c.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = async () => {
        if(!confirm(`Remove ${btn.dataset.name}? They'll no longer be able to sign in.`)) return;
        await deleteWorker(btn.dataset.remove);
        delete STATE.access[btn.dataset.remove];
        paintShell();
      };
    });
    c.querySelectorAll('[data-reset]').forEach(btn=>{
      btn.onclick = async () => {
        const pass = prompt('New password for this worker:');
        if(!pass) return;
        if(pass.length < 4){ alert('Password needs at least 4 characters.'); return; }
        const all = await getWorkers();
        const w = all.find(x=>x.id===btn.dataset.reset);
        if(!w) return;
        w.passwordHash = await sha256Hex(pass);
        await saveWorker(w);
        alert('Password updated.');
      };
    });
    document.getElementById('wk-add').onclick = async function(){
      const name = document.getElementById('wk-name').value.trim();
      const pass = document.getElementById('wk-pass').value;
      const msg = document.getElementById('wk-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Enter a name.'; return; }
      if(!pass || pass.length < 4){ msg.style.color='var(--red)'; msg.textContent='Password needs at least 4 characters.'; return; }
      const all = await getWorkers();
      if(all.some(w=>w.name.toLowerCase()===name.toLowerCase())){
        msg.style.color='var(--red)'; msg.textContent='Someone with this name already exists.'; return;
      }
      this.disabled = true; this.textContent = 'Adding…';
      const id = uid();
      const passwordHash = await sha256Hex(pass);
      await saveWorker({ id, name, passwordHash, createdAt: new Date().toISOString() });
      paintWorkers(c);
    };
  }

  // ============================================================
  // Access (admin only)
  // ============================================================
  async function paintAccess(c){
    c.innerHTML = `<div class="empty">Loading workers…</div>`;
    const workers = (await getWorkers()).slice().sort((a,b)=>a.name.localeCompare(b.name));
    STATE.workers = workers;
    const access = STATE.access;
    c.innerHTML = `
      <div class="grp"><span>DO LIST ROLES</span><span class="c">${(STATE.doCfg.roles||[]).length}</span></div>
      <div class="help-blk">
        A role is a standing checklist — the same jobs every working day. Give somebody a role
        and the tab appears for them, with a fresh list each morning; leave it on
        <b>No Do list</b> and it doesn't.
      </div>
      <div class="card" style="padding:12px 15px;">
        ${(STATE.doCfg.roles||[]).map(r=>`
          <div style="padding:9px 0;border-bottom:1px solid var(--line);">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
              <b style="font-size:13px;color:var(--ink);">${escapeHtml(r.name)}</b>
              <span style="font-size:11.5px;color:var(--red);cursor:pointer;"
                data-delrole="${escapeHtml(r.id)}">Remove</span>
            </div>
            ${(r.tasks||[]).map((t,i)=>`
              <div style="display:flex;align-items:center;gap:9px;margin-top:7px;">
                <span class="mono" style="flex:0 0 auto;font-size:10.5px;color:var(--muted);
                  border:none;background:none;padding:0;">${i+1}</span>
                <span style="flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--text);
                  line-height:1.45;">${escapeHtml(t.text)}</span>
                <span style="flex:0 0 auto;font-size:11.5px;color:var(--red);cursor:pointer;"
                  data-deltask="${escapeHtml(r.id)}|${escapeHtml(t.id)}">&times;</span>
              </div>`).join('') || `<div style="font-size:11.5px;color:var(--muted);margin-top:6px;">
                No jobs yet — this role's list would be empty.</div>`}
            <div style="display:flex;gap:7px;margin-top:9px;">
              <input data-newtask="${escapeHtml(r.id)}" placeholder="Add a daily job…"
                style="flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--line);
                border-radius:9px;font-size:12.5px;">
              <button class="lot-act ghost" data-addtask="${escapeHtml(r.id)}"
                style="width:auto;flex:0 0 auto;padding:8px 13px;font-size:12px;border-radius:9px;">Add</button>
            </div>
          </div>`).join('') || `<div style="font-size:12px;color:var(--muted);padding:4px 0 10px;">
            No roles yet. Add one below, then list the jobs it has to get through each day.</div>`}
        <div style="display:flex;gap:7px;margin-top:11px;">
          <input id="do-newrole" placeholder="Role name, e.g. Import clerk" style="flex:1;
            padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;">
          <button class="lot-act ghost" id="do-addrole"
            style="width:auto;flex:0 0 auto;padding:9px 14px;font-size:12px;border-radius:9px;">Add</button>
        </div>
      </div>

      <div class="grp"><span>THE DAY</span></div>
      <div class="card" style="padding:13px 15px;">
        <div class="pfield">
          <label>Start warning at</label>
          <input type="time" id="do-cutoff" value="${escapeHtml(STATE.doCfg.cutoff||'17:30')}"
            style="width:100%;padding:9px 10px;border:1.5px solid var(--line);
            border-radius:9px;font-size:13px;font-family:inherit;">
        </div>
        <div class="pfield">
          <label>Points for a finished day</label>
          <input type="number" min="0" step="1" id="do-daypoints"
            value="${escapeHtml(String(STATE.doCfg.dayPoints != null ? STATE.doCfg.dayPoints : DO_DAY_POINTS))}"
            style="width:100%;padding:9px 10px;border:1.5px solid var(--line);
            border-radius:9px;font-size:13px;font-family:inherit;">
        </div>
        <div style="font-size:11.5px;color:var(--muted);line-height:1.65;margin-bottom:11px;">
          Earned once the whole list is cleared and their head approves the day &mdash;
          the same amount whether the list was three jobs or ten, so nobody is worse off
          for having more to do. A list with anything still open cannot be sent up at all,
          so a short day never reaches a head. A day sent back gives its points up until it
          is approved again. Changing this only affects days approved from now on.
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="lot-act ghost" id="do-newseason"
            style="width:auto;flex:0 0 auto;padding:9px 13px;font-size:12px;border-radius:9px;">
            Start a new season</button>
          <button class="lot-act ghost" id="do-recount"
            style="width:auto;flex:0 0 auto;padding:9px 13px;font-size:12px;border-radius:9px;">
            Recount</button>
        </div>
        <div id="do-season-msg" style="font-size:11.5px;margin-top:9px;"></div>
        <div style="font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:9px;">
          A new season puts everyone back to zero and keeps the closing table, so last
          season still has a winner. <b style="color:var(--text);">Approve anything
          outstanding first</b> &mdash; a day approved afterwards counts towards the new
          season whatever date it carries. Recount rebuilds the totals from the day
          records, for if a total ever looks wrong.
        </div>
        <div style="font-size:11.5px;color:var(--muted);line-height:1.65;">
          From then on, anyone with jobs still open is warned on every tab.
          A list runs until <b style="color:var(--text);">${String(DO_DAY_ENDS).padStart(2,'0')}:00</b>,
          so a night shift keeps the one it started with, and the next opens at
          <b style="color:var(--text);">${doDayLabel()}</b>. After midnight everyone is warned
          regardless of the time above.
        </div>
      </div>

      <div class="grp"><span>PEOPLE</span><span class="c">${workers.length}</span></div>
      <div class="help-blk">
        Same worker IDs as attendance, and everyone starts <b>Off</b> — nobody sees this board
        until you put them here.
        <br><br>
        <b>Edit</b> works the board: lots, charges, surveys. <b>Admin</b> adds creating and
        editing shipments. <b>Moderator</b> adds the wall display, Report, Settings, Worker IDs
        and this tab — give it only to whoever runs the board.
        <br><br>
        Mark a supervisor as <b>Head</b>, then tap names under <b>Reports to</b> to put a worker
        under them — more than one if two people supervise them, and either can approve. A head
        only sees the days of their own people, and anyone with no head set shows up for every
        head so a day is never left with nobody to look at it.
      </div>
      <div class="card" style="padding:2px 15px;">
        ${workers.map(w=>{
          const lvl = access[w.id] || 'off';
          const headChoices = workers.filter(x => (STATE.doCfg.heads||{})[x.id] && x.id !== w.id);
          const mine = headsOf(w.id);
          const isHead = !!(STATE.doCfg.heads||{})[w.id];
          const doRoleId = (STATE.doCfg.assign||{})[w.id] || '';
          const onBoard = lvl !== 'off';
          const open = STATE.accOpen === w.id;
          // What this person is set up as, in one line, so the list answers
          // the usual question without anything being opened.
          const roleName = (STATE.doCfg.roles||[]).find(r => r.id === doRoleId);
          const bits = [];
          if(w.role) bits.push(escapeHtml(w.role));
          if(onBoard){
            if(isHead) bits.push('Head');
            bits.push(roleName ? escapeHtml(roleName.name) : 'No Do list');
            if(!isHead && headChoices.length){
              bits.push(mine.length
                ? 'under ' + escapeHtml(headNames(mine).map(n => n.split(' ')[0]).join(', '))
                : '<span class="warn">no head</span>');
            }
          }
          return `
          <div class="pcard${open?' open':''}">
            <div class="prow" data-open="${w.id}">
              <div class="nm">
                <div class="n">${escapeHtml(w.name)}</div>
                ${bits.length ? `<div class="sub">${bits.join(' &middot; ')}</div>` : ''}
              </div>
              <span class="pcard-tag">${escapeHtml(LEVEL_LABEL[lvl] || lvl)}</span>
              <span class="chev">&#9654;</span>
            </div>
            ${!open ? '' : `
            <div class="pbody">
            <div class="pfield">
              <label>Access to this board</label>
              <div class="segp seg5" data-w="${w.id}">
                <span class="${lvl==='off'?'on off':''}" data-lvl="off">Off</span>
                <span class="${lvl==='view'?'on amb':''}" data-lvl="view">View</span>
                <span class="${lvl==='edit'?'on':''}" data-lvl="edit">Edit</span>
                <span class="${lvl==='admin'?'on':''}" data-lvl="admin">Admin</span>
                <span class="${lvl==='mod'?'on':''}" data-lvl="mod">Mod</span>
              </div>
            </div>

            ${!onBoard ? '' : `
            <div class="pfield">
              <label>Daily Do list</label>
              <select data-dorole="${w.id}">
                <option value="">No Do list</option>
                ${(STATE.doCfg.roles||[]).map(r=>`<option value="${escapeHtml(r.id)}"
                  ${doRoleId===r.id?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}
              </select>
            </div>

            ${isHead || !headChoices.length ? '' : `
            <div class="pfield">
              <label>Reports to</label>
              <div class="pchips">
                ${headChoices.map(h=>`<span class="pchip${mine.includes(h.id)?' on':''}"
                  data-under="${w.id}|${escapeHtml(h.id)}">${escapeHtml(h.name)}</span>`).join('')}
              </div>
              ${mine.length ? '' : `<div class="pnote">No head set &mdash; their day shows to every head</div>`}
            </div>`}

            <div class="pfield">
              <label>Also</label>
              <div class="ptoggles">
                <span class="ptoggle${isHead?' on':''}" data-head-w="${w.id}">Head</span>
                <span class="ptoggle${(lvl==='mod' || STATE.display[w.id])?' on':''}${
                  lvl==='mod'?' locked':''}" data-disp="${w.id}"
                  >Wall display${lvl==='mod'?' (always)':''}</span>
              </div>
            </div>`}
            </div>`}
          </div>`;
        }).join('')}
      </div>
      <div style="height:20px;"></div>`;
    // ---- Do list roles ----
    const saveDo = async (mutate) => {
      const cfg = JSON.parse(JSON.stringify(STATE.doCfg || { roles:[], assign:{}, cutoff:'17:30' }));
      mutate(cfg);
      try{ await saveDoConfig(cfg); }
      catch(e){ alert('Could not save — try again.'); return; }
      paintAccess(c);
      // The tab bar itself may have just appeared or gone for this person.
      if(STATE.tab === 'access') paintShell();
    };
    const addRole = document.getElementById('do-addrole');
    if(addRole) addRole.onclick = async () => {
      const el = document.getElementById('do-newrole');
      const name = (el.value || '').trim();
      if(!name){ el.style.borderColor = 'var(--red)'; return; }
      await saveDo(cfg => {
        cfg.roles = (cfg.roles || []).concat([{ id: 'r' + Date.now().toString(36), name, tasks: [] }]);
      });
    };
    c.querySelectorAll('[data-addtask]').forEach(btn=>{
      btn.onclick = async () => {
        const rid = btn.dataset.addtask;
        const inp = c.querySelector(`[data-newtask="${CSS.escape(rid)}"]`);
        const text = ((inp && inp.value) || '').trim();
        if(!text){ if(inp) inp.style.borderColor = 'var(--red)'; return; }
        await saveDo(cfg => {
          const r = (cfg.roles || []).find(x => x.id === rid);
          if(!r) return;
          r.tasks = (r.tasks || []).concat([
            { id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,5), text }]);
        });
      };
    });
    c.querySelectorAll('[data-newtask]').forEach(inp=>{
      inp.onkeydown = (e) => {
        if(e.key !== 'Enter') return;
        const btn = c.querySelector(`[data-addtask="${CSS.escape(inp.dataset.newtask)}"]`);
        if(btn) btn.click();
      };
    });
    c.querySelectorAll('[data-deltask]').forEach(el=>{
      el.onclick = async () => {
        const [rid, tid] = el.dataset.deltask.split('|');
        await saveDo(cfg => {
          const r = (cfg.roles || []).find(x => x.id === rid);
          if(r) r.tasks = (r.tasks || []).filter(t => t.id !== tid);
        });
      };
    });
    c.querySelectorAll('[data-delrole]').forEach(el=>{
      el.onclick = async () => {
        const id = el.dataset.delrole;
        const cfg = STATE.doCfg || {};
        const held = Object.keys(cfg.assign || {}).filter(k => cfg.assign[k] === id).length;
        if(!confirm(`Remove this role?` + (held
          ? `\n\n${held} ${held===1?'person loses their':'people lose their'} Do list.` : ''))) return;
        await saveDo(c2 => {
          c2.roles = (c2.roles || []).filter(r => r.id !== id);
          Object.keys(c2.assign || {}).forEach(k => { if(c2.assign[k] === id) delete c2.assign[k]; });
        });
      };
    });
    // One open at a time — a second tap closes it, and opening another
    // closes the first, so the list never grows into a wall of settings.
    c.querySelectorAll('[data-open]').forEach(row=>{
      row.onclick = () => {
        STATE.accOpen = STATE.accOpen === row.dataset.open ? null : row.dataset.open;
        paintAccess(c);
      };
    });
    c.querySelectorAll('[data-head-w]').forEach(sp=>{
      sp.onclick = async () => {
        const wid = sp.dataset.headW;
        const on = !(STATE.doCfg.heads || {})[wid];
        if(!on){
          // Only the people this is their ONLY head need warning about —
          // anyone with a second one still has somebody to approve them.
          const orphaned = (STATE.workers || workers).filter(x => {
            const hs = headsOf(x.id);
            return hs.includes(wid) && hs.length === 1;
          }).length;
          if(orphaned && !confirm(`Stop them being a head?\n\n${orphaned} `
            + `worker${orphaned===1?'':'s'} would be left with no head at all, and their days `
            + `would show to every head until you set one.`)) return;
        }
        await saveDo(cfg => {
          cfg.heads = cfg.heads || {};
          cfg.under = cfg.under || {};
          if(on){
            cfg.heads[wid] = true;
            delete cfg.under[wid];      // a head does not report to a head
          } else {
            delete cfg.heads[wid];
            Object.keys(cfg.under).forEach(k => {
              const cur = Array.isArray(cfg.under[k]) ? cfg.under[k] : [cfg.under[k]];
              const next = cur.filter(x => x && x !== wid);
              if(next.length) cfg.under[k] = next; else delete cfg.under[k];
            });
          }
        });
        if(wid === ME.id){ STATE.doPending = null; if(isApprover()) await loadDoPending(); }
      };
    });
    c.querySelectorAll('[data-under]').forEach(sp=>{
      sp.onclick = async () => {
        const [wid, hid] = sp.dataset.under.split('|');
        await saveDo(cfg => {
          cfg.under = cfg.under || {};
          const cur = Array.isArray(cfg.under[wid]) ? cfg.under[wid].slice()
            : (cfg.under[wid] ? [cfg.under[wid]] : []);
          const next = cur.includes(hid) ? cur.filter(x => x !== hid) : cur.concat([hid]);
          if(next.length) cfg.under[wid] = next; else delete cfg.under[wid];
        });
      };
    });
    c.querySelectorAll('[data-dorole]').forEach(sel=>{
      sel.onchange = async () => {
        const wid = sel.dataset.dorole, rid = sel.value;
        await saveDo(cfg => {
          cfg.assign = cfg.assign || {};
          if(rid) cfg.assign[wid] = rid; else delete cfg.assign[wid];
        });
        // Their own list just changed shape, so reload the day record.
        if(wid === ME.id){ STATE.doLog = null; if(hasDoList()) await loadDoDay(); }
      };
    });
    const cut = document.getElementById('do-cutoff');
    if(cut) cut.onchange = async () => {
      const v = cut.value;
      if(!/^\d{2}:\d{2}$/.test(v)) return;
      await saveDo(cfg => { cfg.cutoff = v; });
    };
    const dayPts = document.getElementById('do-daypoints');
    if(dayPts) dayPts.onchange = async () => {
      const n = Math.max(0, Math.round(Number(dayPts.value)));
      if(!isFinite(n)){ dayPts.value = String(STATE.doCfg.dayPoints ?? DO_DAY_POINTS); return; }
      await saveDo(cfg => { cfg.dayPoints = n; });
    };
    const seasonMsg = () => document.getElementById('do-season-msg');
    const newSeason = document.getElementById('do-newseason');
    if(newSeason) newSeason.onclick = async () => {
      if(STATE.doPoints === null) await loadDoPoints();
      const cur = (STATE.doPoints && STATE.doPoints.season) || null;
      const name = prompt('Name for the new season', 'Season '
        + (((STATE.doPoints && STATE.doPoints.past) || []).length + 2));
      if(name === null) return;
      const clean = (name || '').trim() || 'New season';
      const people = Object.keys((STATE.doPoints && STATE.doPoints.byWorker) || {}).length;
      if(!confirm(`Close ${cur && cur.name ? cur.name : 'the current season'} and start "${clean}"?`
        + `\n\n${people} ${people===1?'person goes':'people go'} back to zero. The closing`
        + ` table is kept. Approve any days still waiting first — approving one after this`
        + ` counts towards the new season.`)) return;
      newSeason.disabled = true; newSeason.textContent = 'Starting…';
      const ok = await startNewDoSeason(clean);
      newSeason.disabled = false; newSeason.textContent = 'Start a new season';
      const m = seasonMsg();
      if(m){
        m.style.color = ok ? 'var(--green)' : 'var(--red)';
        m.textContent = ok ? `"${clean}" has started — everyone is back to zero.`
          : 'Could not start the season — nothing was changed.';
      }
    };
    const recount = document.getElementById('do-recount');
    if(recount) recount.onclick = async () => {
      if(STATE.doPoints === null) await loadDoPoints();
      recount.disabled = true; recount.textContent = 'Reading…';
      const m = seasonMsg();
      try{
        const out = await recountDoPoints();
        if(m){
          m.style.color = 'var(--green)';
          m.textContent = `Recounted: ${out.points} points across ${out.people} `
            + `${out.people===1?'person':'people'} this season.`;
        }
      }catch(e){
        if(m){ m.style.color = 'var(--red)';
          m.textContent = 'Could not recount: ' + (e.message || e) + ' — nothing was changed.'; }
      }
      recount.disabled = false; recount.textContent = 'Recount';
    };

    c.querySelectorAll('[data-disp]').forEach(sp=>{
      sp.onclick = async () => {
        const wid = sp.dataset.disp;
        if((STATE.access[wid] || 'off') === 'mod') return; // moderators always have it
        const now = !STATE.display[wid];
        sp.classList.toggle('on', now);
        await setDisplayFor(wid, now);
        if(now) STATE.display[wid] = true; else delete STATE.display[wid];
        if(wid === ME.id){ CAN_DISPLAY = IS_MOD || now; paintShell(); }
      };
    });
    c.querySelectorAll('.segp[data-w]').forEach(seg=>{
      seg.querySelectorAll('span').forEach(sp=>{
        sp.onclick = async () => {
          const wid = seg.dataset.w, lvl = sp.dataset.lvl;
          // This tab is the only way back in. Losing the last moderator would
          // lock the board's settings away for good, so it is refused.
          const wasMod = (STATE.access[wid] || 'off') === 'mod';
          if(wasMod && lvl !== 'mod'){
            const others = Object.keys(STATE.access)
              .filter(k => k !== wid && STATE.access[k] === 'mod').length;
            if(others === 0){
              alert('This is the only moderator. Make someone else a moderator first, '
                + 'otherwise nobody could reach Settings, Worker IDs or this tab again.');
              return;
            }
          }
          seg.querySelectorAll('span').forEach(x=>x.className='');
          sp.className = lvl==='off' ? 'on off' : lvl==='view' ? 'on amb' : 'on';
          await setAccessFor(wid, lvl);
          STATE.access[wid] = lvl;
          if(wid === ME.id){
            applyLevel(lvl);
            CAN_DISPLAY = IS_MOD || !!STATE.display[wid];
            // Demoting yourself closes the tab you are standing on.
            if(!IS_MOD) STATE.tab = 'board';
            paintShell();
            return;
          }
          // Turning somebody off takes away their Do list and the rest of
          // the card with it, so the row is drawn again rather than left
          // showing settings that no longer apply.
          paintAccess(c);
        };
      });
    });
  }

  // ============================================================
  // Wall display board — a read-only, full-screen view for an office
  // screen. Kept deliberately separate from the working app: big type,
  // no controls, and a live Firestore listener so it updates itself as
  // people move shipments along on their phones. Nobody has to touch it.
  // ============================================================
  function renderDisplayBoard(){
    let unsub = null, unsubDone = null, clockTimer = null, pageTimer = null, minuteTimer = null, wakeLock = null;
    let doneToday = 0;
    let rows = [], page = 0;
    // Measured once per resize: the real height of each kind of line, and how
    // much room the grid has below its column header.
    let H = { hd:40, row:46, sub:60, head:30 }, gridBudget = 0, pageRanges = [];
    const lastSeen = new Map();     // shipment id -> stage text, to spot changes
    const flashing = new Set();

    const el = document.createElement('div');
    el.className = 'disp';
    el.innerHTML = `
      <div class="disp-head">
        <div class="disp-title">EXPREXA <span>FORWARDING</span></div>
        <div class="disp-clock" id="dp-clock"></div>
      </div>
      <div class="disp-stats" id="dp-stats"></div>
      <div class="disp-grid" id="dp-grid"></div>
      <div class="disp-foot">
        <span id="dp-status">Connecting…</span>
        <div class="disp-dots" id="dp-dots"></div>
        <button class="disp-exit" id="dp-exit">Exit display</button>
      </div>`;
    document.body.appendChild(el);

    // Keep the screen awake and go full screen — both are best-effort and
    // silently skipped where the browser doesn't allow it.
    // The browser drops a screen wake lock every time the page is hidden and
    // never hands it back on its own. Asking once was enough for the first
    // sleep only: after that the screen slept, the device followed, and the
    // browser eventually discarded the tab — which is what put a login box
    // on the wall overnight. So it is re-requested every time we come back.
    async function holdScreenAwake(){
      if(!navigator.wakeLock || document.hidden) return;
      if(wakeLock && !wakeLock.released) return;
      try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
    }
    (async () => {
      await holdScreenAwake();
      try{ if(el.requestFullscreen) await el.requestFullscreen(); }catch(e){}
    })();

    function tickClock(){
      const now = new Date();
      const clock = document.getElementById('dp-clock');
      if(clock) clock.innerHTML = `${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}` +
        `<small>${now.toLocaleDateString([], {weekday:'long', day:'numeric', month:'long'})}</small>`;
    }

    // Sort the way a flight board does: whatever needs attention first,
    // then longest-waiting.
    function rank(r){ return r.level === 'bad2' ? 0 : r.level === 'warn2' ? 1 : 2; }
    function dispDay(d){
      if(!d) return '—';
      const dt = new Date(d + 'T00:00:00');
      return isNaN(dt) ? String(d) : dt.toLocaleDateString(undefined,{day:'2-digit',month:'short'});
    }
    function dispDate(iso){
      if(!iso) return '—';
      const d = new Date(iso);
      return isNaN(d) ? '—' : d.toLocaleDateString(undefined,{day:'2-digit',month:'short'});
    }

    function lvlFrom(iso, thr){
      const l = ageLevel(ageHours(iso), thr || 24);
      return l === 'bad' ? 'bad2' : l === 'warn' ? 'warn2' : 'ok2';
    }
    // Expected arrival (import) or departure (export), as entered at creation.
    function etaOf(s){
      if(s.type === 'export') return { date: s.departDate, time: s.departTime };
      const lot = (s.lots||[])[0] || {};
      return { date: lot.expectedDate, time: lot.expectedTime };
    }
    // A consolidation shows one line per house bill, since each one is
    // cleared or delivered separately — a single row would hide which of
    // them is actually holding things up.
    function build(shipments){
      const out = [];
      shipments.filter(s => !s.closed).forEach(s => {
        const sum = summarise(s);
        const eta = etaOf(s);
        const base = {
          id: s.id, awb: s.awb, type: s.type, k1: isK1Shipment(s),
          customer: s.customer || '—',
          created: s.createdAt,
          eta: eta.date, etaTime: eta.time,
          flight: s.flight || '',
          terminal: terminalForAwb(s.awb, STATE.terminals) || '',
          shipId: s.id,
          hasBalance: hasArrivalShortfall(s),
          outstandingPcs: outstandingTotal(s),
          notArrived: s.type === 'import' && !(s.lots||[]).some(l => l.hasArrived),
          closing: awaitingClosing(s)
        };
        const hawbs = hawbList(s);
        if(hawbs.length === 0){
          out.push({ ...base, hawb: '', stage: shipmentStatus(s),
            waitFrom: lastStageIso(s),
            level: sum.ageClass === 'bad' ? 'bad2' : sum.ageClass === 'warn' ? 'warn2' : 'ok2' });
          return;
        }
        if(s.type === 'export'){
          // Each HAWB runs its own roadmap, so each has its own status.
          exportTracks(s).forEach(t => {
            if(t.closed) return;
            out.push({ ...base, hawb: t.no, stage: EXPORT_STEPS[t.stage],
              waitFrom: t.stageAt, level: lvlFrom(t.stageAt, THRESH.exp[t.stage]) });
          });
          return;
        }
        // Import: each house bill rides its own lot, so each line carries its
        // own status, its own wait and its own expected arrival. One bill
        // landing and clearing no longer drags the one still in the air along
        // with it, and a bill in the air no longer borrows the other's stage.
        const prog = hawbProgress(s);
        const fallbackLevel = sum.ageClass === 'bad' ? 'bad2' : sum.ageClass === 'warn' ? 'warn2' : 'ok2';
        prog.forEach(h => {
          const l = activeLotForHawb(s, h.no);
          const arrived = hawbArrived(s, h.no);
          const working = !!l && l.hasArrived && !l.closed;
          // An empty lot has no delivery counter worth showing — "Delivery 0/1"
          // looks like a run that went out short rather than cargo that never
          // came — so it keeps whatever its own status says.
          const atDelivery = working && !lotEmpty(l) && l.stage === deliveryIdx(importSteps(l));
          let stage = hawbStatus(s, h);
          if(atDelivery){
            stage = h.status === 'done' ? 'Delivered'
              : `Delivery ${h.delivered}${h.pcs != null ? '/' + h.pcs : ''}`;
          }
          // Waiting since its own lot last moved — or since booking, while it
          // is still in the air.
          const waitFrom = working ? (l.stageAt || s.createdAt)
            : (l ? s.createdAt : lastStageIso(s));
          out.push({ ...base,
            hawb: h.no,
            k1: l ? !!l.hasK1 : base.k1,
            customer: h.customer || s.customer || '—',
            eta: l ? (l.expectedDate || null) : base.eta,
            etaTime: l ? (l.expectedTime || null) : base.etaTime,
            flight: (l && l.flight) || h.flight || s.flight || '',
            hasBalance: !s.closed && arrived && (hawbBalance(s, h) || 0) > 0,
            notArrived: !arrived,
            stage, waitFrom,
            level: atDelivery && h.status === 'done' ? 'ok2'
              : working ? lvlFrom(waitFrom, importThresh(l)[l.stage])
              : fallbackLevel });
        });
      });
      // Furthest along first, on the same scale the board orders its status
      // groups by — one definition of "how far along", so the two screens
      // can never disagree about what is nearest the end. Finished
      // consignments are the exception and go to the very bottom: they are
      // as far along as a thing gets, which would otherwise park the lines
      // needing nothing at the top of a wall meant to show what is left.
      const progress = r => statusProgress(r.stage, r.type, r.k1);
      return out.sort((a,b) =>
        (FINISHED_STATUS(a.stage) ? 1 : 0) - (FINISHED_STATUS(b.stage) ? 1 : 0) ||
        progress(b) - progress(a) ||
        a.awb.localeCompare(b.awb) || String(a.hawb).localeCompare(String(b.hawb)));
    }

    // A house bill's row carries a second line under the AWB, so it is taller
    // than a plain one, and a section heading is shorter than either. Measuring
    // all three means a page can be filled to the edge of the screen instead of
    // to the worst case, which is what left a band of empty space at the bottom.
    function measurePerPage(){
      const grid = document.getElementById('dp-grid');
      if(!grid) return;
      const cells = sub => '<span class="disp-mono">22 Sep</span>'
        + '<span class="disp-awb">000-00000000' + (sub ? '<span class="hsub">KCH-0000</span>' : '') + '</span>'
        + '<span><span class="disp-tag imp">IMP</span></span><span class="disp-cust">x</span>'
        + '<span class="disp-mono">x</span><span class="disp-mono">x</span>'
        + '<span class="disp-stage">x</span><span class="disp-age">0h 00m</span>';
      const probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;width:'
        + (grid.clientWidth || 1200) + 'px;';
      probe.innerHTML = `<div class="disp-row hd">${cells(false)}</div>`
        + `<div class="disp-row">${cells(false)}</div>`
        + `<div class="disp-row">${cells(true)}</div>`
        + `<div class="disp-grp"><b>IMPORT</b><i>0</i></div>`;
      grid.appendChild(probe);
      const k = probe.children;
      H = { hd: k[0].offsetHeight || 40, row: k[1].offsetHeight || 46,
            sub: k[2].offsetHeight || 60, head: k[3].offsetHeight || 30 };
      probe.remove();
      gridBudget = Math.max(H.row, grid.clientHeight - H.hd);
    }
    function itemH(it){ return it.head ? H.head : (it.r && it.r.hawb ? H.sub : H.row); }
    // Fill the screen, then even the pages out. The page count comes from how
    // much actually fits, so nothing is wasted; the rows are then spread
    // equally across those pages, so the board does not alternate between a
    // full screen and a nearly empty one.
    function paginate(items){
      if(!items.length) return [[0, 0]];
      const total = items.reduce((n, it) => n + itemH(it), 0);
      const budget = gridBudget || 600;
      const fewest = Math.max(1, Math.ceil(total / budget));
      for(let pages = fewest; pages <= items.length; pages++){
        const out = splitEvenly(items, pages, budget);
        if(out) return out;
      }
      return [[0, items.length]];
    }
    function splitEvenly(items, pages, budget){
      const per = Math.ceil(items.length / pages);
      const out = [];
      let i = 0;
      while(i < items.length){
        const start = i;
        let h = 0, n = 0;
        while(i < items.length && n < per && h + itemH(items[i]) <= budget){
          h += itemH(items[i]); i++; n++;
        }
        // A section heading must never be left stranded at the foot of a page.
        while(i > start && i < items.length && items[i-1].head) i--;
        if(i === start) return null;   // nothing fits; the caller tries more pages
        out.push([start, i]);
        if(out.length > pages) return null;
      }
      return out;
    }

    function paintStats(){
      const stats = document.getElementById('dp-stats');
      if(!stats) return;
      const imp = rows.filter(r=>r.type==='import').length;
      const exp = rows.filter(r=>r.type==='export').length;
      const notArrived = rows.filter(r=>r.notArrived).length;
      const closing = rows.filter(r=>r.closing).length;
      // Counted as AWBs, not pieces — and a consolidation spans several
      // lines, so each shipment is only counted once. A balance now belongs
      // to the house bill that was short, so the shipment counts if any of
      // its lines carries one; taking only the first line would have missed
      // a shortfall on the second house bill.
      const bal = {}, outs = {};
      rows.forEach(r => {
        if(r.hasBalance) bal[r.shipId] = true;
        if((r.outstandingPcs || 0) > 0) outs[r.shipId] = true;
      });
      const balanceAwbs = Object.keys(bal).length;
      const outstandingAwbs = Object.keys(outs).length;
      // One figure per terminal you've set up, named as you named them —
      // nothing hardcoded, so adding a terminal adds a figure here.
      const terminalStats = (STATE.terminals||[]).map(t =>
        `<div><b>${rows.filter(r=>r.terminal===t.name).length}</b><span>${escapeHtml(t.name.toUpperCase())}</span></div>`).join('');
      stats.innerHTML = `
        <div><b>${rows.length}</b><span>ACTIVE LINES</span></div>
        <div><b>${imp}</b><span>IMPORT</span></div>
        <div><b>${exp}</b><span>EXPORT</span></div>
        ${terminalStats}
        <div><b>${notArrived}</b><span>NOT ARRIVED</span></div>
        <div class="amb"><b>${balanceAwbs}</b><span>BALANCE</span></div>
        <div class="amb"><b>${outstandingAwbs}</b><span>OUTSTANDING</span></div>
        <div class="amb"><b>${closing}</b><span>CLOSING</span></div>
        <div style="margin-left:auto;text-align:right;"><b style="color:#4ED8A0;">${doneToday}</b><span>COMPLETED TODAY</span></div>`;
    }

    // Sectioned the same way the All tab groups its board: a heading with a
    // count, then its lines. K1 imports sit in their own section rather than
    // inside IMPORT, since they follow a different clearance path.
    function sectioned(){
      const groups = [
        { label:'IMPORT', rows: rows.filter(r => r.type === 'import' && !r.k1) },
        { label:'EXPORT', rows: rows.filter(r => r.type === 'export') },
        { label:'K1',     rows: rows.filter(r => r.type === 'import' && r.k1) }
      ].filter(g => g.rows.length);
      const items = [];
      groups.forEach(g => {
        items.push({ head:true, label:g.label, count:g.rows.length });
        g.rows.forEach(r => items.push({ head:false, r }));
      });
      return items;
    }

    function paint(){
      const grid = document.getElementById('dp-grid');
      if(!grid) return;
      const items = sectioned();
      pageRanges = paginate(items);
      const pages = Math.max(1, pageRanges.length);
      if(page >= pages) page = 0;
      const [start, end] = pageRanges[page] || [0, 0];
      const slice = items.slice(start, end);

      grid.innerHTML = `
        <div class="disp-row hd">
          <span>CREATED</span><span>AWB</span><span>TYPE</span><span>CUSTOMER</span>
          <span>ETA</span><span>FLIGHT</span><span>STATUS</span><span style="text-align:right;">WAITING</span>
        </div>
        ${slice.map(it => it.head
          ? `<div class="disp-grp"><b>${escapeHtml(it.label)}</b><i>${it.count}</i></div>`
          : ((r => `
          <div class="disp-row ${flashing.has(r.id) ? 'flash' : ''}">
            <span class="disp-mono">${escapeHtml(dispDate(r.created))}</span>
            <span class="disp-awb">${escapeHtml(r.awb)}${r.hawb ? `<span class="hsub">${escapeHtml(r.hawb)}</span>` : ''}</span>
            <span><span class="disp-tag ${r.type==='export'?'exp':'imp'}">${r.type==='export'?'EXP':'IMP'}</span>${r.k1?'<span class="disp-tag k1">K1</span>':''}</span>
            <span class="disp-cust">${escapeHtml(r.customer)}</span>
            <span class="disp-mono">${escapeHtml(r.eta ? dispDay(r.eta) : '—')}${r.etaTime ? `<span style="color:#6E7B99;"> ${escapeHtml(r.etaTime)}</span>` : ''}</span>
            <span class="disp-mono">${escapeHtml(r.flight || '—')}</span>
            <span class="disp-stage ${r.closing ? 'warn2' : ''}">${escapeHtml(r.stage)}</span>
            <span class="disp-age ${r.level}">${escapeHtml(waitStr(r.waitFrom))}</span>
          </div>`)(it.r))).join('')}
        ${slice.length === 0 ? '<div class="disp-row"><span class="disp-cust">Nothing active right now.</span></div>' : ''}`;

      // Stretch the rows to the foot of the screen, but only on a page that
      // is mostly full — three rows pulled across a wall display would look
      // absurd, and an almost empty board is not what this is for.
      const used = slice.reduce((n, it) => n + itemH(it), 0);
      grid.classList.toggle('fill', gridBudget > 0 && used >= gridBudget * 0.66);

      const dots = document.getElementById('dp-dots');
      dots.innerHTML = pages > 1
        ? Array.from({length: pages}, (_,i)=>`<i class="${i===page?'on':''}"></i>`).join('') +
          `<span style="margin-left:10px;">Page ${page+1} of ${pages}</span>`
        : '';
    }

    function exit(){
      detach();
      clearInterval(clockTimer); clearInterval(pageTimer); clearInterval(minuteTimer);
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      try{ if(wakeLock) wakeLock.release(); }catch(e){}
      try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
      el.remove();
      paintShell();
    }
    function onKey(e){ if(e.key === 'Escape') exit(); }
    function onResize(){ measurePerPage(); paint(); }
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', onResize);
    document.getElementById('dp-exit').onclick = exit;

    tickClock();
    clockTimer = setInterval(tickClock, 1000);
    // Redraw once a minute so the waiting times keep counting up between
    // changes — no reads, just a re-render of what's already loaded.
    minuteTimer = setInterval(() => { if(!document.hidden) paint(); }, 60000);
    measurePerPage();
    function cyclePage(){
      // Worked out by the last paint, which packed the pages by real height.
      const pages = Math.max(1, pageRanges.length);
      if(pages > 1){ page = (page + 1) % pages; paint(); }
    }
    pageTimer = setInterval(cyclePage, 12000);

    // Live: the board redraws whenever anyone changes a shipment anywhere.
    function attach(){
      if(unsub) return;
      unsub = db.collection(SHIP).where('closed','==', false).onSnapshot(snap => {
      const shipments = snap.docs.map(d => d.data());
      rows = build(shipments);
      // Flag anything whose status changed since the last update so it
      // catches the eye for a few seconds.
      rows.forEach(r => {
        const prev = lastSeen.get(r.id);
        if(prev !== undefined && prev !== r.stage){
          flashing.add(r.id);
          setTimeout(() => { flashing.delete(r.id); }, 3000);
        }
        lastSeen.set(r.id, r.stage);
      });
      const st = document.getElementById('dp-status');
      if(st) st.textContent = `Live · ${rows.length} active · updated ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      paintStats();
      measurePerPage();
      paint();
      }, err => {
        const st = document.getElementById('dp-status');
        if(st) st.textContent = 'Lost connection — retrying…';
        console.error('Display board listener error:', err);
      });
    }
    function attachDone(){
      if(unsubDone) return;
      // Small, separate listener: only today's closed shipments, so the
      // completed total updates the moment someone closes one.
      unsubDone = db.collection(SHIP).where('closedDate','==', todayStr()).onSnapshot(snap => {
        doneToday = snap.docs.filter(d => d.data().closed).length;
        paintStats();
      }, err => console.error('Completed-today listener error:', err));
    }
    function detach(){
      if(unsub){ unsub(); unsub = null; }
      if(unsubDone){ unsubDone(); unsubDone = null; }
    }
    // A board left open behind other windows shouldn't keep a live listener
    // running for nobody — drop it while hidden and pick it up on return.
    function onVisibility(){
      if(document.hidden){
        detach();
        clearInterval(pageTimer); pageTimer = null;
        const st = document.getElementById('dp-status');
        if(st) st.textContent = 'Paused while in the background';
      } else {
        holdScreenAwake();
        if(!unsub){
          attach(); attachDone();
          if(!pageTimer) pageTimer = setInterval(cyclePage, 12000);
        }
      }
    }
    document.addEventListener('visibilitychange', onVisibility);
    attach(); attachDone();
  }

  boot();
})();
</script>
</body>
</html>
