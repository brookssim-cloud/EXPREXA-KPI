<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exprexa Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --ink-2:#1D2E52; --paper:#EEF1F6; --card:#FFFFFF;
    --amber:#F2A93B; --amber-dark:#C97F12; --green:#1F9D6B; --red:#D64545;
    --text:#1B2333; --muted:#67708A; --line:#DCE1EA; --radius:14px;
    --gold:#E3B341; --silver:#A9B3C4; --bronze:#C88A4E;
    --olive:#4B5320; --olive-dark:#3A4019; --khaki:#C3B091; --khaki-dark:#9C8B5E; --tan-paper:#F1EDDF;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  .app{max-width:680px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column;}
  .topbar{background:var(--ink); color:#fff; padding:18px 20px 16px; position:relative; overflow:hidden;}
  .topbar::after{content:""; position:absolute; top:0; right:-40px; width:140px; height:140%;
    background:repeating-linear-gradient(-45deg, var(--amber) 0 10px, transparent 10px 20px); opacity:0.12;}
  .brand{display:flex; align-items:baseline; gap:10px; position:relative; z-index:1;}
  .brand .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;}
  .brand .tag{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber);
    letter-spacing:0.08em; text-transform:uppercase; border:1px solid rgba(242,169,59,0.5); padding:2px 6px; border-radius:4px;}
  .subline{font-size:12.5px; color:#B9C2DA; margin-top:6px; position:relative; z-index:1;}

  .tabs{display:flex; background:var(--ink-2); position:relative; z-index:1; overflow-x:auto;}
  .tab{flex:1; min-width:78px; padding:11px 6px; text-align:center; font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:12px; color:#A9B3CE; cursor:pointer; border-bottom:3px solid transparent;
    transition:color .15s, border-color .15s; user-select:none; white-space:nowrap; position:relative;}
  .tab.active{color:#fff; border-bottom-color:var(--amber);}
  .tab .dot{
    position:absolute; top:6px; right:10px; width:7px; height:7px; border-radius:50%; background:var(--red);
  }

  .content{flex:1; padding:20px 16px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  .card{background:var(--card); border-radius:var(--radius); padding:18px; border:1px solid var(--line); margin-bottom:14px;}
  .card h3{margin:0 0 14px; font-family:'Space Grotesk',sans-serif; font-size:15px; display:flex; align-items:center; gap:8px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber-dark); margin-bottom:6px;}
  .help{font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:12px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;}
  .field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14.5px; font-family:'Inter',sans-serif; background:#fff; color:var(--text);}
  .field input:focus, .field select:focus{outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .toggle-group{display:flex; gap:10px; margin-bottom:14px;}
  .toggle-opt{flex:1; text-align:center; padding:12px 8px; border-radius:10px; border:2px solid var(--line);
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; cursor:pointer; color:var(--muted); background:#fff;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:9px;
    border:none; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    transition:transform .08s, opacity .15s;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-primary{background:var(--ink); color:#fff; width:100%;}
  .btn-amber{background:var(--amber); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .btn-red{background:rgba(214,69,69,0.1); color:var(--red);}
  .btn-green{background:rgba(31,157,107,0.12); color:var(--green);}
  .btn-sm{padding:7px 12px; font-size:12.5px;}
  .btn-block{width:100%;}

  .rank-row{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card);
    border-radius:12px; border:1px solid var(--line); margin-bottom:8px;}
  .rank-medal{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:#fff; flex-shrink:0;}
  .medal-1{background:var(--gold);} .medal-2{background:var(--silver);} .medal-3{background:var(--bronze);}
  .medal-n{background:var(--line); color:var(--muted);}
  .rank-info{flex:1; min-width:0;}
  .rank-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px;}
  .rank-role{font-size:11.5px; color:var(--muted);}
  .rank-points{text-align:right; flex-shrink:0;}
  .rank-points .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--amber-dark);}
  .rank-points .l{font-size:10px; color:var(--muted); text-transform:uppercase;}

  .stat-strip{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--card); border-radius:10px; padding:12px 14px; border:1px solid var(--line);}
  .stat .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;}
  .stat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .worker-card{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:14px 16px; margin-bottom:10px;}
  .worker-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .worker-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .worker-role{font-size:12px; color:var(--muted);}
  .worker-balance{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--amber-dark);
    background:#FFF6E8; padding:3px 9px; border-radius:20px;}

  .target-item{padding:12px 0; border-top:1px solid var(--line);}
  .target-item:first-child{border-top:none; padding-top:6px;}
  .target-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .target-title{font-weight:600; font-size:13.5px;}
  .target-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .target-pts{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--amber-dark); white-space:nowrap;}
  .target-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .badge{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; padding:2px 8px;
    border-radius:20px; font-family:'IBM Plex Mono',monospace;}
  .badge-achieved{color:var(--green); background:rgba(31,157,107,0.12);}
  .badge-pending{color:var(--amber-dark); background:#FFF3DD;}
  .badge-rejected{color:var(--red); background:rgba(214,69,69,0.1);}

  select.select-worker{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:14.5px; margin-bottom:14px; background:#fff;}

  /* Worker checklist (bulk target assignment) */
  .worker-check-list{
    max-height:220px; overflow-y:auto; border:1.5px solid var(--line); border-radius:8px;
    padding:4px; margin-bottom:4px;
  }
  .worker-check-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; cursor:pointer;
  }
  .worker-check-item:hover{background:var(--paper);}
  .worker-check-item input[type=checkbox]{
    width:17px; height:17px; flex-shrink:0; accent-color:var(--ink); cursor:pointer; margin:0;
  }
  .worker-check-item .wc-name{
    flex:1; min-width:0; font-size:13.5px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .worker-check-item .wc-role{
    font-size:10.5px; color:var(--muted); background:var(--paper); border:1px solid var(--line);
    padding:3px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .worker-check-empty{padding:16px; text-align:center; color:var(--muted); font-size:12.5px;}

  .ledger-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13px;}
  .ledger-row:first-child{border-top:none;}
  .ledger-note{color:var(--text);}
  .ledger-date{font-size:11px; color:var(--muted); margin-top:1px;}
  .ledger-pts{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .pts-earn{color:var(--green);} .pts-redeem{color:var(--red);}

  .empty{text-align:center; padding:36px 16px; color:var(--muted); font-size:13px;}
  footer.note{text-align:center; font-size:11px; color:var(--muted); padding:16px 20px 30px;}
  .toprow{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .toprow h2{font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0;}

  /* Submission review card */
  .sub-card{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:14px; margin-bottom:12px;}
  .sub-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .sub-title{font-weight:600; font-size:13.5px;}
  .sub-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .sub-photo{width:100%; max-height:260px; object-fit:cover; border-radius:10px; border:1px solid var(--line); margin-bottom:10px; display:block; cursor:pointer;}
  .sub-note{font-size:13px; color:var(--text); background:var(--paper); padding:8px 10px; border-radius:8px; margin-bottom:10px;}
  .sub-actions{display:flex; gap:8px;}

  /* Worker portal */
  .worker-shell{max-width:440px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  .worker-hero{background:var(--ink); color:#fff; padding:30px 22px 22px; position:relative; overflow:hidden;}
  .worker-hero::after{content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(-45deg, var(--amber) 0 10px, var(--ink-2) 10px 20px);}
  .worker-hero .co{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .worker-hero .sub{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--amber); margin-top:4px;}
  .worker-body{flex:1; padding:22px 18px 40px;}

  .pick-card{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px;
    margin-bottom:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .pick-card:active{transform:scale(0.99);}
  .pick-name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .pick-role{font-size:12px; color:var(--muted);}

  .points-hero{background:var(--card); border-radius:14px; padding:18px; text-align:center; border:1px solid var(--line); margin-bottom:16px;}
  .points-hero .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:32px; color:var(--amber-dark);}
  .points-hero .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .file-drop{border:1.5px dashed var(--line); border-radius:10px; padding:14px; text-align:center; margin-bottom:10px; background:#fafbfd;}
  .file-drop input{margin-top:8px;}
  .thumb-preview{max-width:100%; max-height:180px; border-radius:8px; margin-top:10px; display:none;}

  a.backlink{font-size:12px; color:var(--muted); text-decoration:none;}

  /* Badges — military dog-tag / patch style */
  .badge-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:6px;}
  .badge-chip{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    background:var(--olive); color:var(--khaki);
    padding:4px 10px 4px 7px; border-radius:4px;
    border:1px solid var(--olive-dark);
    border-left:3px solid var(--khaki);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .badge-chip.locked{
    background:var(--paper); color:var(--muted); border-color:var(--line);
    border-left-color:var(--line); opacity:0.75; box-shadow:none;
  }
  .badge-chip .em{font-size:13px; filter:grayscale(0.15);}
  .rank-badges{display:flex; gap:4px; margin-top:4px;}
  .rank-badges .em{
    font-size:14px; background:#FFF6E8; border:1px solid var(--amber);
    border-radius:5px; padding:2px 5px; display:inline-flex;
  }
  .rank-title{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--olive);
    background:var(--tan-paper); border:1px solid var(--khaki-dark);
    padding:3px 10px; border-radius:3px; margin-top:6px;
  }

  .week-card{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 100%);
    color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .week-card::after{
    content:""; position:absolute; top:-20px; right:-20px; width:100px; height:100px; border-radius:50%;
    background:radial-gradient(circle, rgba(242,169,59,0.25) 0%, transparent 70%);
  }
  .week-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber); margin-bottom:10px; position:relative; z-index:1;}
  .week-stats{display:flex; gap:18px; position:relative; z-index:1;}
  .week-stat .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;}
  .week-stat .l{font-size:10.5px; color:#B9C2DA; text-transform:uppercase; letter-spacing:0.04em; margin-top:1px;}
  .week-leader{margin-top:12px; font-size:12.5px; color:#DCE2F0; position:relative; z-index:1;}
  .week-leader strong{color:#fff;}

  /* Log tab + lightbox */
  .log-item{background:var(--card); border-radius:12px; border:1px solid var(--line); padding:12px; margin-bottom:10px; display:flex; gap:12px;}
  .logtable{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .logtable th{background:var(--paper); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); text-align:left; padding:9px 10px;}
  .logtable td{padding:9px 10px; border-top:1px solid var(--line); font-size:12.5px; vertical-align:middle;}
  .logtable tr:first-child td{border-top:none;}
  .log-table-thumb{width:38px; height:38px; border-radius:8px; object-fit:cover; cursor:pointer; border:1px solid var(--line); display:block;}
  .log-thumb{width:64px; height:64px; border-radius:8px; object-fit:cover; flex-shrink:0; cursor:pointer; border:1px solid var(--line); background:#eee;}
  .log-body{flex:1; min-width:0;}
  .log-title{font-weight:600; font-size:13.5px;}
  .log-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .log-note{font-size:12.5px; color:var(--text); margin-top:4px;}

  .lightbox{position:fixed; inset:0; background:rgba(10,14,26,0.88); display:none; align-items:center; justify-content:center; z-index:1000; padding:24px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:88vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .lightbox-close{position:absolute; top:18px; right:20px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>
<div id="fb-status" style="position:fixed;bottom:0;left:0;right:0;background:#D64545;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:center;padding:6px;display:none;z-index:999;"></div>
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <img id="lightbox-img" src="">
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDE0R2evS0AHGg306fmhXGiTD1eRffZzHc",
    authDomain: "performance-and-rewards.firebaseapp.com",
    projectId: "performance-and-rewards",
    storageBucket: "performance-and-rewards.firebasestorage.app",
    messagingSenderId: "771580972778",
    appId: "1:771580972778:web:8ed919d1562754a3935193"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

<script>
(function(){

  function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function pad(n){return n<10?'0'+n:''+n;}
  // Daily targets reset at midnight Malaysia time (Asia/Kuala_Lumpur), no
  // matter what timezone the admin's or worker's own device is set to.
  function fmtDateInTZ(date, tz){
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(date);
    const y = parts.find(p=>p.type==='year').value;
    const m = parts.find(p=>p.type==='month').value;
    const d = parts.find(p=>p.type==='day').value;
    return `${y}-${m}-${d}`;
  }
  function todayStr(){ return fmtDateInTZ(new Date(), 'Asia/Kuala_Lumpur'); }
  function todayStrFromDate(d){ return fmtDateInTZ(d, 'Asia/Kuala_Lumpur'); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // NOTE: this is a lightweight access gate, not bank-grade security — there's
  // no real backend server here, so the hash is compared client-side against
  // data stored in Firestore. Good enough to stop casual misuse; not a
  // substitute for real authentication if this ever needs to resist a
  // determined attacker.
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // ---- lightbox: click any .log-thumb / .sub-photo to view full size ----
  function openLightbox(src){
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  }
  (function initLightbox(){
    const lb = document.getElementById('lightbox');
    document.getElementById('lightbox-close').onclick = closeLightbox;
    lb.addEventListener('click', (e)=>{ if(e.target === lb) closeLightbox(); });
  })();

  function parseHash(){
    const h = window.location.hash.replace(/^#/, '');
    const parts = h.split('&');
    const out = {mode: parts[0] || ''};
    parts.slice(1).forEach(p=>{
      const [k,v] = p.split('=');
      out[k] = decodeURIComponent(v||'');
    });
    return out;
  }

  // ---- image compression: File -> compressed base64 JPEG (stored directly in Firestore) ----
  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---- storage (Firestore: one doc per key, holding a JSON array field) ----
  function showFbError(msg){
    const el = document.getElementById('fb-status');
    if(el){ el.style.display = 'block'; el.textContent = msg; }
  }
  async function getList(key){
    try{
      const doc = await db.collection('appdata').doc(key).get();
      return doc.exists ? (doc.data().value || []) : [];
    }catch(e){
      showFbError('Could not load data from Firebase: ' + e.message);
      return [];
    }
  }
  async function setList(key, val){
    try{
      await db.collection('appdata').doc(key).set({ value: val });
      return true;
    }catch(e){
      showFbError('Could not save to Firebase: ' + e.message);
      return false;
    }

  // ---- daily auto-renewal: create today's role-based targets for any worker missing them ----
  async function generateDailyTargets(){
    const [workers, templates, targets, subs, dismissed] = await Promise.all([getWorkers(), getRoleTemplates(), getTargets(), getSubs(), getDismissed()]);
    const dismissedKeys = new Set(dismissed.map(d=> d.workerId + '::' + d.templateId));

    // merge in any default role-templates missing from the saved library
    // (handles cases where the library was already seeded before new defaults were added)
    let library = templates;
    const existingKeys = new Set(library.map(t=> t.role + '::' + t.title));
    let libraryChanged = false;
    DEFAULT_ROLE_TEMPLATES.forEach(def=>{
      const key = def.role + '::' + def.title;
      if(!existingKeys.has(key)){
        library.push({ id: uid(), ...def });
        existingKeys.add(key);
        libraryChanged = true;
      }
    });
    if(libraryChanged) await setList(K_ROLE_TEMPLATES, library);

    const today = todayStr();
    let targetsChanged = false;

    // remove yesterday's (or older) daily targets that were never completed —
    // but keep any that still have a submission awaiting admin review
    const pendingTargetIds = new Set(subs.filter(s=>s.status==='pending').map(s=>s.targetId));
    let workingTargets = targets.filter(t=>{
      const isStaleDaily = t.isDaily && t.status==='active' && t.createdAt !== today;
      if(isStaleDaily && !pendingTargetIds.has(t.id)){
        targetsChanged = true;
        return false; // drop it — day's over, target wasn't completed
      }
      return true;
    });

    // generate today's targets for each worker, for every template matching their role
    workers.forEach(w=>{
      const roleTemplates = library.filter(t=>t.role === w.role);
      roleTemplates.forEach(t=>{
        if(dismissedKeys.has(w.id + '::' + t.id)) return; // admin permanently removed this task for this worker
        const exists = workingTargets.some(tg=> tg.workerId===w.id && tg.templateId===t.id && tg.createdAt===today);
        if(!exists){
          workingTargets.push({
            id: uid(), workerId: w.id, title: t.title, points: t.points, period: 'Daily',
            status: 'active', createdAt: today, templateId: t.id, isDaily: true,
            requiresPhoto: t.requiresPhoto !== false
          });
          targetsChanged = true;
        }
      });
    });

    // Safety net: collapse any duplicate ACTIVE daily targets for the same
    // worker+template down to just the most recent one. This can happen if
    // this function runs twice in quick succession (two tabs open, or a
    // date-boundary edge case) before the first write has landed.
    const seenKeys = new Set();
    const deduped = [];
    workingTargets
      .slice()
      .sort((a,b)=> b.createdAt.localeCompare(a.createdAt))
      .forEach(t=>{
        if(t.isDaily && t.status==='active' && t.templateId){
          const dupKey = t.workerId + '::' + t.templateId;
          if(seenKeys.has(dupKey)){ targetsChanged = true; return; }
          seenKeys.add(dupKey);
        }
        deduped.push(t);
      });
    workingTargets = deduped;

    if(targetsChanged) await setList(K_TARGETS, workingTargets);
  }

  function balanceFor(ledger, workerId){
    return ledger.filter(l=>l.workerId===workerId).reduce((s,l)=> s + (l.type==='earned'? l.points : -l.points), 0);
  }
  function earnedFor(ledger, workerId){
    return ledger.filter(l=>l.workerId===workerId && l.type==='earned').reduce((s,l)=>s+l.points,0);
  }
  function achievedCountFor(targets, workerId){
    return targets.filter(t=>t.workerId===workerId && t.status==='achieved').length;
  }
  function sideQuestsAchievedCountFor(targets, workerId){
    return targets.filter(t=>t.workerId===workerId && t.status==='achieved' && t.sideQuestId).length;
  }
  function daysAgo(n){
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d;
  }
  // Returns a 'YYYY-MM-DD' cutoff string N days before today. String comparison
  // against l.date (also 'YYYY-MM-DD') avoids timezone drift entirely.
  function dateStrDaysAgo(n){
    const d = new Date();
    d.setDate(d.getDate() - n);
    return fmtDateInTZ(d, 'Asia/Kuala_Lumpur');
  }
  const PERIODS = [

  ];
  function periodCutoff(periodKey){
    if(periodKey==='weekly')  return dateStrDaysAgo(6);
    if(periodKey==='monthly') return dateStrDaysAgo(29);
    return null; // lifetime / sidequest (not date-filtered)
  }
  function earnedForPeriod(ledger, workerId, periodKey){
    const cutoff = periodCutoff(periodKey);
    return ledger.filter(l=> l.workerId===workerId && l.type==='earned' && (cutoff===null || l.date >= cutoff))
      .reduce((s,l)=>s+l.points,0);

  const GROUP_LABELS = { targets:'Targets Completed', points:'Lifetime Points', sidequests:'Side Quests Completed', rank:'Leaderboard Rank' };
  // Cross-group priority for picking a SINGLE "highest achievement" badge
  // (used on the leaderboard) — reaching a top rank is the most prestigious,
  // followed by lifetime points, then side quests completed, then raw target count.
  const GROUP_PRIORITY = { targets:1, sidequests:2, points:3, rank:4 };

  async function getBadges(){
    let badges = await getList(K_BADGES);
    // Defensive: ignore any legacy/malformed entries (e.g. saved by an older
    // version of this app before the group/need fields existed) instead of
    // letting them silently break every badge test.
    let valid = badges.filter(b => b && b.group && typeof b.need === 'number');
    let changed = valid.length !== badges.length;

    // Restore any default badge that's gone missing (accidentally removed,
    // or never made it in) — matched by group+label, so an admin's own edits
    // to an existing default badge are never overwritten.
    const existingKeys = new Set(valid.map(b=> b.group + '::' + b.label));
    DEFAULT_BADGES.forEach(def=>{
      const key = def.group + '::' + def.label;
      if(!existingKeys.has(key)){
        valid.push({ id: uid(), ...def });
        existingKeys.add(key);
        changed = true;
      }
    });

    if(changed) await setList(K_BADGES, valid);
    return valid;
  }
  function testBadge(b, ctx){
    if(b.group==='targets') return ctx.targetsAchieved >= b.need;
    if(b.group==='points') return ctx.earned >= b.need;
    if(b.group==='sidequests') return ctx.sideQuestsAchieved >= b.need;
    if(b.group==='rank') return !!ctx.rank && ctx.rank <= b.need;
    return false;
  }
  function badgeMetric(b, ctx){
    if(b.group==='targets') return { current: ctx.targetsAchieved, unit: b.need===1 ? 'target completed' : 'targets completed' };
    if(b.group==='points') return { current: ctx.earned, unit: 'points earned' };
    if(b.group==='sidequests') return { current: ctx.sideQuestsAchieved, unit: b.need===1 ? 'side quest completed' : 'side quests completed' };
    return null;
  }
  // Only the HIGHEST badge earned within each group (targets / points / rank)
  // is returned — e.g. hitting 1000 points gives "Captain" only, not
  // Sergeant + Lieutenant + Captain stacked up.
  // Normalizes "how hard is this badge" across groups so comparisons work the
  // same way everywhere. For targets/points, a bigger need is harder (need to
  // hit 1000 points is harder than 100). For rank, it's the opposite — need:1
  // (must be #1) is harder than need:3 (top 3) — so we flip the sign.
  function badgeDifficulty(b){
    return b.group === 'rank' ? -b.need : b.need;
  }
  function earnedBadges(ctx, badges){
    const earned = badges.filter(b=>testBadge(b,ctx));
    const byGroup = {};
    earned.forEach(b=>{ if(!byGroup[b.group] || badgeDifficulty(b) > badgeDifficulty(byGroup[b.group])) byGroup[b.group] = b; });
    return Object.values(byGroup).sort((a,b)=> GROUP_PRIORITY[a.group]-GROUP_PRIORITY[b.group]);
  }
  // The single best badge across ALL groups — used anywhere only one badge
  // should show (the leaderboard rows).
  function highestBadge(ctx, badges){
    const earned = earnedBadges(ctx, badges);
    if(earned.length===0) return null;
    return earned.reduce((best,b)=> GROUP_PRIORITY[b.group] > GROUP_PRIORITY[best.group] ? b : best, earned[0]);
  }
  function currentRankTitle(ctx, badges){
    return highestBadge(ctx, badges);
  }
  // The single next badge to chase within each group — used to show workers
  // exactly how close they are, to keep them motivated.
  function nextBadgesInfo(ctx, badges){
    const earned = earnedBadges(ctx, badges);
    const earnedByGroup = {};
    earned.forEach(b=> earnedByGroup[b.group] = b);
    const groups = ['targets','points','sidequests','rank'];
    const next = [];
    groups.forEach(g=>{
      const earnedDiff = earnedByGroup[g] ? badgeDifficulty(earnedByGroup[g]) : -Infinity;
      const candidates = badges.filter(b=>b.group===g && badgeDifficulty(b) > earnedDiff).sort((a,b)=> badgeDifficulty(a)-badgeDifficulty(b));
      if(candidates.length) next.push(candidates[0]);
    });
    return next;
  }

  async function renderWorkerDashboard(body, worker){
    const [ledger, targets, subs, catalog, allWorkers, badges, sideQuests] = await Promise.all([getLedger(), getTargets(), getSubs(), getCatalog(), getWorkers(), getBadges(), getSideQuests()]);
    const bal = balanceFor(ledger, worker.id);
    const earned = earnedFor(ledger, worker.id);
    const myActiveTargets = targets.filter(t=>t.workerId===worker.id && t.status!=='achieved').sort((a,b)=> b.points - a.points);
    const myAchievedTargets = targets.filter(t=>t.workerId===worker.id && t.status==='achieved')
      .sort((a,b)=> (b.achievedAt||'').localeCompare(a.achievedAt||''));
    const myAchievedTotal = myAchievedTargets.length;
    const myTargets = myActiveTargets.concat(myAchievedTargets.slice(0, 10));
    const mySubs = subs.filter(s=>s.workerId===worker.id);
    const targetsAchieved = achievedCountFor(targets, worker.id);
    const sideQuestsAchieved = sideQuestsAchievedCountFor(targets, worker.id);
    const myAcceptedQuestIds = new Set(targets.filter(t=>t.workerId===worker.id && t.sideQuestId).map(t=>t.sideQuestId));
    const availableQuests = sideQuests.filter(sq => sq.active !== false && !myAcceptedQuestIds.has(sq.id));

    const rankedAll = allWorkers.map(w=>({ id:w.id, earned: earnedFor(ledger,w.id) })).sort((a,b)=>b.earned-a.earned);
    const myRank = rankedAll.findIndex(w=>w.id===worker.id) + 1;
    const badgeCtx = { earned, targetsAchieved, sideQuestsAchieved, rank: myRank };
    const myBadges = earnedBadges(badgeCtx, badges);
    const nextUp = nextBadgesInfo(badgeCtx, badges);
    const myRankTitle = currentRankTitle(badgeCtx, badges);

    function badgeProgressRow(b){
      let progressText = '';
      let pct = 0;
      const m = badgeMetric(b, badgeCtx);
      if(m){
        progressText = `${Math.min(m.current,b.need)} / ${b.need} ${m.unit}`;
        pct = Math.max(0, Math.min(100, Math.round(m.current/b.need*100)));
      } else if(b.group==='rank'){
        progressText = myRank ? `Currently rank #${myRank} — reach ${b.need===1?'#1':'top '+b.need}` : 'Not yet ranked';
        pct = myRank ? Math.max(0, Math.min(100, Math.round((allWorkers.length - myRank + 1) / allWorkers.length * 100))) : 0;
      }

          // Re-check freshness — someone else may have just claimed it.
          const freshQuests = await getSideQuests();

          const allTargets = await getTargets();
          allTargets.push({
            id: uid(), workerId: worker.id, title: sq.title, points: sq.points,

          if(ok){

      const pendingSub = mySubs.find(s=>s.targetId===t.id && s.status==='pending');

      else if(lastSub && lastSub.status==='rejected') statusBadge = '<span class="badge badge-rejected">Resubmit needed</span>';

          <div class="target-top">
            <div>
              <div class="target-title">${escapeHtml(t.title)}</div>

            </div>
            <div class="target-pts">+${t.points} pts</div>
          </div>

          <div id="submit-form-${t.id}"></div>
        </div>`;
    }).join('') + `</div>`;

    const myTargetMap = {}; myTargets.forEach(t=> myTargetMap[t.id]=t);

      btn.onclick = ()=>{
        const targetId = btn.dataset.submit;
        const t = myTargetMap[targetId];
        const needsPhoto = t.requiresPhoto !== false;
        const formHost = document.getElementById('submit-form-'+targetId);
        if(formHost.innerHTML){ formHost.innerHTML = ''; return; }

        if(needsPhoto){
          formHost.innerHTML = `
            <div class="file-drop">
              <div style="font-size:12.5px;color:var(--muted);">Take or upload a photo as proof</div>
              <input type="file" accept="image/*" capture="environment" id="file-${targetId}">
              <img class="thumb-preview" id="thumb-${targetId}">
            </div>
            <textarea id="note-${targetId}" placeholder="Optional note" rows="2" style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;margin-bottom:8px;"></textarea>
            <button class="btn btn-primary btn-sm" id="send-${targetId}" disabled>Submit for Review</button>
            <div id="submsg-${targetId}" style="margin-top:6px;font-size:12px;"></div>
          `;
          let compressed = null;
          const fileInput = document.getElementById('file-'+targetId);
          const thumb = document.getElementById('thumb-'+targetId);
          const sendBtn = document.getElementById('send-'+targetId);
          fileInput.onchange = async ()=>{
            if(!fileInput.files[0]) return;
            sendBtn.disabled = true;
            try{
              compressed = await compressImage(fileInput.files[0], 900, 0.6);
              thumb.src = compressed;
              thumb.style.display = 'block';
              sendBtn.disabled = false;
            }catch(e){
              document.getElementById('submsg-'+targetId).textContent = 'Could not read that image — try another.';
            }
          };
          sendBtn.onclick = async ()=>{
            if(!compressed) return;
            sendBtn.disabled = true; sendBtn.textContent = 'Submitting…';
            const msg = document.getElementById('submsg-'+targetId);
            const note = document.getElementById('note-'+targetId).value.trim();
            const subs = await getSubs();
            subs.push({
              id: uid(), targetId, workerId: worker.id, photo: compressed, note,
              status: 'pending', submittedAt: new Date().toISOString()
            });
            const ok = await setList(K_SUBS, subs);
            if(ok){
              msg.style.color = 'var(--green)';
              msg.textContent = 'Submitted — awaiting admin review.';
              setTimeout(()=> renderWorkerDashboard(body, worker), 900);
            } else {
              sendBtn.disabled = false; sendBtn.textContent = 'Submit for Review';
              msg.style.color = 'var(--red)';
              msg.textContent = 'Could not submit — check connection and try again.';
            }
          };
        } else {
          formHost.innerHTML = `
            <textarea id="note-${targetId}" placeholder="Optional note" rows="2" style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;margin-bottom:8px;"></textarea>
            <button class="btn btn-primary btn-sm" id="send-${targetId}">Submit for Review</button>
            <div id="submsg-${targetId}" style="margin-top:6px;font-size:12px;"></div>
          `;
          const sendBtn = document.getElementById('send-'+targetId);
          sendBtn.onclick = async ()=>{
            sendBtn.disabled = true; sendBtn.textContent = 'Submitting…';
            const msg = document.getElementById('submsg-'+targetId);
            const note = document.getElementById('note-'+targetId).value.trim();
            const subs = await getSubs();
            subs.push({
              id: uid(), targetId, workerId: worker.id, photo: null, note,
              status: 'pending', submittedAt: new Date().toISOString()
            });
            const ok = await setList(K_SUBS, subs);
            if(ok){
              msg.style.color = 'var(--green)';
              msg.textContent = 'Submitted — awaiting admin review.';
              setTimeout(()=> renderWorkerDashboard(body, worker), 900);
            } else {
              sendBtn.disabled = false; sendBtn.textContent = 'Submit for Review';
              msg.style.color = 'var(--red)';
              msg.textContent = 'Could not submit — check connection and try again.';
            }
          };
        }
      };
    });

    document.getElementById('wp-view-lb').onclick = ()=> renderWorkerLeaderboard(body, worker);
    document.getElementById('wp-view-all-badges').onclick = ()=> renderAllBadges(body, worker);
  }

  async function renderAllBadges(body, worker){
    const [ledger, targets, allWorkers, badges] = await Promise.all([getLedger(), getTargets(), getWorkers(), getBadges()]);
    const earned = earnedFor(ledger, worker.id);
    const targetsAchieved = achievedCountFor(targets, worker.id);
    const sideQuestsAchieved = sideQuestsAchievedCountFor(targets, worker.id);
    const rankedAll = allWorkers.map(w=>({ id:w.id, earned: earnedFor(ledger,w.id) })).sort((a,b)=>b.earned-a.earned);
    const myRank = rankedAll.findIndex(w=>w.id===worker.id) + 1;
    const badgeCtx = { earned, targetsAchieved, sideQuestsAchieved, rank: myRank };
    const myEarned = earnedBadges(badgeCtx, badges);
    const myEarnedIds = new Set(myEarned.map(b=>b.id));

    const byGroup = {};
    badges.forEach(b=>{ (byGroup[b.group]=byGroup[b.group]||[]).push(b); });

    body.innerHTML = `
      <a class="backlink" href="#" id="ab-back">&lsaquo; Back to my dashboard</a>
      <div class="eyebrow" style="margin-top:14px;margin-bottom:10px;">All Badges</div>
      <div id="ab-list"></div>
    `;
    document.getElementById('ab-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };

    document.getElementById('ab-list').innerHTML = Object.keys(byGroup).sort((a,b)=>GROUP_PRIORITY[a]-GROUP_PRIORITY[b]).map(group=>`
      <div class="card" style="margin-bottom:14px;">
        <h3 style="margin-bottom:10px;">${escapeHtml(GROUP_LABELS[group]||group)}</h3>
        ${byGroup[group].sort((a,b)=>a.need-b.need).map(b=>{
          const isEarned = myEarnedIds.has(b.id);
          return `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);${isEarned?'':'opacity:0.55;'}">
              <span style="font-size:24px;">${isEarned ? b.emoji : '🔒'}</span>
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;font-size:13.5px;">${escapeHtml(b.label)}</div>
                <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${escapeHtml(b.desc)}</div>
              </div>
              ${isEarned ? `<span class="badge badge-achieved">Earned</span>` : ''}
            </div>`;
        }).join('')}
      </div>`).join('');
  }

  async function renderWorkerLeaderboard(body, worker, period){
    period = period || 'lifetime';
    const [workers, ledger, targets, badges] = await Promise.all([getWorkers(), getLedger(), getTargets(), getBadges()]);

    const lifetimeRanked = workers.map(w=>({ id:w.id, earned: earnedFor(ledger,w.id) })).sort((a,b)=>b.earned-a.earned);
    const lifetimeRankMap = {}; lifetimeRanked.forEach((w,i)=> lifetimeRankMap[w.id]=i+1);

    const ranked = workers.map(w=>({
      ...w,
      earnedPeriod: earnedForPeriod(ledger, w.id, period),
      earnedLifetime: earnedFor(ledger, w.id),
      targetsAchieved: achievedCountFor(targets, w.id),
      sideQuestsAchieved: sideQuestsAchievedCountFor(targets, w.id),
      lifetimeRank: lifetimeRankMap[w.id]
    })).sort((a,b)=> period==='sidequest' ? (b.sideQuestsAchieved - a.sideQuestsAchieved) : (b.earnedPeriod - a.earnedPeriod));
    ranked.forEach((w,i)=> w.periodRank = i+1);
    const top20 = ranked.slice(0, 20);
    const periodLabel = { lifetime:'All Time', monthly:'This Month', weekly:'This Week', sidequest:'Side Quests' }[period];

    body.innerHTML = `
      <a class="backlink" href="#" id="wp-back">&lsaquo; Back to my dashboard</a>
      <div class="eyebrow" style="margin-top:14px;margin-bottom:10px;">Team Leaderboard</div>
      <div class="toggle-group" id="wp-lb-period-toggle">
        ${PERIODS.map(p=>`<div class="toggle-opt${p.key===period?' selected':''}" data-period="${p.key}" style="${p.key===period?'border-color:var(--amber);color:var(--amber-dark);background:#FFF6E8;':''}">${p.label}</div>`).join('')}
      </div>
      <div class="help" style="margin-top:0;">Top ${top20.length} &middot; ranked by ${period==='sidequest' ? 'side quests completed' : periodLabel.toLowerCase()+' points'}</div>
      <div id="wp-lb-list"></div>
    `;
    document.getElementById('wp-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };
    document.querySelectorAll('#wp-lb-period-toggle [data-period]').forEach(opt=>{
      opt.onclick = ()=> renderWorkerLeaderboard(body, worker, opt.dataset.period);
    });

    document.getElementById('wp-lb-list').innerHTML = top20.map(w=>{
      const medalClass = w.periodRank===1?'medal-1':w.periodRank===2?'medal-2':w.periodRank===3?'medal-3':'medal-n';
      const medalContent = w.periodRank<=3 ? '&#9733;' : w.periodRank;
      const topBadge = highestBadge({ earned: w.earnedLifetime, targetsAchieved: w.targetsAchieved, sideQuestsAchieved: w.sideQuestsAchieved, rank: w.lifetimeRank }, badges);
      const isMe = w.id === worker.id;
      return `
        <div class="rank-row" style="${isMe ? 'border-color:var(--amber);background:#FFFAF0;' : ''}">
          <div class="rank-medal ${medalClass}">${medalContent}</div>
          <div class="rank-info">
            <div class="rank-name">${escapeHtml(w.name)}${isMe ? ' <span style="color:var(--amber-dark);font-size:11px;">(you)</span>' : ''}</div>
            <div class="rank-role">${escapeHtml(w.role||'')}</div>
            ${topBadge ? `<div class="rank-badges"><span class="em" title="${escapeHtml(topBadge.label)}">${topBadge.emoji}</span></div>` : ''}
          </div>
          ${period==='sidequest'
            ? `<div class="rank-points"><div class="n">${w.sideQuestsAchieved}</div><div class="l">completed</div></div>`
            : `<div class="rank-points"><div class="n">${w.earnedPeriod}</div><div class="l">pts</div></div>`}
        </div>`;
    }).join('');
  }

  // ---- Leaderboard ----
  async function renderLeaderboard(period){
    period = period || 'lifetime';
    const el = document.getElementById('view-leaderboard');
    el.innerHTML = `<div class="empty">Loading…</div>`;
    const [workers, ledger, targets, badges] = await Promise.all([getWorkers(), getLedger(), getTargets(), getBadges()]);
    if(workers.length===0){
      el.innerHTML = `<div class="card"><div class="empty">No workers added yet.<br>Go to the Workers tab to add your team.</div></div>`;
      return;
    }
    const activeTargets = targets.filter(t=>t.status==='active').length;
    const achievedCount = targets.filter(t=>t.status==='achieved').length;

    // Lifetime rank always drives badges (top3/top1), independent of whichever
    // period is currently selected for the list below.
    const lifetimeRanked = workers.map(w=>({ id:w.id, earned: earnedFor(ledger,w.id) })).sort((a,b)=>b.earned-a.earned);
    const lifetimeRankMap = {}; lifetimeRanked.forEach((w,i)=> lifetimeRankMap[w.id]=i+1);

    const periodRanked = workers.map(w=>({
      ...w,
      earnedPeriod: earnedForPeriod(ledger, w.id, period),
      earnedLifetime: earnedFor(ledger, w.id),
      balance: balanceFor(ledger, w.id),
      targetsAchieved: achievedCountFor(targets, w.id),
      sideQuestsAchieved: sideQuestsAchievedCountFor(targets, w.id),
      lifetimeRank: lifetimeRankMap[w.id]
    })).sort((a,b)=> period==='sidequest' ? (b.sideQuestsAchieved - a.sideQuestsAchieved) : (b.earnedPeriod - a.earnedPeriod));
    periodRanked.forEach((w,i)=> w.periodRank = i+1);
    const top20 = periodRanked.slice(0, 20);

    const cutoff = periodCutoff(period);
    const periodTargets = targets.filter(t=> t.status==='achieved' && t.achievedAt && (cutoff===null || t.achievedAt >= cutoff)).length;
    const periodTotalPts = periodRanked.reduce((s,w)=>s+w.earnedPeriod,0);
    const totalSideQuests = targets.filter(t=>t.status==='achieved' && t.sideQuestId).length;
    const periodLeader = period==='sidequest'
      ? (periodRanked[0] && periodRanked[0].sideQuestsAchieved>0 ? periodRanked[0] : null)
      : (periodRanked[0] && periodRanked[0].earnedPeriod>0 ? periodRanked[0] : null);
    const periodLabel = { lifetime:'All Time', monthly:'This Month', weekly:'This Week', sidequest:'Side Quests' }[period];

    el.innerHTML = `
      <div class="week-card">
        <div class="week-eyebrow">${periodLabel}</div>
        <div class="week-stats">
          ${period==='sidequest' ? `
            <div class="week-stat"><div class="n">${totalSideQuests}</div><div class="l">Side quests completed</div></div>
            <div class="week-stat"><div class="n">${workers.length}</div><div class="l">Team members</div></div>
          ` : `
            <div class="week-stat"><div class="n">${periodTotalPts}</div><div class="l">Points earned</div></div>
            <div class="week-stat"><div class="n">${periodTargets}</div><div class="l">Targets hit</div></div>
          `}
        </div>
        ${periodLeader ? `<div class="week-leader">${periodLabel} leader: <strong>${escapeHtml(periodLeader.name)}</strong> &middot; ${period==='sidequest' ? periodLeader.sideQuestsAchieved+' completed' : periodLeader.earnedPeriod+' pts'}</div>` : `<div class="week-leader">${period==='sidequest' ? 'No side quests completed yet.' : 'No points earned yet in this period.'}</div>`}
      </div>
      <div class="stat-strip">
        <div class="stat"><div class="n">${workers.length}</div><div class="l">Team members</div></div>
        <div class="stat"><div class="n">${activeTargets}</div><div class="l">Active targets</div></div>
        <div class="stat"><div class="n">${achievedCount}</div><div class="l">Achieved</div></div>
      </div>
      <div class="toggle-group" id="lb-period-toggle">
        ${PERIODS.map(p=>`<div class="toggle-opt${p.key===period?' selected':''}" data-period="${p.key}" style="${p.key===period?'border-color:var(--amber);color:var(--amber-dark);background:#FFF6E8;':''}">${p.label}</div>`).join('')}
      </div>
      <div class="eyebrow" style="margin-bottom:10px;">Top ${top20.length} &middot; ranked by ${period==='sidequest' ? 'side quests completed' : periodLabel.toLowerCase()+' points'}</div>
      <div id="lb-list"></div>
      <div class="card" style="margin-top:16px;">
        <div class="eyebrow" style="margin-bottom:6px;">Worker access</div>
        <div class="help">Share this link so workers can view their targets and submit proof photos: <span class="mono">${window.location.href.split('#')[0]}#worker</span></div>
      </div>
    `;
    document.querySelectorAll('#lb-period-toggle [data-period]').forEach(opt=>{
      opt.onclick = ()=> renderLeaderboard(opt.dataset.period);
    });
    document.getElementById('lb-list').innerHTML = top20.map((w)=>{
      const medalClass = w.periodRank===1?'medal-1':w.periodRank===2?'medal-2':w.periodRank===3?'medal-3':'medal-n';
      const medalContent = w.periodRank<=3 ? '&#9733;' : w.periodRank;
      const topBadge = highestBadge({ earned: w.earnedLifetime, targetsAchieved: w.targetsAchieved, sideQuestsAchieved: w.sideQuestsAchieved, rank: w.lifetimeRank }, badges);
      return `
        <div class="rank-row">
          <div class="rank-medal ${medalClass}">${medalContent}</div>
          <div class="rank-info">
            <div class="rank-name">${escapeHtml(w.name)}</div>
            <div class="rank-role">${escapeHtml(w.role||'')}</div>
            ${topBadge ? `<div class="rank-badges"><span class="em" title="${escapeHtml(topBadge.label)}">${topBadge.emoji}</span></div>` : ''}
          </div>
          ${period==='sidequest'
            ? `<div class="rank-points"><div class="n">${w.sideQuestsAchieved}</div><div class="l">completed</div></div>`
            : `<div class="rank-points"><div class="n">${w.earnedPeriod}</div><div class="l">pts &middot; ${w.balance} bal.</div></div>`}
        </div>`;
    }).join('');
  }

          const newRequiresPhoto = document.getElementById('rt-edit-photo-'+templateId).checked;
          if(!newTitle || !newPoints || newPoints<=0) return;
          this.disabled = true; this.textContent = 'Saving…';
          const all = await getRoleTemplates();
          const idx = all.findIndex(x=>x.id===templateId);
          if(idx>-1){ all[idx].title = newTitle; all[idx].points = newPoints; all[idx].requiresPhoto = newRequiresPhoto; await setList(K_ROLE_TEMPLATES, all); }

  async function drawTargetList(filterId, workers){
    const listEl = document.getElementById('t-list');
    const [targets, subs] = await Promise.all([getTargets(), getSubs()]);
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    const filtered = filterId==='all' ? targets : targets.filter(t=>t.workerId===filterId);
    const sorted = filtered.slice().sort((a,b)=>{ if(a.status!==b.status) return a.status==='active'?-1:1; return b.createdAt.localeCompare(a.createdAt); });
    if(sorted.length===0){ listEl.innerHTML = `<div class="card"><div class="empty">No targets yet.</div></div>`; return; }
    listEl.innerHTML = `<div class="card">` + sorted.map(t=>{
      const w = workerMap[t.workerId];
      const pending = subs.find(s=>s.targetId===t.id && s.status==='pending');
      let badge = '';
      if(t.status==='achieved') badge = '<span class="badge badge-achieved">Achieved</span>';
      else if(pending) badge = '<span class="badge badge-pending">Awaiting review</span>';
      return `
        <div class="target-item">
          <div class="target-top">
            <div><div class="target-title">${escapeHtml(t.title)}</div>
            <div class="target-meta">${w?escapeHtml(w.name):'—'} &middot; ${t.period} ${badge?'&middot; '+badge:''}</div></div>
            <div class="target-pts">+${t.points} pts</div>
          </div>
          ${t.status==='active' && !pending ? `<div class="target-actions">
            <button class="btn btn-amber btn-sm" data-achieve="${t.id}">Mark Achieved</button>
            <button class="btn btn-ghost btn-sm" data-remove="${t.id}">Remove</button></div>` : ''}
        </div>`;
    }).join('') + `</div>`;
    listEl.querySelectorAll('[data-achieve]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.disabled = true; btn.textContent='Saving…';
        await approveTarget(btn.dataset.achieve, null);
        drawTargetList(document.getElementById('t-filter').value, workers);
      };
    });
    listEl.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const targets = await getTargets();
        const target = targets.find(x=>x.id===btn.dataset.remove);
        // Daily targets are auto-regenerated from the worker's role template every
        // page load, so just deleting the target record isn't enough — it would
        // reappear on refresh. Also record it as permanently dismissed for this
        // worker+template combo so it stops being auto-assigned going forward.
        // Other workers / other templates keep auto-generating as usual.
        if(target && target.isDaily && target.templateId){
          const dismissed = await getDismissed();
          dismissed.push({ workerId: target.workerId, templateId: target.templateId, removedAt: todayStr() });
          await setList(K_DISMISSED, dismissed);
        }
        await setList(K_TARGETS, targets.filter(x=>x.id!==btn.dataset.remove));
        drawTargetList(document.getElementById('t-filter').value, workers);
      };
    });
  }

  async function approveTarget(targetId, submissionId){
    const targets = await getTargets();
    const idx = targets.findIndex(x=>x.id===targetId);
    if(idx===-1) return;
    const t = targets[idx];
    t.status = 'achieved'; t.achievedAt = todayStr();
    await setList(K_TARGETS, targets);
    const ledger = await getLedger();
    ledger.push({id: uid(), workerId: t.workerId, type:'earned', points: t.points, note: t.title, date: todayStr()});
    await setList(K_LEDGER, ledger);
    if(submissionId){
      const subs = await getSubs();
      const sidx = subs.findIndex(s=>s.id===submissionId);
      if(sidx>-1){ subs[sidx].status='approved'; subs[sidx].reviewedAt = new Date().toISOString(); await setList(K_SUBS, subs); }
    }
  }

    const el = document.getElementById('view-review');

    const targetMap = {}; targets.forEach(t=>targetMap[t.id]=t);

    el.innerHTML = `<div class="eyebrow" style="margin-bottom:10px;">${pending.length} awaiting review</div><div id="rv-list"></div>`;

      return `

    listEl.querySelectorAll('[data-lightbox]').forEach(img=>{
      img.onclick = ()=> openLightbox(img.dataset.lightbox);
    });

            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary btn-sm" data-bd-save="${badgeId}">Save Changes</button>
              <button class="btn btn-ghost btn-sm" data-bd-cancel="${badgeId}">Cancel</button>
            </div>
          </div>`;
        host.querySelector('[data-bd-save]').onclick = async function(){
          const emoji = document.getElementById('bd-edit-emoji-'+badgeId).value.trim() || '🏅';
          const label = document.getElementById('bd-edit-label-'+badgeId).value.trim();
          const desc = document.getElementById('bd-edit-desc-'+badgeId).value.trim();
          const need = parseInt(document.getElementById('bd-edit-need-'+badgeId).value, 10);
          if(!label || !desc || !need || need<=0) return;
          this.disabled = true; this.textContent = 'Saving…';
          const all = await getBadges();
          const idx = all.findIndex(x=>x.id===badgeId);
          if(idx>-1){ all[idx].emoji=emoji; all[idx].label=label; all[idx].desc=desc; all[idx].need=need; await setList(K_BADGES, all); }
          drawBadgesList();
        };
        host.querySelector('[data-bd-cancel]').onclick = ()=>{ host.innerHTML = ''; };
      };
    });
  }

  // ---- Rewards ----
  async function renderRewards(){
    const el = document.getElementById('view-rewards');
    const workers = await getWorkers();
    if(workers.length===0){ el.innerHTML = `<div class="card"><div class="empty">Add workers first to manage their points and redemptions.</div></div>`; return; }
    const catalog = await getCatalog();
    el.innerHTML = `
      <div class="card">
        <h3>Reward catalog</h3>
        <div class="help">Set up rewards in advance — workers will see this list on their portal so they know what to aim for.</div>
        <div class="row2">
          <div class="field"><label>Reward name</label><input type="text" id="c-name" placeholder="e.g. RM50 Touch 'n Go credit"></div>
          <div class="field"><label>Points cost</label><input type="number" id="c-cost" placeholder="e.g. 100" min="1"></div>
        </div>
        <button class="btn btn-amber btn-block" id="c-add">Add to Catalog</button>
        <div id="c-msg" style="margin-top:8px;font-size:12.5px;"></div>
        <div id="c-list" style="margin-top:12px;"></div>
      </div>
      <div class="card">
        <h3>Redeem points</h3>
        <div class="help">Record when a worker exchanges points for a real prize or bonus. This deducts from their balance.</div>
        <div class="field"><label>Worker</label><select id="r-worker">${workers.map(w=>`<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('')}</select></div>
        ${catalog.length>0 ? `<div class="field"><label>Quick-pick from catalog</label><select id="r-quickpick"><option value="">— choose a reward —</option>${catalog.map(c=>`<option value="${c.id}" data-name="${escapeHtml(c.name)}" data-cost="${c.pointsCost}">${escapeHtml(c.name)} (${c.pointsCost} pts)</option>`).join('')}</select></div>` : ''}
        <div class="row2">
          <div class="field"><label>Prize / bonus</label><input type="text" id="r-prize" placeholder="e.g. RM50 voucher"></div>
          <div class="field"><label>Points cost</label><input type="number" id="r-cost" placeholder="e.g. 100" min="1"></div>
        </div>
        <button class="btn btn-primary btn-block" id="r-redeem">Record Redemption</button>
        <div id="r-msg" style="margin-top:8px;font-size:12.5px;"></div>
      </div>
      <div class="toprow"><h2>Points ledger</h2></div>
      <select class="select-worker" id="r-filter"><option value="all">All workers</option>${workers.map(w=>`<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('')}</select>
      <div id="r-list"></div>
    `;

    document.getElementById('c-add').onclick = async function(){
      const name = document.getElementById('c-name').value.trim();
      const cost = parseInt(document.getElementById('c-cost').value, 10);
      const msg = document.getElementById('c-msg');
      if(!name || !cost || cost<=0){ msg.style.color='var(--red)'; msg.textContent='Please fill in a reward name and valid points cost.'; return; }
      this.disabled = true; this.textContent = 'Adding…';
      const cat = await getCatalog();
      cat.push({id: uid(), name, pointsCost: cost, createdAt: todayStr()});
      const ok = await setList(K_CATALOG, cat);
      this.disabled = false; this.textContent = 'Add to Catalog';
      if(ok){
        document.getElementById('c-name').value=''; document.getElementById('c-cost').value='';
        msg.style.color='var(--green)'; msg.textContent='Added to catalog.';
        renderRewards();
      } else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };
    drawCatalogList(catalog);

    const quickpick = document.getElementById('r-quickpick');
    if(quickpick){
      quickpick.onchange = ()=>{
        const opt = quickpick.selectedOptions[0];
        if(opt && opt.value){
          document.getElementById('r-prize').value = opt.dataset.name;
          document.getElementById('r-cost').value = opt.dataset.cost;
        }
      };
    }

    document.getElementById('r-redeem').onclick = async function(){
      const workerId = document.getElementById('r-worker').value;
      const prize = document.getElementById('r-prize').value.trim();
      const cost = parseInt(document.getElementById('r-cost').value, 10);
      const msg = document.getElementById('r-msg');
      if(!prize || !cost || cost<=0){ msg.style.color='var(--red)'; msg.textContent='Please fill in a prize name and valid points cost.'; return; }
      const ledger = await getLedger();
      const bal = balanceFor(ledger, workerId);
      if(cost > bal){ msg.style.color='var(--red)'; msg.textContent=`Not enough balance (has ${bal} pts).`; return; }
      this.disabled = true; this.textContent = 'Saving…';
      ledger.push({id: uid(), workerId, type:'redeemed', points: cost, note: prize, date: todayStr()});
      const ok = await setList(K_LEDGER, ledger);
      this.disabled = false; this.textContent = 'Record Redemption';
      if(ok){
        document.getElementById('r-prize').value=''; document.getElementById('r-cost').value='';
        msg.style.color='var(--green)'; msg.textContent='Redemption recorded.';
        drawLedgerList(document.getElementById('r-filter').value, workers);
      } else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };
    document.getElementById('r-filter').onchange = (e)=> drawLedgerList(e.target.value, workers);
    await drawLedgerList('all', workers);
  }
  function drawCatalogList(catalog){
    const el = document.getElementById('c-list');
    if(!el) return;
    if(catalog.length===0){ el.innerHTML = `<div class="help" style="margin-bottom:0;">No rewards added yet.</div>`; return; }
    el.innerHTML = catalog.map(c=>`
      <div class="ledger-row">
        <div class="ledger-note">${escapeHtml(c.name)}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="target-pts">${c.pointsCost} pts</span>
          <button class="btn btn-ghost btn-sm" data-cat-remove="${c.id}" style="padding:4px 9px;">Remove</button>
        </div>
      </div>`).join('');
    el.querySelectorAll('[data-cat-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const cat = await getCatalog();
        await setList(K_CATALOG, cat.filter(x=>x.id!==btn.dataset.catRemove));
        renderRewards();
      };
    });
  }

  async function drawLedgerList(filterId, workers){
    const listEl = document.getElementById('r-list');
    const ledger = await getLedger();
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    const filtered = filterId==='all' ? ledger : ledger.filter(l=>l.workerId===filterId);
    const sorted = filtered.slice().sort((a,b)=> b.date.localeCompare(a.date));
    if(sorted.length===0){ listEl.innerHTML = `<div class="card"><div class="empty">No ledger entries yet.</div></div>`; return; }
    listEl.innerHTML = `<div class="card">` + sorted.map(l=>{
      const w = workerMap[l.workerId];
      return `<div class="ledger-row"><div><div class="ledger-note">${escapeHtml(l.note)} ${filterId==='all'&&w?'&middot; <strong>'+escapeHtml(w.name)+'</strong>':''}</div>
        <div class="ledger-date">${l.date}</div></div>
        <div class="ledger-pts ${l.type==='earned'?'pts-earn':'pts-redeem'}">${l.type==='earned'?'+':'-'}${l.points}</div></div>`;
    }).join('') + `</div>`;
  }

})();
</script>
</body>
</html>
