    }

    const avatar = avatarInfoFor(earned);

    // Their own score for the last 30 days. Uses submissions already loaded
    // plus a scoped read for the period.
    let myScore = null;
    try{
      const cutoffDate = dateStrDaysAgoMY(30);
      const periodSubs = await getSubsSince(cutoffDate + 'T00:00:00.000Z');
      myScore = scoreWorker(worker.id, { targets, fails: allFails, subs: periodSubs, cutoffDate });
    }catch(e){ console.error('Could not calculate score:', e); }

    // Heads get an extra entry point to review their own team's submissions.
    const myTeam = worker.isHead ? allWorkers.filter(w=>w.reportsTo===worker.id) : [];
    let myTeamPendingCount = 0;
    if(myTeam.length > 0){
      const teamIds = new Set(myTeam.map(w=>w.id));
      const allPending = await getPendingSubs();
      myTeamPendingCount = allPending.filter(s=>teamIds.has(s.workerId)).length;
    }

    body.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <a class="backlink" href="#worker">&lsaquo; Switch worker</a>
        <button class="btn btn-ghost btn-sm" id="wp-view-lb">🏆 Leaderboard</button>
      </div>
      <div style="margin-top:10px;">
        <div class="worker-name" style="font-size:19px;">${escapeHtml(worker.name)}</div>
        <div class="worker-role">${escapeHtml(worker.role||'')}</div>
        ${myRankTitle ? `<div class="rank-title">${myRankTitle.emoji} Rank: ${escapeHtml(myRankTitle.label)}</div>` : ''}
        <div class="help" style="margin-top:6px;margin-bottom:0;">Currently ranked #${myRank} of ${allWorkers.length}</div>
      </div>
      ${myTeam.length > 0 ? `
      <div class="card" style="margin-top:14px;margin-bottom:0;border:1.5px solid var(--amber);background:#FFFAF0;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;">👤 My team (${myTeam.length})</div>
            <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${myTeamPendingCount>0 ? `${myTeamPendingCount} submission${myTeamPendingCount===1?'':'s'} waiting for your review` : 'Nothing waiting for review'}</div>
          </div>
          <button class="btn btn-amber btn-sm" id="wp-view-team" style="white-space:nowrap;">Review${myTeamPendingCount>0 ? ` (${myTeamPendingCount})` : ''}</button>
        </div>
      </div>` : ''}
      <div class="card" style="margin-top:14px;margin-bottom:16px;text-align:center;padding:20px;">
        <div style="font-size:52px;line-height:1;">${avatar.emoji}</div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--ink);margin-top:8px;">Level ${avatar.level} &middot; ${escapeHtml(avatar.title)}</div>
        <div style="height:8px;background:var(--paper);border-radius:5px;margin-top:10px;overflow:hidden;">
          <div style="height:100%;width:${avatar.pct}%;background:var(--amber);"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">${avatar.pointsIntoLevel} / ${avatar.pointsForNextLevel} pts to Level ${avatar.level+1}</div>
      </div>
      <div class="points-hero">
        <div class="n">${bal}</div>
        <div class="l">Points balance &middot; ${earned} earned lifetime</div>
      </div>
      ${myScore ? (()=>{
        const b = scoreBand(myScore.score);
        const bar = (label, val) => val === null ? '' : `
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
            <span style="font-size:10.5px;color:var(--muted);width:78px;">${label}</span>
            <div style="flex:1;height:6px;background:var(--paper);border-radius:3px;overflow:hidden;">
              <div style="height:100%;width:${Math.round(val)}%;background:${val>=70?'var(--green)':val>=50?'var(--amber)':'var(--red)'};"></div>
            </div>
            <span style="font-size:10.5px;color:var(--muted);width:26px;text-align:right;">${Math.round(val)}</span>
          </div>`;
        return `
        <div class="eyebrow">My score &middot; last 30 days</div>
        <div class="card" style="margin-bottom:16px;">
          <div style="text-align:center;">
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;color:${b.color};line-height:1;">${myScore.score}</div>
            <div style="font-size:11.5px;color:${b.color};font-weight:600;margin-top:2px;">${b.label}</div>
          </div>
          <div style="margin-top:10px;">
            ${bar('Reliability', myScore.parts.reliability)}
            ${bar('No misses', myScore.parts.failures)}
            ${bar('Quality', myScore.parts.quality)}
            ${bar('In good time', myScore.parts.promptness)}
            ${bar('Challenger', myScore.parts.challenger)}
          </div>
          <div class="help" style="margin-top:10px;margin-bottom:0;">Based on how much of your own work you complete, not how much you're given — so it's fair whoever you're compared with.</div>
        </div>`;
      })() : ''}
      ${bossBattle && bossBattle.active ? (()=>{
        const totalDamage = bossTotalDamage(ledger, bossBattle.startedAt);
        const currentHp = Math.max(0, bossBattle.maxHp - totalDamage);
        const pct = Math.max(0, Math.min(100, Math.round((bossBattle.maxHp-currentHp)/bossBattle.maxHp*100)));
        const defeated = currentHp <= 0;
        return `
        <div class="eyebrow">Team boss battle</div>
        <div class="card" style="margin-bottom:16px;text-align:center;padding:18px;">
          <div style="font-size:32px;">${defeated ? '💀' : (bossBattle.emoji || '🐉')}</div>
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;margin-top:4px;">${escapeHtml(bossBattle.name)}</div>
          <div style="height:12px;background:var(--paper);border-radius:6px;margin-top:10px;overflow:hidden;border:1px solid var(--line);">
            <div style="height:100%;width:${pct}%;background:${defeated?'var(--muted)':'var(--red)'};"></div>
          </div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">${currentHp} / ${bossBattle.maxHp} HP &middot; every approved task deals damage</div>
          ${defeated ? `<div style="margin-top:8px;color:var(--green);font-weight:700;font-size:12.5px;">🎉 Defeated! Waiting on admin to hand out victory bonuses.</div>` : ''}
        </div>`;
      })() : ''}
      <div class="eyebrow">My badges</div>
      <div class="card" style="margin-bottom:16px;">
        ${myBadges.length ? `<div class="badge-row">${myBadges.map(b=>`<span class="badge-chip" title="${b.desc}"><span class="em">${b.emoji}</span> ${escapeHtml(b.label)}</span>`).join('')}</div>` : `<div class="help" style="margin-bottom:0;">Complete your first target to start earning badges.</div>`}
        ${nextUp.length ? `
          <div class="eyebrow" style="margin-top:14px;margin-bottom:0;">Next up</div>
          ${nextUp.map(badgeProgressRow).join('')}
        ` : ''}
        <button class="btn btn-ghost btn-sm" id="wp-view-all-badges" style="margin-top:12px;">View all badges &amp; requirements</button>
      </div>
      ${catalog.length>0 ? `
      <div class="eyebrow">Rewards you can aim for</div>
      <div class="card" style="margin-bottom:16px;">
        ${catalog.slice().sort((a,b)=>a.pointsCost-b.pointsCost).map(c=>{
          const affordable = bal >= c.pointsCost;
          return `<div class="ledger-row">
            <div class="ledger-note" style="${affordable?'':'color:var(--muted);'}">${escapeHtml(c.name)}</div>
            <div class="ledger-pts" style="${affordable?'color:var(--green);':'color:var(--muted);'}">${c.pointsCost} pts ${affordable?'&#10003;':''}</div>
          </div>`;
        }).join('')}
      </div>` : ''}
      ${standbyQuests.length>0 ? `
      <div class="eyebrow">Opening soon — stand by</div>
      <div class="card" style="margin-bottom:16px;">
        <div id="wp-standby-quests"></div>
      </div>` : ''}
      ${openQuests.length>0 ? `
      <div class="eyebrow">Challenger tasks for your role</div>
      <div class="card" style="margin-bottom:16px;">
        <div id="wp-sidequests"></div>
      </div>` : ''}
      <div class="eyebrow">My targets</div>
      <div id="wp-targets"></div>
      ${myFailCount>0 ? `
      <div class="card" style="margin-top:18px;">
        <div id="wp-fails-toggle" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
          <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;">Missed tasks (${myFailCount})</span>
          <span id="wp-fails-caret" style="font-size:12px;color:var(--muted);">Show &rsaquo;</span>
        </div>
        <div id="wp-fails-body" style="display:none;">
          <div class="help" style="margin-top:10px;">Tasks that closed before you completed them. These don't cost you points — they're here so you can see what was missed.</div>
          <div id="wp-fails"></div>
        </div>
      </div>` : ''}
    `;

    if(standbyQuests.length>0){
      const standbyEl = document.getElementById('wp-standby-quests');
      standbyEl.innerHTML = standbyQuests.map(sq=>{
        const needsPhoto = sq.requiresPhoto !== false;
        const capLabel = (sq.capacity||1) > 1 ? ` &middot; open to ${sq.capacity} workers` : '';
        return `
        <div style="padding:10px 0;border-top:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <div style="font-weight:600;font-size:13.5px;">${escapeHtml(sq.title)}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;">${needsPhoto?'📷 Photo required':'✏️ Note only'}${capLabel}</div>
            </div>
            <div class="target-pts">+${sq.points} pts</div>
          </div>
          <div style="margin-top:8px;font-size:13px;font-weight:700;color:var(--amber-dark);font-family:'IBM Plex Mono',monospace;" id="countdown-${sq.id}">--:--</div>
        </div>`;
      }).join('');
      // Live countdown, ticking every second. When one hits zero, refresh the
      // whole dashboard so it moves into the "available now" section.
      standbyQuests.forEach(sq=>{
        const opensAtMs = new Date(sq.opensAt).getTime();
        const tick = ()=>{
          const el = document.getElementById('countdown-'+sq.id);
          if(!el){ clearInterval(timerId); return; } // navigated away
          const remaining = opensAtMs - Date.now();
          if(remaining <= 0){
            clearInterval(timerId);
            renderWorkerDashboard(body, worker);
            return;
          }
          const totalSeconds = Math.floor(remaining/1000);
          const h = Math.floor(totalSeconds/3600);
          const m = Math.floor((totalSeconds%3600)/60);
          const s = totalSeconds%60;
          el.textContent = 'Opens in ' + (h>0 ? `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s` : `${m}m ${String(s).padStart(2,'0')}s`);
        };
        tick();
        const timerId = setInterval(tick, 1000);
      });
    }

    if(openQuests.length>0){
      const sqEl = document.getElementById('wp-sidequests');
      sqEl.innerHTML = openQuests.map(sq=>{
        const needsPhoto = sq.requiresPhoto !== false;
        const spotsLeft = (sq.capacity||1) - (acceptedCountByQuest[sq.id]||0);
        const capLabel = (sq.capacity||1) > 1 ? ` &middot; ${spotsLeft} of ${sq.capacity} spot${sq.capacity===1?'':'s'} left` : '';
        return `
        <div style="padding:10px 0;border-top:1px solid var(--line);" class="sq-row">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <div style="font-weight:600;font-size:13.5px;">${escapeHtml(sq.title)}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;">${needsPhoto?'📷 Photo required':'✏️ Note only'}${sq.expiryHours ? ` &middot; ⏱ ${sq.expiryHours}h to complete once accepted` : ''}${capLabel}</div>
            </div>
            <div class="target-pts">+${sq.points} pts</div>
          </div>
          <button class="btn btn-amber btn-sm" data-accept-sq="${sq.id}" style="margin-top:8px;">Accept Task</button>
          <div id="sq-accept-msg-${sq.id}" style="margin-top:6px;font-size:11.5px;"></div>
        </div>`;
      }).join('');
      sqEl.querySelectorAll('[data-accept-sq]').forEach(btn=>{
        btn.onclick = async function(){
          const questId = this.dataset.acceptSq;
          const sq = openQuests.find(x=>x.id===questId);
          this.disabled = true; this.textContent = 'Accepting…';

          // Re-check freshness — capacity may have filled up since this loaded.
          const freshQuests = await getSideQuests();
          const freshSq = freshQuests.find(x=>x.id===questId);
          const freshTargets = await getTargets();
          const freshAcceptedCount = freshTargets.filter(t=>t.sideQuestId===questId).length;
          if(!freshSq || freshSq.active===false || freshAcceptedCount >= (freshSq.capacity||1)){
            document.getElementById('sq-accept-msg-'+questId).style.color = 'var(--red)';
            document.getElementById('sq-accept-msg-'+questId).textContent = 'This task is already full.';
            setTimeout(()=> renderWorkerDashboard(body, worker), 900);
            return;
          }

          const acceptedAt = new Date();
          const expiresAt = sq.expiryHours ? new Date(acceptedAt.getTime() + sq.expiryHours*3600*1000).toISOString() : null;
          freshTargets.push({
            id: uid(), workerId: worker.id, title: sq.title, points: sq.points,
            period: 'Challenger Task', status: 'active', createdAt: todayStr(),
            requiresPhoto: sq.requiresPhoto, sideQuestId: sq.id,
            acceptedAt: acceptedAt.toISOString(), expiresAt
          });
          const ok = await setList(K_TARGETS, freshTargets);
          if(ok){
            // Close it once capacity is reached (this acceptance included).
            if(freshAcceptedCount + 1 >= (freshSq.capacity||1)){
              const idx = freshQuests.findIndex(x=>x.id===questId);
              if(idx>-1){ freshQuests[idx].active = false; await setList(K_SIDEQUESTS, freshQuests); }
            }
            document.getElementById('sq-accept-msg-'+questId).style.color = 'var(--green)';
            document.getElementById('sq-accept-msg-'+questId).textContent = 'Accepted — check My targets below.';
            setTimeout(()=> renderWorkerDashboard(body, worker), 700);
          } else {
            this.disabled = false; this.textContent = 'Accept Task';
            document.getElementById('sq-accept-msg-'+questId).style.color = 'var(--red)';
            document.getElementById('sq-accept-msg-'+questId).textContent = 'Could not accept — try again.';
          }
        };
      });
    }

    const tEl = document.getElementById('wp-targets');
    if(myTargets.length===0){
      tEl.innerHTML = `<div class="card"><div class="empty">No targets assigned yet.</div></div>`;
    } else {
    tEl.innerHTML = `<div class="card">` + myTargets.map(t=>{
      const pendingSub = mySubs.find(s=>s.targetId===t.id && s.status==='pending');
      const lastSub = mySubs.filter(s=>s.targetId===t.id).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt))[0];
      const isExpired = t.status==='active' && t.expiresAt && Date.now() > new Date(t.expiresAt).getTime();
      let statusBadge = '';
      if(t.status==='achieved') statusBadge = '<span class="badge badge-achieved">Achieved</span>';
      else if(t.status==='failed') statusBadge = '<span class="badge badge-rejected">Failed (expired)</span>';
      else if(isExpired) statusBadge = '<span class="badge badge-rejected">Expired</span>';
      else if(pendingSub) statusBadge = '<span class="badge badge-pending">Awaiting review</span>';
      else if(lastSub && lastSub.status==='rejected') statusBadge = '<span class="badge badge-rejected">Resubmit needed</span>';

      const lockInfo = lockInfoFor(t);
      const canSubmit = t.status==='active' && !pendingSub && !isExpired && !lockInfo.locked;
      const needsPhoto = t.requiresPhoto !== false;
      const expiryNote = t.status==='active' && t.expiresAt && !isExpired
        ? `<div style="font-size:10.5px;color:var(--muted);margin-top:2px;">⏱ Submit before ${new Date(t.expiresAt).toLocaleString()}</div>` : '';
      const lockNote = lockInfo.locked
        ? `<div style="font-size:10.5px;color:var(--amber-dark);margin-top:2px;">🔒 Submit "${escapeHtml(lockInfo.waitingOn[0])}"${lockInfo.waitingOn.length>1 ? ` (and ${lockInfo.waitingOn.length-1} other lower-point task${lockInfo.waitingOn.length>2?'s':''})` : ''} first</div>` : '';

      return `
        <div class="target-item">
          <div class="target-top">
            <div>
              <div class="target-title">${escapeHtml(t.title)}</div>
              <div class="target-meta">${t.period} ${statusBadge ? '&middot; '+statusBadge : ''}</div>
              ${expiryNote}
              ${lockNote}
              ${lastSub && lastSub.reviewRemark ? `<div style="font-size:10.5px;margin-top:3px;color:${lastSub.status==='rejected'?'var(--red)':'var(--green)'};">💬 ${escapeHtml(lastSub.reviewRemark)}</div>` : ''}
            </div>
            <div class="target-pts">+${t.points} pts</div>
          </div>
          ${canSubmit ? `<div class="target-actions"><button class="btn btn-amber btn-sm" data-submit="${t.id}">${needsPhoto ? 'Submit Proof Photo' : 'Mark Complete'}</button></div>` : ''}
          <div id="submit-form-${t.id}"></div>
        </div>`;
    }).join('') + `</div>`;

    const myTargetMap = {}; myTargets.forEach(t=> myTargetMap[t.id]=t);
    tEl.querySelectorAll('[data-submit]').forEach(btn=>{
      btn.onclick = ()=>{
        const targetId = btn.dataset.submit;
        const t = myTargetMap[targetId];
        const needsPhoto = t.requiresPhoto !== false;
        const formHost = document.getElementById('submit-form-'+targetId);
        if(formHost.innerHTML){ formHost.innerHTML = ''; return; }

        if(needsPhoto){
          formHost.innerHTML = `
            <div class="file-drop">
              <div style="font-size:12.5px;color:var(--muted);">Take or upload a photo as proof</div>
              <input type="file" accept="image/*" capture="environment" id="file-${targetId}">
              <img class="thumb-preview" id="thumb-${targetId}">
            </div>
            <textarea id="note-${targetId}" placeholder="Optional note" rows="2" style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;margin-bottom:8px;"></textarea>
            <button class="btn btn-primary btn-sm" id="send-${targetId}" disabled>Submit for Review</button>
            <div id="submsg-${targetId}" style="margin-top:6px;font-size:12px;"></div>
          `;
          let compressed = null;
          const fileInput = document.getElementById('file-'+targetId);
          const thumb = document.getElementById('thumb-'+targetId);
          const sendBtn = document.getElementById('send-'+targetId);
          fileInput.onchange = async ()=>{
            if(!fileInput.files[0]) return;
            sendBtn.disabled = true;
            try{
              compressed = await compressImage(fileInput.files[0], 720, 0.5);
              thumb.src = compressed;
              thumb.style.display = 'block';
              sendBtn.disabled = false;
            }catch(e){
              document.getElementById('submsg-'+targetId).textContent = 'Could not read that image — try another.';
            }
          };
          sendBtn.onclick = async ()=>{
            if(!compressed) return;
            sendBtn.disabled = true; sendBtn.textContent = 'Submitting…';
            const msg = document.getElementById('submsg-'+targetId);
            const note = document.getElementById('note-'+targetId).value.trim();
            const blocked = await blockSubmissionReason(targetId);
            if(blocked){
              msg.style.color = 'var(--red)';
              msg.textContent = blocked;
              setTimeout(()=> renderWorkerDashboard(body, worker), 1600);
              return;
            }
            const ok = await addSub({
              id: uid(), targetId, workerId: worker.id, photo: compressed, note,
              status: 'pending', submittedAt: new Date().toISOString()
            });
            if(ok) await markTargetEverSubmitted(targetId);
            if(ok){
              msg.style.color = 'var(--green)';
              msg.textContent = 'Submitted — awaiting admin review.';
              setTimeout(()=> renderWorkerDashboard(body, worker), 900);
            } else {
              sendBtn.disabled = false; sendBtn.textContent = 'Submit for Review';
              msg.style.color = 'var(--red)';
              msg.textContent = 'Could not submit — check connection and try again.';
            }
          };
        } else {
          formHost.innerHTML = `
            <textarea id="note-${targetId}" placeholder="Optional note" rows="2" style="width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13.5px;margin-bottom:8px;"></textarea>
            <button class="btn btn-primary btn-sm" id="send-${targetId}">Submit for Review</button>
            <div id="submsg-${targetId}" style="margin-top:6px;font-size:12px;"></div>
          `;
          const sendBtn = document.getElementById('send-'+targetId);
          sendBtn.onclick = async ()=>{
            sendBtn.disabled = true; sendBtn.textContent = 'Submitting…';
            const msg = document.getElementById('submsg-'+targetId);
            const note = document.getElementById('note-'+targetId).value.trim();
            const blocked = await blockSubmissionReason(targetId);
            if(blocked){
              msg.style.color = 'var(--red)';
              msg.textContent = blocked;
              setTimeout(()=> renderWorkerDashboard(body, worker), 1600);
              return;
            }
            const ok = await addSub({
              id: uid(), targetId, workerId: worker.id, photo: null, note,
              status: 'pending', submittedAt: new Date().toISOString()
            });
            if(ok) await markTargetEverSubmitted(targetId);
            if(ok){
              msg.style.color = 'var(--green)';
              msg.textContent = 'Submitted — awaiting admin review.';
              setTimeout(()=> renderWorkerDashboard(body, worker), 900);
            } else {
              sendBtn.disabled = false; sendBtn.textContent = 'Submit for Review';
              msg.style.color = 'var(--red)';
              msg.textContent = 'Could not submit — check connection and try again.';
            }
          };
        }
      };
    });
    }

    // Rows are built on first expand rather than up front — most loads never
    // open this, so there's no reason to build up to 30 rows of HTML for it.
    let failsDrawn = false;
    async function drawMyFails(){
      const failsEl = document.getElementById('wp-fails');

  async function renderHeadReview(body, worker){
    body.innerHTML = `<div class="empty">Loading…</div>`;

    const teamIds = new Set(myTeam.map(w=>w.id));

    const targetById = {}; targets.forEach(t=>{ targetById[t.id]=t; });
    const mine = pendingSubs.filter(s=>teamIds.has(s.workerId))
      .sort((a,b)=> (a.submittedAt||'').localeCompare(b.submittedAt||''));

    body.innerHTML = `
      <a class="backlink" href="#" id="hr-back">&lsaquo; Back to my dashboard</a>
      <div class="eyebrow" style="margin-top:14px;margin-bottom:6px;">My team &middot; ${myTeam.length} member${myTeam.length===1?'':'s'}</div>
      <div class="help">${myTeam.map(w=>escapeHtml(w.name)).join(', ') || 'Nobody assigned to you yet.'}</div>
      <div class="eyebrow" style="margin-top:16px;margin-bottom:10px;">Awaiting your review (${mine.length})</div>
      <div id="hr-list"></div>
    `;
    document.getElementById('hr-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };

    const listEl = document.getElementById('hr-list');
    if(mine.length===0){
      listEl.innerHTML = `<div class="card"><div class="empty">Nothing waiting for review right now.</div></div>`;
      return;
    }
    listEl.innerHTML = mine.map(s=>{
      const t = targetById[s.targetId];
      const dt = new Date(s.submittedAt);
      return `
        <div class="card" style="margin-bottom:12px;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;">${t?escapeHtml(t.title):'(task no longer exists)'}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${escapeHtml(nameById[s.workerId]||'Unknown')} &middot; ${dt.toLocaleString()}${t?` &middot; +${t.points} pts`:''}</div>
          ${lazyPhotoSlot(s, 'sub-photo') || `<div class="help" style="margin-top:8px;margin-bottom:0;">No photo required for this task.</div>`}
          ${s.note ? `<div class="sub-note" style="margin-top:8px;">${escapeHtml(s.note)}</div>` : ''}
          <input type="text" id="hr-remark-${s.id}" placeholder="Optional remark for the worker…" style="width:100%;margin-top:10px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;box-sizing:border-box;">
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-primary btn-sm" data-hr-approve="${s.id}" data-target="${s.targetId}">Approve</button>
            <button class="btn btn-ghost btn-sm" data-hr-reject="${s.id}">Reject</button>
          </div>
        </div>`;
    }).join('');

    fillLazyPhotos(listEl);
    listEl.querySelectorAll('[data-hr-approve]').forEach(btn=>{
      btn.onclick = async function(){
        this.disabled = true; this.textContent = 'Approving…';
        const rEl = document.getElementById('hr-remark-'+this.dataset.hrApprove);
        await approveTarget(this.dataset.target, this.dataset.hrApprove, rEl && rEl.value.trim() ? rEl.value.trim() : null);
        renderHeadReview(body, worker);
      };
    });
    listEl.querySelectorAll('[data-hr-reject]').forEach(btn=>{

  async function renderAllBadges(body, worker){
    const [totals, targets, allWorkers, badges, archive] = await Promise.all([getTotalsEnsured(), getTargets(), getWorkers(), getBadges(), getTargetArchive()]);
    const ledger = totals ? null : await getLedger();
    const tEarned = id => totals ? ((totals.byWorker[id]||{}).earned || 0) : earnedFor(ledger, id);
    const tReached = id => totals ? ((totals.byWorker[id]||{}).reachedAt || '') : reachedAtFor(ledger, id);
    const earned = tEarned(worker.id);
    const targetsAchieved = achievedCountFor(targets, worker.id) + archiveCountFor(archive, worker.id, 'achieved');
    const sideQuestsAchieved = sideQuestsAchievedCountFor(targets, worker.id) + archiveCountFor(archive, worker.id, 'sideQuests');
    const rankedAll = allWorkers.map(w=>({ id:w.id, earned: tEarned(w.id), reachedAt: tReached(w.id) })).sort((a,b)=> b.earned - a.earned || a.reachedAt.localeCompare(b.reachedAt));
    const myRank = rankedAll.findIndex(w=>w.id===worker.id) + 1;
    const badgeCtx = { earned, targetsAchieved, sideQuestsAchieved, rank: myRank };
    const myEarned = earnedBadges(badgeCtx, badges);
    const myEarnedIds = new Set(myEarned.map(b=>b.id));

    const byGroup = {};
    badges.forEach(b=>{ (byGroup[b.group]=byGroup[b.group]||[]).push(b); });

    body.innerHTML = `
      <a class="backlink" href="#" id="ab-back">&lsaquo; Back to my dashboard</a>
      <div class="eyebrow" style="margin-top:14px;margin-bottom:10px;">All Badges</div>
      <div id="ab-list"></div>
    `;
    document.getElementById('ab-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };

    document.getElementById('ab-list').innerHTML = Object.keys(byGroup).sort((a,b)=>GROUP_PRIORITY[a]-GROUP_PRIORITY[b]).map(group=>`
      <div class="card" style="margin-bottom:14px;">
        <h3 style="margin-bottom:10px;">${escapeHtml(GROUP_LABELS[group]||group)}</h3>
        ${byGroup[group].sort((a,b)=>a.need-b.need).map(b=>{
          const isEarned = myEarnedIds.has(b.id);
          return `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);${isEarned?'':'opacity:0.55;'}">
              <span style="font-size:24px;">${isEarned ? b.emoji : '🔒'}</span>
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;font-size:13.5px;">${escapeHtml(b.label)}</div>
                <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${escapeHtml(b.desc)}</div>
              </div>
              ${isEarned ? `<span class="badge badge-achieved">Earned</span>` : ''}
            </div>`;
        }).join('')}
      </div>`).join('');
  }

  async function renderWorkerLeaderboard(body, worker, period, group){
    period = period || 'lifetime';
    body.innerHTML = `<div class="empty">Loading leaderboard…</div>`;
    const [workers, totals, targets, badges, archive] = await Promise.all([getWorkers(), getTotalsEnsured(), getTargets(), getBadges(), getTargetArchive()]);
    // Fall back to the raw ledger only if the totals cache is unavailable.
    const ledger = totals ? null : await getLedger();
    // Default to whichever group the viewer belongs to, so a head lands on
    // the heads board and a junior lands on the workers board.
    if(!group) group = worker.isHead ? 'heads' : 'workers';
    const anyHeads = workers.some(w=>w.isHead);

    // Lifetime rank (used for rank-based badges) is scoped to the same group —
    // being "#1" should mean #1 among your peers, not across mixed groups.
    const groupWorkers = anyHeads
      ? workers.filter(w => group==='heads' ? !!w.isHead : !w.isHead)
      : workers;

    const lIdx = totals ? null : buildLedgerIndex(ledger);
    const wEarned = id => totals ? ((totals.byWorker[id]||{}).earned || 0) : idxEarned(lIdx, id, null);
    const wReached = id => totals ? ((totals.byWorker[id]||{}).reachedAt || '') : idxReachedAt(lIdx, id, null);
    const wBalance = id => totals ? ((totals.byWorker[id]||{}).balance || 0) : balanceFor(ledger, id);
    const tIdx = buildTargetIndex(targets);
    const cutoff = null; // neither Lifetime nor Challenger Task is date-filtered

    const lifetimeRanked = groupWorkers.map(w=>({ id:w.id, earned: wEarned(w.id), reachedAt: wReached(w.id) })).sort((a,b)=> b.earned - a.earned || a.reachedAt.localeCompare(b.reachedAt));
    const lifetimeRankMap = {}; lifetimeRanked.forEach((w,i)=> lifetimeRankMap[w.id]=i+1);

    const ranked = groupWorkers.map(w=>({
      ...w,
      earnedPeriod: wEarned(w.id),
      earnedLifetime: wEarned(w.id),
      targetsAchieved: (tIdx[w.id] ? tIdx[w.id].achieved : 0) + archiveCountFor(archive, w.id, 'achieved'),
      sideQuestsAchieved: (tIdx[w.id] ? tIdx[w.id].sideQuests : 0) + archiveCountFor(archive, w.id, 'sideQuests'),
      lifetimeRank: lifetimeRankMap[w.id],
      reachedAtPeriod: period==='sidequest' ? idxSideQuestReachedAt(tIdx, w.id) : wReached(w.id)
    })).sort((a,b)=> period==='sidequest'
      ? (b.sideQuestsAchieved - a.sideQuestsAchieved || a.reachedAtPeriod.localeCompare(b.reachedAtPeriod))
      : (b.earnedPeriod - a.earnedPeriod || a.reachedAtPeriod.localeCompare(b.reachedAtPeriod)));
    ranked.forEach((w,i)=> w.periodRank = i+1);
    const top20 = ranked.slice(0, 20);
    const periodLabel = { lifetime:'All Time', sidequest:'Challenger Tasks' }[period];

    body.innerHTML = `
      <a class="backlink" href="#" id="wp-back">&lsaquo; Back to my dashboard</a>
      <div class="eyebrow" style="margin-top:14px;margin-bottom:10px;">Team Leaderboard</div>
      ${anyHeads ? `
      <div class="toggle-group" id="wp-lb-group-toggle">
        <div class="toggle-opt${group==='workers'?' selected':''}" data-group="workers" style="${group==='workers'?'border-color:var(--ink);color:var(--ink);background:var(--paper);':''}">Workers</div>
        <div class="toggle-opt${group==='heads'?' selected':''}" data-group="heads" style="${group==='heads'?'border-color:var(--ink);color:var(--ink);background:var(--paper);':''}">Heads</div>
      </div>` : ''}
      <div class="toggle-group" id="wp-lb-period-toggle">
        ${PERIODS.map(p=>`<div class="toggle-opt${p.key===period?' selected':''}" data-period="${p.key}" style="${p.key===period?'border-color:var(--amber);color:var(--amber-dark);background:#FFF6E8;':''}">${p.label}</div>`).join('')}
      </div>
      <div class="help" style="margin-top:0;">Top ${top20.length} &middot; ranked by ${period==='sidequest' ? 'challenger tasks completed' : periodLabel.toLowerCase()+' points'}</div>
      <div id="wp-lb-list"></div>
    `;
    document.getElementById('wp-back').onclick = (e)=>{ e.preventDefault(); renderWorkerDashboard(body, worker); };
    document.querySelectorAll('#wp-lb-period-toggle [data-period]').forEach(opt=>{
      opt.onclick = ()=> renderWorkerLeaderboard(body, worker, opt.dataset.period, group);
    });
    document.querySelectorAll('#wp-lb-group-toggle [data-group]').forEach(opt=>{
      opt.onclick = ()=> renderWorkerLeaderboard(body, worker, period, opt.dataset.group);
    });

    const listEl = document.getElementById('wp-lb-list');
    if(top20.length===0){
      listEl.innerHTML = `<div class="card"><div class="empty">Nobody in this group yet.</div></div>`;
      return;
    }
    listEl.innerHTML = top20.map(w=>{
      const medalClass = w.periodRank===1?'medal-1':w.periodRank===2?'medal-2':w.periodRank===3?'medal-3':'medal-n';
      const medalContent = w.periodRank<=3 ? '&#9733;' : w.periodRank;
      const topBadge = highestBadge({ earned: w.earnedLifetime, targetsAchieved: w.targetsAchieved, sideQuestsAchieved: w.sideQuestsAchieved, rank: w.lifetimeRank }, badges);
      const rowAvatar = avatarInfoFor(w.earnedLifetime);
      const isMe = w.id === worker.id;
      return `
        <div class="rank-row" style="${isMe ? 'border-color:var(--amber);background:#FFFAF0;' : ''}">
          <div class="rank-medal ${medalClass}">${medalContent}</div>
          <div class="rank-info">
            <div class="rank-name">${rowAvatar.emoji} ${escapeHtml(w.name)}${isMe ? ' <span style="color:var(--amber-dark);font-size:11px;">(you)</span>' : ''} <span style="color:var(--muted);font-size:10.5px;font-weight:400;">Lv.${rowAvatar.level}</span></div>
            <div class="rank-role">${escapeHtml(w.role||'')}</div>
            ${topBadge ? `<div class="rank-badges"><span class="em" title="${escapeHtml(topBadge.label)}">${topBadge.emoji}</span></div>` : ''}
          </div>
          ${period==='sidequest'
            ? `<div class="rank-points"><div class="n">${w.sideQuestsAchieved}</div><div class="l">completed</div></div>`
            : `<div class="rank-points"><div class="n">${w.earnedPeriod}</div><div class="l">pts</div></div>`}
        </div>`;
    }).join('');
  }

      earnedPeriod: wEarned(w.id),
      earnedLifetime: wEarned(w.id),
      balance: wBalance(w.id),
      targetsAchieved: (tIdx[w.id] ? tIdx[w.id].achieved : 0) + archiveCountFor(archive, w.id, 'achieved'),
      sideQuestsAchieved: (tIdx[w.id] ? tIdx[w.id].sideQuests : 0) + archiveCountFor(archive, w.id, 'sideQuests'),
      lifetimeRank: lifetimeRankMap[w.id],
      reachedAtPeriod: period==='sidequest' ? idxSideQuestReachedAt(tIdx, w.id) : wReached(w.id)
    })).sort((a,b)=> period==='sidequest'
      ? (b.sideQuestsAchieved - a.sideQuestsAchieved || a.reachedAtPeriod.localeCompare(b.reachedAtPeriod))
      : (b.earnedPeriod - a.earnedPeriod || a.reachedAtPeriod.localeCompare(b.reachedAtPeriod)));
    periodRanked.forEach((w,i)=> w.periodRank = i+1);
    const top20 = periodRanked.slice(0, 20);

    const periodTargets = targets.filter(t=> t.status==='achieved' && t.achievedAt && (cutoff===null || t.achievedAt >= cutoff)).length;
    const periodTotalPts = periodRanked.reduce((s,w)=>s+w.earnedPeriod,0);
    const totalSideQuests = targets.filter(t=>t.status==='achieved' && t.sideQuestId).length;
    const periodLeader = period==='sidequest'
      ? (periodRanked[0] && periodRanked[0].sideQuestsAchieved>0 ? periodRanked[0] : null)
      : (periodRanked[0] && periodRanked[0].earnedPeriod>0 ? periodRanked[0] : null);
    const periodLabel = { lifetime:'All Time', sidequest:'Challenger Tasks' }[period];

    el.innerHTML = `
      <div class="week-card">
        <div class="week-eyebrow">${periodLabel}</div>
        <div class="week-stats">
          ${period==='sidequest' ? `
            <div class="week-stat"><div class="n">${totalSideQuests}</div><div class="l">Challenger tasks completed</div></div>
            <div class="week-stat"><div class="n">${workers.length}</div><div class="l">Team members</div></div>
          ` : `
            <div class="week-stat"><div class="n">${periodTotalPts}</div><div class="l">Points earned</div></div>
            <div class="week-stat"><div class="n">${periodTargets}</div><div class="l">Targets hit</div></div>
          `}
        </div>
        ${periodLeader ? `<div class="week-leader">${periodLabel} leader: <strong>${escapeHtml(periodLeader.name)}</strong> &middot; ${period==='sidequest' ? periodLeader.sideQuestsAchieved+' completed' : periodLeader.earnedPeriod+' pts'}</div>` : `<div class="week-leader">${period==='sidequest' ? 'No challenger tasks completed yet.' : 'No points earned yet in this period.'}</div>`}
      </div>
      <div class="stat-strip">
        <div class="stat"><div class="n">${allWorkers.length}</div><div class="l">Team members</div></div>
        <div class="stat"><div class="n">${activeTargets}</div><div class="l">Active targets</div></div>
        <div class="stat"><div class="n">${achievedCount}</div><div class="l">Achieved</div></div>
      </div>
      ${anyHeads ? `
      <div class="toggle-group" id="lb-group-toggle">
        <div class="toggle-opt${group==='workers'?' selected':''}" data-group="workers" style="${group==='workers'?'border-color:var(--ink);color:var(--ink);background:var(--paper);':''}">Workers (${allWorkers.filter(w=>!w.isHead).length})</div>
        <div class="toggle-opt${group==='heads'?' selected':''}" data-group="heads" style="${group==='heads'?'border-color:var(--ink);color:var(--ink);background:var(--paper);':''}">Heads (${allWorkers.filter(w=>w.isHead).length})</div>
      </div>` : ''}
      <div class="toggle-group" id="lb-period-toggle">
        ${PERIODS.map(p=>`<div class="toggle-opt${p.key===period?' selected':''}" data-period="${p.key}" style="${p.key===period?'border-color:var(--amber);color:var(--amber-dark);background:#FFF6E8;':''}">${p.label}</div>`).join('')}
      </div>
      <div class="eyebrow" style="margin-bottom:10px;">Top ${top20.length} &middot; ranked by ${period==='sidequest' ? 'challenger tasks completed' : periodLabel.toLowerCase()+' points'}</div>
      <div id="lb-list"></div>
      <div class="card" style="margin-top:16px;">
        <div class="eyebrow" style="margin-bottom:6px;">Worker access</div>
        <div class="help">Share this link so workers can view their targets and submit proof photos: <span class="mono">${window.location.href.split('#')[0]}#worker</span></div>
      </div>
    `;
    document.querySelectorAll('#lb-period-toggle [data-period]').forEach(opt=>{
      opt.onclick = ()=> renderLeaderboard(opt.dataset.period, group);
    });
    document.querySelectorAll('#lb-group-toggle [data-group]').forEach(opt=>{
      opt.onclick = ()=> renderLeaderboard(period, opt.dataset.group);
    });
    if(top20.length===0){
      document.getElementById('lb-list').innerHTML = `<div class="card"><div class="empty">Nobody in this group yet.</div></div>`;
      return;
    }
    document.getElementById('lb-list').innerHTML = top20.map((w)=>{
      const medalClass = w.periodRank===1?'medal-1':w.periodRank===2?'medal-2':w.periodRank===3?'medal-3':'medal-n';
      const medalContent = w.periodRank<=3 ? '&#9733;' : w.periodRank;
      const topBadge = highestBadge({ earned: w.earnedLifetime, targetsAchieved: w.targetsAchieved, sideQuestsAchieved: w.sideQuestsAchieved, rank: w.lifetimeRank }, badges);
      const rowAvatar = avatarInfoFor(w.earnedLifetime);
      return `
        <div class="rank-row">
          <div class="rank-medal ${medalClass}">${medalContent}</div>
          <div class="rank-info">
            <div class="rank-name">${rowAvatar.emoji} ${escapeHtml(w.name)} <span style="color:var(--muted);font-size:10.5px;font-weight:400;">Lv.${rowAvatar.level}</span></div>
            <div class="rank-role">${escapeHtml(w.role||'')}</div>
            ${topBadge ? `<div class="rank-badges"><span class="em" title="${escapeHtml(topBadge.label)}">${topBadge.emoji}</span></div>` : ''}
          </div>
          ${period==='sidequest'
            ? `<div class="rank-points"><div class="n">${w.sideQuestsAchieved}</div><div class="l">completed</div></div>`
            : `<div class="rank-points"><div class="n">${w.earnedPeriod}</div><div class="l">pts &middot; ${w.balance} bal.</div></div>`}
        </div>`;
    }).join('');
  }

      this.disabled = true; this.textContent = 'Resetting…';

    };

    let employmentType = 'fulltime';
    const empFulltimeBtn = document.getElementById('w-emp-fulltime');
    const empParttimeBtn = document.getElementById('w-emp-parttime');
    const empContractBtn = document.getElementById('w-emp-contract');
    const SEL = 'border-color:var(--green);color:var(--green);background:rgba(31,157,107,0.06);';
    function setEmploymentType(type){
      employmentType = type;
      empFulltimeBtn.setAttribute('style', type==='fulltime' ? SEL : '');
      empParttimeBtn.setAttribute('style', type==='parttime' ? SEL : '');
      empContractBtn.setAttribute('style', type==='contract' ? SEL : '');

      const workers = await getWorkers();
      workers.push({id: uid(), name, role, employmentType, passwordHash, joined, isHead, reportsTo});
      const ok = await setList(K_WORKERS, workers);
      this.disabled = false; this.textContent = 'Add Worker';
      if(ok){
        msg.style.color='var(--green)'; msg.textContent = `Added — PIN is ${password}. Write this down now — it won't be shown again.`;

      if(!name){ msg.style.color='var(--red)'; msg.textContent='Please enter a role name.'; return; }

  async function drawRolesList(){
    const el = document.getElementById('role-list');
    if(!el) return;
    const [allRoles, workers] = await Promise.all([getRoles(), getWorkers()]);
    const query = (document.getElementById('role-search').value || '').trim().toLowerCase();
    const roles = query ? allRoles.filter(r=>r.toLowerCase().includes(query)) : allRoles;
    if(roles.length===0){ el.innerHTML = `<div class="help" style="margin-bottom:0;">No roles match "${escapeHtml(query)}".</div>`; return; }
    const countByRole = {};
    workers.forEach(w=>{ countByRole[w.role] = (countByRole[w.role]||0) + 1; });
    el.innerHTML = roles.map(r=>{
      const isDefault = DEFAULT_ROLES.includes(r);
      const isProtected = r === 'Other';
      const count = countByRole[r] || 0;
      return `
        <div style="padding:9px 0;border-top:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-size:13px;">${escapeHtml(r)} <span style="color:var(--muted);font-size:11px;">${count} worker${count===1?'':'s'}${isDefault ? ' · built-in' : ''}</span></div>
            ${!isProtected ? `
              <div style="display:flex;gap:6px;">
                <button class="btn btn-ghost btn-sm" data-role-edit="${escapeHtml(r)}" style="padding:4px 9px;">Edit</button>
                <button class="btn btn-ghost btn-sm" data-role-remove="${escapeHtml(r)}" style="padding:4px 9px;">Remove</button>
              </div>` : ''}
          </div>
          <div id="role-edit-form-${escapeHtml(r).replace(/[^a-zA-Z0-9]/g,'_')}"></div>
        </div>`;
    }).join('');

    el.querySelectorAll('[data-role-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const name = btn.dataset.roleRemove;
        if(!confirm(`Remove the role "${name}"? This only works if no worker currently has it.`)) return;
        const result = await removeRole(name);
        if(result.ok){ drawRolesList(); }
        else if(result.reason==='in-use'){ alert(`Can't remove "${name}" — ${result.count} worker${result.count===1?'':'s'} still ${result.count===1?'has':'have'} this role. Reassign them first in Edit Details.`); }
        else { alert('Could not remove that role — try again.'); }
      };
    });
    el.querySelectorAll('[data-role-edit]').forEach(btn=>{
      btn.onclick = ()=>{
        const oldName = btn.dataset.roleEdit;
        const safeId = oldName.replace(/[^a-zA-Z0-9]/g,'_');
        const host = document.getElementById('role-edit-form-'+safeId);
        if(host.innerHTML){ host.innerHTML = ''; return; }
        host.innerHTML = `
          <div style="margin-top:8px;padding:10px;background:var(--paper);border-radius:8px;display:flex;gap:8px;">
            <input type="text" id="role-edit-input-${safeId}" value="${escapeHtml(oldName)}" style="flex:1;">
            <button class="btn btn-primary btn-sm" data-role-save="${escapeHtml(oldName)}" style="white-space:nowrap;">Save</button>
          </div>`;
        host.querySelector('[data-role-save]').onclick = async function(){
          const newName = document.getElementById('role-edit-input-'+safeId).value.trim();
          if(!newName || newName===oldName){ host.innerHTML = ''; return; }
          this.disabled = true; this.textContent = 'Saving…';
          const result = await renameRole(oldName, newName);
          if(result.ok){ drawRolesList(); }
          else {
            this.disabled = false; this.textContent = 'Save';
            alert(result.reason==='duplicate' ? 'That role name already exists.' : 'Could not rename — try again.');
          }
        };
      };
    });
  }

      const msg = document.getElementById('holiday-msg');
      if(!date){ msg.style.color='var(--red)'; msg.textContent='Please pick a date.'; return; }
      if(selectedRoles.length===0){ msg.style.color='var(--red)'; msg.textContent='Please select at least one role.'; return; }
      this.disabled = true; this.textContent = 'Adding…';
      const closures = await getHolidayClosures();
      closures.push({ id: uid(), date, roles: selectedRoles, createdAt: new Date().toISOString() });
      const ok = await setList(K_HOLIDAY_CLOSURES, closures);
      if(ok){
        // Backdated closure: an admin often only remembers to mark the holiday
        // after the fact, by which point workers have already been failed for
        // tasks on a day the office was shut. Clear those retroactively rather
        // than making them appeal it one by one.
        let cleared = 0;
        let clearedActive = 0;
        try{
          const [fails, allWorkers, targets, pendingSubs] = await Promise.all([getFails(), getWorkers(), getTargets(), getPendingSubs()]);
          const roleSet = new Set(selectedRoles);
          const roleById = {}; allWorkers.forEach(w=>{ roleById[w.id] = w.role; });
          const pendingTargetIds = new Set(pendingSubs.map(s=>s.targetId));
          const matches = f => {
            if(!roleSet.has(roleById[f.workerId])) return false;
            if(f.type === 'sidequest') return false; // challenger tasks are opt-in, not affected by a closure
            // Prefer the task's own date; older records predate that field, so
            // fall back to the day the fail was recorded.
            const d = f.taskDate || String(f.failedAt || '').slice(0,10);
            return d === date;
          };
          const keptFails = fails.filter(f=>!matches(f));
          cleared = fails.length - keptFails.length;
          if(cleared > 0) await setFailsAndCounts(keptFails);

          // Clear out that date's tasks so workers aren't left holding items
          // for a day the office was shut. Covers two cases: ones already
          // marked failed, and ones still sitting active (a closure added
          // mid-day, before the 9pm cutoff had even run).
          const keptTargets = targets.filter(t=>{
            if(t.sideQuestId) return true;                      // challenger tasks are opt-in
            if(t.isWeekly) return true;                         // a weekly spans the week; one closed day shouldn't void it
            if(!roleSet.has(roleById[t.workerId])) return true;
            if(t.createdAt !== date) return true;
            if(t.status === 'achieved') return true;            // already approved — points earned, leave it
            if(pendingTargetIds.has(t.id)) return true;         // awaiting review — let the admin decide
            if(t.status === 'active') clearedActive++;
            return false;                                       // drop active + failed for that date
          });
          if(keptTargets.length !== targets.length) await setList(K_TARGETS, keptTargets);
        }catch(e){
          console.error('Could not clear fails for backdated closure:', e);
        }

        document.getElementById('holiday-date').value = '';
        document.querySelectorAll('.holiday-role-cb').forEach(cb=>cb.checked=false);
        msg.style.color='var(--green)';
        const bits = [];
        if(clearedActive > 0) bits.push(`removed ${clearedActive} active task${clearedActive===1?'':'s'}`);
        if(cleared > 0) bits.push(`cleared ${cleared} fail${cleared===1?'':'s'}`);
        msg.textContent = bits.length
          ? `Closure added — also ${bits.join(' and ')} for that date.`
          : 'Closure added.';
        drawHolidayClosuresList();
      } else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
      this.disabled = false; this.textContent = 'Add Closure';
    };
    await drawHolidayClosuresList();
  }
  async function drawHolidayClosuresList(){
    const el = document.getElementById('holiday-list');
    if(!el) return;
    const closures = await getHolidayClosures();
    if(closures.length===0){ el.innerHTML = `<div class="help" style="margin-bottom:0;">No closures set.</div>`; return; }
    const today = todayStr();
    // Show upcoming/today's closures first (most relevant), then past ones,
    // capped at 10 total so a long history doesn't crowd out the rest of the tab.
    const upcoming = closures.filter(c=>c.date >= today).sort((a,b)=> a.date.localeCompare(b.date));
    const past = closures.filter(c=>c.date < today).sort((a,b)=> b.date.localeCompare(a.date));
    const ordered = upcoming.concat(past);
    const sorted = ordered.slice(0, 10);
    const hiddenCount = ordered.length - sorted.length;
    el.innerHTML = sorted.map(c=>{
      const isPast = c.date < today;
      return `
        <div class="ledger-row" style="${isPast ? 'opacity:0.5;' : ''}">
          <div class="ledger-note">${c.date}${isPast ? ' (past)' : ''} &middot; ${c.roles.map(escapeHtml).join(', ')}</div>
          <button class="btn btn-ghost btn-sm" data-holiday-remove="${c.id}" style="padding:4px 9px;">Remove</button>
        </div>`;
    }).join('') + (hiddenCount>0 ? `<div class="help" style="margin-top:8px;margin-bottom:0;">${hiddenCount} older closure${hiddenCount===1?'':'s'} hidden.</div>` : '');
    el.querySelectorAll('[data-holiday-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const all = await getHolidayClosures();
        await setList(K_HOLIDAY_CLOSURES, all.filter(c=>c.id!==btn.dataset.holidayRemove));
        drawHolidayClosuresList();
      };
    });
  }

      const t = templateMap[d.templateId];
      return `

  async function drawTargetList(filterId, workers){
    const listEl = document.getElementById('t-list');
    const [targets, subs] = await Promise.all([getTargets(), getPendingSubs()]);
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    // Achieved tasks are hidden here — this list is for what still needs
    // attention (active, awaiting review, or failed), not a completion archive.
    const notAchieved = targets.filter(t=>t.status!=='achieved');
    const filtered = filterId==='all' ? notAchieved : notAchieved.filter(t=>t.workerId===filterId);
    const statusWeight = { active:0, failed:1 };
    const sorted = filtered.slice().sort((a,b)=>{
      const wA = statusWeight[a.status] ?? 0, wB = statusWeight[b.status] ?? 0;
      if(wA!==wB) return wA-wB;
      return b.createdAt.localeCompare(a.createdAt);
    });
    if(sorted.length===0){ listEl.innerHTML = `<div class="card"><div class="empty">No outstanding targets.</div></div>`; return; }
    listEl.innerHTML = `<div class="card">` + sorted.map(t=>{
      const w = workerMap[t.workerId];
      const pending = subs.find(s=>s.targetId===t.id && s.status==='pending');
      let badge = '';
      if(t.status==='achieved') badge = '<span class="badge badge-achieved">Achieved</span>';
      else if(t.status==='failed') badge = '<span class="badge badge-rejected">Failed (expired)</span>';
      else if(pending) badge = '<span class="badge badge-pending">Awaiting review</span>';
      return `
        <div class="target-item">
          <div class="target-top">
            <div><div class="target-title">${escapeHtml(t.title)}</div>
            <div class="target-meta">${w?escapeHtml(w.name):'—'} &middot; ${t.period} ${badge?'&middot; '+badge:''}</div></div>
            <div class="target-pts">+${t.points} pts</div>
          </div>
          ${t.status==='active' && !pending ? `<div class="target-actions">
            <button class="btn btn-amber btn-sm" data-achieve="${t.id}">Mark Achieved</button>
            <button class="btn btn-ghost btn-sm" data-remove="${t.id}">Remove</button></div>` : ''}
        </div>`;
    }).join('') + `</div>`;
    listEl.querySelectorAll('[data-achieve]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.disabled = true; btn.textContent='Saving…';
        await approveTarget(btn.dataset.achieve, null);
        drawTargetList(document.getElementById('t-filter').value, workers);
      };
    });
    listEl.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const targets = await getTargets();
        const target = targets.find(x=>x.id===btn.dataset.remove);
        // Daily targets are auto-regenerated from the worker's role template every
        // page load, so just deleting the target record isn't enough — it would
        // reappear on refresh. Also record it as permanently dismissed for this
        // worker+template combo so it stops being auto-assigned going forward.
        // Other workers / other templates keep auto-generating as usual.
        if(target && target.isDaily && target.templateId){
          const dismissed = await getDismissed();
          dismissed.push({ workerId: target.workerId, templateId: target.templateId, removedAt: todayStr() });
          await setList(K_DISMISSED, dismissed);
        }
        await setList(K_TARGETS, targets.filter(x=>x.id!==btn.dataset.remove));
        drawTargetList(document.getElementById('t-filter').value, workers);
      };
    });
  }

  async function approveTarget(targetId, submissionId, remark){
    const targets = await getTargets();
    const idx = targets.findIndex(x=>x.id===targetId);
    if(idx===-1) return;
    const t = targets[idx];

    // If this target was already approved (e.g. a duplicate submission slipped
    // through from a stale page), just close out this submission — awarding
    // the points a second time would silently inflate their balance.
    if(t.status === 'achieved'){
      if(submissionId){
        await updateSub(submissionId, { status:'approved', reviewedAt: new Date().toISOString(), duplicateOf: t.id, reviewRemark: remark || null });
      }
      return;
    }

    t.status = 'achieved'; t.achievedAt = todayStr();
    // Merge, so a page that started generating before this approval can't
    // write the old 'active' status back over it.
    await applyTargetDeltas({ statusChanges: { [targetId]: { status:'achieved', achievedAt: todayStr() } } });

    // Stamp the ledger entry with when the WORKER submitted, not when this
    // approval happened — leaderboard ties are broken by who got there first,
    // and that should reflect their effort, not how quickly a reviewer
    // happened to get around to it. Falls back to now for anything approved
    // without a submission attached (e.g. admin awarding directly).
    let earnedAt = new Date().toISOString();
    if(submissionId){
      try{
        const subDoc = await db.collection(SUBS_COLLECTION).doc(submissionId).get();
        if(subDoc.exists && subDoc.data().submittedAt) earnedAt = subDoc.data().submittedAt;
      }catch(e){ console.error('Could not read submission time, falling back to now:', e); }
    }

    // If the award fails, roll the task back rather than leaving it marked
    // approved with no points — a silent mismatch is far harder to spot than
    // an approval that visibly didn't take.
    const awarded = await appendLedger([{id: uid(), workerId: t.workerId, type:'earned', points: t.points, note: t.title, date: todayStr(), at: earnedAt }]);
    if(!awarded){
      await applyTargetDeltas({ statusChanges: { [targetId]: { status:'active', achievedAt: null } } });
      showFbError('Points could not be saved, so this approval was undone. Try approving again.');
      return;
    }
    if(submissionId){
      await updateSub(submissionId, { status:'approved', reviewedAt: new Date().toISOString(), reviewRemark: remark || null });
    }
  }

  // ---- Review ----
  async function renderReview(){
    const el = document.getElementById('view-review');
    el.innerHTML = `<div class="empty">Loading…</div>`;
    const [subs, workers, targets] = await Promise.all([getPendingSubs(), getWorkers(), getTargets()]);
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    const targetMap = {}; targets.forEach(t=>targetMap[t.id]=t);
    const allPending = subs.filter(s=>s.status==='pending').sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt));

    if(allPending.length===0){
      el.innerHTML = `<div class="card"><div class="empty">No submissions awaiting review.<br>Photo proofs from workers will appear here.</div></div>`;
      return;
    }

    // Submissions from workers who report to a head are that head's to review.
    // Admin can still see and act on everything, but defaults to showing only
    // the ones nobody else is responsible for.
    const headOwnedCount = allPending.filter(s=>{
      const w = workerMap[s.workerId];
      return w && w.reportsTo && workerMap[w.reportsTo] && workerMap[w.reportsTo].isHead;
    }).length;

    el.innerHTML = `
      ${headOwnedCount>0 ? `
      <div class="card" style="margin-bottom:12px;">
        <div class="field" style="margin-bottom:0;">
          <label style="font-size:11px;">Show</label>
          <select id="rv-scope">
            <option value="unassigned">Only mine — no head assigned (${allPending.length - headOwnedCount})</option>
            <option value="all">Everything, including heads' teams (${allPending.length})</option>
          </select>
        </div>
        <div class="help" style="margin-top:8px;margin-bottom:0;">${headOwnedCount} submission${headOwnedCount===1?' is':'s are'} assigned to a head for review. You can still act on them if needed.</div>
      </div>` : ''}
      <div class="eyebrow" style="margin-bottom:10px;" id="rv-count"></div>
      <div id="rv-list"></div>
    `;

    function drawReviewList(){
      const scope = document.getElementById('rv-scope') ? document.getElementById('rv-scope').value : 'all';
      const pending = scope === 'all' ? allPending : allPending.filter(s=>{
        const w = workerMap[s.workerId];
        const headOwned = w && w.reportsTo && workerMap[w.reportsTo] && workerMap[w.reportsTo].isHead;
        return !headOwned;
      });
      document.getElementById('rv-count').textContent = `${pending.length} awaiting review`;
      const listEl = document.getElementById('rv-list');
      if(pending.length===0){
        listEl.innerHTML = `<div class="card"><div class="empty">Nothing here — everything pending is assigned to a head.</div></div>`;
        return;
      }
      listEl.innerHTML = pending.map(s=>{
        const w = workerMap[s.workerId]; const t = targetMap[s.targetId];
        const head = w && w.reportsTo ? workerMap[w.reportsTo] : null;
        return `
        <div class="sub-card">
          <div class="sub-top">
            <div><div class="sub-title">${t?escapeHtml(t.title):'—'}</div>
            <div class="sub-meta">${w?escapeHtml(w.name):'—'} &middot; ${new Date(s.submittedAt).toLocaleString()}${head && head.isHead ? ` &middot; <span style="color:var(--amber-dark);">head: ${escapeHtml(head.name)}</span>` : ''}</div></div>
            <div class="target-pts">+${t?t.points:0} pts</div>
          </div>
          ${lazyPhotoSlot(s, 'sub-photo') || `<div class="sub-note" style="color:var(--muted);">No photo required for this task.</div>`}
          ${s.note ? `<div class="sub-note">${escapeHtml(s.note)}</div>` : ''}
          <input type="text" class="rv-remark" id="rv-remark-${s.id}" placeholder="Optional remark for the worker…" style="width:100%;margin-top:10px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;box-sizing:border-box;">
          <div class="sub-actions">
            <button class="btn btn-green btn-sm" data-approve="${s.id}" data-target="${s.targetId}">Approve</button>
            <button class="btn btn-red btn-sm" data-reject="${s.id}">Reject</button>
          </div>
        </div>`;
      }).join('');
      wireReviewActions(listEl);
      fillLazyPhotos(listEl);
    }

    if(document.getElementById('rv-scope')){
      document.getElementById('rv-scope').onchange = drawReviewList;
    }
    drawReviewList();
    return;
  }

  function wireReviewActions(listEl){
    listEl.querySelectorAll('[data-lightbox]').forEach(img=>{
      img.onclick = ()=> openLightbox(img.dataset.lightbox);
    });
    const remarkFor = id => {
      const el = document.getElementById('rv-remark-'+id);
      return el && el.value.trim() ? el.value.trim() : null;
    };
    listEl.querySelectorAll('[data-approve]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.disabled = true; btn.textContent = 'Approving…';
        await approveTarget(btn.dataset.target, btn.dataset.approve, remarkFor(btn.dataset.approve));
        renderReview(); updateReviewDot();
      };
    });
    listEl.querySelectorAll('[data-reject]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.disabled = true; btn.textContent = 'Rejecting…';
        await updateSub(btn.dataset.reject, { status:'rejected', reviewedAt: new Date().toISOString(), reviewRemark: remarkFor(btn.dataset.reject) });
        renderReview(); updateReviewDot();
      };
    });
  }

  // ---- Log (submission history, loaded a page at a time) ----
  // Accumulates rows as the admin asks for more, rather than pulling the whole
  // history up front — a submission carries an embedded photo, so a full load
  // is expensive in both reads and bandwidth.
  let logRows = [], logCursor = null, logDone = false, logLoading = false;

  async function renderLog(){
    const el = document.getElementById('view-log');
    el.innerHTML = `<div class="empty">Loading…</div>`;
    logRows = []; logCursor = null; logDone = false;
    const [firstPage, workers, roles] = await Promise.all([getSubsPage(null), getWorkers(), getRoles()]);
    logRows = firstPage.rows; logCursor = firstPage.lastDoc; logDone = firstPage.done;

  async function loadMoreLog(workers){
    if(logDone || logLoading) return;
    logLoading = true;
    const btn = document.getElementById('log-load-more');
    if(btn){ btn.disabled = true; btn.textContent = 'Loading…'; }
    const next = await getSubsPage(logCursor);
    logRows = logRows.concat(next.rows);
    logCursor = next.lastDoc || logCursor;
    logDone = next.done;
    logLoading = false;
    drawLogTable(workers);
  }

  async function drawLogTable(workers){
    const el = document.getElementById('log-list');
    if(!el) return;
    const subs = logRows;
    const targets = await getTargets();
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    const targetMap = {}; targets.forEach(t=>targetMap[t.id]=t);

    const statusFilter = document.getElementById('log-filter-status').value;
    const roleFilter = document.getElementById('log-filter-role').value;
    const nameFilter = (document.getElementById('log-filter-name').value || '').trim().toLowerCase();

    const filtered = subs.filter(s=>{
      if(statusFilter!=='all' && s.status!==statusFilter) return false;
      const w = workerMap[s.workerId];
      if(roleFilter!=='all' && (!w || w.role!==roleFilter)) return false;
      if(nameFilter && (!w || !w.name.toLowerCase().includes(nameFilter))) return false;
      return true;
    });

    if(filtered.length===0){
      el.innerHTML = `<div class="card"><div class="empty">No submissions match these filters.</div></div>`;
      return;
    }

    const logStatusWeight = { pending:0, rejected:1, approved:2 };
    const sorted = filtered.slice().sort((a,b)=>{
      const wA = logStatusWeight[a.status] ?? 0, wB = logStatusWeight[b.status] ?? 0;
      if(wA!==wB) return wA-wB;
      return b.submittedAt.localeCompare(a.submittedAt);
    });
    const badgeClass = { pending:'badge-pending', approved:'badge-achieved', rejected:'badge-rejected' };

    el.innerHTML = `
      <div class="eyebrow" style="margin-bottom:10px;">Showing ${filtered.length} of ${subs.length} loaded &middot; tap a photo to view full size</div>
      <table class="logtable">
        <thead><tr><th>Photo</th><th>Task</th><th>Worker</th><th>Date</th><th>Time</th><th>Status</th><th>Note</th></tr></thead>
        <tbody id="log-tbody"></tbody>
      </table>
      ${logDone
        ? `<div class="help" style="text-align:center;margin-top:12px;margin-bottom:0;">That's the full history — ${subs.length} submission${subs.length===1?'':'s'}.</div>`
        : `<div style="text-align:center;margin-top:12px;">
             <button class="btn btn-ghost btn-sm" id="log-load-more">Load 50 more</button>
             <div class="help" style="margin-top:6px;margin-bottom:0;">Filters search the ${subs.length} loaded so far — load more to widen the search.</div>
           </div>`}
    `;
    const moreBtn = document.getElementById('log-load-more');
    if(moreBtn) moreBtn.onclick = ()=> loadMoreLog(workers);
    const tbody = document.getElementById('log-tbody');
    tbody.innerHTML = sorted.map(s=>{
      const w = workerMap[s.workerId]; const t = targetMap[s.targetId];
      const dt = new Date(s.submittedAt);
      const photoCell = (s.hasPhoto || s.photo)
        ? (lazyPhotoSlot(s, 'log-table-thumb') || '')
        : `<div class="log-table-thumb" style="display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);background:var(--paper);">📝</div>`;
      return `
        <tr>
          <td>${photoCell}</td>
          <td>${t?escapeHtml(t.title):'—'}</td>
          <td>${w?escapeHtml(w.name):'—'}</td>
          <td class="mono">${todayStrFromDate(dt)}</td>
          <td class="mono">${dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
          <td><span class="badge ${badgeClass[s.status]||''}">${s.status}</span></td>
          <td>${s.note ? escapeHtml(s.note) : '<span style="color:var(--muted);">—</span>'}${s.reviewRemark ? `<br><span style="font-size:10.5px;color:var(--amber-dark);">💬 ${escapeHtml(s.reviewRemark)}</span>` : ''}</td>
        </tr>`;
    }).join('');
    fillLazyPhotos(tbody);
    tbody.querySelectorAll('[data-lightbox]').forEach(img=>{
      img.onclick = ()=> openLightbox(img.dataset.lightbox);
    });
  }
