      }
      if(pageStart >= items.length) pageStart = 0;

      // Only the people it is still waiting on. A name coming off the board
      // is how the floor sees that somebody has done it, and the reminder
      // itself goes when the last name does.
      const card = a => {
        const waiting = annOutstandingNames(a);
        const done = (a.workerIds || []).length - waiting.length;
        return `
        <div class="wd-item">
          <div class="wd-text">${escapeHtml(a.text)}</div>
          <div class="wd-who">${waiting.length
            ? escapeHtml(waiting.join(' · ')) : 'EVERYONE'}</div>
          <div class="wd-meta">${escapeHtml(annWhen(a.at))}${
            a.byName ? ' · ' + escapeHtml(a.byName) : ''}${
            done > 0 ? ' · ' + done + ' done' : ''}</div>
        </div>`;
      };
      const draw = n => {
        bodyEl.innerHTML = `<div id="wd-fit">`
          + items.slice(pageStart, pageStart + n).map(card).join('') + `</div>`;
        return document.getElementById('wd-fit');
      };
      const overflows = fit => fit.scrollHeight > bodyEl.clientHeight - 4;

      // Pages are packed by what actually fits, not by a fixed count. Four
      // long reminders at a readable size do not fit on one screen, and
      // shrinking them until they do just makes them unreadable from across
      // the warehouse — so fewer go on the page and the rest come round on
      // the next turn.
      let count = Math.min(PER_PAGE, items.length - pageStart);
      let fit = draw(count);
      fitToScreen(fit, bodyEl, 70);
      while(overflows(fit) && count > 1){
        count--;
        fit = draw(count);
        fitToScreen(fit, bodyEl, 70);
      }
      // A single reminder long enough to overflow on its own has nowhere
      // else to go, so that one does get shrunk the rest of the way.
      if(overflows(fit)) fitToScreen(fit, bodyEl, 30);

      const end = pageStart + count;
      nextStart = end >= items.length ? 0 : end;
      dotsEl.textContent = items.length > count
        ? `${pageStart + 1}–${end} of ${items.length}` : '';
    }

    // A brand new reminder takes the whole screen for a few seconds so
    // nobody walking past can miss it, then folds into the list. A worker
    // clearing theirs gets the same treatment in green, with their name.
    function takeover(kind, title, text, who){
      clearTimeout(takeoverTimer);
      const old = el.querySelector('.wd-over');
      if(old) old.remove();
      const over = document.createElement('div');
      over.className = 'wd-over' + (kind === 'done' ? ' wd-done' : '');
      over.innerHTML = `
        <div class="wd-over-fit">
          <div class="k">${escapeHtml(title)}</div>
          <div class="t">${escapeHtml(text)}</div>
          <div class="w">${escapeHtml(who)}</div>
        </div>`;
      el.appendChild(over);
      // The takeover has to fit too — a long reminder in huge type is the
      // easiest thing on this screen to push off the bottom.
      const fit = over.querySelector('.wd-over-fit');
      if(fit) fitToScreen(fit, over, 35);
      if(kind === 'done') playParty(); else playFanfare();
      takeoverTimer = setTimeout(() => { over.remove(); paint(); }, 9000);
    }

    function onData(list){
      const live = list.filter(annIsLive);
      // Who has cleared what, so a new tick can be spotted between updates.
      const clears = [];
      list.forEach(a => {
        const by = annClearedBy(a);
        Object.keys(by).forEach(wid => {
          const key = a.id + '::' + wid;
          if(clearSeen.has(key)) return;
          clearSeen.add(key);
          if(!firstPaint) clears.push({ a, wid });
        });
      });
      items = live;
      // On the very first load everything is already old news — announcing
      // a morning's backlog one after another would be noise, not a signal.
      const fresh = items.filter(a => !seen.has(a.id));
      items.forEach(a => seen.add(a.id));
      if(firstPaint){ firstPaint = false; paint(); return; }
      if(fresh.length){
        const a = fresh[0];
        takeover('new', 'New reminder', a.text,
          (a.workerNames && a.workerNames.length) ? a.workerNames.join(' · ') : 'EVERYONE');
      } else if(clears.length){
        const { a, wid } = clears[0];
        const idx = (a.workerIds || []).indexOf(wid);
        const name = a.lastClearedBy
          || (idx > -1 && a.workerNames && a.workerNames[idx]) || 'Someone';
        takeover('done', 'Cleared', a.text, name);
      } else paint();
    }

    function tickClock(){
      const c = el.querySelector('#wd-clock');
      if(c) c.textContent = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    }
    tickClock();
    clockTimer = setInterval(tickClock, 1000);
    // Redraw every half minute so "20 min ago" keeps counting up and an
    // reminder that has aged out leaves the board. No reads.
    pageTimer = setInterval(() => {
      items = items.filter(annIsLive);
      pageStart = nextStart;
      paint();
    }, 15000);

    let wakeLock = null;
    try{
      if(navigator.wakeLock) navigator.wakeLock.request('screen')
        .then(w => { wakeLock = w; }).catch(()=>{});
    }catch(e){}
    try{ if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); }catch(e){}

    unsub = watchAnnouncements(onData);
    paint();

    function exit(){
      try{ if(unsub) unsub(); }catch(e){}
      clearInterval(clockTimer); clearInterval(pageTimer); clearTimeout(takeoverTimer);
      window.removeEventListener('keydown', onKey);
      try{ if(wakeLock) wakeLock.release(); }catch(e){}
      try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
      el.remove();
    }
    function onKey(e){ if(e.key === 'Escape') exit(); }
    window.addEventListener('keydown', onKey);
  }

    // Drawn after the rest so a slow or failed log never holds up the

    async function drawLog(){
      const host = document.getElementById('ac-log');
      if(!host) return;
      host.innerHTML = `<div class="empty">Loading…</div>`;

        host.innerHTML = `<div class="empty">${alogPage > 0
          ? 'Nothing further back.'
          : 'Nothing recorded yet. Activity is logged from the moment this build goes up.'}</div>`
          + (alogPage > 0
            ? `<div style="margin-top:10px;"><button class="btn btn-ghost btn-sm" id="ac-logprev">&lsaquo; Back</button></div>`
            : '');
        wirePager(host, false);
        return;

      host.innerHTML = shown.map(r => {
        const when = r.at ? new Date(r.at) : null;
        return `<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;">

            ? escapeHtml(when.toLocaleDateString() + ', ' + when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))
            : '—'}</div>
          <div style="flex:1;min-width:0;">
            <div>${escapeHtml(r.action || '')}${r.by
              ? ` <span style="color:var(--muted);">by ${escapeHtml(r.by)}</span>`
              : ' <span style="color:var(--muted);">by someone unrecorded</span>'}</div>
            ${r.detail ? `<div style="color:var(--muted);font-size:11.5px;">${escapeHtml(r.detail)}</div>` : ''}
          </div>
        </div>`;
      }).join('')
        + `<div style="display:flex;justify-content:space-between;align-items:center;
             gap:10px;margin-top:11px;">
            <button class="btn btn-ghost btn-sm" id="ac-logprev"
              ${alogPage === 0 ? 'disabled' : ''}>&lsaquo; Back</button>
            <span class="help" style="margin:0;">Admin and owner activity &middot;
              ${alogPage * ALOG_PAGE + 1}&ndash;${alogPage * ALOG_PAGE + shown.length}</span>
            <button class="btn btn-ghost btn-sm" id="ac-lognext"
              ${res.more ? '' : 'disabled'}>Next &rsaquo;</button>
          </div>`;
      wirePager(host, res.more);

    // Both buttons on every tab, and the page resets whenever the tab does:
    // page three of Edit is not page three of Reviews.
    function wirePager(host, more){
      const prev = host.querySelector('#ac-logprev');
      if(prev) prev.onclick = () => { if(alogPage > 0){ alogPage--; drawLog(); } };
      const next = host.querySelector('#ac-lognext');

            <div class="field" style="margin-bottom:8px;"><label>New password</label>
              <input type="password" id="acp-${id}" placeholder="At least 6 characters"></div>
            <button class="btn btn-primary btn-sm" id="acp-save-${id}">Set password</button>
            <div id="acp-msg-${id}" style="margin-top:8px;font-size:12px;"></div>

        document.getElementById('acp-save-'+id).onclick = async function(){
          const p = document.getElementById('acp-'+id).value;
          const msg = document.getElementById('acp-msg-'+id);
          if(p.length < 6){ msg.style.color='var(--red)';
            msg.textContent='Password must be at least 6 characters.'; return; }
          this.disabled = true; this.textContent = 'Saving…';
          const hash = await sha256Hex(p);
          const fresh = await getSettings();
          if(hash === fresh.adminPasswordHash
            || adminList(fresh).some(a => a && a.id !== id && a.passHash === hash)){
            this.disabled = false; this.textContent = 'Set password';
            msg.style.color='var(--red)';
            msg.textContent='That password is already in use by another account.';
            return;
          }
          const target = adminList(fresh).find(a => a && a.id === id);
          const next = adminList(fresh).map(a => a && a.id === id ? { ...a, passHash: hash } : a);
          const ok = await setSettings({ ...fresh, admins: next });
          if(ok){
            adminLog('Changed an admin password', (target && target.name) || id);
            renderAccess();
          }
          else { this.disabled = false; this.textContent = 'Set password';
            msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
        };
      };
    });
  }

  // ---- Leaderboard ----
  async function renderLeaderboard(period, group){
    period = period || 'lifetime';
    group = group || 'workers';
    const el = document.getElementById('view-leaderboard');
    el.innerHTML = `<div class="empty">Loading…</div>`;
    const [allWorkers, totals, targets, badges, archive] = await Promise.all([getWorkers(), getTotalsEnsured(), getTargets(), getBadges(), getTargetArchive()]);
    const ledger = totals ? null : await getLedger();
    if(allWorkers.length===0){
      el.innerHTML = `<div class="card"><div class="empty">No workers added yet.<br>Go to the Workers tab to add your team.</div></div>`;
      return;
    }
    const activeTargets = targets.filter(t=>t.status==='active').length;
    const achievedCount = targets.filter(t=>t.status==='achieved').length;

    // Heads and workers rank separately — a head shouldn't be competing
    // against their own juniors. Falls back to one combined board if no
    // heads have been set up yet.
    const anyHeads = allWorkers.some(w=>w.isHead);
    const workers = anyHeads
      ? allWorkers.filter(w => group==='heads' ? !!w.isHead : !w.isHead)
      : allWorkers;

    // Lifetime rank always drives badges (top3/top1), independent of whichever
    // period is currently selected — and scoped to the same group, so "#1"
    // means #1 among peers.
    const lIdx = totals ? null : buildLedgerIndex(ledger);
    const wEarned = id => totals ? ((totals.byWorker[id]||{}).earned || 0) : idxEarned(lIdx, id, null);
    const wReached = id => totals ? ((totals.byWorker[id]||{}).reachedAt || '') : idxReachedAt(lIdx, id, null);
    const wBalance = id => totals ? ((totals.byWorker[id]||{}).balance || 0) : balanceFor(ledger, id);
    const tIdx = buildTargetIndex(targets);
    const cutoff = null; // neither Lifetime nor Challenger Task is date-filtered

    const lifetimeRanked = workers.map(w=>({ id:w.id, earned: wEarned(w.id), reachedAt: wReached(w.id) })).sort((a,b)=> b.earned - a.earned || a.reachedAt.localeCompare(b.reachedAt));
    const lifetimeRankMap = {}; lifetimeRanked.forEach((w,i)=> lifetimeRankMap[w.id]=i+1);

    const periodRanked = workers.map(w=>({
      ...w,
      earnedPeriod: wEarned(w.id),
      earnedLifetime: wEarned(w.id),
      balance: wBalance(w.id),
      targetsAchieved: (tIdx[w.id] ? tIdx[w.id].achieved : 0) + archiveCountFor(archive, w.id, 'achieved'),
      sideQuestsAchieved: (tIdx[w.id] ? tIdx[w.id].sideQuests : 0) + archiveCountFor(archive, w.id, 'sideQuests'),
      lifetimeRank: lifetimeRankMap[w.id],
      reachedAtPeriod: period==='sidequest' ? idxSideQuestReachedAt(tIdx, w.id) : wReached(w.id)
    })).sort((a,b)=> period==='sidequest'
      ? (b.sideQuestsAchieved - a.sideQuestsAchieved || a.reachedAtPeriod.localeCompare(b.reachedAtPeriod))
      : (b.earnedPeriod - a.earnedPeriod || a.reachedAtPeriod.localeCompare(b.reachedAtPeriod)));
    periodRanked.forEach((w,i)=> w.periodRank = i+1);
    const top20 = periodRanked.slice(0, 20);

    const periodTargets = targets.filter(t=> t.status==='achieved' && t.achievedAt && (cutoff===null || t.achievedAt >= cutoff)).length;
    const periodTotalPts = periodRanked.reduce((s,w)=>s+w.earnedPeriod,0);
    const totalSideQuests = targets.filter(t=>t.status==='achieved' && t.sideQuestId).length;
    const periodLeader = period==='sidequest'
      ? (periodRanked[0] && periodRanked[0].sideQuestsAchieved>0 ? periodRanked[0] : null)
      : (periodRanked[0] && periodRanked[0].earnedPeriod>0 ? periodRanked[0] : null);

        <div class="week-stats">

        </div>
        ${periodLeader ? `<div class="week-leader">${periodLabel} leader: <strong>${escapeHtml(periodLeader.name)}</strong> &middot; ${period==='sidequest' ? periodLeader.sideQuestsAchieved+' completed' : periodLeader.earnedPeriod+' pts'}</div>` : `<div class="week-leader">${period==='sidequest' ? 'No challenger tasks completed yet.' : 'No points earned yet in this period.'}</div>`}
      </div>
      <div class="stat-strip">
        <div class="stat"><div class="n">${allWorkers.length}</div><div class="l">Team members</div></div>
        <div class="stat"><div class="n">${activeTargets}</div><div class="l">Active targets</div></div>
        <div class="stat"><div class="n">${achievedCount}</div><div class="l">Achieved</div></div>
      </div>
      ${anyHeads ? `
      <div class="toggle-group" id="lb-group-toggle">
        <div class="toggle-opt${group==='workers'?' selected':''}" data-group="workers" style="${group==='workers'?'border-color:var(--ink);color:var(--ink);background:var(--paper);':''}">Workers (${allWorkers.filter(w=>!w.isHead).length})</div>

      </div>` : ''}
      <div class="toggle-group" id="lb-period-toggle">
        ${PERIODS.map(p=>`<div class="toggle-opt${p.key===period?' selected':''}" data-period="${p.key}" style="${p.key===period?'border-color:var(--amber);color:var(--amber-dark);background:#FFF6E8;':''}">${p.label}</div>`).join('')}
      </div>
      <div class="eyebrow" style="margin-bottom:10px;">Top ${top20.length} &middot; ranked by ${period==='sidequest' ? 'challenger tasks completed' : periodLabel.toLowerCase()+' points'}</div>
      <div id="lb-list"></div>
      <div class="card" style="margin-top:16px;">
        <div class="eyebrow" style="margin-bottom:6px;">Worker access</div>
        <div class="help">Share this link so workers can view their targets and submit proof photos:
          <span class="mono" id="worker-link">${escapeHtml(workerPortalUrl())}</span>
          <button class="btn btn-ghost btn-sm" id="copy-worker-link" style="margin-left:6px;padding:3px 9px;font-size:11px;">Copy</button>
          <br>They can add it to their home screen straight from there and the icon opens
          their own list. This admin side is the same address with
          <span class="mono">#admin</span> on the end — keep that one to yourself.</div>
      </div>
    `;
    document.querySelectorAll('#lb-period-toggle [data-period]').forEach(opt=>{
      opt.onclick = ()=> renderLeaderboard(opt.dataset.period, group);
    });
    document.querySelectorAll('#lb-group-toggle [data-group]').forEach(opt=>{
      opt.onclick = ()=> renderLeaderboard(period, opt.dataset.group);
    });
    if(top20.length===0){
      document.getElementById('lb-list').innerHTML = `<div class="card"><div class="empty">Nobody in this group yet.</div></div>`;
      return;
    }
    document.getElementById('lb-list').innerHTML = top20.map((w)=>{
      const medalClass = w.periodRank===1?'medal-1':w.periodRank===2?'medal-2':w.periodRank===3?'medal-3':'medal-n';
      const medalContent = w.periodRank<=3 ? '&#9733;' : w.periodRank;
      const topBadge = highestBadge({ earned: w.earnedLifetime, targetsAchieved: w.targetsAchieved, sideQuestsAchieved: w.sideQuestsAchieved, rank: w.lifetimeRank }, badges);
      const rowAvatar = avatarInfoFor(w.earnedLifetime);
      return `
        <div class="rank-row">
          <div class="rank-medal ${medalClass}">${medalContent}</div>
          <div class="rank-info">
            <div class="rank-name">${rowAvatar.emoji} ${escapeHtml(w.name)} <span style="color:var(--muted);font-size:10.5px;font-weight:400;">Lv.${rowAvatar.level}</span></div>
            <div class="rank-role">${escapeHtml(w.role||'')}</div>
            ${topBadge ? `<div class="rank-badges"><span class="em" title="${escapeHtml(topBadge.label)}">${topBadge.emoji}</span></div>` : ''}
          </div>
          ${period==='sidequest'
            ? `<div class="rank-points"><div class="n">${w.sideQuestsAchieved}</div><div class="l">completed</div></div>`
            : `<div class="rank-points"><div class="n">${w.earnedPeriod}</div><div class="l">pts &middot; ${w.balance} bal.</div></div>`}
        </div>`;
    }).join('');
  }

          <div class="field" style="margin-bottom:0;"><input type="text" id="role-new-name" placeholder="e.g. Customer Service Executive"></div>

        </div>
        <div id="role-msg" style="margin-top:8px;font-size:12.5px;"></div>

        <div id="role-list" style="margin-top:10px;"></div>
      </div>
      <div class="toprow"><h2>Team roster</h2></div>

    document.getElementById('w-joined').value = todayStr();

    };
    document.getElementById('reset-season-btn').onclick = async function(){
      if(!confirm('This permanently wipes all worker points and task history. This cannot be undone. Continue?')) return;
      this.disabled = true; this.textContent = 'Resetting…';
      const msg = document.getElementById('reset-season-msg');
      const ok = await resetSeason();
      if(ok){
        msg.style.color='var(--green)'; msg.textContent = 'Season reset complete — points and task history are cleared.';
        document.getElementById('reset-confirm-input').value = '';
        this.textContent = 'Reset Season';
      } else {
        this.disabled = false; this.textContent = 'Reset Season';
        msg.style.color='var(--red)'; msg.textContent = 'Something went wrong partway through — check your connection and try again.';
      }
    };

    let employmentType = 'fulltime';
    const empFulltimeBtn = document.getElementById('w-emp-fulltime');
    const empParttimeBtn = document.getElementById('w-emp-parttime');
    const empContractBtn = document.getElementById('w-emp-contract');
    const SEL = 'border-color:var(--green);color:var(--green);background:rgba(31,157,107,0.06);';
    function setEmploymentType(type){
      employmentType = type;
      empFulltimeBtn.setAttribute('style', type==='fulltime' ? SEL : '');
      empParttimeBtn.setAttribute('style', type==='parttime' ? SEL : '');
      empContractBtn.setAttribute('style', type==='contract' ? SEL : '');
    }
    empFulltimeBtn.onclick = () => setEmploymentType('fulltime');
    empParttimeBtn.onclick = () => setEmploymentType('parttime');
    empContractBtn.onclick = () => setEmploymentType('contract');

    document.getElementById('w-add').onclick = async function(){
      const name = document.getElementById('w-name').value.trim();
      const role = document.getElementById('w-role').value;
      const joined = document.getElementById('w-joined').value || todayStr();
      const isHead = document.getElementById('w-is-head').checked;
      const reportsTo = document.getElementById('w-reports-to').value || null;
      let password = document.getElementById('w-pass').value.trim();
      const msg = document.getElementById('w-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Please enter a name.'; return; }
      if(!password) password = genPin();
      this.disabled = true; this.textContent = 'Adding…';
      const passwordHash = await sha256Hex(password);
      const workers = await getWorkers();
      workers.push({id: uid(), name, role, employmentType, passwordHash, joined, isHead, reportsTo});
      adminLog('Added a worker', name + ' · ' + role);
      const ok = await setList(K_WORKERS, workers);
      this.disabled = false; this.textContent = 'Add Worker';
      if(ok){
        msg.style.color='var(--green)'; msg.textContent = `Added — PIN is ${password}. Write this down now — it won't be shown again.`;

        // Re-render so a newly-added head immediately appears in the
        // "Reports to" dropdown for the next worker.

        const freshMsg = document.getElementById('w-msg');
        if(freshMsg){ freshMsg.style.color='var(--green)'; freshMsg.textContent = savedMsg; }
      } else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
    };
    document.getElementById('role-add').onclick = async function(){
      const name = document.getElementById('role-new-name').value.trim();
      const msg = document.getElementById('role-msg');
      if(!name){ msg.style.color='var(--red)'; msg.textContent='Please enter a role name.'; return; }
      this.disabled = true; this.textContent = 'Adding…';
      const ok = await addRole(name);
      this.disabled = false; this.textContent = 'Add Role';
      if(ok){
        document.getElementById('role-new-name').value='';
        msg.style.color='var(--green)'; msg.textContent = `"${name}" added.`;
        drawRolesList();
      } else {
        msg.style.color='var(--red)'; msg.textContent = 'That role already exists, or could not save — try again.';
      }
    };
    await drawRolesList();
    document.getElementById('role-search').oninput = () => drawRolesList();
    await drawWorkerList();
    document.getElementById('w-search').oninput = () => drawWorkerList();
  }
  async function drawRolesList(){
    const el = document.getElementById('role-list');
    if(!el) return;
    const [allRoles, workers] = await Promise.all([getRoles(), getWorkers()]);
    const query = (document.getElementById('role-search').value || '').trim().toLowerCase();
    const roles = query ? allRoles.filter(r=>r.toLowerCase().includes(query)) : allRoles;
    if(roles.length===0){ el.innerHTML = `<div class="help" style="margin-bottom:0;">No roles match "${escapeHtml(query)}".</div>`; return; }
    const countByRole = {};
    workers.forEach(w=>{ countByRole[w.role] = (countByRole[w.role]||0) + 1; });
    el.innerHTML = roles.map(r=>{
      const isDefault = DEFAULT_ROLES.includes(r);
      const isProtected = r === 'Other';
      const count = countByRole[r] || 0;
      return `
        <div style="padding:9px 0;border-top:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-size:13px;">${escapeHtml(r)} <span style="color:var(--muted);font-size:11px;">${count} worker${count===1?'':'s'}${isDefault ? ' · built-in' : ''}</span></div>
            ${!isProtected ? `
              <div style="display:flex;gap:6px;">
                <button class="btn btn-ghost btn-sm" data-role-edit="${escapeHtml(r)}" style="padding:4px 9px;">Edit</button>
                <button class="btn btn-ghost btn-sm" data-role-remove="${escapeHtml(r)}" style="padding:4px 9px;">Remove</button>
              </div>` : ''}
          </div>
          <div id="role-edit-form-${escapeHtml(r).replace(/[^a-zA-Z0-9]/g,'_')}"></div>
        </div>`;
    }).join('');

    el.querySelectorAll('[data-role-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const name = btn.dataset.roleRemove;
        if(!confirm(`Remove the role "${name}"? This only works if no worker currently has it.`)) return;
        const result = await removeRole(name);
        if(result.ok){ drawRolesList(); }
        else if(result.reason==='in-use'){ alert(`Can't remove "${name}" — ${result.count} worker${result.count===1?'':'s'} still ${result.count===1?'has':'have'} this role. Reassign them first in Edit Details.`); }
        else { alert('Could not remove that role — try again.'); }
      };
    });
    el.querySelectorAll('[data-role-edit]').forEach(btn=>{
      btn.onclick = ()=>{
        const oldName = btn.dataset.roleEdit;
        const safeId = oldName.replace(/[^a-zA-Z0-9]/g,'_');
        const host = document.getElementById('role-edit-form-'+safeId);
        if(host.innerHTML){ host.innerHTML = ''; return; }
        host.innerHTML = `
          <div style="margin-top:8px;padding:10px;background:var(--paper);border-radius:8px;display:flex;gap:8px;">
            <input type="text" id="role-edit-input-${safeId}" value="${escapeHtml(oldName)}" style="flex:1;">
            <button class="btn btn-primary btn-sm" data-role-save="${escapeHtml(oldName)}" style="white-space:nowrap;">Save</button>
          </div>`;
        host.querySelector('[data-role-save]').onclick = async function(){
          const newName = document.getElementById('role-edit-input-'+safeId).value.trim();
          if(!newName || newName===oldName){ host.innerHTML = ''; return; }
          this.disabled = true; this.textContent = 'Saving…';
          const result = await renameRole(oldName, newName);
          if(result.ok){ drawRolesList(); }
          else {
            this.disabled = false; this.textContent = 'Save';
            alert(result.reason==='duplicate' ? 'That role name already exists.' : 'Could not rename — try again.');
          }
        };
      };
    });
  }

              <button class="btn btn-ghost btn-sm" data-delete-worker-cancel="${workerId}">Cancel</button>
            </div>
          </div>`;

                  style="${modeOf(w)===MODE_DOLIST?'border-color:var(--ink);color:var(--ink);background:var(--paper);':''}">Do list</div>
              </div>

            <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:10px;cursor:pointer;">

            </label>
            <div class="field" style="margin-bottom:8px;">
              <label>Reports to</label>
              <select id="ew-reports-to-${workerId}">
                <option value="">No head assigned (admin reviews their work)</option>
                ${allWorkers.filter(h=>h.isHead && h.id!==workerId).map(h=>`<option value="${h.id}" ${w.reportsTo===h.id?'selected':''}>${escapeHtml(h.name)}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="margin-bottom:8px;">
              <label>Approved by</label>
              <select id="ew-approver-${workerId}">
                <option value="">Nobody in particular — any admin</option>
                ${ADMIN_ACCOUNTS.map(a=>`<option value="${a.id}" ${
                  (w.approverAdminId||'')===a.id?'selected':''}>${escapeHtml(a.name)}${
                  a.isOwner?' — owner':''}</option>`).join('')}

              <button class="btn btn-primary btn-sm" data-ew-save="${workerId}">Save Changes</button>

          </div>`;
        let selectedMode = modeOf(w);

            selectedMode = opt.dataset.mode;

              o.setAttribute('style', o.dataset.mode===selectedMode
                ? 'border-color:var(--ink);color:var(--ink);background:var(--paper);' : '');
            });
          };
        });
        let selectedEmp = emp;
        host.querySelectorAll(`#ew-emp-${workerId} .toggle-opt`).forEach(opt=>{
          opt.onclick = ()=>{
            selectedEmp = opt.dataset.emp;
            host.querySelectorAll(`#ew-emp-${workerId} .toggle-opt`).forEach(o=>{
              o.setAttribute('style', o.dataset.emp===selectedEmp ? 'border-color:var(--green);color:var(--green);background:rgba(31,157,107,0.06);' : '');
            });
          };
        });
        host.querySelector('[data-ew-save]').onclick = async function(){
          const newName = document.getElementById('ew-name-'+workerId).value.trim();
          const newRole = document.getElementById('ew-role-'+workerId).value;
          const newJoined = document.getElementById('ew-joined-'+workerId).value || w.joined;
          const newIsHead = document.getElementById('ew-is-head-'+workerId).checked;
          const newReportsTo = document.getElementById('ew-reports-to-'+workerId).value || null;
          const newApprover = document.getElementById('ew-approver-'+workerId).value || null;
          const newMode = selectedMode;
          const msg = document.getElementById('ew-msg-'+workerId);
          if(!newName){ msg.style.color='var(--red)'; msg.textContent='Name is required.'; return; }
          this.disabled = true; this.textContent = 'Saving…';
          const all = await getWorkers();
          const idx = all.findIndex(x=>x.id===workerId);
          if(idx>-1){
            const wasHead = all[idx].isHead;
            // A change of position is kept, not just applied. A season score
            // spans whatever roles someone held during it, and the figures
            // mean something quite different either side of a move — new
            // tasks, a different volume, a fresh start at a job they have
            // not done before. Until now the old role was simply
            // overwritten and the report had no way to say so.
            const oldRole = all[idx].role;
            if(oldRole && newRole && oldRole !== newRole){
              all[idx].roleHistory = (all[idx].roleHistory || []).concat([
                // Was `(ME && ME.name)`, an identifier this file never
                // declares — so reading it threw a ReferenceError and took
                // the whole save down with it, silently, but only on the
                // edits that changed a role. Now that admins have names,
                // there is a real one to record.
                { from: oldRole, to: newRole, at: new Date().toISOString(),
                  on: todayStr(), by: currentAdminName() }
              ]);
            }
            all[idx].name = newName; all[idx].role = newRole;
            all[idx].employmentType = selectedEmp; all[idx].joined = newJoined;
            all[idx].isHead = newIsHead; all[idx].reportsTo = newReportsTo;
            all[idx].approverAdminId = newApprover;
            const oldMode = modeOf(all[idx]);
            all[idx].taskMode = newMode;
            adminLog('Edited a worker', newName
              + (oldRole && newRole && oldRole !== newRole ? ' · ' + oldRole + ' → ' + newRole : '')
              + (oldMode !== newMode ? ' · ' + (newMode === MODE_DOLIST
                  ? 'switched to Do list' : 'switched to one by one') : ''));
            // If someone stops being a head, anyone reporting to them would be
            // left pointing at a non-head — clear those so their submissions
            // fall back to admin review rather than disappearing into limbo.
            if(wasHead && !newIsHead){
              all.forEach(x=>{ if(x.reportsTo===workerId) x.reportsTo = null; });
            }
            await setList(K_WORKERS, all);
          }
          drawWorkerList();
        };
        host.querySelector('[data-ew-cancel]').onclick = ()=>{ host.innerHTML = ''; };
      };
    });
    listEl.querySelectorAll('[data-reset-pin]').forEach(btn=>{

        host.innerHTML = `

            <button class="btn btn-primary btn-sm" data-reset-confirm="${workerId}">Set New PIN</button>
          </div>`;
        document.getElementById('reset-form-'+workerId).querySelector('[data-reset-confirm]').onclick = async function(){
          let newPin = document.getElementById('reset-pin-input-'+workerId).value.trim();
          if(!newPin) newPin = genPin();
          this.disabled = true; this.textContent = 'Saving…';
          const passwordHash = await sha256Hex(newPin);
          const all = await getWorkers();
          const idx = all.findIndex(x=>x.id===workerId);
          if(idx>-1){ all[idx].passwordHash = passwordHash; await setList(K_WORKERS, all); }
          const msgEl = document.getElementById('reset-msg-'+workerId);
          msgEl.style.color = 'var(--green)';
          msgEl.textContent = `New PIN is ${newPin} — write it down now, it won't be shown again.`;
          host.innerHTML = '';
        };
      };
    });
  }

    document.getElementById('holiday-add').onclick = async function(){
      const date = document.getElementById('holiday-date').value;
      const selectedRoles = [...document.querySelectorAll('.holiday-role-cb:checked')].map(cb=>cb.value);
      const selectedWorkers = [...document.querySelectorAll('.holiday-worker-cb:checked')].map(cb=>cb.value);
      const msg = document.getElementById('holiday-msg');
      if(!date){ msg.style.color='var(--red)'; msg.textContent='Please pick a date.'; return; }
      if(selectedRoles.length===0 && selectedWorkers.length===0){ msg.style.color='var(--red)'; msg.textContent='Select at least one role or person.'; return; }
      this.disabled = true; this.textContent = 'Adding…';
      const closures = await getHolidayClosures();
      closures.push({ id: uid(), date, roles: selectedRoles, workerIds: selectedWorkers, createdAt: new Date().toISOString() });
      const ok = await setList(K_HOLIDAY_CLOSURES, closures);
      if(ok){
        // Backdated closure: an admin often only remembers to mark the holiday
        // after the fact, by which point workers have already been failed for
        // tasks on a day the office was shut. Clear those retroactively rather
        // than making them appeal it one by one.
        let cleared = 0;
        let clearedActive = 0;
        try{
          const [fails, allWorkers, targets, pendingSubs] = await Promise.all([getFails(), getWorkers(), getTargets(), getPendingSubs()]);
          const roleSet = new Set(selectedRoles);
          const workerSet = new Set(selectedWorkers);
          const roleById = {}; allWorkers.forEach(w=>{ roleById[w.id] = w.role; });
          const isClosedFor = id => workerSet.has(id) || roleSet.has(roleById[id]);
          const pendingTargetIds = pendingTargetIdSet(pendingSubs);
          const matches = f => {
            if(!isClosedFor(f.workerId)) return false;
            if(f.type === 'sidequest') return false; // challenger tasks are opt-in, not affected by a closure
            // Prefer the task's own date; older records predate that field, so
            // fall back to the day the fail was recorded.
            const d = f.taskDate || String(f.failedAt || '').slice(0,10);
            return d === date;
          };
          const keptFails = fails.filter(f=>!matches(f));
          cleared = fails.length - keptFails.length;
          if(cleared > 0){
            await setFailsAndCounts(keptFails);
            await recomputeAndPublishScores();
          }

          // Clear out that date's tasks so workers aren't left holding items
          // for a day the office was shut. Covers two cases: ones already
          // marked failed, and ones still sitting active (a closure added
          // mid-day, before the list had even closed).
          const dropIds = [];
          targets.forEach(t=>{
            if(t.sideQuestId) return;                           // challenger tasks are opt-in
            if(t.isWeekly) return;                              // a weekly spans the week; one closed day shouldn't void it
            if(!isClosedFor(t.workerId)) return;
            if(t.createdAt !== date) return;
            if(t.status === 'achieved') return;                 // already approved — points earned, leave it
            if(pendingTargetIds.has(t.id)) return;              // awaiting review — let the admin decide
            if(t.status === 'active') clearedActive++;
            dropIds.push(t.id);                                 // drop active + failed for that date
          });
          if(dropIds.length) await applyTargetDeltas({ removeIds: dropIds });
        }catch(e){
          console.error('Could not clear fails for backdated closure:', e);
        }

        document.getElementById('holiday-date').value = '';
        document.querySelectorAll('.holiday-role-cb').forEach(cb=>cb.checked=false);
        document.querySelectorAll('.holiday-worker-cb').forEach(cb=>cb.checked=false);
        msg.style.color='var(--green)';
        const bits = [];
        if(clearedActive > 0) bits.push(`removed ${clearedActive} active task${clearedActive===1?'':'s'}`);
        if(cleared > 0) bits.push(`cleared ${cleared} fail${cleared===1?'':'s'}`);
        msg.textContent = bits.length
          ? `Closure added — also ${bits.join(' and ')} for that date.`
          : 'Closure added.';
        drawHolidayClosuresList();
      } else { msg.style.color='var(--red)'; msg.textContent='Could not save — try again.'; }
      this.disabled = false; this.textContent = 'Add Closure';
    };
    await drawHolidayClosuresList();
  }
  async function drawHolidayClosuresList(){
    const el = document.getElementById('holiday-list');
    if(!el) return;
    const [closures, closureWorkers] = await Promise.all([getHolidayClosures(), getWorkers()]);
    const nameById = {}; closureWorkers.forEach(w=>{ nameById[w.id] = w.name; });
    if(closures.length===0){ el.innerHTML = `<div class="help" style="margin-bottom:0;">No closures set.</div>`; return; }
    const today = todayStr();
    // Show upcoming/today's closures first (most relevant), then past ones,
    // capped at 10 total so a long history doesn't crowd out the rest of the tab.
    const upcoming = closures.filter(c=>c.date >= today).sort((a,b)=> a.date.localeCompare(b.date));
    const past = closures.filter(c=>c.date < today).sort((a,b)=> b.date.localeCompare(a.date));
    const ordered = upcoming.concat(past);
    const sorted = ordered.slice(0, 10);
    const hiddenCount = ordered.length - sorted.length;
    el.innerHTML = sorted.map(c=>{
      const isPast = c.date < today;
      return `
        <div class="ledger-row" style="${isPast ? 'opacity:0.5;' : ''}">
          <div class="ledger-note">${c.date}${isPast ? ' (past)' : ''} &middot; ${
            [ ...(c.roles||[]).map(escapeHtml),
              ...(c.workerIds||[]).map(id=>escapeHtml(nameById[id] || 'removed worker'))
            ].join(', ') || 'nobody'
          }</div>
          <button class="btn btn-ghost btn-sm" data-holiday-remove="${c.id}" style="padding:4px 9px;">Remove</button>
        </div>`;
    }).join('') + (hiddenCount>0 ? `<div class="help" style="margin-top:8px;margin-bottom:0;">${hiddenCount} older closure${hiddenCount===1?'':'s'} hidden.</div>` : '');
    el.querySelectorAll('[data-holiday-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const all = await getHolidayClosures();
        await setList(K_HOLIDAY_CLOSURES, all.filter(c=>c.id!==btn.dataset.holidayRemove));
        drawHolidayClosuresList();
      };
    });
  }

          this.disabled = true; this.textContent = 'Saving…';
          const all = await getRoleTemplates();
          const idx = all.findIndex(x=>x.id===templateId);
          if(idx>-1){
            all[idx].title = newTitle; all[idx].points = newPoints; all[idx].requiresPhoto = newRequiresPhoto;
            all[idx].titleMs = newMs;
            await setList(K_ROLE_TEMPLATES, all);
            // Push the change live: update any already-generated task instances
            // tied to this template so workers see the new title/points right
            // away, instead of only from tomorrow's generation. This includes
            // ones with a submission still awaiting review — the edit needs to
            // reach them before approval, or they'd be awarded the old points.
            // Already-approved and failed copies are deliberately left alone:
            // those points are banked, and rewriting them would change history.
            const targets = await getTargets();
            const fieldChanges = {};
            targets.forEach(t=>{
              if(t.templateId===templateId && t.status==='active'){
                fieldChanges[t.id] = { title: newTitle, points: newPoints,
                  requiresPhoto: newRequiresPhoto };
              }
            });
            if(Object.keys(fieldChanges).length) await applyTargetDeltas({ fieldChanges });
          }
          drawRoleTemplateList(filterRole);
        };
        host.querySelector('[data-rt-cancel]').onclick = ()=>{ host.innerHTML = ''; };
      };
    });
  }
  async function drawTargetList(filterId, workers){
    const listEl = document.getElementById('t-list');
    const [targets, subs] = await Promise.all([getTargets(), getPendingSubs()]);
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    // Achieved tasks are hidden here — this list is for what still needs
    // attention (active, awaiting review, or failed), not a completion archive.
    const notAchieved = targets.filter(t=>t.status!=='achieved');
    const filtered = filterId==='all' ? notAchieved : notAchieved.filter(t=>t.workerId===filterId);
    const statusWeight = { active:0, failed:1 };
    const sorted = filtered.slice().sort((a,b)=>{
      const wA = statusWeight[a.status] ?? 0, wB = statusWeight[b.status] ?? 0;
      if(wA!==wB) return wA-wB;
      return b.createdAt.localeCompare(a.createdAt);
    });
    if(sorted.length===0){ listEl.innerHTML = `<div class="card"><div class="empty">No outstanding targets.</div></div>`; return; }
    listEl.innerHTML = `<div class="card">` + sorted.map(t=>{
      const w = workerMap[t.workerId];
      const pending = subs.find(s=>s.targetId===t.id && s.status==='pending');
      let badge = '';
      if(t.status==='achieved') badge = '<span class="badge badge-achieved">Achieved</span>';
      else if(t.status==='failed') badge = `<span class="badge badge-rejected">${failKindLabel(t.failKind)}</span>`;
      else if(pending) badge = '<span class="badge badge-pending">Awaiting review</span>';
      return `
        <div class="target-item">
          <div class="target-top">
            <div><div class="target-title">${escapeHtml(t.title)}</div>
            <div class="target-meta">${w?escapeHtml(w.name):'—'} &middot; ${t.period}${
              t.isRevived ? ' &middot; <span style="color:var(--amber-dark);font-weight:600;">Make-up task</span>' : ''
            } ${badge?'&middot; '+badge:''}</div></div>
            <div class="target-pts">+${t.points} pts</div>
          </div>
          ${t.status==='active' && !pending ? `<div class="target-actions">
            <button class="btn btn-amber btn-sm" data-achieve="${t.id}">Mark Achieved</button>
            <button class="btn btn-ghost btn-sm" data-remove="${t.id}">Remove</button></div>` : ''}
        </div>`;
    }).join('') + `</div>`;
    listEl.querySelectorAll('[data-achieve]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.disabled = true; btn.textContent='Saving…';
        await approveTarget(btn.dataset.achieve, null);
        drawTargetList(document.getElementById('t-filter').value, workers);
      };
    });
    listEl.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.onclick = async ()=>{
        const targets = await getTargets();
        const target = targets.find(x=>x.id===btn.dataset.remove);
        const w2 = target && workers.find(x => x.id === target.workerId);
        // Remove does two quite different things and the button does not say
        // which. On a template-backed daily it also stops that task being
        // assigned to this worker ever again; on a make-up or one-off task it
        // simply deletes the one copy. Worth asking before the permanent one.
        if(target && target.isDaily && target.templateId){
          if(!confirm('Remove "' + target.title + '" from '
            + ((w2 && w2.name) || 'this worker') + '?\n\n'
            + 'It will also stop being assigned to them each day from now on. '
            + 'Other workers are not affected. You can put it back under '
            + 'Dismissed daily tasks.')) return;
        }
        if(target && target.isDaily && target.templateId){
          const dismissed = await getDismissed();
          dismissed.push({ workerId: target.workerId, templateId: target.templateId, removedAt: todayStr() });
          await setList(K_DISMISSED, dismissed);
        }
        await applyTargetDeltas({ removeIds: [btn.dataset.remove] });
        drawTargetList(document.getElementById('t-filter').value, workers);
      };
    });
  }

  // Returns true only when the approval fully landed — the caller uses this
  // to decide whether to clear the card, so a failed approval stays visible
  // instead of looking like it worked.
  async function approveTarget(targetId, submissionId, remark){
    const targets = await getTargets();
    const idx = targets.findIndex(x=>x.id===targetId);
    if(idx===-1) return false;
    const t = targets[idx];

    // If this target was already approved (e.g. a duplicate submission slipped
    // through from a stale page), just close out this submission — awarding
    // the points a second time would silently inflate their balance.
    if(t.status === 'achieved'){
      if(submissionId){
        await updateSub(submissionId, { status:'approved', reviewedAt: new Date().toISOString(), duplicateOf: t.id, reviewRemark: remark || null }, t.workerId);
      }
      return true;   // already approved — the submission is closed out
    }

    t.status = 'achieved'; t.achievedAt = todayStr();
    // Started now rather than after the target is marked. Reading when the
    // worker submitted has nothing to do with updating the target, so the
    // two were costing two round trips in a row for no reason — and
    // approving is the thing an admin does dozens of times in a sitting.
    const subTimeP = submissionId
      ? db.collection(SUBS_COLLECTION).doc(submissionId).get()
          .catch(e => { console.error('Could not read submission time:', e); return null; })
      : null;
    // Merge, so a page that started generating before this approval can't
    // write the old 'active' status back over it.
    await applyTargetDeltas({ statusChanges: { [targetId]: { status:'achieved', achievedAt: todayStr() } } });

    // Stamp the ledger entry with when the WORKER submitted, not when this
    // approval happened — leaderboard ties are broken by who got there first,
    // and that should reflect their effort, not how quickly a reviewer
    // happened to get around to it. Falls back to now for anything approved
    // without a submission attached (e.g. admin awarding directly).
    let earnedAt = new Date().toISOString();
    if(subTimeP){
      // Already in flight since before the target was marked; this just
      // collects it.
      const subDoc = await subTimeP;
      if(subDoc && subDoc.exists && subDoc.data().submittedAt) earnedAt = subDoc.data().submittedAt;
    }

    // If the award fails, roll the task back rather than leaving it marked
    // approved with no points — a silent mismatch is far harder to spot than
    // an approval that visibly didn't take.
    const awarded = await appendLedger([{id: uid(), workerId: t.workerId, type:'earned', points: t.points, note: t.title, date: todayStr(), at: earnedAt }]);
    if(!awarded){
      await applyTargetDeltas({ statusChanges: { [targetId]: { status:'active', achievedAt: null } } });
      showFbError('Points could not be saved, so this approval was undone. Try approving again.');
      return false;
    }
    if(submissionId){
      await updateSub(submissionId, { status:'approved', reviewedAt: new Date().toISOString(), reviewRemark: remark || null }, t.workerId);
    }

    // A task can be failed at its deadline and then approved afterwards, when
    // the submission was already waiting for review. Without clearing the fail
    // record the worker keeps seeing it under Missed tasks even though it was
    // accepted — and it still counts against their score.
    try{
      const fails = await getFails();
      const kept = fails.filter(f => f.targetId !== targetId);
      if(kept.length !== fails.length){
        await setFailsAndCounts(kept);
        await recomputeAndPublishScores();
      }
    }catch(e){ console.error('Could not clear fail after approval:', e); }

    return true;
  }

  // Approving a whole day. The same shape as approveTarget, with two
  // differences that matter: every job on the list is marked at once, and
  // the day is worth ONE flat amount rather than the sum of its jobs — a
  // ten-job list is not worth more than a three-job one, so nobody is worse
  // off for being given more to do.
  async function approveDoListDay(sub, remark){
    const targets = await getTargets();
    const ids = (sub.targetIds || []).filter(Boolean);
    const mine = targets.filter(t => ids.indexOf(t.id) > -1);
    // Anything already approved is left alone, so a second approval from a
    // stale page cannot pay for the same day twice.
    const toMark = mine.filter(t => t.status !== 'achieved');
    const alreadyPaid = mine.length > 0 && toMark.length === 0;

    const day = todayStr();
    if(toMark.length){
      const statusChanges = {};
      toMark.forEach(t => { statusChanges[t.id] = { status:'achieved', achievedAt: day }; });
      const ok = await applyTargetDeltas({ statusChanges });
      if(!ok){
        showFbError('The day could not be marked — nothing was changed.');
        return false;
      }
    }

    if(!alreadyPaid){
      const pts = await getDoListPoints();
      // Stamped with when the worker sent the day up, not when it was
      // looked at: ties on the leaderboard should turn on their effort.
      const earnedAt = sub.submittedAt || new Date().toISOString();
      // The id is worked out from the person and the day, not minted fresh.
      // appendLedger ignores an entry whose id is already there, so a day
      // pays exactly once however many times it is approved — which it can
      // be, if a one-off job is added after the first approval and the day
      // is sent up again.
      const awarded = pts > 0 ? await appendLedger([{
        id: 'dolist_' + sub.workerId + '_' + (sub.dayDate || day),
        workerId: sub.workerId, type:'earned', points: pts,
        note: 'Do list — ' + (sub.dayDate || day), date: day, at: earnedAt }]) : true;
      if(!awarded){
        // Roll the day back rather than leave it approved and unpaid.
        const back = {};
        toMark.forEach(t => { back[t.id] = { status:'active', achievedAt: null }; });
        if(toMark.length) await applyTargetDeltas({ statusChanges: back });
        showFbError('Points could not be saved, so this approval was undone. Try again.');
        return false;
      }
    }

    await updateSub(sub.id, { status:'approved', reviewedAt: new Date().toISOString(),
      reviewRemark: remark || null }, sub.workerId);

    // A day can close at 5am while it is still sitting with a head. Clearing
    // the fails those jobs picked up is the same courtesy a single task gets
    // when it is approved after its deadline.
    try{
      const fails = await getFails();
      const kept = fails.filter(f => ids.indexOf(f.targetId) === -1);
      if(kept.length !== fails.length){
        await setFailsAndCounts(kept);
        await recomputeAndPublishScores();
      }
    }catch(e){ console.error('Could not clear fails after approving the day:', e); }
    return true;
  }

  // Sending a day back. Nothing is marked and nothing is paid; the jobs stay
  // open so they can be fixed and sent up again before the list closes.
  async function rejectDoListDay(sub, remark){
    await updateSub(sub.id, { status:'rejected', reviewedAt: new Date().toISOString(),
      reviewRemark: remark || null, reviewedBy: currentAdminName()
        || (REVIEWING_HEAD && REVIEWING_HEAD.name) || '' }, sub.workerId);
    return true;
  }

  // ---- Review ----
  // Which queue the Review tab is showing: 'unassigned', or 'head:<id>'.
  // Kept across redraws, because the list rebuilds itself every time a card
  // is cleared and losing your place after each approval is maddening.
  // Which queue the Review tab is showing. Defaults to whichever one the
  // signed-in admin is responsible for, settled once the list is built.
  let reviewScope = 'mine';
  async function renderReview(){
    const el = document.getElementById('view-review');
    el.innerHTML = `<div class="empty">Loading…</div>`;
    const [subs, workers, targets, dayPts] = await Promise.all([
      getPendingSubs(), getWorkers(), getTargets(), getDoListPoints()]);
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    const targetMap = {}; targets.forEach(t=>targetMap[t.id]=t);
    const allPending = subs.filter(s=>s.status==='pending').sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt));

    if(allPending.length===0){
      el.innerHTML = `<div class="card"><div class="empty">No submissions awaiting review.<br>Photo proofs from workers will appear here.</div></div>`;
      return;
    }

    // Submissions from workers who report to a head are that head's to
    // review. One queue per head, rather than one pile of everyone's: a
    // combined list could only ever be scrolled past, while "what is waiting
    // on Jessica" is a question with an answer and someone to ask.
    const headOf = s => {
      // Challenger tasks and after-hours help belong to an admin whoever the
      // worker reports to, so they fall through to the admin routing below
      // rather than sitting in a head's queue nobody will action.
      if(adminOnlySub(s, targetMap[s.targetId])) return null;
      const w = workerMap[s.workerId];
      const h = w && w.reportsTo ? workerMap[w.reportsTo] : null;
      return (h && h.isHead) ? h : null;
    };
    // A head always wins. The admin routing on a worker is only consulted
    // when nobody is above them, which is what makes it safe to leave set
    // on someone who later gets a head.
    const approverOf = s => {
      if(headOf(s)) return null;
      const w = workerMap[s.workerId];
      const id = (w && w.approverAdminId) || '';
      return ADMIN_ACCOUNTS.some(a => a.id === id) ? id : '';
    };
    const meId = (CURRENT_ADMIN && CURRENT_ADMIN.id) || '';
    // Challenger tasks and after-hours help get a queue of their own rather
    // than being folded into "nobody assigned". The per-worker admin routing
    // is deliberately NOT consulted for them: that field means "who approves
    // this person while they have no head", which is a different question
    // from who signs off discretionary work.
    const questSubs = allPending.filter(s => isChallengerEntry(s, targetMap[s.targetId]));
    const ahSubs    = allPending.filter(s => isAfterHoursEntry(s, targetMap[s.targetId]));
    const adminOnlyIds = new Set(questSubs.concat(ahSubs).map(s => s.id));
    const headless = allPending.filter(s => !headOf(s) && !adminOnlyIds.has(s.id));
    const mine     = headless.filter(s => approverOf(s) === meId && meId);
    const nobodys  = headless.filter(s => !approverOf(s));

    const byAdmin = new Map();
    headless.forEach(s => {
      const id = approverOf(s);
      if(!id || id === meId) return;      // mine and nobody's have their own entries
      if(!byAdmin.has(id)) byAdmin.set(id, []);
      byAdmin.get(id).push(s);
    });
    const byHead = new Map();
    allPending.forEach(s => {
      const h = headOf(s);
      if(!h) return;
      if(!byHead.has(h.id)) byHead.set(h.id, { head: h, subs: [] });
      byHead.get(h.id).subs.push(s);
    });

    // Only queues with something waiting are listed — an empty one is not a
    // thing to pick, and the list stays as short as the work demands. Your
    // own comes first, then the pile nobody owns, then other people's.
    const scopes = []
      .concat(questSubs.length ? [{ key:'quests', subs: questSubs,
        label: `Challenger tasks — admin only (${questSubs.length})` }] : [])
      .concat(ahSubs.length ? [{ key:'afterhours', subs: ahSubs,
        label: `After-hours help — admin only (${ahSubs.length})` }] : [])
      .concat(mine.length ? [{ key:'mine', subs: mine,
        label: `Only mine — routed to you (${mine.length})` }] : [])
      .concat(nobodys.length ? [{ key:'nobody', subs: nobodys,
        label: `Nobody assigned (${nobodys.length})` }] : [])
      .concat([...byAdmin.entries()]
        .map(([id, subs]) => ({ id, subs, name: adminNameById(id) }))
        .sort((a,b)=> String(a.name||'').localeCompare(String(b.name||'')))
        .map(g => ({ key:'admin:'+g.id, subs:g.subs,
          label: `${g.name} — routed to them (${g.subs.length})` })))
      .concat([...byHead.values()]
        .sort((a,b)=> String(a.head.name||'').localeCompare(String(b.head.name||'')))
        .map(g => ({ key:'head:'+g.head.id, subs:g.subs, head:g.head,
          label: `${g.head.name} — their team (${g.subs.length})` })));
    // Never leave the picker with nothing to select. An empty queue is not
    // worth listing while there is other work, but when there is none at
    // all this is the right place to be standing.
    if(!scopes.length) scopes.push({ key:'nobody', subs: [], label: 'Nobody assigned (0)' });
    // A queue can empty while it is the one on screen, and the list rebuilds
    // itself when it does. Fall back rather than show nothing.
    if(!scopes.some(x => x.key === reviewScope)) reviewScope = scopes[0].key;
    const headOwnedCount = allPending.length - headless.length;

    // Always shown, even with a single queue. Hiding it when there was
    // nothing to pick between meant the usual case — one team, one head —
    // gave no sign the queue was anybody's in particular, and no sign the
    // picker existed at all. One option still answers "whose is this?".
    el.innerHTML = `
      <div class="card" style="margin-bottom:12px;">
        <div class="field" style="margin-bottom:0;">
          <label style="font-size:11px;">Show</label>
          <select id="rv-scope">
            ${scopes.map(x=>`<option value="${escapeHtml(x.key)}" ${
              x.key === reviewScope ? 'selected' : ''}>${escapeHtml(x.label)}</option>`).join('')}
          </select>
        </div>
        ${headOwnedCount ? `<div class="help" style="margin-top:8px;margin-bottom:0;">${headOwnedCount} submission${headOwnedCount===1?' is':'s are'} with a head. You can still approve or reject any of them yourself.</div>` : ''}
      </div>
      <div class="eyebrow" style="margin-bottom:10px;" id="rv-count"></div>
      <div id="rv-list"></div>
    `;

    function drawReviewList(){
      const sel = document.getElementById('rv-scope');
      if(sel) reviewScope = sel.value;
      const chosen = scopes.find(x => x.key === reviewScope) || scopes[0];

      const pending = chosen.subs;
      document.getElementById('rv-count').textContent = `${pending.length} awaiting review`;
      const listEl = document.getElementById('rv-list');
      if(pending.length===0){
        listEl.innerHTML = `<div class="card"><div class="empty">${chosen.head
          ? 'Nothing waiting on ' + escapeHtml(chosen.head.name) + '.'
          : (chosen.key === 'mine' ? 'Nothing routed to you right now.'
          : chosen.key && chosen.key.indexOf('admin:') === 0
            ? 'Nothing waiting on ' + escapeHtml(chosen.label.split(' — ')[0]) + '.'
            : 'Nothing here — everything pending is with a head.')}</div></div>`;
        return;
      }
      listEl.innerHTML = pending.map(s=>{
        const w = workerMap[s.workerId]; const t = targetMap[s.targetId];
        const head = w && w.reportsTo ? workerMap[w.reportsTo] : null;
        const whoLine = `${w?escapeHtml(w.name):'—'} &middot; ${
          new Date(s.submittedAt).toLocaleString()}${head && head.isHead
            ? ` &middot; <span style="color:var(--amber-dark);">head: ${escapeHtml(head.name)}</span>`
            : ''}`;
        // A whole day rather than one task: the jobs are listed in place of
        // a photo, and the points are the day's flat amount, not a sum.
        if(s.isDay){
          const jobs = (s.targetIds || []).map(id => targetMap[id]).filter(Boolean);
          return `
        <div class="sub-card">
          <div class="sub-top">
            <div><div class="sub-title">Do list &middot; ${escapeHtml(s.dayDate || '')}</div>
            <div class="sub-meta">${whoLine}</div></div>
            <div class="target-pts">+${dayPts} pts</div>
          </div>
          <div class="sub-note" style="color:var(--muted);">${jobs.length
            ? jobs.map(j => '&#10003; ' + escapeHtml(j.title)).join('<br>')
            : 'The jobs are no longer on file.'}</div>
          <input type="text" class="rv-remark" id="rv-remark-${s.id}" placeholder="Remark for the worker — required if you send it back" style="width:100%;margin-top:10px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;box-sizing:border-box;">
          <div class="sub-actions">
            <button class="btn btn-green btn-sm" data-approveday="${s.id}">Approve the day</button>
            <button class="btn btn-red btn-sm" data-rejectday="${s.id}">Send back</button>
          </div>
        </div>`;
        }
        return `
        <div class="sub-card">
          <div class="sub-top">
            <div><div class="sub-title">${t ? escapeHtml(t.title) : (s.taskTitle ? escapeHtml(s.taskTitle) : '(task no longer on file)')}</div>
            <div class="sub-meta">${whoLine}</div>
            ${t && t.isAfterHours ? `<div class="sub-meta" style="color:var(--amber);font-weight:700;">
              After-hours help · ${escapeHtml(ahWhen(t))}</div>` : ''}</div>
            <div class="target-pts">+${t?t.points:0} pts</div>
          </div>
          ${lazyPhotoSlot(s, 'sub-photo') || `<div class="sub-note" style="color:var(--muted);">No photo required for this task.</div>`}
          ${s.note ? `<div class="sub-note">${escapeHtml(s.note)}</div>` : ''}
          ${!t ? `
          <div class="sub-note" style="color:var(--muted);">
            The task this was sent for is no longer on file, so there is nothing left to
            approve — Approve would do nothing and Reject would count against this
            person's quality score for work that may well have been fine. Clearing it
            just takes it out of the queue and marks nobody down. If they are owed the
            points, give them a one-off task for it.
          </div>
          <div class="sub-actions">
            <button class="btn btn-ghost btn-sm" data-clearorphan="${s.id}" data-worker="${s.workerId}">Clear from queue</button>
          </div>
        </div>` : `
          <input type="text" class="rv-remark" id="rv-remark-${s.id}" placeholder="Remark for the worker — required if you reject" style="width:100%;margin-top:10px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;box-sizing:border-box;">
          <div class="sub-actions">
            <button class="btn btn-green btn-sm" data-approve="${s.id}" data-target="${s.targetId}">Approve</button>
            <button class="btn btn-red btn-sm" data-reject="${s.id}" data-worker="${s.workerId}">Reject</button>
          </div>
        </div>`}`;
      }).join('');
      wireReviewActions(listEl);
      fillLazyPhotos(listEl);
    }

    if(document.getElementById('rv-scope')){
      document.getElementById('rv-scope').onchange = drawReviewList;
    }
    drawReviewList();
    return;
  }

  // A rejection costs the worker a fifth of their score, and until now it
  // could be recorded with nothing said about what was wrong — across the
  // first season only three of sixteen carried a reviewer note, and five
  // pointed at tasks that have since been deleted, so nobody can reconstruct
  // them. The box is therefore required on the way out and still optional on
  // the way in: approving stays a single click, rejecting costs a sentence.
  //
  // The floor is three characters, which is enough to stop a stray space or
  // a single keystroke without turning a long review queue into a chore.
  const REJECT_REASON_MIN = 3;
  function rejectReason(inputEl){
    const text = inputEl && inputEl.value ? inputEl.value.trim() : '';
    if(text.length >= REJECT_REASON_MIN) return text;
    if(inputEl){
      inputEl.classList.add('needs-reason');
      inputEl.placeholder = 'Say what was wrong — the worker sees this';
      inputEl.focus();
      inputEl.addEventListener('input', function off(){
        inputEl.classList.remove('needs-reason');
        inputEl.removeEventListener('input', off);
      });
    }
    return null;
  }

  function wireReviewActions(listEl){
    listEl.querySelectorAll('[data-lightbox]').forEach(img=>{
      img.onclick = ()=> openLightbox(img.dataset.lightbox);
    });
    const remarkFor = id => {
      const el = document.getElementById('rv-remark-'+id);
      return el && el.value.trim() ? el.value.trim() : null;
    };
    // Clearing one card is enough. Rebuilding the whole list after every
    // decision re-read every pending submission and re-downloaded every
    // photo, which made each approval slower than the last.
    const clearCard = (btn, verb) => {
      const card = btn.closest('.sub-card');
      if(card){
        card.style.transition = 'opacity .15s';
        card.style.opacity = '0';
        setTimeout(()=>{
          card.remove();
          const left = listEl.querySelectorAll('.sub-card').length;
          const counter = document.getElementById('rv-count');
          if(counter) counter.textContent = `${left} awaiting review`;
          if(left === 0) renderReview();   // only reload once the queue is empty
        }, 150);
      } else {
        renderReview();
      }
      updateReviewDot();
    };

    // Closing out a submission whose task is gone. Deliberately NOT a
    // rejection: 'rejected' is counted into the worker's quality score, and
    // this is a fault in the data, not in their work. The status is its own
    // thing so these can be told apart later.
    listEl.querySelectorAll('[data-clearorphan]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('Clear this from the queue?\n\nThe task it was sent for no longer '
          + 'exists, so it cannot be approved. Clearing it counts against nobody and '
          + 'awards no points.')) return;
        btn.disabled = true; btn.textContent = 'Clearing…';
        const ok = await updateSub(btn.dataset.clearorphan, {
          status: 'cleared', reviewedAt: new Date().toISOString(),
          reviewedBy: currentAdminName() || (REVIEWING_HEAD && REVIEWING_HEAD.name) || '',
          reviewRemark: 'Task no longer on file — cleared, not counted against the worker'
        }, btn.dataset.worker);
        if(ok){
          adminLog('Cleared a submission with no task',
            'worker ' + (btn.dataset.worker || '') , 'review');
          clearCard(btn, 'cleared');
        } else {
          btn.disabled = false; btn.textContent = 'Clear from queue';
        }
      };
    });

    listEl.querySelectorAll('[data-approveday]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.disabled = true; btn.textContent = 'Approving…';
        const subs2 = await getPendingSubs();
        const sub = subs2.find(x => x.id === btn.dataset.approveday);
        const ok = sub ? await approveDoListDay(sub, remarkFor(btn.dataset.approveday)) : false;
        if(ok){ clearCard(btn, 'approved'); }
        else { btn.disabled = false; btn.textContent = 'Approve the day'; }
      };
    });
    listEl.querySelectorAll('[data-rejectday]').forEach(btn=>{
      btn.onclick = async ()=>{
        // A day sent back costs the worker the whole day, so it needs a
        // reason just as a rejected task does.
        const reason = rejectReason(document.getElementById('rv-remark-'+btn.dataset.rejectday));
        if(reason === null) return;
        btn.disabled = true; btn.textContent = 'Sending back…';
        const subs2 = await getPendingSubs();
        const sub = subs2.find(x => x.id === btn.dataset.rejectday);
        const ok = sub ? await rejectDoListDay(sub, reason) : false;
        if(ok){ clearCard(btn, 'sent back'); }
        else { btn.disabled = false; btn.textContent = 'Send back'; }
      };
    });
    listEl.querySelectorAll('[data-approve]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.disabled = true; btn.textContent = 'Approving…';
        const ok = await approveTarget(btn.dataset.target, btn.dataset.approve, remarkFor(btn.dataset.approve));
        if(ok){ clearCard(btn, 'approved'); }
        else { btn.disabled = false; btn.textContent = 'Approve'; }
      };
    });
    listEl.querySelectorAll('[data-reject]').forEach(btn=>{
      btn.onclick = async ()=>{
        // Asked for before anything is disabled or sent, so a blocked
        // rejection leaves the card exactly as it was.
        const reason = rejectReason(document.getElementById('rv-remark-'+btn.dataset.reject));
        if(reason === null) return;
        btn.disabled = true; btn.textContent = 'Rejecting…';
        const ok = await updateSub(btn.dataset.reject, { status:'rejected', reviewedAt: new Date().toISOString(), reviewRemark: reason }, btn.dataset.worker);
        if(ok){ clearCard(btn, 'rejected'); }
        else { btn.disabled = false; btn.textContent = 'Reject'; }
      };
    });
  }

  // ---- Log (submission history, loaded a page at a time) ----
  // Accumulates rows as the admin asks for more, rather than pulling the whole
  // history up front — a submission carries an embedded photo, so a full load
  // is expensive in both reads and bandwidth.
  let logRows = [], logCursor = null, logDone = false, logLoading = false;

  async function renderLog(){
    const el = document.getElementById('view-log');
    el.innerHTML = `<div class="empty">Loading…</div>`;
    logRows = []; logCursor = null; logDone = false;
    const [firstPage, workers, roles] = await Promise.all([getSubsPage(null), getWorkers(), getRoles()]);
    logRows = firstPage.rows; logCursor = firstPage.lastDoc; logDone = firstPage.done;
    const subs = logRows;

    if(subs.length===0){
      el.innerHTML = `<div class="card"><div class="empty">No submissions yet.<br>Every photo proof — pending, approved, or rejected — will show up here.</div></div>`;
      return;
    }

    el.innerHTML = `
      <div class="card" style="margin-bottom:14px;">
        <div class="row2">
          <div class="field" style="margin-bottom:0;">
            <label style="font-size:11px;">Status</label>
            <select id="log-filter-status">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label style="font-size:11px;">Role</label>
            <select id="log-filter-role">
              <option value="all">All roles</option>

            </select>
          </div>

        <div class="field" style="margin-top:10px;margin-bottom:0;">

        </div>

      <div id="log-list"></div>
    `;
    document.getElementById('log-filter-status').onchange = () => drawLogTable(workers);
    document.getElementById('log-filter-role').onchange = () => drawLogTable(workers);
    document.getElementById('log-filter-name').oninput = () => drawLogTable(workers);

  async function loadMoreLog(workers){
    if(logDone || logLoading) return;
    logLoading = true;
    const btn = document.getElementById('log-load-more');
    if(btn){ btn.disabled = true; btn.textContent = 'Loading…'; }
    const next = await getSubsPage(logCursor);
    logRows = logRows.concat(next.rows);
    logCursor = next.lastDoc || logCursor;
    logDone = next.done;
    logLoading = false;
    drawLogTable(workers);
  }

  async function drawLogTable(workers){
    const el = document.getElementById('log-list');
    if(!el) return;
    const subs = logRows;
    const targets = await getTargets();
    const workerMap = {}; workers.forEach(w=>workerMap[w.id]=w);
    const targetMap = {}; targets.forEach(t=>targetMap[t.id]=t);

    const statusFilter = document.getElementById('log-filter-status').value;
    const roleFilter = document.getElementById('log-filter-role').value;
    const nameFilter = (document.getElementById('log-filter-name').value || '').trim().toLowerCase();

    const filtered = subs.filter(s=>{
      if(statusFilter!=='all' && s.status!==statusFilter) return false;
      const w = workerMap[s.workerId];
      if(roleFilter!=='all' && (!w || w.role!==roleFilter)) return false;
      if(nameFilter && (!w || !w.name.toLowerCase().includes(nameFilter))) return false;
      return true;
    });

    if(filtered.length===0){
      el.innerHTML = `<div class="card"><div class="empty">No submissions match these filters.</div></div>`;
      return;
    }

    const logStatusWeight = { pending:0, rejected:1, approved:2 };
    const sorted = filtered.slice().sort((a,b)=>{
      const wA = logStatusWeight[a.status] ?? 0, wB = logStatusWeight[b.status] ?? 0;
      if(wA!==wB) return wA-wB;
      return b.submittedAt.localeCompare(a.submittedAt);
    });
    const badgeClass = { pending:'badge-pending', approved:'badge-achieved', rejected:'badge-rejected' };

    el.innerHTML = `
      <div class="eyebrow" style="margin-bottom:10px;">Showing ${filtered.length} of ${subs.length} loaded &middot; tap a photo to view full size</div>
      <table class="logtable">
        <thead><tr><th>Photo</th><th>Task</th><th>Worker</th><th>Date</th><th>Time</th><th>Status</th><th>Note</th></tr></thead>
        <tbody id="log-tbody"></tbody>
      </table>
      ${logDone
        ? `<div class="help" style="text-align:center;margin-top:12px;margin-bottom:0;">That's the full history — ${subs.length} submission${subs.length===1?'':'s'}.</div>`
        : `<div style="text-align:center;margin-top:12px;">
             <button class="btn btn-ghost btn-sm" id="log-load-more">Load 50 more</button>
             <div class="help" style="margin-top:6px;margin-bottom:0;">Filters search the ${subs.length} loaded so far — load more to widen the search.</div>
           </div>`}
    `;
    const moreBtn = document.getElementById('log-load-more');
    if(moreBtn) moreBtn.onclick = ()=> loadMoreLog(workers);
    const tbody = document.getElementById('log-tbody');
    tbody.innerHTML = sorted.map(s=>{
      const w = workerMap[s.workerId]; const t = targetMap[s.targetId];
      const dt = new Date(s.submittedAt);
      const photoCell = (s.hasPhoto || s.photo)
        ? (lazyPhotoSlot(s, 'log-table-thumb') || '')
        : `<div class="log-table-thumb" style="display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);background:var(--paper);">📝</div>`;
      return `
        <tr>
          <td>${photoCell}</td>
          <td>${t ? escapeHtml(t.title) : (s.taskTitle ? escapeHtml(s.taskTitle) : '<span style="color:var(--muted);">(task no longer on file)</span>')}</td>
          <td>${w?escapeHtml(w.name):'—'}</td>
          <td class="mono">${todayStrFromDate(dt)}</td>
          <td class="mono">${dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
          <td><span class="badge ${badgeClass[s.status]||''}">${s.status}</span></td>
          <td>${s.note ? escapeHtml(s.note) : '<span style="color:var(--muted);">—</span>'}${s.reviewRemark ? `<br><span style="font-size:10.5px;color:var(--amber-dark);">💬 ${escapeHtml(s.reviewRemark)}</span>` : ''}${s.reviewedBy ? `<br><span style="font-size:10.5px;color:var(--muted);">reviewed by ${escapeHtml(s.reviewedBy)}</span>` : ''}</td>
        </tr>`;
    }).join('');
    fillLazyPhotos(tbody);
    tbody.querySelectorAll('[data-lightbox]').forEach(img=>{
      img.onclick = ()=> openLightbox(img.dataset.lightbox);
    });
  }

            ${workers.map(w=>`<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('')}
          </select>
        </div>
        <div class="help" style="margin-top:-8px;">Picking a worker skips role targeting, capacity, and the accept step entirely — it goes straight into their target list, already in progress.</div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;cursor:pointer;">

    document.getElementById('sq-recover-scan').onclick = async function(){

      document.getElementById('sq-recover-go').onclick = async function(){
        const picks = [...document.querySelectorAll('.sq-rec-cb:checked')]
          .map(cb => _sqRecoverRows[+cb.dataset.i]).filter(Boolean);
        const msg = document.getElementById('sq-recover-msg');
        if(!picks.length){ msg.style.color='var(--red)'; msg.textContent='Nothing ticked.'; return; }
        this.disabled = true; this.textContent = 'Restoring…';
        const res = await restoreSideQuests(picks);
        this.disabled = false; this.textContent = 'Put the ticked tasks back';
        if(res.ok){
          msg.style.color = 'var(--green)';
          msg.textContent = (picks.length === 1 ? 'One task is' : picks.length + ' tasks are') + ' back in the list below.';
          renderSideQuestsAdmin();
        } else {
          msg.style.color = 'var(--red)';
          msg.textContent = res.cancelled ? 'They are already on file — nothing to do.'
            : 'Could not save, so nothing was changed' + (res.error ? ': ' + res.error : '.');
