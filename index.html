    { role:'Seafreight Admin',  title:'Process all pending seafreight DOs/BLs before cut-off', points:20 },
    { role:'Seafreight Admin',  title:'File daily seafreight documentation',            points:10 },
    { role:'Seafreight Admin',  title:'Update seafreight manifest/booking records same-day', points:15 },
    { role:'Seafreight Admin',  title:'Respond to customer/agent queries within SLA',   points:10 },
    { role:'Seafreight Admin',  title:'Reconcile daily seafreight billing/paperwork',   points:15 },

    { role:'Airfreight Admin',  title:'Process all pending airfreight AWBs/DOs before cut-off', points:20 },
    { role:'Airfreight Admin',  title:'File daily airfreight documentation',            points:10 },
    { role:'Airfreight Admin',  title:'Update airfreight manifest/booking records same-day', points:15 },
    { role:'Airfreight Admin',  title:'Respond to customer/agent queries within SLA',   points:10 },
    { role:'Airfreight Admin',  title:'Reconcile daily airfreight billing/paperwork',   points:15 },

    { role:'Forwarding Admin',  title:'Process all pending forwarding job files before cut-off', points:20 },
    { role:'Forwarding Admin',  title:'File daily forwarding documentation',            points:10 },
    { role:'Forwarding Admin',  title:'Update forwarding job status/records same-day',  points:15 },
    { role:'Forwarding Admin',  title:'Respond to customer/agent queries within SLA',   points:10 },
    { role:'Forwarding Admin',  title:'Reconcile daily forwarding billing/paperwork',   points:15 },

    { role:'Airport Foreman',   title:'Ensure loading cut-off compliance',              points:20 },
    { role:'Airport Foreman',   title:'Submit daily forklift/manpower coordination report', points:15 },
    { role:'Airport Foreman',   title:'Coordinate with MSCargo/airport team on daily schedule', points:15 },
    { role:'Airport Foreman',   title:'Monitor restricted-area access compliance',      points:10 },
    { role:'Airport Foreman',   title:'Resolve on-ground operational issues same-day',  points:15 },
  ];

  // ---- daily auto-renewal: create today's role-based targets for any worker missing them ----
  async function generateDailyTargets(){
    // Every read here feeds logic that can overwrite the saved targets list.
    // If Firestore fails to load any of these (network blip, page loading
    // before auth is ready, etc.), we must NOT proceed — treating a failed
    // read as "genuinely empty" risks wiping real data. So: fail loudly and
    // do nothing this run, rather than guess.
    let workers, templates, weeklyTemplates, targets, dismissed, existingFails, closures, sideQuests;
    try{
      [workers, templates, weeklyTemplates, targets, dismissed, existingFails, closures, sideQuests] =
        await Promise.all([getListStrict(K_WORKERS), getListStrict(K_ROLE_TEMPLATES), getListStrict(K_WEEKLY_TEMPLATES), getListStrict(K_TARGETS), getListStrict(K_DISMISSED), getListStrict(K_FAILS), getListStrict(K_HOLIDAY_CLOSURES), getListStrict(K_SIDEQUESTS)]);
    }catch(e){
      showFbError('Could not load data from Firebase — daily tasks were not updated this load: ' + e.message);
      return;
    }
    const dismissedKeys = new Set(dismissed.map(d=> d.workerId + '::' + d.templateId));
    const newFails = [];
    const library = templates; // role-template list is now plain admin-managed data — no auto re-seeding

    const { dateStr: today, minutesOfDay } = nowMYParts();

    // Pending submissions are only needed to shield submitted-but-unreviewed
    // work from being failed. Nothing can fail before the list closes unless
    // there are leftovers from an earlier day — so on a normal daytime load
    // this read is skipped entirely. It was previously fetched every time and
    // grew with the review backlog, making it the app's largest read cost.
    const _thisWeekMon = mondayOfWeekMY(today);
    const failuresPossible = targets.some(t =>
      (t.isDaily && t.status === 'active' && dailyClosed(t.createdAt, today, minutesOfDay)) ||
      (t.isWeekly && t.status === 'active' && (t.weekOf < _thisWeekMon || (dayOfWeekMY(today) === 0 && minutesOfDay >= WEEK_EXPIRE_MINUTES))) ||
      (t.sideQuestId && t.status === 'active' && t.expiresAt && new Date(t.expiresAt) < new Date() && !t.everSubmitted)
    );
    let subs = [];
    if(failuresPossible){
      try{
        subs = await getPendingSubsStrict();
      }catch(e){
        showFbError('Could not check pending submissions — daily tasks were not updated this load: ' + e.message);
        return;
      }
    }
    let targetsChanged = false;

    // A daily task is stale (and should fail) once it's either from an
    // earlier date entirely, or from today but the clock has passed the
    // the list has closed — but keep any that still have a submission awaiting
    // admin review. Each one dropped here is logged as a fail for that worker.
    //
    // The everSubmitted protection is scoped to the task's OWN day: if a
    // worker submitted and got rejected, they get the rest of that day to
    // fix and resubmit without risk of failing. Once the day rolls over,
    // normal expiry applies — otherwise a rejected-and-abandoned task would
    // linger forever, never failing and never going away.
    const pendingTargetIds = pendingTargetIdSet(subs);
    // Second line of defence: match pending submissions by worker+template as
    // well as by id. If a target was ever replaced by a regenerated copy, the
    // submission still points at the old id — this stops the new copy failing
    // while the worker's proof sits unreviewed.
    //
    // That used to read the template off the submission's own target, which
    // cannot work in the one case it was written for: when the old target is
    // GONE, there is nothing to read it from, and the worker was failed for
    // work they had submitted. So the submission now carries its own
    // templateId, and for records written before it did, the task title is
    // matched instead.
    //
    // Both of those are scoped to the day the submission was for. Without
    // that, an orphan that can never be reviewed — pointing at a task that no
    // longer exists, so no reviewer can ever close it — would shield that
    // person's copy of that task from failing every day, for good.
    const pendingByTemplate = new Set();
    const pendingOrphanDay = new Set();
    {
      const targetById = {};
      targets.forEach(t=>{ targetById[t.id] = t; });
      subs.filter(s=>s.status==='pending').forEach(s=>{
        const t = targetById[s.targetId];
        if(t && t.templateId) pendingByTemplate.add(t.workerId + '::' + t.templateId);
        const day = dailyDayOfSubmission(s.submittedAt);
        if(!day) return;
        if(s.templateId) pendingOrphanDay.add(s.workerId + '::tpl::' + s.templateId + '::' + day);
        if(s.taskTitle)  pendingOrphanDay.add(s.workerId + '::ttl::' + s.taskTitle  + '::' + day);
      });
    }
    const hasPendingWork = t =>
      pendingTargetIds.has(t.id) ||
      (t.templateId && pendingByTemplate.has(t.workerId + '::' + t.templateId)) ||
      (t.templateId && pendingOrphanDay.has(t.workerId + '::tpl::' + t.templateId + '::' + t.createdAt)) ||
      pendingOrphanDay.has(t.workerId + '::ttl::' + t.title + '::' + t.createdAt);
    // Recorded so the final save can be applied as a merge rather than an
    // overwrite — otherwise a concurrent approval can be undone.
    const dRemove = [], dStatus = {}, dAdd = [];
    // Directly-assigned challenger tasks used to be created without an
    // expiresAt on the target record at all, which meant the expiry check
    // below had nothing to compare against and the task could sit "in
    // progress" forever regardless of how overdue the quest itself was.
    // Heal any of those here, from the quest's own deadline, before the
    // expiry check below runs — so a backlog of these self-corrects on the
    // very next load rather than needing manual data fixes.
    {
      const questById = {};
      sideQuests.forEach(sq=>{ questById[sq.id] = sq; });
      targets.forEach(t=>{
        if(t.sideQuestId && t.status==='active' && (t.expiresAt===undefined || t.expiresAt===null)){
          const sq = questById[t.sideQuestId];
          if(sq && sq.expiresAtFixed){
            t.expiresAt = sq.expiresAtFixed;
            targetsChanged = true;
            dStatus[t.id] = Object.assign({}, dStatus[t.id], { expiresAt: sq.expiresAtFixed });
          }
        }
      });
    }

    // An acceptance made after the task's own due time should never have
    // existed — the worker list hides expired tasks and Accept re-checks the
    // deadline, but records created before those guards (or while a deadline
    // was temporarily moved) can still be sitting here. Left alone they show
    // up in the admin list and, once failed, count against that worker's
    // reliability for a task they were never entitled to hold. Remove them,
    // and the fail record with them. Anything already approved, or with work
    // submitted, is left for an admin to judge rather than deleted.
    // A worker moved to a different role still had today's tasks from the
    // role they left sitting active — and at closing those expired as failures
    // against their reliability, for work that was no longer theirs. Clear
    // them out here; the generator below then creates their new role's tasks
    // in the same pass, so the switch takes effect the same day.
    const staleRoleIds = new Set();
    {
      const roleByWorker = {};
      workers.forEach(w => { roleByWorker[w.id] = w.role; });
      const roleByTemplate = {};
      library.forEach(t => { roleByTemplate[t.id] = t.role; });
      targets.forEach(t => {
        if(!t.isDaily || !t.templateId || t.status !== 'active') return;
        const workerRole = roleByWorker[t.workerId];
        const templateRole = roleByTemplate[t.templateId];
        // Unknown either side (worker or template deleted) — leave it alone
        // rather than guess.
        if(!workerRole || !templateRole) return;
        if(templateRole !== workerRole) staleRoleIds.add(t.id);
      });
      if(staleRoleIds.size > 0){
        staleRoleIds.forEach(id => dRemove.push(id));
        targets = targets.filter(t => !staleRoleIds.has(t.id));
        targetsChanged = true;
      }
    }

    const invalidAcceptIds = new Set();
    {
      const questById = {};
      sideQuests.forEach(sq=>{ questById[sq.id] = sq; });
      targets.forEach(t=>{
        if(!t.sideQuestId || !t.acceptedAt) return;
        if(t.status === 'achieved' || t.everSubmitted) return;
        const sq = questById[t.sideQuestId];
        if(!sq || !sq.expiresAtFixed) return;
        if(new Date(t.acceptedAt).getTime() > new Date(sq.expiresAtFixed).getTime()){
          invalidAcceptIds.add(t.id);
        }
      });
      if(invalidAcceptIds.size > 0){
        invalidAcceptIds.forEach(id => dRemove.push(id));
        targets = targets.filter(t => !invalidAcceptIds.has(t.id));
        targetsChanged = true;
      }
    }
    const thisWeekMonday = mondayOfWeekMY(today);
    const todayDow = dayOfWeekMY(today); // 0=Sun ... 6=Sat
    let workingTargets = targets.filter(t=>{
      // One test now, because the window crosses midnight: a list handed
      // out yesterday is still open at 2am and closed at 6am, and no
      // comparison against today's date alone can say which.
      //
      // The old code also carried a separate guard giving someone whose
      // work was rejected the rest of the day to fix it. That is simply
      // what "the list has not closed yet" means, so it is no longer
      // written twice — the test below covers it, and the tests prove it.
      const closed = t.isDaily && t.status==='active'
        && dailyClosed(t.createdAt, today, minutesOfDay);
      if(closed && !hasPendingWork(t)){
        // Marked failed and kept on screen rather than deleted, so the worker
        // can see what they missed. Cleared at 5am with the rest of the day.
        targetsChanged = true;
        const at = new Date().toISOString();
        // Two very different situations end up here: never submitted at all,
        // or submitted in time but rejected and not fixed before the deadline.
        // Worth telling apart — one is a no-show, the other is a quality miss.
        const kind = t.everSubmitted ? 'rejected' : 'expired';
        newFails.push({ id: uid(), workerId: t.workerId, title: t.title, points: t.points, type: 'daily', failKind: kind, taskDate: t.createdAt, targetId: t.id, templateId: t.templateId || null, requiresPhoto: t.requiresPhoto !== false, failedAt: at,
          reason: kind === 'rejected' ? 'submitted but rejected, not resubmitted before the list closed at 5am' : 'never submitted before the list closed at 5am' });
        t.status = 'failed';
        t.failedAt = at;
        t.failKind = kind;
        dStatus[t.id] = { status:'failed', failedAt: at, failKind: kind };
        return true;
      }

      // Weekly tasks mirror the same rules on a 7-day cycle: they fail once
      // their week has rolled over, or on Sunday after the 9pm cutoff. Same
      // same-week grace applies to anything that was submitted and rejected.
      const isOlderWeek = t.isWeekly && t.status==='active' && t.weekOf < thisWeekMonday;
      const isThisWeekPastExpiry = t.isWeekly && t.status==='active' && t.weekOf === thisWeekMonday
        && todayDow === 0 && minutesOfDay >= WEEK_EXPIRE_MINUTES; // Sunday after 9pm
      const weeklyProtected = t.everSubmitted && t.weekOf === thisWeekMonday
        && !(dayOfWeekMY(today) === 0 && minutesOfDay >= WEEK_EXPIRE_MINUTES);
      if((isOlderWeek || isThisWeekPastExpiry) && !hasPendingWork(t) && !weeklyProtected){
        targetsChanged = true;
        const atW = new Date().toISOString();
        const kindW = t.everSubmitted ? 'rejected' : 'expired';
        newFails.push({ id: uid(), workerId: t.workerId, title: t.title, points: t.points, type: 'weekly', failKind: kindW, taskDate: t.weekOf, targetId: t.id, templateId: t.templateId || null, weekOf: t.weekOf, requiresPhoto: t.requiresPhoto !== false, failedAt: atW,
          reason: kindW === 'rejected' ? 'submitted but rejected, not resubmitted before the Sunday 9pm deadline' : 'never submitted before the Sunday 9pm deadline' });
        t.status = 'failed';
        t.failedAt = atW;
        t.failKind = kindW;
        dStatus[t.id] = { status:'failed', failedAt: atW, failKind: kindW };
        return true;
      }
      return true;
    });

    // expire any accepted challenger tasks past their deadline (admin-set expiry
    // hours, counted from when the worker accepted) — stops further
    // submission and logs a fail, but keeps the record visible as 'failed'
    // rather than silently deleting it. Same scoping applies: a rejected
    // challenger task is protected only while its own deadline hasn't passed.
    const nowMs = Date.now();
    workingTargets.forEach(t=>{
      // everSubmitted covers the gap where a submission exists but the
      // pending list wasn't loaded — better to leave it open for review than
      // to fail work the worker actually did.
      const cqProtected = pendingTargetIds.has(t.id) || !!t.everSubmitted;
      if(t.sideQuestId && t.status==='active' && t.expiresAt && !cqProtected && new Date(t.expiresAt).getTime() < nowMs){
        t.status = 'failed';
        t.failedAt = new Date().toISOString();
        targetsChanged = true;
        dStatus[t.id] = { status:'failed', failedAt: t.failedAt };
        const kindQ = t.everSubmitted ? 'rejected' : 'expired';
        t.failKind = kindQ;
        dStatus[t.id].failKind = kindQ;
        newFails.push({ id: uid(), workerId: t.workerId, title: t.title, points: t.points, type: 'sidequest', failKind: kindQ, targetId: t.id, sideQuestId: t.sideQuestId, requiresPhoto: t.requiresPhoto !== false, failedAt: t.failedAt,
          reason: kindQ === 'rejected' ? 'submitted but rejected, not resubmitted before the deadline' : 'expired before completion' });
      }
    });

    // generate today's targets for each worker, but only once the 7am
    // opening time has arrived — between midnight and 7am, the date has
    // already rolled over but the new batch deliberately isn't available yet.
    // Roles marked closed for today (e.g. a public holiday) are skipped
    // entirely — no daily tasks generated for anyone in that role today.
    const closedRolesToday = new Set();
    const closedWorkersToday = new Set();
    closures.filter(c=>c.date===today).forEach(c=>{
      (c.roles||[]).forEach(r=>closedRolesToday.add(r));
      (c.workerIds||[]).forEach(id=>closedWorkersToday.add(id));
    });
    // A closure can name whole roles, individual people, or both.
    const isClosedToday = w => closedWorkersToday.has(w.id) || closedRolesToday.has(w.role);

    // Handing the list out, which still stops at 9pm. Extending when it
    // can be submitted is not a reason to start handing someone a fresh
    // day's work at eleven at night.
    const dailyWindowOpen = minutesOfDay >= DAILY_OPEN_MINUTES && minutesOfDay < DAILY_HANDOUT_END;
    if(dailyWindowOpen){
      workers.forEach(w=>{
        if(isClosedToday(w)) return; // closed for them today — nothing to generate
        const roleTemplates = library.filter(t=>t.role === w.role);
        roleTemplates.forEach(t=>{
          if(dismissedKeys.has(w.id + '::' + t.id)) return; // admin permanently removed this task for this worker
          const exists = workingTargets.some(tg=> tg.workerId===w.id && tg.templateId===t.id && tg.createdAt===today);
          if(!exists){
            const nt = {
              id: uid(), workerId: w.id, title: t.title, titleMs: t.titleMs || '',
              points: t.points, period: 'Daily',
              status: 'active', createdAt: today, templateId: t.id, isDaily: true,
              requiresPhoto: t.requiresPhoto !== false
            };
            workingTargets.push(nt); dAdd.push(nt);
            targetsChanged = true;
          }
        });
      });
    }

    // Weekly targets are assigned to specific heads by name, not by role —
    // they generate once per week, from Monday 7:00am onwards. Generating on
    // any day of the week (not just Monday) means a quiet Monday where nobody
    // opened the app still gets everyone their tasks.
    const weeklyWindowOpen = !(todayDow === 1 && minutesOfDay < WEEK_OPEN_MINUTES) // not before Mon 7am
      && !(todayDow === 0 && minutesOfDay >= WEEK_EXPIRE_MINUTES);                 // not after Sun 9pm
    if(weeklyWindowOpen){
      weeklyTemplates.forEach(t=>{
        const w = workers.find(x=>x.id === t.workerId);
        if(!w) return;               // the worker it was assigned to is gone
        if(isClosedToday(w)) return; // closed for them today
        if(dismissedKeys.has(w.id + '::' + t.id)) return;
        const exists = workingTargets.some(tg=> tg.workerId===w.id && tg.templateId===t.id && tg.weekOf===thisWeekMonday);
        if(!exists){
          const nt = {
            id: uid(), workerId: w.id, title: t.title, points: t.points, period: 'Weekly',
            status: 'active', createdAt: today, weekOf: thisWeekMonday, templateId: t.id, isWeekly: true,
            requiresPhoto: t.requiresPhoto !== false
          };
          workingTargets.push(nt); dAdd.push(nt);
          targetsChanged = true;
        }
      });
    }

    // Safety net: collapse any duplicate ACTIVE daily targets for the same
    // worker+template+DAY down to one. This can happen if this function runs
    // twice in quick succession (two tabs open, or a date-boundary edge case)
    // before the first write has landed.
    //
    // The day is part of the key, exactly as weekOf is for weeklies below.
    // Without it, a task still awaiting review from an earlier day counts as a
    // duplicate of today's fresh copy of the same template — and since the
    // sort below keeps the copy carrying the submission, it is TODAY'S that
    // gets deleted. A worker whose head is slow to approve then opens the app
    // to find those tasks simply missing, and a sent-back task would suppress
    // its own replacement every day until it was resolved.
    const seenKeys = new Set();
    const deduped = [];
    // Which copy survives matters: if the one carrying a worker's submission
    // is dropped, that submission is orphaned and the surviving copy has
    // nothing protecting it from failing at the deadline. Copies with real
    // work attached are kept ahead of untouched ones — within a single day the
    // tie-break on createdAt is useless, since their dates are identical.
    const hasWork = t => pendingTargetIds.has(t.id) || !!t.everSubmitted;
    workingTargets
      .slice()
      .sort((a,b)=>{
        const wa = hasWork(a) ? 0 : 1, wb = hasWork(b) ? 0 : 1;
        if(wa !== wb) return wa - wb;
        return b.createdAt.localeCompare(a.createdAt);
      })
      .forEach(t=>{
        if(t.isDaily && t.status==='active' && t.templateId){
          const dupKey = 'd::' + t.workerId + '::' + t.templateId + '::' + t.createdAt;
          // Never discard a copy someone has actually submitted against.
          if(seenKeys.has(dupKey) && !hasWork(t)){ targetsChanged = true; dRemove.push(t.id); return; }
          seenKeys.add(dupKey);
        }
        // Same protection for weeklies, scoped per week rather than per day.
        if(t.isWeekly && t.status==='active' && t.templateId){
          const dupKey = 'w::' + t.workerId + '::' + t.templateId + '::' + t.weekOf;
          if(seenKeys.has(dupKey) && !hasWork(t)){ targetsChanged = true; dRemove.push(t.id); return; }
          seenKeys.add(dupKey);
        }
        deduped.push(t);
      });
    workingTargets = deduped;

    // Copies left behind by a challenger task that was removed before the
    // remove swept them up. They point at a task that no longer exists, so
    // nobody can review them and they never go away on their own — and if
    // the same task was created again, the worker is looking at it twice.
    // Only untouched ones go: submitted, pending and approved work stays.
    //
    // Skipped entirely when the task list came back empty, because a failed
    // read looks exactly like "every task was deleted", and acting on that
    // would clear the whole team's challenger tasks at once.
    if(sideQuests.length){
      const questIds = new Set(sideQuests.map(q => q.id));
      let orphans = workingTargets.filter(t =>
        t.sideQuestId && !questIds.has(t.sideQuestId) && t.status === 'active' && !hasWork(t));
      // An empty list is not the only way the task list can be wrong. It was
      // once overwritten down to a single task, and a sweep that trusted it
      // would have cleared almost every accepted copy on the team. So: tidying
      // up after a removal or two is normal, but most of the team's challenger
      // work going stale at once is a damaged list, not an admin's decision.
      // Leave it alone and say so — an orphan costs nothing but a duplicate,
      // and is easy to clear later; a wrongly deleted one is somebody's work.
      const liveQuestTargets = workingTargets.filter(t => t.sideQuestId && t.status === 'active');
      if(orphans.length > 3 && orphans.length > liveQuestTargets.length / 2){
        console.warn('Skipping challenger cleanup: ' + orphans.length + ' of '
          + liveQuestTargets.length + ' accepted tasks look orphaned, which suggests the '
          + 'challenger task list is damaged rather than tidied.');
        showFbError('Challenger tasks look wrong — ' + orphans.length + ' accepted ones point at '
          + 'tasks that no longer exist. Nothing has been deleted. Check the Challenger Tasks tab.');
        orphans = [];
      }
      // hasWork leans on the pending-submission read, and that read is
      // skipped on a load where nothing could fail. Deleting a copy whose
      // proof photo is sitting in the review queue would destroy real work,
      // so when there is something to clear and that read was skipped, do it
      // now — and if it cannot be done, clear nothing.
      if(orphans.length && !failuresPossible){
        try{
          const proofIds = new Set((await getPendingSubsStrict()).map(s => s.targetId));
          orphans = orphans.filter(t => !proofIds.has(t.id));
        }catch(e){ orphans = []; }
      }
      if(orphans.length){
        const drop = new Set(orphans.map(t => t.id));
        workingTargets = workingTargets.filter(t=>{
          if(!drop.has(t.id)) return true;
          dRemove.push(t.id);
          return false;
        });
        targetsChanged = true;
      }
    }

    // One worker can only hold one copy of a given challenger task. Any extra
    // is a duplicate acceptance from before this was enforced — drop the
    // spares, keeping whichever has real work attached.
    {
      const seenQuest = new Set();
      const keep = [];
      workingTargets
        .slice()
        .sort((a,b)=>{
          const wa = (pendingTargetIds.has(a.id) || a.everSubmitted || a.status==='achieved') ? 0 : 1;
          const wb = (pendingTargetIds.has(b.id) || b.everSubmitted || b.status==='achieved') ? 0 : 1;
          return wa - wb;
        })
        .forEach(t=>{
          if(t.sideQuestId){
            const k = t.sideQuestId + '::' + t.workerId;
            if(seenQuest.has(k)){ targetsChanged = true; dRemove.push(t.id); return; }
            seenQuest.add(k);
          }
          keep.push(t);
        });
      workingTargets = keep;
    }

    // Clear out yesterday's finished business at 5am — failed, rejected and
    // approved tasks all stay visible overnight so the worker can see how the
    // day ended, then the slate is wiped for the new day.
    const CLEAR_AT_MINUTES = 5 * 60;
    if(minutesOfDay >= CLEAR_AT_MINUTES){
      const before = workingTargets.length;
      workingTargets = workingTargets.filter(t=>{
        // Only FAILED tasks are cleared here. Completed ones must stay —
        // they're the record of what the worker actually did, and the
        // archiver counts them into their totals at 30 days. Deleting them
        // overnight wiped that history and left reliability with nothing to
        // measure.
        if(t.status !== 'failed') return true;
        if(t.sideQuestId) return true;               // challenger tasks manage their own lifecycle
        const day = t.isWeekly ? null : t.createdAt; // weeklies roll with the week, not the day
        if(!day) return true;
        if(day >= today) return true;                // still today's business
        dRemove.push(t.id);
        return false;
      });
      if(workingTargets.length !== before) targetsChanged = true;
    }

    // Roll long-finished targets into the archive so the live array stops
    // growing all season. Only 'achieved' ones past the cutoff are moved —
    // active, pending and failed targets are all still in use.
    const archiveCutoff = dateStrDaysAgoMY(ARCHIVE_AFTER_DAYS);
    const toArchive = workingTargets.filter(t =>
      t.status === 'achieved' && t.achievedAt && t.achievedAt < archiveCutoff
    );
    if(toArchive.length > 0){
      try{
        const archive = await getTargetArchive();
        toArchive.forEach(t=>{
          const e = archive.byWorker[t.workerId] = archive.byWorker[t.workerId] || { achieved:0, sideQuests:0 };
          e.achieved++;
          if(t.sideQuestId) e.sideQuests++;
        });
        archive.archivedCount = (archive.archivedCount || 0) + toArchive.length;
        await saveDoc(K_TARGET_ARCHIVE, archive);
        const archivedIds = new Set(toArchive.map(t=>t.id));
        workingTargets = workingTargets.filter(t => !archivedIds.has(t.id));
        toArchive.forEach(t=> dRemove.push(t.id));
        targetsChanged = true;
      }catch(e){
        console.error('Could not archive completed targets:', e);
      }
    }

    // Merge rather than overwrite, so anything approved while this was running
    // survives.
    if(targetsChanged) await applyTargetDeltas({ removeIds: dRemove, statusChanges: dStatus, add: dAdd });
    // A task removed because the worker changed role may already have a
    // submission waiting in the review queue. Delete it outright — there's
    // nothing left to review once the task is gone. Scoring is unaffected:
    // the submission tallies were counted when it was submitted and aren't
    // recalculated from these documents.
    if(staleRoleIds.size > 0){
      try{
        const pend = subs.length ? subs : await getPendingSubsStrict();
        const doomed = pend.filter(sub => sub.status === 'pending' && staleRoleIds.has(sub.targetId));
        await Promise.all(doomed.map(sub => db.collection(SUBS_COLLECTION).doc(sub.id).delete()));
        await dropSubPhotos(doomed.map(sub => sub.id));
      }catch(e){ console.error('Could not remove submissions for role-changed tasks:', e); }
    }
    // Only stale challenger acceptances clear their fails. Fails earned in a
    // previous role stay on the record — the person did hold that job at the
    // time, so the miss was real.
    const keptFails = invalidAcceptIds.size > 0
      ? existingFails.filter(f => !invalidAcceptIds.has(f.targetId))
      : existingFails;
    const failsRemoved = keptFails.length !== existingFails.length;
    if(newFails.length>0 || failsRemoved) await setFailsAndCounts(keptFails.concat(newFails));
    // A removed fail changes someone's reliability — republish so the
    // leaderboard reflects it without waiting for an admin to open Scores.
    if(failsRemoved) await recomputeAndPublishScores();
  }

  // Score one worker over a period. Returns null when there's nothing to
  // judge — a new starter shouldn't be given a misleading 0 or 100.
  // `modes` maps a worker id to how they finish their day. Left out, every
  // worker is scored the old way, so nothing that already calls this
  // changes behaviour by adding the argument later.
  function scoreWorker(workerId, { targets, fails, stats, cutoffDate, archive, issues, modes }){
    const onDoList = ((modes || {})[workerId] || MODE_TASKS) === MODE_DOLIST;
    const inPeriod = d => !cutoffDate || (d && d >= cutoffDate);
    const mine = targets.filter(t => t.workerId === workerId);
    const st = (stats && stats.byWorker ? stats.byWorker[workerId] : null)
      || { subs:0, promptSum:0, promptCount:0, reviewed:0, rejected:0 };

    // --- Reliability: approved daily/weekly tasks vs those assigned ---
    // Missed daily/weekly tasks are deleted from the target list when they
    // expire — only a fail record remains. Without adding those back, the
    // denominator would only contain tasks that were completed or are still
    // open, and someone who missed half their work would still show 100%.
    const myFails = fails.filter(f => f.workerId === workerId &&
      f.type !== 'sidequest' &&
      inPeriod(f.taskDate || String(f.failedAt||'').slice(0,10)));
    // The two kinds of failure say different things and are scored in
    // different places. Never submitting is a reliability problem. Submitting
    // and being rejected is a quality problem — and it's already counted
    // there through the rejection itself, so counting it again under
    // reliability would punish the same mistake twice.
    const expiredFails  = myFails.filter(f => f.failKind !== 'rejected');
    const rejectedFails = myFails.filter(f => f.failKind === 'rejected');

    // Live targets that ended as a rejected-failure are excluded for the same
    // reason; everything else counts toward what they were assigned.
    const dailyish = mine.filter(t => (t.isDaily || t.isWeekly) && inPeriod(t.createdAt)
      && !(t.status === 'failed' && t.failKind === 'rejected'));
    let dailyAssigned = dailyish.length + expiredFails.length;
    let dailyDone = dailyish.filter(t => t.status === 'achieved').length;
    // Completed tasks older than 30 days are archived out of the live list to
    // keep loads fast, but failures aren't — so over a long period the live
    // data alone would show the misses and hide the wins. Add the archived
    // completions back for periods that reach beyond that window.
    let archivedDaily = 0, archivedQuests = 0;
    if(!cutoffDate && archive && archive.byWorker && archive.byWorker[workerId]){
      const a = archive.byWorker[workerId];
      archivedQuests = a.sideQuests || 0;
      archivedDaily = Math.max(0, (a.achieved || 0) - archivedQuests);
      dailyAssigned += archivedDaily;
      dailyDone += archivedDaily;
    }
    let reliability = dailyAssigned ? (dailyDone / dailyAssigned) * 100 : null;

    // A Do list worker finishes a day, not a task, so their reliability is
    // measured in days: the jobs are only how a day is made up.
    //
    // This matters because a missed day leaves one fail per unticked job.
    // Counted the ordinary way, one bad day on a five-job list would cost
    // five times what the same bad day costs somebody submitting one by
    // one. The jobs are still listed by name under Missed tasks — the
    // record keeps the detail, the score does not double-count it.
    if(onDoList){
      const dayOfFail = f => f.taskDate || String(f.failedAt || '').slice(0, 10);
      const byDate = {};
      dailyish.filter(t => t.isDaily).forEach(t => {
        (byDate[t.createdAt] = byDate[t.createdAt] || []).push(t);
      });
      const days = new Set(Object.keys(byDate));
      // A day counts as cleared only when every job on it was approved.
      const cleared = new Set(Object.keys(byDate)
        .filter(d => byDate[d].every(t => t.status === 'achieved')));
      // A missed job's target is deleted at 5am and only the fail remains,
      // so without this a half-missed day would look complete.
      expiredFails.forEach(f => {
        const d = dayOfFail(f);
        if(!d) return;
        days.add(d); cleared.delete(d);
      });
      reliability = days.size ? (cleared.size / days.size) * 100 : null;
    }

    // --- Challenger: follow-through, with a floor that grows as they take on
    // more. Pure completed÷accepted would rank 1-of-1 above 4-of-5, making it
    // safer to volunteer for less — the opposite of what this should reward.
    // The floor rises with each completed task, so doing more can lift the
    // score but never drag it below someone who barely participated.
    const cq = mine.filter(t => t.sideQuestId && inPeriod(t.createdAt));
    const cqAccepted = cq.length + archivedQuests;
    const cqDone = cq.filter(t => t.status === 'achieved').length + archivedQuests;
    let challenger = null;
    if(cqAccepted){
      const rate = (cqDone / cqAccepted) * 100;
      const volumeFloor = Math.min(100, cqDone * 25); // 4 completed = full floor
      // The floor can lift someone, but only halfway to full marks. Without
      // this cap, four completions reached 100 no matter how many were
      // abandoned — four of twenty scored exactly the same as twenty of
      // twenty, which made accepting tasks you never finish a free way to
      // reach the top. A rate that is already high is untouched, because
      // the floor can only ever raise, never lower.
      const mostTheFloorCanGive = rate + (100 - rate) / 2;
      challenger = Math.min(Math.max(rate, volumeFloor), mostTheFloorCanGive);
    }

    // --- Quality: share of reviewed submissions accepted. Counters rushing,
    // since submitting fast but wrong costs more than it gains.
    const reviewedCount = st.reviewed || 0;
    const rejected = st.rejected || 0;
    // Problems found after the fact count here too — work that passed review
    // but turned out to be wrong is a quality miss, just a delayed one.
    const myIssues = (issues || []).filter(q => q.workerId === workerId &&
      inPeriod(q.taskDate || String(q.loggedAt||'').slice(0,10)));
    const badWork = rejected + myIssues.length;
    const quality = reviewedCount
      ? Math.max(0, (reviewedCount - badWork) / reviewedCount) * 100
      : null;

    const parts = { reliability, quality, challenger };
    // Skip components with no data and renormalise, so an unscored area
    // neither helps nor hurts.
    let total = 0, weightUsed = 0;
    Object.keys(SCORE_WEIGHTS).forEach(k=>{
      if(parts[k] === null || parts[k] === undefined) return;
      total += parts[k] * SCORE_WEIGHTS[k];
      weightUsed += SCORE_WEIGHTS[k];
    });
    if(weightUsed === 0) return null;
    const exact = total / weightUsed;
    return {
      // Both, because they answer different questions. `exact` is what is
      // shown and what decides rank; `score` stays a whole number for the
      // band thresholds and anything that only wants a round figure.
      score: Math.round(exact),
      exact,
      parts,
      counts: {
        dailyAssigned, dailyDone,
        challengerAccepted: cqAccepted, challengerDone: cqDone,
        submissions: st.subs || 0, rejected, issues: myIssues.length,
        fails: expiredFails.length, rejectedFails: rejectedFails.length
      }
    };
  }
  function scoreBand(n){
    if(n >= 85) return { label:'Excellent', color:'var(--green)' };
    if(n >= 70) return { label:'Good',      color:'var(--green)' };
    if(n >= 55) return { label:'Fair',      color:'var(--amber-dark)' };
    return          { label:'Needs work',   color:'var(--red)' };
  }

  function balanceFor(ledger, workerId){
    return ledger.filter(l=>l.workerId===workerId).reduce((s,l)=> s + (l.type==='earned'? l.points : -l.points), 0);
  }
  function earnedFor(ledger, workerId){
    return ledger.filter(l=>l.workerId===workerId && l.type==='earned').reduce((s,l)=>s+l.points,0);
  }
  // Avatar levels up every 500 lifetime points, with the character's look
  // evolving at set milestones — a lightweight nod to Habitica-style avatar
  // progression, built from emoji so there's nothing to host or load.
  // Below 500 points everyone's a plain "Newcomer" — the first real star
  // (Rising Star) is earned, not just handed out at zero.
  const AVATAR_POINTS_PER_LEVEL = 500;
  const AVATAR_TIERS = [
    { minLevel:1,  emoji:'🌑', title:'Newcomer' },
    { minLevel:2,  emoji:'⭐', title:'Rising Star' },
    { minLevel:4,  emoji:'🌟', title:'Bright Star' },
    { minLevel:6,  emoji:'💫', title:'Dynamo Star' },
    { minLevel:9,  emoji:'✨', title:'Sparkling Star' },
    { minLevel:13, emoji:'🌠', title:'Shooting Star' },
    { minLevel:17, emoji:'☄️', title:'Star Comet' },
    { minLevel:21, emoji:'🔯', title:'Superstar' },
  ];
  function avatarInfoFor(earnedPoints){
    const level = Math.floor(earnedPoints / AVATAR_POINTS_PER_LEVEL) + 1;
    const tier = AVATAR_TIERS.filter(t=>t.minLevel<=level).sort((a,b)=>b.minLevel-a.minLevel)[0] || AVATAR_TIERS[0];
    const pointsIntoLevel = earnedPoints % AVATAR_POINTS_PER_LEVEL;
    const pointsForNextLevel = AVATAR_POINTS_PER_LEVEL;
    return { level, emoji:tier.emoji, title:tier.title, pointsIntoLevel, pointsForNextLevel, pct: Math.round(pointsIntoLevel/pointsForNextLevel*100) };
  }
  // The timestamp of a worker's most recent earned point — i.e. the exact
  // moment their current total was reached. Used to break leaderboard ties:
  // whoever's latest earning happened EARLIER got to that shared total
  // first, and ranks higher. For older entries recorded before precise
  // timestamps existed, falls back to the day-level `date` field PLUS the
  // entry's actual position in the ledger array — that position still
  // reflects the real order things happened in, even without a clock time,
  // so same-day historical ties still get told apart correctly instead of
  // collapsing into a tie themselves.
  // ---- Leaderboard fast path ----
  // The per-worker helpers below each scan the whole ledger, which is fine for
  // one lookup but quadratic when ranking a whole team — that's what made the
  // leaderboard freeze. These build a per-worker index in a single pass, so
  // ranking N workers costs one ledger walk instead of N.
  function buildLedgerIndex(ledger){
    const byWorker = {};
    for(let i=0; i<ledger.length; i++){
      const l = ledger[i];
      if(l.type !== 'earned') continue;
      const base = l.at || (l.date ? l.date+'T00:00:00.000Z' : '');
      (byWorker[l.workerId] = byWorker[l.workerId] || []).push({
        key: base + '#' + String(i).padStart(8,'0'),
        date: l.date || '',
        points: l.points || 0
      });
    }
    return byWorker;
  }
  function idxEarned(index, workerId, cutoff){
    const rows = index[workerId]; if(!rows) return 0;
    let sum = 0;
    for(const r of rows){ if(cutoff===null || cutoff===undefined || r.date >= cutoff) sum += r.points; }
    return sum;
  }
  // Latest key wins the tie-break; a single max pass beats sorting the list.
  function idxReachedAt(index, workerId, cutoff){
    const rows = index[workerId]; if(!rows) return '';
    let best = '';
    for(const r of rows){
      if(cutoff!==null && cutoff!==undefined && r.date < cutoff) continue;
      if(r.key > best) best = r.key;
    }
    return best;
  }
  // Same idea for targets: one pass instead of two scans per worker.
  function buildTargetIndex(targets){
    const byWorker = {};
    for(const t of targets){
      const e = byWorker[t.workerId] = byWorker[t.workerId] || { achieved:0, sideQuests:0, sqKeys:[] };
      if(t.status === 'achieved'){
        e.achieved++;
        if(t.sideQuestId){ e.sideQuests++; e.sqKeys.push(String(t.achievedAt || '')); }
      }
    }
    return byWorker;
  }
  function idxSideQuestReachedAt(index, workerId){
    const e = index[workerId]; if(!e || !e.sqKeys.length) return '';
    let best = '';
    for(const k of e.sqKeys){ if(k > best) best = k; }
    return best;
  }

  function reachedAtFor(ledger, workerId){
    const mine = ledger
      .map((l, idx) => ({ l, idx }))
      .filter(x => x.l.workerId===workerId && x.l.type==='earned');
    if(mine.length===0) return '';
    const keys = mine.map(x => {
      const base = x.l.at || (x.l.date ? x.l.date+'T00:00:00.000Z' : '');
      return base + '#' + String(x.idx).padStart(8,'0');
    });
    return keys.sort().reverse()[0]; // latest one
  }
  function achievedCountFor(targets, workerId){
    return targets.filter(t=>t.workerId===workerId && t.status==='achieved').length;
  }
  function sideQuestsAchievedCountFor(targets, workerId){
    return targets.filter(t=>t.workerId===workerId && t.status==='achieved' && t.sideQuestId).length;
  }
  function daysAgo(n){
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d;
  }
  const PERIODS = [
    { key:'lifetime', label:'Lifetime' },
    { key:'sidequest', label:'Challenger Task' },
  ];
  // Tie-break for the "Challenger Task" leaderboard mode — ranked by count
  // of completed challenger tasks, so ties there are broken by whoever's
  // most recent completion happened earliest.
  function reachedSideQuestCountAtFor(targets, workerId){
    const mine = targets
      .map((t, idx) => ({ t, idx }))
      .filter(x => x.t.workerId===workerId && x.t.status==='achieved' && x.t.sideQuestId);
    if(mine.length===0) return '';
    const keys = mine.map(x => {
      const base = x.t.achievedAt || '';
      return base + '#' + String(x.idx).padStart(8,'0');
    });
    return keys.sort().reverse()[0];
  }

  // ---- badges: stored in Firestore so admins can add/edit/remove them ----
  const K_BADGES = 'perf-badges';
  const DEFAULT_BADGES = [
    { group:'targets', emoji:'🎖️', label:'Recruit',    desc:'Complete your first target',  need:1 },
    { group:'targets', emoji:'🪖', label:'Private',     desc:'Complete 5 targets',           need:5 },
    { group:'targets', emoji:'⚔️', label:'Corporal',    desc:'Complete 10 targets',          need:10 },
    { group:'points',  emoji:'🥉', label:'Sergeant',    desc:'Earn 100 lifetime points',     need:100 },
    { group:'points',  emoji:'🥈', label:'Lieutenant',  desc:'Earn 500 lifetime points',     need:500 },
    { group:'points',  emoji:'🥇', label:'Captain',     desc:'Earn 1000 lifetime points',    need:1000 },
    { group:'sidequests', emoji:'🧭', label:'Adventurer', desc:'Complete your first challenger task', need:1 },
    { group:'sidequests', emoji:'🗺️', label:'Explorer',   desc:'Complete 5 challenger tasks',        need:5 },
    { group:'sidequests', emoji:'🏔️', label:'Pathfinder', desc:'Complete 10 challenger tasks',       need:10 },
    { group:'rank',    emoji:'🎗️', label:'Major',       desc:'Rank in the top 3 lifetime',   need:3 },
    { group:'rank',    emoji:'🏆', label:'General',     desc:'Rank #1 on the leaderboard',   need:1 },
  ];
  const GROUP_LABELS = { targets:'Targets Completed', points:'Lifetime Points', sidequests:'Challenger Tasks Completed', rank:'Leaderboard Rank' };
  // Cross-group priority for picking a SINGLE "highest achievement" badge
  // (used on the leaderboard) — reaching a top rank is the most prestigious,
  // followed by lifetime points, then challenger tasks completed, then raw target count.
  const GROUP_PRIORITY = { targets:1, sidequests:2, points:3, rank:4 };

  async function getBadges(){
    // Deliberately uses the STRICT reader: getList() swallows errors and
    // returns [] on failure, which here would look like "all badges are
    // missing" and trigger a full rebuild from defaults — silently wiping
    // every edit and custom badge. On a read failure we return the defaults
    // in memory for this render only, and write nothing.
    let badges;
    try{
      badges = await getListStrict(K_BADGES);
    }catch(e){
      showFbError('Could not load badges — showing defaults for now, nothing was changed: ' + e.message);
      return DEFAULT_BADGES.map(b=>({ id: 'temp-'+b.group+'-'+b.label, ...b }));
    }

    // Ignore any legacy/malformed entries (e.g. saved by an older version of
    // this app before the group/need fields existed) instead of letting them
    // silently break every badge test.
    let valid = badges.filter(b => b && b.group && typeof b.need === 'number');
    let changed = valid.length !== badges.length;

    // Restore any default badge that's gone missing (accidentally removed,
    // or never made it in) — matched by group+label, so an admin's own edits
    // to an existing default badge are never overwritten.
    const existingKeys = new Set(valid.map(b=> b.group + '::' + b.label));
    DEFAULT_BADGES.forEach(def=>{
      const key = def.group + '::' + def.label;
      if(!existingKeys.has(key)){
        valid.push({ id: uid(), ...def });
        existingKeys.add(key);
        changed = true;
      }
    });

    if(changed) await setList(K_BADGES, valid);
    return valid;
  }
  function testBadge(b, ctx){
    if(b.group==='targets') return ctx.targetsAchieved >= b.need;
    if(b.group==='points') return ctx.earned >= b.need;
    if(b.group==='sidequests') return ctx.sideQuestsAchieved >= b.need;
    if(b.group==='rank') return !!ctx.rank && ctx.rank <= b.need;
    return false;
  }
  function badgeMetric(b, ctx){
    if(b.group==='targets') return { current: ctx.targetsAchieved, unit: b.need===1 ? 'target completed' : 'targets completed' };
    if(b.group==='points') return { current: ctx.earned, unit: 'points earned' };
    if(b.group==='sidequests') return { current: ctx.sideQuestsAchieved, unit: b.need===1 ? 'challenger task completed' : 'challenger tasks completed' };
    return null;
  }
  // Only the HIGHEST badge earned within each group (targets / points / rank)
  // is returned — e.g. hitting 1000 points gives "Captain" only, not
  // Sergeant + Lieutenant + Captain stacked up.
  // Normalizes "how hard is this badge" across groups so comparisons work the
  // same way everywhere. For targets/points, a bigger need is harder (need to
  // hit 1000 points is harder than 100). For rank, it's the opposite — need:1
  // (must be #1) is harder than need:3 (top 3) — so we flip the sign.
  function badgeDifficulty(b){
    return b.group === 'rank' ? -b.need : b.need;
  }
  function earnedBadges(ctx, badges){
    const earned = badges.filter(b=>testBadge(b,ctx));
    const byGroup = {};
    earned.forEach(b=>{ if(!byGroup[b.group] || badgeDifficulty(b) > badgeDifficulty(byGroup[b.group])) byGroup[b.group] = b; });
    return Object.values(byGroup).sort((a,b)=> GROUP_PRIORITY[a.group]-GROUP_PRIORITY[b.group]);
  }
  // The single best badge across ALL groups — used anywhere only one badge
  // should show (the leaderboard rows).
  function highestBadge(ctx, badges){
    const earned = earnedBadges(ctx, badges);
    if(earned.length===0) return null;
    return earned.reduce((best,b)=> GROUP_PRIORITY[b.group] > GROUP_PRIORITY[best.group] ? b : best, earned[0]);
  }
  function currentRankTitle(ctx, badges){
    return highestBadge(ctx, badges);
  }
  // The single next badge to chase within each group — used to show workers
  // exactly how close they are, to keep them motivated.
  function nextBadgesInfo(ctx, badges){
    const earned = earnedBadges(ctx, badges);
    const earnedByGroup = {};
    earned.forEach(b=> earnedByGroup[b.group] = b);
    const groups = ['targets','points','sidequests','rank'];
    const next = [];
    groups.forEach(g=>{
      const earnedDiff = earnedByGroup[g] ? badgeDifficulty(earnedByGroup[g]) : -Infinity;
      const candidates = badges.filter(b=>b.group===g && badgeDifficulty(b) > earnedDiff).sort((a,b)=> badgeDifficulty(a)-badgeDifficulty(b));
      if(candidates.length) next.push(candidates[0]);
    });
    return next;
  }

  const root = document.getElementById('root');
  const hashParams = parseHash();
  const authedWorkers = new Set(); // this tab only — see the session below

  // Signing in lasts the tab by default, so closing the app asks for the
  // PIN again. That is right for a phone somebody else might pick up.
  // Ticking "keep me signed in" moves it to localStorage instead, which
  // survives closing the app and the browser discarding an idle tab — the
  // same two places forwarding uses, for the same reason.
  //
  // Only the worker id is kept. It is not a credential and never was: the
  // PIN is checked here in the page, so what this remembers is the choice
  // to skip that check on this device, not a secret.
  const WSESSION_KEY = 'perf_worker_session';
  function readWorkerSession(){
    try{
      return localStorage.getItem(WSESSION_KEY) || sessionStorage.getItem(WSESSION_KEY) || '';
    }catch(e){ return ''; }
  }
  function saveWorkerSession(id, keepSignedIn){
    try{
      if(keepSignedIn){
        localStorage.setItem(WSESSION_KEY, id); sessionStorage.removeItem(WSESSION_KEY);
      } else {
        sessionStorage.setItem(WSESSION_KEY, id); localStorage.removeItem(WSESSION_KEY);
      }
    }catch(e){
      // Private browsing refuses storage. Signing in still works; it just
      // does not outlast the tab.
      try{ sessionStorage.setItem(WSESSION_KEY, id); }catch(e2){}
    }
  }
  function clearWorkerSession(){
    try{ localStorage.removeItem(WSESSION_KEY); }catch(e){}
    try{ sessionStorage.removeItem(WSESSION_KEY); }catch(e){}
  }

  // The plain address is the worker portal, and the admin app lives at
  // #admin. It used to be the other way round, which meant an installed
  // icon could only ever open the admin login — and fourteen of the
  // sixteen people who install this are workers.
  //
  // #worker still works and always will: the 7am job opens it, and it is
  // in links and bookmarks already.
  const isAdminRoute = m => m === 'admin';
  if(isAdminRoute(hashParams.mode)){
    renderAdmin();
  } else {
    renderWorkerPortal();
  }
  window.addEventListener('hashchange', ()=>{
    const h = parseHash();
    if(isAdminRoute(h.mode)) renderAdmin(); else renderWorkerPortal();

  // =========================================================
  // WORKER PORTAL
  // =========================================================
  // Remembered per tab, so the pass runs at most once however much a worker
  // moves around. Picking your name changes the hash, which re-renders this
  // whole screen — so without a guard a worker ran the entire generation
  // pass twice before even seeing their own list.
  let _genRanFor = '';

  async function renderWorkerPortal(){
    const params = parseHash();
    // A worker's phone used to run generateDailyTargets() on every single
    // open: eight uncached reads and a write to the shared targets
    // document, before anything appeared on screen. With everyone opening
    // the app at once in the morning, every phone was also competing to
    // write the same document.
    //
    // It does not need to. The 7am scheduled job creates the day's tasks,
    // and an admin opening the app regenerates as a safety net. A worker
    // only steps in when their own tasks are genuinely missing — which
    // costs one cached read instead of eight strict ones.
    const _today = todayStr();
    let needGen = true;
    try{
      const existing = await getList(K_TARGETS);
      needGen = params.wid
        ? !existing.some(t => t.workerId === params.wid && t.createdAt === _today)
        : !existing.some(t => t.createdAt === _today);
    }catch(e){ needGen = true; }
    // Someone on a rest day or a holiday closure legitimately has nothing
    // today, and would otherwise ask for generation every time they tapped
    // anything. Once per tab is enough to cover a genuinely missed morning.
    if(needGen && _genRanFor !== _today){
      _genRanFor = _today;
      await generateDailyTargets();
    }
    root.innerHTML = `
      <div class="worker-shell">
        <div class="worker-hero">
          <div class="co">Exprexa Performance</div>
          <div class="sub">Worker Portal</div>
          ${params.wid ? '' : '<a class="admin-in" href="#admin">Admin</a>'}
        </div>
        <div class="worker-body" id="wp-body"><div class="empty">Loading…</div></div>
      </div>
    `;
    const body = document.getElementById('wp-body');
    // Alphabetical, not the order they happen to have been added in. The
    // list is read by someone looking for one name in sixteen, and the
    // order a colleague was created in tells them nothing about where to
    // look. localeCompare so accented names sort where a person expects
    // and case never decides the order.
    const workers = (await getWorkers()).slice()
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''),
        undefined, { sensitivity: 'base', numeric: true }));

    if(workers.length===0){
      body.innerHTML = `<div class="empty">No team set up yet. Ask your admin to add workers first.</div>`;
      return;
    }

    // Already signed in on this tab and arriving on your own link: straight
    // through, no second password.
    if(params.wid && authedWorkers.has(params.wid)){
      const w = workers.find(x => x.id === params.wid);
      if(w) return renderWorkerDashboard(body, w);
    }

    // A kept session. It is dropped rather than honoured if that worker has
    // since been removed, so a deleted account cannot walk back in.
    const remembered = readWorkerSession();
    if(remembered){
      const w = workers.find(x => x.id === remembered);
      if(w){ authedWorkers.add(w.id); return renderWorkerDashboard(body, w); }
      clearWorkerSession();
    }

    // One screen, like forwarding: find your name, type your password, in.
    // The old two-step put every colleague's name and role on screen before
    // anyone had proved who they were, and made signing in two taps and a
    // page change.
    body.innerHTML = `
      <div class="eyebrow" style="margin-bottom:10px;">Sign in</div>
      <div class="field"><label>Your name</label>
        <input type="text" id="wp-name" placeholder="Search your name…" autocomplete="off">
        <div id="wp-hits"></div>
      </div>
      <div class="field"><label>Your PIN / password</label>
        <input type="password" id="wp-pass" inputmode="numeric" placeholder="••••"></div>
      <label style="display:flex;align-items:center;gap:9px;font-size:12.5px;
        color:var(--muted);margin:0 0 14px;cursor:pointer;line-height:1.5;">
        <input type="checkbox" id="wp-keep" style="width:16px;height:16px;
          accent-color:var(--ink);margin:0;flex:0 0 auto;">
        Keep me signed in on this device
      </label>
      <button class="btn btn-primary btn-block" id="wp-login">Log In</button>
      <div id="wp-msg" style="margin-top:9px;font-size:12.5px;"></div>
    `;

    const nameInput = document.getElementById('wp-name');
    const hits      = document.getElementById('wp-hits');
    const passInput = document.getElementById('wp-pass');
    const msg       = document.getElementById('wp-msg');
    let picked = null;

    function choose(w){
      picked = w;
      nameInput.value = w.name;
      nameInput.style.borderColor = 'var(--green)';
      hits.innerHTML = '';
      passInput.focus();
    }
    function showHits(query){
      // Nothing typed, nothing listed. The full team is not a thing to
      // browse on the way in.
      const q = query.trim().toLowerCase();
      picked = null;
      nameInput.style.borderColor = '';
      if(!q){ hits.innerHTML = ''; return; }
      const matches = workers.filter(w =>
        String(w.name || '').toLowerCase().includes(q)).slice(0, 6);
      hits.innerHTML = matches.length
        ? matches.map(w => `<div class="namehit" data-id="${escapeHtml(w.id)}">
            <div class="nm">${escapeHtml(w.name)}</div>
            ${w.role ? `<div class="rl">${escapeHtml(w.role)}</div>` : ''}
          </div>`).join('')
        : `<div class="empty" style="padding:12px 0;">No matching names.</div>`;
      hits.querySelectorAll('.namehit').forEach(el => {
        el.onclick = () => {
          const w = workers.find(x => x.id === el.dataset.id);
          if(w) choose(w);
        };
      });
    }
    nameInput.oninput = e => showHits(e.target.value);

    // An old link or a home-screen icon that still carries a worker id
    // lands with the name already filled in.
    if(params.wid){
      const w = workers.find(x => x.id === params.wid);
      if(w) choose(w);
    }

    const doLogin = async () => {
      const btn = document.getElementById('wp-login');
      msg.style.color = 'var(--red)';
      if(!picked){ msg.textContent = 'Please pick your name from the list.';
        nameInput.focus(); return; }
      if(!passInput.value){ msg.textContent = 'Please enter your PIN.';
        passInput.focus(); return; }
      btn.disabled = true; btn.textContent = 'Checking…';
      msg.textContent = '';
      const hash = await sha256Hex(passInput.value);
      if(hash !== picked.passwordHash){
        btn.disabled = false; btn.textContent = 'Log In';
        // Which of the two was wrong is not said, the way forwarding has
        // it — a name that exists should not be confirmable by guessing.
        msg.textContent = 'Incorrect name or PIN.';
        return;
      }
      // The dashboard opens with nine reads at once. Awaited, raced and
      // caught: called and forgotten, one slow read left this button saying
      // "Checking…" with nothing to press and no way back short of a reload.
      try{
        authedWorkers.add(picked.id);
        const keep = document.getElementById('wp-keep');
        saveWorkerSession(picked.id, !!(keep && keep.checked));
        await withTimeout(renderWorkerDashboard(body, picked), 20000, 'Loading your tasks');
      }catch(e){
        console.error('Could not open the dashboard:', e);
        // Not left as logged in: the next attempt should be a clean one.
        authedWorkers.delete(picked.id);
        clearWorkerSession();
        btn.disabled = false; btn.textContent = 'Log In';
        msg.textContent = e && e.message ? e.message
          : 'Could not load your tasks — check your connection and try again.';
      }
    };
    document.getElementById('wp-login').onclick = doLogin;
    passInput.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
    nameInput.addEventListener('keydown', e => {
      // Enter on the name box takes the single match rather than doing
      // nothing, which is what it looks like it should do.
      if(e.key !== 'Enter') return;
      const only = hits.querySelectorAll('.namehit');
      if(only.length === 1) only[0].click();
      else if(picked) passInput.focus();
    });
    if(!picked) nameInput.focus();
  }

  // ---- the Do list day ----
  //
  // One submission for the whole day rather than one per task, so a day is
  // reviewed once and settled once. The tasks themselves are the ordinary
  // role templates — the same titles, the same Malay — they are simply
  // ticked rather than submitted.
  //
  // The id is worked out from the worker and the date rather than minted
  // fresh, so confirming twice on a weak signal replaces the same document
  // instead of creating a second day.
  const daySubId = (workerId, date) => 'day_' + workerId + '_' + date;
  // What the checklist is made of. A template-backed daily and nothing
  // else: a one-off carries no templateId, and a weekly or a challenger
  // task is not a daily at all. Those are submitted one at a time like
  // anybody else's work.
  function doListJobsFor(targets){
    const { dateStr: today, minutesOfDay: mins } = nowMYParts();
    const live = liveDailyDate(today, mins);
    if(!live) return [];
    return (targets || []).filter(t => t.isDaily && t.templateId && t.createdAt === live);
  }
  // Stored the way every other setting here is — a document under appdata,
  // read through the same cache.
  // The day's own submission. It cannot come back with the others: those
  // are fetched by `targetId`, and a day carries `targetIds` — a list —
  // with the single field left empty. So it was never found, the screen
  // decided nothing had been sent, and offered the whole list again to
  // somebody who had already sent it up.
  //
  // One document read, by an id worked out from the person and the date,
  // so there is no query and no index behind it.
  async function getDaySubFor(workerId, date){
    if(!date) return null;
    try{
      const doc = await db.collection(SUBS_COLLECTION).doc(daySubId(workerId, date)).get();
      return doc.exists ? doc.data() : null;
    }catch(e){
      console.error('Could not read the day:', e);
      return null;   // null is "not known", and the screen stays cautious
    }
  }
  async function getDoListPoints(){
    const v = await getList(K_DOLIST_POINTS);
    const n = Number(v && v.points);
    return n >= 0 ? n : DOLIST_DAY_POINTS_DEFAULT;
  }

  // Reminders an admin has tagged this worker in. Tapping Clear marks it
  // done for them only — if it was sent to three people it stays on the
  // office screen until all three have cleared it — and the board calls out
  // their name as they do.
  async function renderMyReminders(host, body, worker){
    if(!host) return;
    const mine = await getMyReminders(worker.id);
    if(!mine.length){ host.innerHTML = ''; return; }
    host.innerHTML = `
      <div class="eyebrow" style="margin-top:4px;">Reminders for you (${mine.length})</div>
      <div class="card" style="margin-bottom:16px;border-left:4px solid var(--amber);">
        ${mine.map((a, i) => `
          <div style="${i ? 'border-top:1px solid var(--line);padding-top:11px;margin-top:11px;' : ''}">
            <div style="font-size:14px;font-weight:600;line-height:1.35;">${escapeHtml(a.text)}</div>
            <div class="help" style="margin-top:3px;">${escapeHtml(annWhen(a.at))}${
              a.byName ? ' · ' + escapeHtml(a.byName) : ''}</div>
            <button class="btn btn-amber btn-sm" data-rem-done="${a.id}" style="margin-top:8px;">Clear</button>
          </div>`).join('')}
      </div>`;
    host.querySelectorAll('[data-rem-done]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.disabled = true; btn.textContent = 'Clearing…';
        const ok = await clearAnnouncementFor(btn.dataset.remDone, worker.id, worker.name);
        if(ok) renderMyReminders(host, body, worker);
        else { btn.disabled = false; btn.textContent = 'Clear'; }
      };
    });
  }

  // The worker's own record of help given outside office hours. They log it,
  // their head approves it, the points go to rewards. Nothing here feeds the
  // performance score — see the note on AH_OFFICE_START.
  async function renderAfterHours(host, body, worker, myEntries, mySubs){
    if(!host) return;
    const [settings, closures] = await Promise.all([getSettings(), getList(K_HOLIDAY_CLOSURES)]);
    const pts = ahPoints(settings), cap = ahCap(settings);
    const closureDates = new Set((closures || [])
      .filter(c => (c.workerIds || []).includes(worker.id) || (c.roles || []).includes(worker.role))
      .map(c => c.date));

    const today = todayStr();
    const weekOf = mondayOfWeekMY(today);
    const usedThisWeek = ahWeekCount(myEntries, worker.id, weekOf);
    const left = Math.max(0, cap - usedThisWeek);

    const statusLabel = t => {
      const sub = mySubs.find(s => s.targetId === t.id);
      if(t.status === 'achieved') return `<span style="color:var(--green);font-weight:700;">Approved · +${t.points} pts</span>`;
      if(sub && sub.status === 'rejected') return `<span style="color:var(--red);font-weight:700;">Sent back</span>`
        + (sub.reviewRemark ? `<div class="help" style="margin-top:3px;">${escapeHtml(sub.reviewRemark)}</div>` : '');
      return `<span style="color:var(--muted);font-weight:700;">Waiting for your head</span>`;
    };
    const recent = (myEntries || [])
      .slice().sort((a,b) => String(b.ahAt || '').localeCompare(String(a.ahAt || '')))
      .slice(0, 6);

    host.innerHTML = `
      <div class="help" style="margin-bottom:10px;">
        Answered the group or sorted a problem outside 9:00am–5:00pm, on a weekend
        or on a holiday? Log it here and your head will review it.
        Worth <strong>${pts} pts</strong> each, up to <strong>${cap} a week</strong>.
        These points go towards rewards and do not change your performance score.
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
        ${left > 0 ? `${left} of ${cap} left this week` : `You have used all ${cap} this week — the count resets Monday.`}
      </div>
      ${left > 0 ? `<button class="btn btn-amber btn-sm" id="ah-open">Log after-hours help</button>` : ''}
      <div id="ah-form"></div>
      ${recent.length ? `<div style="margin-top:14px;">` + recent.map(t => `
        <div style="padding:9px 0;border-top:1px solid var(--line);">
          <div style="font-size:13px;font-weight:600;">${escapeHtml(t.ahNote || t.title || 'After-hours help')}</div>
          <div class="help" style="margin-top:2px;">${escapeHtml(ahWhen(t))}</div>
          <div style="margin-top:4px;font-size:12px;">${statusLabel(t)}</div>
        </div>`).join('') + `</div>` : ''}
    `;

    const openBtn = document.getElementById('ah-open');
    if(!openBtn) return;
    openBtn.onclick = () => {
      const formHost = document.getElementById('ah-form');
      if(formHost.innerHTML){ formHost.innerHTML = ''; return; }
      formHost.innerHTML = `
        <div style="margin-top:12px;">
          <div class="field"><label>When did it happen?</label>
            <div style="display:flex;gap:8px;">
              <input type="date" id="ah-date" value="${today}" max="${today}" style="flex:1;">
              <input type="text" id="ah-time" placeholder="21:40" maxlength="5" style="width:92px;">
            </div>
          </div>
          <div class="field"><label>What did you do?</label>
            <textarea id="ah-note" rows="2" maxlength="200"
              placeholder="e.g. Answered the group about the Penang shipment and arranged the re-book"></textarea>
          </div>
          <div class="file-drop">
            <div style="font-size:12.5px;color:var(--muted);">Screenshot as proof (the group message, the email, whatever shows it)</div>
            <input type="file" accept="image/*" id="ah-file">
            <img class="thumb-preview" id="ah-thumb">
          </div>
          <button class="btn btn-primary btn-sm" id="ah-send" disabled>Send to my head</button>
          <div id="ah-msg" style="margin-top:6px;font-size:12px;"></div>
        </div>`;

      let compressed = null;
      const subId = afterHoursSubId();     // minted once per open form, as elsewhere
      const fileEl = document.getElementById('ah-file');
      const thumb  = document.getElementById('ah-thumb');
      const sendEl = document.getElementById('ah-send');
      const msgEl  = document.getElementById('ah-msg');
      fileEl.onchange = async () => {
        if(!fileEl.files[0]) return;
        sendEl.disabled = true;
        try{
          compressed = await compressImage(fileEl.files[0], 720, 0.5);
          thumb.src = compressed; thumb.style.display = 'block';
          sendEl.disabled = false;
        }catch(e){ msgEl.textContent = 'Could not read that image — try another.'; }
      };
      sendEl.onclick = async () => {
        const date = document.getElementById('ah-date').value;
        const time = document.getElementById('ah-time').value;
        const note = document.getElementById('ah-note').value.trim();
        msgEl.style.color = 'var(--red)';
        if(!date || date > today){ msgEl.textContent = 'Pick the day it actually happened.'; return; }
        if(!note){ msgEl.textContent = 'Say briefly what you did, so your head can approve it.'; return; }
        if(!compressed){ msgEl.textContent = 'Attach a screenshot.'; return; }
        const verdict = isAfterHoursMY(date, time, closureDates);
        if(!verdict.ok){ msgEl.textContent = verdict.why; return; }

        sendEl.disabled = true; sendEl.textContent = 'Sending…';
        // Re-read rather than trust the number drawn when the page loaded —
        // they may have logged one on another device since.
        const fresh = await getTargets().catch(() => null);
        if(fresh){
          const mineNow = fresh.filter(t => t.isAfterHours && t.workerId === worker.id);
          if(ahWeekCount(mineNow, worker.id, mondayOfWeekMY(date)) >= cap){
            msgEl.textContent = `That week already has ${cap} logged.`;
            sendEl.disabled = false; sendEl.textContent = 'Send to my head';
            return;
          }
        }

        const target = {
          id: uid(), workerId: worker.id,
          title: 'After-hours — ' + note.slice(0, 60),
          points: pts, period: 'After-hours', status: 'active',
          createdAt: today, isAfterHours: true,
          ahAt: date + 'T' + time, ahNote: note, ahWeekOf: mondayOfWeekMY(date),
          requiresPhoto: true
        };
        const added = await applyTargetDeltas({ add: [target] });
        if(added === false){
          msgEl.textContent = 'Could not save that — try again.';
          sendEl.disabled = false; sendEl.textContent = 'Send to my head';
          return;
        }
        const res = await addSub({
          id: subId, workerId: worker.id, targetId: target.id,
          status: 'pending', submittedAt: new Date().toISOString(),
          note, photo: compressed,
          taskTitle: target.title, taskPoints: pts, taskKind: 'afterhours'
        });
        if(!res.ok){
          // Leave nothing half-made: without the submission there is nothing
          // for the head to look at, and the target would sit there forever.
          await applyTargetDeltas({ removeIds: [target.id] });
          msgEl.textContent = 'Could not send that — try again.';
          sendEl.disabled = false; sendEl.textContent = 'Send to my head';
          return;
        }
        msgEl.style.color = 'var(--green)';
        msgEl.textContent = 'Sent to your head.';
        renderWorkerDashboard(body, worker);
      };
    };
  }
  // "2026-10-28T21:40" -> "Tue 28 Oct, 9:40pm"
  function ahWhen(t){
    const raw = String(t && t.ahAt || '');
    const [d, hm] = raw.split('T');
    if(!d) return '';
    const mins = hhmmToMinutes(hm || '');
    let clock = hm || '';
    if(mins !== null){
      const h = Math.floor(mins / 60), mi = mins % 60;
      const h12 = h % 12 === 0 ? 12 : h % 12;
      clock = h12 + ':' + String(mi).padStart(2, '0') + (h < 12 ? 'am' : 'pm');
    }
    const dt = new Date(d + 'T12:00:00Z');
    const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getUTCDay()];
    const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getUTCMonth()];
    return day + ' ' + dt.getUTCDate() + ' ' + mon + ', ' + clock;
  }

  function renderDoListDay(tEl, body, worker, myTargets, mySubs, ctx){
    if(!tEl) return;
    const { dateStr: today, minutesOfDay: mins } = nowMYParts();
    // The list on screen is the one that is currently open, which between
    // midnight and 5am is still yesterday's. The jobs are chosen by the
    // caller — see doListJobsFor — so only the day is worked out here.
    const live = liveDailyDate(today, mins);
    const jobs = myTargets;
    // Read directly by the caller; the list of other submissions cannot
    // contain it.
    const sub = (ctx && ctx.daySub)
      || mySubs.find(s => s.isDay && s.dayDate === (live || today));
    const st = sub ? sub.status : null;
    const dayPts = (ctx && ctx.dayPts) || DOLIST_DAY_POINTS_DEFAULT;

    if(!jobs.length){
      tEl.innerHTML = `<div class="card"><div class="empty">${live
        ? 'Nothing on your list today.'
        : 'Between lists — a fresh one opens at 07:00.'}</div></div>`;
      return;
    }

    // Ticks live on screen until the day is confirmed. They are not written
    // one at a time: a half-ticked list is not a thing anybody reviews, and
    // writing each tap would cost a write per job per person per day.
    if(!STATE_DO.picked || STATE_DO.date !== (live || today)){
      STATE_DO.picked = {}; STATE_DO.date = live || today;
    }
    const picked = STATE_DO.picked;
    // A job that has been approved is done, and the target itself says so.
    // Reading that from the submission instead was wrong twice over: the
    // dashboard only loads submissions still PENDING, so an approved day
    // came back blank on the next open, and adding a one-off job to a day
    // already settled made the whole list look undone again.
    const isDone = j => j.status === 'achieved';
    // Ticks live on screen until the day is settled, so reopening the app
    // after sending it up showed every box empty under "waiting on your
    // head". What was actually sent is on the submission, so that is what
    // the ticks come from once it is gone from this device.
    const sentIds = new Set(sub && sub.status === 'pending' ? (sub.targetIds || []) : []);
    const ticked = j => isDone(j) || picked[j.id] || sentIds.has(j.id);
    const todo = jobs.filter(j => !isDone(j));
    const allDone = todo.length === 0;
    const open = todo.filter(j => !picked[j.id]).length;
    // Locked while a head has it, or when there is nothing left to send.
    const locked = st === 'pending' || allDone;

    const row = j => `
      <div class="do-row ${ticked(j) ? 'picked' : ''}" ${
        locked || isDone(j) ? '' : `data-dojob="${j.id}"`}>
        <span class="do-tick">${ticked(j) ? '&#10003;' : ''}</span>
        <div class="do-body">
          <div class="do-what">${escapeHtml(j.title)}${
            msFor(j) ? `<span class="do-bm" data-doms="${j.id}">BM</span>` : ''}</div>
          ${msFor(j) ? `<div class="do-ms" id="doms-${j.id}" hidden
            >${escapeHtml(msFor(j))}</div>` : ''}
        </div>
      </div>`;

    tEl.innerHTML = `
      ${st === 'rejected' ? `
        <div class="do-warn">
          <b>Sent back${sub.reviewedBy ? ' by ' + escapeHtml(sub.reviewedBy) : ''}.</b>
          ${sub.reviewRemark ? escapeHtml(sub.reviewRemark)
            : 'Have another look, then send it again.'}
        </div>` : ''}
      ${jobs.map(row).join('')}
      <div class="help" style="margin-top:9px;">${
        allDone ? 'Approved — the day is banked.'
        : st === 'pending' ? 'Sent up — waiting on your head.'
        : todo.length < jobs.length
          // Part of the day is already settled and something new has been
          // added since. Only the new work is still theirs to do, and the
          // day has already been paid for, so it is not promised twice.
          ? 'Added since your day was approved — tick it and send it up.'
          : 'Tick each one as you do it, then send the whole day up. Worth '
            + dayPts + ' pts, and the list closes at 05:00.'}</div>
      ${locked ? '' : `
        <button class="btn btn-primary btn-block" id="do-confirm" style="margin-top:8px;"
          ${open ? 'disabled' : ''}>${open
            ? open + ' still to tick'
            : 'Send the day up for review'}</button>`}
      <div id="do-msg" style="margin-top:8px;font-size:12.5px;"></div>
    `;

    tEl.querySelectorAll('[data-dojob]').forEach(el => {
      el.onclick = ev => {
        // Reading the Malay must not tick the job off.
        if(ev.target.closest('[data-doms]')) return;
        const id = el.dataset.dojob;
        if(picked[id]) delete picked[id]; else picked[id] = true;
        renderDoListDay(tEl, body, worker, myTargets, mySubs, ctx);
      };
    });
    tEl.querySelectorAll('[data-doms]').forEach(el => {
      el.onclick = ev => {
        ev.stopPropagation();
        // Toggled in place, so opening the Malay does not disturb the ticks.
        const line = document.getElementById('doms-' + el.dataset.doms);
        if(line) line.hidden = !line.hidden;
      };
    });

    const btn = tEl.querySelector('#do-confirm');
    if(btn) btn.onclick = async () => {
      const msg = document.getElementById('do-msg');
      btn.disabled = true; btn.textContent = 'Sending…';
      msg.style.color = 'var(--muted)'; msg.textContent = '';
      const res = await submitDoListDay(worker, live || today, todo);
      if(res.ok){
        msg.style.color = 'var(--green)';
        msg.textContent = 'Sent up — waiting on your head.';
        setTimeout(() => renderWorkerDashboard(body, worker), 800);
      }else{
        btn.disabled = false; btn.textContent = 'Send the day up for review';
        msg.style.color = 'var(--red)';
        msg.textContent = 'Could not send it (' + res.error
          + '). Tap again when you have signal — this will not send it twice.';
      }
    };
  }
  // Ticks for the day being looked at, kept in memory on purpose.
  const STATE_DO = { picked: null, date: null };

  async function submitDoListDay(worker, date, jobs){
    try{
      const id = daySubId(worker.id, date);
      await db.collection(SUBS_COLLECTION).doc(id).set({
        id, workerId: worker.id, isDay: true, dayDate: date,
        targetId: '', targetIds: jobs.map(j => j.id),
        taskTitle: jobs.length + ' job' + (jobs.length === 1 ? '' : 's') + ' on the list',
        taskKind: 'dolist', hasPhoto: false,
        status: 'pending', submittedAt: new Date().toISOString()
      });
      // Flagged so the 5am sweep leaves them alone while a head still has
      // the day in front of them, exactly as it does a pending task.
      await applyTargetDeltas({ fieldChanges: jobs.reduce((m, j) => {
        m[j.id] = { everSubmitted: true }; return m; }, {}) });
      return { ok: true };
    }catch(e){
      showFbError('Could not send the day: ' + e.message);
      return { ok: false, error: (e.code ? e.code + ' — ' : '') + e.message };
    }
  }

  async function renderWorkerDashboard(body, worker){
