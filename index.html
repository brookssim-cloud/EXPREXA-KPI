      const customer = document.getElementById('ed-cust').value.trim();
      const from = document.getElementById('ed-from').value.trim().toUpperCase();
      const to = document.getElementById('ed-to').value.trim().toUpperCase();
      const flight = document.getElementById('ed-flight').value.trim();
      const dateVal = document.getElementById('ed-date').value;
      const timeVal = document.getElementById('ed-time').value;
      const pcsVal = document.getElementById('ed-pcs').value.trim();
      const edKgEl = document.getElementById('ed-kg');
      const kgVal = edKgEl ? edKgEl.value.trim() : '';
      const edGrossEl = document.getElementById('ed-gross');
      const edChgEl = document.getElementById('ed-chg');
      const grossVal = edGrossEl ? edGrossEl.value.trim() : '';
      const chgVal = edChgEl ? edChgEl.value.trim() : '';
      const grossKg = grossVal ? parseFloat(grossVal) : null;
      const chargeKg = chgVal ? parseFloat(chgVal) : null;
      const pcs = pcsVal ? parseInt(pcsVal,10) : null;
      const kg = isExport ? (grossKg != null && chargeKg != null ? Math.max(grossKg, chargeKg) : null)
                          : (kgVal ? parseFloat(kgVal) : null);
      const msg = document.getElementById('ed-msg');
      // House bills carry the customer, principal, endorsements, route,
      // flight and date, so none of those are asked of the master.
      const edUsingHawbs = document.querySelectorAll('#ed-hawb-list .hawb-row').length > 0;
      if(!awb){ msg.style.color='var(--red)'; msg.textContent='Enter the MAWB number.'; return; }
      if(!edUsingHawbs && !customer){ msg.style.color='var(--red)'; msg.textContent='Enter the customer.'; return; }
      if(!edUsingHawbs){
        if(!from){ msg.style.color='var(--red)'; msg.textContent="Enter the 'from' airport."; return; }
        if(!to){ msg.style.color='var(--red)'; msg.textContent="Enter the 'to' airport."; return; }
        if(!flight){ msg.style.color='var(--red)'; msg.textContent='Enter the flight number.'; return; }
        if(!dateVal){ msg.style.color='var(--red)'; msg.textContent=(isExport?'Enter the departure date.':'Enter the expected arrival date.'); return; }
        if(!timeVal){ msg.style.color='var(--red)'; msg.textContent='Enter the time.'; return; }
      }
      if(!pcsVal){ msg.style.color='var(--red)'; msg.textContent='Enter the number of pieces.'; return; }
      if(isNaN(pcs) || pcs < 0){ msg.style.color='var(--red)'; msg.textContent='Pieces must be a positive number.'; return; }
      if(isExport){
        if(!grossVal){ msg.style.color='var(--red)'; msg.textContent='Enter the gross weight.'; return; }
        if(isNaN(grossKg) || grossKg <= 0){ msg.style.color='var(--red)'; msg.textContent='Gross weight must be more than zero.'; return; }
        if(!chgVal){ msg.style.color='var(--red)'; msg.textContent='Enter the chargeable weight.'; return; }
        if(isNaN(chargeKg) || chargeKg <= 0){ msg.style.color='var(--red)'; msg.textContent='Chargeable weight must be more than zero.'; return; }
      } else {
        if(!kgVal){ msg.style.color='var(--red)'; msg.textContent='Enter the weight.'; return; }
        if(isNaN(kg) || kg < 0){ msg.style.color='var(--red)'; msg.textContent='Weight must be a positive number.'; return; }
      }
      const hawbRead = readHawbs('ed', pcs, isExport ? grossKg : kg);
      if(hawbRead.error){ msg.style.color='var(--red)'; msg.textContent=hawbRead.error; return; }
      // A HAWB that already has deliveries against it can't disappear or
      // shrink below what's already gone out — that would orphan real runs.
      for(const h of hawbProgress(s)){
        if(h.delivered <= 0) continue;
        const kept = hawbRead.hawbs.find(x => x.no === h.no);
        if(!kept){ msg.style.color='var(--red)'; msg.textContent=`HAWB ${h.no} already has ${h.delivered} pcs delivered, so it can't be removed.`; return; }
        if(kept.pcs < h.delivered){ msg.style.color='var(--red)'; msg.textContent=`HAWB ${h.no} already has ${h.delivered} pcs delivered — its pieces can't go below that.`; return; }
      }
      const edPrincipalEl = document.getElementById('ed-principal');
      const edPrincipal = edPrincipalEl ? edPrincipalEl.value : '';
      if(!edUsingHawbs && !edPrincipal){
        msg.style.color='var(--red)';
        msg.textContent = (STATE.principals.length || s.principal)
          ? 'Choose the principal.'
          : 'No principals set up yet — add one under Settings first.';
        return;
      }
      this.disabled = true; this.textContent = 'Checking AWB…';
      if(awbKey(awb) !== awbKey(s.awb)){
        const clash = await findExistingAwb(awb);
        if(clash && clash.id !== s.id){
          this.disabled = false; this.textContent = 'Save changes';
          msg.style.color='var(--red)';
          msg.textContent = `AWB ${clash.awb} already exists — ${clash.customer || 'no customer'}` +
            `${clash.closed ? ', since completed' : ''}.`;
          return;
        }
      }
      const hClash = await findExistingHawbs(hawbRead.hawbs, s.id);
      if(hClash){
        this.disabled = false; this.textContent = 'Save changes';
        msg.style.color='var(--red)';
        msg.textContent = `HAWB ${hClash.hawb} is already on ${hClash.ship.awb}` +
          `${hClash.ship.closed ? ', since completed' : ''}.`;
        return;
      }
      this.textContent = 'Saving…';
      s.awb = awb; s.awbKey = awbKey(awb);
      // The house bills own the customer, principal, endorsements, route,
      // flight and date once there are any.
      const edHs = hawbRead.hawbs;
      s.customer = edHs.length ? commonOf(edHs, 'customer') : customer;
      s.from = edHs.length ? commonOf(edHs, 'from') : from;
      s.to = edHs.length ? commonOf(edHs, 'to') : to;
      s.flight = (edHs.length ? commonOf(edHs, 'flight') : flight) || null;
      s.principal = edHs.length ? commonOf(edHs, 'principal') : edPrincipal;
      // Duty can be filled in after the fact, or corrected — but not once it
      // has been paid, since the paid record is frozen against that figure.
      if(!s.dutyPaid){
        if(edHs.length){
          const d = edHs.reduce((n,h)=> n + (Number(h.dutyFee)||0), 0);
          s.dutyFee = d > 0 ? d : null;
        } else {
          const edDuty = document.getElementById('ed-duty');
          if(edDuty){
            const v = edDuty.value.trim();
            s.dutyFee = v === '' ? null : Math.max(0, Number(v) || 0);
          }
        }
      }
      s.endorsements = isExport ? []
        : edHs.length
          ? ENDORSEMENTS.filter(e => unionOf(edHs, 'endorsements').includes(e))
          : ENDORSEMENTS.filter(e =>
              c.querySelector(`#ed-endorse [data-endorse="${e}"]`).classList.contains('on'));
      s.hawbs = hawbRead.hawbs;
      // Re-sync an export's per-HAWB tracks with the edited list — a new
      // house bill starts at Delivery, a removed one drops out, and if every
      // remaining track is already closed the shipment completes.
      if(s.type === 'export'){ exportTracks(s); closeExportIfDone(s); }
      s.pcs = pcs; s.kg = kg;
      // Cargo type applies either way round, and is the house bills' answer
      // whenever there are any — the master only speaks for itself.
      const edCargoEl = c.querySelector('#ed-cargo');
      setCargo(s, edHs.length ? cargoFromHawbs(edHs)
        : ((edCargoEl && CARGO_KEYS.includes(edCargoEl.value)) ? edCargoEl.value : 'general'));
      if(isExport){
        s.grossKg = grossKg; s.chargeKg = chargeKg;
        s.departDate = dateVal; s.departTime = timeVal;
      } else if(s.lots && s.lots[0] && !s.lots[0].hasArrived){
        // Still pre-arrival — safe to keep the plan in step with the edit.
        s.lots[0].flight = flight; s.lots[0].expectedDate = dateVal;
        s.lots[0].expectedTime = timeVal; s.lots[0].pcsExpected = pcs;
      }
      logActivity(s, 'Shipment details edited', 'edit');
      await saveShipment(s);
      renderDetail(s.id);
    };

    const delGo = document.getElementById('del-go');
    if(delGo) delGo.onclick = async function(){
      const typed = document.getElementById('del-confirm').value.trim();
      const msg = document.getElementById('del-msg');
      if(typed !== s.awb){ msg.style.color='var(--red)'; msg.textContent="That doesn't match the AWB — type it exactly to confirm."; return; }
      const nSv = (s.surveys || []).length;
      if(!confirm(`Delete ${s.awb} permanently? This cannot be undone.`
        + (nSv ? `\n\n${nSv} survey report${nSv>1?'s':''} and ${nSv>1?'their':'its'} charge`
               + `${nSv>1?'s':''} go with it.` : ''))) return;
      this.disabled = true; this.textContent = 'Deleting…';
      const btn = this;
      try{
        const gone = await deleteShipmentFully(s, t => { btn.textContent = t; });
        STATE.shipments = STATE.shipments.filter(x=>x.id!==s.id);
        // The Surveys, Remarks and Charges tabs read their own indexes, so
        // their caches are dropped rather than left showing a deleted lot.
        invalidateSurveyCharges();
        _openSurveys = null;
        Object.keys(_surveysCache).forEach(k => delete _surveysCache[k]);
        Object.keys(_remarksCache).forEach(k => delete _remarksCache[k]);
        _reportAll = null;
        STATE.tab = 'board';
        paintShell();
        if(gone.surveys || gone.photos) console.log('Deleted with the shipment:', gone);
      }catch(e){
        this.disabled = false; this.textContent = 'Delete shipment';
        msg.style.color='var(--red)';
        msg.textContent = 'Could not delete: ' + e.message
          + ' — nothing was removed, or only part of it was. Try again.';
      }
    };
  }

  // Everything a shipment leaves outside its own document. The board reads
  // the shipment, but the Surveys, Remarks and Charges tabs read their own
  // indexes, and photos live in a collection of their own — so deleting the
  // shipment alone leaves survey reports and their charges hanging on a lot
  // that no longer exists, and the photos paying for storage forever.
  function photoIdsOn(s){
    const ids = new Set();
    const add = v => { if(v) ids.add(v); };
    (s.activity || []).forEach(a => add(a.photoId));
    (s.surveys || []).forEach(r => {
      add(r.photoId); add(r.closingPhotoId);
      (r.photoIds || []).forEach(add);
      if(r.chargeOverride) add(r.chargeOverride.photoId);
    });
    (s.lots || []).forEach(l => {
      add(l.photoId);
      (l.photoIds || []).forEach(add);
      (l.deliveries || []).forEach(d => { add(d.photoId); (d.photoIds || []).forEach(add); });
    });
    (s.xtracks || []).forEach(t => { add(t.photoId); (t.photoIds || []).forEach(add); });
    if(s.chargeOverride) add(s.chargeOverride.photoId);
    return [...ids];
  }
  // Deletes the shipment and everything that points at it, in batches so a
  // half-finished delete cannot leave the indexes disagreeing with the board.
  async function deleteShipmentFully(s, onStep){
    const say = t => { if(onStep) onStep(t); };
    say('Finding survey reports…');
    const [svSnap, rmSnap] = await Promise.all([
      withTimeout(db.collection(SURVEYS).where('shipId','==', s.id).get(), 15000, 'Finding survey reports'),
      withTimeout(db.collection(REMARKS).where('shipId','==', s.id).get(), 15000, 'Finding remarks')
    ]);
    // Photos in R2 are not Firestore documents and cannot ride in the batch,
    // so they are removed on their own. The ones still in Firestore — every
    // photo taken before the move — go in the batch exactly as before.
    const allPhotoIds = photoIdsOn(s);
    const inR2 = photoWorkerOn() ? allPhotoIds.filter(isR2Id) : [];
    const inFirestore = allPhotoIds.filter(id => !inR2.includes(id));
    const refs = []
      .concat(svSnap.docs.map(d => d.ref))
      .concat(rmSnap.docs.map(d => d.ref))
      .concat(inFirestore.map(id => db.collection(PHOTOS).doc(id)));
    if(inR2.length){
      say(`Deleting photos… 0/${inR2.length}`);
      for(let i = 0; i < inR2.length; i++){
        await dropPhoto(inR2[i]);
        if((i + 1) % 10 === 0) say(`Deleting photos… ${i + 1}/${inR2.length}`);
      }
    }
    // Firestore caps a batch at 500 writes; 400 leaves room and keeps each
    // round trip small.
    for(let i = 0; i < refs.length; i += 400){
      say(`Deleting attachments… ${Math.min(i + 400, refs.length)}/${refs.length}`);
      const batch = db.batch();
      refs.slice(i, i + 400).forEach(r => batch.delete(r));
      await withTimeout(batch.commit(), 20000, 'Deleting attachments');
    }
    say('Deleting the shipment…');
    await withTimeout(db.collection(SHIP).doc(s.id).delete(), 15000, 'Deleting shipment');
    return { surveys: svSnap.size, remarks: rmSnap.size, photos: photoIdsOn(s).length };
  }

      } else {

      const hawbRead = readHawbs('ns', pcs, isExp ? grossKg : kg);

      const hawbs = hawbRead.hawbs;
      const principalEl = document.getElementById('ns-principal');

      if(!usingHawbs && !principal){

      this.disabled = true; this.textContent = 'Checking AWB…';
      // The board only holds OPEN shipments, so checking that list alone let
      // a duplicate through whenever the first one had already been closed.
      // This asks Firestore directly, and matches loosely so the same number
      // typed with or without its dash still counts as the same AWB.
      const clash = await findExistingAwb(awb);
      if(clash){
        this.disabled = false; this.textContent = 'Create';
        msg.style.color='var(--red)';
        msg.textContent = `AWB ${clash.awb} already exists — ${clash.customer || 'no customer'}, created ` +
          `${dayOf(clash.createdAt)}${clash.closed ? ' and since completed' : ''}.`;
        return;
      }
      const hClash = await findExistingHawbs(hawbs, null);
      if(hClash){
        this.disabled = false; this.textContent = 'Create';
        msg.style.color='var(--red)';
        msg.textContent = `HAWB ${hClash.hawb} is already on ${hClash.ship.awb}` +
          `${hClash.ship.customer ? ' — ' + hClash.ship.customer : ''}` +
          `${hClash.ship.closed ? ', since completed' : ''}.`;
        return;
      }
      this.textContent = 'Creating…';
      const now = new Date().toISOString();
      const s = {
        id: uid(), awb, awbKey: awbKey(awb), type,
        // With house bills the customer and principal are theirs; the master
        // reports what they agree on, and MIXED where they differ.
        customer: hawbs.length ? commonOf(hawbs, 'customer') : customer,
        principal: hawbs.length ? commonOf(hawbs, 'principal') : principal,
        // Declared per house bill once there are any; the master carries the
        // total, which is what gets paid to Customs in one go.
        dutyFee: (()=>{
          if(hawbs.length){
            const d = hawbs.reduce((n,h)=> n + (Number(h.dutyFee)||0), 0);
            return d > 0 ? d : null;
          }
          const v = document.getElementById('ns-duty').value.trim();
          return v === '' ? null : Math.max(0, Number(v) || 0); })(),
        endorsements: type === 'export' ? []
          : hawbs.length
            ? ENDORSEMENTS.filter(e => unionOf(hawbs, 'endorsements').includes(e))
            : ENDORSEMENTS.filter(e => endorsed.has(e)),
        // With house bills the route and flight live on them, so the master
        // reports whatever they agree on — and MIXED where they differ.
        from: hawbs.length ? commonOf(hawbs, 'from') : from,
        to:   hawbs.length ? commonOf(hawbs, 'to')   : to,
        createdAt: now, createdBy: ME.name,
        notes: [], closed:false, closedDate:null, pcs, kg,
        flight: (hawbs.length ? commonOf(hawbs, 'flight') : flight) || null, hawbs,
        stepsVersion: STEPS_VERSION
      };
      // Cargo type, either way round: the house bills' answer where there are
      // any, otherwise what was chosen on the master. An import's answer was
      // previously read and then dropped, so only exports ever recorded it.
      setCargo(s, hawbs.length ? cargoFromHawbs(hawbs) : nsCargo());
      if(type === 'export'){
        s.stage = 0; s.stageAt = now; s.chasedDate = null;
        // The earliest house bill is when the shipment starts moving.
        const hd = hawbs.map(h => h.date).filter(Boolean).sort();
        s.departDate = (hawbs.length ? (hd[0] || null) : (dateVal || null));
        s.departTime = (hawbs.length ? (hawbs.find(h => h.date === hd[0]) || {}).time || null
                                     : (timeVal || null));
        s.grossKg = grossKg; s.chargeKg = chargeKg;
      } else if(hawbs.length){
        // Each house bill flies on its own, so each starts as its own lot —
        // its own flight, its own expected date, its own clearance.
        s.lots = hawbs.map(h => ({ id: uid(), hasArrived:false, hasK1: !!h.k1,
          stage: 0, pcsExpected: h.pcs,
          expectedDate: h.date || null, expectedTime: h.time || null, flight: h.flight || null,
          hawbs: [h.no], stageAt: now, deliveries:[], closed:false, chasedDate:null }));
      } else {
        s.lots = [{ id: uid(), hasArrived:false, hasK1: k1Choice==='yes',
          stage: 0, pcsExpected: pcs,
          expectedDate: dateVal || null, expectedTime: timeVal || null, flight: flight || null,
          stageAt: now, deliveries:[], closed:false, chasedDate:null }];
      }
      logActivity(s, `Shipment created — ${type === 'export' ? 'Export' : 'Import'}, ${pcs} pcs, ` +
        `${isExp ? `${grossKg} kg gross / ${chargeKg} kg chargeable` : `${kg} kg`}` +
        `${cargoOf(s) !== 'general' ? ` · ${cargoLabel(cargoOf(s)).toUpperCase()}` : ''}` +
        `${hawbs.length ? `, ${hawbs.length} HAWB` : ''} · ${principal}` +
        `${s.endorsements.length ? ` · endorsement: ${s.endorsements.join(', ')}` : ''}`, 'created');
      await saveShipment(s);
      STATE.shipments.push(s);
      paintShell();
    };
  }

  // ============================================================
  // Alerts
  // ============================================================
  function paintAlerts(c, groups){
    const total = groups.stuck.length+groups.balance.length+groups.deliver.length+groups.missing.length;
    if(total === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">${STATE.shipments.length}</div>
          <div class="l">open, moving normally</div></div></div>
        <div class="quiet"><div class="big">All clear</div>
          <div class="sm">Nothing has been sitting longer than it should.</div></div>`;
      return;
    }
    function block(title, items){
      if(!items.length) return '';
      return `<div class="grp"><span>${title}</span><span class="c">${items.length}</span></div>` +
        items.map(a=>`
          <div class="al ${a.level==='red'?'red':a.level==='amb'?'amb':'gry'}">
            <div class="al-body" data-goto="${a.s.id}">
              <div class="al-top"><span class="al-what">${escapeHtml(a.what)}</span>
                <span class="al-age ${a.level==='red'?'red':'amb'}">${escapeHtml(a.age)}</span></div>
              <div class="al-who">${escapeHtml(a.s.customer||'')} &middot; ${escapeHtml(a.s.awb)}</div>
            </div>
            <div class="al-acts">
              <button data-goto2="${a.s.id}">Open</button>
              ${CAN_EDIT && a.chaseKey ? `<button data-chase="${escapeHtml(a.chaseKey)}">Chased today</button>` : ''}
            </div>
          </div>`).join('');
    }
    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n warn">${total}</div>
        <div class="l">need attention</div></div></div>
      ${block('STUCK TOO LONG', groups.stuck)}
      ${block('BALANCE NOT ARRIVED', groups.balance)}
      ${block('RELEASED, NOT DELIVERED', groups.deliver)}
      ${block('MISSING DETAILS', groups.missing)}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto],[data-goto2]').forEach(el=>{
      el.onclick = () => renderDetail(el.dataset.goto || el.dataset.goto2);
    });
    c.querySelectorAll('[data-chase]').forEach(el=>{
      el.onclick = async () => {
        const key = el.dataset.chase;
        const [sid, li] = key.split('|');
        const s = STATE.shipments.find(x=>x.id===sid);
        if(!s) return;
        if(li===undefined || li===''){ s.chasedDate = todayStr(); }
        else if(li.startsWith('x')){ const t = exportTracks(s)[+li.slice(1)]; if(t) t.chasedDate = todayStr(); }
        else { s.lots[+li].chasedDate = todayStr(); }
        await saveShipment(s);
        paintShell();
      };
    });
  }

  // ============================================================
  // Do list — what one person still has to clear today
  // ============================================================
  // The role's standing checklist — the same jobs every working day, in the
  // order the admin wrote them. A fresh copy each morning, because the day
  // record is keyed on the date and yesterday's ticks live in yesterday's.
  function doItems(role){
    return ((role && role.tasks) || []).map((t, i) => ({
      source:'task', key:'task:' + t.id, text: t.text, n: i + 1
    }));
  }

  // One record per person per day. It holds what they cleared and their
  // end-of-day sign-off, and nothing else — the list itself is always
  // derived, so a record can never disagree with the shipments.
  function doLogId(workerId, date){ return workerId + '_' + date; }
  async function loadDoDay(){
    if(!ME) return;
    const day = doDayStr();
    if(!day){ STATE.doLog = null; return; }   // in the gap, there is no list to load
    const id = doLogId(ME.id, day);
    if(STATE.doLog && STATE.doLog.id === id) return;
    const blank = { id, workerId: ME.id, name: ME.name, date: day, done: [], signedOff: false };
    try{
      const doc = await withTimeout(db.collection(DOLOG).doc(id).get(), 15000, 'Loading your list');
      STATE.doLog = doc.exists ? doc.data() : blank;
    }catch(e){
      console.error('Could not load the day record:', e);
      STATE.doLog = blank;
    }
  }
  async function saveDoDay(){
    if(!STATE.doLog) return false;
    // How many jobs the day was asked for, kept on the record itself. A role
    // can be rewritten next week, and without this there would be no way to
    // say afterwards how much of that day was actually got through.
    const role = myDoRole();
    STATE.doLog.expected = Math.max(
      Number(STATE.doLog.expected) || 0, doItems(role).length + myDoTasks(role).length);
    try{
      await db.collection(DOLOG).doc(STATE.doLog.id).set(STATE.doLog);
      return true;
    }catch(e){
      console.error('Could not save the day record:', e);
      return false;
    }
  }
  // Everything waiting on a head. One indexed field, so it stays one read
  // however many days pile up behind an approver who has been away.
  async function loadDoPending(){
    try{
      const snap = await withTimeout(
        db.collection(DOLOG).where('status','==','pending').get(), 15000, 'Loading days to approve');
      STATE.doPending = snap.docs.map(d => d.data())
        .sort((a,b) => String(a.date + a.name).localeCompare(String(b.date + b.name)));
    }catch(e){
      console.error('Could not load the days waiting for approval:', e);
      STATE.doPending = [];
    }
  }
  // ---- the points pool ----
  // One document holding every person's running total, so showing the board
  // costs a single read however many days have been worked. The day records
  // remain the truth: each approved one carries what it earned, and Recount
  // rebuilds this from them if the two ever drift.
  async function loadDoPoints(){
    try{
      const doc = await withTimeout(db.collection(CONFIG).doc(DOPOINTS).get(),
        15000, 'Loading points');
      const v = doc.exists ? (doc.data().value || {}) : {};
      STATE.doPoints = { byWorker: v.byWorker || {}, updatedAt: v.updatedAt || null,
        season: v.season || null, past: v.past || [] };
    }catch(e){
      console.error('Could not load points:', e);
      STATE.doPoints = null;   // null means unknown, not zero
    }
  }
  function doSeasonLabel(){
    const s = STATE.doPoints && STATE.doPoints.season;
    if(!s) return 'All time';
    return (s.name || 'Season') + (s.startedAt ? ' &middot; since ' + dayOf(s.startedAt) : '');
  }

  // Close the season and start the next. Totals go to zero so everyone is
  // level again; the finishing table is kept so last season's winner is
  // still a matter of record. Only the last few are kept here — the day
  // records themselves carry what each day earned, and they are the truth
  // if anyone ever needs to go back further.
  const DO_SEASONS_KEPT = 6;
  async function startNewDoSeason(name){
    const ref = db.collection(CONFIG).doc(DOPOINTS);
    try{
      await db.runTransaction(async tx => {
        const doc = await tx.get(ref);
        const v = doc.exists ? (doc.data().value || {}) : {};
        const ending = v.season || { name: 'Season 1', startedAt: null };
        const past = (v.past || []).concat([Object.assign({}, ending, {
          endedAt: new Date().toISOString(), byWorker: v.byWorker || {} })])
          .slice(-DO_SEASONS_KEPT);
        tx.set(ref, { value: {
          season: { name: name, startedAt: new Date().toISOString() },
          byWorker: {}, past, updatedAt: new Date().toISOString() } });
      });
      await loadDoPoints();
      return true;
    }catch(e){
      console.error('Could not start the season:', e);
      return false;
    }
  }
  // Rebuild the totals from the day records. The running total is kept by
  // adding and subtracting as days are approved, which is cheap but means a
  // write that failed halfway leaves it a little out. This reads the days
  // back and says what the answer should have been.
  async function recountDoPoints(){
    const season = (STATE.doPoints && STATE.doPoints.season) || null;
    const from = season && season.startedAt ? dayOf(season.startedAt) : null;
    const perDay = (STATE.doCfg && STATE.doCfg.dayPoints);
    const snap = await withTimeout(
      db.collection(DOLOG).where('status','==','approved').get(), 30000, 'Reading the days');
    const byWorker = {};
    snap.docs.forEach(d => {
      const l = d.data();
      if(from && String(l.date || '') < from) return;   // belongs to a closed season
      // Days approved before points existed carry no figure, so the rule is
      // applied to them rather than counting them as nothing.
      const p = l.points != null ? (Number(l.points) || 0) : doDayEarned(l, perDay);
      if(!l.workerId) return;
      const e = byWorker[l.workerId] = byWorker[l.workerId] || { name: l.name || '', points:0, days:0 };
      if(l.name) e.name = l.name;
      e.points += p;
      if(p > 0) e.days += 1;
    });
    const ref = db.collection(CONFIG).doc(DOPOINTS);
    await db.runTransaction(async tx => {
      const doc = await tx.get(ref);
      const v = doc.exists ? (doc.data().value || {}) : {};
      tx.set(ref, { value: Object.assign({}, v,
        { byWorker, updatedAt: new Date().toISOString() }) });
    });
    await loadDoPoints();
    return { people: Object.keys(byWorker).length,
      points: Object.values(byWorker).reduce((n,e)=> n + (Number(e.points)||0), 0) };
  }

  // Settle a day and move the pool in one transaction.
  //
  // The points were worked out from the copy of the day held in memory,
  // which is loaded once a session. A day can sit in two heads' queues at
  // the same time — the approvals list says so when it does — and one
  // person can have it open on a phone and a laptop. Each of those copies
  // says the day has earned nothing yet, so each approval paid it again.
  //
  // Reading the stored record inside the transaction fixes that for good:
  // the difference is measured against what is actually on the day, so a
  // second approval of an already-paid day finds nothing left to pay.
  async function settleDoDay(log, status, extra, perDay){
    const logRef = db.collection(DOLOG).doc(log.id);
    const poolRef = db.collection(CONFIG).doc(DOPOINTS);
    let next = null;
    try{
      await db.runTransaction(async tx => {
        // Firestore wants every read before any write.
        const [logDoc, poolDoc] = await Promise.all([tx.get(logRef), tx.get(poolRef)]);
        const cur = logDoc.exists ? logDoc.data() : log;
        const had = Number(cur.points) || 0;
        const earns = status === 'approved' ? doDayEarned(cur, perDay) : 0;
        next = Object.assign({}, cur, { status }, extra || {}, { points: earns });
        tx.set(logRef, next);
        if(earns !== had){
          const v = poolDoc.exists ? (poolDoc.data().value || {}) : {};
          const byWorker = v.byWorker || {};
          const wid = cur.workerId || log.workerId;
          const e = byWorker[wid] = byWorker[wid] || { name: cur.name || '', points: 0, days: 0 };
          if(cur.name) e.name = cur.name;
          e.points = Math.max(0, (Number(e.points) || 0) + (earns - had));
          e.days   = Math.max(0, (Number(e.days)   || 0) + ((earns > 0 ? 1 : 0) - (had > 0 ? 1 : 0)));
          tx.set(poolRef, { value: Object.assign({}, v,
            { byWorker, updatedAt: new Date().toISOString() }) });
        }
      });
    }catch(e){
      console.error('Could not settle the day:', e);
      return null;
    }
    // Keep what is on screen in step with what was just written.
    if(STATE.doLog && STATE.doLog.id === next.id) STATE.doLog = next;
    if(STATE.doPending){
      STATE.doPending = STATE.doPending.filter(x => x.id !== next.id);
      if(status === 'pending') STATE.doPending.push(next);
    }
    await loadDoPoints();
    return next;
  }

  async function setDoStatus(log, status, extra){
    const next = Object.assign({}, log, { status }, extra || {});
    try{
      await db.collection(DOLOG).doc(next.id).set(next);
    }catch(e){
      console.error('Could not save the approval:', e);
      return false;
    }
    if(STATE.doLog && STATE.doLog.id === next.id) STATE.doLog = next;
    if(STATE.doPending){
      STATE.doPending = STATE.doPending.filter(x => x.id !== next.id);
      if(status === 'pending') STATE.doPending.push(next);
    }
    return true;
  }

  async function loadDoTasks(){
    if(!ME) return;
    try{
      const snap = await withTimeout(
        db.collection(DOTASKS).where('open','==',true).get(), 15000, 'Loading added tasks');
      STATE.doTasks = snap.docs.map(d => d.data());
    }catch(e){ console.error('Could not load added tasks:', e); STATE.doTasks = []; }
  }
  // The ad-hoc jobs an admin added that belong to this person: either aimed
  // at them by name, or at the role they hold.
  function myDoTasks(role){
    return (STATE.doTasks || []).filter(t =>
      t.open && (t.workerId === ME.id || (t.roleId && role && t.roleId === role.id)));
  }
  function doneKeys(){
    return new Set(((STATE.doLog && STATE.doLog.done) || []).map(d => d.key));
  }
  // What is still to do, after taking out whatever has already been ticked.
  function openDoItems(role){
    const done = doneKeys();
    const derived = doItems(role).filter(i => !done.has(i.key));
    const adhoc = myDoTasks(role).filter(t => !done.has('adhoc:' + t.id)).map(t => ({
      source:'adhoc', key:'adhoc:' + t.id, text: t.text, awb:'', customer: t.by ? 'added by ' + t.by : '',
      shipId: null, age: t.due || '', level:'gry', taskId: t.id
    }));
    return adhoc.concat(derived);
  }

  // The end-of-day check: past the cutoff, with things still open and no
  // sign-off yet. Shown on every tab, not just this one, so it reaches
  // somebody who is about to walk out of the office.
  function doCutoffPassed(){
    const now = new Date();
    // Past midnight the list is in its last few hours whatever the cutoff
    // says, so a night shift is warned too rather than being told nothing
    // until the sun comes up.
    if(now.getHours() < DO_DAY_ENDS) return true;
    const cut = (STATE.doCfg && STATE.doCfg.cutoff) || '17:30';
    const m = /^(\d{1,2}):(\d{2})$/.exec(cut);
    if(!m) return false;
    return (now.getHours() * 60 + now.getMinutes()) >= (+m[1] * 60 + +m[2]);
  }

  // The pool. Everyone's total in one place — the point of points is that
  // they can be compared, and it is one read for the whole board. Drawn for
  // anyone who opens the tab, including a head with no list of their own:
  // the people whose days they approve are on it, so it is arguably more
  // their business than anyone's.
  function doPoolHtml(){
    if(!STATE.doPoints) return '';
    const by = STATE.doPoints.byWorker || {};
    const onTheList = hasDoList();
    const rows = Object.keys(by).map(id => Object.assign({ id }, by[id]))
      // Someone yet to earn is only shown their own empty row, and only if
      // they are actually on a list — a head who holds none is not a
      // competitor and should not appear among them at zero.
      .filter(r => (Number(r.points) || 0) > 0 || (onTheList && r.id === ME.id))
      .sort((a,b) => (Number(b.points)||0) - (Number(a.points)||0)
        || String(a.name||'').localeCompare(String(b.name||'')));
    const head = `<div class="grp"><span>POINTS POOL</span>${
        rows.length ? `<span class="c">${rows.length}</span>` : ''}</div>
      <div style="padding:2px 16px 7px;font-size:11px;color:var(--muted);">${doSeasonLabel()}</div>`;
    // An empty board still says so, rather than the tab looking as though
    // the feature were not there at all.
    if(!rows.length) return head + `<div style="padding:0 16px 14px;font-size:12px;color:var(--muted);">
      Nothing earned yet this season.</div>`;
    return head + rows.map((r, n) => `
      <div class="do-row${r.id === ME.id ? ' picked' : ''}" style="cursor:default;">
        <span class="do-tick" style="font-size:12px;color:var(--muted);">${n + 1}</span>
        <div class="do-body" style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;">
          <div class="do-what">${escapeHtml(r.name || r.id)}${
            r.id === ME.id ? ' <span style="color:var(--muted);font-weight:400;">(you)</span>' : ''}</div>
          <div style="white-space:nowrap;font-weight:700;">${Number(r.points)||0}
            <span style="font-size:11px;color:var(--muted);font-weight:500;">
              &middot; ${Number(r.days)||0} day${(Number(r.days)||0)===1?'':'s'}</span></div>
        </div>
      </div>`).join('');
  }

  async function paintDoList(c){
    const role = myDoRole();
    if(!role && !isApprover()){
      c.innerHTML = `<div class="quiet"><div class="big">Not on the list</div>
        <div class="sm">Ask your admin to give you a Do list role.</div></div>`;
      return;
    }
    // A head who holds no list of their own gets the approvals screen alone.
    if(!role){
      if(STATE.doPending === null || !(STATE.workers || []).length){
        c.innerHTML = `<div class="empty">Loading days to approve…</div>`;
        if(STATE.doPending === null) await loadDoPending();
        // Names, so a day shared with another head can say whose it also is.
        if(!(STATE.workers || []).length){
          try{ STATE.workers = await getWorkers(); }catch(e){ STATE.workers = []; }
        }
        if(STATE.doPoints === null) await loadDoPoints();
        if(STATE.tab !== 'dolist') return;
      }
      if(STATE.doPoints === null) await loadDoPoints();
      c.innerHTML = (approvalsHtml() ||
        `<div class="quiet"><div class="big">Nothing to approve</div>
          <div class="sm">Days appear here once your team finishes them.</div></div>`)
        + doPoolHtml();
      wireApprovals(c);
      return;
    }
    const day = doDayStr();
    if(!day){
      c.innerHTML = `
        <div class="quiet"><div class="big">Between lists</div>
          <div class="sm">Last night's list closed at ${String(DO_DAY_ENDS).padStart(2,'0')}:00.
            Today's opens at ${doDayLabel()}.</div></div>`;
      return;
    }
    if(!STATE.doLog || STATE.doLog.date !== day || (isApprover() && STATE.doPending === null)){
      c.innerHTML = `<div class="empty">Loading your list…</div>`;
      if(!STATE.doLog || STATE.doLog.date !== day){
        STATE.doLog = null;
        await loadDoDay();
        await loadDoTasks();
      }
      if(isApprover() && STATE.doPending === null) await loadDoPending();
      if(STATE.doPoints === null) await loadDoPoints();
      if(STATE.tab !== 'dolist' || !STATE.doLog) return;
    }
    // One document, read once a session — a tab reopened all day does not
    // pay for it again.
    if(STATE.doPoints === null) await loadDoPoints();
    // Only the admin's add-a-job picker needs names, so this read waits
    // until somebody who can actually use it opens the tab.
    // Names are needed by the admin's add-a-job picker and by a head whose
    // queue has to say which other head a day also went to.
    if((IS_ADMIN || isApprover()) && !(STATE.workers || []).length){
      try{ STATE.workers = await getWorkers(); }catch(e){ STATE.workers = []; }
    }

    const open = openDoItems(role);
    const done = ((STATE.doLog && STATE.doLog.done) || []);
    const picked = Object.keys(STATE.doPicked).filter(k => STATE.doPicked[k]);
    const late = doCutoffPassed();
    // A sign-off only stands while the list is actually empty. If a job lands
    // afterwards — an admin adds one, or the role gains a line — the day is
    // not finished any more and the warning has to come back, whatever was
    // written earlier. The stored flag is cleared the next time anything is
    // confirmed; until then this is what decides.
    const st = doStatus(STATE.doLog);
    const signed = (st === 'pending' || st === 'approved') && open.length === 0;

    const daily = open.filter(i => i.source === 'task');
    const extra = open.filter(i => i.source === 'adhoc');

    const row = i => `
      <div class="do-row ${STATE.doPicked[i.key]?'picked':''}" data-do="${escapeHtml(i.key)}">
        <span class="do-tick">${STATE.doPicked[i.key] ? '&#10003;' : ''}</span>
        <div class="do-body">
          <div class="do-what">${escapeHtml(i.text)}</div>
          ${i.customer ? `<div class="do-sub">${escapeHtml(i.customer)}</div>` : ''}
        </div>
      </div>`;

    c.innerHTML = `
      ${st === 'returned' ? `
        <div class="do-warn" style="background:#FCE9E9;color:#8A2E2E;">
          <b>Sent back by ${escapeHtml(STATE.doLog.returnedBy || 'your head')}.</b>
          ${STATE.doLog.remark ? escapeHtml(STATE.doLog.remark) : 'Have another look, then send it again.'}
        </div>` : ''}
      ${late && open.length && !signed ? `
        <div class="do-warn">
          <b>Before you finish:</b> ${open.length} job${open.length===1?'':'s'} still open on your list.
          Clear what you can, then send it up.
        </div>` : ''}
      ${isApprover() ? approvalsHtml() : ''}
      <div class="counts">
        <div class="count"><div class="n ${open.length?'warn':''}">${open.length}</div><div class="l">still to do</div></div>
        <div class="count"><div class="n">${done.length}</div><div class="l">ticked today</div></div>
        ${(() => {
          const mine = (STATE.doPoints && STATE.doPoints.byWorker[ME.id]) || null;
          const total = mine ? (Number(mine.points) || 0) : 0;
          // What today adds, and whether it is banked yet. Saying "+50 when
          // approved" while the list is still open is the whole point of
          // showing it here: it is the day's prize, in view while it can
          // still be won.
          const perDay = (STATE.doCfg && STATE.doCfg.dayPoints);
          const todayWorth = doDayEarned(
            { done, expected: done.length + open.length }, perDay);
          const note = st === 'approved' ? (Number(STATE.doLog.points) > 0 ? 'banked today' : 'no points today')
            : open.length ? 'points &middot; +' + (Number(perDay) >= 0 ? perDay : DO_DAY_POINTS) + ' if you clear it'
            : st === 'pending' ? 'points &middot; +' + todayWorth + ' once approved'
            : 'points &middot; +' + todayWorth + ' to claim';
          return `<div class="count"><div class="n">${STATE.doPoints ? total : '—'}</div>
            <div class="l">${note}</div></div>`;
        })()}
      </div>
      <div style="margin:0 16px 10px;font-size:11.5px;color:var(--muted);line-height:1.6;">
        ${escapeHtml(role.name)} &middot; tick each one as you do it, then confirm.
        This list runs until ${String(DO_DAY_ENDS).padStart(2,'0')}:00 and a fresh one
        opens at ${doDayLabel()}.
      </div>
      ${open.length === 0 ? `
        <div class="quiet">
          <div class="big">${st === 'approved' ? 'Approved'
            : st === 'pending' ? 'With your head' : 'All done'}</div>
          <div class="sm">${st === 'approved'
            ? `${escapeHtml(STATE.doLog.approvedBy || 'Your head')} approved this day${
                STATE.doLog.approvedAt ? ' at ' + fmtClock(STATE.doLog.approvedAt) : ''}.`
            : st === 'pending' ? 'Sent for approval. Nothing more to do unless it comes back.'
            : 'Everything on your list is ticked. Send it to your head when you finish.'}</div></div>
        ${(st === 'pending' || st === 'approved') ? '' :
          `<div style="margin:0 16px;"><button class="lot-act" id="do-signoff"
            style="width:100%;">Finish &amp; send for approval</button></div>`}`
        : `${daily.length ? `<div class="grp"><span>TODAY</span>
             <span class="c">${daily.length}</span></div>${daily.map(row).join('')}` : ''}
           ${extra.length ? `<div class="grp"><span>ADDED BY ADMIN</span>
             <span class="c">${extra.length}</span></div>${extra.map(row).join('')}` : ''}`}
      ${done.length ? `
        <div class="grp"><span>DONE TODAY</span><span class="c">${done.length}</span></div>
        ${done.slice().reverse().map(d => `
          <div class="do-row done">
            <span class="do-tick">&#10003;</span>
            <div class="do-body">
              <div class="do-what">${escapeHtml(d.text)}</div>
              <div class="do-sub">${escapeHtml(fmtClock(d.at))}</div>
            </div>
          </div>`).join('')}` : ''}
      ${doPoolHtml()}
      ${IS_ADMIN ? `
        <div class="grp"><span>ADD A JOB</span></div>
        <div class="card" style="padding:12px 15px;">
          <div style="font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:9px;">
            A one-off, on top of the daily list. It stays on theirs until it's ticked, then it's gone.
          </div>
          <input id="do-task-text" placeholder="What needs doing" style="width:100%;padding:9px 11px;
            border:1.5px solid var(--line);border-radius:9px;font-size:13px;margin-bottom:8px;">
          <div style="display:flex;gap:7px;">
            <select id="do-task-who" style="flex:1;min-width:0;padding:9px;border:1.5px solid var(--line);
              border-radius:9px;font-size:12.5px;background:var(--card);">
              <option value="">Choose who…</option>
              ${(STATE.doCfg.roles||[]).map(r=>`<option value="r:${escapeHtml(r.id)}"
                >Everyone: ${escapeHtml(r.name)}</option>`).join('')}
              ${(STATE.workers||[]).filter(w => (STATE.doCfg.assign||{})[w.id])
                .map(w=>`<option value="w:${escapeHtml(w.id)}">${escapeHtml(w.name)}</option>`).join('')}
            </select>
            <button class="lot-act ghost" id="do-task-add"
              style="width:auto;flex:0 0 auto;padding:9px 14px;font-size:12px;border-radius:9px;">Add</button>
          </div>
        </div>` : ''}
      <div style="height:${picked.length ? 86 : 20}px;"></div>
      ${picked.length ? `
        <div class="do-bar">
          <button id="do-confirm">Confirm ${picked.length} done</button>
          <button id="do-clear" class="ghost">Clear</button>
        </div>` : ''}`;

    c.querySelectorAll('[data-do]').forEach(el => {
      el.onclick = () => {
        const k = el.dataset.do;
        if(STATE.doPicked[k]) delete STATE.doPicked[k]; else STATE.doPicked[k] = true;
        paintShell();
      };
    });
    const clr = document.getElementById('do-clear');
    if(clr) clr.onclick = () => { STATE.doPicked = {}; paintShell(); };
    const conf = document.getElementById('do-confirm');
    if(conf) conf.onclick = async () => {
      conf.disabled = true; conf.textContent = 'Saving…';
      const ok = await confirmDoItems(open.filter(i => STATE.doPicked[i.key]));
      if(!ok){ conf.disabled = false; conf.textContent = 'Confirm'; alert('Could not save — try again.'); return; }
      STATE.doPicked = {};
      paintShell();
    };
    const addTask = document.getElementById('do-task-add');
    if(addTask) addTask.onclick = async () => {
      const txt = document.getElementById('do-task-text');
      const who = document.getElementById('do-task-who');
      const text = (txt.value || '').trim();
      if(!text){ txt.style.borderColor = 'var(--red)'; return; }
      if(!who.value){ who.style.borderColor = 'var(--red)'; return; }
      addTask.disabled = true; addTask.textContent = 'Adding…';
      const t = { id: 'dt' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        text, open: true, by: ME.name, at: new Date().toISOString(),
        workerId: who.value.startsWith('w:') ? who.value.slice(2) : null,
        roleId:   who.value.startsWith('r:') ? who.value.slice(2) : null };
      try{
        await db.collection(DOTASKS).doc(t.id).set(t);
        STATE.doTasks = (STATE.doTasks || []).concat([t]);
      }catch(e){
        addTask.disabled = false; addTask.textContent = 'Add';
        alert('Could not add that — try again.');
        return;
      }
      paintShell();
    };
    const so = document.getElementById('do-signoff');
    if(so) so.onclick = async () => {
      so.disabled = true; so.textContent = 'Sending…';
      const at = new Date().toISOString();
      STATE.doLog.signedOff = true;
      STATE.doLog.signedOffAt = at;
      STATE.doLog.status = 'pending';
      STATE.doLog.submittedAt = at;
      // Stamped now, so the day stays in the queue of the heads it was sent
      // to even if the clerk is moved under somebody else next week.
      STATE.doLog.headIds = headsOf(ME.id);
      delete STATE.doLog.remark;
      if(!await saveDoDay()){
        STATE.doLog.signedOff = false;
        STATE.doLog.status = 'open';
        so.disabled = false; so.textContent = 'Finish & send for approval';
        alert('Could not send — try again.');
        return;
      }
      paintShell();
    };
    wireApprovals(c);
  }

  // ---- the head's queue: one decision per person per day ----
  function approvalsHtml(){
    const list = myPendingDays();
    if(!list.length) return '';
    return `
      <div class="grp"><span>TO APPROVE</span><span class="c">${list.length}</span></div>
      ${list.map(l => {
        const done = (l.done || []);
        const want = Math.max(Number(l.expected) || 0, done.length);
        const missed = Math.max(0, want - done.length);
        const last = done.length ? done[done.length - 1].at : l.submittedAt;
        return `
        <div class="do-appr ${missed ? 'short' : ''}">
          <div class="do-appr-top">
            <div>
              <div class="do-what">${escapeHtml(l.name || l.workerId)}</div>
              <div class="do-sub">${escapeHtml(l.date)} &middot; ${done.length} of ${want} done${
                missed ? ` &middot; ${missed} missed` : ''}${
                last ? ` &middot; finished ${escapeHtml(fmtClock(last))}` : ''}</div>
              ${(() => {
                const owners = headsOnLog(l);
                if(!owners.length) return `<div class="do-sub" style="color:var(--amber-dk);"
                  >Nobody is set as their head &mdash; showing to everyone</div>`;
                const others = owners.filter(id => id !== ME.id);
                // With a second head on it, say so — either of you can settle
                // it, and the other should know it may vanish.
                return others.length ? `<div class="do-sub">Also with ${
                  escapeHtml(headNames(others).join(', '))}</div>` : '';
              })()}
            </div>
            <span class="do-age">${missed ? missed + ' short' : 'all done'}</span>
          </div>
          ${done.length ? `<div class="do-appr-jobs">${done.map(d =>
            `<div>&#10003; ${escapeHtml(d.text)} <span style="color:var(--muted);">${
              escapeHtml(fmtClock(d.at))}</span></div>`).join('')}</div>` : ''}
          <div class="do-appr-acts">
            <button data-appr="${escapeHtml(l.id)}">Approve</button>
            <button class="ghost" data-sback="${escapeHtml(l.id)}">Send back</button>
          </div>
        </div>`;
      }).join('')}`;
  }

  function wireApprovals(c){
    c.querySelectorAll('[data-appr]').forEach(btn => {
      btn.onclick = async () => {
        const log = myPendingDays().find(x => x.id === btn.dataset.appr);
        if(!log) return;
        btn.disabled = true; btn.textContent = 'Saving…';
        const ok = await settleDoDay(log, 'approved',
          { approvedBy: ME.name, approvedAt: new Date().toISOString(), remark: '' },
          (STATE.doCfg && STATE.doCfg.dayPoints));
        if(!ok){ btn.disabled = false; btn.textContent = 'Approve'; alert('Could not save — try again.'); return; }
        paintShell();
      };
    });
    c.querySelectorAll('[data-sback]').forEach(btn => {
      btn.onclick = async () => {
        const log = myPendingDays().find(x => x.id === btn.dataset.sback);
        if(!log) return;
        const why = prompt(`Send ${log.name || 'this day'} back — what needs doing?`);
        if(why === null) return;
        btn.disabled = true; btn.textContent = 'Saving…';
        // Sent back the same way: whatever the stored day is holding comes
        // off, so two heads sending the same day back cannot debit it twice.
        const ok = await settleDoDay(log, 'returned', { returnedBy: ME.name,
          returnedAt: new Date().toISOString(), remark: (why || '').trim(),
          signedOff: false },
          (STATE.doCfg && STATE.doCfg.dayPoints));
        if(!ok){ btn.disabled = false; btn.textContent = 'Send back'; alert('Could not save — try again.'); return; }
        paintShell();
      };
    });
  }

  // Ticking records that this job was done today, by name and to the minute.
  // Nothing on a shipment moves because of it — the list is a reminder and a
  // record, not a second way to drive the board.
  async function confirmDoItems(items){
    if(!items.length) return true;
    await loadDoDay();
    const at = new Date().toISOString();
    for(const i of items){
      if(i.source === 'adhoc' && i.taskId){
        try{
          await db.collection(DOTASKS).doc(i.taskId).set(
            { open:false, doneBy: ME.name, doneAt: at }, { merge:true });
          const t = (STATE.doTasks||[]).find(x => x.id === i.taskId);
          if(t){ t.open = false; t.doneBy = ME.name; t.doneAt = at; }
        }catch(e){ console.error('Could not close the added task:', e); return false; }
      }
      STATE.doLog.done.push({ key:i.key, source:i.source, text:i.text, at, by: ME.name });
    }
    // A new job can land after a day has gone up, or even after it was
    // approved. The day reopens rather than pretending it was finished, and
    // has to be sent again.
    // Work ticked after the day went up is work the head never saw, so their
    // decision is stale and the day has to be sent again. This is deliberate
    // even when the list ends up complete: an approval covers what was on it
    // at the time, not whatever turns up afterwards.
    const stNow = doStatus(STATE.doLog);
    if(stNow === 'pending' || stNow === 'approved'){
      STATE.doLog.signedOff = false;
      STATE.doLog.status = 'open';
    }
    return await saveDoDay();
  }

  function fmtClock(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? '' : String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  // ============================================================
  // Balances — shipments whose first round of arrivals came up
  // short, sitting there until someone adds the balancing lot.
  // ============================================================
  // ============================================================
  // Outstanding — cargo that has arrived and cleared but hasn't all gone
  // out yet. Balances answers "what never came?"; this answers "what's
  // still sitting with us?".
  // ============================================================
  // Shipments closed before the shortfall marker existed carry no flag, so
  // the Outstanding query can't find them. Any time we have a shipment in
  // hand, correct its flag — opening one, or loading a day of completed
  // ones, quietly repairs it for good rather than only for this session.
  async function reconcileShortfallFlag(sh){
    if(!sh || sh.type !== 'import') return false;
    const should = outstandingTotal(sh) > 0;
    if(should === !!sh.hasShortfall) return false;
    sh.hasShortfall = should;
    try{
      await db.collection(SHIP).doc(sh.id).set(sh);
      _shortfallLoaded = false;   // let Outstanding re-query now it's findable
      return true;
    }catch(e){ console.error('Could not update shortfall flag:', e); return false; }
  }

  // Closed shipments aren't in the board's list, so fetch the flagged ones
  // once per session and merge them in.
  let _shortfallLoaded = false;
  async function ensureShortfallsLoaded(){
    if(_shortfallLoaded) return;
    try{
      const extra = await getShortfallShipments();
      const known = new Set(STATE.shipments.map(x=>x.id));
      extra.forEach(x => { if(!known.has(x.id)) STATE.shipments.push(x); });
      _shortfallLoaded = true;
    }catch(e){ console.error('Could not load closed shortfalls:', e); }
  }

  // Rows per page on the lists that grow: Outstanding, and the edited charges
  // under Charges. A list is worked through a screen at a time, and a few
  // hundred rows in one scroll is not a list anyone reads.
  const ROWS_PER_PAGE = 30;
  function paintOutstanding(c, list){
    const waitingAwbs = list.filter(s => deliveryOutstanding(s) > 0).length;
    const shortAwbs = list.filter(s => deliveryShortClosed(s) > 0).length;
    // A split shipment can be in both at once: one lot still running with
    // pieces undelivered, another closed short. It is one row on the tab
    // badge but appears under both filters, so the two counts overlap and
    // do not add up to the total. Printing the total first says which
    // number is the whole, and the note below says why the other two
    // exceed it.
    const bothAwbs = list.filter(s =>
      deliveryOutstanding(s) > 0 && deliveryShortClosed(s) > 0).length;
    if(list.length === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">0</div>
          <div class="l">waiting to go out</div></div></div>
        <div class="quiet"><div class="big">Nothing outstanding</div>
          <div class="sm">Everything that has arrived has been delivered.</div></div>`;
      return;
    }
    c.innerHTML = `
      <div class="counts">
        <div class="count"><div class="n">${list.length}</div><div class="l">AWBs outstanding</div></div>
        <div class="count"><div class="n warn">${waitingAwbs}</div><div class="l">still to go</div></div>
        <div class="count"><div class="n" style="color:var(--red);">${shortAwbs}</div><div class="l">closed short</div></div>
      </div>
      <div class="filters">
        <span class="${STATE.outFilter==='all'?'on':''}" data-of="all">All</span>
        <span class="${STATE.outFilter==='togo'?'on':''}" data-of="togo">Still to go</span>
        <span class="${STATE.outFilter==='short'?'on':''}" data-of="short">Closed short</span>
      </div>
      ${STATE.outFilter === 'short' ? (() => {
        // How long each shortfall has been sitting, as a second row of chips.
        // Only under Closed short, because a lot still working has not been
        // closed and so has no closing date to age from.
        const pool = list.filter(s => deliveryShortClosed(s) > 0);
        const countIn = k => pool.filter(s => shortAgeBand(s) === k).length;
        // Five chips have to fit a phone, so this row runs tighter than the
        // one above it and the count sits in its own muted span rather than
        // spelling out a second word.
        // The count sits in a nested span, which .filters span would
        // otherwise pad like a chip of its own — hence padding:0 on it.
        const chip = (key, label, n) => `<span class="${STATE.outAge===key?'on':''}" data-oa="${key}"
          style="padding:9px 8px;font-size:11.5px;">${label}<b
          style="padding:0;font-weight:700;opacity:.55;margin-left:4px;">${n}</b></span>`;
        return `<div class="filters" style="background:#223055;">
          ${chip('all', 'All', pool.length)}
          ${SHORT_AGE_BANDS.map(b => chip(b.key, b.label, countIn(b.key))).join('')}
        </div>`;
      })() : ''}
      <div style="padding:10px 12px 4px;">
        <input id="out-search" placeholder="Search AWB, HAWB or customer…" value="${escapeHtml(STATE.searchOutstanding)}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div style="margin:4px 16px 10px;font-size:12px;color:var(--muted);line-height:1.6;">
        Pieces that arrived but never went out — either still waiting, or left
        behind on a lot that was closed short. A consolidation is broken down
        by house bill.${bothAwbs ? ` <b style="color:var(--text);">${bothAwbs}</b>
        ${bothAwbs === 1 ? 'shipment has' : 'shipments have'} both, and so
        ${bothAwbs === 1 ? 'appears' : 'appear'} under either filter &mdash;
        which is why the two counts above come to more than ${list.length}.` : ''}
      </div>
      <div id="out-rows"></div>
      ${IS_ADMIN ? `<div style="margin:14px 12px 0;text-align:center;">
        <button class="lot-act ghost" id="out-scan" style="width:auto;padding:8px 14px;border-radius:9px;font-size:12px;">
          Scan older shipments for shortfalls</button>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">
          Only needed once — finds shipments closed short before this check existed.</div>
      </div>` : ''}
      <div style="height:20px;"></div>`;

    // Only the rows redraw while typing, so the search box keeps focus.
    function renderOutRows(){
      const q = STATE.searchOutstanding.trim().toLowerCase();
      const shown = list.filter(s => {
        if(STATE.outFilter === 'togo' && deliveryOutstanding(s) <= 0) return false;
        if(STATE.outFilter === 'short' && deliveryShortClosed(s) <= 0) return false;
        // The age band only narrows the closed-short list.
        if(STATE.outFilter === 'short' && STATE.outAge !== 'all'
          && shortAgeBand(s) !== STATE.outAge) return false;
        if(!q) return true;
        return String(s.awb||'').toLowerCase().includes(q) ||
          String(s.customer||'').toLowerCase().includes(q) ||
          hawbList(s).some(h => h.no.toLowerCase().includes(q));
      });
      // Oldest shortfall first under Closed short: the list is a chase list,
      // so what has been waiting longest is what should be read first.
      if(STATE.outFilter === 'short'){
        shown.sort((a,b) => String(shipClosedShortAt(a)||'').localeCompare(String(shipClosedShortAt(b)||'')));
      }
      const host = document.getElementById('out-rows');
      if(shown.length === 0){
        host.innerHTML = `<div class="empty">Nothing matches.</div>`;
        return;
      }
      // A long list is read a page at a time rather than scrolled through.
      // The page is clamped rather than trusted, since filtering or searching
      // can shrink the list under a page number that was fine a moment ago.
      const pages = Math.max(1, Math.ceil(shown.length / ROWS_PER_PAGE));
      if(STATE.outPage >= pages) STATE.outPage = pages - 1;
      if(STATE.outPage < 0) STATE.outPage = 0;
      const from = STATE.outPage * ROWS_PER_PAGE;
      const page = shown.slice(from, from + ROWS_PER_PAGE);
      host.innerHTML = outstandingRowsHtml(page)
        + (pages > 1 ? `
        <div style="display:flex;align-items:center;gap:8px;padding:12px;">
          <button class="lot-act ghost" id="out-prev" ${STATE.outPage === 0 ? 'disabled' : ''}
            style="flex:0 0 auto;width:auto;padding:9px 14px;border-radius:9px;${
              STATE.outPage === 0 ? 'opacity:.35;' : ''}">&larr; Prev</button>
          <div style="flex:1;text-align:center;font-size:12px;color:var(--muted);">
            ${from + 1}&ndash;${from + page.length} of ${shown.length}
            <div style="font-size:11px;margin-top:2px;">Page ${STATE.outPage + 1} of ${pages}</div>
          </div>
          <button class="lot-act ghost" id="out-next" ${STATE.outPage >= pages - 1 ? 'disabled' : ''}
            style="flex:0 0 auto;width:auto;padding:9px 14px;border-radius:9px;${
              STATE.outPage >= pages - 1 ? 'opacity:.35;' : ''}">Next &rarr;</button>
        </div>` : '');
      host.querySelectorAll('[data-goto]').forEach(el=> el.onclick = () => renderDetail(el.dataset.goto));
      const prev = document.getElementById('out-prev');
      const next = document.getElementById('out-next');
      // Back to the top of the list on a page turn, so the next page is read
      // from its first row rather than from wherever the last one was left.
      const turn = (d) => { STATE.outPage += d; renderOutRows(); host.scrollIntoView({ block:'start' }); };
      if(prev && STATE.outPage > 0) prev.onclick = () => turn(-1);
      if(next && STATE.outPage < pages - 1) next.onclick = () => turn(1);
    }

    function outstandingRowsHtml(list){
      return `
      ${list.map(s=>{
        const lots = s.lots||[];
        const arrived = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
        const out = deliveryOutstanding(s);
        const short = deliveryShortClosed(s);
        const delivered = arrived - out - short;
        const prog = hawbProgress(s).filter(h => h.remaining === null || h.remaining > 0);
        const oldest = lots.filter(l=>l.hasArrived && lotShortfall(l) > 0)
          .sort((a,b)=>String(a.stageAt).localeCompare(String(b.stageAt)))[0];
        const age = oldest ? ageStr(oldest.stageAt) : '';
        // When it was closed short, named on the row so the age band it fell
        // into can be checked against the row rather than taken on trust.
        const shortAt = short > 0 ? shipClosedShortAt(s) : null;
        const shortDays = daysSince(shortAt);
        return `
        <div class="row" style="cursor:default;">
          <div class="row-top" style="cursor:pointer;" data-goto="${s.id}">
            <span class="awb">${escapeHtml(s.awb)}<span class="kind imp">IMP</span>
              ${isK1Shipment(s)?`<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">K1</span>`:''}${s.hasOpenSurvey?`<span class="kind" style="background:rgba(214,69,69,.12);color:var(--red);">SURVEY</span>`:s.hasSurvey?`<span class="kind" style="background:rgba(31,157,107,.12);color:var(--green);">SURVEY</span>`:''}
              ${lots.length>1?`<span class="lots-tag">${lots.length} LOTS</span>`:''}</span>
            <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
          </div>
          <div class="row-bot" style="cursor:pointer;" data-goto="${s.id}">
            <div><div class="lead">${delivered} of ${arrived} delivered${out?` &middot;
              <span style="color:var(--amber-dk);">${out} still to go</span>`:''}${short?` &middot;
              <span style="color:var(--red);">${short} ${
                // Pieces the terminal manifested and never handed over are a
                // claim, not a delivery still to make. Named apart here so a
                // glance down this list tells the two of them apart.
                lots.some(l => l.notReceived && lotShortfall(l) > 0) ? 'not received' : 'closed short'
              }</span>`:''}</div>
              <div class="party">${escapeHtml(s.customer||'')}${shortAt ? `
                <span style="color:var(--red);font-weight:600;"> &middot; closed ${
                  shortDays === 0 ? 'today' : `${shortDays}d ago`} &middot; ${escapeHtml(dayOf(shortAt))}</span>` : ''}</div></div>
            <span class="age warn">${age}</span>
          </div>
          ${prog.length ? `<div style="margin-top:8px;">${prog.map(h=>`
            <div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;">
              <span style="font-family:'IBM Plex Mono',monospace;color:var(--ink);">${escapeHtml(h.no)}</span>
              <span style="color:var(--muted);">${h.delivered}${h.pcs!=null?' of '+h.pcs:''} delivered</span>
            </div>`).join('')}</div>` : ''}
        </div>`;
      }).join('')}`;
    }

    renderOutRows();
    // Any change to what is being listed starts again at the first page —
    // page 3 of the old list means nothing in the new one.
    c.querySelectorAll('.filters span[data-of]').forEach(el=> el.onclick = () => {
      STATE.outFilter = el.dataset.of; STATE.outPage = 0;
      if(STATE.outFilter !== 'short') STATE.outAge = 'all';
      paintShell();
    });
    c.querySelectorAll('.filters span[data-oa]').forEach(el=> el.onclick = () => {
      STATE.outAge = el.dataset.oa; STATE.outPage = 0; paintShell();
    });
    const outSearch = document.getElementById('out-search');
    outSearch.oninput = () => {
      STATE.searchOutstanding = outSearch.value; STATE.outPage = 0; renderOutRows();
    };

    const scanBtn = document.getElementById('out-scan');
    if(scanBtn) scanBtn.onclick = async () => {
      if(!confirm('Check every closed shipment for undelivered pieces? This reads them all once and marks any it finds.')) return;
      scanBtn.disabled = true; scanBtn.textContent = 'Scanning…';
      try{
        const snap = await withTimeout(db.collection(SHIP).where('closed','==', true).get(), 30000, 'Scanning shipments');
        let found = 0;
        for(const d of snap.docs){
          const sh = d.data();
          const short = outstandingTotal(sh) > 0;
          if(short !== !!sh.hasShortfall){
            sh.hasShortfall = short;
            await db.collection(SHIP).doc(sh.id).set(sh);
          }
          if(short){
            found++;
            if(!STATE.shipments.some(x => x.id === sh.id)) STATE.shipments.push(sh);
          }
        }
        alert(found ? `Found ${found} closed shipment${found>1?'s':''} with pieces unaccounted for.` : 'No shortfalls found in closed shipments.');
        paintShell();
      }catch(e){
        scanBtn.disabled = false; scanBtn.textContent = 'Scan older shipments for shortfalls';
        alert('Scan failed: ' + (e.message || e));
      }
    };
  }

  function paintBalances(c, list){
    if(list.length === 0){
      c.innerHTML = `
        <div class="counts"><div class="count"><div class="n">0</div>
          <div class="l">awaiting a balance lot</div></div></div>
        <div class="quiet"><div class="big">Nothing outstanding</div>
          <div class="sm">No import has arrived short of what was booked right now.</div></div>`;
      return;
    }
    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n warn">${list.length}</div>
        <div class="l">awaiting a balance lot</div></div></div>
      <div style="margin:0 16px 12px;font-size:12px;color:var(--muted);line-height:1.6;">
        These arrived short of what was booked on the AWB. Add the balancing lot once
        the rest lands, or open the shipment for the full picture.
      </div>
      ${list.map(s=>{
        const lots = s.lots||[];
        const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
        const balance = (s.pcs||0) - totalHere;
        const lastArrived = lots.filter(l=>l.hasArrived).sort((a,b)=>String(b.stageAt).localeCompare(String(a.stageAt)))[0];
        const age = lastArrived ? ageStr(lastArrived.arrivedAt||lastArrived.stageAt) : '';
        // On a consolidation the balance belongs to particular house bills,
        // so it is named here rather than shown as one figure on the master —
        // and the lot that clears it is raised from under that bill, inside
        // the shipment, not from a button that could only guess which.
        const shortHawbs = hawbList(s).filter(h => hawbArrived(s, h.no) && (hawbBalance(s, h) || 0) > 0);
        return `
        <div class="row" style="cursor:default;">
          <div class="row-top" style="cursor:pointer;" data-goto="${s.id}">
            <span class="awb">${escapeHtml(s.awb)}<span class="kind imp">IMP</span>
              ${lots.length>1?`<span class="lots-tag">${lots.length} LOTS</span>`:''}</span>
            <span class="route">${escapeHtml(s.from||'')}&rarr;${escapeHtml(s.to||'')}</span>
          </div>
          <div class="row-bot" style="cursor:pointer;" data-goto="${s.id}">
            <div><div class="lead">${totalHere} of ${s.pcs} arrived &middot;
              <span style="color:var(--amber-dk);">${balance} balance</span></div>
              <div class="party">${escapeHtml(s.customer||'')}</div></div>
            <span class="age warn">${age}</span>
          </div>
          ${shortHawbs.length ? `<div style="margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.7;">
            ${shortHawbs.map(h => `<div><span style="font-family:'IBM Plex Mono',monospace;color:var(--ink);
              font-weight:600;">${escapeHtml(h.no)}</span>
              &middot; ${hawbArrivedPcs(s, h)} of ${h.pcs} here &middot;
              <span style="color:var(--amber-dk);font-weight:700;">${hawbBalance(s, h)} balance</span></div>`).join('')}
          </div>` : ''}
          ${CAN_EDIT ? (shortHawbs.length
            ? `<button class="lot-act ghost" style="margin-top:10px;border-radius:9px;"
                data-goto="${s.id}">Open to add the balance lot${shortHawbs.length > 1 ? 's' : ''}</button>`
            : `<button class="lot-act ghost" style="margin-top:10px;border-radius:9px;"
                data-addbal="${s.id}">+ Add lot for the remaining ${balance} pcs</button>`) : ''}
        </div>`;
      }).join('')}
      <div style="height:20px;"></div>`;
    c.querySelectorAll('[data-goto]').forEach(el=>{
      el.onclick = () => renderDetail(el.dataset.goto);
    });
    c.querySelectorAll('[data-addbal]').forEach(btn=>{
      btn.onclick = () => {
        const s = STATE.shipments.find(x=>x.id===btn.dataset.addbal);
        if(!s) return;
        const lots = s.lots||[];
        const totalHere = lots.filter(l=>l.hasArrived).reduce((a,l)=>a+(l.pcsArrived||0),0);
        const balance = (s.pcs||0) - totalHere;
        STATE.detailId = s.id;
        renderRecordArrival(s, null, balance);
      };
    });
  }

  // ============================================================
  // Completed — closed shipments are excluded everywhere else on
  // purpose (board, alerts, balances), so this is the one place they
  // can still be found: to check what happened, view its photos, or
  // confirm a closure after the fact. Read only when this tab is
  // opened, and only once per session.
  // ============================================================
  // Which day the Completed tab is showing, and which days have already been
  // fetched this session — revisiting a day costs nothing.
  let _completedDate = null;
  const _closedLoadedDates = new Set();
  async function paintCompleted(c){
    if(!_completedDate) _completedDate = todayStr();
    const day = _completedDate;
    if(!_closedLoadedDates.has(day)){
      c.innerHTML = `<div class="empty">Loading completed shipments…</div>`;
      let closed;
      try{ closed = await getClosedShipmentsOn(day); }
      catch(e){ renderLoadError(e, () => { paintShell(); }); return; }
      // Heal shipments wrongly completed by the old closing rule: an import
      // closed while part of its MAWB never arrived, with no deliberate
      // write-off, could only have got there through that bug. Reopen it so
      // it goes back on the board and the balance can still be received.
      const wronglyClosed = closed.filter(x => x.type === 'import' && !x.balanceWrittenOff && arrivalBalance(x) > 0);
      for(const x of wronglyClosed){
        x.closed = false; x.closedDate = null;
        logActivity(x, `Reopened — ${arrivalBalance(x)} pcs on the MAWB haven't arrived yet`);
        try{ await saveShipment(x); }catch(e){ console.error('Could not reopen', x.awb, e); }
      }
      // Merge in rather than replace — the board, alerts and balances all
      // already exclude anything closed, so these only surface here.
      const idx = {};
      STATE.shipments.forEach((s,i)=>{ idx[s.id] = i; });
      closed.forEach(s => {
        if(idx[s.id] !== undefined) STATE.shipments[idx[s.id]] = s;
        else STATE.shipments.push(s);
      });
      // Free repair pass: these closed shipments are already loaded, so fix
      // any missing shortfall flags while we have them.
      closed.forEach(x => { reconcileShortfallFlag(x); });
      _closedLoadedDates.add(day);
    }
    const list = STATE.shipments.filter(s => s.closed && s.closedDate === day)
      .sort((a,b)=> String(a.awb).localeCompare(String(b.awb)));
    const isToday = day === todayStr();
    const niceDay = new Date(day + 'T00:00:00').toLocaleDateString(undefined,
      { weekday:'short', day:'numeric', month:'short', year:'numeric' });

    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n">${list.length}</div>
        <div class="l">completed ${isToday ? 'today' : 'on ' + escapeHtml(niceDay)}</div></div></div>
      <div style="display:flex;gap:8px;align-items:center;margin:12px 12px 4px;">
        <button class="lot-act ghost" id="cp-prev" style="width:auto;padding:9px 12px;border-radius:9px;">&larr;</button>
        <input type="date" id="cp-date" value="${day}" max="${todayStr()}"
          style="flex:1;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        <button class="lot-act ghost" id="cp-next" ${isToday ? 'disabled' : ''}
          style="width:auto;padding:9px 12px;border-radius:9px;${isToday ? 'opacity:.4;cursor:default;' : ''}">&rarr;</button>
      </div>
      ${!isToday ? `<div style="margin:0 12px 6px;text-align:right;">
        <span id="cp-today" style="font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;">Back to today</span></div>` : ''}
      <div style="padding:6px 12px 4px;">
        <input id="cp-search" placeholder="Search AWB, HAWB or customer…" value="${escapeHtml(STATE.searchCompleted)}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="cp-rows"></div>
      <div style="height:20px;"></div>`;

    // Same grouped listing the All tab uses — AWB, type, K1 tag, creation
    // date and customer, clustered by status — with its own search box.
    function renderCompletedRows(){
      const q = STATE.searchCompleted.trim().toLowerCase();
      const shown = !q ? list : list.filter(s =>
        String(s.awb||'').toLowerCase().includes(q) ||
        String(s.customer||'').toLowerCase().includes(q) ||
        hawbList(s).some(h => h.no.toLowerCase().includes(q)));
      const host = document.getElementById('cp-rows');
      host.innerHTML = shown.length
        ? boardListingHtml(shown)
        : `<div class="empty">${q ? 'Nothing matches that search.'
            : `Nothing was completed ${isToday ? 'today' : 'on this day'}.`}</div>`;
      host.querySelectorAll('[data-open]').forEach(el=> el.onclick = () => renderDetail(el.dataset.open));
    }
    renderCompletedRows();
    const cpSearch = document.getElementById('cp-search');
    cpSearch.oninput = () => { STATE.searchCompleted = cpSearch.value; renderCompletedRows(); };

    function shiftDay(delta){
      const d = new Date(day + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      const next = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(next > todayStr()) return;
      _completedDate = next;
      paintCompleted(c);
    }
    document.getElementById('cp-prev').onclick = () => shiftDay(-1);
    const nextBtn = document.getElementById('cp-next');
    if(!isToday) nextBtn.onclick = () => shiftDay(1);
    document.getElementById('cp-date').onchange = (e) => {
      const v = e.target.value;
      if(!v || v > todayStr()) return;
      _completedDate = v;
      paintCompleted(c);
    };
    const todayLink = document.getElementById('cp-today');
    if(todayLink) todayLink.onclick = () => { _completedDate = todayStr(); paintCompleted(c); };
  }

  // ============================================================
  // Remarks — every remark written on a chosen day, across all
  // shipments. Each remark is indexed as its own small record when it's
  // written, so a day costs one query rather than reading every
  // shipment to find the notes inside them.
  // ============================================================
  let _remarksDate = null;
  const _remarksCache = {};
  async function paintRemarks(c){
    if(!_remarksDate) _remarksDate = todayStr();
    const day = _remarksDate;

    if(!_remarksCache[day]){
      c.innerHTML = `<div class="empty">Loading remarks…</div>`;
      try{ _remarksCache[day] = await getRemarksOn(day); }
      catch(e){ renderLoadError(e, () => paintShell()); return; }
    }
    const all = _remarksCache[day];
    const isToday = day === todayStr();
    const niceDay = new Date(day + 'T00:00:00').toLocaleDateString(undefined,
      { weekday:'short', day:'numeric', month:'short', year:'numeric' });

    c.innerHTML = `
      <div class="counts"><div class="count"><div class="n">${all.length}</div>
        <div class="l">remark${all.length===1?'':'s'} ${isToday ? 'today' : 'on ' + escapeHtml(niceDay)}</div></div></div>
      <div style="display:flex;gap:8px;align-items:center;margin:12px 12px 4px;">
        <button class="lot-act ghost" id="rm-prev" style="width:auto;padding:9px 12px;border-radius:9px;">&larr;</button>
        <input type="date" id="rm-date" value="${day}" max="${todayStr()}"
          style="flex:1;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;">
        <button class="lot-act ghost" id="rm-next" ${isToday ? 'disabled' : ''}
          style="width:auto;padding:9px 12px;border-radius:9px;${isToday ? 'opacity:.4;cursor:default;' : ''}">&rarr;</button>
      </div>
      ${!isToday ? `<div style="margin:0 12px 6px;text-align:right;">
        <span id="rm-today" style="font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;">Back to today</span></div>` : ''}
      <div style="padding:6px 12px 4px;">
        <input id="rm-search" placeholder="Search AWB, customer, author or text…" value="${escapeHtml(STATE.searchRemarks)}"
          style="width:100%;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;">
      </div>
      <div id="rm-rows"></div>
      <div style="height:20px;"></div>`;

    function renderRemarkRows(){
      const q = STATE.searchRemarks.trim().toLowerCase();
      const shown = !q ? all : all.filter(r =>
        String(r.awb||'').toLowerCase().includes(q) ||
        String(r.customer||'').toLowerCase().includes(q) ||
        String(r.by||'').toLowerCase().includes(q) ||
        String(r.text||'').toLowerCase().includes(q));
