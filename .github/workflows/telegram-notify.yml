name: Telegram Notify — Exprexa Performance

on:
  schedule:
    # Runs every 30 minutes. GitHub's cron uses UTC — Malaysia is UTC+8, so
    # this covers 9:00am to 8:30pm Malaysia time, plus one final check
    # exactly at 9:00pm to line up with the daily task deadline. Adjust the
    # hours below if you want a different window or frequency.
    - cron: '*/30 1-12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin node-fetch@2

      - name: Run notification check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-telegram.js
